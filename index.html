const subjects=['Ética Profissional','Direito Constitucional','Direito Civil','Processo Civil','Direito Penal','Processo Penal','Direito Administrativo','Direito Tributário','Direito do Trabalho','Processo do Trabalho','Direito Empresarial','Direitos Humanos','Direito Ambiental','Direito Internacional','Direito do Consumidor','ECA','Filosofia do Direito','Direito Eleitoral','Direito Financeiro','Direito Previdenciário'];
const qs=[{id:1,s:1,q:'Segundo a Constituição Federal, qual é o prazo de validade de um concurso público?',a:['Até um ano, sem prorrogação','Até dois anos, prorrogável uma vez por igual período','Sempre quatro anos','Indeterminado'],ok:1,e:'O art. 37, III, da Constituição prevê validade de até dois anos, prorrogável uma vez por igual período.',src:'Constituição Federal, art. 37, III',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'},{id:2,s:2,q:'Em regra, em qual idade cessa a menoridade civil?',a:['16 anos','21 anos','18 anos completos','25 anos'],ok:2,e:'O art. 5º do Código Civil prevê que a menoridade cessa aos dezoito anos completos, ressalvadas as hipóteses legais de emancipação.',src:'Código Civil, art. 5º',url:'https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm'},{id:3,s:4,q:'Qual princípio impede que uma conduta seja considerada crime sem lei anterior que a defina?',a:['Legalidade penal','Publicidade','Eficiência','Contraditório'],ok:0,e:'O art. 1º do Código Penal estabelece que não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal.',src:'Código Penal, art. 1º',url:'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'},{id:4,s:0,q:'Qual instituição é indispensável à administração da justiça nos termos do art. 133 da Constituição?',a:['A advocacia','O registro de imóveis','A junta comercial','O tribunal de contas'],ok:0,e:'A Constituição afirma a indispensabilidade do advogado à administração da justiça, nos limites da lei.',src:'Constituição Federal, art. 133',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'}];
const ethicsModules=[{"t":"Atividade da advocacia e mandato","ref":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Atividades privativas","Distinga representação processual de consultoria, assessoria e direção jurídicas. O bacharelado não substitui a inscrição profissional. A impetração de habeas corpus é expressamente excluída do rol de atividades privativas. Não generalize a exigência de advogado para todos os procedimentos: há exceções legais e constitucionais."],["Mandato e urgência","A procuração demonstra os poderes recebidos. Quando a urgência impede sua apresentação imediata, o profissional pode agir e regularizar a representação no prazo legal de quinze dias, prorrogável por igual período. Na renúncia, a assistência permanece por dez dias após a notificação, salvo substituição anterior."],["Aplicação prática","Em uma questão sobre prazo processual iminente, identifique urgência, regularização e prova da comunicação ao cliente. Renunciar não equivale a abandonar o processo. Compare o prazo de apresentação da procuração com o período de continuidade da representação."]],"map":["Atuação privativa → inscrição","Habeas corpus → exceção","Urgência → 15 + 15 dias","Renúncia → notificação + 10 dias"]},{"t":"Inscrição, inscrição suplementar e licenciamento","ref":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Ingresso profissional","A inscrição exige os requisitos do art. 8º, entre eles habilitação acadêmica, aprovação no Exame de Ordem, idoneidade moral, capacidade civil e ausência de atividade incompatível. O compromisso perante o Conselho também integra o procedimento."],["Inscrição principal e suplementar","A principal relaciona-se ao domicílio profissional. A atuação habitual em outra unidade federativa exige inscrição suplementar. Para esse efeito, habitualidade corresponde à intervenção judicial em mais de cinco causas por ano no território de outro Conselho."],["Licenciamento ou cancelamento","Licenciamento é afastamento temporário nas hipóteses legais; cancelamento encerra a inscrição. A atividade incompatível temporária é exemplo de licenciamento; incompatibilidade definitiva é hipótese de cancelamento. O número anterior não é restabelecido automaticamente em nova inscrição."]],"map":["Inscrição → requisitos cumulativos","Principal → domicílio profissional","Suplementar → mais de 5 causas/ano","Licença temporária ≠ cancelamento"]},{"t":"Direitos e prerrogativas profissionais","ref":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Independência e respeito","As funções de magistratura, Ministério Público e advocacia têm atribuições distintas, sem subordinação hierárquica entre elas. Prerrogativas protegem a atuação profissional e o direito de defesa, não constituindo imunidade para ilícitos."],["Acesso a investigações","O advogado pode consultar elementos documentados de investigação nas condições legais, inclusive sem procuração quando não há sigilo. Em autos sigilosos, exige-se mandato. Diligências em andamento e ainda não documentadas podem ter acesso delimitado nos termos do Estatuto."],["Inviolabilidade","O escritório e os instrumentos de trabalho recebem proteção vinculada à atividade profissional. Não é proteção absoluta: medidas judiciais excepcionais exigem os pressupostos e salvaguardas legais. Em provas, desconfie de alternativas que usem 'sempre' ou 'nunca' sem ressalvas."]],"map":["Prerrogativa → defesa","Sem sigilo → acesso nos limites legais","Sigilo → procuração","Inviolabilidade → proteção qualificada"]},{"t":"Sociedades de advogados e associação","ref":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Formas de organização","A advocacia admite sociedade de advogados e sociedade unipessoal. O registro constitutivo no Conselho Seccional competente confere personalidade jurídica. A finalidade é a prestação de serviços advocatícios, e não a organização de uma atividade mercantil genérica."],["Limites societários","Não se admite sócio que não seja advogado inscrito ou que esteja totalmente proibido de advogar, nem denominação de fantasia nas sociedades abrangidas pelo Estatuto. A organização deve respeitar os conflitos de interesse e as limitações territoriais de participação societária."],["Responsabilidade e associação","Além da sociedade, o sócio ou titular responde subsidiária e ilimitadamente por danos causados aos clientes no exercício da advocacia, sem prejuízo da responsabilidade disciplinar. Associação profissional sem vínculo de emprego é possível, mas deve atender aos requisitos legais; o nome do contrato não afasta uma relação empregatícia efetivamente caracterizada."]],"map":["Registro → Conselho Seccional","Objeto → advocacia","Sócio → advogado habilitado","Danos ao cliente → responsabilidade subsidiária"]},{"t":"Honorários advocatícios","ref":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Três modalidades","Honorários convencionados decorrem do acordo profissional; arbitrados são estabelecidos judicialmente nas hipóteses pertinentes; sucumbenciais resultam da derrota processual da parte adversa. Diferencie origem do crédito e titularidade. A sucumbência pertence ao advogado."],["Contratação e cobrança","A clareza do contrato reduz conflitos: delimite serviços, forma de remuneração e hipóteses de encerramento. A ação de cobrança tem prazo prescricional de cinco anos, com marcos iniciais definidos no art. 25. Não trate todos os casos como se contassem da assinatura do contrato."],["Substabelecimento","O substabelecimento com reserva mantém poderes no profissional originário. Em regra, o substabelecido não cobra honorários sem a intervenção do substabelecente. O art. 26 prevê exceção quando possui contrato celebrado com o cliente."]],"map":["Convencionados → contrato","Arbitrados → decisão judicial","Sucumbência → advogado","Cobrança → 5 anos"]},{"t":"Incompatibilidades e impedimentos","ref":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Distinção fundamental","A incompatibilidade exclui totalmente o exercício da advocacia enquanto presente a condição. O impedimento restringe determinadas atuações, sem necessariamente afastar o profissional de toda a advocacia. Primeiro classifique a atividade, depois identifique o alcance da restrição."],["Atividades incompatíveis","O Estatuto relaciona categorias como membros do Judiciário e titulares de serviços notariais e registrais. Há especificidades e decisões judiciais relevantes para certas categorias; consulte o texto consolidado e os precedentes aplicáveis antes de estender uma regra."],["Impedimento do servidor","O servidor público, quando abrangido pelo art. 30, I, não pode advogar contra a Fazenda Pública que o remunera ou à qual está vinculada a entidade empregadora. A exceção legal dos docentes de cursos jurídicos e as hipóteses de incompatibilidade merecem atenção."]],"map":["Incompatibilidade → proibição total","Impedimento → proibição parcial","Cargo temporário incompatível → licença","Servidor → observar Fazenda vinculada"]},{"t":"Relação com o cliente e conflitos de interesse","ref":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015","lessons":[["Confiança e informação","Explique riscos relevantes, alternativas e limites da estratégia profissional. A independência técnica não elimina o dever de informar. A contratação não é uma promessa de resultado."],["Conflitos de interesse","Profissionais da mesma sociedade não representam interesses opostos. Se um conflito superveniente não puder ser resolvido, é preciso escolher a representação a manter, renunciar às demais e preservar informações confidenciais."],["Encerramento e defesa","A revogação pelo cliente não elimina automaticamente os honorários devidos pelo trabalho. A defesa criminal é função de garantia processual, independentemente da opinião pessoal do advogado sobre a culpa. O profissional não deve deixar o cliente desamparado."]],"map":["Informar riscos → confiança","Interesses opostos → conflito","Renúncia → preservar sigilo","Defesa → garantias processuais"]},{"t":"Sigilo profissional e publicidade jurídica","ref":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015","lessons":[["Confidencialidade","O sigilo é dever profissional independentemente de pedido do cliente. Comunicações advogado-cliente são presumidamente confidenciais. A obrigação abrange também fatos conhecidos no exercício de funções da Ordem."],["Exceções","Circunstâncias excepcionais podem justificar a revelação, como defesa própria ou grave ameaça à vida e à honra. A análise exige necessidade e proporcionalidade. O advogado não é obrigado a depor sobre fatos sujeitos ao sigilo."],["Marketing jurídico","A publicidade é informativa, discreta e sóbria. O conteúdo jurídico pode ser divulgado em redes sociais e por meios permitidos, inclusive anúncios nas condições regulamentares. Captação indevida, mercantilização e promessa de resultado são incompatíveis com esse regime. Consulte também o Provimento 205/2021 e alterações vigentes."]],"map":["Sigilo → dever independente de pedido","Justa causa → exceção","Publicidade → informação","Captação e promessa → vedadas"],"extraUrl":"https://www.oab.org.br/leisnormas/legislacao/provimentos/205-2021"},{"t":"Infrações e sanções disciplinares","ref":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Identificação da infração","A questão exige enquadramento da conduta no Estatuto e identificação da consequência aplicável. Diferencie a infração disciplinar da responsabilidade civil e penal: podem coexistir. A falta de prestação de contas e a captação de causas, por exemplo, não são categorias equivalentes."],["Sistema de sanções","As quatro espécies são censura, suspensão, exclusão e multa. A censura pode ser convertida em advertência reservada quando presentes as condições legais. A suspensão restringe temporariamente o exercício profissional em todo o território nacional. A exclusão demanda requisitos próprios."],["Individualização e prescrição","Analise agravantes, atenuantes, reincidência e a natureza da conduta. A pretensão punitiva disciplinar prescreve em cinco anos contados da constatação oficial do fato, observadas interrupções e a prescrição intercorrente prevista no Estatuto. Não confunda prescrição disciplinar com cobrança de honorários."]],"map":["Conduta → art. 34","Sanção → arts. 35–39","Exclusão → quórum qualificado","Prescrição → art. 43"]},{"t":"Organização da OAB e processo disciplinar","ref":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Estrutura institucional","A OAB exerce serviço público com personalidade jurídica e forma federativa. Integram sua estrutura o Conselho Federal, os Conselhos Seccionais, as Subseções e as Caixas de Assistência. A Subseção é parte autônoma da Seccional, não um Conselho Federal local."],["Competência disciplinar","Em regra, o Conselho Seccional do território da infração exerce a competência disciplinar, com ressalva legal para faltas cometidas perante o Conselho Federal. O Tribunal de Ética e Disciplina exerce funções de julgamento conforme o Estatuto e os regulamentos."],["Garantias processuais","O processo pode começar de ofício ou por representação. O sigilo durante a tramitação protege as partes, sem eliminar acesso legal dos interessados e defensores. Observe contraditório, defesa, competência e recursos próprios. O sigilo não equivale a ausência de controle."]],"map":["Conselho Federal → âmbito nacional","Seccional → território","Subseção → parte autônoma","Disciplina → competência e defesa"]}];const ethicsQuestions=/*BANK:ethicsQuestions*/null;const constitutionalModules=[{"t":"Teoria constitucional e poder constituinte","ref":"CF, arts. 1º a 4º e 60","lessons":[["Fundamentos e objetivos","Os fundamentos definem bases da ordem constitucional; os objetivos indicam fins a perseguir. Cidadania, dignidade e pluralismo pertencem ao primeiro grupo. Reduzir desigualdades é objetivo. Identifique a categoria antes de responder; não confunda princípios das relações internacionais com objetivos internos."],["Poder constituinte","O poder originário institui uma nova ordem; o derivado atua dentro da Constituição, sujeito a limites. A reforma constitucional exige procedimento agravado. A proposta deve ser aprovada em dois turnos em cada Casa do Congresso, por três quintos dos respectivos membros."],["Limites à reforma","O núcleo protegido pelo art. 60, § 4º, impede propostas tendentes a abolir federação, voto direto, secreto, universal e periódico, separação de poderes e direitos e garantias individuais. Não se pode emendar a Constituição durante intervenção federal, estado de defesa ou estado de sítio."]],"map":["Fundamentos ≠ objetivos","Reforma → 2 turnos por Casa","Aprovação → 3/5 dos membros","Cláusulas pétreas → proteção contra abolição"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direitos e garantias fundamentais","ref":"CF, art. 5º","lessons":[["Liberdades e igualdade","A igualdade constitucional veda discriminações arbitrárias e permite distinções justificadas. A liberdade de manifestação não torna lícitas todas as condutas; responsabilização ulterior e tutela de outros direitos podem ocorrer. A proibição de anonimato não impede por si só mecanismos lícitos de proteção de identidade."],["Casa e comunicações","A proteção do domicílio abrange espaços privados nos limites jurídicos aplicáveis. Sem consentimento, entrada é admitida em flagrante, desastre, socorro ou, durante o dia, por ordem judicial. Diferencie essas hipóteses da interceptação de comunicações telefônicas, que tem requisitos próprios."],["Garantias processuais","Devido processo, contraditório, ampla defesa e presunção de inocência limitam o poder estatal. Provas ilícitas são inadmissíveis. Em questões, diferencie prisão cautelar justificada de antecipação indevida de pena e considere as particularidades da jurisprudência aplicável."]],"map":["Igualdade → justificativa de distinções","Domicílio → exceções delimitadas","Defesa → contraditório","Prova ilícita → inadmissibilidade"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Remédios constitucionais","ref":"CF, art. 5º, LXVIII a LXXIII","lessons":[["Habeas corpus e habeas data","Habeas corpus tutela a liberdade de locomoção diante de ilegalidade ou abuso. Habeas data permite acessar ou retificar dados pessoais em registros governamentais ou de caráter público, observados os requisitos legais. Não é instrumento genérico de acesso a dados de terceiros."],["Mandado de segurança e injunção","Mandado de segurança protege direito líquido e certo não amparado por habeas corpus ou habeas data, contra ilegalidade ou abuso de autoridade. A prova deve ser pré-constituída. Mandado de injunção enfrenta omissão normativa que inviabiliza o exercício de direitos e prerrogativas constitucionais pertinentes."],["Ação popular","A cidadania legitima a ação popular para invalidar ato lesivo ao patrimônio público, moralidade administrativa, meio ambiente ou patrimônio histórico e cultural. A isenção de custas e sucumbência ressalva má-fé comprovada. Distinga o cidadão dos legitimados de outras ações coletivas."]],"map":["HC → locomoção","HD → dados pessoais","MS → direito líquido e certo","MI → omissão normativa"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Nacionalidade e direitos políticos","ref":"CF, arts. 12 a 17","lessons":[["Nacionalidade","Diferencie brasileiros natos e naturalizados pelas hipóteses constitucionais. Certos cargos são reservados a natos, como Presidente da República e Ministro do STF. Não confunda nacionalidade com cidadania eleitoral. A perda de nacionalidade deve ser estudada conforme a redação constitucional atual, inclusive EC 131/2023."],["Alistamento e voto","O voto é obrigatório para alfabetizados maiores de dezoito anos, ressalvado o regime facultativo para maiores de setenta; também é facultativo para analfabetos e pessoas de dezesseis a dezoito anos. Estrangeiros e conscritos durante o serviço militar obrigatório não podem se alistar."],["Elegibilidade","Nacionalidade, direitos políticos, alistamento, domicílio eleitoral, filiação e idade mínima compõem os requisitos constitucionais. Analfabetos podem votar, mas são inelegíveis. Reeleição e inelegibilidades seguem regras específicas; identifique o cargo e a situação familiar ou funcional."]],"map":["Nacionalidade ≠ elegibilidade","Voto facultativo → hipóteses do art. 14","Analfabeto → inelegível","STF → cargo privativo de nato"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Federação e repartição de competências","ref":"CF, arts. 18 a 36","lessons":[["Entes federativos","União, Estados, Distrito Federal e Municípios possuem autonomia nos termos constitucionais. A soberania pertence à República Federativa do Brasil. O Distrito Federal acumula competências legislativas estaduais e municipais e não se divide em municípios."],["Competências legislativas","A União tem competências privativas enumeradas no art. 22; lei complementar pode autorizar Estados a legislar sobre questões específicas dessas matérias. Em competência concorrente, a União estabelece normas gerais, e os Estados suplementam. Na falta de norma geral federal, podem exercer competência plena nas condições constitucionais."],["Competências comuns e locais","Competência administrativa comum não equivale a competência legislativa concorrente. Municípios legislam sobre interesse local e suplementam legislação federal e estadual quando couber. A intervenção é excepcional e exige hipótese constitucional específica."]],"map":["Federação → autonomia","Art. 22 → competência privativa","Art. 24 → concorrente","Art. 30 → interesse local"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Administração pública constitucional","ref":"CF, arts. 37 a 41","lessons":[["Princípios administrativos","Legalidade, impessoalidade, moralidade, publicidade e eficiência orientam a administração direta e indireta. Publicidade não elimina proteção legal de informações sigilosas. Impessoalidade impede promoção pessoal em publicidade institucional."],["Ingresso e estabilidade","A investidura em cargo ou emprego público depende, em regra, de concurso; cargos em comissão legalmente definidos admitem livre nomeação e exoneração. Estabilidade é instituto distinto da aprovação: aplica-se aos servidores nomeados para cargo efetivo por concurso após três anos de efetivo exercício, com avaliação especial de desempenho."],["Responsabilidade estatal","Pessoas jurídicas de direito público e prestadoras de serviço público de direito privado respondem por danos causados por seus agentes nessa qualidade, conforme art. 37, § 6º. A ação regressiva exige dolo ou culpa. Identifique nexo causal e circunstâncias concretas; não trate toda omissão como caso idêntico."]],"map":["LIMPE → princípios","Concurso → regra","Estabilidade → requisitos do art. 41","Regresso → dolo ou culpa"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Poder Legislativo e processo legislativo","ref":"CF, arts. 44 a 69","lessons":[["Estrutura e funções","Congresso Nacional reúne Câmara e Senado; a Câmara representa o povo, e o Senado representa Estados e Distrito Federal. Fiscalização e produção legislativa são funções centrais. CPIs têm poderes de investigação próprios de autoridades judiciais, mas não todos os poderes de um juiz."],["Espécies normativas","Lei ordinária e complementar possuem regimes de aprovação distintos; a lei complementar exige maioria absoluta. Emendas não passam por sanção presidencial. Iniciativa reservada, deliberação, sanção ou veto e promulgação dependem da espécie normativa."],["Medidas provisórias","São editadas pelo Presidente em situações de relevância e urgência, com força de lei e submissão ao Congresso. O prazo geral é de sessenta dias, prorrogável uma vez por igual período, observadas regras constitucionais. Há matérias vedadas, como direito penal e processual penal."]],"map":["Câmara → povo","Senado → Estados e DF","LC → maioria absoluta","MP → urgência e relevância"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Executivo e responsabilidade constitucional","ref":"CF, arts. 76 a 91","lessons":[["Presidencialismo","O Presidente acumula funções de chefia de Estado e de governo. Ministros auxiliam o Executivo. Competências privativas estão no art. 84; apenas hipóteses constitucionalmente indicadas podem ser delegadas nos limites ali previstos."],["Substituição e sucessão","O Vice substitui o Presidente nos impedimentos e o sucede em caso de vaga. Na ausência de ambos, o exercício segue a ordem constitucional: presidências da Câmara, Senado e STF. A dupla vacância tem regimes de eleição distintos conforme o momento do mandato."],["Responsabilização","Crimes de responsabilidade não se confundem com infrações penais comuns. A Câmara tem competência de autorização nos termos constitucionais; o julgamento depende da natureza da infração. Não confunda aprovação política inicial com condenação final."]],"map":["Presidente → chefia de Estado e governo","Vice → substituição e sucessão","Dupla vacância → art. 81","Responsabilização → distinguir natureza"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Judiciário e funções essenciais à justiça","ref":"CF, arts. 92 a 135","lessons":[["Organização judicial","Identifique órgãos do Judiciário e respectivas competências. O STF guarda a Constituição; o STJ tem competência relevante na uniformização do direito federal infraconstitucional. A competência de cada recurso depende dos requisitos constitucionais e legais, não apenas do nome da questão."],["Garantias e controle","Vitaliciedade, inamovibilidade e irredutibilidade de subsídio possuem regimes constitucionais específicos. O CNJ integra o Judiciário e controla aspectos administrativos, financeiros e disciplinares nos limites constitucionais. Não funciona como instância recursal genérica de decisões jurisdicionais."],["Funções essenciais","Ministério Público, advocacia pública, advocacia e Defensoria Pública possuem regimes distintos. O MP defende ordem jurídica, regime democrático e interesses sociais e individuais indisponíveis. A Defensoria presta orientação e defesa jurídica aos necessitados conforme a Constituição."]],"map":["STF → Constituição","STJ → direito federal infraconstitucional","CNJ → controle administrativo","Defensoria → acesso à justiça"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Controle de constitucionalidade","ref":"CF, arts. 97, 102 e 103; SV 10","lessons":[["Difuso e concentrado","No controle difuso, a constitucionalidade pode surgir como questão incidental em litígio concreto. No concentrado, ações próprias discutem a validade constitucional conforme objeto e legitimidade definidos. Não presuma que todos os efeitos são idênticos: observe o tipo de ação e o pronunciamento."],["Ações constitucionais","ADI e ADC no STF têm objetos específicos definidos pelo art. 102. A ADC federal trata de lei ou ato normativo federal; a ADI federal pode ter objeto federal ou estadual. A ADPF e a ADO possuem finalidades e requisitos próprios. O art. 103 enumera legitimados para ADI e ADC."],["Reserva de plenário","Nos tribunais, a declaração de inconstitucionalidade exige maioria absoluta dos membros ou do órgão especial. A SV 10 alcança afastamento de norma por órgão fracionário com fundamento constitucional, mesmo sem declaração expressa, observadas exceções legais e jurisprudenciais. Não se aplica essa exigência colegiada indistintamente ao juiz singular."]],"map":["Difuso → caso concreto","ADI → ato federal ou estadual","ADC → ato federal","Reserva de plenário → maioria absoluta"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const constitutionalQuestions=/*BANK:constitutionalQuestions*/null;const civilModules=[{"t":"Pessoas naturais, capacidade e personalidade","ref":"CC, arts. 1º a 21","lessons":[["Personalidade e capacidade","A personalidade civil começa com o nascimento com vida, sem prejuízo da proteção jurídica do nascituro desde a concepção. Capacidade de direito é a aptidão para titularizar direitos e deveres; capacidade de exercício é a aptidão para praticar atos pessoalmente. Um recém-nascido pode receber patrimônio, embora necessite de representação."],["Incapacidade e emancipação","Menores de 16 anos são absolutamente incapazes; entre 16 e 18 anos, a incapacidade é relativa. O representante atua em nome do absolutamente incapaz, enquanto o assistente complementa a manifestação do relativamente incapaz. A emancipação antecipa a capacidade civil, não a idade exigida por regimes como o penal."],["Direitos da personalidade","Nome, imagem, honra e integridade recebem proteção específica. O uso indevido de imagem pode ensejar medidas preventivas e reparação. A análise deve considerar finalidade, consentimento, interesse público e proteção constitucional da liberdade de expressão."]],"map":["Nascimento com vida → personalidade","Menor de 16 → representação","16 a 18 → assistência, salvo emancipação","Personalidade → tutela preventiva e reparatória"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Pessoas jurídicas, bens e domicílio","ref":"CC, arts. 40 a 103","lessons":[["Pessoa jurídica e autonomia","A constituição de pessoa jurídica privada depende, em regra, do registro do ato constitutivo. Seu patrimônio não se confunde automaticamente com o de seus integrantes. A desconsideração, nos termos do art. 50, exige abuso caracterizado por desvio de finalidade ou confusão patrimonial; mero inadimplemento não basta nesse regime."],["Domicílio","O domicílio da pessoa natural combina residência e intenção de permanência. Havendo várias residências alternadas, qualquer delas pode ser domicílio. Domicílio profissional e necessário obedecem a regras próprias. Identifique a finalidade da relação jurídica antes de escolher o conceito aplicável."],["Classificação de bens","Bens móveis e imóveis seguem regras diferentes de circulação. Bens fungíveis podem ser substituídos por equivalentes da mesma espécie, qualidade e quantidade. A distinção entre bens públicos e particulares influencia alienação e aquisição: bens públicos não são usucapíveis."]],"map":["Registro → existência legal","Autonomia patrimonial → regra","Abuso → possível desconsideração","Bem público → sem usucapião"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Negócio jurídico, defeitos e invalidade","ref":"CC, arts. 104 a 184","lessons":[["Existência e validade","Para a validade do negócio, examine capacidade do agente, licitude e possibilidade do objeto, sua determinação ou determinabilidade, além da forma exigida. A liberdade de forma é a regra, mas negócios específicos exigem solenidades. Não confunda validade com eficácia perante terceiros."],["Vícios da vontade","Erro substancial, dolo, coação, estado de perigo e lesão podem levar à anulabilidade, conforme seus pressupostos. Um erro de cálculo pode ser corrigido sem anular o negócio. Fraude contra credores protege o patrimônio que responde por obrigações e tem requisitos próprios."],["Nulidade e anulabilidade","A simulação é causa de nulidade; a incapacidade relativa e determinados vícios podem causar anulabilidade. Negócio nulo não se confirma pelo decurso do tempo. O anulável pode ser confirmado nos limites legais e exige observância do prazo decadencial correspondente."]],"map":["Validade → agente, objeto e forma","Vício de vontade → analisar requisitos","Simulação → nulidade","Anulabilidade → prazo e confirmação"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Prescrição e decadência","ref":"CC, arts. 189 a 211","lessons":[["Pretensão e prazo","A violação do direito faz nascer a pretensão, sujeita à prescrição. O prazo geral do art. 205 é de dez anos quando não houver prazo menor previsto em lei. Antes de aplicá-lo, identifique a natureza da pretensão e procure a regra especial."],["Impedimento, suspensão e interrupção","Impedimento evita o início; suspensão paralisa a contagem; interrupção reinicia o prazo nos termos legais. O art. 202 limita a interrupção da prescrição a uma vez. Em provas, construa uma linha do tempo com nascimento da pretensão e fatos modificadores da contagem."],["Decadência","A decadência incide sobre direitos potestativos sujeitos a prazo. A legal não pode ser renunciada e deve ser conhecida de ofício pelo juiz; a convencional segue regime diferente. Salvo previsão legal, as causas que impedem, suspendem ou interrompem a prescrição não se aplicam à decadência."]],"map":["Violação → pretensão","Prazo geral → 10 anos","Interrupção → uma vez","Decadência legal → conhecimento de ofício"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Obrigações, pagamento e inadimplemento","ref":"CC, arts. 233 a 420","lessons":[["Modalidades e solidariedade","Obrigações de dar, fazer e não fazer distinguem-se pelo objeto da prestação. A solidariedade permite exigir o todo de um dos devedores solidários, mas não se presume: decorre da lei ou da vontade das partes. Indivisibilidade relaciona-se à prestação e não se confunde com solidariedade."],["Adimplemento e extinção","Pagamento regular exige prestação devida ao credor ou a quem legitimamente o represente. Consignação pode liberar o devedor nos casos legais, como recusa injustificada de recebimento. Novação exige obrigação nova e intenção de novar; compensação e remissão possuem pressupostos distintos."],["Mora e perdas e danos","Distinga atraso ainda útil ao credor de inadimplemento que torna a prestação inútil. Perdas e danos exigem exame do prejuízo e nexo. A Lei 14.905/2024 alterou regras de juros legais e atualização monetária; não adote automaticamente a antiga referência de 1% ao mês."]],"map":["Dar, fazer ou não fazer → prestação","Solidariedade → lei ou acordo","Consignação → hipóteses legais","Mora → atraso juridicamente relevante"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14905.htm"},{"t":"Contratos: princípios e espécies","ref":"CC, arts. 421 a 480, 481 a 853","lessons":[["Autonomia e boa-fé","A liberdade contratual é exercida nos limites da função social. A boa-fé objetiva exige comportamento leal na formação e execução do contrato, inclusive deveres de informação e cooperação. A revisão contratual deve respeitar os requisitos do regime aplicável, não qualquer insatisfação econômica."],["Contratos bilaterais e resolução","Em contratos bilaterais, a parte que ainda não cumpriu sua obrigação não pode, em regra, exigir a contraprestação. A resolução por inadimplemento e a revisão por onerosidade excessiva têm fundamentos próprios. Analise a distribuição de riscos, a reciprocidade e os requisitos legais."],["Espécies contratuais","Compra e venda obriga transferir domínio mediante preço; o contrato não transfere sozinho a propriedade imobiliária. Comodato é empréstimo gratuito de coisa não fungível; mútuo envolve coisas fungíveis. Mandato atribui poderes para praticar atos em nome de outrem."]],"map":["Boa-fé → lealdade","Função social → limite","Comodato → coisa não fungível","Mútuo → coisa fungível"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Responsabilidade civil","ref":"CC, arts. 186 a 188 e 927 a 954","lessons":[["Elementos da responsabilidade","Identifique conduta, dano e nexo causal, além da culpa quando o regime for subjetivo. A responsabilidade objetiva dispensa prova da culpa, mas não elimina a necessidade de verificar os demais pressupostos. Abuso de direito pode constituir ato ilícito."],["Regimes de imputação","O art. 927 admite responsabilidade sem culpa em hipóteses legais ou quando a atividade normalmente desenvolvida implique risco por sua natureza para direitos de terceiros. Há hipóteses de responsabilidade por fato de outra pessoa, como a do empregador por atos do empregado no exercício do trabalho ou em razão dele."],["Reparação e excludentes","A indenização é medida pela extensão do dano, com exceções legais. Culpa concorrente da vítima pode influenciar o valor. Caso fortuito, força maior e fato exclusivo de terceiro exigem análise do nexo e do risco assumido; não excluem automaticamente responsabilidade em todos os regimes."]],"map":["Conduta + dano + nexo","Subjetiva → culpa","Objetiva → hipóteses legais ou risco","Indenização → extensão do dano"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Posse, propriedade e direitos reais","ref":"CC, arts. 1.196 a 1.510-E","lessons":[["Posse e detenção","Possuidor exerce de fato algum dos poderes inerentes à propriedade. Detentor conserva a posse em nome de outro sob dependência, nos termos legais. Posse direta e indireta podem coexistir, como no exemplo do locatário e locador; posse e propriedade não são sinônimos."],["Proteção e aquisição","Manutenção tutela a posse contra turbação; reintegração responde ao esbulho; interdito proibitório protege diante de ameaça. A usucapião exige requisitos da modalidade escolhida, incluindo tempo e características da posse. Não se presume aquisição pelo simples decurso temporal."],["Propriedade e direitos reais limitados","Na transferência imobiliária entre vivos, o registro do título translativo é essencial à aquisição do domínio. Usufruto separa poderes de uso e fruição da nua-propriedade. Servidão beneficia imóvel dominante, e direitos reais de garantia possuem regimes próprios."]],"map":["Posse ≠ propriedade","Turbação → manutenção","Esbulho → reintegração","Imóvel entre vivos → registro"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Direito de família","ref":"CC, arts. 1.511 a 1.783-A","lessons":[["Casamento e regimes patrimoniais","Na ausência de convenção válida e de hipótese de regime obrigatório, aplica-se a comunhão parcial. Em regra, comunicam-se bens adquiridos onerosamente durante o casamento, com exclusões legais, como bens anteriores e determinados bens recebidos por doação ou sucessão."],["União estável e filiação","A união estável exige convivência pública, contínua e duradoura, estabelecida com objetivo de constituição de família; não há prazo mínimo geral no Código Civil. O reconhecimento de uniões homoafetivas decorre da interpretação constitucional do STF. Filhos têm igualdade de direitos independentemente da origem da filiação."],["Alimentos e poder familiar","Alimentos são fixados considerando necessidades do reclamante e recursos da pessoa obrigada, com proporcionalidade. Alterações relevantes podem fundamentar revisão. Poder familiar envolve responsabilidades parentais; a guarda deve considerar a proteção da criança e as regras atuais, inclusive hipóteses de risco de violência doméstica."]],"map":["Regime supletivo → comunhão parcial","União estável → objetivo familiar","Filiação → igualdade","Alimentos → necessidade e possibilidade"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Direito das sucessões","ref":"CC, arts. 1.784 a 2.027","lessons":[["Abertura e transmissão","A morte abre a sucessão e transmite desde logo a herança aos herdeiros legítimos e testamentários. Até a partilha, a herança é tratada como unidade indivisível. Aceitação e renúncia possuem formas e efeitos próprios; a renúncia exige escritura pública ou termo judicial."],["Vocação hereditária e legítima","A ordem de vocação hereditária considera descendentes, ascendentes, cônjuge e colaterais, com regras de concorrência e regime patrimonial. Descendentes, ascendentes e cônjuge são herdeiros necessários no texto do art. 1.845. A sucessão do companheiro exige considerar a equiparação sucessória reconhecida pelo STF."],["Testamento, dívidas e partilha","O testamento permite organizar a sucessão nos limites legais, respeitando a legítima quando houver herdeiros necessários. A meação não é herança: deve ser apurada antes de distribuir o acervo hereditário. O herdeiro não responde por encargos superiores às forças da herança, observadas as regras probatórias."]],"map":["Morte → abertura da sucessão","Meação ≠ herança","Herdeiros necessários → legítima","Renúncia → instrumento público ou termo judicial"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"}];const civilQuestions=/*BANK:civilQuestions*/null;const processCivilModules=[{"t":"Normas fundamentais e jurisdição","ref":"CPC, arts. 1º a 20","lessons":[["Iniciativa e impulso oficial","O processo começa por iniciativa da parte, salvo exceção legal, e segue por impulso oficial. A iniciativa de instaurar a demanda não significa que cada ato posterior dependa de novo pedido. O juiz dirige o procedimento respeitando os limites do pedido e a imparcialidade."],["Contraditório substancial","As partes devem poder influenciar a formação da decisão. Mesmo questão cognoscível de ofício, em regra, exige oportunidade prévia de manifestação. As exceções à oitiva prévia previstas no art. 9º não afastam o contraditório posterior."],["Acesso à justiça e cooperação","A arbitragem é admitida na forma da lei, e a solução consensual deve ser estimulada. Boa-fé e cooperação não obrigam uma parte a abandonar sua pretensão; exigem condutas compatíveis com um procedimento leal e decisão de mérito em tempo razoável."]],"map":["Iniciativa → parte","Impulso → oficial","Contraditório → influência","Cooperação → decisão justa"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Competência e partes","ref":"CPC, arts. 42 a 76","lessons":[["Competência absoluta e relativa","A competência ligada à matéria, pessoa ou função não pode ser alterada por convenção. Em regra, a territorial e a de valor são relativas, observadas exceções. A incompetência é arguida em preliminar de contestação; a absoluta pode ser conhecida de ofício. A eleição de foro deve atender aos requisitos legais vigentes."],["Capacidade e representação","A capacidade de ser parte não se confunde com a capacidade de atuar pessoalmente em juízo. A representação de incapazes e pessoas jurídicas obedece à lei. Identificada irregularidade sanável de representação, o juiz deve oportunizar correção antes das consequências processuais pertinentes."],["Litisconsórcio","Há litisconsórcio quando mais de uma pessoa participa de um polo processual. A necessidade decorre da lei ou da natureza da relação jurídica; a unitariedade depende de a decisão de mérito precisar ser uniforme. Essas classificações não são equivalentes."]],"map":["Matéria, pessoa, função → absoluta","Incompetência → preliminar","Representação irregular → saneamento","Necessário ≠ unitário"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Atos processuais, citação e prazos","ref":"CPC, arts. 188 a 275","lessons":[["Forma e instrumentalidade","A validade do ato deve ser examinada à luz da finalidade e das exigências legais. Se a forma não for essencial, o ato pode ser aproveitado quando atingir sua finalidade. Diferencie irregularidade sem prejuízo de vício capaz de comprometer defesa ou validade."],["Contagem de prazos","Para prazos processuais expressos em dias, contam-se apenas dias úteis. Exclui-se em regra o dia do começo e inclui-se o vencimento. O termo inicial varia conforme a modalidade de comunicação. Não aplique a regra indistintamente a prazos de direito material."],["Citação e intimação","A citação convoca o réu, executado ou interessado para integrar a relação processual; a intimação comunica atos e termos. O comparecimento espontâneo supre falta ou nulidade da citação nos termos do art. 239. A citação eletrônica tem disciplina própria, que deve ser conferida na redação vigente."]],"map":["Finalidade → aproveitamento","Prazo processual em dias → úteis","Citação → integração","Intimação → ciência"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Tutelas provisórias","ref":"CPC, arts. 294 a 311","lessons":[["Urgência e evidência","A tutela provisória pode fundar-se em urgência ou evidência. A primeira exige probabilidade do direito e perigo de dano ou risco ao resultado útil. A evidência depende das hipóteses específicas do art. 311, sem exigir demonstração de perigo."],["Tutela cautelar e antecipada","A cautelar protege a utilidade do resultado; a antecipada adianta efeitos práticos da tutela pretendida. Ambas podem ser antecedentes ou incidentais. A antecipação não deve ser concedida quando houver perigo de irreversibilidade de seus efeitos, ressalvadas questões interpretativas do caso concreto."],["Estabilização e revisão","A estabilização tem disciplina própria no art. 304 para tutela antecipada antecedente. Não se confunde com coisa julgada material. É necessário estudar a impugnação pertinente, a extinção do processo e a ação destinada a rever, reformar ou invalidar a medida, considerando a jurisprudência."]],"map":["Urgência → probabilidade + perigo","Cautelar → proteção","Antecipada → satisfação provisória","Evidência → hipóteses legais"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Procedimento comum e resposta do réu","ref":"CPC, arts. 318 a 357","lessons":[["Petição inicial e saneamento","A inicial deve identificar partes, fundamentos, pedido e demais requisitos legais. Quando defeitos sanáveis dificultam o exame do mérito, o juiz indica o que deve ser corrigido e concede prazo legal de emenda. Indeferimento não é a primeira opção diante de vício corrigível."],["Conciliação e contestação","A audiência de conciliação ou mediação possui hipóteses legais de dispensa. O prazo de contestação é de quinze dias úteis, mas seu termo inicial depende da situação do art. 335. O réu deve concentrar matérias defensivas, sem prejuízo das exceções legais."],["Reconvenção e revelia","A reconvenção permite ao réu formular pretensão própria conexa à ação ou fundamento da defesa. A revelia não implica vitória automática do autor: a presunção de veracidade possui exceções e não dispensa o exame jurídico dos pedidos."]],"map":["Inicial → requisitos e emenda","Contestação → 15 dias úteis","Reconvenção → pretensão própria","Revelia ≠ procedência automática"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Provas, audiência e saneamento","ref":"CPC, arts. 357 a 484","lessons":[["Ônus da prova","Em regra, o autor prova os fatos constitutivos de seu direito e o réu os fatos impeditivos, modificativos ou extintivos. A redistribuição judicial deve ser fundamentada e permitir à parte cumprir o encargo; não pode criar prova impossível ou excessivamente difícil."],["Meios de prova","Documentos, testemunhas, perícia e depoimento têm finalidades distintas. A prova pericial trata de questões que demandam conhecimento técnico, mas o juiz não está automaticamente vinculado ao laudo. Deve fundamentar a apreciação das provas e evitar diligências inúteis ou protelatórias."],["Organização do processo","O saneamento delimita questões controvertidas, resolve pendências processuais, define meios de prova e distribuição do ônus, e designa audiência quando necessária. A definição dos fatos relevantes torna a instrução mais eficiente."]],"map":["Autor → fato constitutivo","Réu → fato impeditivo/modificativo/extintivo","Redistribuição → decisão fundamentada","Saneamento → delimitação"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Sentença e coisa julgada","ref":"CPC, arts. 485 a 508","lessons":[["Resolução do mérito","A extinção sem mérito e o julgamento de mérito têm efeitos distintos. Acolhimento ou rejeição do pedido, reconhecimento de prescrição ou decadência e homologações previstas no art. 487 são decisões de mérito. A ausência de pressuposto processual pode gerar extinção sem mérito."],["Fundamentação e congruência","A sentença deve apresentar fundamentação adequada e observar os limites da demanda. Não basta citar norma ou precedente sem demonstrar sua relação com a controvérsia. O juiz não pode conceder objeto diverso ou quantidade superior ao pedido, observadas as regras legais de interpretação."],["Coisa julgada","A coisa julgada material protege decisão de mérito não mais sujeita a recurso. Em regra, os motivos da decisão não fazem coisa julgada por si. Questões prejudiciais podem adquirir essa autoridade quando preenchidos os requisitos do art. 503. A ação rescisória tem hipóteses específicas."]],"map":["Art. 485 → sem mérito","Art. 487 → mérito","Congruência → limites do pedido","Coisa julgada → decisão de mérito definitiva"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Recursos e precedentes","ref":"CPC, arts. 926 a 928 e 994 a 1.044","lessons":[["Sistema recursal","O recurso adequado depende da espécie de pronunciamento e da hipótese legal. Apelação impugna sentença; agravo de instrumento impugna interlocutórias nas hipóteses pertinentes; agravo interno questiona decisão monocrática do relator. O prazo recursal geral é de quinze dias úteis, exceto embargos de declaração, de cinco."],["Agravo e taxatividade mitigada","O art. 1.015 lista hipóteses de agravo. No Tema 988, o STJ admite seu cabimento fora do rol quando esperar pela apelação tornar inútil o exame da matéria, em razão da urgência. Não equivale a permitir agravo contra qualquer interlocutória."],["Embargos e precedentes","Embargos de declaração corrigem obscuridade, contradição, omissão ou erro material, interrompendo o prazo para outros recursos. A aplicação de precedentes exige identificar a razão determinante e a aderência do caso. Recurso especial e extraordinário possuem requisitos próprios."]],"map":["Sentença → apelação","Interlocutória → art. 1.015 e Tema 988","Embargos → 5 dias úteis","Prazo recursal geral → 15 dias úteis"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","extraUrl":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=988&cod_tema_inicial=988&novaConsulta=true&tipo_pesquisa=T"},{"t":"Cumprimento de sentença e execução","ref":"CPC, arts. 513 a 538, 771 a 925","lessons":[["Título e técnica executiva","O cumprimento de sentença realiza obrigação reconhecida em título judicial. A execução autônoma pode basear-se em título extrajudicial. Identifique certeza, liquidez e exigibilidade, natureza da obrigação e meio de satisfação adequado."],["Pagamento voluntário","No cumprimento definitivo de sentença por quantia certa contra devedor privado, a intimação para pagar inicia prazo de quinze dias. Não havendo pagamento voluntário, incidem multa e honorários de dez por cento cada sobre o montante pertinente. A Fazenda Pública e os alimentos possuem procedimentos próprios."],["Defesa e penhora","A impugnação é a defesa típica do cumprimento de sentença; embargos à execução são próprios da execução extrajudicial. A penhora deve respeitar regras de impenhorabilidade e efetividade. Menor onerosidade não autoriza frustrar a satisfação do credor, devendo o executado indicar alternativa eficaz quando pertinente."]],"map":["Título judicial → cumprimento","Extrajudicial → execução autônoma","Pagamento → prazo do art. 523","Defesa → impugnação ou embargos"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Procedimentos especiais e ações autônomas","ref":"CPC, arts. 539 a 770 e 966 a 975","lessons":[["Consignação e monitória","A consignação permite depositar a prestação quando presentes os requisitos de direito material. A ação monitória permite ao titular de prova escrita sem eficácia de título executivo buscar a satisfação das obrigações previstas no art. 700. Não se confunde com execução direta."],["Possessórias e família","As ações possessórias distinguem manutenção, reintegração e interdito proibitório conforme turbação, esbulho ou ameaça. O procedimento de família estimula solução consensual, sem afastar garantias, proteção de vulneráveis e análise de eventual violência."],["Ação rescisória","A desconstituição de decisão de mérito transitada em julgado exige hipótese legal do art. 966, com exceções expressas para certas decisões sem mérito. Não é novo recurso para simples inconformismo. O prazo geral é de dois anos contado do trânsito em julgado da última decisão proferida no processo, observadas regras especiais."]],"map":["Consignação → depósito da prestação","Monitória → prova escrita sem título executivo","Esbulho → reintegração","Rescisória → hipóteses legais"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"}];const processCivilQuestions=/*BANK:processCivilQuestions*/null;const penalModules=[{"t":"Princípios e aplicação da lei penal","ref":"CP, arts. 1º a 12","lessons":[["Legalidade e anterioridade","A criação de crimes e penas depende de lei anterior ao fato. A interpretação da norma deve respeitar os limites da legalidade; analogia prejudicial ao acusado não pode criar incriminação. Diferencie a data de publicação da lei de sua entrada em vigor."],["Lei penal no tempo","A lei posterior que deixa de considerar o fato criminoso faz cessar a execução e os efeitos penais da condenação, sem eliminar automaticamente os efeitos civis. A norma posterior mais favorável retroage inclusive após trânsito em julgado. Leis temporárias e excepcionais têm ultratividade nos termos do art. 3º."],["Tempo e lugar do crime","Para o tempo do crime, o Código adota a teoria da atividade: considera-se o momento da ação ou omissão. Para o lugar, adota a ubiquidade, abrangendo o local da conduta e aquele onde o resultado ocorreu ou deveria ocorrer. Territorialidade e extraterritorialidade obedecem a pressupostos distintos."]],"map":["Legalidade → lei anterior","Lei mais benéfica → retroatividade","Tempo → atividade","Lugar → ubiquidade"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Teoria do crime: fato típico, dolo e culpa","ref":"CP, arts. 13, 18 a 20","lessons":[["Estrutura do delito","Na concepção analítica tripartida, o crime é estudado pela tipicidade, ilicitude e culpabilidade. A tipicidade envolve adequação da conduta ao tipo penal e, quando necessário, resultado e nexo causal. Nem todo resultado danoso constitui crime: é preciso examinar os elementos do tipo."],["Causalidade e omissão","Nos crimes materiais, o resultado deve ser imputável à conduta segundo os critérios legais. O art. 13 disciplina a causa superveniente relativamente independente que, por si só, produz o resultado. Na omissão imprópria, a relevância penal pressupõe dever e possibilidade de agir nas condições do § 2º."],["Dolo, culpa e erro de tipo","Dolo abrange querer o resultado ou assumir seu risco; culpa envolve imprudência, negligência ou imperícia. A modalidade culposa exige previsão legal. O erro sobre elemento constitutivo do tipo exclui o dolo, mas permite punição culposa se prevista e presentes os respectivos requisitos."]],"map":["Fato típico → elementos legais","Omissão imprópria → dever e possibilidade","Culpa → previsão expressa","Erro de tipo → exclui dolo"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Consumação, tentativa e desistência","ref":"CP, arts. 14 a 17","lessons":[["Consumação e tentativa","O crime é consumado quando reúne todos os elementos de sua definição legal. A tentativa exige início da execução e ausência de consumação por circunstâncias alheias à vontade do agente. Em regra, a pena do crime consumado é reduzida de um a dois terços, salvo disposição em contrário."],["Desistência voluntária e arrependimento eficaz","Na desistência voluntária, o agente deixa de prosseguir na execução por decisão própria. No arrependimento eficaz, impede voluntariamente o resultado após os atos executórios. Nos dois casos, responde pelos atos já praticados, caso constituam infração penal."],["Arrependimento posterior e crime impossível","O arrependimento posterior exige crime sem violência ou grave ameaça à pessoa, reparação ou restituição por ato voluntário até o recebimento da denúncia ou queixa e enseja redução de pena. Crime impossível exige ineficácia absoluta do meio ou impropriedade absoluta do objeto, não mera dificuldade de consumação."]],"map":["Tentativa → causa alheia à vontade","Desistência → interrupção voluntária","Arrependimento eficaz → impede resultado","Posterior → redução nos requisitos legais"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Ilicitude e culpabilidade","ref":"CP, arts. 21 a 28","lessons":[["Excludentes de ilicitude","Estado de necessidade, legítima defesa, estrito cumprimento de dever legal e exercício regular de direito são hipóteses do art. 23. A legítima defesa exige agressão injusta, atual ou iminente, repelida moderadamente mediante meios necessários. O excesso doloso ou culposo pode gerar responsabilidade."],["Culpabilidade e erro de proibição","Culpabilidade é estudada mediante imputabilidade, potencial consciência da ilicitude e exigibilidade de conduta diversa. O desconhecimento da lei não é escusa. Erro inevitável sobre a ilicitude isenta de pena; erro evitável pode reduzir a pena de um sexto a um terço."],["Imputabilidade e coação","Menores de dezoito anos são penalmente inimputáveis, sujeitos à legislação especial. Doença mental ou desenvolvimento mental incompleto ou retardado pode afastar a imputabilidade nos requisitos do art. 26. Coação irresistível e estrita obediência a ordem não manifestamente ilegal de superior hierárquico seguem o art. 22."]],"map":["Legítima defesa → agressão injusta","Excesso → responsabilidade","Erro inevitável de proibição → isenção","Menor de 18 → inimputabilidade penal"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Concurso de pessoas e concurso de crimes","ref":"CP, arts. 29 a 31 e 69 a 71","lessons":[["Autoria e participação","Quem concorre para o crime incide nas penas a ele cominadas na medida de sua culpabilidade. A participação de menor importância pode reduzir a pena. A responsabilidade deve ser individualizada; vínculo pessoal ou presença no local não substitui a demonstração de contribuição penalmente relevante."],["Circunstâncias e cooperação","Circunstâncias e condições pessoais não se comunicam, salvo quando elementares do crime. Se um concorrente quis participar de crime menos grave, aplica-se a regra do art. 29, § 2º, considerando eventual previsibilidade do resultado mais grave. Ajuste e instigação, por si sós, seguem os limites do art. 31."],["Pluralidade de crimes","Concurso material envolve mais de uma ação ou omissão e dois ou mais crimes, com aplicação cumulativa das penas. Concurso formal decorre de uma só ação ou omissão e pluralidade de crimes, com regimes próprios. Continuidade delitiva pressupõe crimes da mesma espécie e condições semelhantes, além dos requisitos interpretativos pertinentes."]],"map":["Contribuição → culpabilidade individual","Condição pessoal → regra de incomunicabilidade","Material → cumulação","Formal e continuado → regimes próprios"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Penas, dosimetria e extinção da punibilidade","ref":"CP, arts. 32 a 68 e 107 a 120","lessons":[["Espécies e regimes","O Código prevê penas privativas de liberdade, restritivas de direitos e multa. Regime inicial e substituição dependem da pena, reincidência, circunstâncias judiciais e demais requisitos. A substituição não é automática pelo simples fato de a condenação ser inferior a quatro anos."],["Sistema trifásico","Na primeira fase, fixa-se a pena-base conforme circunstâncias judiciais; na segunda, consideram-se agravantes e atenuantes; na terceira, aplicam-se causas de aumento e diminuição. Diferencie qualificadora, que altera a faixa abstrata do delito, de agravante e causa de aumento."],["Punibilidade e prescrição","Morte do agente, anistia, graça, indulto, prescrição, decadência e outras hipóteses do art. 107 podem extinguir punibilidade. O cálculo prescricional depende da fase processual, da pena aplicável, dos marcos interruptivos e de regras especiais. Não aplique um prazo único a todos os delitos."]],"map":["Pena-base → primeira fase","Agravantes/atenuantes → segunda","Majorantes/minorantes → terceira","Prescrição → prazo e marcos legais"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Crimes contra a pessoa","ref":"CP, arts. 121 a 154-B","lessons":[["Vida e integridade","Homicídio e lesão corporal protegem bens jurídicos relacionados à vida e à integridade física. A distinção exige análise do elemento subjetivo e do resultado, sem presumir intenção apenas pela gravidade do dano. O feminicídio passou a tipo autônomo no art. 121-A pela Lei 14.994/2024."],["Honra","Calúnia envolve falsa imputação de fato definido como crime; difamação refere-se à imputação de fato ofensivo à reputação; injúria atinge dignidade ou decoro. A análise da ação penal e das causas especiais exige atenção à legislação vigente, inclusive à disciplina específica de discriminação racial."],["Liberdade individual","Ameaça e constrangimento ilegal são tipos distintos, com elementos próprios. Crimes de perseguição e violência psicológica contra a mulher exigem exame dos requisitos legais. Na prova, identifique precisamente o bem jurídico protegido e a presença de elementos especiais do tipo."]],"map":["Vida → tipos próprios","Feminicídio → art. 121-A","Calúnia → falsa imputação de crime","Difamação ≠ injúria"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14994.htm"},{"t":"Crimes contra o patrimônio","ref":"CP, arts. 155 a 183","lessons":[["Furto e roubo","O furto envolve subtração de coisa alheia móvel. O roubo inclui violência ou grave ameaça à pessoa, ou redução de sua capacidade de resistência nas condições do tipo. A distinção depende dos elementos legais e não simplesmente do valor do bem."],["Apropriação indébita e estelionato","A apropriação indébita pressupõe posse ou detenção anterior da coisa e posterior apropriação indevida. O estelionato exige vantagem ilícita em prejuízo alheio, mediante indução ou manutenção da vítima em erro por fraude. Diferencie a dinâmica jurídica da obtenção do bem, sem tratar todo descumprimento contratual como crime."],["Receptação e ação penal","A receptação tem modalidades e requisitos subjetivos próprios. A ação penal em crimes patrimoniais depende do tipo e das exceções legais, inclusive regras de representação e imunidades familiares. O simples parentesco não afasta automaticamente a responsabilidade em todas as hipóteses."]],"map":["Furto → subtração","Roubo → violência ou grave ameaça, entre outras hipóteses","Apropriação → posse anterior","Estelionato → fraude e erro"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Crimes contra a administração pública","ref":"CP, arts. 312 a 359-H","lessons":[["Funcionário público para fins penais","O art. 327 adota conceito penal próprio, abrangendo exercício transitório ou não remunerado de cargo, emprego ou função pública, além das equiparações legais. Não confunda o conceito penal com a exigência de concurso ou estabilidade."],["Peculato e corrupção","O peculato do art. 312 envolve apropriação ou desvio de bens de que o funcionário tem posse em razão do cargo, entre outras modalidades legais. Corrupção passiva abrange solicitar, receber vantagem indevida ou aceitar promessa nas condições do tipo. A corrupção ativa possui descrição autônoma no art. 333."],["Concussão e prevaricação","Concussão exige a exigência de vantagem indevida em razão da função. Prevaricação envolve retardar, omitir ou praticar indevidamente ato de ofício para satisfazer interesse ou sentimento pessoal. Compare os verbos nucleares e o vínculo entre conduta e função pública."]],"map":["Art. 327 → conceito penal","Peculato → vínculo funcional com bem","Concussão → exigir","Corrupção passiva → solicitar, receber ou aceitar promessa"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Legislação penal especial e temas transversais","ref":"Leis 8.072/1990, 11.340/2006 e 11.343/2006","lessons":[["Crimes hediondos","A Lei 8.072/1990 estabelece rol legal e regimes específicos. A gravidade abstrata de uma conduta não permite, por si só, classificá-la como hedionda. Regras de execução penal e progressão exigem consulta à legislação consolidada, à data do fato e à jurisprudência aplicável."],["Violência doméstica e familiar","A Lei Maria da Penha disciplina prevenção, assistência, proteção e procedimentos próprios em situações de violência doméstica e familiar contra a mulher. As formas de violência não se limitam à física. Medidas protetivas têm regime específico e não dependem necessariamente do ajuizamento de ação penal, conforme a redação legal vigente."],["Lei de drogas e jurisprudência","A Lei 11.343/2006 distingue regimes jurídicos conforme as condutas e circunstâncias legais. É indispensável considerar a decisão do STF no Tema 506 sobre porte de cannabis para consumo pessoal e seus limites, sem estender automaticamente a solução a outras substâncias ou ao tráfico."]],"map":["Hediondez → previsão legal","Maria da Penha → proteção integral","Medidas protetivas → regime próprio","Drogas → lei e precedentes atuais"],"url":"https://www.planalto.gov.br/ccivil_03/leis/l8072.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11340.htm"}];const penalQuestions=/*BANK:penalQuestions*/null;const processPenalModules=[{"t":"Princípios e sistemas processuais","ref":"CPP, arts. 1º a 3º-A; CF, art. 5º","lessons":[["Estrutura acusatória","A acusação, a defesa e o julgamento exercem funções distintas. A imparcialidade judicial exige que a iniciativa investigativa e a atividade probatória da acusação não sejam substituídas pelo julgador. O art. 3º-A deve ser estudado em conjunto com a interpretação do STF sobre o sistema acusatório."],["Garantias fundamentais","A presunção de inocência impõe que a responsabilidade penal não seja presumida. A defesa técnica e o contraditório são garantias do acusado. O direito ao silêncio não equivale a confissão e não deve fundamentar conclusão desfavorável apenas pelo seu exercício."],["Aplicação da lei processual","A norma processual tem aplicação imediata, preservados os atos validamente realizados segundo a lei anterior. Regras de natureza mista podem exigir análise dos efeitos materiais. Diferencie lei processual pura de norma penal substantiva."]],"map":["Acusação ≠ julgamento","Silêncio → garantia","Presunção → não culpabilidade","Lei processual → aplicação imediata"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Investigação criminal e inquérito policial","ref":"CPP, arts. 4º a 23","lessons":[["Finalidade e características","O inquérito reúne elementos sobre materialidade e autoria para subsidiar a formação da opinião do titular da ação penal. É procedimento investigativo, distinto da instrução judicial. Pode ser dispensado se houver elementos suficientes para acusação, não sendo condição universal da ação."],["Diligências e defesa","A autoridade policial realiza diligências previstas em lei, preservando vestígios e colhendo informações. O investigado pode exercer garantias de defesa e requerer diligências, cuja realização segue o regime legal. A defesa pode acessar elementos documentados que interessem ao exercício defensivo, conforme a Súmula Vinculante 14."],["Encerramento e arquivamento","A autoridade policial elabora relatório e remete os autos à instância competente. Não pode arquivar o inquérito por iniciativa própria. O arquivamento deve observar o art. 28 e a interpretação constitucional aplicável; não se confunde com absolvição judicial."]],"map":["Inquérito → elementos informativos","Dispensável → acusação já fundamentada","Defesa → acesso aos elementos documentados","Delegado → não arquiva"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Ação penal, denúncia, queixa e ANPP","ref":"CPP, arts. 24 a 62; art. 28-A","lessons":[["Titularidade","A ação penal pública é promovida pelo Ministério Público, mediante denúncia. Pode depender de representação ou requisição nos casos legais. A ação privada é proposta mediante queixa por legitimado. A subsidiária da pública é admitida diante de inércia do titular no prazo legal, observadas suas condições."],["Prazos e requisitos","A denúncia ou queixa deve descrever o fato criminoso com suas circunstâncias e identificar o acusado nos termos legais. A representação e a queixa submetem-se, em regra, à decadência de seis meses desde o conhecimento da autoria, com ressalvas. Distinga decadência da vítima dos prazos para oferecer denúncia."],["Acordo de não persecução penal","O ANPP exige avaliação dos requisitos do art. 28-A, entre eles delito sem violência ou grave ameaça e pena mínima inferior a quatro anos, além da adequação do acordo. Há impedimentos, homologação judicial e possibilidade de revisão interna da recusa do MP. A aplicação temporal e a confissão devem considerar precedentes atuais."]],"map":["Pública → denúncia do MP","Privada → queixa","Decadência → regra de 6 meses","ANPP → requisitos cumulativos"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Competência, conexão e continência","ref":"CPP, arts. 69 a 91","lessons":[["Critérios de competência","Lugar da infração, natureza do delito, distribuição, conexão e continência são critérios legalmente previstos. Em regra, o lugar da consumação define a competência territorial; na tentativa, considera-se o último ato executório. Leis especiais e disposições específicas podem modificar essa regra."],["Conexão e continência","A conexão associa infrações relacionadas nas hipóteses do art. 76; a continência decorre das situações do art. 77, como pluralidade de acusados pela mesma infração. A reunião de processos não é absoluta: existem regras de separação obrigatória ou facultativa."],["Competências constitucionais","O Tribunal do Júri julga crimes dolosos contra a vida, ressalvadas regras constitucionais pertinentes. A competência federal decorre das hipóteses constitucionais, não apenas da repercussão do fato. Identifique a competência material antes de aplicar a territorial."]],"map":["Territorial → regra da consumação","Tentativa → último ato executório","Conexão → vínculo entre infrações","Júri → crimes dolosos contra a vida"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Provas e cadeia de custódia","ref":"CPP, arts. 155 a 250","lessons":[["Elementos investigativos e prova judicial","O juiz forma sua convicção com a prova produzida sob contraditório judicial. Elementos informativos da investigação não podem, em regra, fundamentar exclusivamente a decisão, ressalvadas provas cautelares, não repetíveis e antecipadas. Essa distinção protege a possibilidade efetiva de contestar a prova."],["Provas ilícitas e vestígios","Provas obtidas em violação a normas constitucionais ou legais são inadmissíveis, observadas as regras sobre derivação e fonte independente. A cadeia de custódia documenta a história do vestígio desde seu reconhecimento até o descarte. Eventual falha deve ser examinada quanto à confiabilidade e aos efeitos no caso."],["Perícia e reconhecimento","Quando a infração deixa vestígios, o exame de corpo de delito é indispensável nos termos do art. 158; a confissão não o substitui. Reconhecimento pessoal demanda respeito ao procedimento legal e à jurisprudência. A avaliação probatória deve ser fundamentada e considerar a qualidade dos elementos."]],"map":["Contraditório → prova judicial","Ilícita → inadmissibilidade","Vestígio → cadeia de custódia","Corpo de delito → exigência legal"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Prisões, cautelares e liberdade provisória","ref":"CPP, arts. 282 a 350","lessons":[["Prisão em flagrante","O flagrante depende das hipóteses legais e está sujeito a controle judicial. A captura não equivale a condenação, nem autoriza manutenção automática da prisão. A audiência de custódia permite examinar legalidade, integridade e necessidade das medidas cabíveis segundo o regime vigente."],["Prisão preventiva","A preventiva é cautelar, não antecipação da pena. Exige pressupostos, fundamentos concretos, admissibilidade e motivação conforme os arts. 312, 313 e 315. A gravidade abstrata do crime não basta. A disciplina recebeu alterações recentes, especialmente pelas Leis 15.272/2025 e 15.358/2026, que devem integrar a revisão especializada."],["Medidas alternativas","O art. 319 prevê medidas cautelares diversas da prisão. Necessidade e adequação orientam sua escolha. A preventiva é subsidiária quando não for cabível substituição por outra medida cautelar, nos termos do art. 282. Liberdade provisória e relaxamento de prisão ilegal não são o mesmo instituto."]],"map":["Flagrante → controle judicial","Preventiva → fundamentação concreta","Cautelar → necessidade e adequação","Prisão ilegal → relaxamento"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15272.htm"},{"t":"Procedimento comum e resposta à acusação","ref":"CPP, arts. 394 a 405","lessons":[["Escolha do procedimento","O procedimento comum pode ser ordinário, sumário ou sumaríssimo, conforme critérios legais. No ordinário, o parâmetro geral é pena máxima igual ou superior a quatro anos. Procedimentos especiais devem ser considerados antes da aplicação subsidiária das regras comuns."],["Recebimento e defesa","A rejeição da denúncia ou queixa pode decorrer de inépcia manifesta, falta de pressuposto ou condição da ação e ausência de justa causa. Recebida a acusação, a resposta escrita permite apresentar preliminares, argumentos, documentos, requerimentos e rol de testemunhas dentro do prazo legal."],["Instrução e julgamento","A absolvição sumária do art. 397 exige hipótese legal. Na instrução, produzem-se provas e colhem-se declarações conforme a ordem aplicável. O interrogatório é ato de defesa e, no procedimento comum ordinário, ocorre ao final da instrução. A sentença deve apreciar acusação, defesa e provas."]],"map":["Ordinário → pena máxima ≥ 4 anos","Rejeição → art. 395","Resposta → 10 dias","Interrogatório → final da instrução ordinária"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Tribunal do Júri","ref":"CPP, arts. 406 a 497","lessons":[["Duas fases","A primeira fase examina se a acusação deve ser submetida ao Conselho de Sentença. Pode terminar com pronúncia, impronúncia, absolvição sumária ou desclassificação conforme os requisitos legais. A pronúncia não significa condenação e deve limitar a fundamentação ao necessário."],["Plenário e garantias","Na segunda fase, o Conselho de Sentença aprecia os quesitos submetidos, e o juiz presidente exerce atribuições legais. Plenitude de defesa, sigilo das votações e soberania dos veredictos são garantias constitucionais, compatíveis com as hipóteses legais de controle recursal."],["Impronúncia e recursos","A impronúncia ocorre quando faltam os requisitos probatórios para pronunciar o acusado; nova acusação pode ser formulada com prova nova enquanto não extinta a punibilidade. Diferencie o recurso em sentido estrito contra pronúncia da apelação contra impronúncia ou absolvição sumária."]],"map":["Primeira fase → admissibilidade","Pronúncia ≠ condenação","Plenário → quesitos","Impronúncia → possível nova prova"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Nulidades, sentença e recursos","ref":"CPP, arts. 381 a 393 e 563 a 667","lessons":[["Nulidades e prejuízo","A análise de nulidades considera finalidade do ato, prejuízo, momento de arguição e regime aplicável. O art. 563 consagra a regra de que não há declaração de nulidade sem prejuízo para acusação ou defesa. Garantias essenciais podem demandar análise própria conforme jurisprudência."],["Sentença e correlação","A decisão deve enfrentar o fato imputado e os elementos probatórios. Emendatio libelli permite atribuir definição jurídica diversa ao fato descrito sem modificar a narrativa acusatória; mutatio libelli exige procedimento próprio quando emerge elemento fático não contido na acusação."],["Recursos e limites","Apelação e recurso em sentido estrito têm hipóteses específicas. Embargos de declaração permitem corrigir vícios previstos em lei. Quando apenas a defesa recorre, a regra do art. 617 impede agravar a pena; devem ser considerados limites da devolução e peculiaridades do recurso."]],"map":["Nulidade → prejuízo","Emendatio → nova classificação","Mutatio → alteração fática pertinente","Recurso exclusivo da defesa → vedação de piora"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Juizados especiais, habeas corpus e revisão criminal","ref":"Lei 9.099/1995, arts. 60 a 92; CPP, arts. 621 a 667","lessons":[["Juizados especiais criminais","A Lei 9.099/1995 disciplina infrações de menor potencial ofensivo e mecanismos consensuais. Composição civil e transação penal possuem condições e efeitos distintos. A suspensão condicional do processo usa como parâmetro a pena mínima igual ou inferior a um ano, além de requisitos legais, e pode alcançar crimes fora da competência do Juizado."],["Habeas corpus","O habeas corpus protege a liberdade de locomoção contra ilegalidade ou abuso, tanto em ameaça quanto em restrição existente. A análise exige identificar coação concreta e adequação do remédio. Não é instrumento universal para discutir qualquer direito desvinculado da liberdade de ir e vir."],["Revisão criminal","A revisão criminal permite rediscutir condenação definitiva nas hipóteses legais, como contrariedade ao texto expresso da lei penal ou à evidência dos autos e descoberta de novas provas nos termos do art. 621. Pode ser requerida mesmo após extinção da pena e não pode agravar a situação do condenado."]],"map":["JECRIM → menor potencial ofensivo","Suspensão do processo → pena mínima até 1 ano","HC → locomoção","Revisão → condenação definitiva"],"url":"https://www.planalto.gov.br/ccivil_03/leis/l9099.htm","extraUrl":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"}];const processPenalQuestions=/*BANK:processPenalQuestions*/null;const adminModules=[{"t":"Princípios e regime jurídico administrativo","ref":"CF, art. 37; Lei 9.784/1999, art. 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Regime jurídico","A administração exerce competências destinadas a fins públicos, sujeita a limites legais e constitucionais. Prerrogativas administrativas não representam poderes ilimitados: exigem finalidade legítima, motivação quando cabível e proporcionalidade. Diferencie a atuação estatal da liberdade de contratar de um particular."
