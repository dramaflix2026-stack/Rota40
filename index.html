querySelector('.hero-fallback'),header=document.querySelector('.lp-header');const artState=()=>{const ready=img.complete&&img.naturalWidth>0;art.hidden=!ready;fallback.hidden=ready;header.hidden=ready};img.addEventListener('load',artState);img.addEventListener('error',artState);artState();const methodImg=document.getElementById('methodArtImage'),methodArt=document.querySelector('.method-art'),methodFallback=document.querySelectorAll('.method-fallback'),toolsSection=document.querySelector('.lp-tools');const methodState=()=>{const ready=methodImg.complete&&methodImg.naturalWidth>0;methodArt.hidden=!ready;methodFallback.forEach(el=>el.hidden=ready);toolsSection.classList.toggle('art-joined',ready)};methodImg.addEventListener('load',methodState);methodImg.addEventListener('error',methodState);methodState();const offerImg=document.getElementById('offerArtImage'),offerArt=document.querySelector('.offer-art'),offerFallback=document.querySelectorAll('.offer-art-fallback');const offerState=()=>{const ready=offerImg.complete&&offerImg.naturalWidth>0;offerArt.hidden=!ready;offerFallback.forEach(el=>el.hidden=ready)};offerImg.addEventListener('load',offerState);offerImg.addEventListener('error',offerState);offerState()}function openApp(){go(state.profileReady?'Painel':'Configurações')}function isRoute(v){return menu.includes(v)||(/^Disciplina:\d+$/.test(v)&&Number(v.split(':')[1])<subjects.length)}function go(v){stopTimer();if(!isRoute(v))v='Painel';view=v;queue=[];if(location.hash.slice(1)!==encodeURIComponent(v))history.pushState(null,'','#'+encodeURIComponent(v));if(state.session?.title===view&&resumeSession(false)){window.scrollTo(0,0);return}render();window.scrollTo(0,0)}function routeFromHash(){stopTimer();let v='';try{v=decodeURIComponent(location.hash.slice(1))}catch{}if(!v){home();return}view=isRoute(v)?v:'Painel';queue=[];if(state.session?.title===view&&resumeSession(false))return;render()}window.addEventListener('popstate',routeFromHash);function toggleMenu(){const s Já existe um treino em andamento. Iniciar outro encerra o anterior. Continuar?'))return;stopTimer();view=title;queue=list;pos=0;answered=false;selectedAnswer=null;sessionScore=0;state.session={title,deadline:title==='Simulados'?Date.now()+list.length*3*60000:null,answers:[]};history.pushState(null,'','#'+encodeURIComponent(title));persistSession();question()}function resumeSession(navigate=true){const s=state.session;if(!s)return false;const items=s.ids.map(id=>qs.find(q=>q.id===id));if(items.some(q=>!q)||!items.length){state.session=null;save();return false}stopTimer();view=s.title;queue=items;pos=s.pos;answered=s.answered;selectedAnswer=s.selectedAnswer;sessionScore=s.score;if(navigate)history.pushState(null,'','#'+encodeURIComponent(view));question();return true}function endSession(timedOut=false){stopTimer();const s=state.session;if(!s)return;const result={title:view,score:sessionScore,total:queue.length,date:Date.now(),timedOut,answers:s.answers||[]};state.results.push(result);state.session=null;save();layout(`<div class="panel"><h2>${timedOut?'Tempo encerrado':'Treino concluído'}</h2><p class="metric">${result.score}/${result.total}</p><p class="muted">Acertos nesta sessão de exemplo, não uma estimativa da nota oficial.</p>${view==='Simulados'?result.answers.map(x=>{const q=qs.find(y=>y.id===x.id);return '<div class="listline"><strong>'+(x.correct?'✓ ':'✕ ')+q.q+'</strong><p>'+q.e+'</p>'+linkSource(q)+'</div>'}).join(''):''}<div class="sessiontools"><button class="btn" onclick="go('Minha rota')">Ver próxima rota</button><button class="btn alt" onclick="go('Meu desempenho')">Ver desempenho</button></div></div>`)}function tick(){if(!state.session?.deadline){stopTimer();return}const remaining=Math.max(0,Math.ceil((state.session.deadline-Date.now())/1000)),t=document.getElementById('timer');if(t)t.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(!remaining)endSession(true)}function question(){stopTimer();if(!state.session)return;if(state.session.deadline&&Date.now()>=state.session.deadline){endSession(true);return}if(pos>=queue.length){endSession();return}const q=queue[pos];layout(`<div class="panel question"><div class="smallrow"><span class="tag">${subjects[q.s]}</span><span class="tag">${pos+1} de ${queue.length}</span></div>${view==='Simulados'?'<div class="smallrow"><span class="label">Tempo restante</span><span class="timer" id="timer"></span></div>':''}<div class="progressline"><i style="width:${(pos+(answered?1:0))/queue.length*100}%"></i></div><h3>${q.q}</h3>${q.a.map((a,i)=>`<button class="option" data-i="${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="feedback"></div><div class="sessiontools"><button class="btn alt" onclick="go('Painel')">Salvar e voltar</button></div></div>`);if(answered)showAnswer();if(state.session?.deadline){tick();if(state.session)timerId=setInterval(tick,1000)}}function showAnswer(){const q=queue[pos],i=selectedAnswer,correct=i===q.ok,simulation=view==='Simulados';document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(!simulation){if(k===q.ok)b.classList.add('correct');else if(k===i)b.classList.add('wrong')}else if(k===i){b.style.borderColor='#b18a48'}});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${simulation?'Resposta registrada':correct?'Resposta correta':'Vamos revisar este ponto'}</strong>${simulation?'<p>O gabarito será exibido ao final.</p>':`<p>${q.e}</p><p>${linkSource(q)}</p>`}</div><button class="btn" onclick="nextQuestion()">${pos+1===queue.length?'Ver resultado':'Próxima questão →'}</button>`}function answer(i){if(answered||!state.session||i<0||i>=queue[pos].a.length)return;if(state.session.deadline&&Date.now()>=state.session.deadline){endSession(true);return}answered=true;selectedAnswer=i;const q=queue[pos],correct=i===q.ok;sessionScore+=Number(correct);state.attempts.push({id:q.id,correct,date:Date.now()});state.session.answers.push({id:q.id,correct,selected:i});persistSession();showAnswer()}function nextQuestion(){if(!answered)return;pos++;answered=false;selectedAnswer=null;persistSession();question()}function trainSelected(){const v=document.getElementById('questionSubject').value;train(v===''?undefined:Number(v))}function train(s){const arr=s===undefined?qs:qs.filter(q=>q.s===s);if(arr.length)start(arr,'Questões')}function profileForm(){return `<form class="profileform" onsubmit="saveProfile(event)"><label>Data da sua prova (opcional)<input type="date" id="examDate" value="${/^\d{4}-\d{2}-\d{2}$/.test(state.examDate)?state.examDate:''}"></label><label>Tempo diário<select id="dailyMinutes">${[15,30,45,60,90,120].map(n=>'<option '+(n===state.minutes?'selected':'')+' value="'+n+'">'+n+' minutos</option>').join('')}</select></label><button class="btn" type="submit">Salvar e continuar →</button></form>`}function saveProfile(e){e.preventDefault();const d=document.getElementById('examDate').value;state.examDate=/^\d{4}-\d{2}-\d{2}$/.test(d)?d:'';state.minutes=Number(document.getElementById('dailyMinutes').value);state.profileReady=true;save();go(state.attempts.length?'Minha rota':'Diagnóstico')}function reviewCard(known){const q=qs[flash%qs.length],prev=state.reviews[q.id]||{interval:0};const interval=known?Math.min(30,Math.max(1,prev.interval*2)):0;state.reviews[q.id]={interval,due:Date.now()+(known?interval*86400000:600000)};save();flash++;showBack=false;render()}function filterSubjects(value){const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let count=0;document.querySelectorAll('[data-subject]').forEach(el=>{const ok=norm(subjects[Number(el.dataset.subject)]).includes(norm(value));el.classList.toggle('hidden',!ok);if(ok)count++});document.getElementById('noSubjects').classList.toggle('hidden',count!==0)}function render(){const attempts=state.attempts,correct=attempts.filter(x=>x.correct).length,errors=qs.filter(q=>last()[q.id]?.correct===false);let b='';if(view==='Diagnóstico'){b=`<div class="panel"><span class="tileicon gold">${ico('Diagnóstico')}</span><h3 style="margin-top:14px">Descubra seu ponto de partida</h3><p class="muted" style="margin:8px 0 16px">Faça o diagnóstico demonstrativo para conhecer o fluxo. São quatro questões de exemplo, não uma avaliação representativa do exame.</p><button class="btn" onclick="start(qs,'Diagnóstico')">Começar diagnóstico →</button></div>`}else if(view==='Meu desempenho'){b=`<p class="muted">Acompanhe o seu histórico de treino neste navegador.</p><div class="grid"><div class="tile"><div class="label">Respostas registradas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros pendentes</div><div class="metric">${errors.length}</div></div></div><div class="panel"><h3>Desempenho por disciplina</h3><p class="muted">Somente questões respondidas são consideradas.</p>${subjects.map((s,i)=>{const a=attempts.filter(x=>qs.some(q=>q.id===x.id&&q.s===i));const p=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0;return '<div class="listline"><div class="smallrow"><strong>'+s+'</strong><span class="muted">'+(a.length?p+'%':'Sem dados')+'</span></div>'+(a.length?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}).join('')}</div>`}else if(view==='Provas anteriores'){b=`<div class="panel empty"><span class="tileicon">${ico(view)}</span><h3>Biblioteca de provas anteriores</h3><p class="muted">A estrutura está pronta para receber cadernos, gabaritos e filtros por edição. O acervo será incluído na etapa de conteúdo.</p><p><a class="link" href="https://oab.fgv.br/" target="_blank" rel="noopener noreferrer">Consultar portal oficial do exame ↗</a></p></div>`}else if(view==='Configurações'){b=`<div class="panel"><h3>${state.profileReady?'Preferências de estudo':'Vamos configurar sua preparação'}</h3><p class="muted" style="margin:8px 0 18px">Informe o tempo diário e a data da prova. Os dados ficam neste navegador.</p>${profileForm()}<div class="settingsrow"><strong>Meta de treinamento sugerida</strong><strong>45/80</strong></div><div class="settingsrow"><div><strong>Conta e sincronização</strong><div class="muted">Autenticação ainda não integrada.</div></div><span class="badge-mini">Em preparação</span></div></div>`}else if(view==='Ajuda'){b=`<div class="panel"><h3>Como usar o Rota 40</h3><div class="listline"><strong>1. Comece pelo diagnóstico</strong><p class="muted">Conheça o fluxo de questões e respostas.</p></div><div class="listline"><strong>2. Abra Minha rota</strong><p class="muted">Defina o tempo que tem disponível e veja as prioridades.</p></div><div class="listline"><strong>3. Revise e acompanhe</strong><p class="muted">Use o caderno de erros e o painel de desempenho.</p></div><div class="notice">Prévia não comercial. As informações ficam apenas neste navegador. Não há conta, cobrança ou mentor IA ativo.</div><button class="btn alt" onclick="go('Diagnóstico')">Começar diagnóstico</button></div>`}else if(view.startsWith('Disciplina:')){const i=Number(view.split(':')[1]),n=qs.filter(q=>q.s===i).length;b=`<button class="breadcrumb" onclick="go('Disciplinas')">${ico('Página inicial')} Todas as disciplinas</button><div class="panel"><div class="tilehead"><span class="tileicon gold">${ico('Disciplinas')}</span><div><h3>${subjects[i]}</h3><p class="muted">Trilha de preparação · primeira fase</p></div></div></div><h3 class="sectiontitle">Materiais e ferramentas</h3><div class="grid two">${['Teoria resumida','Legislação comentada','Mapas mentais','Questões comentadas','Flashcards','Revisão da disciplina'].map(m=>`<div class="tile"><div class="tilehead"><span class="tileicon">${ico(m==='Questões comentadas'?'Questões':m==='Flashcards'?'Flashcards':'Disciplinas')}</span><div class="tilecopy"><strong>${m}</strong><div class="muted">${m==='Questões comentadas'&&n?n+' questão demonstrativa':'Conteúdo em preparação'}</div></div></div>${m==='Questões comentadas'&&n?`<button class="btn alt" onclick="train(${i})">Praticar →</button>`:''}</div>`).join('')}</div>`}else if(view==='Painel'){b=`<p class="muted">Comece pelo diagnóstico e siga sua próxima missão.</p>${state.session?`<div class="panel" style="margin:15px 0"><h3>Treino em andamento</h3><p class="muted">${state.session.title} · questão ${Math.min(state.session.pos+1,state.session.ids.length)} de ${state.session.ids.length}</p><button class="btn" style="margin-top:10px" onclick="resumeSession()">Continuar treino →</button></div>`:""}<div class="panel mission"><div class="eyebrow" style="color:#dec38c">Sua missão</div><h2>${attempts.length?'Continue sua rota':'Descubra seu ponto de partida'}</h2><p>${attempts.length?'Priorize as questões ainda não dominadas.':'Responda às quatro questões de demonstração.'}</p><button class="btn gold" onclick="${attempts.length?"go('Minha rota')":"go('Diagnóstico')"}">${attempts.length?'Iniciar revisão':'Iniciar diagnóstico'} →</button></div><div class="grid"><div class="tile"><div class="label">Questões respondidas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros para revisar</div><div class="metric">${errors.length}</div></div></div><h3 class="sectiontitle">Estudo e prática</h3><div class="grid two">${['Disciplinas','Questões','Simulados','Provas anteriores'].map(m=>actionTile(m)).join('')}</div><h3 class="sectiontitle">Revisão e acompanhamento</h3><div class="grid two">${['Caderno de erros','Flashcards','Meu desempenho','Mentor IA'].map(m=>actionTile(m)).join('')}</div>`}else if(view==='Minha rota'){const d=daysLeft(),plan=routePlan();b=`<div class="panel mission"><div class="eyebrow" style="color:#dec38c">${d!==null&&d>=0&&d<=14?'Reta final':'Sua preparação diária'}</div><h2>${state.minutes} minutos para avançar</h2><p>${d===null?'Defina a data da prova nas configurações.':d<0?'Atualize a data da prova.':d===0?'Hoje é a data de prova informada.':d+' dias até a data informada.'} Rota baseada em regras e quatro questões de exemplo.</p><button class="btn gold" onclick="start(routePlan(),'Minha rota')">Começar missão →</button></div><div class="panel"><div class="smallrow"><h3>Prioridades de hoje</h3><button class="btn alt" onclick="go('Configurações')">Ajustar perfil</button></div>${plan.map(q=>`<div class="listline"><div class="smallrow"><strong>${subjects[q.s]}</strong><span class="muted">${last()[q.id]?.correct===false?'Refazer erro':!last()[q.id]?'Praticar':'Consolidar'}</span></div></div>`).join('')}<p class="muted" style="margin-top:14px">A incidência histórica das provas será integrada após curadoria do acervo.</p></div>`}else if(view==='Disciplinas'){b=`<p class="muted">Escolha uma das 20 matérias para explorar sua trilha. O conteúdo completo será incluído na próxima etapa.</p><label class="searchbox">${ico('search')}<input aria-label="Buscar disciplina" placeholder="Buscar disciplina..." oninput="filterSubjects(this.value)"></label><div class="catalog" id="catalog">${subjects.map((s,i)=>`<button class="tile action" data-subject="${i}" onclick="go('Disciplina:${i}')"><div class="tilehead"><span class="tileicon">${ico('Disciplinas')}</span><div class="tilecopy"><strong>${s}</strong><div class="muted">Abrir trilha</div></div><span class="arrow">${ico('arrow')}</span></div></button>`).join('')}</div><p class="muted hidden" id="noSubjects">Nenhuma disciplina encontrada.</p>`}else if(view==='Questões'){b=`<div class="panel"><h3>Banco de questões — amostra</h3><p>Quatro exercícios autorais ilustrativos com fundamentação legal.</p><div class="filterrow"><select id="questionSubject" aria-label="Filtrar matéria"><option value="">Todas as matérias</option>${subjects.map((s,i)=>`<option value="${i}" ${qs.some(q=>q.s===i)?"":"disabled"}>${s}</option>`).join("")}</select><button class="btn" onclick="trainSelected()">Iniciar treino</button></div></div>`}else if(view==='Simulados'){b=`<div class="panel"><h3>Mini-simulado demonstrativo</h3><p class="muted">4 questões · 12 minutos · gabarito ao final. Não representa a distribuição ou dificuldade de uma prova oficial de 80 questões.</p><button class="btn" style="margin-top:12px" onclick="start(qs,'Simulados')">Começar mini-simulado</button></div>`}else if(view==='Caderno de erros'){b=`<div class="panel"><h3>${errors.length?'Seus pontos de revisão':'Nenhum erro pendente'}</h3>${errors.length?errors.map(q=>`<div class="listline"><strong>${subjects[q.s]}</strong><p>${q.q}</p></div>`).join(''):'<p class="muted">As questões que você errar aparecerão aqui.</p>'}<button class="btn" ${errors.length?'':'disabled'} style="margin-top:12px" onclick="start(qs.filter(q=>last()[q.id]?.correct===false),'Caderno de erros')">Refazer erros</button></div>`}else if(view==='Flashcards'){const q=qs[flash%qs.length];b=`<div class="panel question"><div class="label">Cartão ${flash%qs.length+1} de ${qs.length} · ${subjects[q.s]}</div><p class="muted">${state.reviews[q.id]?state.reviews[q.id].due<=Date.now()?"Revisão disponível":"Próxima revisão: "+new Date(state.reviews[q.id].due).toLocaleString("pt-BR"):"Ainda não revisado"}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="reviewCard(false)">Revisar em 10 min</button><button class="btn alt" onclick="reviewCard(true)">Já sei · agendar revisão</button>`:`<button class="btn alt" onclick="flash++;showBack=false;render()">Próximo cartão</button>`}</div></div>`}else{b=`<div class="panel"><h3>Mentor Jurídico IA</h3><p class="notice">Integração de IA ainda não configurada. Nenhuma resposta de IA será simulada como se fosse real.</p><p class="muted">A versão planejada consultará legislação oficial, explicará questões com fontes e sinalizará incertezas. Por enquanto, você pode consultar as explicações fundamentadas do banco demonstrativo.</p><button class="btn alt" style="margin-top:14px" onclick="go('Questões')">Acessar questões comentadas</button></div>`}layout(b)}routeFromHash();
</script></body></html>
