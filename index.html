<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14253b"><title>Rota 40 — by Eduverso | Prévia</title><style>
:root{--navy:#14253b;--gold:#b18a48;--ink:#19283b;--muted:#617085;--line:#e3e7eb;--paper:#f6f7f9;--green:#287453}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #b18a48;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,5vw,3.9rem);line-height:1.1;letter-spacing:-.055em}h2{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.035em}h3{font-size:1.05rem}.muted{color:var(--muted)}.brand{font-weight:850;letter-spacing:-.04em;font-size:1.5rem;white-space:nowrap}.brand b{color:var(--gold)}.brand small{display:block;font-size:.59rem;letter-spacing:.15em;font-weight:650;color:var(--muted)}.wrap{width:min(1120px,92%);margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px}.btn{display:inline-block;background:var(--navy);border:1px solid var(--navy);border-radius:9px;color:white;font-weight:650;padding:12px 20px;text-decoration:none}.btn.alt{background:white;color:var(--navy);border-color:var(--line)}.btn.gold{background:#dec38c;color:#15253a;border-color:#dec38c}.btn:disabled{opacity:.5;cursor:not-allowed}.eyebrow{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--gold)}.hero{background:var(--navy);color:white;padding:70px 0}.hero .muted{color:#ced7e1}.hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:48px;align-items:center}.hero h1{max-width:650px;margin:14px 0 19px}.hero p{max-width:550px;margin-bottom:24px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--ink)}.demo-panel{transform:rotate(-1deg);box-shadow:0 18px 44px #0003}.label{font-size:.76rem;font-weight:700;color:var(--muted)}.metric{font-size:2rem;line-height:1.25;font-weight:800;letter-spacing:-.045em}.bar{background:#e8edf0;height:9px;border-radius:100px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--green);border-radius:100px}.smallrow{display:flex;justify-content:space-between;align-items:center;gap:8px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.section{padding:45px 0}.section h2{margin:8px 0}.section p{margin-top:8px}.price{max-width:550px;margin:auto;text-align:center}.price .metric{font-size:3rem}.footer{border-top:1px solid var(--line);padding:25px 0;font-size:.84rem;color:var(--muted)}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:white;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh}.side .brand{padding:0 10px 18px}.side button{display:block;text-align:left;width:100%;border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:8px;margin:3px 0}.side button.active{background:#edf1f6;color:var(--navy);font-weight:750}.side .home{margin-top:20px;border:1px solid var(--line)}.content{width:min(100%,1000px);padding:30px 36px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.preview{font-size:.73rem;background:#fff5df;color:#735521;padding:5px 9px;border-radius:6px;white-space:nowrap}.mission{background:var(--navy);color:white;margin:18px 0}.mission p{color:#d1dce6;margin:7px 0 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:15px 0}.grid.two{grid-template-columns:repeat(2,1fr)}.tile{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;color:var(--ink);min-width:0}.tile button{margin-top:12px}.tile.action{cursor:pointer}.tile.action:hover{border-color:var(--gold)}.question{max-width:720px;margin-top:18px}.option{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:9px;margin:9px 0;padding:12px}.option.correct{border-color:#287453;background:#e9f6ef}.option.wrong{border-color:#a94c4c;background:#fff0ef}.option:disabled{cursor:default;color:var(--ink)}.feedback{padding:14px;background:#f0f4f7;border-radius:9px;margin:12px 0}.tag{font-size:.75rem;color:var(--muted);display:inline-block;margin-bottom:9px}.listline{padding:12px 0;border-bottom:1px solid var(--line)}.mobilebar{display:none}.notice{background:#fff5df;color:#735521;padding:12px 14px;border-radius:9px;font-size:.83rem;margin:15px 0}.link{color:#1e567e;text-decoration:underline}.hidden{display:none!important}select{font:inherit;border:1px solid var(--line);border-radius:7px;background:white;padding:9px;color:var(--ink)}@media(max-width:760px){.hero{padding:42px 0}.hero-grid,.steps{grid-template-columns:1fr;gap:22px}.demo-panel{transform:none}.app{display:block}.side{height:auto;position:static;display:none;border-right:0;border-bottom:1px solid var(--line)}.side.open{display:block}.mobilebar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:white;border-bottom:1px solid var(--line)}.mobilebar button{background:white;border:1px solid var(--line);border-radius:8px;padding:7px 13px}.content{padding:22px 16px}.grid{grid-template-columns:repeat(2,1fr)}.grid.two{grid-template-columns:1fr}.top{align-items:flex-start}.panel{padding:17px}.metric{font-size:1.65rem}}@media(max-width:390px){.grid{grid-template-columns:1fr}.nav .btn{padding:9px 11px}.preview{white-space:normal}}
</style></head><body><div id="root"></div><script>
const subjects=['Ética Profissional','Direito Constitucional','Direito Civil','Processo Civil','Direito Penal','Processo Penal','Direito Administrativo','Direito Tributário','Direito do Trabalho','Processo do Trabalho','Direito Empresarial','Direitos Humanos','Direito Ambiental','Direito Internacional','Direito do Consumidor','ECA','Filosofia do Direito','Direito Eleitoral','Direito Financeiro','Direito Previdenciário'];
const qs=[{id:1,s:1,q:'Segundo a Constituição Federal, qual é o prazo de validade de um concurso público?',a:['Até um ano, sem prorrogação','Até dois anos, prorrogável uma vez por igual período','Sempre quatro anos','Indeterminado'],ok:1,e:'O art. 37, III, da Constituição prevê validade de até dois anos, prorrogável uma vez por igual período.',src:'Constituição Federal, art. 37, III',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'},{id:2,s:2,q:'Em regra, em qual idade cessa a menoridade civil?',a:['16 anos','21 anos','18 anos completos','25 anos'],ok:2,e:'O art. 5º do Código Civil prevê que a menoridade cessa aos dezoito anos completos, ressalvadas as hipóteses legais de emancipação.',src:'Código Civil, art. 5º',url:'https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm'},{id:3,s:4,q:'Qual princípio impede que uma conduta seja considerada crime sem lei anterior que a defina?',a:['Legalidade penal','Publicidade','Eficiência','Contraditório'],ok:0,e:'O art. 1º do Código Penal estabelece que não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal.',src:'Código Penal, art. 1º',url:'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'},{id:4,s:0,q:'Qual instituição é indispensável à administração da justiça nos termos do art. 133 da Constituição?',a:['A advocacia','O registro de imóveis','A junta comercial','O tribunal de contas'],ok:0,e:'A Constituição afirma a indispensabilidade do advogado à administração da justiça, nos limites da lei.',src:'Constituição Federal, art. 133',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'}];
let state={attempts:[],minutes:30};try{state={...state,...JSON.parse(localStorage.getItem('rota40-preview')||'{}')}}catch{};const save=()=>{try{localStorage.setItem('rota40-preview',JSON.stringify(state))}catch{}};let view='Painel',queue=[],pos=0,answered=false,flash=0,showBack=false,sessionScore=0;const root=document.getElementById('root');const brand='<div class="brand">ROTA <b>40</b><small>BY EDUVERSO</small></div>';const menu=['Painel','Minha rota','Disciplinas','Questões','Simulados','Caderno de erros','Flashcards','Mentor IA'];const last=()=>Object.fromEntries(state.attempts.map(x=>[x.id,x]));const weak=()=>qs.filter(q=>!last()[q.id]?.correct).sort((a,b)=>Number(!last()[a.id])-Number(!last()[b.id]));const linkSource=q=>`<a class="link" href="${q.url}" target="_blank" rel="noopener noreferrer">${q.src}</a>`;function home(){root.innerHTML=`<header class="wrap nav">${brand}<button class="btn alt" onclick="openApp()">Acessar prévia</button></header><main><section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Preparação para a primeira fase da OAB</div><h1>Estude com direção.<br>Avance questão por questão.</h1><p class="muted">Descubra seus pontos fracos, organize sua rotina e acompanhe sua evolução rumo aos 40 acertos.</p><button class="btn gold" onclick="openApp()">Conhecer a plataforma →</button></div><div class="panel demo-panel"><div class="label">Exemplo de painel</div><div class="metric">36/80</div><div class="bar"><i style="width:45%"></i></div><p class="muted">Meta de treinamento: 45 acertos</p><hr style="border:0;border-top:1px solid #e3e7eb"><h3>Sua missão de hoje</h3><div class="listline">✓ Revisar Ética Profissional</div><div class="listline">○ Praticar Direito Penal</div><div class="listline">○ Refazer questões erradas</div></div></div></section><section class="section wrap"><div class="eyebrow">Como funciona</div><h2>Três passos. Uma rota clara.</h2><div class="steps">${[['01','Descubra seu nível','Resolva questões e identifique suas dificuldades.'],['02','Siga sua rota','Priorize os assuntos que precisam de atenção.'],['03','Acompanhe o progresso','Revise os erros e evolua com prática.']].map(x=>`<div class="panel"><div class="eyebrow">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join('')}</div></section><section class="section wrap"><div class="panel price"><div class="eyebrow">Oferta proposta · ainda indisponível</div><h2>Rota 40</h2><div class="metric">R$ 69,90</div><p class="muted">90 dias de acesso · pagamento único</p><p>Questões, rota de estudo, simulados e revisão.</p><p><button class="btn" onclick="openApp()">Explorar demonstração</button></p><div class="notice">Prévia de desenvolvimento. Não há cobrança, promessa de aprovação ou vínculo oficial com a OAB.</div></div></section></main><footer class="footer wrap">Rota 40 by Eduverso · Plataforma independente de estudos · Prévia não comercial</footer>`}function openApp(){go('Painel')}function go(v){view=v;queue=[];render()}function layout(body){root.innerHTML=`<div class="mobilebar">${brand}<button onclick="document.querySelector('.side').classList.toggle('open')" aria-label="Abrir menu">Menu ☰</button></div><div class="app"><aside class="side">${brand}${menu.map(m=>`<button class="${m===view?'active':''}" onclick="go('${m}')">${m}</button>`).join('')}<button class="home" onclick="home()">← Página inicial</button></aside><main class="content"><div class="top"><div><div class="eyebrow">Sua preparação</div><h2>${view}</h2></div><span class="preview">Prévia interativa</span></div>${body}<div class="footer" style="margin-top:25px">Dados locais deste navegador. Conteúdo demonstrativo, sujeito a revisão jurídica.</div></main></div>`}function start(list,title){view=title;queue=list;pos=0;answered=false;sessionScore=0;question()}function question(){if(pos>=queue.length){layout(`<div class="panel"><h2>Treino concluído</h2><p class="metric">${sessionScore}/${queue.length}</p><p>Acertos nesta sessão.</p><button class="btn" onclick="go('Painel')">Voltar ao painel</button></div>`);return}const q=queue[pos];layout(`<div class="panel question"><div class="smallrow"><span class="tag">${subjects[q.s]}</span><span class="tag">${pos+1} de ${queue.length}</span></div><h3>${q.q}</h3>${q.a.map((a,i)=>`<button class="option" data-i="${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="feedback"></div></div>`)}function answer(i){if(answered)return;answered=true;const q=queue[pos],correct=i===q.ok;sessionScore+=Number(correct);state.attempts.push({id:q.id,correct});save();document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===q.ok)b.classList.add('correct');else if(k===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${correct?'Resposta correta':'Vamos revisar este ponto'}</strong><p>${q.e}</p><p>${linkSource(q)}</p></div><button class="btn" onclick="pos++;answered=false;question()">${pos+1===queue.length?'Ver resultado':'Próxima questão →'}</button>`}function train(s){const arr=s===undefined?qs:qs.filter(q=>q.s===s);if(arr.length)start(arr,'Questões')}function render(){const attempts=state.attempts,correct=attempts.filter(x=>x.correct).length,errors=qs.filter(q=>last()[q.id]?.correct===false);let b='';if(view==='Painel'){b=`<p class="muted">Comece pelo diagnóstico e siga sua próxima missão.</p><div class="panel mission"><div class="eyebrow" style="color:#dec38c">Sua missão</div><h2>${attempts.length?'Continue sua rota':'Descubra seu ponto de partida'}</h2><p>${attempts.length?'Priorize as questões ainda não dominadas.':'Responda às quatro questões de demonstração.'}</p><button class="btn gold" onclick="start(weak().length?weak():qs,'Minha rota')">${attempts.length?'Iniciar revisão':'Iniciar diagnóstico'} →</button></div><div class="grid"><div class="tile"><div class="label">Questões respondidas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros para revisar</div><div class="metric">${errors.length}</div></div></div><h3>Explore as ferramentas</h3><div class="grid two">${menu.slice(2).map(m=>`<button class="tile action" onclick="go('${m}')"><strong>${m}</strong><div class="muted">Acessar →</div></button>`).join('')}</div>`}else if(view==='Minha rota'){b=`<div class="panel"><h3>Tempo disponível por dia</h3><p class="muted">A rota de demonstração prioriza erros e questões ainda não respondidas.</p><p style="margin:12px 0"><select onchange="state.minutes=Number(this.value);save();render()">${[15,30,45,60,90].map(n=>`<option ${n===state.minutes?'selected':''}>${n}</option>`).join('')}</select> minutos</p><h3>Prioridades</h3>${(weak().length?weak():qs).slice(0,Math.max(1,Math.floor(state.minutes/10))).map(q=>`<div class="listline">${subjects[q.s]} · ${last()[q.id]?'Revisar':'Praticar'}</div>`).join('')}<button class="btn" style="margin-top:15px" onclick="start((weak().length?weak():qs).slice(0,Math.max(1,Math.floor(state.minutes/10))),'Minha rota')">Começar</button></div>`}else if(view==='Disciplinas'){b=`<p class="muted">Catálogo planejado das 20 disciplinas. Quatro possuem exercícios ilustrativos nesta prévia.</p><div class="grid two">${subjects.map((s,i)=>{const n=qs.filter(q=>q.s===i).length;return `<div class="tile"><h3>${s}</h3><p class="muted">${n?n+' questão demonstrativa':'Conteúdo em preparação'}</p><button class="btn alt" ${n?'':'disabled'} onclick="train(${i})">${n?'Praticar':'Em breve'}</button></div>`}).join('')}</div>`}else if(view==='Questões'){b=`<div class="panel"><h3>Banco de questões — amostra</h3><p>Quatro exercícios autorais ilustrativos com fundamentação legal.</p><button class="btn" style="margin-top:12px" onclick="train()">Iniciar treino</button></div>`}else if(view==='Simulados'){b=`<div class="panel"><h3>Mini-simulado demonstrativo</h3><p class="muted">4 questões. Não representa a distribuição ou dificuldade de uma prova oficial de 80 questões.</p><button class="btn" style="margin-top:12px" onclick="start(qs,'Simulados')">Começar mini-simulado</button></div>`}else if(view==='Caderno de erros'){b=`<div class="panel"><h3>${errors.length?'Seus pontos de revisão':'Nenhum erro pendente'}</h3>${errors.length?errors.map(q=>`<div class="listline"><strong>${subjects[q.s]}</strong><p>${q.q}</p></div>`).join(''):'<p class="muted">As questões que você errar aparecerão aqui.</p>'}<button class="btn" ${errors.length?'':'disabled'} style="margin-top:12px" onclick="start(qs.filter(q=>last()[q.id]?.correct===false),'Caderno de erros')">Refazer erros</button></div>`}else if(view==='Flashcards'){const q=qs[flash%qs.length];b=`<div class="panel question"><div class="label">Cartão ${flash%qs.length+1} de ${qs.length} · ${subjects[q.s]}</div><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button><button class="btn alt" onclick="flash++;showBack=false;render()">Próximo cartão</button></div></div>`}else{b=`<div class="panel"><h3>Mentor Jurídico IA</h3><p class="notice">Integração de IA ainda não configurada. Nenhuma resposta de IA será simulada como se fosse real.</p><p class="muted">A versão planejada consultará legislação oficial, explicará questões com fontes e sinalizará incertezas. Por enquanto, você pode consultar as explicações fundamentadas do banco demonstrativo.</p><button class="btn alt" style="margin-top:14px" onclick="go('Questões')">Acessar questões comentadas</button></div>`}layout(b)}home();
</script></body></html>
