ão","A lei só se aplica a fatos futuros","A pena aumenta automaticamente"],"ok":1,"e":"O art. 2º, caput, estabelece a abolitio criminis, inclusive para condenações definitivas, sem extinguir automaticamente efeitos civis.","src":"CP, arts. 1º a 12","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5002,"s":4,"module":0,"topic":"Princípios e aplicação da lei penal","difficulty":"Intermediária","q":"Qual teoria o Código Penal adota para definir o tempo do crime?","a":["Resultado","Ubiquidade","Atividade","Domicílio da vítima"],"ok":2,"e":"O art. 4º considera praticado o crime no momento da ação ou omissão, ainda que o resultado ocorra em outro momento.","src":"CP, arts. 1º a 12","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5003,"s":4,"module":1,"topic":"Teoria do crime: fato típico, dolo e culpa","difficulty":"Intermediária","q":"O agente incorre em erro sobre elemento constitutivo do tipo penal. Qual o efeito previsto no art. 20?","a":["Exclui o dolo, admitida punição culposa quando prevista e cabível","Exclui necessariamente toda consequência jurídica","Aumenta a pena em dobro","Equivale sempre a erro de proibição"],"ok":0,"e":"O erro de tipo essencial exclui dolo; a modalidade culposa pode subsistir quando legalmente prevista e caracterizada.","src":"CP, arts. 13, 18 a 20","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5004,"s":4,"module":1,"topic":"Teoria do crime: fato típico, dolo e culpa","difficulty":"Intermediária","q":"Quando uma conduta pode ser punida na modalidade culposa, segundo a regra do art. 18?","a":["Em qualquer crime automaticamente","Sempre que houver dano patrimonial","Quando a vítima solicitar","Quando houver previsão expressa em lei"],"ok":3,"e":"O parágrafo único do art. 18 estabelece que, salvo casos expressos em lei, ninguém pode ser punido por fato previsto como crime senão quando o pratica dolosamente.","src":"CP, arts. 13, 18 a 20","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5005,"s":4,"module":2,"topic":"Consumação, tentativa e desistência","difficulty":"Intermediária","q":"Iniciada a execução, o agente voluntariamente deixa de prosseguir. Qual regra incide, presentes os requisitos legais?","a":["Tentativa obrigatória","Desistência voluntária, respondendo pelos atos já praticados","Arrependimento posterior","Consumação presumida"],"ok":1,"e":"O art. 15 disciplina desistência voluntária e arrependimento eficaz, com responsabilidade pelos atos já praticados.","src":"CP, arts. 14 a 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5006,"s":4,"module":2,"topic":"Consumação, tentativa e desistência","difficulty":"Intermediária","q":"Em regra, qual a redução prevista para tentativa, quando não houver disposição especial?","a":["Um sexto","Metade obrigatoriamente","Um a dois terços","Não há redução"],"ok":2,"e":"O art. 14, parágrafo único, prevê diminuição de um a dois terços da pena correspondente ao crime consumado.","src":"CP, arts. 14 a 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5007,"s":4,"module":3,"topic":"Ilicitude e culpabilidade","difficulty":"Intermediária","q":"O agente incorre em erro inevitável sobre a ilicitude do fato. Qual efeito?","a":["Majoração obrigatória da pena","Exclusão automática da tipicidade objetiva","Conversão em crime culposo","Isenção de pena"],"ok":3,"e":"O art. 21 prevê isenção de pena para erro inevitável de proibição; se evitável, admite diminuição de um sexto a um terço.","src":"CP, arts. 21 a 28","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5008,"s":4,"module":3,"topic":"Ilicitude e culpabilidade","difficulty":"Intermediária","q":"Uma pessoa de dezessete anos pratica fato descrito como crime. Qual regra constitucional e penal se aplica?","a":["É penalmente inimputável, sujeita à legislação especial","É plenamente imputável pela natureza do fato","A imputabilidade depende apenas da escolaridade","Responde sempre pelo Código Penal como adulta"],"ok":0,"e":"O art. 27 do CP estabelece inimputabilidade penal dos menores de dezoito anos; aplica-se a legislação especial.","src":"CP, arts. 21 a 28","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5009,"s":4,"module":4,"topic":"Concurso de pessoas e concurso de crimes","difficulty":"Intermediária","q":"Em regra, circunstância pessoal de um concorrente comunica-se aos demais?","a":["Sim, em qualquer situação","Não, salvo quando elementar do crime","Sim, apenas em crimes culposos","Não, nem quando elementar"],"ok":1,"e":"O art. 30 determina incomunicabilidade das circunstâncias e condições pessoais, salvo quando elementares.","src":"CP, arts. 29 a 31 e 69 a 71","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5010,"s":4,"module":4,"topic":"Concurso de pessoas e concurso de crimes","difficulty":"Intermediária","q":"Mediante ações distintas, um agente comete dois crimes sem hipótese de continuidade ou outra regra especial. Qual regime geral?","a":["Crime único obrigatório","Concurso formal necessariamente","Concurso material, com aplicação cumulativa das penas","Extinção do segundo crime"],"ok":2,"e":"O art. 69 disciplina concurso material quando mais de uma ação ou omissão produz dois ou mais crimes.","src":"CP, arts. 29 a 31 e 69 a 71","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5011,"s":4,"module":5,"topic":"Penas, dosimetria e extinção da punibilidade","difficulty":"Intermediária","q":"Em qual fase do método trifásico são consideradas agravantes e atenuantes?","a":["Segunda","Primeira","Terceira","Somente na execução penal"],"ok":0,"e":"O art. 68 estabelece pena-base, agravantes e atenuantes e, por último, causas de aumento e diminuição.","src":"CP, arts. 32 a 68 e 107 a 120","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5012,"s":4,"module":5,"topic":"Penas, dosimetria e extinção da punibilidade","difficulty":"Intermediária","q":"Qual evento constitui causa de extinção da punibilidade expressa no art. 107?","a":["Mudança de endereço do réu","Pagamento de qualquer dívida privada","Alteração do advogado","Morte do agente"],"ok":3,"e":"O art. 107, I, prevê morte do agente como causa de extinção da punibilidade.","src":"CP, arts. 32 a 68 e 107 a 120","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5013,"s":4,"module":6,"topic":"Crimes contra a pessoa","difficulty":"Intermediária","q":"Uma pessoa imputa falsamente a outra fato definido como crime, atingindo sua honra. Qual tipo básico corresponde à descrição?","a":["Difamação necessariamente","Calúnia","Ameaça","Dano"],"ok":1,"e":"O art. 138 define calúnia pela falsa imputação de fato definido como crime.","src":"CP, arts. 121 a 154-B","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5014,"s":4,"module":6,"topic":"Crimes contra a pessoa","difficulty":"Intermediária","q":"Após a Lei 14.994/2024, em qual dispositivo do Código Penal está previsto o tipo autônomo de feminicídio?","a":["Art. 129","Art. 155","Art. 121-A","Art. 171"],"ok":2,"e":"A Lei 14.994/2024 introduziu o art. 121-A, tornando o feminicídio crime autônomo. A redação vigente e as causas de aumento devem ser consultadas.","src":"Lei 14.994/2024; CP, art. 121-A","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14994.htm"},{"id":5015,"s":4,"module":7,"topic":"Crimes contra o patrimônio","difficulty":"Intermediária","q":"Qual elemento distingue, em sua descrição típica básica, o roubo do furto simples?","a":["Valor necessariamente superior a um salário mínimo","Existência obrigatória de contrato","Participação de servidor público","Violência ou grave ameaça à pessoa, ou redução de resistência nos termos legais"],"ok":3,"e":"O art. 157 acrescenta elementos coercitivos à subtração, distinguindo-a do furto do art. 155.","src":"CP, arts. 155 a 183","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5016,"s":4,"module":7,"topic":"Crimes contra o patrimônio","difficulty":"Intermediária","q":"Qual tipo pressupõe, em sua configuração básica, apropriar-se de coisa alheia móvel de que o agente já tem posse ou detenção?","a":["Apropriação indébita","Calúnia","Homicídio","Corrupção passiva"],"ok":0,"e":"O art. 168 descreve apropriação indébita, diferenciando-a dos tipos que envolvem subtração ou obtenção mediante fraude.","src":"CP, arts. 155 a 183","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5017,"s":4,"module":8,"topic":"Crimes contra a administração pública","difficulty":"Intermediária","q":"Para fins penais, o exercício transitório e não remunerado de função pública impede o enquadramento como funcionário público?","a":["Sim, sempre","Não; o art. 327 contempla essas situações","Sim, se não houver concurso","Sim, se a pessoa não for estável"],"ok":1,"e":"O art. 327 considera funcionário público quem exerce cargo, emprego ou função pública, ainda que transitoriamente ou sem remuneração.","src":"CP, arts. 312 a 359-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5018,"s":4,"module":8,"topic":"Crimes contra a administração pública","difficulty":"Intermediária","q":"Qual verbo caracteriza especificamente o núcleo da concussão do art. 316?","a":["Difamar","Subtrair","Exigir vantagem indevida em razão da função","Destruir documento privado"],"ok":2,"e":"O art. 316 utiliza o verbo exigir vantagem indevida, em razão da função, distinguindo-se da solicitação prevista na corrupção passiva.","src":"CP, arts. 312 a 359-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5019,"s":4,"module":9,"topic":"Legislação penal especial e temas transversais","difficulty":"Intermediária","q":"As formas de violência previstas na Lei Maria da Penha restringem-se à violência física?","a":["Sim, exclusivamente","Sim, salvo dano patrimonial de grande valor","Sim, quando não houver lesão corporal","Não; incluem, entre outras, violência psicológica, sexual, patrimonial e moral"],"ok":3,"e":"O art. 7º da Lei 11.340/2006 enumera diferentes formas de violência doméstica e familiar contra a mulher.","src":"Lei 11.340/2006, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11340.htm"},{"id":5020,"s":4,"module":9,"topic":"Legislação penal especial e temas transversais","difficulty":"Intermediária","q":"Um delito não consta do rol legal de crimes hediondos nem possui outra previsão legal de equiparação. Sua gravidade, isoladamente, permite classificá-lo como hediondo?","a":["Não, a classificação depende de previsão legal","Sim, por decisão livre do julgador","Sim, se houver repercussão na imprensa","Sim, sempre que a pena superar dois anos"],"ok":0,"e":"A hediondez segue o rol e os critérios legais da Lei 8.072/1990; a gravidade isolada não substitui a previsão legal.","src":"Lei 8.072/1990","url":"https://www.planalto.gov.br/ccivil_03/leis/l8072.htm"}];const processPenalModules=[{"t":"Princípios e sistemas processuais","ref":"CPP, arts. 1º a 3º-A; CF, art. 5º","lessons":[["Estrutura acusatória","A acusação, a defesa e o julgamento exercem funções distintas. A imparcialidade judicial exige que a iniciativa investigativa e a atividade probatória da acusação não sejam substituídas pelo julgador. O art. 3º-A deve ser estudado em conjunto com a interpretação do STF sobre o sistema acusatório."],["Garantias fundamentais","A presunção de inocência impõe que a responsabilidade penal não seja presumida. A defesa técnica e o contraditório são garantias do acusado. O direito ao silêncio não equivale a confissão e não deve fundamentar conclusão desfavorável apenas pelo seu exercício."],["Aplicação da lei processual","A norma processual tem aplicação imediata, preservados os atos validamente realizados segundo a lei anterior. Regras de natureza mista podem exigir análise dos efeitos materiais. Diferencie lei processual pura de norma penal substantiva."]],"map":["Acusação ≠ julgamento","Silêncio → garantia","Presunção → não culpabilidade","Lei processual → aplicação imediata"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Investigação criminal e inquérito policial","ref":"CPP, arts. 4º a 23","lessons":[["Finalidade e características","O inquérito reúne elementos sobre materialidade e autoria para subsidiar a formação da opinião do titular da ação penal. É procedimento investigativo, distinto da instrução judicial. Pode ser dispensado se houver elementos suficientes para acusação, não sendo condição universal da ação."],["Diligências e defesa","A autoridade policial realiza diligências previstas em lei, preservando vestígios e colhendo informações. O investigado pode exercer garantias de defesa e requerer diligências, cuja realização segue o regime legal. A defesa pode acessar elementos documentados que interessem ao exercício defensivo, conforme a Súmula Vinculante 14."],["Encerramento e arquivamento","A autoridade policial elabora relatório e remete os autos à instância competente. Não pode arquivar o inquérito por iniciativa própria. O arquivamento deve observar o art. 28 e a interpretação constitucional aplicável; não se confunde com absolvição judicial."]],"map":["Inquérito → elementos informativos","Dispensável → acusação já fundamentada","Defesa → acesso aos elementos documentados","Delegado → não arquiva"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Ação penal, denúncia, queixa e ANPP","ref":"CPP, arts. 24 a 62; art. 28-A","lessons":[["Titularidade","A ação penal pública é promovida pelo Ministério Público, mediante denúncia. Pode depender de representação ou requisição nos casos legais. A ação privada é proposta mediante queixa por legitimado. A subsidiária da pública é admitida diante de inércia do titular no prazo legal, observadas suas condições."],["Prazos e requisitos","A denúncia ou queixa deve descrever o fato criminoso com suas circunstâncias e identificar o acusado nos termos legais. A representação e a queixa submetem-se, em regra, à decadência de seis meses desde o conhecimento da autoria, com ressalvas. Distinga decadência da vítima dos prazos para oferecer denúncia."],["Acordo de não persecução penal","O ANPP exige avaliação dos requisitos do art. 28-A, entre eles delito sem violência ou grave ameaça e pena mínima inferior a quatro anos, além da adequação do acordo. Há impedimentos, homologação judicial e possibilidade de revisão interna da recusa do MP. A aplicação temporal e a confissão devem considerar precedentes atuais."]],"map":["Pública → denúncia do MP","Privada → queixa","Decadência → regra de 6 meses","ANPP → requisitos cumulativos"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Competência, conexão e continência","ref":"CPP, arts. 69 a 91","lessons":[["Critérios de competência","Lugar da infração, natureza do delito, distribuição, conexão e continência são critérios legalmente previstos. Em regra, o lugar da consumação define a competência territorial; na tentativa, considera-se o último ato executório. Leis especiais e disposições específicas podem modificar essa regra."],["Conexão e continência","A conexão associa infrações relacionadas nas hipóteses do art. 76; a continência decorre das situações do art. 77, como pluralidade de acusados pela mesma infração. A reunião de processos não é absoluta: existem regras de separação obrigatória ou facultativa."],["Competências constitucionais","O Tribunal do Júri julga crimes dolosos contra a vida, ressalvadas regras constitucionais pertinentes. A competência federal decorre das hipóteses constitucionais, não apenas da repercussão do fato. Identifique a competência material antes de aplicar a territorial."]],"map":["Territorial → regra da consumação","Tentativa → último ato executório","Conexão → vínculo entre infrações","Júri → crimes dolosos contra a vida"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Provas e cadeia de custódia","ref":"CPP, arts. 155 a 250","lessons":[["Elementos investigativos e prova judicial","O juiz forma sua convicção com a prova produzida sob contraditório judicial. Elementos informativos da investigação não podem, em regra, fundamentar exclusivamente a decisão, ressalvadas provas cautelares, não repetíveis e antecipadas. Essa distinção protege a possibilidade efetiva de contestar a prova."],["Provas ilícitas e vestígios","Provas obtidas em violação a normas constitucionais ou legais são inadmissíveis, observadas as regras sobre derivação e fonte independente. A cadeia de custódia documenta a história do vestígio desde seu reconhecimento até o descarte. Eventual falha deve ser examinada quanto à confiabilidade e aos efeitos no caso."],["Perícia e reconhecimento","Quando a infração deixa vestígios, o exame de corpo de delito é indispensável nos termos do art. 158; a confissão não o substitui. Reconhecimento pessoal demanda respeito ao procedimento legal e à jurisprudência. A avaliação probatória deve ser fundamentada e considerar a qualidade dos elementos."]],"map":["Contraditório → prova judicial","Ilícita → inadmissibilidade","Vestígio → cadeia de custódia","Corpo de delito → exigência legal"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Prisões, cautelares e liberdade provisória","ref":"CPP, arts. 282 a 350","lessons":[["Prisão em flagrante","O flagrante depende das hipóteses legais e está sujeito a controle judicial. A captura não equivale a condenação, nem autoriza manutenção automática da prisão. A audiência de custódia permite examinar legalidade, integridade e necessidade das medidas cabíveis segundo o regime vigente."],["Prisão preventiva","A preventiva é cautelar, não antecipação da pena. Exige pressupostos, fundamentos concretos, admissibilidade e motivação conforme os arts. 312, 313 e 315. A gravidade abstrata do crime não basta. A disciplina recebeu alterações recentes, especialmente pelas Leis 15.272/2025 e 15.358/2026, que devem integrar a revisão especializada."],["Medidas alternativas","O art. 319 prevê medidas cautelares diversas da prisão. Necessidade e adequação orientam sua escolha. A preventiva é subsidiária quando não for cabível substituição por outra medida cautelar, nos termos do art. 282. Liberdade provisória e relaxamento de prisão ilegal não são o mesmo instituto."]],"map":["Flagrante → controle judicial","Preventiva → fundamentação concreta","Cautelar → necessidade e adequação","Prisão ilegal → relaxamento"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15272.htm"},{"t":"Procedimento comum e resposta à acusação","ref":"CPP, arts. 394 a 405","lessons":[["Escolha do procedimento","O procedimento comum pode ser ordinário, sumário ou sumaríssimo, conforme critérios legais. No ordinário, o parâmetro geral é pena máxima igual ou superior a quatro anos. Procedimentos especiais devem ser considerados antes da aplicação subsidiária das regras comuns."],["Recebimento e defesa","A rejeição da denúncia ou queixa pode decorrer de inépcia manifesta, falta de pressuposto ou condição da ação e ausência de justa causa. Recebida a acusação, a resposta escrita permite apresentar preliminares, argumentos, documentos, requerimentos e rol de testemunhas dentro do prazo legal."],["Instrução e julgamento","A absolvição sumária do art. 397 exige hipótese legal. Na instrução, produzem-se provas e colhem-se declarações conforme a ordem aplicável. O interrogatório é ato de defesa e, no procedimento comum ordinário, ocorre ao final da instrução. A sentença deve apreciar acusação, defesa e provas."]],"map":["Ordinário → pena máxima ≥ 4 anos","Rejeição → art. 395","Resposta → 10 dias","Interrogatório → final da instrução ordinária"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Tribunal do Júri","ref":"CPP, arts. 406 a 497","lessons":[["Duas fases","A primeira fase examina se a acusação deve ser submetida ao Conselho de Sentença. Pode terminar com pronúncia, impronúncia, absolvição sumária ou desclassificação conforme os requisitos legais. A pronúncia não significa condenação e deve limitar a fundamentação ao necessário."],["Plenário e garantias","Na segunda fase, o Conselho de Sentença aprecia os quesitos submetidos, e o juiz presidente exerce atribuições legais. Plenitude de defesa, sigilo das votações e soberania dos veredictos são garantias constitucionais, compatíveis com as hipóteses legais de controle recursal."],["Impronúncia e recursos","A impronúncia ocorre quando faltam os requisitos probatórios para pronunciar o acusado; nova acusação pode ser formulada com prova nova enquanto não extinta a punibilidade. Diferencie o recurso em sentido estrito contra pronúncia da apelação contra impronúncia ou absolvição sumária."]],"map":["Primeira fase → admissibilidade","Pronúncia ≠ condenação","Plenário → quesitos","Impronúncia → possível nova prova"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Nulidades, sentença e recursos","ref":"CPP, arts. 381 a 393 e 563 a 667","lessons":[["Nulidades e prejuízo","A análise de nulidades considera finalidade do ato, prejuízo, momento de arguição e regime aplicável. O art. 563 consagra a regra de que não há declaração de nulidade sem prejuízo para acusação ou defesa. Garantias essenciais podem demandar análise própria conforme jurisprudência."],["Sentença e correlação","A decisão deve enfrentar o fato imputado e os elementos probatórios. Emendatio libelli permite atribuir definição jurídica diversa ao fato descrito sem modificar a narrativa acusatória; mutatio libelli exige procedimento próprio quando emerge elemento fático não contido na acusação."],["Recursos e limites","Apelação e recurso em sentido estrito têm hipóteses específicas. Embargos de declaração permitem corrigir vícios previstos em lei. Quando apenas a defesa recorre, a regra do art. 617 impede agravar a pena; devem ser considerados limites da devolução e peculiaridades do recurso."]],"map":["Nulidade → prejuízo","Emendatio → nova classificação","Mutatio → alteração fática pertinente","Recurso exclusivo da defesa → vedação de piora"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Juizados especiais, habeas corpus e revisão criminal","ref":"Lei 9.099/1995, arts. 60 a 92; CPP, arts. 621 a 667","lessons":[["Juizados especiais criminais","A Lei 9.099/1995 disciplina infrações de menor potencial ofensivo e mecanismos consensuais. Composição civil e transação penal possuem condições e efeitos distintos. A suspensão condicional do processo usa como parâmetro a pena mínima igual ou inferior a um ano, além de requisitos legais, e pode alcançar crimes fora da competência do Juizado."],["Habeas corpus","O habeas corpus protege a liberdade de locomoção contra ilegalidade ou abuso, tanto em ameaça quanto em restrição existente. A análise exige identificar coação concreta e adequação do remédio. Não é instrumento universal para discutir qualquer direito desvinculado da liberdade de ir e vir."],["Revisão criminal","A revisão criminal permite rediscutir condenação definitiva nas hipóteses legais, como contrariedade ao texto expresso da lei penal ou à evidência dos autos e descoberta de novas provas nos termos do art. 621. Pode ser requerida mesmo após extinção da pena e não pode agravar a situação do condenado."]],"map":["JECRIM → menor potencial ofensivo","Suspensão do processo → pena mínima até 1 ano","HC → locomoção","Revisão → condenação definitiva"],"url":"https://www.planalto.gov.br/ccivil_03/leis/l9099.htm","extraUrl":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"}];const processPenalQuestions=[{"id":6001,"s":5,"module":0,"topic":"Princípios e sistemas processuais","difficulty":"Intermediária","q":"Durante o interrogatório, o acusado decide permanecer em silêncio. Qual consequência pode decorrer exclusivamente dessa escolha?","a":["Confissão ficta","Presunção automática de autoria","Nenhuma interpretação em prejuízo da defesa","Renúncia automática à defesa técnica"],"ok":2,"e":"O art. 186, parágrafo único, estabelece que o silêncio não importa confissão nem pode ser interpretado em prejuízo da defesa.","src":"CPP, arts. 1º a 3º-A; CF, art. 5º","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6002,"s":5,"module":0,"topic":"Princípios e sistemas processuais","difficulty":"Intermediária","q":"Uma nova lei puramente processual entra em vigor durante processo em andamento. Qual a regra geral?","a":["Aplica-se imediatamente, preservando os atos válidos anteriores","Anula todos os atos já praticados","Aplica-se apenas a crimes posteriores","Exige autorização do acusado"],"ok":0,"e":"O art. 2º disciplina aplicação imediata da lei processual sem prejuízo da validade dos atos anteriores.","src":"CPP, arts. 1º a 3º-A; CF, art. 5º","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6003,"s":5,"module":1,"topic":"Investigação criminal e inquérito policial","difficulty":"Intermediária","q":"A autoridade policial conclui que não há elementos suficientes e pretende arquivar o inquérito por decisão própria. Pode fazê-lo?","a":["Sim, em qualquer investigação","Não, o art. 17 veda essa providência","Sim, se a vítima concordar","Sim, após trinta dias"],"ok":1,"e":"O art. 17 impede a autoridade policial de mandar arquivar autos de inquérito.","src":"CPP, arts. 4º a 23","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6004,"s":5,"module":1,"topic":"Investigação criminal e inquérito policial","difficulty":"Intermediária","q":"O Ministério Público dispõe de elementos suficientes de autoria e materialidade obtidos licitamente por outras vias. É sempre obrigatório instaurar inquérito antes da denúncia?","a":["Sim, sem exceção","Sim, mesmo em caso de prova documental suficiente","Sim, salvo autorização do investigado","Não, o inquérito é dispensável quando há suporte suficiente para acusar"],"ok":3,"e":"O inquérito é instrumento informativo. O art. 39, § 5º, exemplifica a possibilidade de dispensa quando a representação contém elementos suficientes.","src":"CPP, arts. 4º a 23","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6005,"s":5,"module":2,"topic":"Ação penal, denúncia, queixa e ANPP","difficulty":"Intermediária","q":"Qual é, em regra, o titular da ação penal pública?","a":["Ministério Público","Juiz criminal","Delegado de polícia","Ofendido diretamente em qualquer hipótese"],"ok":0,"e":"O art. 24 atribui a promoção da ação pública ao Ministério Público mediante denúncia, observadas as condições legais.","src":"CPP, arts. 24 a 62; art. 28-A","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6006,"s":5,"module":2,"topic":"Ação penal, denúncia, queixa e ANPP","difficulty":"Intermediária","q":"Qual limite de pena mínima integra os requisitos legais do ANPP?","a":["Pena máxima inferior a dez anos","Pena mínima igual ou superior a oito anos","Pena mínima inferior a quatro anos","Qualquer pena, sem distinção"],"ok":2,"e":"O art. 28-A utiliza pena mínima inferior a quatro anos, consideradas causas de aumento e diminuição aplicáveis, além dos demais requisitos.","src":"CPP, arts. 24 a 62; art. 28-A","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6007,"s":5,"module":3,"topic":"Competência, conexão e continência","difficulty":"Intermediária","q":"Pela regra geral do CPP, qual local determina a competência territorial em crime consumado?","a":["Residência do advogado","Lugar da consumação da infração","Sede do tribunal superior","Local da prisão, necessariamente"],"ok":1,"e":"O art. 70 estabelece, em regra, competência pelo lugar da consumação, ressalvadas disposições específicas.","src":"CPP, arts. 69 a 91","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6008,"s":5,"module":3,"topic":"Competência, conexão e continência","difficulty":"Intermediária","q":"Duas pessoas são acusadas pela mesma infração, hipótese prevista no art. 77, I. Qual instituto se configura?","a":["Perempção","Decadência","Suspeição","Continência"],"ok":3,"e":"O art. 77, I, prevê continência quando duas ou mais pessoas são acusadas pela mesma infração.","src":"CPP, arts. 69 a 91","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6009,"s":5,"module":4,"topic":"Provas e cadeia de custódia","difficulty":"Intermediária","q":"Em infração que deixa vestígios, estes estão disponíveis para exame. A confissão do acusado substitui o exame de corpo de delito?","a":["Sim, se escrita","Sim, se acompanhada de testemunha","Não, conforme o art. 158","Sim, por decisão discricionária da polícia"],"ok":2,"e":"O art. 158 prevê exame indispensável quando a infração deixa vestígios, sem possibilidade de suprimento pela confissão.","src":"CPP, arts. 155 a 250","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6010,"s":5,"module":4,"topic":"Provas e cadeia de custódia","difficulty":"Intermediária","q":"Qual a finalidade central da cadeia de custódia?","a":["Documentar a trajetória e o controle do vestígio","Substituir a defesa técnica","Criar presunção absoluta de culpa","Impedir a realização de perícia"],"ok":0,"e":"O art. 158-A disciplina procedimentos de preservação e documentação da história cronológica do vestígio.","src":"CPP, arts. 155 a 250","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6011,"s":5,"module":5,"topic":"Prisões, cautelares e liberdade provisória","difficulty":"Intermediária","q":"A decisão de prisão preventiva baseia-se apenas na gravidade abstrata do delito. É suficiente?","a":["Sim, independentemente das circunstâncias","Sim, se houver repercussão pública","Sim, em todo crime doloso","Não, é necessária fundamentação concreta conforme o CPP"],"ok":3,"e":"O art. 312, § 4º, reforça a vedação de preventiva baseada em gravidade abstrata. Devem ser examinados os requisitos e riscos concretos.","src":"CPP, arts. 282 a 350","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6012,"s":5,"module":5,"topic":"Prisões, cautelares e liberdade provisória","difficulty":"Intermediária","q":"Qual princípio orienta a escolha das medidas cautelares segundo o art. 282?","a":["Necessidade e adequação","Aplicação automática da medida mais severa","Presunção de condenação","Obrigatoriedade de prisão em qualquer processo"],"ok":0,"e":"O art. 282 exige necessidade e adequação da medida às circunstâncias legais e do caso.","src":"CPP, arts. 282 a 350","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6013,"s":5,"module":6,"topic":"Procedimento comum e resposta à acusação","difficulty":"Intermediária","q":"Qual o prazo da resposta à acusação previsto no art. 396?","a":["Cinco dias","Dez dias","Quinze dias úteis necessariamente","Trinta dias"],"ok":1,"e":"O art. 396 fixa dez dias para resposta escrita à acusação, observado o regime processual penal.","src":"CPP, arts. 394 a 405","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6014,"s":5,"module":6,"topic":"Procedimento comum e resposta à acusação","difficulty":"Intermediária","q":"Ausente justa causa para o exercício da ação penal, qual providência está prevista no art. 395?","a":["Condenação imediata","Suspensão obrigatória por dez anos","Rejeição da denúncia ou queixa","Recebimento obrigatório"],"ok":2,"e":"O art. 395, III, prevê rejeição por falta de justa causa para o exercício da ação penal.","src":"CPP, arts. 394 a 405","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6015,"s":5,"module":7,"topic":"Tribunal do Júri","difficulty":"Intermediária","q":"Qual recurso é previsto contra decisão de pronúncia?","a":["Recurso em sentido estrito","Agravo de instrumento do CPC","Embargos à execução civil","Recurso administrativo ao MP"],"ok":0,"e":"O art. 581, IV, prevê recurso em sentido estrito contra pronúncia.","src":"CPP, arts. 406 a 497","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6016,"s":5,"module":7,"topic":"Tribunal do Júri","difficulty":"Intermediária","q":"Após impronúncia, surge prova nova antes de extinta a punibilidade. Qual regra prevê o art. 414?","a":["É impossível nova acusação","O acusado é condenado automaticamente","O juiz dispensa nova acusação","Pode ser formulada nova denúncia ou queixa com prova nova"],"ok":3,"e":"O parágrafo único do art. 414 admite nova acusação diante de prova nova enquanto não ocorrer extinção da punibilidade.","src":"CPP, arts. 406 a 497","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6017,"s":5,"module":8,"topic":"Nulidades, sentença e recursos","difficulty":"Intermediária","q":"Segundo a regra geral do art. 563, qual elemento deve ser considerado para declarar nulidade?","a":["A mera vontade de uma testemunha","Prejuízo para acusação ou defesa","O valor econômico da causa","A repercussão na imprensa"],"ok":1,"e":"O art. 563 estabelece a necessidade de prejuízo decorrente da nulidade, sem afastar regimes específicos e garantias fundamentais.","src":"CPP, arts. 381 a 393 e 563 a 667","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6018,"s":5,"module":8,"topic":"Nulidades, sentença e recursos","difficulty":"Intermediária","q":"Somente o réu interpõe apelação. Qual limite o art. 617 estabelece ao tribunal?","a":["Pode sempre dobrar a pena","Deve agravar a pena","Não pode agravar a pena nessa hipótese","Deve extinguir o processo"],"ok":2,"e":"O art. 617 consagra a vedação da reformatio in pejus quando somente o réu apela.","src":"CPP, arts. 381 a 393 e 563 a 667","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6019,"s":5,"module":9,"topic":"Juizados especiais, habeas corpus e revisão criminal","difficulty":"Intermediária","q":"Qual é o parâmetro de pena mínima para suspensão condicional do processo previsto no art. 89 da Lei 9.099/1995?","a":["Igual ou inferior a um ano","Inferior a quatro anos em qualquer caso","Igual ou superior a oito anos","Não existe parâmetro de pena"],"ok":0,"e":"O art. 89 prevê pena mínima cominada igual ou inferior a um ano, além dos demais requisitos.","src":"Lei 9.099/1995, art. 89","url":"https://www.planalto.gov.br/ccivil_03/leis/l9099.htm"},{"id":6020,"s":5,"module":9,"topic":"Juizados especiais, habeas corpus e revisão criminal","difficulty":"Intermediária","q":"Em revisão criminal procedente, pode o tribunal agravar a pena imposta pela decisão revista?","a":["Sim, se o MP pedir","Sim, em qualquer hipótese","Sim, se o condenado já cumpriu a pena","Não, o art. 626 veda agravamento"],"ok":3,"e":"O parágrafo único do art. 626 proíbe agravamento da pena na revisão criminal.","src":"CPP, art. 626","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"}];const adminModules=[{"t":"Princípios e regime jurídico administrativo","ref":"CF, art. 37; Lei 9.784/1999, art. 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Regime jurídico","A administração exerce competências destinadas a fins públicos, sujeita a limites legais e constitucionais. Prerrogativas administrativas não representam poderes ilimitados: exigem finalidade legítima, motivação quando cabível e proporcionalidade. Diferencie a atuação estatal da liberdade de contratar de um particular."],["Princípios constitucionais","Legalidade, impessoalidade, moralidade, publicidade e eficiência orientam os órgãos e entidades administrativas. A publicidade admite restrições juridicamente justificadas para proteger informações sigilosas. A impessoalidade afasta o uso de recursos públicos para promover pessoalmente autoridades."],["Proporcionalidade e segurança jurídica","A escolha administrativa precisa guardar relação com a finalidade da competência. Examine adequação, necessidade e equilíbrio da restrição. A proteção da confiança e da segurança jurídica deve ser considerada na revisão de atos, sem converter toda situação ilegal em direito adquirido."]],"map":["LIMPE → princípios constitucionais","Legalidade → competência e limites","Impessoalidade → finalidade pública","Proporcionalidade → medida necessária"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"t":"Organização administrativa e entidades","ref":"CF, art. 37, XIX; Decreto-Lei 200/1967","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del0200.htm","lessons":[["Administração direta e indireta","A direta compreende a atuação por órgãos integrantes dos entes políticos. A indireta é composta por entidades com personalidade própria, como autarquias, fundações públicas, empresas públicas e sociedades de economia mista. Órgão não se confunde com pessoa jurídica."],["Desconcentração e descentralização","Desconcentrar é distribuir competências internamente, entre órgãos da mesma pessoa jurídica. Descentralizar envolve atribuir atividade a outra pessoa, por técnica juridicamente adequada. A vinculação de entidade indireta a ministério ou secretaria não estabelece a mesma hierarquia que existe entre órgãos internos."],["Criação e regime","A lei específica cria autarquia e autoriza a instituição de empresa pública, sociedade de economia mista e fundação, conforme art. 37, XIX, observado o regime específico das fundações de direito público. Empresas estatais têm personalidade de direito privado e sujeitam-se a normas públicas pertinentes, inclusive ao regime da Lei 13.303/2016."]],"map":["Órgão → sem personalidade própria","Autarquia → criação por lei específica","Desconcentração → mesma pessoa","Descentralização → outra pessoa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Poderes administrativos e abuso de poder","ref":"Lei 9.784/1999, arts. 2º e 11 a 17; CTN, art. 78","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm","lessons":[["Vinculação e discricionariedade","O ato vinculado tem pressupostos e conteúdo delimitados pela norma. Na discricionariedade, há espaço legal de escolha, sem afastar controle de legalidade. A conveniência administrativa não legitima desvio de finalidade, discriminação ou violação da proporcionalidade."],["Hierarquia, disciplina e regulamentação","O poder hierárquico permite organização e coordenação interna nos limites legais. A competência é irrenunciável, com delegação e avocação nas hipóteses admitidas. O poder disciplinar apura e sanciona infrações ligadas à relação jurídica administrativa, garantindo defesa. A regulamentação não pode criar obrigações além de sua base normativa."],["Polícia e abuso","O poder de polícia limita atividades ou direitos individuais para proteger interesses coletivos conforme lei. Excesso de poder ocorre quando a autoridade ultrapassa sua competência; desvio de finalidade, quando usa competência para fim indevido. Nem todo ato de polícia é autoexecutório."]],"map":["Vinculado → limites definidos","Discricionário → escolha legal","Excesso → competência","Desvio → finalidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"t":"Atos administrativos e controle de validade","ref":"Lei 9.784/1999, arts. 50 e 53 a 55","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm","lessons":[["Elementos do ato","Competência, finalidade, forma, motivo e objeto são categorias clássicas de análise. Motivo corresponde aos pressupostos de fato e direito; motivação é a exposição das razões da decisão. Se o ato declara razões determinantes, sua validade pode depender da veracidade e pertinência dessas razões."],["Anulação e revogação","A anulação combate ilegalidade; a revogação retira ato válido por razões de conveniência e oportunidade, observadas limitações jurídicas. O Judiciário pode controlar a legalidade do ato administrativo quando provocado, mas não substituir livremente a escolha legítima de mérito feita pela administração."],["Convalidação e prazo","Defeitos sanáveis podem ser corrigidos pela administração quando não houver lesão ao interesse público nem prejuízo a terceiros. Na esfera federal, o prazo decadencial para anular atos favoráveis é, em regra, de cinco anos, salvo má-fé comprovada. Nem todo vício admite convalidação."]],"map":["Motivo ≠ motivação","Ilegal → anulação","Válido inconveniente → revogação","Vício sanável → possível convalidação"]},{"t":"Agentes públicos e servidores","ref":"CF, arts. 37 a 41; Lei 8.112/1990","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Ingresso e vínculos","Cargo efetivo, emprego público, cargo em comissão e contratação temporária têm regimes diferentes. O concurso é regra de ingresso em cargos e empregos, ressalvados cargos em comissão definidos em lei e outras hipóteses constitucionais. A contratação temporária atende necessidade temporária de excepcional interesse público nos termos legais."],["Estabilidade e acumulação","A estabilidade do art. 41 protege servidor nomeado para cargo efetivo por concurso após três anos de exercício e avaliação especial. A acumulação remunerada é excepcional e exige compatibilidade de horários, observadas as hipóteses constitucionais vigentes. Confira a redação atual do art. 37, XVI, especialmente após a EC 138/2025."],["Responsabilidade e processo disciplinar","Responsabilidades civil, penal e administrativa podem coexistir, com repercussões específicas entre as instâncias. O processo disciplinar deve garantir contraditório e ampla defesa. A Lei 8.112 rege servidores federais abrangidos por ela, não constitui automaticamente estatuto de todos os entes."]],"map":["Concurso → regra","Comissão → direção, chefia e assessoramento","Estabilidade → requisitos do art. 41","Disciplina → defesa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm"},{"t":"Licitações e contratações diretas","ref":"Lei 14.133/2021, arts. 17, 28, 33 e 72 a 75","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","lessons":[["Planejamento e fases","A contratação começa pela identificação da necessidade, planejamento e definição do objeto. A Lei 14.133 organiza fases como preparação, divulgação, propostas, julgamento, habilitação, recurso e homologação, admitindo alterações de ordem nos requisitos legais. Modalidade não se confunde com critério de julgamento."],["Modalidades e critérios","Pregão, concorrência, concurso, leilão e diálogo competitivo são as modalidades previstas no art. 28. O pregão é empregado para bens e serviços comuns conforme o regime legal. Os critérios de julgamento variam com o objeto, como menor preço, maior desconto e técnica e preço."],["Dispensa e inexigibilidade","A inexigibilidade decorre da inviabilidade de competição; a dispensa permite contratação direta nas hipóteses legais. Ambas exigem instrução apropriada, incluindo justificativas e verificação de requisitos. Valores-limite de dispensa sofrem atualização, portanto devem ser conferidos antes de uso."]],"map":["Modalidade ≠ critério","Pregão → bens e serviços comuns","Inexigibilidade → competição inviável","Dispensa → hipótese legal"]},{"t":"Contratos administrativos","ref":"Lei 14.133/2021, arts. 89 a 154","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","lessons":[["Formalização e prerrogativas","Contratos administrativos possuem cláusulas obrigatórias e regras de publicidade. A administração dispõe de prerrogativas como fiscalização e alterações unilaterais nas condições previstas em lei. Essas prerrogativas não permitem desrespeitar direitos do contratado ou alterar livremente qualquer cláusula."],["Equilíbrio econômico-financeiro","O equilíbrio protege a relação inicial entre encargos e remuneração. Reajuste, repactuação e restabelecimento do equilíbrio são instrumentos distintos, com pressupostos próprios. Alterações unilaterais que afetem encargos devem preservar o equilíbrio nos termos legais."],["Execução e extinção","A gestão e fiscalização acompanham entrega, qualidade, prazos e obrigações. Inexecução pode levar a sanções ou extinção contratual, observados procedimento, motivação e defesa. A sanção de impedimento e a declaração de inidoneidade têm alcances e requisitos diferentes."]],"map":["Fiscalização → execução","Prerrogativas → limites legais","Equilíbrio → encargos e remuneração","Sanções → processo e defesa"]},{"t":"Serviços públicos e delegação","ref":"CF, art. 175; Lei 8.987/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l8987compilada.htm","lessons":[["Titularidade e prestação","O poder público é responsável pela prestação dos serviços de sua competência. Pode executá-los diretamente ou delegar a execução nas hipóteses constitucionais. A delegação não transfere automaticamente a titularidade estatal do serviço nem elimina a fiscalização."],["Concessão e permissão","A concessão envolve delegação mediante licitação, por prazo determinado e por conta e risco do concessionário, conforme lei. A permissão é delegação a título precário, formalizada segundo o regime legal. Não confunda ambas com simples contratação de fornecimento ao Estado."],["Serviço adequado e extinção","Regularidade, continuidade, eficiência, segurança e modicidade tarifária compõem a avaliação do serviço adequado, entre outros requisitos legais. Encampação é retomada por interesse público durante o prazo, com condições próprias; caducidade decorre de inadimplemento do concessionário nas hipóteses legais."]],"map":["Titularidade → poder público","Concessão → delegação e licitação","Serviço adequado → requisitos legais","Encampação ≠ caducidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Responsabilidade civil do Estado e bens públicos","ref":"CF, art. 37, § 6º; Código Civil, arts. 98 a 103","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Responsabilidade objetiva","A Constituição prevê responsabilidade das pessoas jurídicas de direito público e prestadoras de serviços públicos por danos causados por seus agentes nessa qualidade. A vítima precisa demonstrar dano e nexo causal conforme o regime pertinente; a dispensa de prova da culpa não significa responsabilidade por qualquer evento."],["Omissões e regresso","Omissões estatais exigem exame da obrigação de agir, do nexo e da jurisprudência pertinente. Não há fórmula única aplicável indistintamente a todas elas. A ação regressiva contra agente depende de dolo ou culpa. O Tema 940 do STF orienta a legitimidade passiva nas ações indenizatórias abrangidas pela tese."],["Bens públicos","Bens de uso comum, de uso especial e dominicais possuem regimes distintos. Bens afetados ao uso comum ou especial não são alienáveis enquanto conservam essa qualificação. Bens dominicais podem ser alienados nas condições legais; nenhuma dessas categorias se adquire por usucapião."]],"map":["Dano + nexo → examinar imputação","Regresso → dolo ou culpa","Bens afetados → proteção especial","Bem público → sem usucapião"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Controle, processo administrativo e improbidade","ref":"Lei 8.429/1992; Lei 9.784/1999; CF, arts. 70 a 75","url":"https://www.planalto.gov.br/ccivil_03/leis/l8429compilada.htm","lessons":[["Controle da administração","O controle interno ocorre no âmbito da própria estrutura administrativa. O controle externo é exercido nos termos constitucionais pelo Legislativo com auxílio dos Tribunais de Contas, sem excluir o controle judicial. A fiscalização examina legalidade, legitimidade, economicidade e outros aspectos definidos na Constituição."],["Processo administrativo","O processo federal observa motivação, contraditório, acesso aos autos e demais garantias pertinentes. Recursos administrativos têm regras próprias; não se deve importar automaticamente os prazos do CPC. Impedimento e suspeição protegem imparcialidade dos responsáveis pela decisão."],["Improbidade administrativa","A Lei 14.230/2021 reformou a Lei 8.429/1992. O regime atual exige conduta dolosa tipificada, não bastando mera irregularidade ou voluntariedade. Distinga enriquecimento ilícito, dano ao erário e violação aos princípios nos tipos legais. A aplicação temporal e as questões processuais exigem estudo de precedentes, incluindo Tema 1199 e ADIs 7042 e 7043 do STF."]],"map":["Controle externo → Legislativo e Tribunais de Contas","Processo → garantias","Improbidade → dolo e tipicidade","Ilegalidade ≠ improbidade automaticamente"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"}];const adminQuestions=[{"id":7001,"s":6,"module":0,"topic":"Princípios e regime jurídico administrativo","difficulty":"Intermediária","q":"Uma campanha institucional financiada pelo Município utiliza imagens do prefeito para sua promoção pessoal. Qual princípio é diretamente violado?","a":["Autonomia privada","Impessoalidade","Anterioridade tributária","Livre concorrência"],"ok":1,"e":"A publicidade institucional não pode servir à promoção pessoal de agentes públicos, conforme art. 37, § 1º, da CF.","src":"CF, art. 37; Lei 9.784/1999, art. 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7002,"s":6,"module":0,"topic":"Princípios e regime jurídico administrativo","difficulty":"Intermediária","q":"Uma autoridade escolhe sanção claramente excessiva diante de infração de pequena gravidade, sem justificativa legal. Qual princípio deve orientar a revisão?","a":["Proporcionalidade","Soberania nacional","Indivisibilidade do mandato","Irretroatividade eleitoral"],"ok":0,"e":"A proporcionalidade limita o exercício do poder administrativo, inclusive quanto à adequação entre meios e fins (Lei 9.784/1999, art. 2º).","src":"Lei 9.784/1999, art. 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7003,"s":6,"module":1,"topic":"Organização administrativa e entidades","difficulty":"Intermediária","q":"Um ministério distribui atribuições entre departamentos internos, sem criar outra pessoa jurídica. Qual técnica foi utilizada?","a":["Concessão","Privatização","Desconcentração","Descentralização por outorga"],"ok":2,"e":"A divisão interna de atribuições entre órgãos da mesma pessoa jurídica constitui desconcentração.","src":"CF, art. 37, XIX; Decreto-Lei 200/1967","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del0200.htm"},{"id":7004,"s":6,"module":1,"topic":"Organização administrativa e entidades","difficulty":"Intermediária","q":"Segundo o art. 37, XIX, da CF, como se cria uma autarquia?","a":["Por contrato privado","Por decisão administrativa sem lei","Por autorização verbal","Por lei específica"],"ok":3,"e":"A Constituição exige lei específica para criar autarquia, distinguindo-a da autorização legislativa para instituição de outras entidades.","src":"CF, art. 37, XIX","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7005,"s":6,"module":2,"topic":"Poderes administrativos e abuso de poder","difficulty":"Intermediária","q":"Autoridade competente remove servidor exclusivamente para puni-lo informalmente, usando a remoção para finalidade alheia à prevista em lei. Qual vício se evidencia?","a":["Desvio de finalidade","Ausência de personalidade jurídica","Prescrição tributária","Desconcentração administrativa"],"ok":0,"e":"A competência foi usada para objetivo incompatível com sua finalidade legal, caracterizando desvio de poder.","src":"Lei 9.784/1999, arts. 2º e 11 a 17; CTN, art. 78","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7006,"s":6,"module":2,"topic":"Poderes administrativos e abuso de poder","difficulty":"Intermediária","q":"No processo administrativo federal, pode ser delegada a decisão de recurso administrativo?","a":["Sim, sempre","Sim, se for oral","Sim, se o recorrente concordar","Não, a Lei 9.784/1999 veda essa delegação"],"ok":3,"e":"O art. 13, II, impede delegação da decisão de recursos administrativos.","src":"Lei 9.784/1999, arts. 2º e 11 a 17; CTN, art. 78","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7007,"s":6,"module":3,"topic":"Atos administrativos e controle de validade","difficulty":"Intermediária","q":"A administração reconhece que um ato é ilegal. Qual instituto é adequado para sua retirada, observados os limites jurídicos?","a":["Revogação por mera conveniência","Anulação","Concessão de serviço","Desapropriação"],"ok":1,"e":"O art. 53 distingue o dever de anular atos ilegais e a possibilidade de revogar atos válidos por conveniência ou oportunidade.","src":"Lei 9.784/1999, arts. 50 e 53 a 55","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7008,"s":6,"module":3,"topic":"Atos administrativos e controle de validade","difficulty":"Intermediária","q":"Qual é, em regra, o prazo da administração federal para anular ato que produziu efeitos favoráveis ao destinatário de boa-fé?","a":["Um ano","Dois anos","Cinco anos","Prazo ilimitado"],"ok":2,"e":"O art. 54 da Lei 9.784/1999 estabelece decadência de cinco anos, salvo comprovada má-fé, e prevê regras próprias para efeitos patrimoniais contínuos.","src":"Lei 9.784/1999, arts. 50 e 53 a 55","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7009,"s":6,"module":4,"topic":"Agentes públicos e servidores","difficulty":"Intermediária","q":"Qual a finalidade constitucional dos cargos em comissão?","a":["Qualquer atividade rotineira permanente indistintamente","Substituir todos os concursos públicos","Atribuições de direção, chefia e assessoramento","Garantir estabilidade desde a nomeação"],"ok":2,"e":"O art. 37, V, destina cargos em comissão e funções de confiança às atribuições de direção, chefia e assessoramento.","src":"CF, arts. 37 a 41; Lei 8.112/1990","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7010,"s":6,"module":4,"topic":"Agentes públicos e servidores","difficulty":"Intermediária","q":"O servidor nomeado para cargo efetivo mediante concurso completa três anos de exercício. Qual requisito também deve observar para aquisição da estabilidade?","a":["Filiação partidária","Autorização do sindicato","Pagamento de contribuição extraordinária","Avaliação especial de desempenho"],"ok":3,"e":"O art. 41, § 4º, exige avaliação especial de desempenho por comissão instituída para essa finalidade.","src":"CF, arts. 37 a 41; Lei 8.112/1990","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7011,"s":6,"module":5,"topic":"Licitações e contratações diretas","difficulty":"Intermediária","q":"A administração verifica inviabilidade de competição devidamente demonstrada para determinado objeto. Qual instituto de contratação direta é pertinente?","a":["Revogação","Inexigibilidade","Concurso público","Pregão obrigatório"],"ok":1,"e":"O art. 74 prevê inexigibilidade quando a competição não é viável, respeitados os requisitos de instrução da contratação.","src":"Lei 14.133/2021, arts. 17, 28, 33 e 72 a 75","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"},{"id":7012,"s":6,"module":5,"topic":"Licitações e contratações diretas","difficulty":"Intermediária","q":"Qual das opções é modalidade de licitação prevista no art. 28 da Lei 14.133/2021?","a":["Tomada de preços","Convite","Diálogo competitivo","Menor preço"],"ok":2,"e":"Diálogo competitivo integra as modalidades da lei; menor preço é critério de julgamento. Convite e tomada de preços pertenciam ao regime anterior.","src":"Lei 14.133/2021, arts. 17, 28, 33 e 72 a 75","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"},{"id":7013,"s":6,"module":6,"topic":"Contratos administrativos","difficulty":"Intermediária","q":"A administração modifica unilateralmente o contrato, aumentando encargos do contratado. O que deve observar?","a":["Preservar o equilíbrio econômico-financeiro, nos termos legais","Excluir automaticamente qualquer pagamento adicional","Ignorar a equação inicial","Exigir renúncia obrigatória a direitos"],"ok":0,"e":"O art. 130 exige restabelecimento do equilíbrio inicial no mesmo termo aditivo quando alteração unilateral aumentar ou diminuir encargos.","src":"Lei 14.133/2021, arts. 89 a 154","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"},{"id":7014,"s":6,"module":6,"topic":"Contratos administrativos","difficulty":"Intermediária","q":"O poder de fiscalizar contratos administrativos permite aplicação de sanção sem oportunidade de defesa?","a":["Sim, em qualquer caso","Sim, se a fiscalização for terceirizada","Sim, mediante simples mensagem","Não; devem ser respeitadas as garantias e o procedimento legal"],"ok":3,"e":"A responsabilização contratual deve respeitar contraditório, ampla defesa e as regras legais de aplicação das sanções.","src":"Lei 14.133/2021, arts. 89 a 154","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"},{"id":7015,"s":6,"module":7,"topic":"Serviços públicos e delegação","difficulty":"Intermediária","q":"A retomada de concessão durante seu prazo por interesse público, mediante lei autorizativa específica e prévia indenização, caracteriza qual instituto?","a":["Caducidade","Falência","Encampação","Convalidação"],"ok":2,"e":"O art. 37 da Lei 8.987/1995 define encampação e suas condições.","src":"CF, art. 175; Lei 8.987/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l8987compilada.htm"},{"id":7016,"s":6,"module":7,"topic":"Serviços públicos e delegação","difficulty":"Intermediária","q":"A delegação de serviço público por concessão extingue o dever de fiscalização do poder concedente?","a":["Sim, sempre","Não, o poder concedente mantém atribuições de fiscalização","Sim, após o primeiro ano","Sim, se a concessionária for privada"],"ok":1,"e":"O art. 29 atribui ao poder concedente competências de regulamentação e fiscalização, entre outras.","src":"CF, art. 175; Lei 8.987/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l8987compilada.htm"},{"id":7017,"s":6,"module":8,"topic":"Responsabilidade civil do Estado e bens públicos","difficulty":"Intermediária","q":"O Estado indeniza terceiro por dano causado por seu agente nessa qualidade. Qual requisito subjetivo permite ação regressiva contra o agente?","a":["Apenas a existência do cargo","Dolo ou culpa","Ausência de concurso público","Vontade unilateral da vítima"],"ok":1,"e":"O art. 37, § 6º, exige dolo ou culpa para o direito de regresso contra o responsável.","src":"CF, art. 37, § 6º; Código Civil, arts. 98 a 103","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7018,"s":6,"module":8,"topic":"Responsabilidade civil do Estado e bens públicos","difficulty":"Intermediária","q":"É possível adquirir bem público dominical por usucapião?","a":["Sim, após cinco anos","Sim, se desocupado","Sim, com boa-fé","Não, bens públicos não são usucapíveis"],"ok":3,"e":"O art. 102 do Código Civil veda usucapião de bens públicos, inclusive dominicais.","src":"CC, art. 102","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":7019,"s":6,"module":9,"topic":"Controle, processo administrativo e improbidade","difficulty":"Intermediária","q":"Uma falha administrativa meramente culposa, sem dolo, é automaticamente improbidade nos tipos dos arts. 9º, 10 e 11 da redação atual da Lei 8.429?","a":["Não, o regime exige conduta dolosa tipificada","Sim, qualquer erro é improbidade","Sim, mesmo sem enquadramento legal","Sim, se houver crítica pública"],"ok":0,"e":"A redação atual do art. 1º, §§ 1º a 3º, exige dolo nos tipos legais e distingue atuação irregular de improbidade.","src":"Lei 8.429/1992; Lei 9.784/1999; CF, arts. 70 a 75","url":"https://www.planalto.gov.br/ccivil_03/leis/l8429compilada.htm"},{"id":7020,"s":6,"module":9,"topic":"Controle, processo administrativo e improbidade","difficulty":"Intermediária","q":"Na esfera federal, qual órgão auxilia o Congresso Nacional no exercício do controle externo previsto no art. 71 da Constituição?","a":["Conselho Nacional de Justiça","Supremo Tribunal Federal","Tribunal de Contas da União","Ministério da Fazenda exclusivamente"],"ok":2,"e":"O art. 71 atribui ao Congresso o controle externo com auxílio do Tribunal de Contas da União.","src":"CF, art. 71","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const taxModules=[{"t":"Sistema tributário e espécies de tributos","ref":"CTN, arts. 3º a 5º; CF, arts. 145, 148 e 149","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Conceito de tributo","O tributo é prestação pecuniária compulsória instituída em lei, que não constitui sanção por ato ilícito, cobrada mediante atividade administrativa vinculada. A multa por infração não é tributo, embora possa integrar crédito tributário. A natureza jurídica não decorre simplesmente do nome usado pela norma."],["Espécies tributárias","Na classificação constitucional em cinco espécies, distinguem-se impostos, taxas, contribuição de melhoria, empréstimos compulsórios e contribuições especiais. Impostos independem de atividade estatal específica relativa ao contribuinte. Taxas relacionam-se ao poder de polícia ou ao serviço público específico e divisível."],["Tributos vinculados","Contribuição de melhoria relaciona-se à valorização imobiliária decorrente de obra pública, observados limites legais. Empréstimo compulsório é de competência da União e exige lei complementar nas hipóteses constitucionais. Contribuições especiais têm finalidades e regimes constitucionalmente determinados."]],"map":["Tributo ≠ multa","Imposto → fato independente de atuação estatal específica","Taxa → polícia ou serviço específico e divisível","Empréstimo compulsório → União e LC"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Competência tributária e repartição de receitas","ref":"CF, arts. 145 a 162; CTN, arts. 6º a 8º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Competência e capacidade ativa","Competência tributária é poder constitucional de instituir tributos e não pode ser livremente transferida. A atribuição de funções administrativas de arrecadação ou fiscalização a outra pessoa jurídica de direito público segue regras distintas. Não confunda titularidade da competência com execução das tarefas administrativas."],["Distribuição constitucional","A Constituição discrimina competências federais, estaduais, distritais e municipais. O Distrito Federal reúne competências estaduais e municipais. O IBS tem competência compartilhada entre Estados, Distrito Federal e Municípios, nos termos da reforma tributária; não é simples reprodução do ICMS ou do ISS."],["Repartição de receitas","Receber parcela da arrecadação de tributo alheio não transfere competência legislativa ao ente beneficiário. Os mecanismos constitucionais de distribuição e fundos de participação buscam financiar entes federativos. Analise separadamente quem institui, quem administra e quem recebe os recursos."]],"map":["Competência → instituição por ente constitucionalmente autorizado","Capacidade ativa → atribuições administrativas","DF → competências estaduais e municipais","Repartição → receita, não competência"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"t":"Limitações ao poder de tributar","ref":"CF, arts. 150 a 152","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Legalidade e igualdade","Instituição e majoração de tributo dependem de lei, ressalvadas as exceções constitucionais. Igualdade tributária impede diferenciações arbitrárias entre contribuintes em situações equivalentes. Capacidade contributiva orienta a graduação dos impostos sempre que possível."],["Anterioridade e irretroatividade","Irretroatividade protege fatos anteriores à vigência da norma instituidora ou majoradora. Anterioridade anual e noventena são limites distintos, com exceções específicas. Para resolver questões, identifique tributo, alteração, data de publicação e exceções antes de calcular quando pode ser exigido."],["Imunidades e não confisco","Imunidade é limitação constitucional à competência, distinta de isenção legal. A imunidade recíproca protege patrimônio, renda e serviços dos entes nas condições constitucionais, com extensões e ressalvas. A vedação ao confisco exige análise da carga e das circunstâncias, não um percentual universal."]],"map":["Legalidade → lei e exceções constitucionais","Anterioridade anual ≠ noventena","Irretroatividade → fato anterior","Imunidade → Constituição"]},{"t":"Legislação, interpretação e vigência tributária","ref":"CTN, arts. 96 a 112","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Fontes normativas","Legislação tributária compreende leis, tratados, decretos e normas complementares pertinentes, dentro de seus limites de validade. Matérias reservadas à lei não podem ser criadas livremente por regulamento. A função do decreto é delimitada pela lei que regulamenta."],["Integração e interpretação","O CTN disciplina meios de integração quando falta disposição expressa. A analogia não pode resultar na exigência de tributo não previsto em lei; a equidade não autoriza dispensar tributo devido. A interpretação literal do art. 111 é exigida nas matérias expressamente indicadas, sem substituir a análise sistemática."],["Aplicação temporal","As regras de aplicação da legislação tributária distinguem fatos geradores futuros, pendentes e hipóteses de retroatividade legalmente admitidas. Normas sancionatórias mais favoráveis podem retroagir em atos ainda não definitivamente julgados, nos termos do art. 106. Não aplique automaticamente a retroatividade penal a todo tributo."]],"map":["Lei → matérias reservadas","Decreto → limites legais","Analogia → não cria tributo","Sanção mais favorável → hipóteses do art. 106"]},{"t":"Obrigação tributária, fato gerador e sujeitos","ref":"CTN, arts. 113 a 127","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Principal e acessória","A obrigação principal envolve pagamento de tributo ou penalidade pecuniária. A acessória consiste em deveres positivos ou negativos de interesse da arrecadação ou fiscalização. A inobservância de obrigação acessória pode originar obrigação principal relativa à penalidade, sem transformar a multa em tributo."],["Fato gerador","É a situação definida na legislação cuja ocorrência produz consequências tributárias. Diferencie hipótese abstrata de incidência e fato concretamente ocorrido. O momento de ocorrência depende da natureza da situação e das regras legais. A validade civil do negócio não resolve, isoladamente, todos os problemas de incidência."],["Sujeito ativo e passivo","Sujeito ativo é a pessoa jurídica de direito público titular da competência para exigir a prestação, no sentido do CTN. Contribuinte mantém relação pessoal e direta com o fato gerador; responsável possui dever decorrente de disposição expressa de lei. Convenções particulares não alteram, em regra, a definição legal perante a Fazenda."]],"map":["Principal → tributo ou multa","Acessória → dever instrumental","Contribuinte → relação direta","Responsável → disposição legal"]},{"t":"Responsabilidade e sucessão tributária","ref":"CTN, arts. 128 a 138","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Responsabilidade por lei","O dever de terceiro pelo crédito tributário exige previsão legal e vínculo com o fato gerador nos termos do art. 128. A responsabilidade pode excluir a do contribuinte ou atribuí-la supletivamente, conforme o regime aplicável. Não presuma que todos os responsáveis respondem nas mesmas condições."],["Sucessão","A transferência de bens e estabelecimentos pode produzir responsabilidade por créditos anteriores, observadas hipóteses legais, ressalvas e limites. Em aquisição de imóvel, o art. 130 disciplina sub-rogação de determinados créditos no adquirente, com tratamento próprio para arrematação em hasta pública."],["Terceiros e infrações","A responsabilidade pessoal do art. 135 exige os pressupostos ali previstos, como atos com excesso de poderes ou infração de lei, contrato social ou estatutos. Mero inadimplemento da sociedade não basta, por si só, para responsabilizar administrador. A denúncia espontânea tem requisitos próprios e não cabe após início de procedimento relacionado à infração."]],"map":["Terceiro → previsão legal","Sucessão → hipóteses e limites","Art. 135 → atos qualificados","Denúncia espontânea → anterior à fiscalização pertinente"]},{"t":"Crédito tributário e modalidades de lançamento","ref":"CTN, arts. 139 a 150","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Constituição do crédito","A obrigação surge com o fato gerador; o lançamento constitui o crédito nos termos legais, verificando a ocorrência, calculando o montante e identificando o sujeito passivo. Em tributos sujeitos a declaração, a jurisprudência reconhece constituição do crédito pela declaração do débito pelo contribuinte em hipóteses pertinentes."],["Modalidades","No lançamento de ofício, a autoridade realiza o procedimento nas hipóteses legais. No lançamento por declaração, informações do sujeito passivo ou terceiro subsidiam a autoridade. Na homologação, o sujeito passivo antecipa pagamento sem exame prévio, cabendo à autoridade homologá-lo nos termos legais."],["Revisão e notificação","Lançamento regularmente notificado pode ser alterado apenas nas hipóteses legais. Mudança de critério jurídico tem limites temporais para o mesmo sujeito passivo. Erro de fato e erro de direito exigem análise distinta, e o prazo decadencial limita a constituição e revisão do crédito."]],"map":["Fato gerador → obrigação","Lançamento → constituição do crédito","Declaração → informações","Homologação → antecipação e controle posterior"]},{"t":"Suspensão, extinção e exclusão do crédito","ref":"CTN, arts. 151 a 182","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Suspensão da exigibilidade","Moratória, depósito integral, reclamações e recursos administrativos nos termos legais, liminares ou tutelas previstas e parcelamento são causas de suspensão. O crédito não desaparece apenas por estar suspenso. A suspensão não dispensa deveres acessórios dependentes da obrigação principal."],["Extinção","Pagamento, compensação, transação, remissão, prescrição e decadência estão entre as causas legais de extinção. A compensação depende das condições previstas em lei, e a dação de imóvel em pagamento exige forma e condições legais. Distinga extinção do simples adiamento da cobrança."],["Exclusão e prazos","Isenção e anistia excluem o crédito nas condições legais: a anistia refere-se a infrações anteriores à lei concessiva, com ressalvas. Decadência limita a constituição do crédito; prescrição limita sua cobrança após constituição definitiva. Os termos iniciais dependem da modalidade e das circunstâncias; consulte o CTN consolidado."]],"map":["Suspensão → exigibilidade paralisada","Parcelamento → suspensão","Pagamento → extinção","Isenção e anistia → exclusão"]},{"t":"Administração tributária, garantias e execução fiscal","ref":"CTN, arts. 183 a 208; Lei 6.830/1980","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Fiscalização e sigilo","A fiscalização exerce poderes legalmente previstos para verificar obrigações tributárias. O sigilo fiscal protege informações obtidas em razão do ofício, com exceções legais. O acesso a informações não elimina deveres de finalidade, segurança e proteção de dados pertinentes."],["Certidões e dívida ativa","A inscrição em dívida ativa observa requisitos legais e permite emissão de título executivo. A presunção de certeza e liquidez é relativa. Certidão negativa comprova regularidade nas condições legais; certidão positiva com efeitos de negativa pode ser expedida em situações previstas no art. 206, como exigibilidade suspensa."],["Execução fiscal","A Lei 6.830/1980 disciplina cobrança judicial de dívida ativa. A defesa pode envolver embargos, nos requisitos legais, ou exceção de pré-executividade em hipóteses jurisprudenciais próprias. Não confunda o prazo de pagamento após citação com prazo de embargos. A análise de prescrição intercorrente exige atenção à suspensão e aos marcos legais e jurisprudenciais."]],"map":["Fiscalização → limites legais","CDA → presunção relativa","Exigibilidade suspensa → certidão positiva com efeitos de negativa","Execução → LEF e aplicação subsidiária do CPC"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l6830.htm"},{"t":"Impostos e reforma tributária do consumo","ref":"CF, arts. 153 a 156-A e 195; EC 132/2023; LC 214/2025 e LC 227/2026","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp214compilado.htm","lessons":[["Tributos tradicionais e transição","A União, os Estados e os Municípios têm competências específicas, como IR, ICMS e IPTU, respectivamente. A EC 132/2023 reformulou a tributação do consumo, com implementação gradual. Os regimes antigos e novos coexistem durante a transição; a data de referência da questão é indispensável."],["IBS, CBS e Imposto Seletivo","O IBS tem competência compartilhada de Estados, DF e Municípios; a CBS é contribuição federal. Ambos integram o novo modelo de tributação do consumo. O Imposto Seletivo é federal e possui finalidade e incidências constitucionais próprias. A LC 214/2025 disciplina os novos tributos e deve ser lida na redação consolidada."],["Governança e regimes","A LC 227/2026 institui o Comitê Gestor do IBS, disciplina o processo administrativo do imposto, a distribuição da arrecadação e normas gerais de ITCMD, entre outras alterações. Regras de transição, créditos, regimes diferenciados e obrigações acessórias devem ser estudados na legislação atual e na regulamentação pertinente. Não confunda alíquota de referência com alíquota universal definitiva."]],"map":["EC 132 → novo modelo","IBS → Estados, DF e Municípios","CBS e IS → União","LC 227 → Comitê Gestor e processo do IBS"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp227.htm"}];const taxQuestions=[{"id":8001,"s":7,"module":0,"topic":"Sistema tributário e espécies de tributos","difficulty":"Intermediária","q":"Um Município cria cobrança denominada taxa baseada exclusivamente na propriedade de imóvel, sem serviço específico divisível nem poder de polícia. A denominação basta para classificá-la como taxa?","a":["Sim, pois o nome define a espécie","Não, é necessário examinar o fato gerador e o regime constitucional","Sim, se a cobrança for anual","Sim, se aprovada por decreto"],"ok":1,"e":"A natureza da cobrança depende de sua estrutura jurídica; taxas exigem os pressupostos do art. 145, II, da CF e art. 77 do CTN.","src":"CTN, arts. 3º a 5º; CF, arts. 145, 148 e 149","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8002,"s":7,"module":0,"topic":"Sistema tributário e espécies de tributos","difficulty":"Intermediária","q":"Uma sanção pecuniária aplicada por descumprimento de obrigação tributária é, por essa razão, um tributo?","a":["Sim, todo pagamento obrigatório é tributo","Sim, se destinada à União","Não, tributo não constitui sanção de ato ilícito","Sim, se houver lançamento"],"ok":2,"e":"O art. 3º do CTN distingue tributo de sanção por ilícito. A multa pode integrar obrigação tributária principal sem se tornar espécie tributária.","src":"CTN, arts. 3º a 5º; CF, arts. 145, 148 e 149","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8003,"s":7,"module":1,"topic":"Competência tributária e repartição de receitas","difficulty":"Intermediária","q":"O Município recebe parcela da arrecadação de imposto de competência estadual. Isso transfere ao Município o poder de instituir esse imposto?","a":["Não, repartição de receita não transfere competência","Sim, integralmente","Sim, desde que por decreto municipal","Sim, após cinco anos"],"ok":0,"e":"A repartição constitucional de receitas não altera a competência para instituir tributos, conforme a estrutura da CF e do CTN.","src":"CF, arts. 145 a 162; CTN, arts. 6º a 8º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":8004,"s":7,"module":1,"topic":"Competência tributária e repartição de receitas","difficulty":"Intermediária","q":"O não exercício de competência tributária por determinado ente transfere automaticamente essa competência a outro?","a":["Sim, sempre","Sim, se o outro ente arrecadar mais","Sim, após um exercício financeiro","Não, conforme o art. 8º do CTN"],"ok":3,"e":"O art. 8º do CTN determina que o não exercício da competência não a defere a pessoa jurídica de direito público diversa.","src":"CTN, art. 8º","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8005,"s":7,"module":2,"topic":"Limitações ao poder de tributar","difficulty":"Intermediária","q":"Uma lei institui imposto sujeito simultaneamente às anterioridades anual e nonagesimal, sem exceção aplicável. Basta aguardar o início do exercício seguinte?","a":["Sim, sempre","Não, é preciso respeitar também a noventena","Sim, se o contribuinte concordar","Não, pois deve aguardar sempre dois anos"],"ok":1,"e":"As duas limitações do art. 150, III, b e c, devem ser respeitadas quando aplicáveis cumulativamente.","src":"CF, arts. 150 a 152","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":8006,"s":7,"module":2,"topic":"Limitações ao poder de tributar","difficulty":"Intermediária","q":"Qual a diferença central entre imunidade e isenção?","a":["Ambas são exclusivamente multas","Imunidade depende sempre de decreto","Isenção extingue a competência constitucional","Imunidade limita constitucionalmente a competência; isenção decorre de lei"],"ok":3,"e":"A imunidade decorre da Constituição; a isenção integra disciplina legal de exclusão do crédito, conforme CTN.","src":"CF, arts. 150 a 152","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":8007,"s":7,"module":3,"topic":"Legislação, interpretação e vigência tributária","difficulty":"Intermediária","q":"Na ausência de previsão legal de determinado tributo, a administração pode criá-lo por analogia?","a":["Sim, se houver fato semelhante","Sim, para completar receita pública","Não, a analogia não pode resultar em exigência de tributo não previsto em lei","Sim, mediante parecer interno"],"ok":2,"e":"O art. 108, § 1º, do CTN veda a criação dessa exigência por analogia.","src":"CTN, arts. 96 a 112","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8008,"s":7,"module":3,"topic":"Legislação, interpretação e vigência tributária","difficulty":"Intermediária","q":"Qual regra aplica-se a ato ainda não definitivamente julgado quando lei posterior comina penalidade menos severa?","a":["Pode retroagir nas condições do art. 106 do CTN","Jamais retroage","Extingue automaticamente todo o tributo","Depende de aprovação do contribuinte"],"ok":0,"e":"O art. 106, II, c, admite aplicação retroativa da penalidade menos severa a ato não definitivamente julgado.","src":"CTN, arts. 96 a 112","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8009,"s":7,"module":4,"topic":"Obrig
