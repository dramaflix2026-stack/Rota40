.474/1968 disciplina a duplicata decorrente das operações nela previstas, exigindo atenção aos requisitos legais de emissão e cobrança.","src":"Lei 5.474/1968","url":"https://www.planalto.gov.br/ccivil_03/leis/l5474.htm"},{"id":11015,"s":10,"module":7,"topic":"Propriedade industrial e contratos empresariais","difficulty":"Intermediária","q":"Qual é o prazo ordinário de vigência do registro de marca, admitidas prorrogações sucessivas?","a":["Cinco anos sem renovação","Dez anos","Vinte anos sem renovação","Prazo necessariamente perpétuo"],"ok":1,"e":"O art. 133 da Lei 9.279/1996 prevê dez anos de vigência do registro, prorrogáveis por períodos iguais e sucessivos.","src":"Lei 9.279/1996, arts. 8º, 9º, 40, 122 a 129 e 133; Lei 13.966/2019","url":"https://www.planalto.gov.br/ccivil_03/leis/l9279.htm"},{"id":11016,"s":10,"module":7,"topic":"Propriedade industrial e contratos empresariais","difficulty":"Intermediária","q":"Qual conjunto de requisitos caracteriza a patenteabilidade de uma invenção segundo o art. 8º?","a":["Somente valor comercial","Somente criatividade artística","Novidade, atividade inventiva e aplicação industrial","Registro prévio de marca"],"ok":2,"e":"O art. 8º exige conjuntamente novidade, atividade inventiva e aplicação industrial para invenções patenteáveis.","src":"Lei 9.279/1996, arts. 8º, 9º, 40, 122 a 129 e 133; Lei 13.966/2019","url":"https://www.planalto.gov.br/ccivil_03/leis/l9279.htm"},{"id":11017,"s":10,"module":8,"topic":"Recuperação judicial e extrajudicial","difficulty":"Intermediária","q":"Qual tempo mínimo de exercício regular da atividade exige, em regra, o caput do art. 48 para requerer recuperação judicial?","a":["Seis meses","Um ano exato","Mais de dois anos","Dez anos"],"ok":2,"e":"O art. 48 exige exercício regular por mais de dois anos no momento do pedido, além dos demais requisitos cumulativos.","src":"Lei 11.101/2005, arts. 1º a 6º, 47 a 69 e 161 a 167","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm"},{"id":11018,"s":10,"module":8,"topic":"Recuperação judicial e extrajudicial","difficulty":"Intermediária","q":"Qual prazo do art. 53 para apresentação do plano de recuperação judicial após a publicação da decisão que deferiu o processamento?","a":["Sessenta dias","Quinze dias","Cento e oitenta dias","Prazo ilimitado"],"ok":0,"e":"O art. 53 fixa prazo improrrogável de sessenta dias, sob a consequência legal prevista.","src":"Lei 11.101/2005, arts. 1º a 6º, 47 a 69 e 161 a 167","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm"},{"id":11019,"s":10,"module":9,"topic":"Falência, classificação de créditos e encerramento","difficulty":"Intermediária","q":"Qual limite geral em salários mínimos por credor é previsto para classificação preferencial de créditos derivados da legislação do trabalho no art. 83, I?","a":["Trinta","Cento e cinquenta","Quarenta","Mil"],"ok":1,"e":"O art. 83, I, limita essa classificação dos créditos trabalhistas a 150 salários mínimos por credor e contempla os decorrentes de acidentes de trabalho em disciplina própria.","src":"Lei 11.101/2005, arts. 75 a 160","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm"},{"id":11020,"s":10,"module":9,"topic":"Falência, classificação de créditos e encerramento","difficulty":"Intermediária","q":"A sentença de falência é consequência automática de qualquer prejuízo econômico apresentado no balanço?","a":["Sim, independentemente de hipótese legal","Sim, se ocorrer por dois meses","Sim, por escolha exclusiva de fornecedor","Não, é necessário enquadramento em hipótese legal e procedimento pertinente"],"ok":3,"e":"A falência exige os pressupostos legais e o procedimento correspondente. Prejuízo contábil isolado não substitui a análise das hipóteses do art. 94.","src":"Lei 11.101/2005, arts. 75 a 160","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm"}];const humanRightsModules=[{"t":"Fundamentos, evolução e características","ref":"DUDH, preâmbulo e arts. 1º a 2º; CF, arts. 1º e 4º","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights","lessons":[["Dignidade e universalidade","Direitos humanos protegem a pessoa contra abusos e orientam a criação de condições para uma existência digna. A universalidade não depende de nacionalidade ou cidadania. Direitos fundamentais designam, em sentido técnico, direitos reconhecidos na ordem constitucional interna, sem negar a relação com os direitos humanos internacionais."],["Dimensões e interdependência","A classificação em dimensões organiza didaticamente liberdades civis e políticas, direitos sociais, econômicos e culturais e direitos de solidariedade. As dimensões não se substituem: o exercício de um direito pode depender da efetividade de outros. O acesso à educação, por exemplo, amplia as condições de participação política."],["Deveres do Estado","Respeitar significa evitar interferências indevidas; proteger envolve prevenir violações por terceiros; realizar demanda medidas para efetivação. Nem todo direito é absoluto, mas restrições precisam respeitar legalidade e justificativa adequada. Algumas proibições, como a tortura, não admitem suspensão."]],"map":["Dignidade → fundamento","Universalidade → toda pessoa","Dimensões → complementares","Estado → respeitar, proteger e realizar"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Declaração Universal e sistema global","ref":"DUDH, arts. 3º a 30; Carta da ONU","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights","lessons":[["Origem e natureza","A Declaração Universal foi adotada pela Assembleia Geral da ONU em 1948. Não é, por sua forma, um tratado sujeito à ratificação, mas tornou-se referência central do sistema internacional. Sua relevância normativa não se resume à classificação formal, pois alguns de seus conteúdos refletem normas internacionais reconhecidas por outras fontes."],["Liberdades e proteção","A Declaração contempla vida, liberdade, igualdade, acesso a remédios efetivos, julgamento imparcial e liberdade de consciência e expressão. Ao resolver questões, identifique a garantia afetada e evite interpretar a liberdade de expressão como autorização irrestrita para violações de outros direitos."],["Direitos sociais e culturais","A DUDH também reconhece trabalho, educação, segurança social, participação cultural e condições adequadas de vida. A presença desses direitos no mesmo documento reforça a indivisibilidade. O art. 29 trata de deveres e limites compatíveis com os fins democráticos e os direitos de terceiros."]],"map":["1948 → Assembleia Geral","Declaração ≠ tratado","Liberdades → proteção da pessoa","Direitos sociais → dignidade"],"extraUrl":"https://uhri.ohchr.org/en/about"},{"t":"Pactos internacionais de 1966","ref":"PIDCP, Decreto 592/1992; PIDESC, Decreto 591/1992","url":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0592.htm","lessons":[["Direitos civis e políticos","O PIDCP estabelece obrigações de respeito e garantia de direitos, abrangendo participação política, liberdade pessoal e garantias processuais. O Comitê de Direitos Humanos monitora sua aplicação. Comunicações individuais dependem do reconhecimento do mecanismo pertinente, como o Protocolo Facultativo."],["Direitos econômicos, sociais e culturais","O PIDESC disciplina direitos como educação, saúde, trabalho e seguridade social. A realização progressiva conforme recursos disponíveis não transforma todas as obrigações em promessas facultativas. A adoção de medidas e a não discriminação possuem importância imediata."],["Derrogações e limites","O PIDCP prevê regras especiais para emergências públicas oficialmente proclamadas, sem permitir suspensão de todos os direitos. A proibição de tortura não pode ser afastada por esse mecanismo. Limitações ordinárias e derrogações excepcionais são institutos distintos e exigem seus próprios pressupostos."]],"map":["PIDCP → liberdades e garantias","PIDESC → direitos econômicos e sociais","Progressividade → dever de agir","Emergência → limites estritos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0591.htm"},{"t":"Mecanismos de monitoramento da ONU","ref":"OHCHR, mecanismos internacionais de direitos humanos","url":"https://uhri.ohchr.org/en/about","lessons":[["Órgãos e comitês","O Conselho de Direitos Humanos é órgão intergovernamental. Os comitês de tratados são compostos por especialistas independentes e monitoram instrumentos específicos. Não confunda o Conselho com o Comitê de Direitos Humanos do PIDCP nem atribua a todos os órgãos competência jurisdicional."],["Revisão Periódica Universal","A RPU é mecanismo de avaliação entre Estados no âmbito do Conselho de Direitos Humanos. Examina a situação dos Estados membros da ONU e gera recomendações. Não é processo criminal nem tribunal internacional que condena indivíduos."],["Procedimentos especiais","Relatores especiais e grupos de trabalho possuem mandatos temáticos ou relativos a países. Podem produzir relatórios e comunicações nos limites do mandato. Reclamações individuais perante comitês dependem da competência reconhecida, de requisitos de admissibilidade e do instrumento específico."]],"map":["Conselho → órgão intergovernamental","Comitês → especialistas","RPU → revisão entre Estados","Relatores → mandatos específicos"]},{"t":"Sistema interamericano e Convenção Americana","ref":"CADH, arts. 1º a 32 e 33","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm","lessons":[["Proteção regional","O sistema interamericano integra a estrutura regional da OEA e possui diferentes instrumentos de proteção. A Convenção Americana, também conhecida como Pacto de São José, foi promulgada no Brasil pelo Decreto 678/1992. Sua aplicação deve considerar os compromissos assumidos por cada Estado."],["Direitos e garantias","A Convenção contempla integridade pessoal, liberdade, garantias judiciais e proteção judicial. O art. 8º protege garantias do processo; o art. 25 prevê proteção por recurso efetivo. A análise de violações deve considerar deveres de respeito e garantia, e não somente a existência formal de leis nacionais."],["Comissão e Corte","O art. 33 identifica Comissão e Corte Interamericanas como órgãos competentes quanto aos compromissos convencionais. A Comissão recebe petições e desempenha funções de promoção e monitoramento; a Corte exerce funções jurisdicionais e consultivas conforme seus pressupostos."]],"map":["OEA → sistema regional","CADH → Pacto de São José","Art. 8º → garantias judiciais","Comissão ≠ Corte"]},{"t":"Petições, admissibilidade e Corte Interamericana","ref":"CADH, arts. 44 a 51 e 61 a 69","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm","lessons":[["Petição individual","Pessoas, grupos e entidades não governamentais legalmente reconhecidas em Estado membro da OEA podem apresentar petições à Comissão nos termos do art. 44. Não é necessário que a pessoa que peticiona seja a própria vítima. Isso não equivale a ajuizar diretamente um caso contencioso perante a Corte."],["Admissibilidade","Em regra, exige-se esgotamento dos recursos internos e apresentação dentro de seis meses da notificação da decisão definitiva. Existem exceções, como inexistência de devido processo, impedimento de acesso aos recursos e demora injustificada. Também se examina duplicidade internacional e os demais requisitos."],["Julgamento e reparações","Estados-partes e Comissão podem submeter casos à Corte conforme o art. 61 e a jurisdição reconhecida. As sentenças são definitivas e obrigatórias para os Estados que sejam partes no caso, nos termos da Convenção. Reparações podem incluir indenizações, medidas de investigação, reconhecimento e garantias de não repetição."]],"map":["Pessoa → petição à Comissão","Admissibilidade → regra e exceções","Corte → Estados e Comissão","Sentença → cumprimento pelo Estado parte"]},{"t":"Incorporação, hierarquia e convencionalidade","ref":"CF, art. 5º, §§ 2º a 4º; Decreto 6.949/2009","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Incorporação e aprovação qualificada","O procedimento interno de incorporação de tratados envolve as competências constitucionais pertinentes. Tratados de direitos humanos aprovados em cada Casa do Congresso em dois turnos por três quintos dos membros equivalem a emendas constitucionais. A Convenção sobre Direitos das Pessoas com Deficiência é exemplo."],["Supralegalidade","Segundo a orientação do STF no RE 466.343, tratados de direitos humanos incorporados sem o rito do art. 5º, § 3º, possuem status supralegal: acima da legislação ordinária e abaixo da Constituição. A Súmula Vinculante 25 considera ilícita a prisão civil do depositário infiel, qualquer que seja a modalidade de depósito."],["Controle de convencionalidade","A análise de compatibilidade das normas internas com obrigações internacionais de direitos humanos complementa o controle constitucional. É importante diferenciar hierarquia doméstica de responsabilidade internacional: o Estado não pode simplesmente justificar o descumprimento de tratado por referência à sua lei interna."]],"map":["Rito qualificado → equivalência a emenda","Demais tratados de DH → supralegalidade segundo STF","SV 25 → depositário infiel","Convencionalidade → compatibilidade com tratado"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm"},{"t":"Igualdade, discriminação e grupos vulnerabilizados","ref":"Convenção sobre Direitos das Pessoas com Deficiência; Convenção contra Discriminação Racial","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm","lessons":[["Igualdade material","Igualdade não significa ignorar barreiras que impedem o exercício de direitos. Medidas destinadas a remover desigualdades podem ser legítimas conforme seus fundamentos e proporcionalidade. A proteção contra discriminação alcança situações de exclusão direta e indireta nos regimes aplicáveis."],["Deficiência e acessibilidade","A Convenção adota perspectiva que considera impedimentos em interação com barreiras. Acessibilidade e adaptações razoáveis promovem participação em igualdade de condições. Deficiência não implica automaticamente incapacidade civil; as medidas de apoio devem respeitar autonomia, vontade e preferências."],["Racismo e discriminação","A Convenção internacional contra discriminação racial exige medidas de prevenção e combate a práticas discriminatórias. A igualdade perante a lei deve ser efetiva, abrangendo direitos civis, políticos e sociais. A Convenção Interamericana contra o Racismo também foi incorporada pelo Brasil com aprovação qualificada."]],"map":["Igualdade → remoção de barreiras","Acessibilidade → participação","Deficiência ≠ incapacidade automática","Racismo → dever de prevenção e combate"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/1950-1969/d65810.html"},{"t":"Proteção de mulheres, crianças e pessoas refugiadas","ref":"Convenção de Belém do Pará; Lei 9.474/1997; Convenção sobre os Direitos da Criança","url":"https://www.planalto.gov.br/ccivil_03/decreto/1996/d1973.htm","lessons":[["Violência contra mulheres","A Convenção de Belém do Pará orienta prevenção, punição e erradicação da violência contra a mulher. A violência pode ocorrer no âmbito público ou privado. O Estado tem deveres de proteção e atuação diligente, sem reduzir a questão à existência de uma relação doméstica formal."],["Direitos da criança","O interesse superior da criança orienta decisões que a afetam. A proteção integral é compatível com o reconhecimento da criança como sujeito de direitos. Participação e escuta devem considerar idade e maturidade; proteção não equivale à supressão de toda autonomia."],["Refúgio e não devolução","A Lei 9.474/1997 disciplina reconhecimento da condição de refugiado, incluindo hipóteses relacionadas a perseguição e grave e generalizada violação de direitos humanos. O princípio de não devolução protege contra retorno a situações de risco nos limites do regime aplicável. Refúgio não se confunde com qualquer modalidade de imigração."]],"map":["Belém do Pará → combate à violência","Criança → proteção integral e participação","Refúgio → hipóteses legais","Não devolução → proteção contra retorno a risco"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9474.htm"},{"t":"Responsabilidade internacional e proteção no Brasil","ref":"CF, arts. 5º, 109, V-A e § 5º; CADH, arts. 63 e 68","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Responsabilidade do Estado","O descumprimento de obrigação internacional imputável ao Estado pode gerar responsabilidade internacional. Atos e omissões dos poderes públicos devem ser examinados conforme o dever aplicável. A responsabilização internacional do Estado é diferente da eventual responsabilidade penal ou civil individual de agentes."],["Reparação e cumprimento","A resposta a uma violação pode exigir cessação, investigação, reparação material e imaterial e medidas para evitar repetição. O art. 68 da Convenção Americana estabelece o compromisso de cumprir decisões da Corte em casos de que os Estados sejam partes. A implementação pode envolver diversos órgãos nacionais."],["Incidente de deslocamento de competência","Em graves violações de direitos humanos, o Procurador-Geral da República pode suscitar perante o STJ incidente de deslocamento para a Justiça Federal, com finalidade de assegurar obrigações decorrentes de tratados internacionais. A federalização não é automática nem depende apenas de repercussão pública."]],"map":["Estado → responsabilidade internacional","Reparação → medidas adequadas","IDC → Procurador-Geral da República","STJ → exame do deslocamento"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"}];const humanRightsQuestions=[{"id":12001,"s":11,"module":0,"topic":"Fundamentos, evolução e características","difficulty":"Intermediária","q":"A universalidade dos direitos humanos exige nacionalidade de um Estado específico para que a pessoa seja titular desses direitos?","a":["Sim, sempre","Não, a titularidade decorre da condição humana","Sim, salvo contrato internacional privado","Sim, se a pessoa não votar"],"ok":1,"e":"A DUDH parte da igualdade em dignidade e direitos, independentemente da nacionalidade, sem eliminar regimes próprios de determinados direitos políticos.","src":"DUDH, preâmbulo e arts. 1º a 2º; CF, arts. 1º e 4º","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights"},{"id":12002,"s":11,"module":0,"topic":"Fundamentos, evolução e características","difficulty":"Intermediária","q":"Como se relacionam as diferentes dimensões de direitos humanos?","a":["Cada dimensão revoga a anterior","Direitos sociais eliminam liberdades civis","São complementares e interdependentes","Apenas a dimensão mais recente permanece válida"],"ok":2,"e":"A classificação é didática, não uma sucessão de regimes excludentes. Direitos civis, políticos, sociais, econômicos e culturais relacionam-se entre si.","src":"DUDH, preâmbulo e arts. 1º a 2º; CF, arts. 1º e 4º","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights"},{"id":12003,"s":11,"module":1,"topic":"Declaração Universal e sistema global","difficulty":"Intermediária","q":"A DUDH foi adotada em qual ano pela Assembleia Geral da ONU?","a":["1948","1969","1988","2002"],"ok":0,"e":"A Assembleia Geral adotou a Declaração Universal em 10 de dezembro de 1948.","src":"DUDH, arts. 3º a 30; Carta da ONU","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights"},{"id":12004,"s":11,"module":1,"topic":"Declaração Universal e sistema global","difficulty":"Intermediária","q":"A Declaração Universal é formalmente um tratado internacional que cada Estado ratifica?","a":["Sim, em todos os casos","Sim, apenas na América","Sim, por decisão judicial individual","Não, foi adotada como declaração da Assembleia Geral"],"ok":3,"e":"A forma de declaração difere da de um tratado. Isso não elimina a importância jurídica de seus princípios nem a existência de obrigações equivalentes em outras fontes.","src":"DUDH, arts. 3º a 30; Carta da ONU","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights"},{"id":12005,"s":11,"module":2,"topic":"Pactos internacionais de 1966","difficulty":"Intermediária","q":"Qual instrumento internacional promulgado pelo Decreto 591/1992 trata especialmente de direitos econômicos, sociais e culturais?","a":["Convenção Americana","PIDESC","Estatuto de Roma","Convenção de Viena sobre relações diplomáticas"],"ok":1,"e":"O Decreto 591 promulga o Pacto Internacional sobre Direitos Econômicos, Sociais e Culturais.","src":"Decreto 591/1992; PIDESC","url":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0591.htm"},{"id":12006,"s":11,"module":2,"topic":"Pactos internacionais de 1966","difficulty":"Intermediária","q":"Uma emergência pública permite suspender a proibição de tortura pelo mecanismo de derrogação do PIDCP?","a":["Sim, mediante autorização policial","Sim, se temporária","Não, o art. 4º protege a proibição de tortura contra derrogação","Sim, se o Estado declarar crise econômica"],"ok":2,"e":"O art. 4º, § 2º, do PIDCP exclui da derrogação, entre outros, o art. 7º, relativo à proibição de tortura e tratamentos cruéis.","src":"PIDCP, Decreto 592/1992; PIDESC, Decreto 591/1992","url":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0592.htm"},{"id":12007,"s":11,"module":3,"topic":"Mecanismos de monitoramento da ONU","difficulty":"Intermediária","q":"A Revisão Periódica Universal é principalmente qual mecanismo?","a":["Revisão da situação de direitos humanos dos Estados membros por seus pares","Julgamento criminal individual","Recurso de apelação nacional","Tratado de comércio"],"ok":0,"e":"A RPU funciona no Conselho de Direitos Humanos como mecanismo de avaliação entre Estados.","src":"OHCHR, mecanismos internacionais de direitos humanos","url":"https://uhri.ohchr.org/en/about"},{"id":12008,"s":11,"module":3,"topic":"Mecanismos de monitoramento da ONU","difficulty":"Intermediária","q":"Os comitês de tratados de direitos humanos são compostos, em regra, por quem?","a":["Juízes nacionais de cada município","Deputados eleitos pela ONU","Representantes comerciais obrigatórios","Especialistas independentes"],"ok":3,"e":"Os órgãos de tratados exercem mandatos de monitoramento atribuídos pelos instrumentos internacionais e são compostos por especialistas independentes.","src":"OHCHR, mecanismos internacionais de direitos humanos","url":"https://uhri.ohchr.org/en/about"},{"id":12009,"s":11,"module":4,"topic":"Sistema interamericano e Convenção Americana","difficulty":"Intermediária","q":"Qual diploma promulgou a Convenção Americana sobre Direitos Humanos no Brasil?","a":["Decreto 592/1992","Decreto 678/1992","Decreto 6.949/2009","Código Civil de 2002"],"ok":1,"e":"O Decreto 678/1992 promulga o Pacto de São José da Costa Rica.","src":"CADH, arts. 1º a 32 e 33","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":12010,"s":11,"module":4,"topic":"Sistema interamericano e Convenção Americana","difficulty":"Intermediária","q":"Quais órgãos são indicados no art. 33 da Convenção Americana?","a":["STF e STJ","Conselho de Segurança e Tribunal Penal Internacional","Comissão Interamericana e Corte Interamericana","Congresso Nacional e OAB"],"ok":2,"e":"A Convenção distingue as competências da Comissão e da Corte Interamericanas no sistema regional.","src":"CADH, arts. 1º a 32 e 33","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":12011,"s":11,"module":5,"topic":"Petições, admissibilidade e Corte Interamericana","difficulty":"Intermediária","q":"Uma pessoa pretende apresentar diretamente à Corte Interamericana um novo caso contencioso. Qual a regra do art. 61?","a":["Qualquer pessoa possui legitimidade direta irrestrita","Somente empresas privadas podem fazê-lo","Apenas Estados-partes e a Comissão podem submeter casos","Somente o STF pode fazê-lo"],"ok":2,"e":"O art. 61 limita a submissão de casos à Corte aos Estados-partes e à Comissão, sem impedir a participação das vítimas segundo o procedimento aplicável.","src":"CADH, arts. 44 a 51 e 61 a 69","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":12012,"s":11,"module":5,"topic":"Petições, admissibilidade e Corte Interamericana","difficulty":"Intermediária","q":"A demora injustificada na decisão sobre recursos internos pode afastar a exigência ordinária de esgotamento para petição à Comissão?","a":["Sim, é hipótese de exceção prevista no art. 46","Não, nunca","Sim, somente por contrato privado","Não, a Convenção não prevê exceções"],"ok":0,"e":"O art. 46, § 2º, c, contempla demora injustificada na decisão sobre os recursos internos.","src":"CADH, arts. 44 a 51 e 61 a 69","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":12013,"s":11,"module":6,"topic":"Incorporação, hierarquia e convencionalidade","difficulty":"Intermediária","q":"Qual quórum o art. 5º, § 3º, exige para equivalência de tratado de direitos humanos a emenda constitucional?","a":["Maioria simples em turno único","Unanimidade apenas no Senado","Dois terços apenas na Câmara","Três quintos dos membros, em dois turnos em cada Casa"],"ok":3,"e":"O dispositivo prevê aprovação qualificada nas duas Casas e em dois turnos, com três quintos de seus respectivos membros.","src":"CF, art. 5º, §§ 2º a 4º; Decreto 6.949/2009","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":12014,"s":11,"module":6,"topic":"Incorporação, hierarquia e convencionalidade","difficulty":"Intermediária","q":"Qual é a orientação do STF sobre a prisão civil de depositário infiel?","a":["É ilícita em qualquer modalidade de depósito","É obrigatória em todo contrato","É válida se o credor pedir","É permitida apenas em depósito voluntário"],"ok":0,"e":"A Súmula Vinculante 25 afasta a prisão civil por depósito infiel, em contexto de aplicação dos tratados de direitos humanos.","src":"CF, art. 5º, §§ 2º a 4º; Decreto 6.949/2009","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":12015,"s":11,"module":7,"topic":"Igualdade, discriminação e grupos vulnerabilizados","difficulty":"Intermediária","q":"A existência de deficiência implica automaticamente incapacidade para todos os atos da vida civil?","a":["Sim, em qualquer circunstância","Não, a proteção reconhece capacidade legal em igualdade de condições","Sim, se a deficiência for permanente","Sim, por decisão do empregador"],"ok":1,"e":"O art. 12 da Convenção reconhece capacidade legal em igualdade de condições, com acesso a apoio e salvaguardas pertinentes.","src":"Convenção sobre Direitos das Pessoas com Deficiência; Convenção contra Discriminação Racial","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm"},{"id":12016,"s":11,"module":7,"topic":"Igualdade, discriminação e grupos vulnerabilizados","difficulty":"Intermediária","q":"Uma adaptação razoável busca qual finalidade?","a":["Excluir a pessoa de atividades coletivas","Substituir integralmente a autonomia da pessoa","Assegurar exercício de direitos em igualdade, observados os limites do conceito","Criar sanção penal automática"],"ok":2,"e":"A adaptação razoável envolve ajustes necessários e adequados, sem ônus desproporcional ou indevido, para assegurar igualdade de exercício de direitos.","src":"Convenção sobre Direitos das Pessoas com Deficiência; Convenção contra Discriminação Racial","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm"},{"id":12017,"s":11,"module":8,"topic":"Proteção de mulheres, crianças e pessoas refugiadas","difficulty":"Intermediária","q":"A Convenção de Belém do Pará limita a proteção à violência praticada dentro da residência da vítima?","a":["Sim, exclusivamente","Sim, apenas no casamento","Sim, se houver coabitação","Não, contempla violência também no âmbito público"],"ok":3,"e":"A Convenção reconhece violência contra a mulher tanto na esfera pública quanto na privada, nos termos de seus arts. 1º e 2º.","src":"Convenção de Belém do Pará; Lei 9.474/1997; Convenção sobre os Direitos da Criança","url":"https://www.planalto.gov.br/ccivil_03/decreto/1996/d1973.htm"},{"id":12018,"s":11,"module":8,"topic":"Proteção de mulheres, crianças e pessoas refugiadas","difficulty":"Intermediária","q":"A grave e generalizada violação de direitos humanos pode integrar hipótese de reconhecimento da condição de refugiado na lei brasileira?","a":["Sim, conforme art. 1º, III, da Lei 9.474/1997","Não, jamais","Somente se a pessoa possuir cidadania brasileira","Somente em caso de contrato de trabalho"],"ok":0,"e":"A lei brasileira inclui a situação de quem é obrigado a deixar seu país de nacionalidade para buscar refúgio em razão de grave e generalizada violação de direitos humanos.","src":"Lei 9.474/1997, art. 1º, III","url":"https://www.planalto.gov.br/ccivil_03/leis/l9474.htm"},{"id":12019,"s":11,"module":9,"topic":"Responsabilidade internacional e proteção no Brasil","difficulty":"Intermediária","q":"Quem pode suscitar perante o STJ o incidente de deslocamento de competência previsto no art. 109, § 5º, da Constituição?","a":["Qualquer advogado diretamente","Procurador-Geral da República","Qualquer testemunha","Presidente de associação privada"],"ok":1,"e":"O texto constitucional atribui essa iniciativa ao Procurador-Geral da República, nas hipóteses e para a finalidade previstas.","src":"CF, arts. 5º, 109, V-A e § 5º; CADH, arts. 63 e 68","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":12020,"s":11,"module":9,"topic":"Responsabilidade internacional e proteção no Brasil","difficulty":"Intermediária","q":"A responsabilidade internacional de um Estado por violação de direitos humanos é necessariamente idêntica à condenação criminal de um agente individual?","a":["Sim, são o mesmo instituto","Sim, quando há indenização","Não, são regimes jurídicos distintos","Sim, se a violação ocorrer no território nacional"],"ok":2,"e":"A responsabilidade internacional do Estado e a responsabilização individual possuem sujeitos, pressupostos e consequências próprias.","src":"CF, arts. 5º, 109, V-A e § 5º; CADH, arts. 63 e 68","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const environmentModules=[{"t":"Fundamentos constitucionais e princípios ambientais","ref":"CF, art. 225; Lei 6.938/1981","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Direito fundamental ao ambiente","A Constituição protege o meio ambiente ecologicamente equilibrado como bem de uso comum e condição da qualidade de vida. Poder público e coletividade têm dever de defendê-lo para gerações presentes e futuras. A titularidade coletiva não impede proteção judicial de danos individuais relacionados."],["Prevenção e precaução","Prevenção atua sobre riscos conhecidos; precaução orienta decisões diante de incertezas científicas relevantes sobre danos potencialmente graves. Nenhum dos princípios dispensa análise fundamentada das circunstâncias e medidas proporcionais."],["Poluidor-pagador e desenvolvimento sustentável","O poluidor-pagador busca internalizar custos de prevenção e reparação, sem conferir licença para poluir. Desenvolvimento sustentável integra proteção ecológica, atividade econômica e justiça social. Participação e informação qualificam decisões ambientais."]],"map":["Art. 225 → direito e dever coletivo","Prevenção → risco conhecido","Precaução → incerteza relevante","Poluidor-pagador → internalização de custos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"t":"Política Nacional do Meio Ambiente e SISNAMA","ref":"Lei 6.938/1981, arts. 2º a 9º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm","lessons":[["Finalidades da PNMA","A política nacional organiza instrumentos para preservar, melhorar e recuperar a qualidade ambiental, compatibilizando desenvolvimento e equilíbrio ecológico. O conceito legal de poluição abrange diferentes formas de degradação, não somente descarte de resíduos."],["Estrutura institucional","O SISNAMA reúne órgãos e entidades dos diferentes níveis federativos. O CONAMA exerce funções consultivas e deliberativas nos limites legais. IBAMA e ICMBio têm atribuições executivas próprias; órgãos estaduais e municipais também integram o sistema."],["Instrumentos","Padrões de qualidade, zoneamento, avaliação de impactos, licenciamento e instrumentos econômicos integram a política. Um instrumento não substitui necessariamente outro: a autorização para atividade pode exigir licenças, estudos e outras providências autônomas conforme o caso."]],"map":["PNMA → qualidade ambiental","SISNAMA → sistema federativo","CONAMA → funções consultivas e deliberativas","Instrumentos → atuação complementar"]},{"t":"Competências e federalismo ambiental","ref":"CF, arts. 23, 24 e 30; LC 140/2011","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp140.htm","lessons":[["Competência material","Proteger o ambiente e combater a poluição integra competências comuns dos entes federativos. A LC 140/2011 organiza a cooperação administrativa, distribuindo ações de licenciamento e fiscalização. Competência comum não significa que todos emitam licenças simultaneamente para o mesmo empreendimento."],["Competência legislativa","União, Estados e Distrito Federal legislam concorrentemente sobre matérias ambientais previstas no art. 24. Municípios possuem competência de interesse local e suplementação, observada a Constituição. Norma local deve ser analisada à luz das competências e da proteção ambiental pertinente."],["Licenciamento e fiscalização","A LC 140 prevê licenciamento ou autorização ambiental por um único ente federativo, segundo os critérios legais. Os demais podem manifestar-se nos termos da lei. Fiscalização e adoção de medidas urgentes seguem regras próprias; a repartição não elimina o dever comum de proteção."]],"map":["Art. 23 → competência comum","Art. 24 → competência concorrente","Município → interesse local e suplementação","Licenciamento → ente competente"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Licenciamento e avaliação de impactos ambientais","ref":"CF, art. 225, § 1º, IV; Leis 15.190/2025 e 15.300/2025","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15190.htm","lessons":[["Licenciamento e licenças","A Lei 15.190/2025 disciplina o licenciamento ambiental e seus procedimentos. As licenças e condicionantes devem corresponder ao tipo de atividade e aos impactos avaliados. A escolha de procedimento não é arbitrária: deve observar a lei, os critérios da autoridade competente e eventuais decisões judiciais aplicáveis."],["EIA e RIMA","Para obra ou atividade potencialmente causadora de significativa degradação, a Constituição exige estudo prévio de impacto ambiental, ao qual se dá publicidade. O EIA analisa impactos, alternativas e medidas de controle; o RIMA comunica resultados de forma compreensível. Estudos simplificados não substituem o EIA quando constitucionalmente exigido."],["Atualizações e licenciamento especial","A Lei 15.300/2025 disciplina a Licença Ambiental Especial para atividades e empreendimentos estratégicos conforme critérios legais. A nova legislação não elimina o dever constitucional de proteção. Ao estudar hipóteses de dispensa, modalidades simplificadas e participação pública, consulte a redação consolidada, os vetos promulgados e a jurisprudência atual."]],"map":["Licenciamento → avaliação e condicionantes","Impacto significativo → EIA prévio","RIMA → comunicação dos impactos","LAE → regime especial"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15300.htm"},{"t":"Florestas, APP, reserva legal e cadastro rural","ref":"Lei 12.651/2012, arts. 3º, 4º, 12, 17 e 29","url":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm","lessons":[["Área de Preservação Permanente","APP protege funções ecológicas, como recursos hídricos, estabilidade do solo e biodiversidade. Pode existir mesmo sem vegetação nativa presente. Intervenção ou supressão depende de enquadramento nas hipóteses legais e das autorizações exigíveis."],["Reserva Legal","Reserva Legal é área situada no interior de imóvel rural destinada à conservação e ao uso sustentável nos termos legais. Seus percentuais variam conforme localização e características da vegetação. Não confunda percentuais de reserva com regras de APP, nem aplique regra geral sem examinar exceções."],["CAR e regularização","O Cadastro Ambiental Rural reúne informações ambientais dos imóveis rurais. A inscrição é obrigatória conforme o art. 29 e não constitui título de propriedade. Programas de regularização, compensação e recomposição têm requisitos próprios; cadastro não equivale a autorização para supressão."]],"map":["APP → função ecológica","Reserva Legal → imóvel rural","Percentuais → localização e bioma","CAR → cadastro, não título"]},{"t":"Unidades de conservação e biodiversidade","ref":"Lei 9.985/2000, arts. 7º a 21; CF, art. 225","url":"https://www.planalto.gov.br/ccivil_03/leis/l9985.htm","lessons":[["Categorias do SNUC","Unidades de conservação dividem-se em dois grupos: proteção integral e uso sustentável. A primeira prioriza preservação da natureza e uso indireto, ressalvadas hipóteses legais. O segundo compatibiliza conservação com uso sustentável de parcela dos recursos."],["Criação e gestão","A criação de unidade exige ato do poder público e, em regra, estudos técnicos e consulta pública, observadas exceções legais. Plano de manejo orienta uso, zoneamento e proteção. Redução ou desafetação de espaços especialmente protegidos deve observar a reserva legal constitucional."],["Categorias e particularidades","Parque Nacional, Estação Ecológica e Reserva Biológica integram proteção integral. APA, Floresta Nacional e Reserva Extrativista pertencem ao grupo de uso sustentável. Regime dominial, visitação, pesquisa e presença de populações tradicionais dependem da categoria escolhida."]],"map":["Proteção integral → preservação","Uso sustentável → conservação e uso compatível","Parque → proteção integral","APA → uso sustentável"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Recursos hídricos e gestão de resíduos","ref":"Leis 9.433/1997 e 12.305/2010","url":"https://www.planalto.gov.br/ccivil_03/leis/l9433.htm","lessons":[["Política de recursos hídricos","A água é bem de domínio público e recurso natural limitado, dotado de valor econômico. Em situações de escassez, o uso prioritário é consumo humano e dessedentação de animais. A bacia hidrográfica constitui unidade territorial para implementação da política."],["Outorga e gestão","A outorga disciplina o direito de uso da água nas hipóteses legais e não aliena o recurso hídrico. Planos, cobrança, enquadramento dos corpos de água e sistemas de informação integram instrumentos da política. Usos legalmente dispensados de outorga não afastam todos os deveres ambientais."],["Resíduos sólidos","A política estabelece prioridade de não geração, redução, reutilização, reciclagem, tratamento e disposição adequada de rejeitos. Responsabilidade compartilhada pelo ciclo de vida e logística reversa distribuem deveres conforme produtos e agentes. Resíduo aproveitável não se confunde com rejeito sem alternativa viável de tratamento ou recuperação."]],"map":["Água → domínio público","Bacia → unidade territorial","Outorga → direito de uso","Resíduos → prioridade à não geração"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2010/lei/l12305.htm"},{"t":"Responsabilidade civil por dano ambiental","ref":"Lei 6.938/1981, art. 14, § 1º; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm","lessons":[["Responsabilidade objetiva","O poluidor responde pela reparação ou indenização de danos ambientais independentemente de culpa, observados dano, nexo de imputação e regime aplicável. A jurisprudência do STJ adota a teoria do risco integral em matéria de responsabilidade civil ambiental. A licença não exclui automaticamente responsabilidade por dano efetivamente causado."],["Reparação integral","A recuperação do ambiente degradado é prioritária quando tecnicamente possível. Obrigações de fazer e indenizações podem ser cumuladas conforme os danos existentes, como reconhece a Súmula 629 do STJ. A indenização não é autorização para manter degradação."],["Obrigações propter rem e prescrição","A jurisprudência reconhece natureza propter rem de obrigações ambientais, com possibilidades e limites de imputação a titulares e possuidores, inclusive conforme Tema 1204 do STJ. O STF, no Tema 999, considera imprescritível a pretensão de reparação civil de dano ambiental. Diferencie essa pretensão de sanções administrativas e penais."]],"map":["Civil → objetiva","Reparação → recuperação e indenização cabível","Propter rem → vínculo com o bem","Tema 999 STF → reparação civil imprescritível"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Infrações administrativas e crimes ambientais","ref":"Lei 9.605/1998; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9605.htm","lessons":[["Esferas de responsabilização","Condutas e atividades lesivas podem gerar responsabilidade civil, administrativa e penal, observados os pressupostos próprios de cada esfera. A reparação civil objetiva não transforma automaticamente toda infração em crime. Sanções administrativas também exigem procedimento, motivação e direito de defesa."],["Pessoa jurídica","A Lei 9.605/1998 admite responsabilização de pessoas jurídicas quando a infração for cometida por decisão de representante legal ou contratual, ou órgão colegiado, no interesse ou benefício da entidade. A responsabilidade da pessoa jurídica não exclui a de pessoas naturais conforme suas contribuições."],["Sanções e garantias","Infrações administrativas podem ensejar advertência, multas, embargo e outras sanções legalmente previstas. Na esfera penal, a tipicidade exige análise de elementos legais e subjetivos. A imposição de medida cautelar administrativa não equivale à condenação penal."]],"map":["Civil ≠ administrativa ≠ penal","Pessoa jurídica → requisitos do art. 3º","Sanção → procedimento e defesa","Crime → tipicidade e culpabilidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Tutela coletiva e instrumentos processuais ambientais","ref":"Lei 7.347/1985, arts. 1º, 3º, 5º e 13; CF, art. 5º, LXXIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l7347compilada.htm","lessons":[["Ação civil pública","A ACP permite tutela de interesses difusos e coletivos relacionados ao ambiente. Pode buscar condenação em dinheiro e obrigações de fazer ou não fazer conforme o regime legal. Ministério Público, Defensoria, entes públicos e associações que preencham requisitos legais estão entre os legitimados."],["Ação popular e participação","O cidadão pode propor ação popular visando anular ato lesivo ao meio ambiente, conforme a Constituição. Não se confunde a legitimidade do cidadão com a de associação em ação civil pública. A fiscalização social também envolve acesso a informações e participação nos processos decisórios."],["Compromisso de ajustamento e reparação","Órgãos públicos legitimados podem tomar compromisso de ajustamento de conduta com eficácia de título executivo extrajudicial, nos termos legais. O instrumento busca adequação da conduta e reparação, sem autorizar renúncia indiscriminada a direitos indisponíveis. A destinação de condenações pecuniárias coletivas segue a legislação."]],"map":["ACP → tutela coletiva","Ação popular → cidadão","TAC → título executivo extrajudicial","Reparação → interesse coletivo"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const environmentQuestions=[{"id":13001,"s":12,"module":0,"topic":"Fundamentos constitucionais e princípios ambientais","difficulty":"Intermediária","q":"O dever constitucional de preservar o ambiente dirige-se somente ao Estado?","a":["Sim, exclusivamente","Não, também à coletividade","Sim, exceto em parques nacionais","Sim, salvo contrato privado"],"ok":1,"e":"O art. 225 atribui o dever de defesa e preservação ao poder público e à coletividade.","src":"CF, art. 225; Lei 6.938/1981","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":13002,"s":12,"module":0,"topic":"Fundamentos constitucionais e princípios ambientais","difficulty":"Intermediária","q":"Qual princípio se relaciona especialmente à adoção de medidas protetivas diante de incerteza científica sobre risco grave?","a":["Anterioridade","Livre concorrência","Precaução","Irretroatividade tributária"],"ok":2,"e":"A precaução orienta a gestão de riscos relevantes ainda não plenamente conhecidos, mediante avaliação fundamentada.","src":"CF, art. 225; Lei 6.938/1981","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":13003,"s":12,"module":1,"topic":"Política Nacional do Meio Ambiente e SISNAMA","difficulty":"Intermediária","q":"Qual lei instituiu a Política Nacional do Meio Ambiente?","a":["Lei 6.938/1981","Lei 9.099/1995","Lei 8.078/1990","Lei 10.406/2002"],"ok":0,"e":"A Lei 6.938/1981 institui a PNMA e estrutura o SISNAMA.","src":"Lei 6.938/1981, arts. 2º a 9º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"id":13004,"s":12,"module":1,"topic":"Política Nacional do Meio Ambiente e SISNAMA","difficulty":"Intermediária","q":"O SISNAMA é composto exclusivamente por órgãos federais?","a":["Sim, exclusivamente","Sim, exceto o CONAMA","Sim, quando se tratar de água","Não, reúne órgãos e entidades dos diferentes níveis federativos"],"ok":3,"e":"O art. 6º prevê estrutura que abrange União, Estados, Distrito Federal e Municípios, conforme as atribuições legais.","src":"Lei 6.938/1981, arts. 2º a 9º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"id":13005,"s":12,"module":2,"topic":"Competências e federalismo ambiental","difficulty":"Intermediária","q":"Pela regra da LC 140/2011, quantos entes federativos realizam o licenciamento ambiental de uma mesma atividade?","a":["Todos obrigatoriamente","Um ente federativo, conforme atribuições legais","Nenhum, se houver fiscalização","Sempre dois"],"ok":1,"e":"O art. 13 prevê licenciamento ou autorização por um único ente federativo, sem excluir as formas legais de cooperação.","src":"CF, arts. 23, 24 e 30; LC 140/2011","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp140.htm"},{"id":13006,"s":12,"module":2,"topic":"Competências e federalismo ambiental","difficulty":"Intermediária","q":"A proteção administrativa do meio ambiente constitui competência exclusiva da União?","a":["Sim, em qualquer caso","Sim, fora de área urbana","Não, constitui competência comum","Sim, quando houver vegetação"],"ok":2,"e":"O art. 23, VI e VII, da Constituição prevê competências comuns de proteção ambiental.","src":"CF, arts. 23, 24 e 30; LC 140/2011","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp140.htm"},{"id":13007,"s":12,"module":3,"topic":"Licenciamento e avaliação de impactos ambientais","difficulty":"Intermediária","q":"Uma atividade é potencialmente causadora de significativa degradação ambiental. Qual exigência constitucional deve ser observada?","a":["Apenas autorização verbal","Apenas pagamento de taxa","Somente comunicação ao Município","Estudo prévio de impacto ambiental com publicidade"],"ok":3,"e":"O art. 225, § 1º, IV, impõe estudo prévio para essa hipótese.","src":"CF, art. 225, § 1º, IV","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":13008,"s":12,"module":3,"topic":"Licenciamento e avaliação de impactos ambientais","difficulty":"Intermediária","q":"Qual lei dispõe especificamente sobre licenciamento ambiental especial de empreendimentos estratégicos?","a":["Lei 15.300/2025","Código de Processo Civil","Lei de Locação","Lei 8.112/1990"],"ok":0,"e":"A Lei 15.300/2025 disciplina o regime especial e altera a Lei 15.190/2025. A aplicação concreta depende das condições legais e regulamentares.","src":"Lei 15.300/2025","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15300.htm"},{"id":13009,"s":12,"module":4,"topic":"Florestas, APP, reserva legal e cadastro rural","difficulty":"Intermediária","q":"A inscrição no CAR constitui, por si só, título de propriedade ou posse?","a":["Sim, em todo imóvel rural","Não, o art. 29 afasta esse efeito","Sim, após cinco anos","Sim, se houver mapa"],"ok":1,"e":"O art. 29, § 2º, esclarece que a inscrição não é título para fins de reconhecimento do direito de propriedade ou posse.","src":"Lei 12.651/2012, arts. 3º, 4º, 12, 17 e 29","url":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm"},{"id":13010,"s":12,"module":4,"topic":"Florestas, APP, reserva legal e cadastro rural","difficulty":"Intermediária","q":"Uma APP deixa necessariamente de existir juridicamente quando não há vegetação nativa no local?","a":["Sim, sempre","Sim, se houver estrada próxima","Não, sua definição abrange área coberta ou não por vegetação nativa","Sim, mediante declaração do ocupante"],"ok":2,"e":"O art. 3º, II, define APP segundo sua função ambiental, podendo ser coberta ou não por vegetação nativa.","src":"Lei 12.651/2012, arts. 3º, 4º, 12, 17 e 29","url":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm"},{"id":13011,"s":12,"module":5,"topic":"Unidades de conservação e biodiversidade","difficulty":"Intermediária","q":"Qual categoria integra o grupo de proteção integral do SNUC?","a":["Área de Proteção Ambiental","Floresta Nacional","Parque Nacional","Reserva Extrativista"],"ok":2,"e":"O art. 8º inclui parques no grupo de proteção integral; as demais alternativas pertencem ao grupo de uso sustentável.","src":"Lei 9.985/2000, arts. 7º a 21; CF, art. 225","url":"https://www.planalto.gov.br/ccivil_03/leis/l9985.htm"},{"id":13012,"s":12,"module":5,"topic":"Unidades de conservação e biodiversidade","difficulty":"Intermediária","q":"A redução dos limites de unidade de conservação pode ocorrer livremente por simples despacho administrativo?","a":["Não, a Lei 9.985 exige lei específica","Sim, sempre","Sim, se houver interesse econômico","Sim, mediante acordo privado"],"ok":0,"e":"O art. 22, § 7º, exige lei específica para desafetação ou redução dos limites de unidade de conservação.","src":"Lei 9.985/2000, arts. 7º a 21; CF, art. 225","url":"https://www.planalto.gov.br/ccivil_03/leis/l9985.htm"},{"id":13013,"s":12,"module":6,"topic":"Recursos hídricos e gestão de resíduos","difficulty":"Intermediária","q":"Em situação de escassez hídrica, qual uso prioritário prevê a Lei 9.433?","a":["Somente geração de energia","Consumo humano e dessedentação de animais","Somente irrigação industrial","Exclusivamente navegação"],"ok":1,"e":"O art. 1º, III, estabelece essa prioridade em situações de escassez.","src":"Leis 9.433/1997 e 12.305/2010","url":"https://www.planalto.gov.br/ccivil_03/leis/l9433.htm"},{"id":13014,"s":12,"module":6,"topic":"Recursos hídricos e gestão de resíduos","difficulty":"Intermediária","q":"Qual é a primeira prioridade da ordem de gestão de resíduos prevista na Lei 12.305?","a":["Disposição final de todos os resíduos","Incineração obrigatória","Exportação","Não geração"],"ok":3,"e":"O art. 9º prioriza não geração, seguida de redução, reutilização, reciclagem, tratamento e disposição final adequada dos rejeitos.","src":"Lei 12.305/2010, art. 9º","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2010/lei/l12305.htm"},{"id":13015,"s":12,"module":7,"topic":"Responsabilidade civil por dano ambiental","difficulty":"Intermediária","q":"Para responsabilização civil ambiental segundo a Lei 6.938/1981, a prova de culpa do poluidor é requisito indispensável?","a":["Não, a responsabilidade é objetiva","Sim, sempre","Sim, salvo confissão","Sim, quando houver licença"],"ok":0,"e":"O art. 14, § 1º, prevê responsabilidade independentemente de culpa, sem afastar a análise dos demais pressupostos.","src":"Lei 6.938/1981, art. 14, § 1º; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"id":13016,"s":12,"module":7,"topic":"Responsabilidade civil por dano ambiental","difficulty":"Intermediária","q":"Qual orientação do STF no Tema 999 se refere à pretensão de reparação civil de dano ambiental?","a":["Prescreve sempre em dois anos","Prescreve sempre em cinco anos","É imprescritível","É vedada se o dano for antigo"],"ok":2,"e":"O Tema 999 estabelece a imprescritibilidade da pretensão de reparação civil de dano ambiental. Isso não equivale a afirmar imprescritibilidade de toda sanção ambiental.","src":"STF, Tema 999","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/tema.asp?num=999"},{"id":13017,"s":12,"module":8,"topic":"Infrações administrativas e crimes ambientais","difficulty":"Intermediária","q":"Uma pessoa jurídica pode responder criminalmente por infração ambiental nas condições previstas em lei?","a":["Não, em nenhuma hipótese","Sim, nos termos constitucionais e do art. 3º da Lei 9.605","Sim, sem qualquer requisito","Somente se for pessoa jurídica pública"],"ok":1,"e":"A Constituição admite sanções penais a pessoas jurídicas, e o art. 3º estabelece os pressupostos da responsabilização ambiental.","src":"Lei 9.605/1998; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9605.htm"},{"id":13018,"s":12,"module":8,"topic":"Infrações administrativas e crimes ambientais","difficulty":"Intermediária","q":"A obrigação de reparar dano ambiental exclui necessariamente sanções penais e administrativas cabíveis?","a":["Sim, em qualquer caso","Sim, quando houver pagamento","Sim, após laudo pericial","Não, as esferas podem coexistir, respeitados seus requisitos"],"ok":3,"e":"O art. 225, § 3º, prevê sanções independentemente da obrigação de reparar os danos.","src":"Lei 9.605/1998; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9605.htm"},{"id":13019,"s":12,"module":9,"topic":"Tutela coletiva e instrumentos processuais ambientais","difficulty":"Intermediária","q":"Quem possui legitimidade constitucional para propor ação popular visando invalidar ato lesivo ao ambiente?","a":["Somente empresa estrangeira","Somente autoridade policial","Cidadão","Exclusivamente ministro do STF"],"ok":2,"e":"O art. 5º, LXXIII, atribui legitimidade ao cidadão para ação popular, observados requisitos legais.","src":"CF, art. 5º, LXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":13020,"s":12,"module":9,"topic":"Tutela coletiva e instrumentos processuais ambientais","difficulty":"Intermediária","q":"Qual eficácia a Lei 7.347 atribui ao compromisso de ajustamento tomado por órgão público legitimado?","a":["Título executivo extrajudicial","Simples recomendação sem efeito jurídico","Sentença penal condenatória","Emenda constitucional"],"ok":0,"e":"O art. 5º, § 6º, prevê compromisso de ajustamento de conduta com eficácia de título executivo extrajudicial.","src":"Lei 7.347/1985, arts. 1º, 3º, 5º e 13; CF, art. 5º, LXXIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l7347compilada.htm"}];const internationalModules=[{"t":"Fundamentos e fontes do Direito Internacional","ref":"Estatuto da CIJ, art. 38; CF, art. 4º","url":"https://www.un.org/en/about-us/un-charter/full-text","lessons":[["Ordem jurídica internacional","O Direito Internacional Público disciplina relações entre Estados, organizações internacionais e outros sujeitos reconhecidos pelo ordenamento. A soberania não exclui obrigações jurídicas assumidas internacionalmente. Diferencie igualdade soberana, autonomia estatal e exercício de competências de organizações internacionais."],["Fontes internacionais","O art. 38 do Estatuto da Corte Internacional de Justiça indica convenções internacionais, costume e princípios gerais de direito, além de decisões judiciais e doutrina como meios auxiliares de determinação das regras. Costume exige prática geral aceita como direito. Não se resume a comportamento reiterado sem convicção jurídica."],["Normas imperativas","Normas de jus cogens são aceitas e reconhecidas pela comunidade internacional dos Estados como um todo, sem possibilidade de derrogação, salvo por norma posterior de igual natureza. Um tratado em conflito com norma imperativa existente é nulo segundo a Convenção de Viena."]],"map":["Soberania → igualdade jurídica","Costume → prática e opinio juris","Jurisprudência e doutrina → meios auxiliares","Jus cogens → inderrogabilidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"t":"Tratados internacionais: formação, vigência e extinção","ref":"Convenção de Viena de 1969, arts. 2º, 11, 19 a 27 e 54 a 64","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm","lessons":[["Formação e consentimento","A Convenção de Viena disciplina tratados escritos entre Estados regidos pelo Direito Internacional. Consentimento pode ser expresso por assinatura, ratificação, aceitação, aprovação ou adesão conforme o regime aplicável. Assinatura e ratificação não são necessariamente equivalentes. Entrada em vigor depende das condições do tratado."],["Reservas e interpretação","Reserva é declaração unilateral destinada a excluir ou modificar o efeito jurídico de determinadas disposições em relação ao Estado que a formula. Sua admissibilidade depende do tratado, inclusive compatibilidade com objeto e finalidade. Interpretação deve ocorrer de boa-fé, segundo sentido comum, contexto, objeto e finalidade."],["Cumprimento e extinção","Pacta sunt servanda impõe cumprimento de boa-fé dos tratados em vigor. Como regra, o Estado não pode invocar seu direito interno para justificar inadimplemento. Denúncia, retirada, suspensão e extinção possuem pressupostos próprios; não decorrem automaticamente de mudança de governo."]],"map":["Consentimento → formas admitidas","Reserva → limites do tratado","Pacta sunt servanda → boa-fé","Extinção → pressupostos jurídicos"]},{"t":"Incorporação e hierarquia dos tratados no Brasil","ref":"CF, arts. 5º, §§ 2º a 4º, 49, I, e 84, VIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Competências constitucionais","A celebração de tratados integra as atribuições presidenciais, sujeita ao referendo do Congresso Nacional nos termos constitucionais. A aprovação parlamentar, a manifestação internacional de consentimento e a promulgação interna constituem etapas distintas. Nem todo compromisso internacional segue necessariamente procedimento idêntico."],["Hierarquia interna","Em regra, tratados comuns incorporados possuem posição equivalente à legislação ordinária, ressalvadas matérias com regimes próprios. Segundo o STF, tratados de direitos humanos incorporados sem aprovação qualificada possuem status supralegal. Os aprovados conforme art. 5º, § 3º, equivalem a emendas constitucionais."],["Plano internacional e plano interno","A solução de conflitos entre normas no direito doméstico não elimina obrigações internacionais do Brasil. O Estado continua sujeito ao regime internacional do tratado. Questões sobre denúncia de tratados exigem considerar competências constitucionais e a jurisprudência do STF, inclusive a ADI 1625."]],"map":["Presidente → celebração","Congresso → aprovação constitucional","Direitos humanos → regime hierárquico próprio","Plano interno ≠ responsabilidade internacional"]},{"t":"Estados, organizações internacionais e solução de controvérsias","ref":"Carta da ONU, arts. 2º, 7º, 33 e 92 a 96; Estatuto da CIJ","url":"https://www.un.org/en/about-us/un-charter/full-text","lessons":[["Sujeitos e competências","Estados possuem personalidade internacional originária; organizações internacionais exercem competências decorrentes de seus instrumentos constitutivos e regras pertinentes. A ONU possui órgãos com funções distintas. A Assembleia Geral não desempenha o mesmo papel do Conselho de Segurança."],["Solução pacífica","Negociação, mediação, conciliação, arbitragem e solução judicial são meios pacíficos previstos na Carta. Arbitragem decorre do consentimento das partes e do regime aplicável. O recurso à força é, em regra, proibido, ressalvadas as hipóteses admitidas pela Carta."],["Corte Internacional de Justiça","A CIJ é o principal órgão judiciário da ONU. Apenas Estados podem ser partes em casos contenciosos perante ela; sua jurisdição depende de fundamento de consentimento. Pareceres consultivos podem ser solicitados pelos órgãos autorizados. A CIJ não se confunde com o Tribunal Penal Internacional."]],"map":["ONU → competências dos órgãos","Controvérsias → meios pacíficos","CIJ → Estados e consentimento","TPI → responsabilidade penal individual"]},{"t":"Nacionalidade brasileira e condição jurídica do estrangeiro","ref":"CF, art. 12; EC 131/2023; Lei 13.445/2017","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Nacionalidade originária","A Constituição prevê hipóteses de nacionalidade brasileira nata relacionadas a nascimento no território e filiação brasileira no exterior, com requisitos e ressalvas próprios. Filhos de estrangeiros nascidos no Brasil não são natos quando os pais estiverem a serviço de seu país, nos termos constitucionais."],["Naturalização e cargos privativos","Brasileiros naturalizados possuem, em regra, igualdade de direitos com natos, ressalvadas distinções constitucionais. A naturalização possui modalidades e requisitos legais. Cargos privativos de nato incluem Presidente e Vice-Presidente da República, Ministro do STF e outros expressamente previstos no art. 12, § 3º."],["Perda e reaquisição","A EC 131/2023 modificou as hipóteses de perda da nacionalidade, afastando a perda automática pela simples aquisição de outra nacionalidade. A perda pode decorrer de cancelamento da naturalização por sentença judicial nas hipóteses constitucionais ou de pedido expresso, ressalvada situação de apatridia. Reaquisição observa o regime legal."]],"map":["Nato → hipóteses constitucionais","Naturalizado → igualdade com ressalvas","Cargos privativos → art. 12, § 3º","EC 131 → aquisição de outra nacionalidade não basta"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc131.htm"},{"t":"Migração, refúgio e medidas de retirada","ref":"Lei 13.445/2017; Lei 9.474/1997","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm","lessons":[["Direitos e política migratória","A Lei de Migração orienta-se pelos direitos humanos, não criminalização da migração, igualdade de tratamento e combate à discriminação. Visto, autorização de residência e naturalização são institutos diferentes. A irregularidade documental não elimina os direitos fundamentais da pessoa migrante."],["Repatriação, deportação e expulsão","Repatriação é medida de devolução de pessoa em situação de impedimento ao ingresso, nos termos legais. Deportação decorre de situação migratória irregular e deve observar procedimento e oportunidade de regularização. Expulsão é medida administrativa com impedimento de reingresso por prazo determinado, fundada nas hipóteses legais e sujeita a garantias."],["Refúgio e asilo","Refúgio possui requisitos previstos na Lei 9.474/1997, incluindo perseguição por motivos legalmente indicados ou grave e generalizada violação de direitos humanos. Asilo político tem disciplina própria e não se confunde com refúgio. O princípio de não devolução protege pessoas contra retorno a situações de risco nos limites aplicáveis."]],"map":["Migração → direitos e garantias","Deportação → irregularidade migratória","Expulsão → hipóteses legais","Refúgio → proteção internacional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9474.htm"},{"t":"Direito Internacional Privado: conflitos de leis","ref":"LINDB, arts. 7º a 10 e 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm","lessons":[["Elementos de conexão","O Direito Internacional Privado determina a lei aplicável às relações privadas conectadas a diferentes países. Domicílio, localização dos bens e lugar de constituição da obrigação são critérios previstos na LINDB. Lei aplicável e competência jurisdicional não se confundem: o juiz brasileiro pode aplicar direito estrangeiro nas hipóteses pertinentes."],["Pessoa, família e bens","O art. 7º adota a lei do país do domicílio para regras sobre começo e fim da personalidade, nome, capacidade e direitos de família, ressalvadas disposições específicas. Para qualificar bens e regular relações a eles concernentes, o art. 8º adota, como regra, a lei do país onde estão situados."],["Obrigações, sucessão e ordem pública","O art. 9º prevê a lei do país em que se constituírem as obrigações, com disciplina própria para contratos. A sucessão segue, em regra, a lei do domicílio do falecido, observadas regras protetivas. Leis e atos estrangeiros não produzem efeitos no Brasil quando ofendem soberania nacional, ordem pública ou bons costumes, conforme art. 17."]],"map":["Conexão → lei aplicável","Pessoa → domicílio","Bens → localização","Ordem pública → limite"]},{"t":"Jurisdição internacional e cooperação jurídica","ref":"CPC, arts. 21 a 41 e 960 a 965; CF, art. 105, I, i","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","lessons":[["Competência concorrente e exclusiva","O CPC prevê hipóteses em que a autoridade brasileira pode julgar causas com elementos internacionais. Algumas são concorrentes; outras, como ações relativas a imóveis situados no Brasil, são exclusivas. A existência de processo no exterior não induz, em regra, litispendência no Brasil, ressalvadas regras internacionais."],["Cooperação internacional","Auxílio direto, carta rogatória e homologação de decisão estrangeira possuem finalidades diferentes. A autoridade central facilita a comunicação conforme o regime aplicável. A cooperação deve observar garantias processuais, publicidade quando pertinente e respeito à ordem pública."],["Homologação e exequatur","Compete ao STJ homologar decisões estrangeiras e conceder exequatur às cartas rogatórias, segundo a Constituição. A homologação examina requisitos de reconhecimento, sem transformar-se em novo julgamento amplo do mérito. O CPC excepciona a necessidade de homologação para sentença estrangeira de divórcio consensual simples."]],"map":["Jurisdição → arts. 21 a 25","Imóveis no Brasil → competência exclusiva","STJ → homologação e exequatur","Auxílio direto → regime próprio"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Extradição, imunidades e relações diplomáticas","ref":"CF, arts. 5º, LI e LII, e 102, I, g; Lei 13.445/2017; Convenção de Viena de 1961","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm","lessons":[["Extradição","Extradição é mecanismo de entrega de pessoa a outro Estado para fins de persecução penal ou cumprimento de condenação, conforme pressupostos legais e tratados. Diferencia-se de deportação e expulsão. No Brasil, o STF aprecia pedido de extradição formulado por Estado estrangeiro, e a execução segue o regime constitucional e legal."],["Limites constitucionais","Brasileiro nato não pode ser extraditado. Naturalizado pode sê-lo nas hipóteses de crime comum praticado antes da naturalização ou comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei. Não se concede extradição de estrangeiro por crime político ou de opinião."],["Imunidades diplomáticas","A Convenção de Viena sobre Relações Diplomáticas estabelece imunidades destinadas ao exercício das funções da missão. Agentes diplomáticos possuem imunidade de jurisdição penal no Estado acreditado, além de regime próprio para jurisdição civil e administrativa. Imunidade não equivale a autorização para descumprir a lei; o Estado acreditante pode renunciar expressamente à imunidade."]],"map":["Extradição ≠ deportação","STF → julgamento do pedido","Nato → vedação de extradição","Imunidade → proteção funcional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/antigos/d56435.htm"},{"t":"Responsabilidade internacional e Tribunal Penal Internacional","ref":"Estatuto de Roma, arts. 1º, 5º, 11, 17 e 25; CF, art. 5º, § 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto/2002/d4388.htm","lessons":[["Responsabilidade do Estado","A violação de obrigação internacional atribuível a Estado pode gerar responsabilidade internacional. Cessação do ilícito e reparação seguem o regime jurídico aplicável. Responsabilidade do Estado não se confunde com responsabilidade penal individual nem decorre automaticamente de toda controvérsia privada transnacional."],["Tribunal Penal Internacional","O TPI, instituído pelo Estatuto de Roma, exerce jurisdição penal sobre pessoas naturais nos limites de competência material, temporal e demais condições do Estatuto. Sua competência abrange genocídio, crimes contra a humanidade, crimes de guerra e crime de agressão, sujeitos às regras próprias. Não é órgão judiciário da ONU."],["Complementaridade e entrega","A atuação do TPI é complementar às jurisdições penais nacionais. A admissibilidade considera se o Estado está efetivamente disposto e apto a investigar ou processar. O Estatuto distingue entrega ao Tribunal de extradição entre Estados. O Brasil submete-se à jurisdição do TPI a cuja criação tenha manifestado adesão, conforme a Constituição."]],"map":["Estado → responsabilidade internacional","TPI → pessoas naturais","Complementaridade → jurisdições nacionais","Entrega ao TPI ≠ extradição"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const internationalQuestions=[{"id":14001,"s":13,"module":0,"topic":"Fundamentos e fontes do Direito Internacional","difficulty":"Intermediária","q":"Qual elemento diferencia o costume internacional de mera prática repetida?","a":["Obrigatoriedade de registro em cartório","Aceitação da prática como direito","Existência de contrato individual","Aprovação obrigatória pelo Congresso brasileiro"],"ok":1,"e":"O art. 38 do Estatuto da CIJ caracteriza o costume como prova de prática geral aceita como direito. A aceitação jurídica é usualmente denominada opinio juris.","src":"Estatuto da CIJ, art. 38; CF, art. 4º","url":"https://www.un.org/en/about-us/un-charter/full-text"},{"id":14002,"s":13,"module":0,"topic":"Fundamentos e fontes do Direito Internacional","difficulty":"Intermediária","q":"Um tratado conflita, no momento de sua conclusão, com norma imperativa de Direito Internacional geral. Qual consequência prevê a Convenção de Viena?","a":["Validade plena","Apenas recomendação de revisão","Nulidade do tratado","Validade se celebrado por dois Estados"],"ok":2,"e":"O art. 53 da Convenção de Viena de 1969 prevê nulidade de tratado incompatível com norma imperativa de Direito Internacional geral.","src":"Convenção de Viena de 1969, art. 53","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"id":14003,"s":13,"module":1,"topic":"Tratados internacionais: formação, vigência e extinção","difficulty":"Intermediária","q":"O que expressa o princípio pacta sunt servanda?","a":["Tratados em vigor obrigam as partes e devem ser cumpridos de boa-fé","Tratados nunca produzem efeitos jurídicos","Qualquer Estado pode ignorar livremente suas obrigações","Apenas costumes são obrigatórios"],"ok":0,"e":"O art. 26 da Convenção de Viena estabelece a obrigatoriedade e o cumprimento de boa-fé dos tratados em vigor.","src":"Convenção de Viena de 1969, arts. 2º, 11, 19 a 27 e 54 a 64","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"id":14004,"s":13,"module":1,"topic":"Tratados internacionais: formação, vigência e extinção","difficulty":"Intermediária","q":"Uma reserva incompatível com o objeto e a finalidade de tratado é, em regra, admissível?","a":["Sim, sempre","Sim, se feita oralmente","Sim, por simples decisão administrativa","Não, conforme art. 19"],"ok":3,"e":"O art. 19, c, da Convenção de Viena limita a formulação de reservas incompatíveis com o objeto e a finalidade do tratado.","src":"Convenção de Viena de 1969, arts. 2º, 11, 19 a 27 e 54 a 64","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"id":14005,"s":13,"module":2,"topic":"Incorporação e hierarquia dos tratados no Brasil","difficulty":"Intermediária","q":"Tratado de direitos humanos aprovado em dois turnos em cada Casa por três quintos dos respectivos membros terá qual posição?","a":["Regulamento administrativo","Equivalência a emenda constitucional","Simples contrato privado","Resolução municipal"],"ok":1,"e":"O art. 5º, § 3º, prevê equivalência às emendas constitucionais para tratados aprovados pelo procedimento qualificado.","src":"CF, arts. 5º, §§ 2º a 4º, 49, I, e 84, VIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14006,"s":13,"module":2,"topic":"Incorporação e hierarquia dos tratados no Brasil","difficulty":"Intermediária","q":"Segundo o STF, qual o status dos tratados de direitos humanos regularmente incorporados sem o rito qualificado do art. 5º, § 3º?","a":["Inferior aos decretos","Igual ao de contrato particular","Supralegal","Superior à Constituição em qualquer hipótese"],"ok":2,"e":"A orientação do STF no RE 466.343 atribui status supralegal a esses tratados: acima da legislação ordinária e abaixo da Constituição.","src":"CF, arts. 5º, §§ 2º a 4º, 49, I, e 84, VIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14007,"s":13,"module":3,"topic":"Estados, organizações internacionais e solução de controvérsias","difficulty":"Intermediária","q":"Quem pode figurar como parte em caso contencioso perante a CIJ?","a":["Qualquer pessoa natural","Qualquer empresa diretamente","Qualquer associação privada","Estados"],"ok":3,"e":"O art. 34, § 1º, do Estatuto da CIJ limita às entidades estatais a condição de partes em casos contenciosos.","src":"Carta da ONU, arts. 2º, 7º, 33 e 92 a 96; Estatuto da CIJ","url":"https://www.un.org/en/about-us/un-charter/full-text"},{"id":14008,"s":13,"module":3,"topic":"Estados, organizações internacionais e solução de controvérsias","difficulty":"Intermediária","q":"Qual meio de solução de controvérsias consta expressamente do art. 33 da Carta da ONU?","a":["Mediação","Anexação territorial unilateral","Retaliação armada obrigatória","Extinção de direitos individuais"],"ok":0,"e":"O art. 33 lista meios pacíficos, entre eles negociação, investigação, mediação, conciliação, arbitragem e solução judicial.","src":"Carta da ONU, arts. 2º, 7º, 33 e 92 a 96; Estatuto da CIJ","url":"https://www.un.org/en/about-us/un-charter/full-text"},{"id":14009,"s":13,"module":4,"topic":"Nacionalidade brasileira e condição jurídica do estrangeiro","difficulty":"Intermediária","q":"Após a EC 131/2023, a simples aquisição voluntária de outra nacionalidade provoca automaticamente perda da nacionalidade brasileira?","a":["Sim, sem exceção","Não","Sim, após dez anos","Sim, se o país estiver na Europa"],"ok":1,"e":"A EC 131 retirou a aquisição de outra nacionalidade como hipótese autônoma de perda da nacionalidade brasileira.","src":"EC 131/2023","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc131.htm"},{"id":14010,"s":13,"module":4,"topic":"Nacionalidade brasileira e condição jurídica do estrangeiro","difficulty":"Intermediária","q":"Qual cargo é privativo de brasileiro nato?","a":["Vereador","Prefeito","Ministro do Supremo Tribunal Federal","Deputado estadual"],"ok":2,"e":"O art. 12, § 3º, IV, reserva o cargo de Ministro do STF a brasileiros natos.","src":"CF, art. 12; EC 131/2023; Lei 13.445/2017","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14011,"s":13,"module":5,"topic":"Migração, refúgio e medidas de retirada","difficulty":"Intermediária","q":"A irregularidade migratória elimina automaticamente os direitos fundamentais de uma pessoa estrangeira no Brasil?","a":["Não, os direitos fundamentais e garantias legais continuam aplicáveis","Sim, em qualquer circunstância","Sim, após trinta dias","Sim, se não houver vínculo de emprego"],"ok":0,"e":"A Lei 13.445/2017 protege direitos de migrantes e adota a não criminalização da migração como princípio.","src":"Lei 13.445/2017; Lei 9.474/1997","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm"},{"id":14012,"s":13,"module":5,"topic":"Migração, refúgio e medidas de retirada","difficulty":"Intermediária","q":"Qual medida administrativa se relaciona especificamente à retirada de pessoa em situação migratória irregular, com procedimento legal próprio?","a":["Naturalização","Asilo diplomático","Reconhecimento de sentença estrangeira","Deportação"],"ok":3,"e":"A Lei 13.445, art. 50, define deportação como medida decorrente de procedimento administrativo que consiste em retirada compulsória de pessoa em situação migratória irregular.","src":"Lei 13.445/2017; Lei 9.474/1997","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm"},{"id":14013,"s":13,"module":6,"topic":"Direito Internacional Privado: conflitos de leis","difficulty":"Intermediária","q":"Pela regra geral do art. 7º da LINDB, qual elemento determina a lei aplicável à capacidade da pessoa?","a":["Nacionalidade obrigatoriamente","País do domicílio","Local do nascimento em todo caso","Local do ajuizamento sempre"],"ok":1,"e":"A LINDB adota o domicílio como elemento de conexão para capacidade, personalidade, nome e direitos de família, ressalvadas regras próprias.","src":"LINDB, arts. 7º a 10 e 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":14014,"s":13,"module":6,"topic":"Direito Internacional Privado: conflitos de leis","difficulty":"Intermediária","q":"Qual critério geral do art. 8º rege a qualificação dos bens e as relações a eles concernentes?","a":["Nacionalidade do advogado","Idioma do contrato","Lei do país onde os bens estão situados","Lei escolhida pelo juiz sem critério"],"ok":2,"e":"O art. 8º prevê a lex rei sitae, com ressalvas específicas para determinados bens móveis e garantias.","src":"LINDB, arts. 7º a 10 e 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":14015,"s":13,"module":7,"topic":"Jurisdição internacional e cooperação jurídica","difficulty":"Intermediária","q":"Qual tribunal é constitucionalmente competente para homologação de decisões estrangeiras, quando necessária?","a":["STF","TST","TRF em qualquer hipótese","STJ"],"ok":3,"e":"O art. 105, I, i, da Constituição atribui essa competência ao Superior Tribunal de Justiça.","src":"CF, art. 105, I, i","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14016,"s":13,"module":7,"topic":"Jurisdição internacional e cooperação jurídica","difficulty":"Intermediária","q":"Uma ação diretamente relativa a imóvel situado no Brasil está sujeita a qual regime de competência internacional?","a":["Competência exclusiva da autoridade judiciária brasileira","Competência exclusiva de tribunal estrangeiro","Ausência de competência de qualquer Estado","Competência determinada pela nacionalidade do réu exclusivamente"],"ok":0,"e":"O art. 23, I, do CPC atribui competência exclusiva à autoridade brasileira para ações relativas a imóveis situados no Brasil.","src":"CPC, arts. 21 a 41 e 960 a 965; CF, art. 105, I, i","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":14017,"s":13,"module":8,"topic":"Extradição, imunidades e relações diplomáticas","difficulty":"Intermediária"
