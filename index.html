.755/2026 atualizou a disciplina da propaganda, incluindo identificação de conteúdo sintético produzido ou significativamente alterado por IA, proibição de deepfakes eleitorais e restrições temporais a novos conteúdos sintéticos nos períodos próximos à votação. Consulte a resolução consolidada para os deveres, exceções e consequências aplicáveis."]],"map":["Propaganda → a partir de 16 de agosto","Pré-campanha → limites","Impulsionamento → regime legal","IA → transparência e proibições"],"extraUrl":"https://www.tse.jus.br/legislacao/compilada/res/2019/resolucao-no-23-610-de-18-de-dezembro-de-2019"},{"t":"Financiamento de campanhas e prestação de contas","ref":"Lei 9.504/1997, arts. 16-C a 32; Lei 9.096/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm","lessons":[["Fontes de recursos","Campanhas podem utilizar recursos legalmente admitidos, como doações de pessoas físicas, recursos próprios dentro dos limites e recursos públicos distribuídos conforme a legislação. Doações de pessoas jurídicas não são permitidas. Fundo Partidário e Fundo Especial de Financiamento de Campanha são institutos distintos."],["Arrecadação e gastos","A arrecadação e as despesas exigem requisitos de registro, identificação da origem e destinação e observância dos limites. A legislação disciplina contas bancárias, recibos e meios de arrecadação, inclusive financiamento coletivo. Limites específicos e prazos devem ser conferidos para cada eleição."],["Prestação de contas","A prestação de contas permite controlar regularidade da arrecadação e dos gastos. A Justiça Eleitoral pode aprovar, aprovar com ressalvas, desaprovar ou julgar não prestadas as contas conforme os pressupostos. Irregularidades podem produzir efeitos diversos, sem que toda falha formal implique cassação automática."]],"map":["Doação → pessoa física nos limites legais","Pessoa jurídica → vedação","FEFC ≠ Fundo Partidário","Contas → controle de receitas e despesas"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9096.htm"},{"t":"Ilícitos eleitorais, abuso de poder e captação de sufrágio","ref":"Lei 9.504/1997, arts. 41-A e 73 a 78; LC 64/1990, art. 22","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm","lessons":[["Abuso de poder","O abuso de poder econômico ou político compromete a normalidade e legitimidade das eleições mediante uso indevido de recursos ou autoridade, conforme o enquadramento. Na AIJE, considera-se a gravidade das circunstâncias, não sendo indispensável demonstrar alteração do resultado eleitoral."],["Captação ilícita de sufrágio","O art. 41-A disciplina a oferta, promessa, doação ou entrega de vantagem pessoal ao eleitor com finalidade de obtenção de voto no período legal. A caracterização exige elementos específicos, e não se confunde automaticamente com qualquer promessa de política pública."],["Condutas vedadas a agentes públicos","A Lei das Eleições estabelece restrições ao uso da máquina pública para proteger igualdade de oportunidades. Exemplos incluem uso indevido de bens e serviços públicos e determinadas condutas em períodos eleitorais. Cada vedação possui requisitos, exceções e consequências próprias."]],"map":["Abuso → gravidade","AIJE → proteção da legitimidade","Art. 41-A → vantagem pessoal para obter voto","Agente público → condutas vedadas"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp64compilado.htm"},{"t":"Ações eleitorais, impugnações e recursos","ref":"CF, art. 14, §§ 10 e 11; LC 64/1990, arts. 3º e 22; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp64compilado.htm","lessons":[["Impugnação de registro","A ação de impugnação de registro de candidatura permite questionar preenchimento de requisitos e inelegibilidades. A LC 64 fixa, em regra, prazo de cinco dias da publicação do pedido de registro e define legitimados. Não confunda o prazo de impugnação com o prazo de defesa."],["Investigação judicial eleitoral","A AIJE apura abuso de poder e uso indevido dos meios de comunicação nas condições do art. 22. Seu objeto e consequências diferem da impugnação de registro. Sanções devem observar responsabilidade e pressupostos próprios, não sendo automaticamente idênticas para todas as pessoas envolvidas."],["Impugnação de mandato e recursos","A AIME pode ser proposta em quinze dias da diplomação, instruída com provas de abuso do poder econômico, corrupção ou fraude, e tramita em segredo de justiça. O recurso contra expedição de diploma tem hipóteses próprias. Identifique objeto, legitimidade, competência e termo inicial antes de escolher a via."]],"map":["AIRC → registro","AIJE → abuso e uso indevido","AIME → 15 dias da diplomação","Recursos → hipóteses próprias"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Crimes eleitorais e processo penal eleitoral","ref":"Código Eleitoral, arts. 289 a 354-A e 355 a 364","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm","lessons":[["Tipicidade e bens jurídicos","Crimes eleitorais protegem, entre outros interesses, liberdade do voto, regularidade do cadastro e legitimidade das eleições. A análise penal exige tipicidade, elementos subjetivos e demais pressupostos. Um ilícito cível-eleitoral não constitui necessariamente crime."],["Corrupção eleitoral","O art. 299 do Código Eleitoral prevê condutas de dar, oferecer, prometer, solicitar ou receber vantagem para obter ou dar voto ou conseguir ou prometer abstenção, conforme o tipo. Não confunda crime de corrupção eleitoral com a representação por captação ilícita de sufrágio do art. 41-A, que possui regime próprio."],["Ação penal e competência","A ação penal por crimes eleitorais é pública, conforme art. 355. O processo segue a disciplina especial do Código Eleitoral, com aplicação subsidiária pertinente. A jurisprudência do STF reconhece competência da Justiça Eleitoral para crimes comuns conexos a crimes eleitorais, nas condições aplicáveis."]],"map":["Ilícito eleitoral ≠ crime automaticamente","Art. 299 → corrupção eleitoral","Ação penal → pública","Conexão → jurisprudência do STF"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm"}];const electoralQuestions=/*BANK:electoralQuestions*/null;const financialModules=[{"t":"Atividade financeira do Estado e competências","ref":"CF, arts. 24, I, e 163 a 169; LC 101/2000","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Objeto do Direito Financeiro","O Direito Financeiro disciplina obtenção, gestão e aplicação de recursos públicos, incluindo orçamento, despesa, receita e crédito público. Não se confunde com Direito Tributário, que examina a instituição e exigência de tributos. A arrecadação tributária integra o financiamento estatal, mas não é sua única fonte."],["Competência legislativa","A Constituição prevê competência concorrente da União, Estados e Distrito Federal em matéria de Direito Financeiro. À União cabe estabelecer normas gerais, sem excluir competência suplementar estadual. Municípios possuem atribuições de interesse local e suplementação conforme o art. 30."],["Normas gerais e responsabilidade","A Lei 4.320/1964 estabelece normas gerais para orçamentos e balanços; a LC 101/2000 disciplina responsabilidade na gestão fiscal. O regime constitucional protege planejamento, equilíbrio e controle. A autonomia financeira dos entes não autoriza afastar limites nacionais validamente estabelecidos."]],"map":["Finanças → receitas e despesas","Tributário → instituição e cobrança","Competência concorrente → normas gerais e suplementação","Autonomia → limites constitucionais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"t":"Planejamento orçamentário: PPA, LDO e LOA","ref":"CF, art. 165; LC 101/2000, arts. 4º e 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Plano Plurianual","O PPA estabelece, de modo regionalizado, diretrizes, objetivos e metas da administração federal para despesas de capital e outras delas decorrentes e para programas de duração continuada. Sua função é estruturar planejamento de médio prazo, não substituir a autorização anual das despesas."],["Lei de Diretrizes Orçamentárias","A LDO orienta elaboração da LOA, estabelece metas e prioridades e trata das matérias constitucionais e fiscais pertinentes. O Anexo de Metas Fiscais e o Anexo de Riscos Fiscais atendem exigências da LRF. O planejamento anual precisa guardar compatibilidade com o PPA."],["Lei Orçamentária Anual","A LOA prevê receitas e fixa despesas do exercício. Na União, abrange orçamento fiscal, de investimento das empresas nas condições constitucionais e da seguridade social. A iniciativa dos projetos é do Executivo. Autorizações orçamentárias e execução obrigatória devem ser examinadas conforme o regime constitucional vigente."]],"map":["PPA → planejamento plurianual","LDO → prioridades e orientação","LOA → receita e despesa anuais","Compatibilidade → integração dos instrumentos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"t":"Princípios orçamentários e vedações constitucionais","ref":"CF, arts. 165, § 8º, e 167; Lei 4.320/1964, arts. 2º e 6º","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm","lessons":[["Unidade, universalidade e anualidade","Unidade orienta a integração do orçamento; universalidade exige inclusão das receitas e despesas orçamentárias pertinentes; anualidade delimita o exercício financeiro. A existência de componentes distintos na LOA federal não elimina o princípio da unidade."],["Exclusividade e orçamento bruto","A exclusividade impede inserir na LOA matéria estranha à previsão de receita e fixação de despesa, ressalvadas autorizações constitucionais para créditos suplementares e operações de crédito. O orçamento bruto evita deduções indevidas na apresentação de receitas e despesas."],["Vedações e não vinculação","O art. 167 veda, entre outras condutas, início de programas não incluídos na LOA e realização de despesas acima dos créditos. A não vinculação refere-se à receita de impostos e possui exceções constitucionais. Não se trata de proibição absoluta de vincular qualquer receita pública."]],"map":["Unidade → integração","Universalidade → abrangência","Anualidade → exercício","Exclusividade → matéria orçamentária e exceções"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Receitas públicas e renúncia de receita","ref":"Lei 4.320/1964, arts. 11 e 51 a 57; LRF, arts. 11 a 14","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm","lessons":[["Classificação das receitas","Receitas correntes e de capital são categorias econômicas previstas na legislação. Tributos e receitas patrimoniais exemplificam receitas correntes; operações de crédito e alienação de bens exemplificam receitas de capital. Ingressos extraorçamentários possuem regime distinto e não representam necessariamente recursos disponíveis para gasto público."],["Etapas da receita","Previsão, lançamento quando cabível, arrecadação e recolhimento descrevem momentos relevantes da gestão da receita. Nem toda receita passa por lançamento. O reconhecimento orçamentário observa a regra do art. 35 da Lei 4.320 e não deve ser confundido com o regime patrimonial contábil."],["Renúncia fiscal","Benefícios tributários que impliquem renúncia de receita exigem atendimento ao art. 14 da LRF, incluindo avaliação de impacto e condições fiscais legalmente previstas. A finalidade social de um incentivo não dispensa os requisitos. Examine a redação vigente e as exceções legais antes de concluir pela regularidade."]],"map":["Correntes ≠ capital","Lançamento → quando cabível","Arrecadação → recebimento","Renúncia → impacto e condições fiscais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"t":"Despesas públicas, execução e restos a pagar","ref":"Lei 4.320/1964, arts. 35, 36 e 58 a 65; LRF, art. 42","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm","lessons":[["Classificação e autorização","Despesas correntes e de capital possuem funções econômicas distintas. A execução exige crédito orçamentário pertinente e atendimento às condições legais. Dotação representa autorização orçamentária; disponibilidade de caixa é questão financeira diferente. A existência de uma não garante automaticamente a outra."],["Empenho, liquidação e pagamento","Empenho formaliza obrigação de pagamento nas condições legais. Liquidação verifica o direito adquirido pelo credor, inclusive objeto entregue, valor e beneficiário. Pagamento ocorre após regular liquidação e ordem de pagamento. Em regra, não se realiza despesa sem empenho prévio."],["Restos a pagar","Despesas empenhadas e não pagas até 31 de dezembro podem constituir restos a pagar, distinguindo-se processados e não processados conforme a liquidação. Despesas de exercícios anteriores possuem disciplina própria. A inscrição deve observar disponibilidade financeira, restrições fiscais e normas pertinentes."]],"map":["Dotação ≠ caixa","Empenho → obrigação","Liquidação → verificação do direito","Restos a pagar → empenhado e não pago"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"t":"Créditos adicionais e alterações do orçamento","ref":"CF, art. 167; Lei 4.320/1964, arts. 40 a 46","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm","lessons":[["Créditos suplementares","Créditos suplementares destinam-se a reforçar dotação existente. A abertura exige autorização legislativa e indicação de recursos, observadas condições legais. A própria LOA pode conter autorização para abertura dentro dos limites estabelecidos."],["Créditos especiais","Créditos especiais destinam-se a despesas para as quais não existe dotação específica. Exigem autorização legislativa e indicação dos recursos correspondentes. Superávit financeiro, excesso de arrecadação, anulação de dotações e operações autorizadas podem constituir fontes nos termos legais."],["Créditos extraordinários","Créditos extraordinários atendem despesas imprevisíveis e urgentes, como guerra, comoção interna ou calamidade pública. Seu procedimento distingue-se dos demais e deve observar a Constituição de cada ente. Créditos especiais e extraordinários autorizados nos últimos quatro meses podem ser reabertos no exercício seguinte nos limites de seus saldos."]],"map":["Suplementar → reforço","Especial → nova dotação","Extraordinário → urgência e imprevisibilidade","Reabertura → hipóteses constitucionais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Lei de Responsabilidade Fiscal e despesa com pessoal","ref":"LC 101/2000, arts. 15 a 23 e 42","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm","lessons":[["Geração de despesas","Criação, expansão ou aperfeiçoamento de ação governamental que aumente despesa exige as condições do art. 16, incluindo estimativa de impacto e declaração pertinente. Despesa obrigatória de caráter continuado possui requisitos específicos do art. 17. A aprovação orçamentária não substitui todas as condições fiscais."],["Limites de pessoal","A LRF estabelece limites globais de despesa total com pessoal em proporção à receita corrente líquida: 50% para a União e 60% para Estados e Municípios, observada a repartição por Poder e órgão e regras especiais. Limite de alerta, prudencial e máximo têm consequências distintas."],["Final de mandato","O art. 42 restringe, nos últimos dois quadrimestres do mandato, a contratação de obrigação sem possibilidade de cumprimento integral no mandato ou sem caixa suficiente para parcelas do exercício seguinte. Há também restrições específicas sobre atos que aumentem despesa com pessoal. Não se trata de vedação absoluta de toda despesa nesse período."]],"map":["Art. 16 → impacto e adequação","Pessoal → receita corrente líquida","Limites → alerta, prudencial e máximo","Art. 42 → obrigações e caixa"]},{"t":"Dívida pública, operações de crédito e regime fiscal sustentável","ref":"CF, arts. 52, VI a IX, e 167, III; LRF, arts. 29 a 38; LC 200/2023","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm","lessons":[["Dívida e crédito público","A dívida pública resulta de obrigações financeiras nas categorias legais. Operações de crédito estão submetidas a limites, condições e autorizações pertinentes, inclusive atribuições do Senado Federal. Garantias concedidas por entes públicos também seguem condições legais. Não confunda endividamento com toda despesa orçamentária."],["Regra de ouro","A regra constitucional veda operações de crédito que excedam despesas de capital, ressalvada autorização mediante créditos suplementares ou especiais com finalidade precisa, aprovados por maioria absoluta do Legislativo. A comparação tem natureza agregada e não exige vincular individualmente cada operação a uma obra."],["Regime fiscal sustentável","A LC 200/2023 institui regime fiscal federal com metas de resultado primário e limites de despesa primária, articulados à LRF. O crescimento real dos limites observa critérios vinculados à receita e ao desempenho fiscal, com exceções e mecanismos corretivos. A LC 211/2024 introduziu alterações; consulte a redação consolidada antes de aplicar valores ou limites específicos."]],"map":["Dívida → obrigações financeiras","Senado → limites e condições","Regra de ouro → operações de crédito e despesas de capital","LC 200 → metas e limites federais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp200.htm"},{"t":"Transparência, relatórios e controle fiscal","ref":"LRF, arts. 48 a 59; CF, arts. 70 a 75","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm","lessons":[["Transparência fiscal","A gestão fiscal responsável envolve divulgação de planos, orçamentos, prestações de contas e relatórios. A participação popular e a disponibilização de informações sobre execução orçamentária e financeira favorecem controle social. Transparência não se confunde com divulgação indiscriminada de dados pessoais protegidos."],["RREO e RGF","O Relatório Resumido da Execução Orçamentária é publicado, em regra, até trinta dias após encerramento de cada bimestre. O Relatório de Gestão Fiscal tem periodicidade quadrimestral como regra geral, ressalvadas opções e regimes legais específicos. Seus conteúdos e finalidades não são idênticos."],["Controle interno e externo","O Legislativo exerce controle externo com auxílio dos Tribunais de Contas. Cada Poder mantém sistema de controle interno nos termos constitucionais. A fiscalização examina aspectos contábeis, financeiros, orçamentários, operacionais e patrimoniais, considerando legalidade, legitimidade e economicidade."]],"map":["Transparência → publicidade e participação","RREO → bimestre","RGF → quadrimestre, regra geral","Controle externo → Legislativo e Tribunais de Contas"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Tribunais de Contas, transferências e responsabilização","ref":"CF, arts. 70 a 75; LRF, arts. 25 e 59","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Contas de governo e gestão","O TCU aprecia as contas anuais do Presidente mediante parecer prévio e julga contas de administradores e demais responsáveis nos termos do art. 71. O Congresso julga as contas presidenciais. As competências relativas às contas municipais devem observar a Constituição e a jurisprudência específica."],["Transferências intergovernamentais","Transferências constitucionais e legais não se confundem com transferências voluntárias. A LRF estabelece condições para entrega de recursos a título de cooperação, auxílio ou assistência financeira, com delimitação e exceções próprias. Recursos vinculados devem respeitar sua finalidade legal."],["Responsabilização","Irregularidades financeiras podem ensejar determinação corretiva, imputação de débito, multa e outras consequências conforme competência e procedimento. A decisão de Tribunal de Contas que imputa débito ou multa tem eficácia de título executivo. Responsabilidade fiscal não equivale automaticamente a crime ou improbidade; cada esfera possui requisitos próprios."]],"map":["Contas presidenciais → parecer prévio do TCU","Congresso → julgamento das contas presidenciais","Transferência voluntária → requisitos da LRF","Débito ou multa → título executivo"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"}];const financialQuestions=/*BANK:financialQuestions*/null;const socialSecurityModules=[{"t":"Seguridade social: princípios e organização","ref":"CF, arts. 194 a 204","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Três ramos da seguridade","A seguridade social reúne ações destinadas a assegurar saúde, previdência e assistência social. A saúde é direito de todos e dever do Estado; a previdência possui caráter contributivo e filiação obrigatória no RGPS para quem exerce atividade abrangida; a assistência social atende a quem dela necessitar, independentemente de contribuição. Os três ramos têm requisitos e formas de acesso distintos."],["Princípios constitucionais","O art. 194 prevê universalidade da cobertura e do atendimento, uniformidade e equivalência entre populações urbanas e rurais, seletividade e distributividade, irredutibilidade do valor dos benefícios, equidade no custeio, diversidade da base de financiamento e gestão democrática e descentralizada. Universalidade não significa que todo benefício contributivo seja concedido sem requisitos."],["Regimes previdenciários","O RGPS abrange os trabalhadores definidos na legislação. Os regimes próprios protegem servidores titulares de cargos efetivos segundo as normas aplicáveis a cada ente. Previdência complementar possui caráter autônomo e facultativo, conforme a Constituição. Não se deve aplicar automaticamente uma regra do RGPS a servidor vinculado a RPPS."]],"map":["Seguridade → saúde, previdência e assistência","Saúde → universal","Previdência → contributiva","Assistência → necessidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8742.htm"},{"t":"Segurados, dependentes, filiação e inscrição","ref":"Lei 8.213/1991, arts. 11 a 18","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Segurados obrigatórios","Empregado, empregado doméstico, contribuinte individual, trabalhador avulso e segurado especial integram categorias legais de segurados obrigatórios. A classificação depende da atividade e das condições de exercício. O segurado especial possui regime próprio de comprovação de atividade e custeio; não deve ser confundido com trabalhador rural empregado."],["Segurado facultativo","A pessoa que não exerce atividade que determine filiação obrigatória pode filiar-se facultativamente ao RGPS, desde que atendidos os requisitos aplicáveis. A filiação obrigatória decorre do exercício de atividade abrangida, enquanto a facultativa depende de manifestação e recolhimento conforme o regime. Inscrição cadastral não se confunde com filiação."],["Classes de dependentes","A lei organiza dependentes em classes: cônjuge, companheiro e filhos nas condições legais; pais; irmãos nas condições legais. A existência de dependente de classe anterior exclui os das seguintes. A dependência econômica da primeira classe é presumida, observadas as regras específicas sobre equiparação e comprovação."]],"map":["Obrigatório → atividade abrangida","Facultativo → requisitos e contribuição","Dependentes → classes","Classe anterior → exclui posterior"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/d3048compilado.htm"},{"t":"Financiamento e contribuições previdenciárias","ref":"CF, art. 195; Lei 8.212/1991","url":"https://www.planalto.gov.br/ccivil_03/leis/l8212cons.htm","lessons":[["Fontes de financiamento","A seguridade social é financiada por toda a sociedade, direta e indiretamente, mediante recursos dos orçamentos públicos e contribuições sociais constitucionalmente previstas. A diversidade das bases de financiamento reduz dependência de uma única fonte. Benefícios e serviços não podem ser criados, majorados ou estendidos sem correspondente fonte de custeio total."],["Salário de contribuição","O salário de contribuição constitui base de incidência conforme categoria e parcelas legalmente incluídas ou excluídas. Não é sinônimo de salário de benefício, utilizado no cálculo das prestações. Limites e faixas contributivas são atualizados, de modo que valores monetários devem ser conferidos para a competência analisada."],["Arrecadação e responsabilidade","Empresas possuem deveres de arrecadar e recolher contribuições nas hipóteses legais. A obrigação de retenção não se transfere automaticamente ao empregado por falha patronal. Contribuintes individuais e facultativos possuem regras específicas de recolhimento. A comprovação dos vínculos e remunerações deve considerar registros e documentos admitidos."]],"map":["Custeio → sociedade e orçamentos","Art. 195, § 5º → fonte total","Salário de contribuição ≠ salário de benefício","Recolhimento → conforme categoria"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Qualidade de segurado, período de graça e carência","ref":"Lei 8.213/1991, arts. 15 e 24 a 27-A","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Qualidade de segurado","A qualidade de segurado expressa a vinculação protetiva ao regime previdenciário. Em determinadas situações, ela permanece mesmo sem recolhimentos durante o período de graça. O prazo básico de manutenção após cessação de atividade abrangida é de doze meses nas hipóteses do art. 15, II, podendo ser ampliado conforme histórico contributivo e comprovação de desemprego."],["Período de graça","Para o facultativo, a regra legal é de seis meses após cessação das contribuições. Outras situações têm prazos específicos, como livramento e licenciamento militar. A data efetiva da perda deve considerar o art. 15, § 4º, e a regulamentação; não se presume perda imediata no primeiro mês sem contribuição."],["Carência e recuperação","Carência corresponde ao número mínimo de contribuições mensais exigido para determinado benefício. Tempo de contribuição e carência não são necessariamente idênticos. Alguns benefícios dispensam carência; outros exigem requisitos próprios. Após perda da qualidade, o aproveitamento de contribuições anteriores pode depender de novas contribuições, conforme o art. 27-A."]],"map":["Qualidade → vínculo protetivo","Graça → manutenção sem recolhimento","Facultativo → seis meses, regra legal","Carência → contribuições mínimas"]},{"t":"Aposentadorias programadas e reforma previdenciária","ref":"CF, art. 201; EC 103/2019, arts. 15 a 20 e 26","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc103.htm","lessons":[["Regras gerais e direito adquirido","A EC 103/2019 alterou requisitos e cálculo das aposentadorias. Para novos filiados no RGPS, a regra geral prevê idade de 62 anos para mulheres e 65 para homens, com tempos mínimos contributivos de 15 e 20 anos, respectivamente, nos termos do art. 19. Segurados que já haviam preenchido requisitos antes da reforma preservam o direito adquirido. Há regras diferenciadas para categorias e situações específicas."],["Regras de transição","Segurados filiados antes da reforma podem enquadrar-se nas transições por pontos, idade progressiva ou pedágios, conforme requisitos de cada modalidade. A pontuação e a idade progressiva mudam ao longo dos anos. A data do fato e a história contributiva são indispensáveis para selecionar corretamente a regra; não se deve confundir o pedágio de 50% com o de 100%."],["Cálculo do benefício","A reforma prevê, em várias hipóteses, cálculo sobre média de salários de contribuição e coeficiente de 60% acrescido de dois pontos percentuais por ano que exceda o marco contributivo pertinente. Existem exceções e regras específicas. A determinação da renda mensal exige identificar a espécie, a data e o regime jurídico aplicável."]],"map":["EC 103 → reforma","Direito adquirido → requisitos já completos","Transição → data e histórico","Cálculo → média e coeficiente conforme regra"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"t":"Benefícios por incapacidade e auxílio-acidente","ref":"Lei 8.213/1991, arts. 42 a 47, 59 a 63 e 86","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Incapacidade temporária","O auxílio por incapacidade temporária protege o segurado impossibilitado de exercer seu trabalho ou atividade habitual pelo período legal, observados qualidade, carência quando exigida e avaliação pertinente. Para empregado, os primeiros quinze dias consecutivos seguem, em regra, a responsabilidade patronal. Diagnóstico isolado não comprova necessariamente incapacidade laboral."],["Incapacidade permanente","A aposentadoria por incapacidade permanente exige incapacidade e insuscetibilidade de reabilitação para atividade que garanta subsistência, nos termos legais. A avaliação considera condições concretas e possibilidade de recuperação ou reabilitação. Doença preexistente não gera direito automaticamente, ressalvada incapacidade superveniente por progressão ou agravamento conforme a lei."],["Auxílio-acidente","O auxílio-acidente tem natureza indenizatória e pode ser devido após consolidação de lesões decorrentes de acidente que produzam sequelas redutoras da capacidade para o trabalho habitualmente exercido, para categorias abrangidas. Não se confunde com benefício substitutivo integral de renda. A acumulação com remuneração é admitida, mas com aposentadoria é vedada."]],"map":["Temporária → incapacidade para atividade habitual","Permanente → insuscetibilidade de reabilitação","Carência → regra e dispensas","Auxílio-acidente → indenização"]},{"t":"Aposentadoria especial, rural e da pessoa com deficiência","ref":"Lei 8.213/1991, arts. 48 e 57 a 58; EC 103/2019; LC 142/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Exposição a agentes nocivos","A aposentadoria especial exige comprovação de efetiva exposição a agentes prejudiciais à saúde, conforme os critérios do período de trabalho. Perfil Profissiográfico Previdenciário e documentação técnica são relevantes. A EC 103 alterou requisitos e restringiu a conversão de tempo especial em comum aos períodos anteriores à reforma, conforme art. 25, § 2º."],["Aposentadoria rural","A regra constitucional prevê idades reduzidas de 55 anos para mulheres e 60 para homens trabalhadores rurais abrangidos. O segurado especial deve comprovar atividade rural nos termos legais. A aposentadoria híbrida, que considera períodos rurais e urbanos, possui requisitos próprios e não segue automaticamente as idades reduzidas da aposentadoria exclusivamente rural."],["Pessoa com deficiência","A LC 142/2013 estabelece regras diferenciadas de aposentadoria no RGPS, incluindo modalidades por tempo de contribuição conforme grau de deficiência e por idade. A avaliação da deficiência não equivale à avaliação de incapacidade laboral. A EC 103 preservou sua aplicação nos termos do art. 22 até legislação pertinente."]],"map":["Especial → exposição comprovada","Conversão → marco da EC 103","Rural → requisitos específicos","Deficiência ≠ incapacidade laboral"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp142.htm"},{"t":"Pensão por morte, auxílio-reclusão e salário-família","ref":"Lei 8.213/1991, arts. 65 a 70 e 74 a 80; EC 103/2019, art. 23","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Pensão por morte","A pensão protege dependentes do segurado falecido, observados os requisitos de qualidade e dependência. Em regra, não exige carência, mas o número de contribuições e o tempo de casamento ou união estável podem influenciar a duração para cônjuge ou companheiro. A data do óbito determina a legislação aplicável; cálculo e duração possuem exceções legais."],["Auxílio-reclusão","O auxílio-reclusão destina-se aos dependentes do segurado de baixa renda recolhido à prisão em regime fechado, observadas a carência legal e demais condições. Não é pagamento ao preso. A aferição de renda, a situação de reclusão e a qualidade de segurado devem ser analisadas segundo as normas vigentes."],["Salário-família e dependência","O salário-família atende segurados nas categorias abrangidas e dentro dos limites legais de remuneração, em razão de filhos ou equiparados nas condições de idade ou invalidez previstas. Não se confunde com salário-maternidade. Limites monetários devem ser verificados na regulamentação anual e conforme a competência."]],"map":["Pensão → dependentes","Carência ≠ duração da pensão","Auxílio-reclusão → dependentes de segurado elegível","Salário-família → requisitos de renda e dependentes"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc103.htm"},{"t":"Salário-maternidade e benefício assistencial (BPC)","ref":"Lei 8.213/1991, arts. 71 a 73; ADIs 2110 e 2111; LOAS, art. 20","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Salário-maternidade","O salário-maternidade protege eventos como parto, adoção, guarda judicial para adoção e aborto não criminoso, nos termos legais. O prazo ordinário de 120 dias para parto e adoção possui hipóteses especiais que devem ser verificadas. A concessão depende da qualidade de segurado e dos requisitos pertinentes, incluindo afastamento da atividade quando exigido."],["Atualização sobre carência","O STF afastou a exigência de carência do salário-maternidade no julgamento das ADIs 2110 e 2111. A IN PRES/INSS 188/2025 implementou a orientação administrativa, e o INSS informa a dispensa de número mínimo de contribuições. Isso não elimina a necessidade de qualidade de segurado nem autoriza presumir direito apenas em razão do evento."],["Benefício de prestação continuada","O BPC é assistencial e garante um salário mínimo mensal à pessoa idosa com 65 anos ou mais ou à pessoa com deficiência que preencha os requisitos legais de vulnerabilidade e demais condições. Não depende de contribuição previdenciária prévia e não gera pensão por morte. A avaliação de renda e deficiência deve seguir a LOAS e as normas atualizadas, inclusive as regras cadastrais."]],"map":["Maternidade → proteção previdenciária","ADI 2110/2111 → carência afastada","BPC → assistência","BPC → idade ou deficiência e vulnerabilidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8742.htm"},{"t":"Processo previdenciário, revisão e regimes próprios","ref":"Lei 8.213/1991, arts. 103 e 126; CF, arts. 40 e 201; STF, Tema 350","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Requerimento e prova","O requerimento administrativo permite ao INSS examinar vínculos, contribuições e condições do benefício. CNIS, documentos laborais e outras provas podem ser relevantes conforme o caso. A decisão administrativa deve ser motivada e pode ser impugnada pelas vias próprias, inclusive recursos ao CRPS nos termos aplicáveis."],["Acesso judicial, decadência e prescrição","O Tema 350 do STF diferencia prévio requerimento administrativo de esgotamento da via administrativa. Em regra, a concessão inicial exige requerimento prévio, ressalvadas hipóteses reconhecidas. O prazo decadencial de dez anos para revisão do ato de concessão e a prescrição quinquenal das prestações vencidas possuem objetos distintos e ressalvas jurisprudenciais."],["Regimes próprios e contagem recíproca","Os RPPS dos servidores titulares de cargos efetivos seguem o art. 40 e legislação do ente. A contagem recíproca de tempo entre regimes admite compensação financeira, observadas regras sobre certidão de tempo de contribuição e vedação de dupla contagem. A EC 103 não tornou idênticas todas as regras de aposentadoria dos entes federativos."]],"map":["INSS → requerimento e prova","CRPS → recurso administrativo","Tema 350 → requerimento ≠ esgotamento","CTC → contagem recíproca"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const socialSecurityQuestions=/*BANK:socialSecurityQuestions*/null;const studyTracks={0:{modules:ethicsModules,questions:ethicsQuestions},1:{modules:constitutionalModules,questions:constitutionalQuestions},2:{modules:civilModules,questions:civilQuestions},3:{modules:processCivilModules,questions:processCivilQuestions},4:{modules:penalModules,questions:penalQuestions},5:{modules:processPenalModules,questions:processPenalQuestions},6:{modules:adminModules,questions:adminQuestions},7:{modules:taxModules,questions:taxQuestions},8:{modules:laborModules,questions:laborQuestions},9:{modules:processLaborModules,questions:processLaborQuestions},10:{modules:businessModules,questions:businessQuestions},11:{modules:humanRightsModules,questions:humanRightsQuestions},12:{modules:environmentModules,questions:environmentQuestions},13:{modules:internationalModules,questions:internationalQuestions},14:{modules:consumerModules,questions:consumerQuestions},15:{modules:ecaModules,questions:ecaQuestions},16:{modules:philosophyModules,questions:philosophyQuestions},17:{modules:electoralModules,questions:electoralQuestions},18:{modules:financialModules,questions:financialQuestions},19:{modules:socialSecurityModules,questions:socialSecurityQuestions}};qs.push(...ethicsQuestions,...constitutionalQuestions,...civilQuestions,...processCivilQuestions,...penalQuestions,...processPenalQuestions,...adminQuestions,...taxQuestions,...laborQuestions,...processLaborQuestions,...businessQuestions,...humanRightsQuestions,...environmentQuestions,...internationalQuestions,...consumerQuestions,...ecaQuestions,...philosophyQuestions,...electoralQuestions,...financialQuestions,...socialSecurityQuestions);const authoredQuestions=qs.filter(q=>q.id>=1000),questionById=new Map(qs.map(q=>[q.id,q]));let state={attempts:[],minutes:30,examDate:'',p function finishFullExam(timedOut){const s=state.session;if(!s||s.mode!=='full')return;const answers=queue.map(q=>{const selected=s.selections[q.id]??null;return{id:q.id,selected,correct:selected===q.ok}}),score=answers.filter(x=>x.correct).length,date=Date.now();const result={title:'Simulados',mode:'full',ids:queue.map(q=>q.id),score,total:80,date,timedOut,answers,elapsed:Math.min(18000000,Math.max(0,date-(s.startedAt||s.deadline-18000000)))};state.attempts.push(...answers.map(x=>({id:x.id,correct:x.correct,date,origin:'full',blank:x.selected===null})));for(const x of answers)recordQuestionReview(questionById.get(x.id),x.correct,date);state.results.push(result);state.session=null;save();fullResult(result)}

function selectPersonalExam(pool,priorities,recent,errors,reviews,targets,count,focus='balanced',now=Date.now(),random=Math.random){const groups=new Map(),used=new Set(),picked=[],modules=new Map();for(const q of pool){if(!groups.has(q.s))groups.set(q.s,[]);groups.get(q.s).push(q)}const ranks=new Map(priorities.map((a,i)=>[a.s,priorities.length-i]));const jitter=new Map(pool.map(q=>[q.id,random()]));const quota=new Map();const score=q=>{const x=recent.get(q.id),wrong=x?.correct===false,due=Number.isFinite(reviews[q.id]?.due)&&reviews[q.id].due<=now,level=Math.max(0,3-difficultyRank(q,targets.get(q.s)));return (focus==='coverage'?(!x?18:0):(wrong?18:!x?10:0))+(focus==='errors'&&wrong?16:0)+(due?8:0)+Math.min(errors.get(q.id)||0,5)*2+level*3+(modules.has(q.s+':'+q.module)?0:8)+jitter.get(q.id)};const pick=s=>{const q=(groups.get(s)||[]).filter(q=>!used.has(q.id)).sort((a,b)=>score(b)-score(a)||a.id-b.id)[0];if(!q)return false;used.add(q.id);picked.push(q);quota.set(s,(quota.get(s)||0)+1);modules.set(s+':'+q.module,true);return true};const order=[...groups.keys()].sort((a,b)=>(ranks.get(b)||0)-(ranks.get(a)||0)||a-b);const total=Math.min(count,pool.length);const first=focus==='coverage'?Math.min(total,order.length):Math.min(Math.ceil(total/2),order.length);for(const s of order.slice(0,first))pick(s);while(picked.length<total){const eligible=order.filter(s=>(quota.get(s)||0)<groups.get(s).length);if(!eligible.length)break;const cap=Math.max(2,Math.ceil(total*.25));const candidates=eligible.filter(s=>(quota.get(s)||0)<cap);const rank=s=>((ranks.get(s)||1)/(priorities.length||1))*(focus==='coverage'?1:3)-(quota.get(s)||0)*(focus==='coverage'?2:1);const s=(candidates.length?candidates:eligible).sort((a,b)=>rank(b)-rank(a)||a-b)[0];if(!pick(s))break}return picked}

const DIAG_PER_SUBJECT=3,DIAG_TOTAL=subjects.length*DIAG_PER_SUBJECT;
function latestDiagnostic(){return [...state.results].reverse().find(r=>r.mode==='diagnostic')||null}
function diagnosticBank(){
 const seen=new Set(state.results.filter(r=>r.mode==='diagnostic').flatMap(r=>r.ids||[])),out=[];
 const lanes=subjects.map((_,s)=>{
  const pool=studyTracks[s].questions, modules=[...new Set(pool.map(q=>q.module))];
  const candidates=shuffleExam(modules).map(m=>{const a=pool.filter(q=>q.module===m),fresh=a.filter(q=>!seen.has(q.id));return {q:shuffleExam(fresh.length?fresh:a)[0],fresh:fresh.length>0}});
  return candidates.sort((a,b)=>Number(b.fresh)-Number(a.fresh)).slice(0,DIAG_PER_SUBJECT).map(x=>x.q);
 });
 for(let j=0;j<DIAG_PER_SUBJECT;j++)for(const s of shuffleExam(subjects.map((_,i)=>i)))if(lanes[s][j])out.push(lanes[s][j]);
 return out;
}

}

function diagnosticStats(result){const byId=new Map(qs.map(q=>[q.id,q]));return subjects.map((name,s)=>{const a=result.answers.filter(x=>byId.get(x.id)?.s===s),correct=a.filter(x=>x.correct).length,unknown=a.filter(x=>x.selected===null).length;const rate=a.length?Math.round(correct/a.length*100):0;return {s,name,total:a.length,correct,unknown,rate,level:correct===0?'Atenção máxima':correct===1?'Prioridade alta':correct===2?'Consolidar':'Manter revisão',className:correct===0?'critical':correct===1?'priority':correct===2?'consolidate':'maintain'}})}

function diagnosticReport(result){const stats=diagnosticStats(result),weak=[...stats].sort((a,b)=>a.rate-b.rate||b.unknown-a.unknown||examBlueprint[b.s]-examBlueprint[a.s]),unknown=result.answers.filter(x=>x.selected===null).length,prior=stats.filter(x=>x.correct<=1).length;
 const rows=arr=>arr.map(x=>`<div class="listline diag-row ${x.className}"><div class="smallrow"><strong>${x.name}</strong><span class="diag-level ${x.className}">${x.level}</span></div><div class="smallrow"><span class="muted">${x.correct}/${x.total} acertos · ${x.unknown} não sei</span><strong>${x.rate}%</strong></div><div class="bar"><i style="width:${x.rate}%"></i></div></div>`).join('');
 return `<div class="panel mission"><div class="eyebrow" style="color:#dec38c">MAPA DE CONHECIMENTO</div><h2>Seu diagnóstico está pronto!</h2><div class="diag-score"><strong>${result.score}/${result.total}</strong><span>acertos · ${Math.round(result.score/result.total*100)}%</span></div><p> ${prior?prior+' disciplina(s) com prioridade alta ou atenção máxima.':'Nenhuma matéria na faixa de prioridade alta nesta amostra.'}</p><p>Esta é uma triagem inicial por regras, não uma estimativa de aprovação. Três questões por matéria não medem domínio completo.</p><button class="btn gold" onclick="go('Minha rota')">Começar minha rota →</button></div><div class="grid diag-stats"><div class="tile"><div class="label">Acertos</div><div class="metric diag-good">${result.score}</div></div><div class="tile"><div class="label">Erros</div><div class="metric diag-bad">${result.total-result.score-unknown}</div></div><div class="tile"><div class="label">Não sei</div><div class="metric diag-warn">${unknown}</div></div></div><div class="panel diag-next"><div><div class="eyebrow">O QUE FAZER AGORA</div><h3>${result.score/result.total<.4?'Comece construindo sua base':'Continue consolidando seu conhecimento'}</h3><p>Estude primeiro a teoria indicada na sua rota. Depois, pratique questões e revise os erros. Você não precisa revisar as 60 respostas de uma só vez.</p></div><button class="btn" onclick="go('Minha rota')">Ver plano de hoje →</button></div><div class="panel"><h3>5 prioridades de estudo</h3><p class="muted">Ordenadas por taxa de acerto, dúvidas declaradas e peso do modelo de simulado.</p>${rows(weak.slice(0,5))}<button class="btn alt" onclick="trainDiagnosticErrors()">Treinar pontos de dificuldade →</button></div><div class="panel"><details class="diag-section"><summary>Mapa das 20 disciplinas <span class="muted">Expandir</span></summary><p class="muted">0/3: atenção máxima · 1/3: prioridade alta · 2/3: consolidar · 3/3: manter revisão.</p><div class="diag-subject-grid">${rows(stats)}</div></details></div><div class="panel"><details class="diag-section"><summary>Correção comentada <span class="muted">${result.total} questões · Expandir</span></summary><div class="diag-filters"><label>Disciplina<select id="diagSubjectFilter" onchange="filterDiagnosticReview()"><option value="all">Todas</option>${subjects.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('')}</select></label><label>Resultado<select id="diagStatusFilter" onchange="filterDiagnosticReview()"><option value="all">Todos</option><option value="wrong">Incorretas</option><option value="unknown">Não sei</option><option value="correct">Corretas</option></select></label></div><p class="muted" id="diagReviewCount" aria-live="polite">${result.total} questões neste filtro</p>${result.answers.map((x,i)=>{const q=qs.find(y=>y.id===x.id);return q?`<details class="exam-review"><summary>${i+1}. ${x.correct?'✓ Correta':x.selected===null?'— Não sei':'✕ Incorreta'} · ${subjects[q.s]}</summary><h4>${q.q}</h4><p>Sua resposta: ${x.selected===null?'Não sei':q.a[x.selected]}</p><p><strong>Correta: ${q.a[q.ok]}</strong></p><p>${q.e}</p><p>${linkSource(q)}</p><button class="btn alt" onclick="mentorOpen(${q.s},${q.id})">Explicar com Mentor IA →</button></details>`:''}).join('')}</details><div class="sessiontools"><button class="btn alt" onclick="go('Diagnóstico')">Histórico de diagnósticos</button><button class="btn" onclick="go('Meu desempenho')">Meu desempenho</button></div></div>`;
}
function showDiagnostic(result){layout(diagnosticReport(result));window.scrollTo(0,0)}
function showDiagnosticHistory(i){const r=state.results[i];if(r?.mode==='diagnostic')showDiagnostic(r)}
function trainDiagnosticErrors(){const r=latestDiagnostic();if(!r)return;const recent=last(),ids=new Set(r.answers.filter(x=>!x.correct&&!recent[x.id]?.correct).map(x=>x.id)),items=authoredQuestions.filter(q=>ids.has(q.id));if(items.length)start(items,'Caderno de erros');else go('Minha rota')}
function diagnosticHome(){const history=state.results.map((r,i)=>({r,i})).filter(x=>x.r.mode==='diagnostic').reverse(),latest=history[0];return `<div class="panel mission"><div class="eyebrow" style="color:#dec38c">DIAGNÓSTICO INTELIGENTE</div><h2>${latest?'Atualize seu mapa de conhecimento':'Descubra seu ponto de partida'}</h2><p>60 questões autorais · 20 disciplinas · 3 módulos distintos por matéria. Sem cronômetro, com pausa e retomada.</p><button class="btn gold" onclick="beginDiagnostic()">${latest?'Refazer diagnóstico':'Começar diagnóstico'} →</button></div><div class="grid"><div class="tile"><div class="label">Questões</div><div class="metric">60</div></div><div class="tile"><div class="label">Disciplinas</div><div class="metric">20</div></div><div class="tile"><div class="label">Por disciplina</div><div class="metric">3</div></div></div><div class="panel"><h3>Como funciona</h3><div class="listline"><strong>1. Responda no seu ritmo</strong><p class="muted">Se não souber, escolha Não sei. Você pode voltar e alterar respostas antes de concluir.</p></div><div class="listline"><strong>2. Receba seu mapa de conhecimento</strong><p class="muted">Veja acertos, erros, dúvidas e prioridades nas 20 matérias.</p></div><div class="listline"><strong>3. Comece sua rota</strong><p class="muted">Erros e dúvidas alimentam sua prática e o caderno de erros.</p></div></div><div class="panel"><h3>Histórico de diagnósticos</h3>${history.length?history.map(({r,i})=>`<div class="listline smallrow"><div><strong>${r.score}/${r.total} acertos</strong><p class="muted">${new Date(r.date).toLocaleString('pt-BR')}</p></div><button class="btn alt" onclick="showDiagnosticHistory(${i})">Ver mapa</button></div>`).join(''):'<p class="muted">Nenhum diagnóstico completo realizado na sua conta.</p>'}</div><p class="notice">Triagem por regras e questões autorais. Não representa uma nota oficial nem diagnóstico definitivo de domínio. Revisão jurídica especializada pendente.</p>`}


function routeDate(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function routeDayDistance(a,b){return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000)}
function adaptiveEvidence(){const now=Date.now(),byId=new Map(qs.filter(q=>q.id>=1000).map(q=>[q.id,q])),recent=new Map(),errors=new Map(),per=subjects.map((name,s)=>({s,name,records:[],modules:Array.from({length:10},()=>({records:[],due:0})),due:0,unseen:0,latest:0}));for(const x of state.attempts){if(!byId.has(x.id))continue;const old=recent.get(x.id);if(!old||x.date>=old.date)recent.set(x.id,x);if(!x.correct)errors.set(x.id,(errors.get(x.id)||0)+1)}for(const q of byId.values()){const a=per[q.s],m=a.modules[q.module],x=recent.get(q.id);if(x){a.records.push(x);m.records.push(x);a.latest=Math.max(a.latest,x.date||0)}else a.unseen++;if(state.reviews[q.id]?.due<=now){a.due++;m.due++}}
 const d=daysLeft(),urgency=d!==null&&d>=0&&d<=14?1.4:1;
 for(const a of per){const observations=a.records.filter(x=>now-(x.date||0)<=30*86400000),rec=observations.length?observations:a.records;let weighted=0,correct=0;for(const x of rec){const w=Math.max(.25,Math.pow(.5,Math.max(0,now-x.date)/(14*86400000)));weighted+=w;correct+=w*Number(x.correct)}a.n=rec.length;a.rate=a.n?Math.round(rec.filter(x=>x.correct).length/a.n*100):null;a.mastery=(correct+2)/(weighted+4);a.wrong=a.records.filter(x=>!x.correct).length;a.unknown=rec.filter(x=>x.unknown).length;a.gapDays=a.latest?Math.max(0,(now-a.latest)/86400000):14;const incidence=examBlueprint[a.s]/8;a.priority=(1-a.mastery)*50+incidence*20*urgency+Math.min(a.wrong,10)*1.5+Math.min(a.due,8)*1.5+Math.min(a.gapDays,14)*1.2+(a.n<3?7:0);a.reason=a.n===0?'Sem evidência de desempenho':a.wrong?'Erros pendentes e peso no simulado':a.due?'Revisões vencidas':a.rate<67?'Reforçar fundamentos':'Manutenção e cobertura';}
 return {per:per.sort((a,b)=>b.priority-a.priority||a.s-b.s),recent,errors,byId}
}
function chooseAdaptiveModule(a){return a.modules.map((m,i)=>{const n=m.records.length,wrong=m.records.filter(x=>!x.correct).length,done=!!(a.s===0?state.completedEthics[i]:state.completedTracks[a.s]?.[i]);return {i,score:wrong*5+m.due*2+(n===0?4:0)+(done?0:2)-(n-wrong)*.4}}).sort((x,y)=>y.score-x.score||x.i-y.i)[0].i}
function adaptiveDayCreate(date=routeDate()){const {per,recent,errors,byId}=adaptiveEvidence(),minutes=validDailyMinutes(state.minutes)?Number(state.minutes):30,d=daysLeft(),late=d!==null&&d>=0&&d<=14,diag=latestDiagnostic(),beginner=!!diag&&diag.score/diag.total<.4;
 const prev=Object.values(state.adaptiveDays||{}).filter(x=>x.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0],prevSubjects=new Set(prev?.tasks.map(t=>t.s)||[]),ranked=[...per].sort((a,b)=>(b.priority-(prevSubjects.has(b.s)?5:0))-(a.priority-(prevSubjects.has(a.s)?5:0))||a.s-b.s);
 const theory=minutes===15?5:Math.round(minutes*(beginner?.5:late?.2:.3)/5)*5,review=minutes===15?0:Math.max(5,Math.round(minutes*(beginner?.15:.2)/5)*5),practice=minutes-theory-review;
 const used=new Set(),tasks=[],add=t=>tasks.push({...t,id:date+'-'+tasks.length,done:false});
 const rankQuestion=q=>{const x=recent.get(q.id),due=state.reviews[q.id]?.due<=Date.now();return (x?x.correct?0:12:7)+(due?8:0)+Math.min(errors.get(q.id)||0,5)*2+(x?.unknown?2:0)};
 const pick=(s,n,module,kind)=>{const pool=studyTracks[s].questions.filter(q=>!used.has(q.id)),target=beginner?'Fácil':difficultyTarget(s);const score=q=>rankQuestion(q)+(q.module===module?12:0)+(kind==='practice'?Math.max(0,5-2*difficultyRank(q,target)):0);const list=[...pool].sort((a,b)=>(beginner&&kind==='practice'?Number(b.difficulty==='Fácil')-Number(a.difficulty==='Fácil'):0)||score(b)-score(a)||a.id-b.id).slice(0,n);list.forEach(q=>used.add(q.id));return list.map(q=>q.id)};
 const distribute=(total,count)=>Array.from({length:count},(_,i)=>Math.floor(total/count)+(i<total%count?1:0));
 const count=beginner?Math.max(1,Math.ceil(theory/45),Math.ceil(practice/45),minutes>=90?2:1):Math.max(1,Math.ceil(theory/45),Math.ceil(practice/45),practice>=20?2:1);
 const theoryParts=distribute(theory,count),practiceParts=distribute(practice,count);
 for(let i=0;i<count;i++){const a=ranked[i%ranked.length],m=chooseAdaptiveModule(a);if(theoryParts[i])add({kind:'theory',s:a.s,module:m,minutes:theoryParts[i],title:beginner?'Aprender fundamentos':'Estudar teoria',reason:a.reason});if(practiceParts[i])add({kind:'practice',s:a.s,module:m,minutes:practiceParts[i],ids:pick(a.s,Math.max(1,Math.floor(practiceParts[i]/3)),m,'practice'),title:'Praticar o conteúdo',reason:beginner?'Consolidar os fundamentos da disciplina':a.reason})}
 for(const n of review?distribute(review,Math.ceil(review/45)):[]){const eligible=[...byId.values()].filter(q=>!used.has(q.id)&&(recent.get(q.id)?.correct===false||state.reviews[q.id]?.due<=Date.now()));const focus=ranked.find(a=>eligible.some(q=>q.s===a.s))||ranked[tasks.length%ranked.length],m=chooseAdaptiveModule(focus),target=Math.max(1,Math.floor(n/3)),priority=eligible.filter(q=>q.s===focus.s).sort((a,b)=>rankQuestion(b)-rankQuestion(a)||a.id-b.id).slice(0,target).map(q=>q.id);priority.forEach(id=>used.add(id));const ids=[...priority,...pick(focus.s,target-priority.length,m,'review')];add({kind:'review',s:focus.s,module:m,minutes:n,ids,title:priority.length?'Revisar erros e reforçar conceitos':'Revisão de manutenção',reason:priority.length?'Retomar dúvidas e consolidar com questões de reforço':'Manter contato com a disciplina'})}
 return {version:2,date,minutes,examDate:state.examDate||'',diagnosticDate:diag?.date||null,beginner,phase:beginner?'Construção de base':late?'Reta final':d!==null&&d>14&&d<=45?'Consolidação':'Construção de base',createdAt:Date.now(),tasks};
}
function getAdaptiveDay(){if(!state.adaptiveDays||typeof state.adaptiveDays!=='object')state.adaptiveDays={};const date=routeDate();const existing=state.adaptiveDays[date],started=existing?.tasks.some(t=>t.done)||state.session?.routeTask?.date===date;if(!existing||(!started&&(existing.version!==2||existing.minutes!==Number(state.minutes)||existing.examDate!==(state.examDate||'')||existing.diagnosticDate!==(latestDiagnostic()?.date||null)))){state.adaptiveDays[date]=adaptiveDayCreate(date);save()}return state.adaptiveDays[date]}
function adaptiveProgress(p){const done=p.tasks.filter(t=>t.done);return {done:done.length,total:p.tasks.length,minutes:done.reduce((n,t)=>n+t.minutes,0),planned:p.minutes,complete:done.length===p.tasks.length}}
function adaptiveStreak(){let n=0;const days=state.adaptiveDays||{};let offset=adaptiveProgress(getAdaptiveDay()).complete?0:-1;for(let i=offset;i>=-365;i--){const p=days[routeDate(i)];if(!p||!adaptiveProgress(p).complete)break;n++}return n}
function regenerateAdaptive(){const p=getAdaptiveDay();if(p.tasks.some(t=>t.done)||state.session?.routeTask?.date===p.date){rotaNotice('A rota iniciada fica preservada. As novas preferências serão consideradas amanhã.');return}rotaDialog({title:'Recalcular rota de hoje?',message:'As missões ainda não iniciadas serão substituídas por um novo plano com suas preferências e desempenho atuais.',action:'Recalcular rota',onConfirm:()=>{if(p.tasks.some(t=>t.done)||state.session?.routeTask?.date===p.date)return;state.adaptiveDays[p.date]=adaptiveDayCreate(p.date);save();render()}})}
function completeAdaptiveTask(ref,score,total){const p=state.adaptiveDays?.[ref?.date],t=p?.tasks.find(x=>x.id===ref.id);if(!t||t.done)return false;t.done=true;t.completedAt=Date.now();if(Number.isInteger(total)){t.score=score;t.total=total}save();return true}
const expandedLessons={"Direitos e garantias fundamentais":{"intro":"Imagine que uma autoridade possa entrar na sua casa, impedir você de expressar uma opinião ou aplicar uma sanção sem que você possa se defender. Os direitos fundamentais existem justamente para estabelecer limites ao poder e proteger a dignidade das pessoas. Nesta aula, vamos estudar três grupos de proteção do art. 5º da Constituição, começando pelos conceitos e terminando com situações semelhantes às de prova.","objectives":["Distinguir direitos fundamentais de garantias que protegem seu exercício.","Identificar as hipóteses constitucionais de entrada em domicílio.","Separar liberdade de expressão de imunidade por abusos.","Reconhecer contraditório, ampla defesa e outras garantias processuais."],"sections":[{"title":"1. Antes de tudo: o que é um direito fundamental?","ref":"CF, art. 5º, caput e incisos I e II","paragraphs":["A Constituição ocupa a posição superior no ordenamento jurídico. As leis e os atos do poder público precisam respeitá-la. Um direito fundamental protege um interesse essencial, como liberdade, igualdade ou privacidade. Uma garantia oferece proteção ou um instrumento para que o direito possa ser exercido e defendido. Essa distinção ajuda na aprendizagem, embora os conceitos possam se sobrepor.","Pense no direito de ir e vir. Se alguém sofrer uma restrição ilegal à sua liberdade de locomoção, o habeas corpus pode ser utilizado para protegê-la. O direito é a liberdade; a garantia, nesse exemplo, é o instrumento constitucional de proteção.","A igualdade não significa tratar todas as pessoas de forma idêntica em qualquer circunstância. Uma diferença de tratamento pode ser legítima se existir fundamento constitucional e justificativa adequada. O problema é a discriminação arbitrária."],"example":"Uma seleção pública exige determinado conhecimento técnico relacionado ao cargo. Não é a existência de um requisito, isoladamente, que viola a igualdade: é preciso examinar sua relação com a função e sua legitimidade.","trap":"Desconfie de alternativas que afirmem que a igualdade impede toda e qualquer distinção."},{"title":"2. Liberdade de manifestação e proteção da pessoa","ref":"CF, art. 5º, IV, V, IX e X","paragraphs":["Manifestar opiniões, produzir arte e comunicar ideias são expressões da liberdade. O estudante precisa distinguir a proteção contra censura da possibilidade de responsabilização por condutas ilícitas. A liberdade não transforma automaticamente uma ofensa ou violação da privacidade em comportamento permitido.","A vedação ao anonimato está relacionada à possibilidade de atribuir responsabilidade pela manifestação. Isso não significa que toda forma lícita de proteção de identidade esteja proibida. A própria Constituição também protege o sigilo da fonte quando necessário ao exercício profissional.","Em uma questão, identifique os direitos que estão em tensão: manifestação, honra, imagem ou intimidade. Não conclua automaticamente que um deles elimina o outro. Examine o contexto e a solução jurídica cabível."],"example":"Uma pessoa critica uma decisão de uma autoridade. Outra publica deliberadamente informações íntimas de um terceiro sem justificativa. São situações diferentes: a análise jurídica considera tanto a liberdade quanto a proteção da pessoa.","trap":"Liberdade de expressão não equivale a ausência de responsabilidade."},{"title":"3. Inviolabilidade do domicílio","ref":"CF, art. 5º, XI","paragraphs":["O domicílio é um espaço protegido contra invasões. Para resolver questões, pergunte inicialmente se existe consentimento válido do morador. Se não houver, procure uma hipótese excepcional admitida constitucionalmente.","Sem consentimento, as hipóteses são flagrante delito, desastre, prestação de socorro ou determinação judicial durante o dia. As três primeiras não estão submetidas à restrição constitucional de horário aplicável à ordem judicial. A existência concreta de uma exceção não pode ser simplesmente presumida.","Na prática de prova, isole dois elementos: o motivo da entrada e o horário. Um mandado judicial, por si só, não autoriza a entrada noturna contra a vontade do morador. Se houver uma situação excepcional independente, a análise é outra."],"example":"À noite, uma pessoa pede socorro dentro de uma residência. A prestação de socorro pode justificar a entrada sem consentimento. Compare com uma diligência comum baseada somente em ordem judicial: a regra constitucional exige que ocorra durante o dia.","trap":"Não confunda a exceção de flagrante ou socorro com a execução de uma ordem judicial."},{"title":"4. Sigilo das comunicações","ref":"CF, art. 5º, XII","paragraphs":["A Constituição protege o sigilo das comunicações. A interceptação telefônica é um tema diferente da entrada em domicílio, mesmo que uma investigação envolva os dois assuntos.","A quebra do sigilo telefônico por interceptação está sujeita à ordem judicial e aos requisitos legais, para investigação criminal ou instrução processual penal. Não basta a mera vontade de uma autoridade administrativa.","Diferencie interceptar o fluxo de uma conversa de outras formas de acesso a informações. Não estenda automaticamente os requisitos de uma modalidade a toda espécie de dado ou comunicação."],"example":"Uma autoridade deseja ouvir conversas telefônicas futuras de uma pessoa para apurar uma infração penal. A medida não pode ser realizada apenas por conveniência administrativa; devem ser preenchidas as condições jurídicas específicas.","trap":"Não confunda autorização judicial com autorização irrestrita."},{"title":"5. Como funcionam as garantias processuais","ref":"CF, art. 5º, LIV, LV, LVI, LVII e LXI","paragraphs":["Processo é um conjunto organizado de atos destinado à solução de uma controvérsia ou à aplicação de uma decisão. O devido processo legal exige respeito às garantias e ao procedimento jurídico aplicável. Não é suficiente que uma autoridade acredite estar correta.","Contraditório é a possibilidade de conhecer e reagir aos argumentos e elementos relevantes do processo. Ampla defesa envolve os meios legítimos de defesa disponíveis. Juntos, impedem que a participação da pessoa seja apenas simbólica.","A proteção contra provas ilícitas exige atenção à origem do elemento probatório. Uma prova não se torna admissível só por parecer convincente. A presunção de inocência protege contra o tratamento antecipado como culpado, sem excluir, em termos gerais, medidas cautelares previstas em lei e fundamentadas. Questões sobre execução penal e Tribunal do Júri exigem atenção às regras e à jurisprudência específicas.","Prisão cautelar não é sinônimo de pena. A finalidade cautelar é proteger uma necessidade processual legalmente reconhecida, não punir antecipadamente. A simples existência de investigação não substitui os requisitos de uma medida cautelar."],"example":"Em um procedimento administrativo sancionador, a pessoa precisa ter oportunidade de conhecer a acusação e apresentar defesa conforme a legislação aplicável. A autoridade não pode ignorar essas garantias apenas porque considera a infração evidente.","trap":"Contraditório não é apenas receber uma notificação; é poder participar e reagir de modo efetivo."}],"checks":[["Um tratamento diferente é sempre inconstitucional?","Não. Examine se a distinção tem justificativa legítima e respeita a Constituição."],["Uma ordem judicial permite, sozinha, entrar à noite sem consentimento?","Não. A ordem judicial é hipótese de entrada durante o dia; outras exceções constitucionais devem ser avaliadas separadamente."],["A liberdade de manifestação impede toda responsabilização posterior?","Não. Outros direitos, como honra e privacidade, também são protegidos."],["Contraditório e ampla defesa são a mesma coisa?","Não exatamente. O primeiro envolve conhecimento e reação; a segunda abrange os meios legítimos para se defender."],["A presunção de inocência impede qualquer prisão cautelar?","Não. Medidas cautelares podem existir quando legalmente cabíveis e fundamentadas; não devem funcionar como punição antecipada."]],"schedule":[["Leitura guiada",12],["Consultar os incisos indicados na Constituição",8],["Resolver os casos e responder sem olhar",7],["Revisar o mapa e anotar dúvidas",3]]},"Prescrição e decadência":{"intro":"O tempo pode mudar a possibilidade de exigir um direito. Imagine uma dívida vencida há muitos anos e um contrato celebrado mediante coação. São problemas diferentes: no primeiro, alguém busca uma prestação; no segundo, pretende alterar uma situação jurídica. Entender essa diferença é mais importante do que decorar números isolados.","objectives":["Distinguir direito, pretensão e direito potestativo.","Identificar a regra geral e os prazos especiais.","Construir uma linha do tempo e diferenciar suspensão de interrupção.","Reconhecer o regime da decadência legal e convencional."],"sections":[{"title":"1. Direito, pretensão e exigibilidade","ref":"CC, art. 189","paragraphs":["Uma relação jurídica pode atribuir a alguém um crédito, isto é, a posição de quem pode receber uma prestação. Se a prestação não é cumprida quando exigível, surge a possibilidade de exigir seu cumprimento. Essa posição de exigência é chamada de pretensão.","A prescrição atua sobre a pretensão. Para estudar um caso, identifique primeiro qual comportamento se pede do outro: pagar, entregar, reparar ou cumprir uma obrigação. Em seguida, investigue quando a pretensão surgiu e qual prazo lhe corresponde.","Não presuma que o contrato foi celebrado no mesmo dia em que nasceu a pretensão. Um pagamento previsto para uma data futura não está necessariamente atrasado no dia da assinatura."],"example":"Ana vende um bem com pagamento previsto para o mês seguinte. Para analisar eventual prescrição de cobrança, comece pelo vencimento e pelo descumprimento, não simplesmente pela data da venda.","trap":"Prescrição não é uma expressão genérica para qualquer prazo vencido."},{"title":"2. Como encontrar o prazo aplicável","ref":"CC, arts. 205 e 206","paragraphs":["O Código Civil contém um prazo geral, aplicável quando não existe prazo específico menor. Antes de recorrer a ele, verifique se o tipo de pretensão consta de regra especial. A natureza do pedido é decisiva, e não apenas o título do contrato.","Organize um caso em quatro etapas: identifique o pedido, procure o dispositivo adequado, determine o termo inicial e analise eventos que possam modificar a contagem. A leitura do artigo inteiro evita transportar o prazo de uma pretensão para outra.","O prazo geral previsto no art. 205 é de dez anos. O art. 206 contém hipóteses com períodos próprios, como determinadas pretensões reparatórias e de cobrança. Leia os requisitos exatos; a incidência de regras especiais pode depender do regime jurídico."],"example":"Duas pessoas ajuízam pedidos diferentes a partir de um mesmo fato. Uma busca reparação e a outra exige uma prestação contratual. Não é correto concluir que ambas necessariamente possuem o mesmo prazo.","trap":"O prazo decenal não substitui automaticamente todos os prazos especiais."},{"title":"3. Impedimento, suspensão e interrupção","ref":"CC, arts. 197 a 204","paragraphs":["Imagine um relógio que mede o prazo. No impedimento, o relógio ainda não começa a contar. Na suspensão, uma contagem que já começou fica temporariamente parada. Cessada a causa, aproveita-se o período anterior.","Na interrupção, a lógica é diferente: o prazo recomeça conforme o regime aplicável. O art. 202 limita a interrupção a uma vez. Identifique se o evento descrito realmente está previsto em lei; nem toda conversa entre credor e devedor altera o prazo.","Desenhe a linha do tempo com três marcas: nascimento da pretensão, evento modificador e data final. Compare quanto tempo correu antes e depois do evento. Essa representação reduz erros quando o enunciado traz datas próximas."],"example":"Se um prazo hipotético de cinco anos correu por dois antes de uma suspensão válida, a lógica é aproveitar os dois anos já transcorridos após cessar a causa. Uma interrupção válida segue lógica de reinício, não de simples retomada.","trap":"Não confunda a pausa com o reinício e não invente causas que a lei não prevê."},{"title":"4. Decadência e direitos potestativos","ref":"CC, arts. 207 a 211","paragraphs":["Direito potestativo é uma posição que permite provocar uma alteração jurídica, sem depender de uma prestação do sujeito passivo da mesma maneira que ocorre com uma cobrança. Um exemplo didático é o direito de pedir a anulação de negócio jurídico quando presentes seus requisitos.","A decadência está associada ao prazo para exercer determinados direitos dessa natureza. Para resolver a questão, identifique se a pessoa quer obter uma prestação ou modificar uma situação jurídica. Depois localize a regra de prazo específica.","As causas modificadoras da prescrição não se estendem indistintamente à decadência. O próprio Código prevê ressalvas, inclusive a proteção relacionada aos absolutamente incapazes. A decadência legal não pode ser renunciada; a convencional possui disciplina diferente."],"example":"Uma pessoa pretende desconstituir um negócio por vício de vontade. A pergunta correta não é simplesmente quanto tempo ela tem para cobrar, mas qual direito pretende exercer e qual regra específica incide.","trap":"Não aplique automaticamente as causas de suspensão ou interrupção da prescrição à decadência."},{"title":"5. Método de resolução na prova","ref":"CC, arts. 189 a 211","paragraphs":["Antes de olhar as alternativas, escreva mentalmente o pedido: exigir uma prestação ou alterar uma relação jurídica? Em seguida, localize a categoria do prazo. Não use palavras como cobrança ou anulação sem verificar o que efetivamente se pede.","Determine o fato inicial e organize os demais acontecimentos em ordem. Marque os fatos legalmente relevantes e descarte elementos narrativos que não influenciam a contagem. Se o caso não fornecer dados suficientes, não invente uma data.","Por fim, examine se o juiz pode reconhecer o fenômeno de ofício, se há possibilidade de renúncia e se existem exceções. A decadência legal deve ser conhecida de ofício, mas a convencional não pode ser suprida dessa maneira."],"example":"Um enunciado menciona uma conversa informal entre as partes e uma data de vencimento. Antes de reiniciar a contagem, verifique se há fato juridicamente apto a interrompê-la.","trap":"Identifique a natureza do prazo antes de fazer qualquer cálculo."}],"checks":[["O prazo geral de dez anos vale em toda pretensão?","Não. Verifique primeiro a existência de prazo especial."],["Suspensão apaga o tempo já transcorrido?","Não. Em regra, conserva o tempo anterior."],["A prescrição pode ser interrompida indefinidamente?","Não. O art. 202 prevê interrupção uma vez."],["A decadência convencional pode ser conhecida de ofício?","Não, segundo o art. 211."],["Por onde começar uma questão com datas?","Identifique a pretensão ou o direito exercido, o termo inicial e a regra aplicável."]],"schedule":[["Leitura guiada",12],["Consultar a fonte legal",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Teoria constitucional e poder constituinte":{"intro":"A Constituição não é simplesmente mais uma lei: é o marco que organiza o Estado e estabelece limites ao exercício do poder. Para compreender questões de reforma constitucional, é preciso distinguir a criação de uma nova ordem das mudanças realizadas dentro de uma Constituição existente.","objectives":["Reconhecer fundamentos, objetivos e princípios internacionais.","Distinguir poder constituinte originário e derivado.","Compreender o procedimento de emenda constitucional.","Identificar limites materiais e circunstanciais."],"sections":[{"title":"1. A função da Constituição","ref":"CF, arts. 1º a 4º","paragraphs":["Imagine um jogo cujas regras determinam quem pode criar outras regras. A Constituição desempenha função semelhante no Estado: organiza instituições, distribui competências e protege posições jurídicas essenciais.","Uma lei ordinária não pode contrariar a Constituição simplesmente por ser mais recente. A diferença entre hierarquia e cronologia é fundamental. Uma norma posterior precisa respeitar o parâmetro constitucional superior.","A Constituição brasileira possui procedimento de reforma distinto da produção de leis ordinárias. Essa rigidez ajuda a compreender por que o texto pode mudar, mas não por qualquer procedimento."],"example":"Uma lei municipal não se torna constitucional apenas porque recebeu aprovação unânime da Câmara local.","trap":"Hierarquia normativa não se confunde com popularidade nem com a data de publicação."},{"title":"2. Fundamentos, objetivos e relações internacionais","ref":"CF, arts. 1º, 3º e 4º","paragraphs":["Fundamentos descrevem as bases da República; objetivos expressam finalidades a alcançar. Pense nos fundamentos como a sustentação do edifício e nos objetivos como o rumo das políticas públicas.","Cidadania e dignidade da pessoa humana pertencem ao primeiro grupo. A construção de uma sociedade livre, justa e solidária e a redução de desigualdades pertencem ao segundo. Os princípios internacionais orientam a atuação brasileira perante outros Estados.","Para memorizar, faça três colunas e associe cada expressão à sua função. Na prova, uma frase pode estar correta em termos gerais, mas errada por ser atribuída ao artigo ou grupo incorreto."],"example":"Um enunciado apresenta a redução das desigualdades como fundamento do art. 1º. O erro está na classificação, e não na importância constitucional dessa finalidade.","trap":"Não transforme toda expressão constitucional relevante em fundamento da República."},{"title":"3. Poder constituinte originário e derivado","ref":"CF, art. 60","paragraphs":["O poder originário institui uma ordem constitucional nova. Na teoria constitucional clássica, distingue-se da competência jurídica de reforma, que existe porque a Constituição vigente a prevê.","O poder derivado de reforma modifica a Constituição dentro do procedimento e dos limites da ordem vigente. Assim, uma proposta de emenda não é a manifestação de um poder juridicamente ilimitado.","Outra categoria estudada é o poder decorrente, relacionado à organização constitucional dos Estados nos limites da Constituição Federal. Não confunda a autonomia estadual com soberania nacional."],"example":"Uma assembleia estadual elabora sua Constituição, mas precisa observar a Constituição Federal. Não se trata de liberdade para afastar os limites da federação.","trap":"Poder de reforma não se confunde com poder originário."},{"title":"4. O caminho de uma emenda","ref":"CF, art. 60, §§ 1º a 3º","paragraphs":["Uma proposta de emenda passa por um procedimento mais exigente do que a lei ordinária. Verifique a iniciativa constitucionalmente prevista e, depois, a deliberação em cada Casa do Congresso.","A votação ocorre em dois turnos em cada Casa e exige três quintos dos respectivos membros. O denominador é a composição da Casa, não apenas os presentes. Ao final, a promulgação compete às Mesas da Câmara e do Senado.","Diferentemente da tramitação ordinária de muitos projetos de lei, a emenda não depende de sanção presidencial. Não confunda participação na iniciativa com competência para promulgar."],"example":"Uma proposta alcança três quintos em apenas um turno no Senado. Ainda não cumpriu todo o procedimento exigido.","trap":"Uma maioria expressiva em uma única votação não substitui as demais etapas."},{"title":"5. Limites da reforma constitucional","ref":"CF, art. 60, §§ 1º, 4º e 5º","paragraphs":["Limites circunstanciais impedem a alteração constitucional durante situações excepcionais determinadas no texto. Consulte as três hipóteses expressamente indicadas: intervenção federal, estado de defesa e estado de sítio.","Limites materiais protegem núcleos estruturais contra propostas tendentes à sua abolição. A análise não se resume a procurar a palavra revogação: uma alteração pode comprometer o núcleo protegido por seus efeitos.","Além disso, a proposta rejeitada ou prejudicada não pode ser reapresentada na mesma sessão legislativa. Separe esse limite procedimental dos limites materiais e circunstanciais."],"example":"Uma proposta aprovada por ampla maioria pretende eliminar a separação de poderes. A votação não resolve a incompatibilidade material.","trap":"Cláusula pétrea protege contra abolição, não significa que nenhuma mudança relacionada ao tema seja possível."}],"checks":[["Qual a diferença entre fundamento e objetivo?","Fundamento é base da ordem; objetivo é finalidade a alcançar."],["O poder derivado pode ignorar a Constituição vigente?","Não. Está sujeito aos limites constitucionais."],["Três quintos dos presentes bastam?","Não. O quórum considera os membros da respectiva Casa."],["Uma emenda depende de sanção presidencial?","Não. É promulgada pelas Mesas das Casas."],["Pode haver emenda durante estado de sítio?","Não, enquanto durar a situação constitucional indicada."]],"schedule":[["Leitura guiada",12],["Consultar a fonte legal",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Remédios constitucionais":{"intro":"Quando um direito constitucional é ameaçado, o sistema jurídico oferece instrumentos específicos para protegê-lo. Chamamos esses instrumentos de remédios constitucionais. A estratégia é descobrir o problema antes de escolher a ação.","objectives":["Relacionar cada remédio ao direito protegido.","Distinguir habeas corpus e habeas data.","Reconhecer os requisitos centrais do mandado de segurança e injunção.","Identificar finalidade e legitimidade da ação popular."],"sections":[{"title":"1. Escolhendo a proteção adequada","ref":"CF, art. 5º, LXVIII a LXXIII","paragraphs":["Um remédio constitucional não é uma solução universal. Cada instrumento tem finalidade, requisitos e regras de legitimidade. A mesma autoridade pode praticar atos diferentes que exigem instrumentos distintos.","Comece identificando o direito ameaçado e o tipo de
