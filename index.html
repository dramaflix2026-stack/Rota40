function trackScreen(k){

 if(type==='modulo'){const m=modules[i];return back+`<div class="panel"><div class="eyebrow">MÓDULO ${String(i+1).padStart(2,'0')} / ${modules.length}</div><h2>${m.t}</h2><p class="muted">${m.ref}</p></div>${m.lessons.map(([t,p],j)=>`<article class="panel ethics-lesson"><div class="label">TÓPICO ${j+1}</div><h3>${t}</h3><p>${p}</p></article>`).join('')}<div class="panel ethics-lesson"><h3>Mapa de revisão</h3>${trackMap(m)}${trackSource(m)}</div><div class="sessiontools"><button class="btn gold" onclick="trackMark(${k},${i})">${d[i]?'Desmarcar conclusão':'Marcar como concluído'}</button><button class="btn" onclick="trackPractice(${k},${i})">Praticar ${questions.filter(q=>q.module===i).length} questões</button>${i<modules.length-1?`<button class="btn alt" onclick="go('${trackRoute(k,i+1,'modulo')}')">Próximo módulo →</button>`:''}</div>`}
 if(type==='lei')return back+`<div class="panel"><h2>${k===16?'Referências comentadas':'Legislação comentada'}</h2><p class="muted">${k===16?'Guia de leitura: compare as teorias e consulte as obras e referências acadêmicas indicadas.':'Guia de estudo: confira a redação oficial e a jurisprudência vigente.'}</p></div>${modules.map(m=>`<article class="panel ethics-lesson"><h3>${m.t}</h3>${m.lessons.map(([t,p])=>`<p><strong>${t}.</strong> ${p}</p>`).join('')}${trackSource(m)}</article>`).join('')}`;
 if(type==='mapas'||type==='revisao')return back+`<div class="panel"><h2>${type==='mapas'?'Mapas mentais':'Revisão estratégica'}</h2><p class="muted">Organize os conceitos e pratique a recuperação ativa.</p></div>${modules.map((m,j)=>`<div class="panel ethics-lesson"><h3>${m.t}</h3>${trackMap(m)}<button class="btn alt" onclick="trackPractice(${k},${j})">Revisar com questões</button></div>`).join('')}`;
 if(type==='simulado')return back+`<div class="panel"><h2>Simulado temático — ${subjects[k]}</h2><p class="muted">${modules.length} questões autorais · ${modules.length*3} minutos · uma por módulo · correção ao final. Não equivale à prova oficial.</p><button class="btn gold" style="margin-top:15px" onclick="trackSim(${k})">Começar simulado</button></div>`;
 if(type==='flash'){const list=trackFlashQueue(k),q=list.find(q=>q.id===trackFlashId)||list[0];trackFlashId=q.id;const due=list.filter(q=>!state.reviews[q.id]||state.reviews[q.id].due<=Date.now()).length;return back+`<div class="panel question"><div class="label">FLASHCARDS · ${due} disponíveis para revisão</div><p class="muted">${q.topic}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div class="sessiontools"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="trackFlashMove(${k},false)">Revisar em 10 min</button><button class="btn gold" onclick="trackFlashMove(${k},true)">Já sei</button>`:`<button class="btn alt" onclick="trackFlashNext(${k})">Próximo cartão</button>`}</div></div>`}
 return back;
}
function render(){const attempts=state.attempts,correct=attempts.filter(x=>x.correct).length,errors=qs.filter(q=>last()[q.id]?.correct===false);let b='';if(view==='Diagnóstico'){b=`<div class="panel"><span class="tileicon gold">${ico('Diagnóstico')}</span><h3 style="margin-top:14px">Descubra seu ponto de partida</h3><p class="muted" style="margin:8px 0 16px">Faça o diagnóstico demonstrativo para conhecer o fluxo. São quatro questões de exemplo, não uma avaliação representativa do exame.</p><button class="btn" onclick="start(sampleQuestions,'Diagnóstico')">Começar diagnóstico →</button></div>`}else if(view==='Meu desempenho'){b=`<p class="muted">Acompanhe o seu histórico de treino neste navegador.</p><div class="grid"><div class="tile"><div class="label">Respostas registradas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros pendentes</div><div class="metric">${errors.length}</div></div></div><div class="panel"><h3>Desempenho por disciplina</h3><p class="muted">Somente questões respondidas são consideradas.</p>${subjects.map((s,i)=>{const a=attempts.filter(x=>qs.some(q=>q.id===x.id&&q.s===i));const p=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0;return '<div class="listline"><div class="smallrow"><strong>'+s+'</strong><span class="muted">'+(a.length?p+'%':'Sem dados')+'</span></div>'+(a.length?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}).join('')}</div>`}else if(view==='Provas anteriores'){b=`<div class="panel empty"><span class="tileicon">${ico(view)}</span><h3>Biblioteca de provas anteriores</h3><p class="muted">A estrutura está pronta para receber cadernos, gabaritos e filtros por edição. O acervo será incluído na etapa de conteúdo.</p><p><a class="link" href="https://oab.fgv.br/" target="_blank" rel="noopener noreferrer">Consultar portal oficial do exame ↗</a></p></div>`}else if(view==='Configurações'){b=`<div class="panel"><h3>${state.profileReady?'Preferências de estudo':'Vamos configurar sua preparação'}</h3><p class="muted" style="margin:8px 0 18px">Informe o tempo diário e a data da prova. Os dados ficam neste navegador.</p>${profileForm()}<div class="settingsrow"><strong>Meta de treinamento sugerida</strong><strong>45/80</strong></div><div class="settingsrow"><div><strong>Conta e sincronização</strong><div class="muted">Autenticação ainda não integrada.</div></div><span class="badge-mini">Em preparação</span></div></div>`}else if(view==='Ajuda'){b=`<div class="panel"><h3>Como usar o Rota 40</h3><div class="listline"><strong>1. Comece pelo diagnóstico</strong><p class="muted">Conheça o fluxo de questões e respostas.</p></div><div class="listline"><strong>2. Abra Minha rota</strong><p class="muted">Defina o tempo que tem disponível e veja as prioridades.</p></div><div class="listline"><strong>3. Revise e acompanhe</strong><p class="muted">Use o caderno de erros e o painel de desempenho.</p></div><div class="notice">Prévia não comercial. As informações ficam apenas neste navegador. Não há conta, cobrança ou mentor IA ativo.</div><button class="btn alt" onclick="go('Diagnóstico')">Começar diagnóstico</button></div>`}else if(view.startsWith('Etica:')){b=ethicsScreen()}else if(view.startsWith('Trilha:')){b=trackScreen(trackIndex())}else if(view.startsWith('Disciplina:')&&studyTracks[Number(view.split(':')[1])]){b=trackPage(Number(view.split(':')[1]))}else if(view.startsWith('Disciplina:')){const i=Number(view.split(':')[1]),n=qs.filter(q=>q.s===i).length;b=`<button class="breadcrumb" onclick="go('Disciplinas')">${ico('Página inicial')} Todas as disciplinas</button><div class="panel"><div class="tilehead"><span class="tileicon gold">${ico('Disciplinas')}</span><div><h3>${subjects[i]}</h3><p class="muted">Trilha de preparação · primeira fase</p></div></div></div><h3 class="sectiontitle">Materiais e ferramentas</h3><div class="grid two">${['Teoria resumida','Legislação comentada','Mapas mentais','Questões comentadas','Flashcards','Revisão da disciplina'].map(m=>`<div class="tile"><div class="tilehead"><span class="tileicon">${ico(m==='Questões comentadas'?'Questões':m==='Flashcards'?'Flashcards':'Disciplinas')}</span><div class="tilecopy"><strong>${m}</strong><div class="muted">${m==='Questões comentadas'&&n?n+' questão demonstrativa':'Conteúdo em preparação'}</div></div></div>${m==='Questões comentadas'&&n?`<button class="btn alt" onclick="train(${i})">Praticar →</button>`:''}</div>`).join('')}</div>`}else if(view==='Painel'){b=`<p class="muted">Comece pelo diagnóstico e siga sua próxima missão.</p>${state.session?`<div class="panel" style="margin:15px 0"><h3>Treino em andamento</h3><p class="muted">${state.session.title} · questão ${Math.min(state.session.pos+1,state.session.ids.length)} de ${state.session.ids.length}</p><button class="btn" style="margin-top:10px" onclick="resumeSession()">Continuar treino →</button></div>`:""}<div class="panel mission"><div class="eyebrow" style="color:#dec38c">Sua missão</div><h2>${attempts.length?'Continue sua rota':'Descubra seu ponto de partida'}</h2><p>${attempts.length?'Priorize as questões ainda não dominadas.':'Responda às quatro questões de demonstração.'}</p><button class="btn gold" onclick="${attempts.length?"go('Minha rota')":"go('Diagnóstico')"}">${attempts.length?'Iniciar revisão':'Iniciar diagnóstico'} →</button></div><div class="grid"><div class="tile"><div class="label">Questões respondidas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros para revisar</div><div class="metric">${errors.length}</div></div></div><h3 class="sectiontitle">Estudo e prática</h3><div class="grid two">${['Disciplinas','Questões','Simulados','Provas anteriores'].map(m=>actionTile(m)).join('')}</div><h3 class="sectiontitle">Revisão e acompanhamento</h3><div class="grid two">${['Caderno de erros','Flashcards','Meu desempenho','Mentor IA'].map(m=>actionTile(m)).join('')}</div>`}else if(view==='Minha rota'){const d=daysLeft(),plan=routePlan();b=`<div class="panel mission"><div class="eyebrow" style="color:#dec38c">${d!==null&&d>=0&&d<=14?'Reta final':'Sua preparação diária'}</div><h2>${state.minutes} minutos para avançar</h2><p>${d===null?'Defina a data da prova nas configurações.':d<0?'Atualize a data da prova.':d===0?'Hoje é a data de prova informada.':d+' dias até a data informada.'} Rota baseada em regras e no banco disponível; cobertura parcial das matérias da OAB.</p><button class="btn gold" onclick="start(routePlan(),'Minha rota')">Começar missão →</button></div><div class="panel"><div class="smallrow"><h3>Prioridades de hoje</h3><button class="btn alt" onclick="go('Configurações')">Ajustar perfil</button></div>${plan.map(q=>`<div class="listline"><div class="smallrow"><strong>${subjects[q.s]}</strong><span class="muted">${last()[q.id]?.correct===false?'Refazer erro':!last()[q.id]?'Praticar':'Consolidar'}</span></div></div>`).join('')}<p class="muted" style="margin-top:14px">A incidência histórica das provas será integrada após curadoria do acervo.</p></div>`}else if(view==='Disciplinas'){b=`<p class="muted">Escolha uma das 20 matérias para explorar sua trilha. ${Object.keys(studyTracks).length} disciplinas já têm módulos de estudo. As demais estão em preparação.</p><label class="searchbox">${ico('search')}<input aria-label="Buscar disciplina" placeholder="Buscar disciplina..." oninput="filterSubjects(this.value)"></label><div class="catalog" id="catalog">${subjects.map((s,i)=>`<button class="tile action" data-subject="${i}" onclick="go('Disciplina:${i}')"><div class="tilehead"><span class="tileicon">${ico('Disciplinas')}</span><div class="tilecopy"><strong>${s}</strong><div class="muted">${studyTracks[i]?studyTracks[i].modules.length+' módulos disponíveis':'Em preparação'}</div></div><span class="arrow">${ico('arrow')}</span></div></button>`).join('')}</div><p class="muted hidden" id="noSubjects">Nenhuma disciplina encontrada.</p>`}else if(view==='Questões'){b=`<div class="panel"><h3>Banco de questões — amostra</h3><p>${qs.length} exercícios autorais com fundamentação legal. Conteúdo inicial disponível nas trilhas de ${Object.keys(studyTracks).map(i=>subjects[Number(i)]).join(', ')}.</p><div class="filterrow"><select id="questionSubject" aria-label="Filtrar matéria"><option value="">Todas as matérias</option>${subjects.map((s,i)=>`<option value="${i}" ${qs.some(q=>q.s===i)?"":"disabled"}>${s}</option>`).join("")}</select><button class="btn" onclick="trainSelected()">Iniciar treino</button></div></div>`}else if(view==='Simulados'){b=`<div class="panel"><h3>Mini-simulado demonstrativo</h3><p class="muted">4 questões · 12 minutos · gabarito ao final. Não representa a distribuição ou dificuldade de uma prova oficial de 80 questões.</p><button class="btn" style="margin-top:12px" onclick="start(sampleQuestions,'Simulados')">Começar mini-simulado</button></div>`}else if(view==='Caderno de erros'){b=`<div class="panel"><h3>${errors.length?'Seus pontos de revisão':'Nenhum erro pendente'}</h3>${errors.length?errors.map(q=>`<div class="listline"><strong>${subjects[q.s]}</strong><p>${q.q}</p></div>`).join(''):'<p class="muted">As questões que você errar aparecerão aqui.</p>'}<button class="btn" ${errors.length?'':'disabled'} style="margin-top:12px" onclick="start(qs.filter(q=>last()[q.id]?.correct===false),'Caderno de erros')">Refazer erros</button></div>`}else if(view==='Flashcards'){const q=qs[flash%qs.length];b=`<div class="panel question"><div class="label">Cartão ${flash%qs.length+1} de ${qs.length} · ${subjects[q.s]}</div><p class="muted">${state.reviews[q.id]?state.reviews[q.id].due<=Date.now()?"Revisão disponível":"Próxima revisão: "+new Date(state.reviews[q.id].due).toLocaleString("pt-BR"):"Ainda não revisado"}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="reviewCard(false)">Revisar em 10 min</button><button class="btn alt" onclick="reviewCard(true)">Já sei · agendar revisão</button>`:`<button class="btn alt" onclick="flash++;showBack=false;render()">Próximo cartão</button>`}</div></div>`}else{b=`<div class="panel"><h3>Mentor Jurídico IA</h3><p class="notice">Integração de IA ainda não configurada. Nenhuma resposta de IA será simulada como se fosse real.</p><p class="muted">A versão planejada consultará legislação oficial, explicará questões com fontes e sinalizará incertezas. Por enquanto, você pode consultar as explicações fundamentadas do banco demonstrativo.</p><button class="btn alt" style="margin-top:14px" onclick="go('Questões')">Acessar questões comentadas</button></div>`}layout(b)}routeFromHash();
</script></body></html>
