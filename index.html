obstáculo. Uma restrição de locomoção é diferente de uma recusa de acesso a dados próprios. Uma omissão de norma também não equivale necessariamente a um ato ilegal já praticado.","Somente depois de identificar o problema consulte as condições da medida. Competência, legitimidade e prazos podem alterar a resposta."],"example":"Uma pessoa quer conhecer informação pessoal em banco de caráter público. Outra está ilegalmente impedida de se deslocar. A semelhança do nome dos remédios não torna suas finalidades iguais.","trap":"Não escolha uma ação apenas porque seu nome é conhecido."},{"title":"2. Habeas corpus","ref":"CF, art. 5º, LXVIII; CPP, arts. 647 e seguintes","paragraphs":["O objeto central é a liberdade de locomoção. O habeas corpus serve para enfrentar ilegalidade ou abuso que provoque ou ameace provocar constrangimento a essa liberdade. Ele não substitui um pedido genérico de reparação patrimonial.","É útil distinguir a proteção preventiva, diante de ameaça concreta, da proteção liberatória, diante de restrição já existente. O raciocínio depende da situação narrada, não apenas de existir um processo penal.","Na prova, identifique quem sofre a ameaça e qual ato está sendo questionado. A análise da competência e das hipóteses específicas continua necessária."],"example":"Uma pessoa está submetida a uma restrição de locomoção que considera ilegal. O objeto do pedido aponta para habeas corpus, sem antecipar se os requisitos do caso estão preenchidos.","trap":"O habeas corpus protege locomoção, não todo direito fundamental indistintamente."},{"title":"3. Habeas data","ref":"CF, art. 5º, LXXII","paragraphs":["O habeas data protege o acesso a informações relativas à própria pessoa e a possibilidade de retificação, em registros governamentais ou de caráter público, conforme os requisitos legais.","A expressão dados pessoais é central: querer investigar a vida de um terceiro não é a mesma finalidade. Também não basta que qualquer informação esteja armazenada em um computador.","A legislação do instrumento exige atenção à demonstração da resistência ou omissão administrativa nos casos pertinentes. Assim, o remédio não é necessariamente a primeira providência antes de solicitar o dado ao responsável."],"example":"Uma pessoa descobre que cadastro público contém informação incorreta sobre ela e solicita correção. Diante da resistência, deve investigar os requisitos do habeas data.","trap":"Não confunda acesso a dados próprios com acesso genérico a informações de interesse coletivo."},{"title":"4. Mandado de segurança e mandado de injunção","ref":"CF, art. 5º, LXIX a LXXI","paragraphs":["O mandado de segurança protege direito líquido e certo diante de ilegalidade ou abuso de autoridade, quando não houver amparo pelos instrumentos de locomoção ou dados pessoais. A demonstração dos fatos deve ser compatível com a prova pré-constituída exigida pelo procedimento.","O mandado de injunção enfrenta a falta de norma regulamentadora que inviabiliza o exercício de direitos e prerrogativas constitucionais contemplados pelo instrumento. O problema central é a omissão normativa que impede o exercício.","Diferencie o ato ilegal da falta de regulamentação. Não basta a existência de uma omissão administrativa qualquer para concluir que se trata de injunção."],"example":"Uma autoridade recusa ilegalmente uma pretensão demonstrável por documentos; outro caso envolve impossibilidade de exercer uma prerrogativa constitucional por ausência de regulamentação. Os instrumentos devem ser analisados separadamente.","trap":"Direito líquido e certo não significa que o tema jurídico precisa ser simples."},{"title":"5. Ação popular e síntese","ref":"CF, art. 5º, LXXIII","paragraphs":["A ação popular é instrumento de participação do cidadão no controle de atos lesivos a bens e valores constitucionalmente protegidos, como patrimônio público, moralidade administrativa, meio ambiente e patrimônio histórico-cultural.","A legitimidade do cidadão é um elemento característico. Não se deve trocar automaticamente essa figura por qualquer pessoa jurídica ou pelos legitimados de outras ações coletivas.","A Constituição protege o autor contra custas e ônus de sucumbência nas condições nela previstas, ressalvada má-fé comprovada. Para memorizar o conjunto, associe locomoção, dados próprios, direito líquido e certo, omissão normativa e patrimônio coletivo aos respectivos instrumentos."],"example":"Um cidadão questiona um ato que considera lesivo ao patrimônio público. A finalidade sugere ação popular, observados os requisitos específicos.","trap":"Ação popular não é sinônimo de ação civil pública."}],"checks":[["Qual instrumento protege a liberdade de locomoção?","Habeas corpus."],["Habeas data permite obter quaisquer dados de terceiros?","Não. Sua finalidade central envolve informações relativas à própria pessoa."],["Qual instrumento exige direito líquido e certo não amparado por HC ou HD?","Mandado de segurança, atendidos os demais requisitos."],["Qual remédio enfrenta omissão normativa impeditiva?","Mandado de injunção, nas hipóteses constitucionais."],["Quem possui legitimidade característica para ação popular?","O cidadão, nos termos da Constituição e da legislação."]],"schedule":[["Leitura guiada",12],["Consultar a fonte legal",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Pessoas naturais, capacidade e personalidade":{"intro":"Um bebê pode ser herdeiro, mas não pode sozinho assinar um contrato. Essa diferença simples explica por que personalidade, capacidade de direito e capacidade de exercício são conceitos distintos. A aula mostra como reconhecer essas posições e proteger os atributos da pessoa.","objectives":["Diferenciar personalidade e capacidade de exercício.","Identificar representação, assistência e emancipação.","Compreender a proteção do nascituro.","Reconhecer os direitos da personalidade."],"sections":[{"title":"1. Personalidade e titularidade","ref":"CC, arts. 1º e 2º","paragraphs":["Personalidade civil é a aptidão de ocupar a posição de pessoa nas relações jurídicas. Ela não depende de riqueza, instrução ou capacidade de entender um negócio. O recém-nascido já pode ocupar posições jurídicas.","O Código Civil relaciona o início da personalidade ao nascimento com vida e protege os direitos do nascituro desde a concepção. Essa proteção não deve ser confundida com a capacidade de praticar atos pessoalmente.","Na prova, separe o momento de aquisição de personalidade das condições de exercício de direitos. Confundir essas duas ideias costuma levar a respostas que excluem indevidamente crianças de relações patrimoniais."],"example":"Uma criança recebe um bem por herança. Isso não significa que possa administrá-lo livremente sem representação ou sem as autorizações necessárias.","trap":"Não confunda ser titular de um direito com poder exercê-lo pessoalmente."},{"title":"2. Capacidade de exercício e proteção","ref":"CC, arts. 3º e 4º","paragraphs":["A capacidade de exercício diz respeito à prática pessoal de atos civis. A lei oferece proteção a quem não reúne determinadas condições para atuar sozinho. Para resolver questões, consulte a categoria legal correspondente e não faça conclusões por estereótipos.","Em matéria etária, a lei diferencia os menores de dezesseis anos dos adolescentes entre dezesseis e dezoito anos. A primeira categoria é de incapacidade absoluta; a segunda, relativa, salvo a incidência de emancipação.","Outras hipóteses de incapacidade relativa possuem requisitos próprios. A existência de deficiência, por si só, não autoriza presumir incapacidade civil. Examine o regime jurídico e a situação individual."],"example":"Dois irmãos, de quinze e dezessete anos, desejam realizar negócio jurídico. A idade indica regimes protetivos distintos, que devem ser examinados junto das regras do ato concreto.","trap":"Deficiência não equivale automaticamente a incapacidade."},{"title":"3. Representação e assistência","ref":"CC, arts. 3º, 4º e 166 a 171","paragraphs":["Na representação, outra pessoa atua juridicamente em nome do representado. Na assistência, a participação do assistente complementa a atuação do relativamente incapaz. São formas de proteção, e não eliminação da titularidade de direitos.","Quando um negócio é praticado sem a proteção exigida, é necessário examinar as consequências jurídicas previstas para aquele caso. Nulidade e anulabilidade são categorias diferentes e devem ser estudadas com seus respectivos requisitos.","Identifique quem manifestou vontade, em nome de quem, e qual autorização era exigida. Não conclua que toda irregularidade tem sempre a mesma consequência."],"example":"Um adolescente relativamente incapaz celebra negócio sem a assistência requerida. Antes de determinar a consequência, consulte o regime da anulabilidade e as circunstâncias legais.","trap":"Representação e assistência não são sinônimos."},{"title":"4. Emancipação e capacidade antecipada","ref":"CC, art. 5º","paragraphs":["A maioridade civil ocorre aos dezoito anos. A emancipação antecipa a capacidade civil nas hipóteses legais; ela não muda a idade cronológica da pessoa.","Há modalidades com requisitos diferentes, inclusive hipóteses previstas diretamente pela lei. Uma questão pode mencionar casamento, atividade econômica ou concessão dos pais. Leia a condição específica em vez de presumir que qualquer atividade profissional emancipa.","A capacidade civil antecipada não transforma automaticamente o menor em adulto para todos os outros regimes jurídicos. Requisitos eleitorais, penais e administrativos precisam ser analisados separadamente."],"example":"Uma pessoa emancipada aos dezesseis anos passa a ter capacidade civil conforme o instituto, mas não altera por isso a idade mínima definida para outras situações.","trap":"Emancipação não antecipa indistintamente toda maioridade jurídica."},{"title":"5. Direitos da personalidade","ref":"CC, arts. 11 a 21","paragraphs":["Os direitos da personalidade protegem atributos essenciais da pessoa, como nome, imagem, honra e integridade. Não se limitam a interesses econômicos. Uma ameaça pode justificar providências preventivas, além de eventual reparação por dano.","A utilização de imagem e nome deve ser examinada conforme a finalidade, o contexto e os direitos envolvidos. Nem toda publicação depende da mesma solução jurídica; liberdade de expressão e interesse público também entram na análise.","Em questões, identifique o atributo protegido, a conduta questionada, o eventual consentimento e o contexto. Evite tratar a proteção da personalidade como uma proibição absoluta de qualquer referência à pessoa."],"example":"Uma empresa usa a imagem de alguém em anúncio comercial sem autorização. O contexto publicitário é relevante para avaliar a proteção da imagem e as medidas cabíveis.","trap":"Não confunda proteção da personalidade com propriedade sobre todos os fatos de interesse público."}],"checks":[["Uma criança pode ser titular de patrimônio?","Sim. Titularidade não exige capacidade de exercício plena."],["Qual a diferença básica entre representação e assistência?","Uma envolve atuação em nome do representado; a outra complementa a manifestação do assistido."],["Deficiência presume incapacidade civil?","Não. Não se deve presumir incapacidade apenas por deficiência."],["Emancipação altera idade penal?","Não. A capacidade civil não modifica automaticamente outros regimes."],["Quais atributos são exemplos de direitos da personalidade?","Nome, imagem, honra e integridade, entre outros."]],"schedule":[["Leitura guiada",12],["Consultar a fonte legal",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Nacionalidade e direitos políticos":{"intro":"Ter nacionalidade brasileira, poder votar e poder disputar uma eleição são situações jurídicas diferentes. Uma pessoa pode possuir uma delas sem reunir as condições para outra. Vamos separar esses conceitos e aprender a reconhecer os requisitos de cada situação.","objectives":["Distinguir nacionalidade originária e adquirida.","Reconhecer as diferenças constitucionais entre nato e naturalizado.","Classificar alistamento e voto.","Identificar condições de elegibilidade e inelegibilidades."],"sections":[{"title":"1. Nacionalidade: vínculo com o Estado","ref":"CF, art. 12","paragraphs":["Nacionalidade é o vínculo jurídico-político entre uma pessoa e determinado Estado. Não se confunde com residência: alguém pode viver fora do Brasil e manter a nacionalidade brasileira, assim como um estrangeiro pode residir aqui sem adquiri-la.","Para reconhecer a nacionalidade originária, analise local de nascimento, nacionalidade dos pais e eventual serviço prestado a outro Estado. Quando o nascimento ocorreu no exterior, identifique a hipótese constitucional pertinente, inclusive registro em repartição competente ou residência e opção, conforme o caso."],"example":"Uma criança nasce fora do país e é filha de brasileira. O fato de ter nascido no exterior não basta para excluir a nacionalidade originária. É necessário verificar qual hipótese do art. 12 se aplica.","trap":"Não conclua pela nacionalidade usando somente o endereço de residência."},{"title":"2. Naturalização, cargos e perda","ref":"CF, art. 12, §§ 2º a 4º; EC 131/2023","paragraphs":["A naturalização permite adquirir a nacionalidade nas condições jurídicas aplicáveis. Compare a situação de quem já é brasileiro nato com a de quem passa a ser brasileiro por procedimento de naturalização.","A Constituição delimita as diferenças entre essas categorias. Alguns cargos são reservados aos natos, inclusive Presidência e Vice-Presidência da República e o cargo de ministro do STF. Quanto à perda da nacionalidade, consulte a redação atual: adquirir outra nacionalidade não produz automaticamente a perda da brasileira."],"example":"Um brasileiro naturalizado deseja ocupar cargo público. A pergunta correta é se aquele cargo está entre as exceções constitucionais, e não se todos os cargos públicos seriam vedados.","trap":"Não utilize regras anteriores à EC 131/2023 como se ainda estivessem integralmente em vigor."},{"title":"3. Alistamento e voto","ref":"CF, art. 14, §§ 1º e 2º","paragraphs":["Alistamento eleitoral é a inscrição que permite exercer direitos eleitorais nas condições previstas. O voto é o ato de participar da escolha política. A possibilidade de se alistar precisa ser distinguida da obrigatoriedade de votar.","Organize as pessoas em três grupos: voto obrigatório, voto facultativo e impossibilidade de alistamento. Idade, alfabetização e condição de estrangeiro ou conscrito podem mudar o enquadramento. Consulte cada faixa etária e suas exceções no texto constitucional."],"example":"Uma estudante de dezessete anos pode exercer o voto facultativo se estiver regularmente alistada. Isso não significa que ela possa disputar qualquer cargo eletivo.","trap":"Voto facultativo não significa proibição de votar."},{"title":"4. Elegibilidade e idade mínima","ref":"CF, art. 14, §§ 3º e 4º","paragraphs":["Elegibilidade é a aptidão jurídica para concorrer a mandato eletivo. Além da nacionalidade e do pleno exercício dos direitos políticos, a Constituição exige condições relacionadas ao alistamento, domicílio, filiação e idade.","As idades mínimas variam por cargo. Compare o cargo pretendido com o requisito correspondente: vereador exige dezoito anos; cargos como senador e presidente exigem trinta e cinco. Observe as regras eleitorais sobre o momento de aferição.","O analfabeto pode votar facultativamente, mas é inelegível. Essa distinção revela que capacidade eleitoral ativa e passiva não são equivalentes."],"example":"Um eleitor de dezenove anos deseja disputar o Senado. Seu direito de votar não satisfaz o requisito etário para essa candidatura.","trap":"Não transfira a idade mínima de um cargo para outro."},{"title":"5. Reeleição e restrições eleitorais","ref":"CF, arts. 14 a 17","paragraphs":["Ao analisar reeleição, identifique se o caso envolve chefia do Executivo ou mandato legislativo. A limitação constitucional de um período subsequente refere-se aos titulares do Executivo e a quem os tenha sucedido ou substituído nos termos constitucionais.","As inelegibilidades podem decorrer de situações familiares, funcionais ou de outras hipóteses legais. O local de exercício do mandato e a natureza da candidatura podem ser relevantes. Leia a hipótese integralmente antes de aplicar uma proibição.","Perda e suspensão de direitos políticos também possuem tratamento próprio. Não confunda esses efeitos com perda de nacionalidade. Os partidos políticos integram a organização democrática e possuem disciplina constitucional específica."],"example":"Um familiar de titular do Executivo pretende candidatar-se na mesma circunscrição. Não se deve decidir apenas pelo parentesco: examine as condições e exceções da regra constitucional.","trap":"Uma restrição eleitoral não equivale automaticamente à perda da cidadania."}],"checks":[["Residência no Brasil basta para nacionalidade?","Não. O vínculo depende das hipóteses constitucionais e legais."],["Naturalizado pode exercer qualquer cargo sem exceção?","Não. Há cargos constitucionalmente reservados a natos."],["Adquirir outra nacionalidade implica perda automática da brasileira?","Não, conforme a disciplina atual."],["Analfabeto pode votar e ser eleito?","Pode votar facultativamente, mas é inelegível."],["Direito de votar e de concorrer são idênticos?","Não. A elegibilidade possui requisitos próprios."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Federação e repartição de competências":{"intro":"Quem pode criar uma lei sobre determinado assunto? Quem deve prestar um serviço público? Na federação, essas perguntas não têm sempre a mesma resposta. A Constituição distribui poderes para evitar que uma única esfera decida tudo.","objectives":["Separar soberania e autonomia.","Distinguir competência legislativa e administrativa.","Entender a lógica das normas gerais e suplementares.","Reconhecer atribuições municipais e hipóteses de intervenção."],"sections":[{"title":"1. O que significa viver em uma federação?","ref":"CF, arts. 18 e 19","paragraphs":["Uma federação é uma forma de organização em que diferentes entes possuem espaços próprios de atuação. União, Estados, Distrito Federal e Municípios não são simples departamentos uns dos outros: exercem autonomia nos limites constitucionais.","Autonomia permite organizar instituições e exercer competências próprias. Soberania pertence ao Estado brasileiro como um todo. Nenhum ente federativo pode tratar sua autonomia como autorização para se desligar unilateralmente da federação."],"example":"Um município organiza seus serviços e orçamento dentro das competências legais. Isso não o transforma em Estado soberano perante a comunidade internacional.","trap":"União é um ente federativo; República Federativa do Brasil designa o Estado soberano."},{"title":"2. Competência para agir e para legislar","ref":"CF, arts. 21 a 24","paragraphs":["Competência legislativa é a autorização para produzir normas sobre determinada matéria. Competência material ou administrativa é a atribuição de executar atividades e políticas públicas. Um ente pode participar da execução de uma política sem poder legislar livremente sobre todas as suas regras.","Quando o enunciado usa verbos como prestar, fiscalizar ou proteger, investigue atribuições administrativas. Quando fala em editar lei ou definir normas, concentre-se na distribuição legislativa. O verbo é uma pista, não uma resposta automática."],"example":"A proteção de um bem ambiental pode envolver atuação de vários entes. Isso não significa que cada um possua competência ilimitada para estabelecer qualquer regra sobre o assunto.","trap":"Competência comum não é sinônimo de competência concorrente."},{"title":"3. Competência privativa da União","ref":"CF, art. 22","paragraphs":["O art. 22 reserva à União a legislação de determinadas matérias. Ao estudar um problema, identifique o objeto real da norma. Uma lei estadual pode parecer administrativa, mas interferir em uma disciplina cuja legislação é reservada à União.","A competência privativa não é absolutamente indelegável: existe hipótese constitucional de autorização aos Estados por lei complementar federal, referente a questões específicas. Esse instrumento não equivale a uma transferência geral de toda a matéria."],"example":"Um Estado deseja disciplinar questão específica de matéria privativa da União. Verifique se existe a autorização constitucionalmente exigida e se a norma permanece dentro dos limites autorizados.","trap":"Não confunda lei complementar autorizadora com simples acordo administrativo."},{"title":"4. Competência concorrente","ref":"CF, art. 24","paragraphs":["Na competência concorrente, a legislação funciona em camadas. A União estabelece normas gerais e os Estados exercem competência suplementar. Na ausência de norma geral federal, a Constituição admite competência legislativa plena dos Estados para atender suas peculiaridades.","Se uma norma geral federal surge depois, a análise deve verificar incompatibilidade. A eficácia da lei estadual fica suspensa naquilo que contrariar a norma federal, sem que isso signifique revogação integral automática.","O Distrito Federal também participa da competência concorrente. Municípios possuem competência de suplementação em seu regime próprio, não figurando da mesma forma no rol do art. 24."],"example":"Um Estado edita norma na ausência de regra geral federal. Depois surge norma geral incompatível. Identifique quais disposições estaduais entram em conflito e quais podem permanecer eficazes.","trap":"Superveniência federal não significa necessariamente revogação de toda a lei estadual."},{"title":"5. Interesse local, Distrito Federal e intervenção","ref":"CF, arts. 30, 32 e 34 a 36","paragraphs":["Municípios podem legislar sobre interesse local e suplementar normas federais e estaduais quando cabível. Interesse local não significa que nenhuma outra esfera tenha relação com o tema: examine a predominância do interesse e os limites normativos.","O Distrito Federal acumula competências legislativas reservadas a Estados e Municípios, com as particularidades constitucionais. Não se divide em municípios.","A intervenção é uma medida excepcional que restringe autonomia nas hipóteses previstas na Constituição. Não é instrumento de gestão cotidiana nem solução automática para qualquer desacordo político entre entes."],"example":"Uma norma municipal disciplina aspecto local de funcionamento de serviços. O problema é determinar se a regulamentação permanece dentro do interesse local e respeita as demais competências.","trap":"A divergência entre governos não autoriza por si só intervenção."}],"checks":[["Município é soberano?","Não. Possui autonomia constitucional."],["Competência comum é necessariamente legislativa?","Não. Está ligada a atribuições materiais."],["Como os Estados podem legislar sobre questão privativa da União?","Mediante autorização por lei complementar federal para questões específicas, nos termos constitucionais."],["Lei federal superveniente revoga toda lei estadual concorrente?","Não. Suspende sua eficácia no ponto incompatível."],["Distrito Federal pode ser dividido em municípios?","Não."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Administração pública constitucional":{"intro":"Quando alguém ingressa no serviço público, solicita informação ou sofre dano causado por agente estatal, existem regras constitucionais que limitam e orientam a atuação administrativa. Nesta aula, você aprenderá a identificar o princípio ou instituto correspondente a cada situação.","objectives":["Aplicar os princípios constitucionais da administração.","Distinguir concurso, cargo efetivo e cargo em comissão.","Compreender requisitos básicos da estabilidade.","Identificar responsabilidade estatal e ação regressiva."],"sections":[{"title":"1. Princípios como critérios de decisão","ref":"CF, art. 37, caput","paragraphs":["A administração existe para atender finalidades públicas. A legalidade limita a atuação do agente; a impessoalidade exige que a decisão não seja direcionada a favorecer pessoas por interesse particular. Moralidade relaciona-se aos padrões jurídicos de integridade administrativa.","Publicidade permite controle e transparência, sem eliminar hipóteses legítimas de sigilo. Eficiência orienta o uso adequado dos recursos e a qualidade da atuação. Esses princípios não se anulam uns aos outros: uma medida rápida continua obrigada a respeitar a legalidade."],"example":"Uma autoridade escolhe um fornecedor por amizade, ignorando critérios aplicáveis. O problema não é apenas o resultado financeiro, mas a utilização de critérios pessoais na decisão pública.","trap":"Eficiência não autoriza descumprir a lei."},{"title":"2. Publicidade e impessoalidade","ref":"CF, art. 37, § 1º; art. 5º, XXXIII","paragraphs":["A publicidade institucional deve servir à informação, orientação ou educação, e não à promoção pessoal de agentes públicos. Examine a finalidade, o conteúdo e o contexto do material divulgado.","A transparência também não significa publicar indiscriminadamente dados protegidos. Informações pessoais, sigilos legais e outros limites exigem análise própria. Em questões, identifique se a restrição tem fundamento jurídico, não apenas conveniência da autoridade."],"example":"Uma campanha pública informa horários de vacinação. Outra usa recursos públicos com destaque promocional à figura de determinada autoridade. Compare a finalidade institucional das duas campanhas.","trap":"Publicidade administrativa não é propaganda pessoal irrestrita."},{"title":"3. Concurso e formas de ingresso","ref":"CF, art. 37, II e V","paragraphs":["Concurso público é a regra para investidura em cargo ou emprego público. A seleção deve observar o regime jurídico aplicável. Não confunda classificação no concurso com nomeação, posse ou exercício: são momentos diferentes.","Cargos em comissão têm finalidade constitucional específica ligada a direção, chefia e assessoramento. Sua livre nomeação não permite transformar qualquer atividade permanente em cargo de confiança.","Funções de confiança possuem regime próprio e são exercidas por servidores ocupantes de cargo efetivo. A diferença entre função e cargo aparece frequentemente em enunciados."],"example":"Uma administração pretende preencher funções técnicas rotineiras exclusivamente por nomeação de confiança. A análise deve confrontar as atribuições reais com os limites constitucionais.","trap":"Não presuma que todo cargo público exige concurso nem que toda atividade comporta livre nomeação."},{"title":"4. Estabilidade não é aprovação","ref":"CF, art. 41","paragraphs":["Estabilidade protege a continuidade do vínculo nas condições constitucionais. Ela não surge simplesmente quando alguém passa no concurso. O art. 41 exige nomeação para cargo efetivo em virtude de concurso, período de exercício e avaliação especial de desempenho.","A estabilidade não significa impossibilidade de perder o cargo. Existem hipóteses e procedimentos constitucionais que devem ser respeitados. Observe qual fundamento é apresentado e quais garantias processuais são aplicáveis.","Diferencie o vínculo de servidor efetivo de outros regimes, como empregado público. Não transporte mecanicamente todas as garantias de um vínculo para outro."],"example":"Uma pessoa é aprovada no concurso, mas ainda não iniciou exercício. Ela não se tornou estável apenas pela divulgação do resultado.","trap":"Estabilidade não é sinônimo de vitaliciedade ou imunidade disciplinar."},{"title":"5. Responsabilidade do Estado","ref":"CF, art. 37, § 6º","paragraphs":["Quando um agente, nessa qualidade, causa dano a terceiro, a análise começa pela identificação da entidade responsável, da conduta, do dano e do nexo causal. A regra constitucional contempla pessoas jurídicas públicas e privadas prestadoras de serviço público.","A relação entre vítima e entidade não deve ser confundida com a relação interna entre entidade e agente. Na ação regressiva constitucional, a apuração de dolo ou culpa do responsável é relevante.","Em casos de omissão, fatos de terceiros ou causas que rompam o nexo, a solução exige atenção às circunstâncias e à jurisprudência aplicável. Não transforme o regime objetivo em indenização automática por todo prejuízo."],"example":"Um veículo de serviço público causa dano durante atividade funcional. Separe a eventual obrigação de indenizar da análise posterior de responsabilidade pessoal do agente.","trap":"Responsabilidade objetiva não elimina a necessidade de demonstrar nexo causal."}],"checks":[["Qual princípio combate favorecimento pessoal?","Impessoalidade."],["Publicidade exclui todo sigilo?","Não. Existem limitações juridicamente justificadas."],["Cargo em comissão é destinado a qualquer atividade?","Não. Deve respeitar as finalidades constitucionais."],["Aprovação no concurso concede estabilidade imediatamente?","Não. Existem requisitos adicionais no art. 41."],["Regresso contra agente dispensa dolo ou culpa?","Não, conforme o art. 37, § 6º."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Poder Legislativo e processo legislativo":{"intro":"Uma proposta política só se transforma em norma quando percorre o procedimento adequado. Para compreender o Legislativo, vamos distinguir as funções das Casas, os instrumentos de fiscalização e os caminhos que cada espécie normativa segue.","objectives":["Reconhecer Câmara, Senado e Congresso.","Identificar limites de uma CPI.","Distinguir lei ordinária, complementar e emenda.","Compreender o procedimento legislativo e as medidas provisórias."],"sections":[{"title":"1. Duas Casas, funções diferentes","ref":"CF, arts. 44 a 49","paragraphs":["O Congresso Nacional possui duas Casas. A Câmara dos Deputados está ligada à representação popular e o Senado Federal à representação dos Estados e do Distrito Federal. Essa diferença ajuda a entender por que determinadas atribuições pertencem a uma Casa específica.","Não trate qualquer decisão do Legislativo como ato conjunto do Congresso. Existem competências de cada Casa e atribuições do Congresso considerado como instituição. Localize o sujeito constitucional antes de analisar o ato."],"example":"Uma questão pergunta quem exerce determinada competência privativa do Senado. A resposta não pode ser genericamente Congresso se o texto atribui a decisão àquela Casa.","trap":"Câmara e Senado não são denominações intercambiáveis."},{"title":"2. Fiscalização e comissões parlamentares de inquérito","ref":"CF, arts. 58 e 70 a 71","paragraphs":["Fiscalizar é uma função central do Legislativo. As CPIs permitem investigação parlamentar de fato determinado por prazo certo, observadas as condições constitucionais de criação.","Embora possuam poderes investigatórios importantes, não se confundem com órgão jurisdicional. Determinadas medidas estão reservadas ao juiz, e o exercício dos poderes de investigação respeita direitos fundamentais.","Uma investigação parlamentar pode produzir informações e encaminhamentos às autoridades competentes. Não significa automaticamente julgamento penal ou condenação de uma pessoa."],"example":"Uma CPI investiga irregularidades em contratos públicos. Ela pode apurar fatos nos limites legais, mas não assume por isso toda a competência de um juiz criminal.","trap":"Poderes de investigação não equivalem a todos os poderes jurisdicionais."},{"title":"3. Espécies normativas e quórum","ref":"CF, arts. 59, 60 e 69","paragraphs":["As espécies normativas seguem procedimentos próprios. Lei ordinária, lei complementar e emenda constitucional não são meros nomes diferentes para um mesmo ato.","A lei complementar exige maioria absoluta, isto é, mais da metade do total de integrantes da Casa. Para lei ordinária, observe a regra geral de deliberação e o quórum de presença constitucional. Emendas possuem procedimento agravado específico.","A escolha da espécie depende também da matéria reservada constitucionalmente. Não basta atingir um quórum elevado para tornar correto um procedimento incompatível com a espécie exigida."],"example":"Um projeto de lei complementar recebe votos suficientes segundo a maioria dos presentes, mas não alcança maioria absoluta dos membros. O requisito próprio não foi preenchido.","trap":"Maioria absoluta não significa maioria dos presentes."},{"title":"4. Da iniciativa à publicação","ref":"CF, arts. 61 a 67","paragraphs":["Iniciativa é a apresentação da proposta por quem possui competência para fazê-lo. Algumas matérias têm iniciativa reservada. Identificar o autor autorizado é tão importante quanto verificar a votação.","Na tramitação de projetos de lei, podem existir deliberação na Casa iniciadora e revisão pela outra Casa. Alterações e rejeições seguem regras próprias. A etapa de sanção ou veto não se aplica igualmente a todas as espécies.","Promulgação e publicação são conceitos diferentes: a primeira relaciona-se à formalização da existência da norma; a segunda à sua divulgação oficial. A entrada em vigor pode ocorrer em momento diverso."],"example":"Um projeto de lei trata de matéria reservada a determinado iniciador, mas foi apresentado por agente sem essa competência. A votação posterior não deve ser examinada isoladamente.","trap":"Emenda constitucional não depende de sanção presidencial."},{"title":"5. Medida provisória e limites","ref":"CF, art. 62","paragraphs":["Medida provisória é instrumento excepcional do Presidente, associado à relevância e urgência. Produz efeitos normativos antes da conclusão do processo de conversão legislativa, o que explica a necessidade de controle pelo Congresso.","O texto constitucional estabelece prazo geral de sessenta dias, com uma prorrogação por igual período nas condições previstas. A contagem, a tramitação e as consequências da rejeição ou perda de eficácia exigem leitura do regime integral.","Existem matérias vedadas, como direito penal e processual penal. A alegação de urgência não elimina a vedação material. Em matéria tributária existem regras particulares que também precisam ser examinadas."],"example":"O Executivo considera urgente criar uma nova regra penal por medida provisória. A urgência não afasta a vedação constitucional dessa matéria.","trap":"Não confunda medida provisória com lei definitivamente aprovada."}],"checks":[["Quem representa Estados e DF no Congresso?","O Senado Federal."],["CPI pode exercer toda função judicial?","Não. Seus poderes investigatórios possuem limites."],["Qual quórum caracteriza lei complementar?","Maioria absoluta."],["Emenda passa por sanção?","Não."],["Urgência permite medida provisória em matéria penal?","Não, há vedação constitucional."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Executivo e responsabilidade constitucional":{"intro":"Uma mesma autoridade pode desempenhar tarefas de representação do país, direção administrativa e execução de políticas. Entender quem ocupa o cargo, quem pode substituí-lo e como responde por seus atos evita confusões nas questões sobre o Executivo.","objectives":["Distinguir chefia de Estado e de governo.","Reconhecer competências presidenciais e delegação.","Separar substituição de sucessão.","Compreender dupla vacância e regimes de responsabilização."],"sections":[{"title":"1. Presidencialismo e funções","ref":"CF, arts. 76 a 79","paragraphs":["No presidencialismo brasileiro, o Presidente exerce a chefia de Estado e de governo. A primeira está ligada à representação institucional do país; a segunda à direção política e administrativa do Executivo.","Ministros de Estado auxiliam no exercício das funções executivas. Não devem ser confundidos com titulares de mandato presidencial. A atuação de cada agente decorre da competência constitucional e legal correspondente.","O Vice-Presidente possui papel próprio, inclusive substituição e sucessão. Não é automaticamente corresponsável por todo ato praticado pelo Presidente apenas por integrar a chapa."],"example":"A representação diplomática do país e a coordenação de políticas federais podem envolver o Presidente em funções de natureza distinta.","trap":"Chefia de Estado e chefia de governo são funções diferentes, embora reunidas no mesmo cargo."},{"title":"2. Competências e delegação","ref":"CF, arts. 84 e 87","paragraphs":["A competência identifica quais atos uma autoridade está autorizada a praticar. O art. 84 enumera atribuições presidenciais. Para resolver uma questão, localize a atribuição específica e observe se depende de participação de outro órgão.","A possibilidade de delegar não decorre apenas da conveniência administrativa. O texto constitucional especifica quais atribuições presidenciais podem ser delegadas e a quem. Delegar uma competência não significa transferir a titularidade do cargo.","Atos normativos do Executivo também possuem limites. Regulamentar a execução de uma lei e produzir norma primária em hipótese constitucional própria não são a mesma operação."],"example":"Um ministro pretende exercer atribuição presidencial. Antes de aceitar a validade do ato, verifique a hipótese de delegação e os limites efetivamente estabelecidos.","trap":"Nem toda atribuição presidencial é delegável."},{"title":"3. Impedimento, vaga e ordem de exercício","ref":"CF, arts. 79 e 80","paragraphs":["Substituição é o exercício temporário do cargo durante impedimento do titular. Sucessão ocorre quando o cargo fica vago e o Vice assume na condição prevista na Constituição.","Na impossibilidade de exercício por Presidente e Vice, há uma ordem constitucional de chamamento. Os presidentes da Câmara, do Senado e do STF exercem o cargo nas condições constitucionais, o que não os transforma automaticamente em sucessores definitivos.","Leia com cuidado os termos impedimento, ausência e vacância. A solução varia conforme a natureza do fato e a disponibilidade do Vice."],"example":"Se o Presidente estiver temporariamente impedido, o Vice pode substituí-lo. Se houver vaga definitiva, o instituto aplicável é a sucessão.","trap":"Não trate impedimento temporário como vacância definitiva."},{"title":"4. Dupla vacância e eleição","ref":"CF, art. 81","paragraphs":["Quando ficam vagos simultaneamente os cargos de Presidente e Vice, a Constituição prevê eleição. O mecanismo depende do momento do mandato em que ocorre a última vaga.","Nos dois primeiros anos, a regra constitucional prevê eleição em noventa dias; nos dois últimos, eleição pelo Congresso em trinta dias. A situação é diferente da substituição temporária enquanto se organiza a solução definitiva.","Os eleitos completam o período de seus antecessores. Não presuma o início de um mandato integral novo apenas porque houve eleição para preencher a dupla vacância."],"example":"Ocorre dupla vacância no terceiro ano do mandato. A resposta precisa considerar a regra dos dois últimos anos e o papel do Congresso.","trap":"A ordem de substitutos do art. 80 não elimina a eleição prevista no art. 81."},{"title":"5. Infrações comuns e crimes de responsabilidade","ref":"CF, arts. 85 e 86","paragraphs":["Infrações penais comuns e crimes de responsabilidade são categorias distintas. Os segundos dizem respeito à responsabilidade político-jurídica nas hipóteses constitucionalmente previstas e disciplinadas em lei.","A Constituição exige autorização de dois terços da Câmara para a instauração do processo contra o Presidente nas condições do art. 86. O julgamento por infração penal comum cabe ao STF e por crime de responsabilidade ao Senado, conforme o regime constitucional.","Autorização não é condenação. Distinga a fase de admissibilidade, a eventual suspensão do exercício e a decisão final. Os efeitos e garantias dependem da natureza do procedimento."],"example":"Um enunciado afirma que a Câmara condenou definitivamente o Presidente por crime de responsabilidade ao autorizar o processo. A autorização não substitui o julgamento competente.","trap":"Não atribua automaticamente ao mesmo órgão todas as fases de responsabilização."}],"checks":[["Quem exerce chefia de Estado e de governo no presidencialismo brasileiro?","O Presidente da República."],["Toda atribuição presidencial é delegável?","Não. Observe as hipóteses constitucionais."],["Impedimento temporário gera sucessão definitiva?","Não. Em regra, gera substituição."],["Quem realiza a eleição na dupla vacância nos dois últimos anos?","O Congresso Nacional, nos termos do art. 81."],["Autorização da Câmara equivale à condenação?","Não. São fases distintas."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Judiciário e funções essenciais à justiça":{"intro":"O acesso à Justiça depende de instituições com funções diferentes. Julgar, defender, representar o Estado e fiscalizar a ordem jurídica não são a mesma atividade. Esta aula ensina a distinguir os órgãos e identificar o caminho constitucional de cada questão.","objectives":["Diferenciar competências do STF e STJ.","Reconhecer garantias da magistratura.","Identificar o papel do CNJ.","Distinguir Ministério Público, advocacias e Defensoria."],"sections":[{"title":"1. Organização e competência judicial","ref":"CF, arts. 92 a 126","paragraphs":["O Judiciário é organizado em órgãos com competências definidas. Competência significa o conjunto de causas e atos que determinado órgão pode apreciar. A existência de uma questão jurídica importante não autoriza qualquer tribunal a julgá-la diretamente.","As diferentes Justiças e tribunais possuem atribuições conforme matéria, pessoa, território e regras processuais aplicáveis. Para identificar o órgão, comece pelo tipo de controvérsia e pelas características relevantes.","Em recursos, considere o objeto impugnado e os requisitos do instrumento. Não presuma que toda insatisfação com uma decisão permite acessar automaticamente um tribunal superior."],"example":"Uma controvérsia trabalhista e uma demanda criminal comum podem seguir caminhos judiciais distintos. Identifique a matéria antes de escolher o órgão.","trap":"Tribunal superior não é uma instância universal para toda causa."},{"title":"2. STF e STJ","ref":"CF, arts. 102 e 105","paragraphs":["O STF exerce a guarda da Constituição. O STJ atua, entre outras atribuições, na uniformização da interpretação do direito federal infraconstitucional. A diferença de objeto ajuda a identificar a lógica dos recursos extraordinário e especial.","Não basta citar uma norma constitucional ou federal para tornar um recurso cabível. É preciso observar as hipóteses previstas, os requisitos processuais e o conteúdo efetivamente discutido.","Ambos também possuem competências originárias. Por isso, uma pergunta sobre competência pode exigir análise da pessoa ou do tipo de ação, não apenas da hierarquia normativa."],"example":"Uma decisão discute interpretação de uma lei federal. Isso sugere investigar a competência do STJ, mas não garante que o recurso especial seja admissível.","trap":"Não confunda o papel institucional com a admissibilidade de um recurso específico."},{"title":"3. Garantias da magistratura","ref":"CF, art. 95","paragraphs":["Vitaliciedade, inamovibilidade e irredutibilidade de subsídio protegem a independência funcional da magistratura. São garantias institucionais com condições e exceções próprias, não privilégios que eliminam responsabilidade.","A vitaliciedade segue requisitos constitucionais e regime distinto da estabilidade do servidor público. Inamovibilidade protege contra movimentações incompatíveis com a independência, observadas hipóteses constitucionais de interesse público.","As garantias precisam ser lidas junto das vedações aplicáveis ao cargo. A independência judicial não torna legítima qualquer atividade paralela nem impede controle disciplinar nos limites legais."],"example":"Um magistrado é submetido a procedimento disciplinar. A existência de garantias funcionais não elimina a possibilidade de responsabilização mediante o procedimento cabível.","trap":"Não confunda independência com ausência de controle."},{"title":"4. Conselho Nacional de Justiça","ref":"CF, art. 103-B","paragraphs":["O CNJ integra a estrutura constitucional do Judiciário. Sua atuação envolve aspectos administrativos, financeiros e disciplinares, dentro das competências previstas no texto constitucional.","Ele não funciona como tribunal recursal genérico para modificar decisões judiciais por discordância da parte. Revisão jurisdicional e controle administrativo são atividades diferentes.","Quando uma questão descreve conduta administrativa ou disciplinar, investigue as atribuições do Conselho. Quando se refere ao conteúdo de uma decisão judicial, analise a via processual própria."],"example":"Uma parte não concorda com a interpretação adotada numa sentença e pretende recorrer ao CNJ apenas para reformá-la. Essa finalidade não corresponde ao papel recursal do Conselho.","trap":"Controle administrativo não equivale a substituição da atividade jurisdicional."},{"title":"5. Funções essenciais à Justiça","ref":"CF, arts. 127 a 135","paragraphs":["O Ministério Público atua na defesa da ordem jurídica, do regime democrático e de interesses sociais e individuais indisponíveis. Não se confunde com órgão julgador nem com advogado particular de todas as partes.","A advocacia pública exerce representação e consultoria jurídica nos regimes próprios dos entes públicos. A advocacia privada desempenha função indispensável à administração da Justiça, nos limites constitucionais e legais.","A Defensoria Pública proporciona orientação jurídica e defesa dos necessitados, conforme sua disciplina constitucional. As instituições podem atuar no mesmo processo sem desempenhar funções iguais."],"example":"Uma pessoa sem recursos necessita de orientação e defesa jurídica. A finalidade indica a atuação da Defensoria, conforme os requisitos aplicáveis, e não necessariamente do Ministério Público.","trap":"Não confunda representação judicial do Estado com defesa jurídica individual de necessitados."}],"checks":[["Qual tribunal guarda a Constituição?","O STF."],["Qual tribunal tem função relevante na uniformização do direito federal infraconstitucional?","O STJ."],["Vitaliciedade elimina responsabilidade disciplinar?","Não."],["CNJ é recurso genérico contra sentença?","Não. Suas competências são constitucionalmente delimitadas."],["Qual instituição presta orientação jurídica aos necessitados?","A Defensoria Pública, nos termos constitucionais."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Controle de constitucionalidade":{"intro":"Imagine uma lei que entre em conflito com a Constituição. O sistema jurídico precisa de mecanismos para examinar essa incompatibilidade. O controle de constitucionalidade permite identificar o parâmetro, a norma questionada e a via adequada de análise.","objectives":["Distinguir controle difuso e concentrado.","Reconhecer objeto e finalidade de ADI, ADC, ADO e ADPF.","Identificar legitimidade e efeitos em linhas gerais.","Aplicar a reserva de plenário sem generalizações."],"sections":[{"title":"1. Parâmetro e objeto do controle","ref":"CF, arts. 97, 102 e 103","paragraphs":["A Constituição funciona como parâmetro superior para o exame de validade de normas infraconstitucionais. O objeto do controle é a norma ou ato questionado; o parâmetro é a regra ou princípio constitucional que serve à comparação.","Uma incompatibilidade pode ser relacionada ao conteúdo da norma ou ao modo como foi produzida. Essa distinção ajuda a separar problemas materiais de problemas formais, como competência e procedimento.","Não confunda conflito entre duas leis de mesmo nível com inconstitucionalidade. Pode existir problema de interpretação, vigência ou legalidade que exige outro tipo de análise."],"example":"Uma lei foi aprovada por órgão sem competência constitucional para legislar sobre aquela matéria. O problema pode ser formal, mesmo que o conteúdo pareça adequado.","trap":"Nem toda ilegalidade é, automaticamente, inconstitucionalidade."},{"title":"2. Controle difuso: questão concreta","ref":"CF, arts. 97 e 102","paragraphs":["No controle difuso, a discussão constitucional aparece associada à resolução de um caso concreto. A validade da norma pode ser uma questão necessária para decidir a controvérsia entre as partes.","Juízes e tribunais podem examinar questões constitucionais nas condições de suas competências. Nos tribunais, observe especialmente a reserva de plenário. Não suponha que o juiz singular esteja submetido à mesma regra de deliberação colegiada.","Os efeitos dependem da decisão, do procedimento e das regras de precedentes aplicáveis. A descrição introdutória do controle difuso não substitui a análise dos mecanismos que podem ampliar a relevância de uma decisão."],"example":"Uma pessoa questiona cobrança baseada em lei que considera incompatível com a Constituição. A discussão constitucional surge como fundamento de seu pedido concreto.","trap":"Controle difuso não se limita ao STF."},{"title":"3. Controle concentrado: ações próprias","ref":"CF, arts. 102 e 103","paragraphs":["No controle concentrado federal, ações específicas examinam questões constitucionais conforme objeto, competência e legitimidade determinados. A ADI perante o STF pode examinar lei ou ato normativo federal ou estadual; a ADC possui objeto federal.","A ADO enfrenta omissão inconstitucional nas condições do regime próprio. A ADPF possui disciplina específica, inclusive subsidiariedade, e não deve ser utilizada como instrumento genérico para substituir qualquer ação disponível.","Antes de escolher a ação, responda: existe norma ou omissão? Qual é a origem do ato? Qual parâmetro constitucional está sendo empregado? A ação indicada admite aquele objeto?"],"example":"Uma questão apresenta lei estadual posterior à Constituição como objeto de ADC perante o STF. O problema está no objeto admitido para essa ação.","trap":"ADI e ADC não possuem objeto idêntico."},{"title":"4. Legitimidade e efeitos","ref":"CF, arts. 102, § 2º, e 103","paragraphs":["As ações abstratas não podem ser propostas por qualquer pessoa apenas porque discorda de uma lei. O art. 103 estabelece legitimados para as ações pertinentes. Para alguns legitimados, a jurisprudência exige relação temática entre a atuação institucional e a matéria.","Decisões definitivas de mérito em ADI e ADC possuem regime constitucional de eficácia geral e efeito vinculante. A extensão dos efeitos e eventuais modulações devem ser examinadas conforme a ação e a legislação pertinente.","Diferencie legitimidade para propor a ação de eventual participação no processo por outra modalidade. Também não confunda decisão cautelar com pronunciamento definitivo de mérito."],"example":"Um cidadão individual pretende propor ADI diretamente no STF. Sua discordância da norma não o inclui, por si só, no rol constitucional de legitimados.","trap":"Não transporte automaticamente a legitimidade da ação popular para a ADI."},{"title":"5. Reserva de plenário e Súmula Vinculante 10","ref":"CF, art. 97; SV 10; CPC, art. 949","paragraphs":["A reserva de plenário exige quórum qualificado dentro dos tribunais para a declaração de inconstitucionalidade: maioria absoluta dos membros ou do órgão especial. A finalidade é evitar que uma fração do tribunal invalide uma norma sem observar a estrutura constitucional.","A Súmula Vinculante 10 alcança também situações em que órgão fracionário afasta a aplicação de uma norma por incompatibilidade constitucional sem declarar expressamente sua inconstitucionalidade.","É necessário distinguir afastamento por fundamento constitucional de simples interpretação ou inaplicabilidade da norma por outra razão. Observe também as hipóteses de dispensa de nova submissão ao plenário previstas no procedimento legal."],"example":"Uma turma afasta uma lei porque a considera incompatível com a Constituição, embora não utilize a palavra inconstitucionalidade. A análise deve considerar a reserva de plenário e o regime de precedentes aplicável.","trap":"A regra colegiada não se aplica indiscriminadamente a decisões de juiz singular."}],"checks":[["O que é parâmetro do controle?","A norma constitucional usada como referência."],["Controle difuso só existe no STF?","Não."],["ADC federal pode ter lei estadual como objeto?","Não. Seu objeto é federal."],["Qual ação se relaciona à omissão inconstitucional?","ADO, nas hipóteses próprias."],["Afastar norma por fundamento constitucional sem usar a palavra inconstitucionalidade evita a reserva?","Não necessariamente; a SV 10 trata precisamente dessa situação."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Pessoas jurídicas, bens e domicílio":{"intro":"Uma empresa compra equipamentos, uma associação recebe doações e uma pessoa muda de residência. Em cada situação o Direito Civil precisa identificar quem é titular de direitos, quais bens estão envolvidos e onde a relação jurídica se localiza. Aprenda a separar essas três perguntas.","objectives":["Distinguir pessoa natural e jurídica.","Compreender autonomia patrimonial e desconsideração.","Classificar domicílios e bens.","Identificar o regime básico dos bens públicos."],"sections":[{"title":"1. A pessoa jurídica nasce como sujeito próprio","ref":"CC, arts. 40 a 46","paragraphs":["Uma pessoa jurídica é uma organização reconhecida pelo ordenamento como titular de direitos e obrigações. Pode contratar, adquirir patrimônio e assumir dívidas em nome próprio. Não é simplesmente o conjunto de pessoas físicas que participa dela.","Para entidades privadas, em regra, a existência legal começa com o registro do ato constitutivo no registro competente, observadas autorizações exigidas. Associações, sociedades e fundações têm finalidades e formas distintas. Em uma questão, identifique o tipo de entidade e o ato que constitui sua personalidade."],"example":"Um grupo constitui uma associação e providencia o registro. A associação pode assumir obrigações próprias, distintas das obrigações pessoais dos associados.","trap":"Não confunda a reunião informal de pessoas com personalidade jurídica regularmente constituída."},{"title":"2. Autonomia patrimonial e desconsideração","ref":"CC, arts. 49-A e 50","paragraphs":["O patrimônio da entidade não se confunde automaticamente com o dos sócios ou administradores. Essa separação permite identificar quem assumiu o risco, quem deve pagar e quais bens respondem pela obrigação.","A desconsideração permite estender efeitos de obrigações determinadas quando preenchidos os requisitos do regime aplicável. No art. 50, examine o abuso de personalidade, caracterizado por desvio de finalidade ou confusão patrimonial, e os beneficiados pelo abuso. Outros regimes, como o consumerista, possuem pressupostos próprios."],"example":"Um administrador utiliza repetidamente o caixa da sociedade para pagar despesas particulares sem separação contábil. Esse fato merece exame sob o conceito de confusão patrimonial.","trap":"Mero inadimplemento não basta, isoladamente, no regime do art. 50."},{"title":"3. Domicílio: localização jurídica","ref":"CC, arts. 70 a 78","paragraphs":["Domicílio é uma referência jurídica para localizar uma pessoa. No caso da pessoa natural, a regra geral combina residência e intenção de permanência. Mais de uma residência alternada pode gerar mais de um domicílio.","Domicílio profissional relaciona-se ao exercício da profissão nas relações correspondentes. Domicílio necessário decorre de determinação legal, e o contratual depende da eleição válida pelas partes. Não confunda domicílio civil com todas as regras processuais de competência."],"example":"Uma profissional trabalha em duas cidades. Ao analisar obrigação ligada à sua atividade, examine a regra de domicílio profissional e a relação concreta.","trap":"Residência, domicílio e foro competente não são conceitos necessariamente idênticos."},{"title":"4. Classificação dos bens","ref":"CC, arts. 79 a 97","paragraphs":["Os bens podem ser classificados segundo características relevantes para circulação e proteção jurídica. Imóveis e móveis possuem regimes diferentes. Fungibilidade considera se a coisa pode ser substituída por outra da mesma espécie, qualidade e quantidade.","Consumibilidade está ligada à destruição pelo uso ou à destinação à alienação, conforme a lei. Divisibilidade considera a possibilidade de fracionamento sem alteração relevante. Um objeto pode reunir várias classificações simultaneamente, porque cada uma responde a uma pergunta distinta."],"example":"Cem quilos de arroz padronizado podem ser substituídos por outros equivalentes. Uma obra artística individualizada, por outro lado, normalmente não é intercambiável da mesma maneira.","trap":"Fungível não é sinônimo de consumível."},{"title":"5. Bens públicos e particulares","ref":"CC, arts. 98 a 103","paragraphs":["A classificação entre bens públicos e particulares depende da titularidade definida em lei. Dentro dos públicos, existem categorias relacionadas ao uso comum, uso especial e patrimônio dominical.","A destinação do bem influencia sua possibilidade de alienação. Os bens públicos não se adquirem por usucapião. Isso não significa que toda utilização privada seja impossível: existem instrumentos jurídicos próprios de uso ou transferência nas hipóteses permitidas."],"example":"Uma pessoa utiliza durante muitos anos uma área comprovadamente pública. O decurso do tempo, por si, não permite adquirir o domínio por usucapião.","trap":"Não trate bem dominical como bem particular simplesmente por não estar afetado ao uso comum."}],"checks":[["A dívida da sociedade é sempre dívida do sócio?","Não; examine a autonomia patrimonial e eventuais hipóteses legais de responsabilização."],["Qual abuso caracteriza a desconsideração no art. 50?","Desvio de finalidade ou confusão patrimonial, observados os demais requisitos."],["É possível ter mais de um domicílio?","Sim, nas hipóteses legais."],["O que significa fungibilidade?","Possibilidade de substituição por coisa equivalente da mesma espécie, qualidade e quantidade."],["Bem público pode ser adquirido por usucapião?","Não."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Negócio jurídico, defeitos e invalidade":{"intro":"Quando duas pessoas celebram um contrato, o Direito examina mais do que a assinatura. A vontade deve se manifestar adequadamente, o objeto precisa ser permitido e certas formalidades devem ser respeitadas. Nesta aula vamos identificar a estrutura do negócio e os efeitos de seus defeitos.","objectives":["Reconhecer os requisitos de validade.","Distinguir vícios da vontade e fraude contra credores.","Separar nulidade e anulabilidade.","Entender condições, termos e efeitos."],"sections":[{"title":"1. Existência, validade e eficácia","ref":"CC, arts. 104 a 109","paragraphs":["Um negócio jurídico é uma manifestação de vontade destinada a produzir efeitos reconhecidos pelo ordenamento. Didaticamente, podemos separar sua formação, sua validade e sua produção de efeitos. Um ato existente pode apresentar um defeito que comprometa sua validade.","O art. 104 exige agente capaz, objeto lícito, possível e determinado ou determinável, além da forma prescrita ou não proibida. Em questões, analise cada requisito separadamente. A forma livre é regra, mas existem atos sujeitos a solenidade específica."],"example":"Uma compra e venda imobiliária pode exigir escritura pública conforme seu valor e as exceções legais. Além da forma do contrato, a transferência do domínio exige análise própria.","trap":"Contrato existente não é necessariamente válido ou eficaz."},{"title":"2. Condição, termo e encargo","ref":"CC, arts. 121 a 137","paragraphs":["As partes podem estruturar efeitos do negócio mediante elementos acessórios. Condição vincula efeitos a acontecimento futuro e incerto. Termo se relaciona a acontecimento futuro e certo, embora sua data possa não ser conhecida.","Encargo atribui uma obrigação ou finalidade ao beneficiário, frequentemente em liberalidades. Cada modalidade possui regras próprias. Para classificar, pergunte se o evento é incerto, se apenas delimita o momento de efeitos ou se impõe uma obrigação ao beneficiário."],"example":"Uma pessoa promete doar um bem caso o beneficiário seja aprovado em determinado concurso. A aprovação futura e incerta ilustra uma condição.","trap":"Não confunda evento certo em data desconhecida com evento de ocorrência incerta."},{"title":"3. Erro, dolo e coação","ref":"CC, arts. 138 a 155","paragraphs":["Erro é uma percepção equivocada relevante para a manifestação de vontade. Nem todo engano compromete o negócio. Verifique sua substancialidade e os requisitos legais. Erro de cálculo, por exemplo, admite retificação.","Dolo envolve indução enganosa e pode produzir consequências diferentes conforme sua importância para a celebração. Coação envolve pressão juridicamente relevante que compromete a liberdade de decisão. Não basta chamar qualquer desconforto de ameaça invalidante."],"example":"Uma parte fornece informação deliberadamente falsa que leva a outra a contratar. A questão deve investigar se o engano foi determinante e quais consequências a lei prevê.","trap":"Dolo acidental e dolo determinante não têm automaticamente os mesmos efeitos."},{"title":"4. Estado de perigo, lesão e fraude","ref":"CC, arts. 156 a 165","paragraphs":["Estado de perigo envolve obrigação excessivamente onerosa assumida para evitar grave dano, conhecido pela outra parte, nas condições legais. Lesão envolve desproporção manifesta associada à necessidade premente ou inexperiência, conforme o art. 157.","Fraude contra credores tem foco distinto: a proteção da garantia patrimonial diante de atos prejudiciais aos credores. Considere insolvência, natureza do negócio e requisitos de impugnação. Não confunda esse instituto com fraude à execução, de regime processual."],"example":"Uma pessoa vende bens em situação que prejudica credores preexistentes. A análise não depende apenas do preço: examine insolvência e os requisitos do tipo de alienação.","trap":"Lesão não é toda negociação economicamente desfavorável."},{"title":"5. Nulidade e anulabilidade","ref":"CC, arts. 166 a 184","paragraphs":["A nulidade envolve defeitos graves previstos em lei, incluindo simulação. O negócio nulo não se confirma nem se torna válido pelo simples decurso do tempo. Isso não significa que toda pretensão patrimonial decorrente dele seja imprescritível.","A anulabilidade envolve hipóteses como incapacidade relativa e determinados vícios. O negócio pode ser confirmado nos limites legais e sua impugnação está sujeita aos prazos aplicáveis. Leia a hipótese específica antes de escolher a consequência."],"example":"Duas partes criam um negócio aparente para ocultar outro. Identifique a simulação e investigue também se o negócio dissimulado pode subsistir quando válido na substância e na forma.","trap":"Não use nulidade e anulabilidade como sinônimos."}],"checks":[["Quais são os requisitos básicos do art. 104?","Agente capaz, objeto lícito e possível, determinado ou determinável, e forma juridicamente admitida."],["Condição depende de evento futuro certo?","Não. Depende de evento futuro incerto."],["Erro de cálculo sempre anula o negócio?","Não; admite retificação."],["Simulação caracteriza nulidade ou anulabilidade?","Nulidade."],["Negócio anulável pode ser confirmado?","Sim, respeitados os requisitos legais e direitos de terceiros."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Obrigações, pagamento e inadimplemento":{"intro":"Uma obrigação liga credor e devedor por uma prestação. O credor pode esperar a entrega de um bem, um serviço ou uma abstenção. Entender o conteúdo dessa prestação ajuda a resolver questões sobre pagamento, atraso, solidariedade e reparação.","objectives":["Classificar as prestações.","Distinguir solidariedade de indivisibilidade.","Identificar formas de extinção.","Separar mora, inadimplemento e consequências patrimoniais."],"sections":[{"title":"1. A estrutura de uma obrigação","ref":"CC, arts. 233 a 251","paragraphs":["A obrigação envolve sujeitos e uma prestação. O credor ocupa a posição de exigir a prestação e o devedor deve realizá-la nos termos jurídicos. Dar, fazer e não fazer correspondem a diferentes objetos.","Obrigação de dar envolve entrega ou restituição de coisa; obrigação de fazer envolve atividade; obrigação de não fazer exige abstenção. A consequência do descumprimento depende da natureza da prestação e de circunstâncias como culpa e possibilidade de cumprimento."],"example":"Uma pessoa contrata a pintura de uma casa. A prestação principal é uma atividade, diferente da simples entrega de material.","trap":"Não aplique automaticamente regras da perda de uma coisa a uma obrigação de fazer."},{"title":"2. Pluralidade de sujeitos e solidariedade","ref":"CC, arts. 257 a 285","paragraphs":["Indivisibilidade diz respeito à prestação que não admite divisão adequada. Solidariedade diz respeito à relação entre sujeitos, permitindo a exigência integral nas condições legais. São critérios distintos.","A solidariedade não se presume; resulta da lei ou da vontade das partes. Quando existe solidariedade passiva, a cobrança integral de um devedor pode gerar posteriormente relações de regresso entre os envolvidos. Identifique a relação externa com o credor e a interna entre devedores."],"example":"Dois devedores assumem expressamente uma obrigação solidária de pagar determinada quantia. A prestação é divisível, mas o credor pode exigir o todo de um deles nos termos legais.","trap":"Uma prestação divisível pode ser solidária."},{"title":"3. Pagamento regular e consignação","ref":"CC, arts. 304 a 345","paragraphs":["Adimplemento é a satisfação da prestação devida. Para analisar pagamento, examine quem paga, quem recebe, o objeto, o lugar e o tempo. Entregar coisa diferente não equivale automaticamente ao cumprimento correto.","Consignação oferece mecanismo de liberação do devedor em situações legais, como recusa injustificada do credor. A finalidade é evitar que o devedor fique indefinidamente vinculado quando deseja cumprir e encontra obstáculo juridicamente relevante."],"example":"Um credor recusa sem justificativa o recebimento da prestação devida. A consignação pode ser examinada como meio de cumprimento, observados seus requisitos.","trap":"Depositar qualquer valor unilateralmente não garante extinção da obrigação."},{"title":"4. Outras formas de extinção","ref":"CC, arts. 360 a 388","paragraphs":["Novação envolve substituição de obrigação por outra, com intenção de novar. Uma mera renegociação de prazo não representa necessariamente novação. É indispensável identificar o propósito jurídico da operação.","Compensação relaciona-se a dívidas recíprocas e possui requisitos específicos. Remissão corresponde ao perdão da dívida nos termos legais. Confusão ocorre quando posições de credor e devedor se reúnem na mesma pessoa. Não escolha o instituto apenas porque a dívida deixou de existir."],"example":"Duas pessoas são reciprocamente credoras e devedoras de valores exigíveis. Investigue a compensação antes de concluir pela extinção total.","trap":"Renegociação não implica automaticamente novação."},{"title":"5. Mora, inadimplemento e juros","ref":"CC, arts. 389 a 420; Lei 14.905/2024","paragraphs":["Mora é o descumprimento relativo de requisitos como tempo, lugar ou forma, observados os pressupostos. Quando a prestação se torna inútil ao credor por causa da mora, pode ser cabível rejeitá-la e exigir consequências do inadimplemento.","Perdas e danos, juros e atualização dependem do regime aplicável e dos fatos. A Lei 14.905/2024 modificou a disciplina civil da atualização monetária e dos juros legais. Consulte os arts. 389 e 406 atualizados, distinguindo taxa pactuada, taxa legal e regra especial."],"example":"Um serviço contratado para um evento é oferecido apenas depois de seu encerramento. A utilidade da prestação é decisiva para classificar a situação.","trap":"Não utilize automaticamente a antiga referência de juros de 1% ao mês."}],"checks":[["Solidariedade se presume?","Não; decorre da lei ou da vontade das partes."],["Indivisibilidade e solidariedade são iguais?","Não. Uma se relaciona à prestação, a outra aos sujeitos."],["Recusa injustificada do credor pode justificar consignação?","Sim, nas condições legais."],["Toda renegociação é novação?","Não. É preciso verificar a intenção de novar."],["O que diferencia atraso útil e inadimplemento que torna a prestação inútil?","A possibilidade de a prestação ainda satisfazer o interesse juridicamente protegido do credor."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Contratos: princípios e espécies":{"intro":"Comprar um imóvel, emprestar um livro ou contratar um serviço são operações do cotidiano, mas cada uma cria efeitos jurídicos específicos. Vamos aprender a identificar a espécie contratual, suas obrigações e os limites impostos à liberdade de contratar.","objectives":["Compreender autonomia, função social e boa-fé.","Identificar formação e reciprocidade contratual.","Distinguir resolução e revisão.","Reconhecer compra e venda, empréstimos e mandato."],"sections":[{"title":"1. Liberdade contratual e função social","ref":"CC, arts. 421 e 421-A","paragraphs":["O contrato permite organizar interesses mediante acordo. A liberdade contratual não é ilimitada: deve ser exercida dentro do regime jurídico e da função social. As regras sobre intervenção e revisão variam conforme a natureza da relação.","Em contratos civis e empresariais, a lei contempla presunção de paridade e simetria nas condições do art. 421-A, ressalvados elementos concretos e regimes especiais. Não transfira essa presunção automaticamente para relações submetidas a proteção específica."],"example":"Duas empresas negociam divisão de riscos de um projeto. Antes de afastar o acordo, examine a disciplina aplicável e os fatos que poderiam justificar intervenção.","trap":"Função social não é autorização para ignorar qualquer cláusula inconveniente."},{"title":"2. Boa-fé objetiva","ref":"CC, arts. 113 e 422","paragraphs":["Boa-fé objetiva é um padrão de comportamento leal. Não se limita à crença íntima da pessoa. Em contratos, pode envolver deveres de informação, cooperação e respeito à confiança legitimamente criada.","A interpretação de cláusulas considera o contexto e os parâmetros legais. Pergunte se a conduta de uma parte é compatível com a relação que ela própria estabeleceu. A conclusão deve respeitar os fatos e o regime jurídico, sem transformar toda mudança de posição em ilicitude."],"example":"Uma parte possui informação essencial ao cumprimento da prestação e a omite de forma prejudicial. Investigue os deveres de informação e cooperação.","trap":"Boa-fé objetiva e ausência de intenção maliciosa não são equivalentes."},{"title":"3. Reciprocidade e descumprimento","ref":"CC, arts. 475 a 477","paragraphs":["Em contratos bilaterais, as prestações possuem relação de reciprocidade. A exceção de contrato não cumprido permite, nos termos legais, resistir à exigência da contraprestação quando a outra parte não cumpriu sua obrigação.","Examine qual prestação deveria ocorrer primeiro, se o descumprimento é relevante e se existem condições pactuadas. A resolução por inadimplemento pode coexistir com pedido reparatório nas hipóteses legais. Não confunda desfazer o vínculo com exigir seu cumprimento."],"example":"Uma parte exige pagamento integral sem entregar a prestação que deveria ter realizado previamente. Analise a ordem de cumprimento e a exceção aplicável.","trap":"A simples existência de obrigações recíprocas não elimina a necessidade de examinar sua exigibilidade."},{"title":"4. Revisão e onerosidade excessiva","ref":"CC, arts. 478 a 480","paragraphs":["Revisão busca ajustar o conteúdo do contrato; resolução busca extinguir o vínculo por causa juridicamente relevante. O regime de onerosidade excessiva exige atenção à natureza do contrato, aos acontecimentos e à distribuição de riscos.","Não basta o negócio ter se tornado menos lucrativo. Verifique os requisitos legais, incluindo as condições do evento e a vantagem atribuída à outra parte nas hipóteses pertinentes. Regimes especiais podem adotar soluções diferentes."],"example":"Um acontecimento excepcional altera profundamente o custo de uma prestação futura. Em vez de presumir revisão automática, identifique o risco assumido e o regime aplicável.","trap":"Oscilação ordinária de mercado não comprova sozinha onerosidade excessiva."},{"title":"5. Espécies: compra, empréstimo e mandato","ref":"CC, arts. 481, 579, 586 e 653","paragraphs":["Compra e venda gera obrigação de transferir domínio mediante preço. Para imóveis, o contrato e o registro do título exercem funções distintas. Comodato é empréstimo gratuito de coisa não fungível; mútuo envolve coisas fungíveis e restituição por equivalência.","Mandato atribui poderes para agir em nome de outra pessoa. Examine os limites desses poderes e a eventual necessidade de forma específica. Nomear corretamente o contrato ajuda a identificar quem assume o risco, o objeto da restituição e os efeitos perante terceiros."],"example":"Emprestar gratuitamente um livro individualizado para devolução do mesmo exemplar ilustra comodato. Emprestar dinheiro para restituição de quantia equivalente ilustra mútuo.","trap":"Não confunda compra e venda com aquisição imediata do domínio imobiliário."}],"checks":[["Boa-fé objetiva depende somente da intenção interna?","Não. É padrão de conduta."],["A função social invalida toda cláusula desfavorável?","Não; exige análise jurídica concreta."],["Revisão e resolução têm a mesma finalidade?","Não. Uma ajusta o vínculo; a outra o extingue nas condições legais."],["Qual empréstimo envolve coisa não fungível e gratuidade?","Comodato."],["Assinar contrato imobiliário transfere sozinho a propriedade?","Não. Examine o registro do título."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Responsabilidade civil":{"intro":"Quando alguém sofre prejuízo, é natural perguntar quem deve repará-lo. O Direito Civil exige uma sequência de análise: qual foi a conduta, qual dano ocorreu, como estão relacionados e qual regime de responsabilidade se aplica. A aula ensina essa investigação sem presumir indenização automática.","objectives":["Identificar conduta, dano e nexo.","Separar responsabilidade subjetiva e objetiva.","Compreender responsabilidade por fato de terceiro.","Analisar indenização e excludentes."],"sections":[{"title":"1. Ato ilícito e abuso de direito","ref":"CC, arts. 186 a 188","paragraphs":["A responsabilidade civil pode surgir de violação de dever jurídico que cause dano. O art. 186 trata de conduta voluntária, negligência ou imprudência nas condições ali previstas. O dano pode envolver interesses patrimoniais ou extrapatrimoniais.","O abuso de direito ocorre quando seu exercício excede manifestamente limites jurídicos relacionados à finalidade, boa-fé ou bons costumes. Portanto, possuir um direito não autoriza qualquer forma de exercê-lo. O art. 188 também prevê situações que não constituem atos ilícitos."],"example":"Uma pessoa utiliza um direito formalmente reconhecido de maneira que excede seus limites jurídicos. Examine o abuso e o dano, em vez de considerar apenas a titularidade.","trap":"Exercício de direito não é sempre exercício regular de direito."},{"title":"2. Dano e nexo causal","ref":"CC, arts. 186 e 927","paragraphs":["Dano é a lesão juridicamente relevante que fundamenta a reparação. Nexo causal relaciona a conduta ao prejuízo. A existência de uma irregularidade não basta, por si, para imputar todo dano ocorrido na mesma época.","Organize a narrativa em sequência: o que ocorreu, qual foi a consequência e por que se atribui essa consequência à conduta. Fatos independentes, causas concorrentes e riscos específicos podem modificar a análise. A mera proximidade temporal não resolve a causalidade."],"example":"Um equipamento quebra depois de uma intervenção técnica. Para atribuir responsabilidade, investigue se a intervenção efetivamente contribuiu para o defeito e qual prejuízo resultou.","trap":"Sucessão temporal de acontecimentos não prova automaticamente nexo causal."},{"title":"3. Subjetiva e objetiva","ref":"CC, art. 927","paragraphs":["Na responsabilidade subjetiva, culpa ou dolo integra a análise de imputação. Na objetiva, a demonstração da culpa é dispensada em hipóteses previstas em lei ou vinculadas ao risco da atividade nas condições do parágrafo único do art. 927.","Objetividade não significa obrigação de indenizar sem qualquer pressuposto. Continue examinando dano, nexo e regime aplicável. Antes de decidir, identifique se existe norma especial, como uma disciplina consumerista, ou se o caso se submete ao regime civil geral."],"example":"Uma atividade normalmente desenvolvida envolve risco especial a terceiros. A investigação deve considerar se a hipótese se enquadra no regime objetivo, além do dano e do nexo.","trap":"Responsabilidade objetiva não é necessariamente responsabilidade integral."},{"title":"4. Responsabilidade por fato de outra pessoa","ref":"CC, arts. 932 a 934","paragraphs":["Em situações legalmente definidas, uma pessoa pode responder por danos causados por outra. Entre os exemplos estão empregadores por atos dos empregados no exercício do trabalho ou em razão dele.","O vínculo relevante deve ser demonstrado. Não basta que as duas pessoas se conheçam ou mantenham qualquer relação. A eventual ação regressiva segue regras próprias; separe a reparação perante a vítima da relação interna entre os responsáveis."],"example":"Um empregado causa dano enquanto executa atividade atribuída pelo empregador. Examine o vínculo com o trabalho e os demais pressupostos de responsabilidade.","trap":"Não atribua todo ato privado do empregado automaticamente ao empregador."},{"title":"5. Extensão da reparação e excludentes","ref":"CC, arts. 944 a 945; art. 393","paragraphs":["A indenização toma a extensão do dano como referência, observadas as exceções legais. A culpa concorrente da vítima pode influenciar a reparação. Diferencie prejuízo demonstrado de mera alegação e verifique a forma de quantificação.","Caso fortuito, força maior e fato exclusivo de terceiro podem afetar a responsabilidade conforme o nexo e o risco do regime aplicável. Não trate essas expressões como fórmulas automáticas de exclusão."],"example":"Uma colisão tem contribuição demonstrada de ambas as partes. Investigue a culpa concorrente e sua repercussão jurídica, sem presumir divisão igual em todos os casos.","trap":"Nem toda participação da vítima exclui integralmente a responsabilidade de terceiro."}],"checks":[["Qual a função do nexo causal?","Relacionar a conduta ao dano imputado."],["Abuso de direito pode ser ilícito?","Sim."],["Responsabilidade objetiva dispensa prova do dano?","Não."],["Empregador pode responder por ato de empregado ligado ao tr
