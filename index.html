],["Princípios constitucionais","Legalidade, impessoalidade, moralidade, publicidade e eficiência orientam os órgãos e entidades administrativas. A publicidade admite restrições juridicamente justificadas para proteger informações sigilosas. A impessoalidade afasta o uso de recursos públicos para promover pessoalmente autoridades."],["Proporcionalidade e segurança jurídica","A escolha administrativa precisa guardar relação com a finalidade da competência. Examine adequação, necessidade e equilíbrio da restrição. A proteção da confiança e da segurança jurídica deve ser considerada na revisão de atos, sem converter toda situação ilegal em direito adquirido."]],"map":["LIMPE → princípios constitucionais","Legalidade → competência e limites","Impessoalidade → finalidade pública","Proporcionalidade → medida necessária"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"t":"Organização administrativa e entidades","ref":"CF, art. 37, XIX; Decreto-Lei 200/1967","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del0200.htm","lessons":[["Administração direta e indireta","A direta compreende a atuação por órgãos integrantes dos entes políticos. A indireta é composta por entidades com personalidade própria, como autarquias, fundações públicas, empresas públicas e sociedades de economia mista. Órgão não se confunde com pessoa jurídica."],["Desconcentração e descentralização","Desconcentrar é distribuir competências internamente, entre órgãos da mesma pessoa jurídica. Descentralizar envolve atribuir atividade a outra pessoa, por técnica juridicamente adequada. A vinculação de entidade indireta a ministério ou secretaria não estabelece a mesma hierarquia que existe entre órgãos internos."],["Criação e regime","A lei específica cria autarquia e autoriza a instituição de empresa pública, sociedade de economia mista e fundação, conforme art. 37, XIX, observado o regime específico das fundações de direito público. Empresas estatais têm personalidade de direito privado e sujeitam-se a normas públicas pertinentes, inclusive ao regime da Lei 13.303/2016."]],"map":["Órgão → sem personalidade própria","Autarquia → criação por lei específica","Desconcentração → mesma pessoa","Descentralização → outra pessoa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Poderes administrativos e abuso de poder","ref":"Lei 9.784/1999, arts. 2º e 11 a 17; CTN, art. 78","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm","lessons":[["Vinculação e discricionariedade","O ato vinculado tem pressupostos e conteúdo delimitados pela norma. Na discricionariedade, há espaço legal de escolha, sem afastar controle de legalidade. A conveniência administrativa não legitima desvio de finalidade, discriminação ou violação da proporcionalidade."],["Hierarquia, disciplina e regulamentação","O poder hierárquico permite organização e coordenação interna nos limites legais. A competência é irrenunciável, com delegação e avocação nas hipóteses admitidas. O poder disciplinar apura e sanciona infrações ligadas à relação jurídica administrativa, garantindo defesa. A regulamentação não pode criar obrigações além de sua base normativa."],["Polícia e abuso","O poder de polícia limita atividades ou direitos individuais para proteger interesses coletivos conforme lei. Excesso de poder ocorre quando a autoridade ultrapassa sua competência; desvio de finalidade, quando usa competência para fim indevido. Nem todo ato de polícia é autoexecutório."]],"map":["Vinculado → limites definidos","Discricionário → escolha legal","Excesso → competência","Desvio → finalidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"t":"Atos administrativos e controle de validade","ref":"Lei 9.784/1999, arts. 50 e 53 a 55","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm","lessons":[["Elementos do ato","Competência, finalidade, forma, motivo e objeto são categorias clássicas de análise. Motivo corresponde aos pressupostos de fato e direito; motivação é a exposição das razões da decisão. Se o ato declara razões determinantes, sua validade pode depender da veracidade e pertinência dessas razões."],["Anulação e revogação","A anulação combate ilegalidade; a revogação retira ato válido por razões de conveniência e oportunidade, observadas limitações jurídicas. O Judiciário pode controlar a legalidade do ato administrativo quando provocado, mas não substituir livremente a escolha legítima de mérito feita pela administração."],["Convalidação e prazo","Defeitos sanáveis podem ser corrigidos pela administração quando não houver lesão ao interesse público nem prejuízo a terceiros. Na esfera federal, o prazo decadencial para anular atos favoráveis é, em regra, de cinco anos, salvo má-fé comprovada. Nem todo vício admite convalidação."]],"map":["Motivo ≠ motivação","Ilegal → anulação","Válido inconveniente → revogação","Vício sanável → possível convalidação"]},{"t":"Agentes públicos e servidores","ref":"CF, arts. 37 a 41; Lei 8.112/1990","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Ingresso e vínculos","Cargo efetivo, emprego público, cargo em comissão e contratação temporária têm regimes diferentes. O concurso é regra de ingresso em cargos e empregos, ressalvados cargos em comissão definidos em lei e outras hipóteses constitucionais. A contratação temporária atende necessidade temporária de excepcional interesse público nos termos legais."],["Estabilidade e acumulação","A estabilidade do art. 41 protege servidor nomeado para cargo efetivo por concurso após três anos de exercício e avaliação especial. A acumulação remunerada é excepcional e exige compatibilidade de horários, observadas as hipóteses constitucionais vigentes. Confira a redação atual do art. 37, XVI, especialmente após a EC 138/2025."],["Responsabilidade e processo disciplinar","Responsabilidades civil, penal e administrativa podem coexistir, com repercussões específicas entre as instâncias. O processo disciplinar deve garantir contraditório e ampla defesa. A Lei 8.112 rege servidores federais abrangidos por ela, não constitui automaticamente estatuto de todos os entes."]],"map":["Concurso → regra","Comissão → direção, chefia e assessoramento","Estabilidade → requisitos do art. 41","Disciplina → defesa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm"},{"t":"Licitações e contratações diretas","ref":"Lei 14.133/2021, arts. 17, 28, 33 e 72 a 75","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","lessons":[["Planejamento e fases","A contratação começa pela identificação da necessidade, planejamento e definição do objeto. A Lei 14.133 organiza fases como preparação, divulgação, propostas, julgamento, habilitação, recurso e homologação, admitindo alterações de ordem nos requisitos legais. Modalidade não se confunde com critério de julgamento."],["Modalidades e critérios","Pregão, concorrência, concurso, leilão e diálogo competitivo são as modalidades previstas no art. 28. O pregão é empregado para bens e serviços comuns conforme o regime legal. Os critérios de julgamento variam com o objeto, como menor preço, maior desconto e técnica e preço."],["Dispensa e inexigibilidade","A inexigibilidade decorre da inviabilidade de competição; a dispensa permite contratação direta nas hipóteses legais. Ambas exigem instrução apropriada, incluindo justificativas e verificação de requisitos. Valores-limite de dispensa sofrem atualização, portanto devem ser conferidos antes de uso."]],"map":["Modalidade ≠ critério","Pregão → bens e serviços comuns","Inexigibilidade → competição inviável","Dispensa → hipótese legal"]},{"t":"Contratos administrativos","ref":"Lei 14.133/2021, arts. 89 a 154","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","lessons":[["Formalização e prerrogativas","Contratos administrativos possuem cláusulas obrigatórias e regras de publicidade. A administração dispõe de prerrogativas como fiscalização e alterações unilaterais nas condições previstas em lei. Essas prerrogativas não permitem desrespeitar direitos do contratado ou alterar livremente qualquer cláusula."],["Equilíbrio econômico-financeiro","O equilíbrio protege a relação inicial entre encargos e remuneração. Reajuste, repactuação e restabelecimento do equilíbrio são instrumentos distintos, com pressupostos próprios. Alterações unilaterais que afetem encargos devem preservar o equilíbrio nos termos legais."],["Execução e extinção","A gestão e fiscalização acompanham entrega, qualidade, prazos e obrigações. Inexecução pode levar a sanções ou extinção contratual, observados procedimento, motivação e defesa. A sanção de impedimento e a declaração de inidoneidade têm alcances e requisitos diferentes."]],"map":["Fiscalização → execução","Prerrogativas → limites legais","Equilíbrio → encargos e remuneração","Sanções → processo e defesa"]},{"t":"Serviços públicos e delegação","ref":"CF, art. 175; Lei 8.987/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l8987compilada.htm","lessons":[["Titularidade e prestação","O poder público é responsável pela prestação dos serviços de sua competência. Pode executá-los diretamente ou delegar a execução nas hipóteses constitucionais. A delegação não transfere automaticamente a titularidade estatal do serviço nem elimina a fiscalização."],["Concessão e permissão","A concessão envolve delegação mediante licitação, por prazo determinado e por conta e risco do concessionário, conforme lei. A permissão é delegação a título precário, formalizada segundo o regime legal. Não confunda ambas com simples contratação de fornecimento ao Estado."],["Serviço adequado e extinção","Regularidade, continuidade, eficiência, segurança e modicidade tarifária compõem a avaliação do serviço adequado, entre outros requisitos legais. Encampação é retomada por interesse público durante o prazo, com condições próprias; caducidade decorre de inadimplemento do concessionário nas hipóteses legais."]],"map":["Titularidade → poder público","Concessão → delegação e licitação","Serviço adequado → requisitos legais","Encampação ≠ caducidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Responsabilidade civil do Estado e bens públicos","ref":"CF, art. 37, § 6º; Código Civil, arts. 98 a 103","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Responsabilidade objetiva","A Constituição prevê responsabilidade das pessoas jurídicas de direito público e prestadoras de serviços públicos por danos causados por seus agentes nessa qualidade. A vítima precisa demonstrar dano e nexo causal conforme o regime pertinente; a dispensa de prova da culpa não significa responsabilidade por qualquer evento."],["Omissões e regresso","Omissões estatais exigem exame da obrigação de agir, do nexo e da jurisprudência pertinente. Não há fórmula única aplicável indistintamente a todas elas. A ação regressiva contra agente depende de dolo ou culpa. O Tema 940 do STF orienta a legitimidade passiva nas ações indenizatórias abrangidas pela tese."],["Bens públicos","Bens de uso comum, de uso especial e dominicais possuem regimes distintos. Bens afetados ao uso comum ou especial não são alienáveis enquanto conservam essa qualificação. Bens dominicais podem ser alienados nas condições legais; nenhuma dessas categorias se adquire por usucapião."]],"map":["Dano + nexo → examinar imputação","Regresso → dolo ou culpa","Bens afetados → proteção especial","Bem público → sem usucapião"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Controle, processo administrativo e improbidade","ref":"Lei 8.429/1992; Lei 9.784/1999; CF, arts. 70 a 75","url":"https://www.planalto.gov.br/ccivil_03/leis/l8429compilada.htm","lessons":[["Controle da administração","O controle interno ocorre no âmbito da própria estrutura administrativa. O controle externo é exercido nos termos constitucionais pelo Legislativo com auxílio dos Tribunais de Contas, sem excluir o controle judicial. A fiscalização examina legalidade, legitimidade, economicidade e outros aspectos definidos na Constituição."],["Processo administrativo","O processo federal observa motivação, contraditório, acesso aos autos e demais garantias pertinentes. Recursos administrativos têm regras próprias; não se deve importar automaticamente os prazos do CPC. Impedimento e suspeição protegem imparcialidade dos responsáveis pela decisão."],["Improbidade administrativa","A Lei 14.230/2021 reformou a Lei 8.429/1992. O regime atual exige conduta dolosa tipificada, não bastando mera irregularidade ou voluntariedade. Distinga enriquecimento ilícito, dano ao erário e violação aos princípios nos tipos legais. A aplicação temporal e as questões processuais exigem estudo de precedentes, incluindo Tema 1199 e ADIs 7042 e 7043 do STF."]],"map":["Controle externo → Legislativo e Tribunais de Contas","Processo → garantias","Improbidade → dolo e tipicidade","Ilegalidade ≠ improbidade automaticamente"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"}];const adminQuestions=/*BANK:adminQuestions*/null;const taxModules=[{"t":"Sistema tributário e espécies de tributos","ref":"CTN, arts. 3º a 5º; CF, arts. 145, 148 e 149","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Conceito de tributo","O tributo é prestação pecuniária compulsória instituída em lei, que não constitui sanção por ato ilícito, cobrada mediante atividade administrativa vinculada. A multa por infração não é tributo, embora possa integrar crédito tributário. A natureza jurídica não decorre simplesmente do nome usado pela norma."],["Espécies tributárias","Na classificação constitucional em cinco espécies, distinguem-se impostos, taxas, contribuição de melhoria, empréstimos compulsórios e contribuições especiais. Impostos independem de atividade estatal específica relativa ao contribuinte. Taxas relacionam-se ao poder de polícia ou ao serviço público específico e divisível."],["Tributos vinculados","Contribuição de melhoria relaciona-se à valorização imobiliária decorrente de obra pública, observados limites legais. Empréstimo compulsório é de competência da União e exige lei complementar nas hipóteses constitucionais. Contribuições especiais têm finalidades e regimes constitucionalmente determinados."]],"map":["Tributo ≠ multa","Imposto → fato independente de atuação estatal específica","Taxa → polícia ou serviço específico e divisível","Empréstimo compulsório → União e LC"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Competência tributária e repartição de receitas","ref":"CF, arts. 145 a 162; CTN, arts. 6º a 8º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Competência e capacidade ativa","Competência tributária é poder constitucional de instituir tributos e não pode ser livremente transferida. A atribuição de funções administrativas de arrecadação ou fiscalização a outra pessoa jurídica de direito público segue regras distintas. Não confunda titularidade da competência com execução das tarefas administrativas."],["Distribuição constitucional","A Constituição discrimina competências federais, estaduais, distritais e municipais. O Distrito Federal reúne competências estaduais e municipais. O IBS tem competência compartilhada entre Estados, Distrito Federal e Municípios, nos termos da reforma tributária; não é simples reprodução do ICMS ou do ISS."],["Repartição de receitas","Receber parcela da arrecadação de tributo alheio não transfere competência legislativa ao ente beneficiário. Os mecanismos constitucionais de distribuição e fundos de participação buscam financiar entes federativos. Analise separadamente quem institui, quem administra e quem recebe os recursos."]],"map":["Competência → instituição por ente constitucionalmente autorizado","Capacidade ativa → atribuições administrativas","DF → competências estaduais e municipais","Repartição → receita, não competência"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"t":"Limitações ao poder de tributar","ref":"CF, arts. 150 a 152","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Legalidade e igualdade","Instituição e majoração de tributo dependem de lei, ressalvadas as exceções constitucionais. Igualdade tributária impede diferenciações arbitrárias entre contribuintes em situações equivalentes. Capacidade contributiva orienta a graduação dos impostos sempre que possível."],["Anterioridade e irretroatividade","Irretroatividade protege fatos anteriores à vigência da norma instituidora ou majoradora. Anterioridade anual e noventena são limites distintos, com exceções específicas. Para resolver questões, identifique tributo, alteração, data de publicação e exceções antes de calcular quando pode ser exigido."],["Imunidades e não confisco","Imunidade é limitação constitucional à competência, distinta de isenção legal. A imunidade recíproca protege patrimônio, renda e serviços dos entes nas condições constitucionais, com extensões e ressalvas. A vedação ao confisco exige análise da carga e das circunstâncias, não um percentual universal."]],"map":["Legalidade → lei e exceções constitucionais","Anterioridade anual ≠ noventena","Irretroatividade → fato anterior","Imunidade → Constituição"]},{"t":"Legislação, interpretação e vigência tributária","ref":"CTN, arts. 96 a 112","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Fontes normativas","Legislação tributária compreende leis, tratados, decretos e normas complementares pertinentes, dentro de seus limites de validade. Matérias reservadas à lei não podem ser criadas livremente por regulamento. A função do decreto é delimitada pela lei que regulamenta."],["Integração e interpretação","O CTN disciplina meios de integração quando falta disposição expressa. A analogia não pode resultar na exigência de tributo não previsto em lei; a equidade não autoriza dispensar tributo devido. A interpretação literal do art. 111 é exigida nas matérias expressamente indicadas, sem substituir a análise sistemática."],["Aplicação temporal","As regras de aplicação da legislação tributária distinguem fatos geradores futuros, pendentes e hipóteses de retroatividade legalmente admitidas. Normas sancionatórias mais favoráveis podem retroagir em atos ainda não definitivamente julgados, nos termos do art. 106. Não aplique automaticamente a retroatividade penal a todo tributo."]],"map":["Lei → matérias reservadas","Decreto → limites legais","Analogia → não cria tributo","Sanção mais favorável → hipóteses do art. 106"]},{"t":"Obrigação tributária, fato gerador e sujeitos","ref":"CTN, arts. 113 a 127","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Principal e acessória","A obrigação principal envolve pagamento de tributo ou penalidade pecuniária. A acessória consiste em deveres positivos ou negativos de interesse da arrecadação ou fiscalização. A inobservância de obrigação acessória pode originar obrigação principal relativa à penalidade, sem transformar a multa em tributo."],["Fato gerador","É a situação definida na legislação cuja ocorrência produz consequências tributárias. Diferencie hipótese abstrata de incidência e fato concretamente ocorrido. O momento de ocorrência depende da natureza da situação e das regras legais. A validade civil do negócio não resolve, isoladamente, todos os problemas de incidência."],["Sujeito ativo e passivo","Sujeito ativo é a pessoa jurídica de direito público titular da competência para exigir a prestação, no sentido do CTN. Contribuinte mantém relação pessoal e direta com o fato gerador; responsável possui dever decorrente de disposição expressa de lei. Convenções particulares não alteram, em regra, a definição legal perante a Fazenda."]],"map":["Principal → tributo ou multa","Acessória → dever instrumental","Contribuinte → relação direta","Responsável → disposição legal"]},{"t":"Responsabilidade e sucessão tributária","ref":"CTN, arts. 128 a 138","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Responsabilidade por lei","O dever de terceiro pelo crédito tributário exige previsão legal e vínculo com o fato gerador nos termos do art. 128. A responsabilidade pode excluir a do contribuinte ou atribuí-la supletivamente, conforme o regime aplicável. Não presuma que todos os responsáveis respondem nas mesmas condições."],["Sucessão","A transferência de bens e estabelecimentos pode produzir responsabilidade por créditos anteriores, observadas hipóteses legais, ressalvas e limites. Em aquisição de imóvel, o art. 130 disciplina sub-rogação de determinados créditos no adquirente, com tratamento próprio para arrematação em hasta pública."],["Terceiros e infrações","A responsabilidade pessoal do art. 135 exige os pressupostos ali previstos, como atos com excesso de poderes ou infração de lei, contrato social ou estatutos. Mero inadimplemento da sociedade não basta, por si só, para responsabilizar administrador. A denúncia espontânea tem requisitos próprios e não cabe após início de procedimento relacionado à infração."]],"map":["Terceiro → previsão legal","Sucessão → hipóteses e limites","Art. 135 → atos qualificados","Denúncia espontânea → anterior à fiscalização pertinente"]},{"t":"Crédito tributário e modalidades de lançamento","ref":"CTN, arts. 139 a 150","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Constituição do crédito","A obrigação surge com o fato gerador; o lançamento constitui o crédito nos termos legais, verificando a ocorrência, calculando o montante e identificando o sujeito passivo. Em tributos sujeitos a declaração, a jurisprudência reconhece constituição do crédito pela declaração do débito pelo contribuinte em hipóteses pertinentes."],["Modalidades","No lançamento de ofício, a autoridade realiza o procedimento nas hipóteses legais. No lançamento por declaração, informações do sujeito passivo ou terceiro subsidiam a autoridade. Na homologação, o sujeito passivo antecipa pagamento sem exame prévio, cabendo à autoridade homologá-lo nos termos legais."],["Revisão e notificação","Lançamento regularmente notificado pode ser alterado apenas nas hipóteses legais. Mudança de critério jurídico tem limites temporais para o mesmo sujeito passivo. Erro de fato e erro de direito exigem análise distinta, e o prazo decadencial limita a constituição e revisão do crédito."]],"map":["Fato gerador → obrigação","Lançamento → constituição do crédito","Declaração → informações","Homologação → antecipação e controle posterior"]},{"t":"Suspensão, extinção e exclusão do crédito","ref":"CTN, arts. 151 a 182","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Suspensão da exigibilidade","Moratória, depósito integral, reclamações e recursos administrativos nos termos legais, liminares ou tutelas previstas e parcelamento são causas de suspensão. O crédito não desaparece apenas por estar suspenso. A suspensão não dispensa deveres acessórios dependentes da obrigação principal."],["Extinção","Pagamento, compensação, transação, remissão, prescrição e decadência estão entre as causas legais de extinção. A compensação depende das condições previstas em lei, e a dação de imóvel em pagamento exige forma e condições legais. Distinga extinção do simples adiamento da cobrança."],["Exclusão e prazos","Isenção e anistia excluem o crédito nas condições legais: a anistia refere-se a infrações anteriores à lei concessiva, com ressalvas. Decadência limita a constituição do crédito; prescrição limita sua cobrança após constituição definitiva. Os termos iniciais dependem da modalidade e das circunstâncias; consulte o CTN consolidado."]],"map":["Suspensão → exigibilidade paralisada","Parcelamento → suspensão","Pagamento → extinção","Isenção e anistia → exclusão"]},{"t":"Administração tributária, garantias e execução fiscal","ref":"CTN, arts. 183 a 208; Lei 6.830/1980","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Fiscalização e sigilo","A fiscalização exerce poderes legalmente previstos para verificar obrigações tributárias. O sigilo fiscal protege informações obtidas em razão do ofício, com exceções legais. O acesso a informações não elimina deveres de finalidade, segurança e proteção de dados pertinentes."],["Certidões e dívida ativa","A inscrição em dívida ativa observa requisitos legais e permite emissão de título executivo. A presunção de certeza e liquidez é relativa. Certidão negativa comprova regularidade nas condições legais; certidão positiva com efeitos de negativa pode ser expedida em situações previstas no art. 206, como exigibilidade suspensa."],["Execução fiscal","A Lei 6.830/1980 disciplina cobrança judicial de dívida ativa. A defesa pode envolver embargos, nos requisitos legais, ou exceção de pré-executividade em hipóteses jurisprudenciais próprias. Não confunda o prazo de pagamento após citação com prazo de embargos. A análise de prescrição intercorrente exige atenção à suspensão e aos marcos legais e jurisprudenciais."]],"map":["Fiscalização → limites legais","CDA → presunção relativa","Exigibilidade suspensa → certidão positiva com efeitos de negativa","Execução → LEF e aplicação subsidiária do CPC"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l6830.htm"},{"t":"Impostos e reforma tributária do consumo","ref":"CF, arts. 153 a 156-A e 195; EC 132/2023; LC 214/2025 e LC 227/2026","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp214compilado.htm","lessons":[["Tributos tradicionais e transição","A União, os Estados e os Municípios têm competências específicas, como IR, ICMS e IPTU, respectivamente. A EC 132/2023 reformulou a tributação do consumo, com implementação gradual. Os regimes antigos e novos coexistem durante a transição; a data de referência da questão é indispensável."],["IBS, CBS e Imposto Seletivo","O IBS tem competência compartilhada de Estados, DF e Municípios; a CBS é contribuição federal. Ambos integram o novo modelo de tributação do consumo. O Imposto Seletivo é federal e possui finalidade e incidências constitucionais próprias. A LC 214/2025 disciplina os novos tributos e deve ser lida na redação consolidada."],["Governança e regimes","A LC 227/2026 institui o Comitê Gestor do IBS, disciplina o processo administrativo do imposto, a distribuição da arrecadação e normas gerais de ITCMD, entre outras alterações. Regras de transição, créditos, regimes diferenciados e obrigações acessórias devem ser estudados na legislação atual e na regulamentação pertinente. Não confunda alíquota de referência com alíquota universal definitiva."]],"map":["EC 132 → novo modelo","IBS → Estados, DF e Municípios","CBS e IS → União","LC 227 → Comitê Gestor e processo do IBS"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp227.htm"}];const taxQuestions=/*BANK:taxQuestions*/null;const laborModules=[{"t":"Fontes, princípios e direitos fundamentais","ref":"CF, arts. 7º a 11; CLT, arts. 8º e 9º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Fontes e proteção constitucional","O estudo parte da Constituição, da CLT, das leis especiais, dos instrumentos coletivos e dos precedentes aplicáveis. A proteção trabalhista não elimina a autonomia coletiva nem permite afastar livremente a legislação. É necessário distinguir normas indisponíveis e aquelas que admitem negociação."],["Primazia da realidade","A qualificação da relação depende dos fatos efetivamente comprovados, não apenas do título contratual. O princípio não permite presumir vínculo em qualquer prestação de serviço: os elementos legais devem estar presentes e os regimes especiais precisam ser considerados."],["Fraude e prescrição","Atos destinados a contornar a proteção legal podem ser nulos. A prescrição trabalhista geral combina alcance quinquenal dos créditos com prazo de dois anos após a extinção contratual para ajuizar ação, observadas hipóteses especiais. Distinga a perda da pretensão da inexistência do direito material."]],"map":["Fontes → Constituição e legislação","Realidade → fatos comprovados","Fraude → nulidade","Prescrição → cinco anos, limite bienal"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Relação de emprego e sujeitos","ref":"CLT, arts. 2º a 6º e 10 a 10-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Elementos do vínculo","O empregado é pessoa natural que presta trabalho não eventual, remunerado e subordinado, com pessoalidade. Esses elementos são examinados conjuntamente. A exclusividade não é requisito geral. A subordinação pode manifestar-se por meios digitais, sem exigir presença física."],["Empregador e risco econômico","O empregador organiza a atividade e assume seus riscos. Grupo econômico trabalhista exige os elementos legais, não bastando identidade de sócios. A prestação de serviços a diferentes empresas exige análise concreta do vínculo e da responsabilidade."],["Sucessão e outras relações","Alterações na estrutura jurídica da empresa não afetam automaticamente contratos e direitos dos empregados. Trabalho autônomo, estágio, terceirização e emprego têm regimes distintos. A jurisprudência sobre contratação empresarial deve ser examinada juntamente com a prova de eventual fraude."]],"map":["Empregado → pessoa natural","Vínculo → pessoalidade, onerosidade, não eventualidade e subordinação","Empregador → risco econômico","Grupo → requisitos legais"]},{"t":"Contrato de trabalho e modalidades especiais","ref":"CLT, arts. 442 a 456 e 75-A a 75-F; Lei 11.788/2008","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Prazo e experiência","O contrato por tempo indeterminado constitui a modalidade ordinária. O prazo determinado depende das hipóteses admitidas, com limite geral de dois anos, ressalvados regimes próprios. O contrato de experiência não pode exceder noventa dias, considerando as prorrogações."],["Teletrabalho e intermitente","O teletrabalho tem regime próprio de formalização, equipamentos e organização. Nem todo empregado remoto está excluído do controle de jornada. O contrato intermitente exige forma escrita e alternância entre períodos de prestação e inatividade, observadas as regras legais e jurisprudenciais."],["Estágio e aprendizagem","Estágio regular é ato educativo supervisionado, condicionado aos requisitos da Lei 11.788/2008. Aprendizagem é contrato especial de emprego, com formação técnico-profissional. O descumprimento dos requisitos do estágio pode produzir efeitos trabalhistas conforme o caso, sem afastar limites constitucionais de contratação pública."]],"map":["Indeterminado → modalidade ordinária","Experiência → até 90 dias","Teletrabalho → regime específico","Estágio → finalidade educativa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2008/lei/l11788.htm"},{"t":"Jornada, horas extras e transição constitucional","ref":"CF, art. 7º; EC 141/2026, arts. 1º a 10; CLT, arts. 58 a 75","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc141.htm","lessons":[["Limites e transição de 2026","A EC 141/2026 estabeleceu redução progressiva do limite semanal normal: 42 horas após dois meses da publicação e 40 horas um ano depois dessa primeira etapa, mantido o limite diário constitucional geral de oito horas. Na data de 25/11/2026, o primeiro prazo ainda não havia decorrido. A redução e a ampliação do repouso não autorizam redução salarial. Verifique a data do fato e regimes especiais, inclusive contratos públicos e a exceção do art. 8º da emenda."],["Horas extras e compensação","A remuneração extraordinária tem adicional constitucional mínimo de cinquenta por cento. Banco de horas, compensação e jornadas especiais exigem verificação do instrumento e dos prazos permitidos. Durante a transição, o art. 7º da emenda admite negociação específica para distribuição da jornada, respeitado o repouso. As exclusões de controle de jornada dependem dos requisitos legais."],["Intervalos e repouso","Entre jornadas, a CLT prevê intervalo mínimo geral de onze horas. Na jornada contínua superior a seis horas, o intervalo intrajornada tem regra geral de uma hora, com hipóteses legais de redução. A EC 141/2026 prevê dois dias de repouso semanal a partir de dois meses da publicação e regime compensatório coletivo excepcional; confira a vigência e as regras especiais."]],"map":["Transição → 42h, depois 40h","Horas extras → mínimo de 50%","Interjornada → 11h, regra geral","Repouso → nova regra com vigência diferida"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"t":"Remuneração, salário e equiparação","ref":"CLT, arts. 457 a 467; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Salário e remuneração","Salário corresponde à contraprestação paga pelo empregador; remuneração abrange salário e gorjetas nos termos legais. Comissões e gratificações legais integram o salário conforme art. 457. Ajuda de custo, diárias e prêmios possuem disciplina própria; a denominação não legitima fraude."],["Proteção salarial","O salário não pode sofrer descontos arbitrários. Descontos decorrentes de adiantamentos, lei e instrumentos coletivos têm regras específicas; danos causados pelo empregado exigem os pressupostos do art. 462. Identifique também periodicidade e forma de pagamento."],["Equiparação salarial","A equiparação do art. 461 exige trabalho de igual valor na mesma função, para o mesmo empregador e estabelecimento, considerando produtividade, perfeição técnica e limites temporais. A igualdade salarial entre mulheres e homens também recebe proteção específica, inclusive pela Lei 14.611/2023."]],"map":["Remuneração → salário e gorjetas","Desconto → autorização legal","Equiparação → requisitos cumulativos","Discriminação → vedação"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Férias, décimo terceiro e repousos","ref":"CLT, arts. 129 a 153; Lei 4.090/1962; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Aquisição e concessão de férias","Em regra, o direito às férias é adquirido a cada doze meses de contrato, e a concessão deve ocorrer nos doze meses seguintes. Faltas injustificadas podem alterar a duração conforme a escala legal. As férias anuais remuneradas incluem adicional constitucional mínimo de um terço."],["Fracionamento e pagamento","Com concordância do empregado, as férias podem ser divididas em até três períodos, um de pelo menos quatorze dias corridos e os demais de pelo menos cinco dias cada. Há restrição legal ao início próximo a feriado ou repouso. A remuneração deve ser paga no prazo do art. 145."],["Décimo terceiro e descanso","A gratificação natalina é calculada por duodécimos segundo meses de serviço, com fração de pelo menos quinze dias considerada mês integral. Descanso semanal remunerado e férias são institutos distintos; o novo regime de repousos da EC 141/2026 deve ser observado conforme sua vigência."]],"map":["Aquisição → 12 meses","Concessão → 12 meses seguintes","Fracionamento → 14 + períodos de pelo menos 5 dias","Férias → terço constitucional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l4090.htm"},{"t":"Alteração, suspensão e interrupção contratual","ref":"CLT, arts. 468 a 476-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Alteração contratual","A modificação das condições pactuadas exige, como regra, consentimento e ausência de prejuízo direto ou indireto ao empregado. O poder diretivo admite ajustes dentro dos limites legais. Identifique hipóteses específicas, como reversão de função de confiança, sem generalizar a incorporação de gratificações."],["Transferência","A transferência que implica mudança de domicílio tem limites próprios. A necessidade de serviço e as hipóteses legais devem ser demonstradas quando exigidas. Na transferência provisória nas condições do art. 469, § 3º, é devido adicional enquanto durar a situação."],["Suspensão e interrupção","Na interrupção, em geral, não há prestação de trabalho, mas permanece o pagamento e a contagem do período. Na suspensão, esses efeitos principais ficam paralisados, ressalvadas exceções legais. Afastamentos por doença, férias e licenças exigem classificação conforme o período e o regime aplicável."]],"map":["Alteração → consentimento e sem prejuízo","Transferência → mudança de domicílio","Interrupção → remuneração em regra mantida","Suspensão → efeitos principais paralisados"]},{"t":"Extinção contratual, aviso-prévio e FGTS","ref":"CLT, arts. 477 a 491; Leis 8.036/1990 e 12.506/2011","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Formas de término","Dispensa sem justa causa, pedido de demissão, justa causa, rescisão indireta e acordo têm efeitos diferentes. A justa causa exige enquadramento legal e análise das circunstâncias. Rescisão indireta decorre de falta patronal nas hipóteses do art. 483. A extinção consensual do art. 484-A possui verbas específicas."],["Aviso e quitação","O aviso-prévio proporcional segue a Constituição e a Lei 12.506/2011, com mínimo de trinta dias e acréscimos nos termos legais até noventa dias. O art. 477 prevê prazo geral de dez dias contados do término para entrega de documentos e pagamento das verbas rescisórias."],["FGTS e indenizações","A dispensa sem justa causa normalmente enseja indenização de quarenta por cento dos depósitos do FGTS pertinentes ao contrato, ressalvados regimes especiais. No acordo do art. 484-A, a indenização é reduzida à metade, e o saque tem limite legal de oitenta por cento; não há ingresso no seguro-desemprego por essa modalidade."]],"map":["Dispensa ≠ pedido de demissão","Falta patronal → possível rescisão indireta","Quitação → prazo geral de 10 dias","Acordo → regime específico"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8036consol.htm"},{"t":"Estabilidades, saúde e proteção do trabalho","ref":"ADCT, art. 10; CLT, arts. 157 a 201 e 391 a 400; Lei 8.213/1991","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Garantias provisórias","A garantia da gestante protege desde a confirmação da gravidez até cinco meses após o parto, nos termos constitucionais e jurisprudenciais. A estabilidade acidentária e a proteção de representantes dos trabalhadores possuem condições próprias. Diferencie garantia de emprego de estabilidade do servidor estatutário."],["Saúde e segurança","O empregador deve observar e fazer cumprir normas de segurança e medicina do trabalho. Equipamentos de proteção, medidas coletivas e treinamento integram prevenção. Insalubridade e periculosidade exigem os pressupostos normativos e prova pertinente, não sendo automaticamente devidas pelo nome da profissão."],["Proteção de grupos e não discriminação","A Constituição proíbe trabalho noturno, perigoso ou insalubre a menores de dezoito anos e trabalho antes dos dezesseis, salvo aprendizagem a partir de quatorze. Trabalho doméstico segue a LC 150/2015. Direitos relacionados à maternidade e prevenção de discriminação devem ser estudados conforme as normas específicas."]],"map":["Gestante → proteção constitucional","Acidente → requisitos próprios","Segurança → prevenção","Aprendizagem → a partir de 14 anos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direito coletivo, sindicatos e negociação","ref":"CF, arts. 8º e 9º; CLT, arts. 611 a 625; Lei 7.783/1989","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Organização sindical","A liberdade sindical impede obrigatoriedade de filiação. A Constituição mantém regras de unicidade por categoria e base territorial e atribui aos sindicatos defesa de interesses coletivos e individuais da categoria. A representação sindical não se confunde com filiação individual."],["Acordos e convenções","Convenção coletiva é celebrada entre sindicatos representativos das categorias; acordo coletivo envolve sindicato profissional e empresa ou empresas. Os arts. 611-A e 611-B tratam de matérias negociáveis e direitos cuja supressão ou redução constitui objeto ilícito. O Tema 1046 do STF deve ser considerado na interpretação dos limites."],["Greve e atualização normativa","A greve é direito constitucional, disciplinado pela Lei 7.783/1989. Serviços essenciais possuem requisitos de continuidade e comunicação. A EC 141/2026 também prevê perda de efeito de cláusulas coletivas incompatíveis após dois meses de sua publicação e hipóteses especiais de compensação de repouso; instrumentos coletivos devem respeitar a vigência aplicável."]],"map":["Filiação → liberdade","Convenção → sindicatos","Acordo → sindicato profissional e empresa","Negociação → limites constitucionais e legais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l7783.htm"}];const laborQuestions=/*BANK:laborQuestions*/null;const processLaborModules=[{"t":"Organização, competência e jurisdição trabalhista","ref":"CF, arts. 111 a 116; CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Estrutura da Justiça do Trabalho","A Justiça do Trabalho é organizada em Varas, Tribunais Regionais e Tribunal Superior do Trabalho. As Varas são órgãos de primeiro grau; os TRTs julgam recursos e determinadas ações originárias; o TST uniformiza a interpretação do direito trabalhista dentro de suas atribuições."],["Competência material","O art. 114 da Constituição estabelece a competência sobre ações decorrentes das relações de trabalho e outras hipóteses expressas, como indenizações relacionadas ao trabalho. Não confunda relação de trabalho com emprego: a primeira é gênero. Relações jurídico-administrativas estatutárias seguem a delimitação constitucional fixada pelo STF."],["Competência territorial","A regra do art. 651 da CLT privilegia a localidade da prestação de serviços, ainda que a contratação tenha ocorrido em outro lugar. Existem exceções para situações específicas, como agente viajante e empregador que promove atividades fora do local do contrato."]],"map":["Vara → primeiro grau","TRT → recursos e competência originária","TST → uniformização","Território → prestação de serviços, em regra"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"t":"Princípios, partes e representação","ref":"CLT, arts. 763 a 769, 791 e 843; Súmula 425 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Especialidade e aplicação subsidiária","O processo trabalhista valoriza oralidade, concentração de atos e conciliação. O CPC pode suprir lacunas quando compatível com o regime trabalhista. Na execução, também se observa o art. 889 da CLT. A existência de norma especial impede substituição automática pela disciplina civil."],["Capacidade e jus postulandi","A CLT admite atuação pessoal de empregado e empregador nos limites legais. A Súmula 425 do TST restringe o jus postulandi às Varas e TRTs, excluindo, entre outros, recursos de competência do TST, ação rescisória e mandado de segurança. A representação por advogado continua recomendável."],["Preposto e representação","O empregador pode ser representado por preposto que conheça os fatos, cujas declarações o vinculam. O preposto não precisa ser empregado da parte reclamada. A regularidade da representação técnica e a presença das partes devem ser examinadas separadamente."]],"map":["Especialidade → CLT","CPC → lacuna e compatibilidade","Jus postulandi → limites da Súmula 425","Preposto → conhecimento dos fatos"],"extraUrl":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"t":"Atos processuais, prazos e nulidades","ref":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Contagem de prazos","Os prazos processuais trabalhistas expressos em dias são contados em dias úteis, excluindo-se o dia inicial e incluindo-se o vencimento. A identificação da intimação e do termo inicial é indispensável. Prazos de direito material não se confundem com prazos processuais."],["Suspensão e comunicação","O curso dos prazos processuais é suspenso de 20 de dezembro a 20 de janeiro, inclusive, conforme o art. 775-A. A comunicação eletrônica exige atenção à data de ciência e à regulamentação pertinente. Não confunda suspensão com interrupção: na suspensão, preserva-se a parcela já transcorrida."],["Nulidades","O sistema privilegia aproveitamento de atos e demonstração de prejuízo. Em regra, a nulidade deve ser arguida na primeira oportunidade de manifestação, observadas exceções. A parte não pode beneficiar-se de vício ao qual deu causa nos termos do art. 796."]],"map":["Prazo processual → dias úteis","20/12 a 20/01 → suspensão","Nulidade → prejuízo","Arguição → primeira oportunidade, em regra"]},{"t":"Reclamação trabalhista e ritos","ref":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Petição inicial","A reclamação pode ser escrita ou verbal nas hipóteses legais. Na escrita, o art. 840 exige designação do juízo, qualificação, breve exposição dos fatos, pedidos certos e determinados com indicação de valor, data e assinatura. Pedidos que não atendam aos requisitos do § 1º sujeitam-se à consequência do § 3º."],["Procedimento sumaríssimo","Dissídios individuais cujo valor não excede quarenta salários mínimos na data do ajuizamento submetem-se ao sumaríssimo, ressalvadas exclusões legais. Demandas em que seja parte administração pública direta, autárquica ou fundacional não se enquadram nesse rito. Não confunda com o procedimento sumário de alçada."],["Particularidades do rito","No sumaríssimo, os pedidos devem ser certos, determinados e valorados, e não se admite citação por edital. A concentração de atos procura acelerar o julgamento. A escolha do rito interfere na instrução e nos requisitos de recurso de revista."]],"map":["Inicial → fatos e pedidos valorados","Sumaríssimo → até 40 salários mínimos","Administração direta, autárquica e fundacional → exclusão","Sumaríssimo → sem edital"]},{"t":"Audiência, conciliação e resposta","ref":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Comparecimento","A audiência concentra atos relevantes. A ausência do reclamante pode ensejar arquivamento; a do reclamado pode produzir revelia e confissão quanto à matéria de fato, observadas exceções do art. 844. A presença de advogado do reclamado permite recebimento de contestação e documentos nos termos do § 5º."],["Conciliação","O julgador deve estimular composição, inclusive nas oportunidades previstas nos arts. 846 e 850. O acordo homologado produz efeitos jurídicos próprios, ressalvadas hipóteses de impugnação legal. A ausência de acordo não representa presunção contra a parte."],["Defesa e instrução","Frustrada a conciliação, a parte reclamada apresenta defesa conforme art. 847, inclusive por escrito no sistema eletrônico até a audiência. A instrução permite produção de provas e razões finais. Exceção de incompetência territorial possui procedimento próprio no art. 800."]],"map":["Ausência do autor → arquivamento, em regra","Ausência do réu → revelia e confissão, com ressalvas","Conciliação → antes e depois da instrução","Defesa → art. 847"]},{"t":"Provas, ônus probatório e sentença","ref":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Distribuição do ônus","Cabe ao reclamante provar fato constitutivo de seu direito e ao reclamado demonstrar fato impeditivo, modificativo ou extintivo. O art. 818 admite redistribuição fundamentada em condições específicas, assegurando oportunidade real de cumprimento do novo encargo."],["Testemunhas e perícia","No rito ordinário, cada parte pode indicar até três testemunhas, ressalvado o inquérito para apuração de falta grave, que tem regra própria. No sumaríssimo, o limite é de duas por parte. A perícia atende questões técnicas, e o laudo deve ser avaliado de forma fundamentada."],["Sentença e motivação","A decisão deve identificar fundamentos, apreciar pedidos e observar os limites da demanda. O relatório pode ser dispensado no sumaríssimo, mas a fundamentação permanece necessária. Distinga reconhecimento de direito, quantificação e efetiva satisfação do crédito."]],"map":["Autor → fato constitutivo","Réu → fato impeditivo, modificativo ou extintivo","Ordinário → 3 testemunhas, regra geral","Sumaríssimo → 2 testemunhas"]},{"t":"Custas, gratuidade e honorários","ref":"CLT, arts. 789 a 791-A; STF, ADI 5766","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Custas e preparo","As custas do conhecimento seguem, em regra, percentual de dois por cento e limites do art. 789. O depósito recursal tem finalidade de garantia e não se confunde com custas. Isenções, reduções e limites de depósito devem ser avaliados segundo a parte e o recurso, usando valores oficiais vigentes."],["Justiça gratuita","A gratuidade protege o acesso à justiça quando presentes os requisitos legais. O art. 790 prevê parâmetros e insuficiência de recursos. A jurisprudência atual deve ser observada na avaliação de declarações e provas de hipossuficiência, distinguindo pessoa natural e pessoa jurídica."],["Honorários após ADI 5766","A sucumbência advocatícia trabalhista segue o art. 791-A, com percentual entre cinco e quinze por cento. Conforme a interpretação aplicada pelo TST à ADI 5766, créditos obtidos em juízo não autorizam cobrança automática do beneficiário da gratuidade; a exigibilidade pode permanecer suspensa por dois anos, cabendo demonstração de superação da insuficiência. Honorários periciais possuem disciplina própria."]],"map":["Custas → regra de 2%","Depósito → garantia recursal","Gratuidade → insuficiência","ADI 5766 → sem cobrança automática"],"extraUrl":"https://jurisprudencia-backend.tst.jus.br/rest/documentos/35018180d7c8c03d5dc82d4f7bff208b"},{"t":"Recursos trabalhistas","ref":"CLT, arts. 893 a 900; Súmula 214 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Sistema recursal","O recurso ordinário impugna decisões definitivas ou terminativas nas hipóteses do art. 895. O recurso de revista tem pressupostos próprios e não funciona como nova instância de reexame amplo de fatos. O agravo de instrumento pode buscar destrancar recurso cuja interposição foi denegada."],["Prazos e efeitos","O prazo geral de recursos trabalhistas é de oito dias, ressalvadas exceções. Embargos de declaração têm prazo de cinco dias e interrompem, em regra, o prazo dos demais recursos. Os recursos possuem efeito meramente devolutivo como regra da CLT, ressalvadas situações específicas."],["Interlocutórias e revista","Decisões interlocutórias geralmente não admitem recurso imediato; a Súmula 214 delimita exceções. O recurso de revista exige análise das hipóteses de cabimento, pressupostos formais e transcendência. No sumaríssimo, seu cabimento tem restrições adicionais."]],"map":["Sentença → recurso ordinário, em regra","Revista → requisitos especiais","Embargos declaratórios → 5 dias","Interlocutória → irrecorribilidade imediata, em regra"],"extraUrl":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"t":"Liquidação e execução trabalhista","ref":"CLT, arts. 876 a 892 e 897","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Título e liquidação","A execução realiza obrigações constantes de títulos reconhecidos pela legislação. A liquidação quantifica decisão ilíquida sem alterar o mérito. Elaborada a conta, o art. 879, § 2º, estabelece prazo comum para impugnação fundamentada, com indicação dos itens e valores controvertidos."],["Iniciativa e pagamento","O art. 878 prevê iniciativa das partes, permitindo execução de ofício quando não representadas por advogado. Citado para cumprir decisão ou acordo, o executado tem prazo legal de quarenta e oito horas para pagar ou garantir a execução, nas hipóteses do art. 880."],["Defesa e recursos","Garantida a execução ou penhorados bens, o art. 884 prevê cinco dias para embargos, ressalvadas regras especiais. O agravo de petição é recurso típico das decisões em execução, exigindo delimitação justificada das matérias e valores impugnados nos termos legais."]],"map":["Liquidação → quantificação","Conta → impugnação fundamentada","Citação executiva → 48 horas","Execução → agravo de petição"]},{"t":"Ações especiais, dissídios coletivos e homologação","ref":"CF, art. 114; CLT, arts. 853 a 855-E e 856 a 875","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Inquérito para apuração de falta grave","Quando exigido pelo regime de garantia de emprego, o inquérito judicial busca apurar falta grave que autorize resolução contratual. O art. 853 prevê prazo de trinta dias da suspensão para ajuizamento na hipótese legal. Não generalize esse procedimento para toda garantia provisória."],["Homologação extrajudicial","O processo de homologação de acordo extrajudicial inicia-se por petição conjunta, com representação obrigatória por advogados distintos. O juiz analisa a legalidade e pode designar audiência. O pedido não dispensa o cumprimento do prazo rescisório legal."],["Dissídios coletivos","Dissídios coletivos jurídicos e econômicos possuem objetos distintos. No dissídio econômico, a Constituição prevê negociação ou arbitragem prévias e comum acordo nas condições do art. 114, § 2º, consideradas as interpretações judiciais pertinentes. Greve em atividade essencial com possibilidade de lesão do interesse público possui disciplina específica."]],"map":["Inquérito → hipóteses específicas","Acordo extrajudicial → petição conjunta","Advogados distintos → obrigatórios","Dissídio coletivo → competência e pressupostos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const processLaborQuestions=/*BANK:processLaborQuestions*/null;const businessModules=[{"t":"Teoria da empresa e empresário","ref":"CC, arts. 966 a 980","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Atividade empresarial","A teoria da empresa centra-se na atividade econômica organizada de produção ou circulação de bens ou serviços, exercida profissionalmente. Analise a organização dos fatores de produção, a habitualidade e a finalidade econômica. Empresa é atividade; empresário é o sujeito que a exerce."],["Profissionais intelectuais","O exercício de profissão científica, literária ou artística não caracteriza, por si só, empresário, mesmo com auxiliares. A exceção ocorre quando a profissão constitui elemento de empresa. Compare um profissional que presta pessoalmente seus serviços com uma organização na qual a atividade intelectual integra estrutura empresarial mais ampla."],["Registro e capacidade","O empresário deve inscrever-se no registro mercantil antes de iniciar a atividade. A falta de inscrição não elimina necessariamente sua condição material de empresário, mas gera irregularidade. O empresário rural possui regime facultativo de inscrição nos termos do art. 971. A continuidade de empresa por incapaz depende das condições e autorização judicial previstas em lei."]],"map":["Empresa → atividade","Empresário → sujeito","Profissão intelectual → exceção do elemento de empresa","Registro rural → regime próprio"]},{"t":"Estabelecimento, nome empresarial e registro","ref":"CC, arts. 1.142 a 1.168; Lei 8.934/1994","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Estabelecimento empresarial","O estabelecimento reúne bens organizados para exercício da empresa. Pode abranger bens materiais e imateriais e não se confunde com imóvel, endereço ou pessoa jurídica. Um estabelecimento pode ser objeto unitário de negócios jurídicos, observadas exigências específicas."],["Trespasse e credores","Na alienação do estabelecimento, o art. 1.145 protege credores quando não restam ao alienante bens suficientes para quitar o passivo. O adquirente responde por débitos anteriores regularmente contabilizados, com responsabilidade solidária temporária do alienante nos termos do art. 1.146. Sucessão fiscal e trabalhista têm regras próprias."],["Nome e proteção","Nome empresarial identifica o empresário ou sociedade; marca distingue produtos ou serviços. Firma e denominação seguem regras próprias. O registro mercantil protege o nome no âmbito previsto pela legislação, sem substituir registro de marca. Salvo autorização expressa, o alienante não pode concorrer com o adquirente nos cinco anos seguintes à transferência."]],"map":["Estabelecimento → conjunto organizado de bens","Trespasse → proteção de credores","Nome empresarial ≠ marca","Não concorrência → 5 anos, regra geral"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8934.htm"},{"t":"Sociedades: classificação e personalidade jurídica","ref":"CC, arts. 981 a 996","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Sociedade simples e empresária","A classificação decorre, em regra, da natureza da atividade, e não da quantidade de sócios. Sociedade por ações é sempre empresária e cooperativa é sempre simples, independentemente do objeto. A forma limitada pode ser adotada em regimes distintos, observadas as normas de registro."],["Personalização e autonomia","A sociedade adquire personalidade com inscrição regular do ato constitutivo no registro adequado. Patrimônio social e patrimônio dos sócios não se confundem automaticamente. A desconsideração depende dos pressupostos do regime jurídico aplicável e não corresponde à dissolução da sociedade."],["Sociedades não personificadas","A sociedade em comum é disciplinada enquanto seus atos constitutivos não estão inscritos, ressalvadas hipóteses legais. A sociedade em conta de participação tem sócio ostensivo que atua em nome próprio perante terceiros e sócio participante com relação interna. Seu contrato não lhe confere personalidade, mesmo se registrado."]],"map":["Empresária → atividade, ressalvadas regras especiais","S.A. → sempre empresária","Cooperativa → sempre simples","SCP → sem personalidade jurídica"]},{"t":"Sociedade limitada e governança","ref":"CC, arts. 1.052 a 1.087","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Quotas e capital","A limitada admite uma ou mais pessoas. Cada sócio tem responsabilidade restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital. A prestação de serviços não pode constituir contribuição ao capital da limitada. Distinga capital subscrito de capital efetivamente integralizado."],["Administração e deliberações","A administração pode ser atribuída a sócios ou não sócios, observados requisitos e quóruns vigentes. Deliberações sobre alteração contratual e administração seguem o Código Civil e o contrato social. Não memorize quóruns antigos: as Leis 13.792/2019 e 14.451/2022 modificaram regras relevantes."],["Saída e exclusão","Retirada, morte e exclusão de sócio possuem pressupostos e efeitos próprios. A exclusão extrajudicial por justa causa exige os requisitos do art. 1.085, inclusive previsão contratual e deliberação pertinente. A apuração de haveres não elimina automaticamente responsabilidade por obrigações anteriores nos limites legais."]],"map":["Limitada → um ou mais sócios","Quotas → responsabilidade limitada","Integralização → solidariedade","Exclusão → requisitos legais e contratuais"]},{"t":"Sociedades anônimas e mercado de capitais","ref":"Lei 6.404/1976, arts. 1º a 4º, 109, 116 a 117 e 138 a 158","url":"https://www.planalto.gov.br/ccivil_03/leis/l6404compilada.htm","lessons":[["Capital e ações","A companhia tem capital dividido em ações. A responsabilidade do acionista limita-se ao preço de emissão das ações subscritas ou adquiridas, observadas hipóteses próprias de responsabilização. Ações ordinárias e preferenciais possuem direitos definidos por lei e estatuto; não se presume que todas tenham voto idêntico."],["Companhias abertas e fechadas","A distinção depende da admissão dos valores mobiliários à negociação no mercado de valores mobiliários. Companhias abertas submetem-se ao regime de registro, fiscalização e divulgação pertinente à CVM. Não basta possuir muitos acionistas para caracterizar companhia aberta."],["Órgãos e deveres","Assembleia geral, administração e conselho fiscal exercem atribuições distintas. Administradores devem atuar com diligência, lealdade e finalidade compatível com o interesse social. O controlador não possui liberdade para abusar do poder de controle em prejuízo da companhia ou dos demais acionistas."]],"map":["Capital → ações","Acionista → preço de emissão","Aberta → mercado de valores mobiliários","Controle → deveres e limites"]},{"t":"Títulos de crédito: princípios e circulação","ref":"CC, arts. 887 a 926","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Princípios cambiários","Literalidade delimita o conteúdo do direito incorporado ao título; autonomia protege a independência das obrigações cambiárias nos limites legais. A cartularidade tradicional deve ser compreendida considerando títulos eletrônicos admitidos pela legislação. Nem todo documento representativo de crédito é título cambiário."],["Endosso e cessão","O endosso é meio de circulação de títulos à ordem. Sua forma e responsabilidade do endossante dependem do regime aplicável, especialmente de leis cambiárias especiais. Não confunda endosso com cessão civil, que possui regras próprias quanto a efeitos e defesas oponíveis."],["Aval e garantias","O aval garante obrigação cambiária e tem autonomia própria, distinta da fiança. O avalista equipara-se ao avalizado nos termos do regime jurídico correspondente. O Código Civil veda aval parcial, mas leis especiais podem admiti-lo; antes de responder, identifique o título e a lei aplicável."]],"map":["Literalidade → conteúdo do título","Autonomia → obrigações cambiárias","Endosso → circulação","Aval ≠ fiança"]},{"t":"Cheque, nota promissória e duplicata","ref":"Lei 7.357/1985; Lei 5.474/1968; Decreto 57.663/1966","url":"https://www.planalto.gov.br/ccivil_03/leis/l7357.htm","lessons":[["Cheque","Cheque constitui ordem de pagamento à vista. A indicação de data futura não altera essa natureza cambiária, embora a apresentação antecipada possa produzir consequências civis. Os prazos de apresentação variam conforme a praça de emissão e pagamento; a prescrição executiva possui termo inicial próprio."],["Nota promissória","A nota promissória contém promessa de pagamento, ao contrário da ordem característica do cheque. A Lei Uniforme de Genebra disciplina seus requisitos e aplicação de regras cambiárias pertinentes. Examine vencimento, assinaturas, aval e endosso antes de determinar a obrigação exigível."],["Duplicata","A duplicata vincula-se a operação mercantil ou prestação de serviços documentada, segundo a legislação. Para cobrança executiva de duplicata não aceita, devem ser examinados protesto, prova de entrega ou prestação e ausência de recusa legítima, conforme o regime. A duplicata escritural também possui disciplina própria."]],"map":["Cheque → ordem à vista","Promissória → promessa","Duplicata → operação causal","Execução → requisitos do título"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5474.htm"},{"t":"Propriedade industrial e contratos empresariais","ref":"Lei 9.279/1996, arts. 8º, 9º, 40, 122 a 129 e 133; Lei 13.966/2019","url":"https://www.planalto.gov.br/ccivil_03/leis/l9279.htm","lessons":[["Patentes e desenhos industriais","A proteção de invenções exige novidade, atividade inventiva e aplicação industrial. Modelo de utilidade tem requisitos distintos relacionados à melhoria funcional. Patente e registro de desenho industrial não se confundem com marca. A vigência da patente deve observar o art. 40 e a decisão do STF na ADI 5529."],["Marcas e concorrência","A marca protege sinal distintivo nas condições legais, e a aquisição do direito de propriedade decorre, em regra, de registro válido. A proteção admite situações especiais, como marca notoriamente conhecida. O prazo de registro da marca é de dez anos, prorrogável por períodos iguais sucessivos."],["Franquia e outros contratos","Na franquia empresarial, o franqueador autoriza uso de marca e outros direitos e métodos de negócio, conforme contrato e lei específica. A circular de oferta deve ser entregue pelo menos dez dias antes da assinatura ou pagamento previsto em lei. A franquia não configura, por si só, vínculo empregatício ou relação de consumo entre franqueador e franqueado."]],"map":["Patente → requisitos técnicos","Marca → sinal distintivo","Marca registrada → 10 anos renováveis","Franquia → circular prévia"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/lei/l13966.htm"},{"t":"Recuperação judicial e extrajudicial","ref":"Lei 11.101/2005, arts. 1º a 6º, 47 a 69 e 161 a 167","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm","lessons":[["Objetivo e legitimidade","A recuperação busca superar crise econômico-financeira de atividade viável, preservando atividade produtiva, empregos e interesses dos credores. Sua incidência depende do sujeito e das exclusões do art. 2º. O art. 48 exige exercício regular de atividade por mais de dois anos e outros requisitos cumulativos."],["Processamento, créditos e plano","Deferimento do processamento não equivale à concessão da recuperação. A suspensão de execuções e a sujeição de créditos têm exceções expressas. Em regra, os créditos existentes na data do pedido se submetem, ainda que não vencidos. O plano deve ser apresentado no prazo legal de sessenta dias contado da publicação da decisão de processamento."],["Assembleia e recuperação extrajudicial","Credores deliberam sobre o plano conforme classes e quóruns pertinentes; existem hipóteses de concessão judicial em condições legais mesmo sem aprovação ordinária. A recuperação extrajudicial permite negociação e homologação nos limites de sua disciplina. Verifique créditos excluídos, quóruns e requisitos na redação atualizada pela Lei 14.112/2020."]],"map":["Recuperação → atividade viável","Processamento ≠ concessão","Plano → 60 dias, regra legal","Créditos → sujeição e exceções"]},{"t":"Falência, classificação de créditos e encerramento","ref":"Lei 11.101/2005, arts. 75 a 160","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm","lessons":[["Pressupostos da falência","A falência é procedimento coletivo de liquidação e reorganização de ativos, submetido às finalidades legais. O art. 94 prevê hipóteses distintas de impontualidade injustificada, execução frustrada e atos falimentares. Não se decreta falência apenas porque a empresa está momentaneamente com prejuízo contábil."],["Efeitos e administração","A decretação altera a administração e disponibilidade patrimonial do falido. O administrador judicial desempenha funções de arrecadação, verificação de créditos e outras previstas em lei, sob fiscalização judicial. O juízo falimentar possui competência própria, com exceções expressas."],["Pagamento e encerramento","A ordem de pagamento deve distinguir créditos extraconcursais do art. 84 e concursais do art. 83. Créditos trabalhistas têm preferência nos limites legais e existem regras para garantias reais, tributários e outras classes. Encerramento do processo e extinção das obrigações do falido possuem requisitos próprios, alterados pela reforma de 2020."]],"map":["Falência → hipóteses do art. 94","Administrador judicial → funções legais","Extraconcursal → art. 84","Concursal → ordem do art. 83"]}];const businessQuestions=/*BANK:businessQuestions*/null;const humanRightsModules=[{"t":"Fundamentos, evolução e características","ref":"DUDH, preâmbulo e arts. 1º a 2º; CF, arts. 1º e 4º","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights","lessons":[["Dignidade e universalidade","Direitos humanos protegem a pessoa contra abusos e orientam a criação de condições para uma existência digna. A universalidade não depende de nacionalidade ou cidadania. Direitos fundamentais designam, em sentido técnico, direitos reconhecidos na ordem constitucional interna, sem negar a relação com os direitos humanos internacionais."],["Dimensões e interdependência","A classificação em dimensões organiza didaticamente liberdades civis e políticas, direitos sociais, econômicos e culturais e direitos de solidariedade. As dimensões não se substituem: o exercício de um direito pode depender da efetividade de outros. O acesso à educação, por exemplo, amplia as condições de participação política."],["Deveres do Estado","Respeitar significa evitar interferências indevidas; proteger envolve prevenir violações por terceiros; realizar demanda medidas para efetivação. Nem todo direito é absoluto, mas restrições precisam respeitar legalidade e justificativa adequada. Algumas proibições, como a tortura, não admitem suspensão."]],"map":["Dignidade → fundamento","Universalidade → toda pessoa","Dimensões → complementares","Estado → respeitar, proteger e realizar"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Declaração Universal e sistema global","ref":"DUDH, arts. 3º a 30; Carta da ONU","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights","lessons":[["Origem e natureza","A Declaração Universal foi adotada pela Assembleia Geral da ONU em 1948. Não é, por sua forma, um tratado sujeito à ratificação, mas tornou-se referência central do sistema internacional. Sua relevância normativa não se resume à classificação formal, pois alguns de seus conteúdos refletem normas internacionais reconhecidas por outras fontes."],["Liberdades e proteção","A Declaração contempla vida, liberdade, igualdade, acesso a remédios efetivos, julgamento imparcial e liberdade de consciência e expressão. Ao resolver questões, identifique a garantia afetada e evite interpretar a liberdade de expressão como autorização irrestrita para violações de outros direitos."],["Direitos sociais e culturais","A DUDH também reconhece trabalho, educação, segurança social, participação cultural e condições adequadas de vida. A presença desses direitos no mesmo documento reforça a indivisibilidade. O art. 29 trata de deveres e limites compatíveis com os fins democráticos e os direitos de terceiros."]],"map":["1948 → Assembleia Geral","Declaração ≠ tratado","Liberdades → proteção da pessoa","Direitos sociais → dignidade"],"extraUrl":"https://uhri.ohchr.org/en/about"},{"t":"Pactos internacionais de 1966","ref":"PIDCP, Decreto 592/1992; PIDESC, Decreto 591/1992","url":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0592.htm","lessons":[["Direitos civis e políticos","O PIDCP estabelece obrigações de respeito e garantia de direitos, abrangendo participação política, liberdade pessoal e garantias processuais. O Comitê de Direitos Humanos monitora sua aplicação. Comunicações individuais dependem do reconhecimento do mecanismo pertinente, como o Protocolo Facultativo."],["Direitos econômicos, sociais e culturais","O PIDESC disciplina direitos como educação, saúde, trabalho e seguridade social. A realização progressiva conforme recursos disponíveis não transforma todas as obrigações em promessas facultativas. A adoção de medidas e a não discriminação possuem importância imediata."],["Derrogações e limites","O PIDCP prevê regras especiais para emergências públicas oficialmente proclamadas, sem permitir suspensão de todos os direitos. A proibição de tortura não pode ser afastada por esse mecanismo. Limitações ordinárias e derrogações excepcionais são institutos distintos e exigem seus próprios pressupostos."]],"map":["PIDCP → liberdades e garantias","PIDESC → direitos econômicos e sociais","Progressividade → dever de agir","Emergência → limites estritos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0591.htm"},{"t":"Mecanismos de monitoramento da ONU","ref":"OHCHR, mecanismos internacionais de direitos humanos","url":"https://uhri.ohchr.org/en/about","lessons":[["Órgãos e comitês","O Conselho de Direitos Humanos é órgão intergovernamental. Os comitês de tratados são compostos por especialistas independentes e monitoram instrumentos específicos. Não confunda o Conselho com o Comitê de Direitos Humanos do PIDCP nem atribua a todos os órgãos competência jurisdicional."],["Revisão Periódica Universal","A RPU é mecanismo de avaliação entre Estados no âmbito do Conselho de Direitos Humanos. Examina a situação dos Estados membros da ONU e gera recomendações. Não é processo criminal nem tribunal internacional que condena indivíduos."],["Procedimentos especiais","Relatores especiais e grupos de trabalho possuem mandatos temáticos ou relativos a países. Podem produzir relatórios e comunicações nos limites do mandato. Reclamações individuais perante comitês dependem da competência reconhecida, de requisitos de admissibilidade e do instrumento específico."]],"map":["Conselho → órgão intergovernamental","Comitês → especialistas","RPU → revisão entre Estados","Relatores → mandatos específicos"]},{"t":"Sistema interamericano e Convenção Americana","ref":"CADH, arts. 1º a 32 e 33","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm","lessons":[["Proteção regional","O sistema interamericano integra a estrutura regional da OEA e possui diferentes instrumentos de proteção. A Convenção Americana, também conhecida como Pacto de São José, foi promulgada no Brasil pelo Decreto 678/1992. Sua aplicação deve considerar os compromissos assumidos por cada Estado."],["Direitos e garantias","A Convenção contempla integridade pessoal, liberdade, garantias judiciais e proteção judicial. O art. 8º protege garantias do processo; o art. 25 prevê proteção por recurso efetivo. A análise de violações deve considerar deveres de respeito e garantia, e não somente a existência formal de leis nacionais."],["Comissão e Corte","O art. 33 identifica Comissão e Corte Interamericanas como órgãos competentes quanto aos compromissos convencionais. A Comissão recebe petições e desempenha funções de promoção e monitoramento; a Corte exerce funções jurisdicionais e consultivas conforme seus pressupostos."]],"map":["OEA → sistema regional","CADH → Pacto de São José","Art. 8º → garantias judiciais","Comissão ≠ Corte"]},{"t":"Petições, admissibilidade e Corte Interamericana","ref":"CADH, arts. 44 a 51 e 61 a 69","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm","lessons":[["Petição individual","Pessoas, grupos e entidades não governamentais legalmente reconhecidas em Estado membro da OEA podem apresentar petições à Comissão nos termos do art. 44. Não é necessário que a pessoa que peticiona seja a própria vítima. Isso não equivale a ajuizar diretamente um caso contencioso perante a Corte."],["Admissibilidade","Em regra, exige-se esgotamento dos recursos internos e apresentação dentro de seis meses da notificação da decisão definitiva. Existem exceções, como inexistência de devido processo, impedimento de acesso aos recursos e demora injustificada. Também se examina duplicidade internacional e os demais requisitos."],["Julgamento e reparações","Estados-partes e Comissão podem submeter casos à Corte conforme o art. 61 e a jurisdição reconhecida. As sentenças são definitivas e obrigatórias para os Estados que sejam partes no caso, nos termos da Convenção. Reparações podem incluir indenizações, medidas de investigação, reconhecimento e garantias de não repetição."]],"map":["Pessoa → petição à Comissão","Admissibilidade → regra e exceções","Corte → Estados e Comissão","Sentença → cumprimento pelo Estado parte"]},{"t":"Incorporação, hierarquia e convencionalidade","ref":"CF, art. 5º, §§ 2º a 4º; Decreto 6.949/2009","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Incorporação e aprovação qualificada","O procedimento interno de incorporação de tratados envolve as competências constitucionais pertinentes. Tratados de direitos humanos aprovados em cada Casa do Congresso em dois turnos por três quintos dos membros equivalem a emendas constitucionais. A Convenção sobre Direitos das Pessoas com Deficiência é exemplo."],["Supralegalidade","Segundo a orientação do STF no RE 466.343, tratados de direitos humanos incorporados sem o rito do art. 5º, § 3º, possuem status supralegal: acima da legislação ordinária e abaixo da Constituição. A Súmula Vinculante 25 considera ilícita a prisão civil do depositário infiel, qualquer que seja a modalidade de depósito."],["Controle de convencionalidade","A análise de compatibilidade das normas internas com obrigações internacionais de direitos humanos complementa o controle constitucional. É importante diferenciar hierarquia doméstica de responsabilidade internacional: o Estado não pode simplesmente justificar o descumprimento de tratado por referência à sua lei interna."]],"map":["Rito qualificado → equivalência a emenda","Demais tratados de DH → supralegalidade segundo STF","SV 25 → depositário infiel","Convencionalidade → compatibilidade com tratado"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm"},{"t":"Igualdade, discriminação e grupos vulnerabilizados","ref":"Convenção sobre Direitos das Pessoas com Deficiência; Convenção contra Discriminação Racial","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm","lessons":[["Igualdade material","Igualdade não significa ignorar barreiras que impedem o exercício de direitos. Medidas destinadas a remover desigualdades podem ser legítimas conforme seus fundamentos e proporcionalidade. A proteção contra discriminação alcança situações de exclusão direta e indireta nos regimes aplicáveis."],["Deficiência e acessibilidade","A Convenção adota perspectiva que considera impedimentos em interação com barreiras. Acessibilidade e adaptações razoáveis promovem participação em igualdade de condições. Deficiência não implica automaticamente incapacidade civil; as medidas de apoio devem respeitar autonomia, vontade e preferências."],["Racismo e discriminação","A Convenção internacional contra discriminação racial exige medidas de prevenção e combate a práticas discriminatórias. A igualdade perante a lei deve ser efetiva, abrangendo direitos civis, políticos e sociais. A Convenção Interamericana contra o Racismo também foi incorporada pelo Brasil com aprovação qualificada."]],"map":["Igualdade → remoção de barreiras","Acessibilidade → participação","Deficiência ≠ incapacidade automática","Racismo → dever de prevenção e combate"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/1950-1969/d65810.html"},{"t":"Proteção de mulheres, crianças e pessoas refugiadas","ref":"Convenção de Belém do Pará; Lei 9.474/1997; Convenção sobre os Direitos da Criança","url":"https://www.planalto.gov.br/ccivil_03/decreto/1996/d1973.htm","lessons":[["Violência contra mulheres","A Convenção de Belém do Pará orienta prevenção, punição e erradicação da violência contra a mulher. A violência pode ocorrer no âmbito público ou privado. O Estado tem deveres de proteção e atuação diligente, sem reduzir a questão à existência de uma relação doméstica formal."],["Direitos da criança","O interesse superior da cr
