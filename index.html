lessons":[["Responsabilidade objetiva","A Constituição prevê responsabilidade das pessoas jurídicas de direito público e prestadoras de serviços públicos por danos causados por seus agentes nessa qualidade. A vítima precisa demonstrar dano e nexo causal conforme o regime pertinente; a dispensa de prova da culpa não significa responsabilidade por qualquer evento."],["Omissões e regresso","Omissões estatais exigem exame da obrigação de agir, do nexo e da jurisprudência pertinente. Não há fórmula única aplicável indistintamente a todas elas. A ação regressiva contra agente depende de dolo ou culpa. O Tema 940 do STF orienta a legitimidade passiva nas ações indenizatórias abrangidas pela tese."],["Bens públicos","Bens de uso comum, de uso especial e dominicais possuem regimes distintos. Bens afetados ao uso comum ou especial não são alienáveis enquanto conservam essa qualificação. Bens dominicais podem ser alienados nas condições legais; nenhuma dessas categorias se adquire por usucapião."]],"map":["Dano + nexo → examinar imputação","Regresso → dolo ou culpa","Bens afetados → proteção especial","Bem público → sem usucapião"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Controle, processo administrativo e improbidade","ref":"Lei 8.429/1992; Lei 9.784/1999; CF, arts. 70 a 75","url":"https://www.planalto.gov.br/ccivil_03/leis/l8429compilada.htm","lessons":[["Controle da administração","O controle interno ocorre no âmbito da própria estrutura administrativa. O controle externo é exercido nos termos constitucionais pelo Legislativo com auxílio dos Tribunais de Contas, sem excluir o controle judicial. A fiscalização examina legalidade, legitimidade, economicidade e outros aspectos definidos na Constituição."],["Processo administrativo","O processo federal observa motivação, contraditório, acesso aos autos e demais garantias pertinentes. Recursos administrativos têm regras próprias; não se deve importar automaticamente os prazos do CPC. Impedimento e suspeição protegem imparcialidade dos responsáveis pela decisão."],["Improbidade administrativa","A Lei 14.230/2021 reformou a Lei 8.429/1992. O regime atual exige conduta dolosa tipificada, não bastando mera irregularidade ou voluntariedade. Distinga enriquecimento ilícito, dano ao erário e violação aos princípios nos tipos legais. A aplicação temporal e as questões processuais exigem estudo de precedentes, incluindo Tema 1199 e ADIs 7042 e 7043 do STF."]],"map":["Controle externo → Legislativo e Tribunais de Contas","Processo → garantias","Improbidade → dolo e tipicidade","Ilegalidade ≠ improbidade automaticamente"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"}];const adminQuestions=[{"id":7001,"s":6,"module":0,"topic":"Princípios e regime jurídico administrativo","difficulty":"Intermediária","q":"Uma campanha institucional financiada pelo Município utiliza imagens do prefeito para sua promoção pessoal. Qual princípio é diretamente violado?","a":["Autonomia privada","Impessoalidade","Anterioridade tributária","Livre concorrência"],"ok":1,"e":"A publicidade institucional não pode servir à promoção pessoal de agentes públicos, conforme art. 37, § 1º, da CF.","src":"CF, art. 37; Lei 9.784/1999, art. 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7002,"s":6,"module":0,"topic":"Princípios e regime jurídico administrativo","difficulty":"Intermediária","q":"Uma autoridade escolhe sanção claramente excessiva diante de infração de pequena gravidade, sem justificativa legal. Qual princípio deve orientar a revisão?","a":["Proporcionalidade","Soberania nacional","Indivisibilidade do mandato","Irretroatividade eleitoral"],"ok":0,"e":"A proporcionalidade limita o exercício do poder administrativo, inclusive quanto à adequação entre meios e fins (Lei 9.784/1999, art. 2º).","src":"Lei 9.784/1999, art. 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7003,"s":6,"module":1,"topic":"Organização administrativa e entidades","difficulty":"Intermediária","q":"Um ministério distribui atribuições entre departamentos internos, sem criar outra pessoa jurídica. Qual técnica foi utilizada?","a":["Concessão","Privatização","Desconcentração","Descentralização por outorga"],"ok":2,"e":"A divisão interna de atribuições entre órgãos da mesma pessoa jurídica constitui desconcentração.","src":"CF, art. 37, XIX; Decreto-Lei 200/1967","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del0200.htm"},{"id":7004,"s":6,"module":1,"topic":"Organização administrativa e entidades","difficulty":"Intermediária","q":"Segundo o art. 37, XIX, da CF, como se cria uma autarquia?","a":["Por contrato privado","Por decisão administrativa sem lei","Por autorização verbal","Por lei específica"],"ok":3,"e":"A Constituição exige lei específica para criar autarquia, distinguindo-a da autorização legislativa para instituição de outras entidades.","src":"CF, art. 37, XIX","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7005,"s":6,"module":2,"topic":"Poderes administrativos e abuso de poder","difficulty":"Intermediária","q":"Autoridade competente remove servidor exclusivamente para puni-lo informalmente, usando a remoção para finalidade alheia à prevista em lei. Qual vício se evidencia?","a":["Desvio de finalidade","Ausência de personalidade jurídica","Prescrição tributária","Desconcentração administrativa"],"ok":0,"e":"A competência foi usada para objetivo incompatível com sua finalidade legal, caracterizando desvio de poder.","src":"Lei 9.784/1999, arts. 2º e 11 a 17; CTN, art. 78","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7006,"s":6,"module":2,"topic":"Poderes administrativos e abuso de poder","difficulty":"Intermediária","q":"No processo administrativo federal, pode ser delegada a decisão de recurso administrativo?","a":["Sim, sempre","Sim, se for oral","Sim, se o recorrente concordar","Não, a Lei 9.784/1999 veda essa delegação"],"ok":3,"e":"O art. 13, II, impede delegação da decisão de recursos administrativos.","src":"Lei 9.784/1999, arts. 2º e 11 a 17; CTN, art. 78","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7007,"s":6,"module":3,"topic":"Atos administrativos e controle de validade","difficulty":"Intermediária","q":"A administração reconhece que um ato é ilegal. Qual instituto é adequado para sua retirada, observados os limites jurídicos?","a":["Revogação por mera conveniência","Anulação","Concessão de serviço","Desapropriação"],"ok":1,"e":"O art. 53 distingue o dever de anular atos ilegais e a possibilidade de revogar atos válidos por conveniência ou oportunidade.","src":"Lei 9.784/1999, arts. 50 e 53 a 55","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7008,"s":6,"module":3,"topic":"Atos administrativos e controle de validade","difficulty":"Intermediária","q":"Qual é, em regra, o prazo da administração federal para anular ato que produziu efeitos favoráveis ao destinatário de boa-fé?","a":["Um ano","Dois anos","Cinco anos","Prazo ilimitado"],"ok":2,"e":"O art. 54 da Lei 9.784/1999 estabelece decadência de cinco anos, salvo comprovada má-fé, e prevê regras próprias para efeitos patrimoniais contínuos.","src":"Lei 9.784/1999, arts. 50 e 53 a 55","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"id":7009,"s":6,"module":4,"topic":"Agentes públicos e servidores","difficulty":"Intermediária","q":"Qual a finalidade constitucional dos cargos em comissão?","a":["Qualquer atividade rotineira permanente indistintamente","Substituir todos os concursos públicos","Atribuições de direção, chefia e assessoramento","Garantir estabilidade desde a nomeação"],"ok":2,"e":"O art. 37, V, destina cargos em comissão e funções de confiança às atribuições de direção, chefia e assessoramento.","src":"CF, arts. 37 a 41; Lei 8.112/1990","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7010,"s":6,"module":4,"topic":"Agentes públicos e servidores","difficulty":"Intermediária","q":"O servidor nomeado para cargo efetivo mediante concurso completa três anos de exercício. Qual requisito também deve observar para aquisição da estabilidade?","a":["Filiação partidária","Autorização do sindicato","Pagamento de contribuição extraordinária","Avaliação especial de desempenho"],"ok":3,"e":"O art. 41, § 4º, exige avaliação especial de desempenho por comissão instituída para essa finalidade.","src":"CF, arts. 37 a 41; Lei 8.112/1990","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7011,"s":6,"module":5,"topic":"Licitações e contratações diretas","difficulty":"Intermediária","q":"A administração verifica inviabilidade de competição devidamente demonstrada para determinado objeto. Qual instituto de contratação direta é pertinente?","a":["Revogação","Inexigibilidade","Concurso público","Pregão obrigatório"],"ok":1,"e":"O art. 74 prevê inexigibilidade quando a competição não é viável, respeitados os requisitos de instrução da contratação.","src":"Lei 14.133/2021, arts. 17, 28, 33 e 72 a 75","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"},{"id":7012,"s":6,"module":5,"topic":"Licitações e contratações diretas","difficulty":"Intermediária","q":"Qual das opções é modalidade de licitação prevista no art. 28 da Lei 14.133/2021?","a":["Tomada de preços","Convite","Diálogo competitivo","Menor preço"],"ok":2,"e":"Diálogo competitivo integra as modalidades da lei; menor preço é critério de julgamento. Convite e tomada de preços pertenciam ao regime anterior.","src":"Lei 14.133/2021, arts. 17, 28, 33 e 72 a 75","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"},{"id":7013,"s":6,"module":6,"topic":"Contratos administrativos","difficulty":"Intermediária","q":"A administração modifica unilateralmente o contrato, aumentando encargos do contratado. O que deve observar?","a":["Preservar o equilíbrio econômico-financeiro, nos termos legais","Excluir automaticamente qualquer pagamento adicional","Ignorar a equação inicial","Exigir renúncia obrigatória a direitos"],"ok":0,"e":"O art. 130 exige restabelecimento do equilíbrio inicial no mesmo termo aditivo quando alteração unilateral aumentar ou diminuir encargos.","src":"Lei 14.133/2021, arts. 89 a 154","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"},{"id":7014,"s":6,"module":6,"topic":"Contratos administrativos","difficulty":"Intermediária","q":"O poder de fiscalizar contratos administrativos permite aplicação de sanção sem oportunidade de defesa?","a":["Sim, em qualquer caso","Sim, se a fiscalização for terceirizada","Sim, mediante simples mensagem","Não; devem ser respeitadas as garantias e o procedimento legal"],"ok":3,"e":"A responsabilização contratual deve respeitar contraditório, ampla defesa e as regras legais de aplicação das sanções.","src":"Lei 14.133/2021, arts. 89 a 154","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm"},{"id":7015,"s":6,"module":7,"topic":"Serviços públicos e delegação","difficulty":"Intermediária","q":"A retomada de concessão durante seu prazo por interesse público, mediante lei autorizativa específica e prévia indenização, caracteriza qual instituto?","a":["Caducidade","Falência","Encampação","Convalidação"],"ok":2,"e":"O art. 37 da Lei 8.987/1995 define encampação e suas condições.","src":"CF, art. 175; Lei 8.987/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l8987compilada.htm"},{"id":7016,"s":6,"module":7,"topic":"Serviços públicos e delegação","difficulty":"Intermediária","q":"A delegação de serviço público por concessão extingue o dever de fiscalização do poder concedente?","a":["Sim, sempre","Não, o poder concedente mantém atribuições de fiscalização","Sim, após o primeiro ano","Sim, se a concessionária for privada"],"ok":1,"e":"O art. 29 atribui ao poder concedente competências de regulamentação e fiscalização, entre outras.","src":"CF, art. 175; Lei 8.987/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l8987compilada.htm"},{"id":7017,"s":6,"module":8,"topic":"Responsabilidade civil do Estado e bens públicos","difficulty":"Intermediária","q":"O Estado indeniza terceiro por dano causado por seu agente nessa qualidade. Qual requisito subjetivo permite ação regressiva contra o agente?","a":["Apenas a existência do cargo","Dolo ou culpa","Ausência de concurso público","Vontade unilateral da vítima"],"ok":1,"e":"O art. 37, § 6º, exige dolo ou culpa para o direito de regresso contra o responsável.","src":"CF, art. 37, § 6º; Código Civil, arts. 98 a 103","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":7018,"s":6,"module":8,"topic":"Responsabilidade civil do Estado e bens públicos","difficulty":"Intermediária","q":"É possível adquirir bem público dominical por usucapião?","a":["Sim, após cinco anos","Sim, se desocupado","Sim, com boa-fé","Não, bens públicos não são usucapíveis"],"ok":3,"e":"O art. 102 do Código Civil veda usucapião de bens públicos, inclusive dominicais.","src":"CC, art. 102","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":7019,"s":6,"module":9,"topic":"Controle, processo administrativo e improbidade","difficulty":"Intermediária","q":"Uma falha administrativa meramente culposa, sem dolo, é automaticamente improbidade nos tipos dos arts. 9º, 10 e 11 da redação atual da Lei 8.429?","a":["Não, o regime exige conduta dolosa tipificada","Sim, qualquer erro é improbidade","Sim, mesmo sem enquadramento legal","Sim, se houver crítica pública"],"ok":0,"e":"A redação atual do art. 1º, §§ 1º a 3º, exige dolo nos tipos legais e distingue atuação irregular de improbidade.","src":"Lei 8.429/1992; Lei 9.784/1999; CF, arts. 70 a 75","url":"https://www.planalto.gov.br/ccivil_03/leis/l8429compilada.htm"},{"id":7020,"s":6,"module":9,"topic":"Controle, processo administrativo e improbidade","difficulty":"Intermediária","q":"Na esfera federal, qual órgão auxilia o Congresso Nacional no exercício do controle externo previsto no art. 71 da Constituição?","a":["Conselho Nacional de Justiça","Supremo Tribunal Federal","Tribunal de Contas da União","Ministério da Fazenda exclusivamente"],"ok":2,"e":"O art. 71 atribui ao Congresso o controle externo com auxílio do Tribunal de Contas da União.","src":"CF, art. 71","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const taxModules=[{"t":"Sistema tributário e espécies de tributos","ref":"CTN, arts. 3º a 5º; CF, arts. 145, 148 e 149","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Conceito de tributo","O tributo é prestação pecuniária compulsória instituída em lei, que não constitui sanção por ato ilícito, cobrada mediante atividade administrativa vinculada. A multa por infração não é tributo, embora possa integrar crédito tributário. A natureza jurídica não decorre simplesmente do nome usado pela norma."],["Espécies tributárias","Na classificação constitucional em cinco espécies, distinguem-se impostos, taxas, contribuição de melhoria, empréstimos compulsórios e contribuições especiais. Impostos independem de atividade estatal específica relativa ao contribuinte. Taxas relacionam-se ao poder de polícia ou ao serviço público específico e divisível."],["Tributos vinculados","Contribuição de melhoria relaciona-se à valorização imobiliária decorrente de obra pública, observados limites legais. Empréstimo compulsório é de competência da União e exige lei complementar nas hipóteses constitucionais. Contribuições especiais têm finalidades e regimes constitucionalmente determinados."]],"map":["Tributo ≠ multa","Imposto → fato independente de atuação estatal específica","Taxa → polícia ou serviço específico e divisível","Empréstimo compulsório → União e LC"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Competência tributária e repartição de receitas","ref":"CF, arts. 145 a 162; CTN, arts. 6º a 8º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Competência e capacidade ativa","Competência tributária é poder constitucional de instituir tributos e não pode ser livremente transferida. A atribuição de funções administrativas de arrecadação ou fiscalização a outra pessoa jurídica de direito público segue regras distintas. Não confunda titularidade da competência com execução das tarefas administrativas."],["Distribuição constitucional","A Constituição discrimina competências federais, estaduais, distritais e municipais. O Distrito Federal reúne competências estaduais e municipais. O IBS tem competência compartilhada entre Estados, Distrito Federal e Municípios, nos termos da reforma tributária; não é simples reprodução do ICMS ou do ISS."],["Repartição de receitas","Receber parcela da arrecadação de tributo alheio não transfere competência legislativa ao ente beneficiário. Os mecanismos constitucionais de distribuição e fundos de participação buscam financiar entes federativos. Analise separadamente quem institui, quem administra e quem recebe os recursos."]],"map":["Competência → instituição por ente constitucionalmente autorizado","Capacidade ativa → atribuições administrativas","DF → competências estaduais e municipais","Repartição → receita, não competência"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"t":"Limitações ao poder de tributar","ref":"CF, arts. 150 a 152","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Legalidade e igualdade","Instituição e majoração de tributo dependem de lei, ressalvadas as exceções constitucionais. Igualdade tributária impede diferenciações arbitrárias entre contribuintes em situações equivalentes. Capacidade contributiva orienta a graduação dos impostos sempre que possível."],["Anterioridade e irretroatividade","Irretroatividade protege fatos anteriores à vigência da norma instituidora ou majoradora. Anterioridade anual e noventena são limites distintos, com exceções específicas. Para resolver questões, identifique tributo, alteração, data de publicação e exceções antes de calcular quando pode ser exigido."],["Imunidades e não confisco","Imunidade é limitação constitucional à competência, distinta de isenção legal. A imunidade recíproca protege patrimônio, renda e serviços dos entes nas condições constitucionais, com extensões e ressalvas. A vedação ao confisco exige análise da carga e das circunstâncias, não um percentual universal."]],"map":["Legalidade → lei e exceções constitucionais","Anterioridade anual ≠ noventena","Irretroatividade → fato anterior","Imunidade → Constituição"]},{"t":"Legislação, interpretação e vigência tributária","ref":"CTN, arts. 96 a 112","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Fontes normativas","Legislação tributária compreende leis, tratados, decretos e normas complementares pertinentes, dentro de seus limites de validade. Matérias reservadas à lei não podem ser criadas livremente por regulamento. A função do decreto é delimitada pela lei que regulamenta."],["Integração e interpretação","O CTN disciplina meios de integração quando falta disposição expressa. A analogia não pode resultar na exigência de tributo não previsto em lei; a equidade não autoriza dispensar tributo devido. A interpretação literal do art. 111 é exigida nas matérias expressamente indicadas, sem substituir a análise sistemática."],["Aplicação temporal","As regras de aplicação da legislação tributária distinguem fatos geradores futuros, pendentes e hipóteses de retroatividade legalmente admitidas. Normas sancionatórias mais favoráveis podem retroagir em atos ainda não definitivamente julgados, nos termos do art. 106. Não aplique automaticamente a retroatividade penal a todo tributo."]],"map":["Lei → matérias reservadas","Decreto → limites legais","Analogia → não cria tributo","Sanção mais favorável → hipóteses do art. 106"]},{"t":"Obrigação tributária, fato gerador e sujeitos","ref":"CTN, arts. 113 a 127","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Principal e acessória","A obrigação principal envolve pagamento de tributo ou penalidade pecuniária. A acessória consiste em deveres positivos ou negativos de interesse da arrecadação ou fiscalização. A inobservância de obrigação acessória pode originar obrigação principal relativa à penalidade, sem transformar a multa em tributo."],["Fato gerador","É a situação definida na legislação cuja ocorrência produz consequências tributárias. Diferencie hipótese abstrata de incidência e fato concretamente ocorrido. O momento de ocorrência depende da natureza da situação e das regras legais. A validade civil do negócio não resolve, isoladamente, todos os problemas de incidência."],["Sujeito ativo e passivo","Sujeito ativo é a pessoa jurídica de direito público titular da competência para exigir a prestação, no sentido do CTN. Contribuinte mantém relação pessoal e direta com o fato gerador; responsável possui dever decorrente de disposição expressa de lei. Convenções particulares não alteram, em regra, a definição legal perante a Fazenda."]],"map":["Principal → tributo ou multa","Acessória → dever instrumental","Contribuinte → relação direta","Responsável → disposição legal"]},{"t":"Responsabilidade e sucessão tributária","ref":"CTN, arts. 128 a 138","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Responsabilidade por lei","O dever de terceiro pelo crédito tributário exige previsão legal e vínculo com o fato gerador nos termos do art. 128. A responsabilidade pode excluir a do contribuinte ou atribuí-la supletivamente, conforme o regime aplicável. Não presuma que todos os responsáveis respondem nas mesmas condições."],["Sucessão","A transferência de bens e estabelecimentos pode produzir responsabilidade por créditos anteriores, observadas hipóteses legais, ressalvas e limites. Em aquisição de imóvel, o art. 130 disciplina sub-rogação de determinados créditos no adquirente, com tratamento próprio para arrematação em hasta pública."],["Terceiros e infrações","A responsabilidade pessoal do art. 135 exige os pressupostos ali previstos, como atos com excesso de poderes ou infração de lei, contrato social ou estatutos. Mero inadimplemento da sociedade não basta, por si só, para responsabilizar administrador. A denúncia espontânea tem requisitos próprios e não cabe após início de procedimento relacionado à infração."]],"map":["Terceiro → previsão legal","Sucessão → hipóteses e limites","Art. 135 → atos qualificados","Denúncia espontânea → anterior à fiscalização pertinente"]},{"t":"Crédito tributário e modalidades de lançamento","ref":"CTN, arts. 139 a 150","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Constituição do crédito","A obrigação surge com o fato gerador; o lançamento constitui o crédito nos termos legais, verificando a ocorrência, calculando o montante e identificando o sujeito passivo. Em tributos sujeitos a declaração, a jurisprudência reconhece constituição do crédito pela declaração do débito pelo contribuinte em hipóteses pertinentes."],["Modalidades","No lançamento de ofício, a autoridade realiza o procedimento nas hipóteses legais. No lançamento por declaração, informações do sujeito passivo ou terceiro subsidiam a autoridade. Na homologação, o sujeito passivo antecipa pagamento sem exame prévio, cabendo à autoridade homologá-lo nos termos legais."],["Revisão e notificação","Lançamento regularmente notificado pode ser alterado apenas nas hipóteses legais. Mudança de critério jurídico tem limites temporais para o mesmo sujeito passivo. Erro de fato e erro de direito exigem análise distinta, e o prazo decadencial limita a constituição e revisão do crédito."]],"map":["Fato gerador → obrigação","Lançamento → constituição do crédito","Declaração → informações","Homologação → antecipação e controle posterior"]},{"t":"Suspensão, extinção e exclusão do crédito","ref":"CTN, arts. 151 a 182","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Suspensão da exigibilidade","Moratória, depósito integral, reclamações e recursos administrativos nos termos legais, liminares ou tutelas previstas e parcelamento são causas de suspensão. O crédito não desaparece apenas por estar suspenso. A suspensão não dispensa deveres acessórios dependentes da obrigação principal."],["Extinção","Pagamento, compensação, transação, remissão, prescrição e decadência estão entre as causas legais de extinção. A compensação depende das condições previstas em lei, e a dação de imóvel em pagamento exige forma e condições legais. Distinga extinção do simples adiamento da cobrança."],["Exclusão e prazos","Isenção e anistia excluem o crédito nas condições legais: a anistia refere-se a infrações anteriores à lei concessiva, com ressalvas. Decadência limita a constituição do crédito; prescrição limita sua cobrança após constituição definitiva. Os termos iniciais dependem da modalidade e das circunstâncias; consulte o CTN consolidado."]],"map":["Suspensão → exigibilidade paralisada","Parcelamento → suspensão","Pagamento → extinção","Isenção e anistia → exclusão"]},{"t":"Administração tributária, garantias e execução fiscal","ref":"CTN, arts. 183 a 208; Lei 6.830/1980","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm","lessons":[["Fiscalização e sigilo","A fiscalização exerce poderes legalmente previstos para verificar obrigações tributárias. O sigilo fiscal protege informações obtidas em razão do ofício, com exceções legais. O acesso a informações não elimina deveres de finalidade, segurança e proteção de dados pertinentes."],["Certidões e dívida ativa","A inscrição em dívida ativa observa requisitos legais e permite emissão de título executivo. A presunção de certeza e liquidez é relativa. Certidão negativa comprova regularidade nas condições legais; certidão positiva com efeitos de negativa pode ser expedida em situações previstas no art. 206, como exigibilidade suspensa."],["Execução fiscal","A Lei 6.830/1980 disciplina cobrança judicial de dívida ativa. A defesa pode envolver embargos, nos requisitos legais, ou exceção de pré-executividade em hipóteses jurisprudenciais próprias. Não confunda o prazo de pagamento após citação com prazo de embargos. A análise de prescrição intercorrente exige atenção à suspensão e aos marcos legais e jurisprudenciais."]],"map":["Fiscalização → limites legais","CDA → presunção relativa","Exigibilidade suspensa → certidão positiva com efeitos de negativa","Execução → LEF e aplicação subsidiária do CPC"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l6830.htm"},{"t":"Impostos e reforma tributária do consumo","ref":"CF, arts. 153 a 156-A e 195; EC 132/2023; LC 214/2025 e LC 227/2026","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp214compilado.htm","lessons":[["Tributos tradicionais e transição","A União, os Estados e os Municípios têm competências específicas, como IR, ICMS e IPTU, respectivamente. A EC 132/2023 reformulou a tributação do consumo, com implementação gradual. Os regimes antigos e novos coexistem durante a transição; a data de referência da questão é indispensável."],["IBS, CBS e Imposto Seletivo","O IBS tem competência compartilhada de Estados, DF e Municípios; a CBS é contribuição federal. Ambos integram o novo modelo de tributação do consumo. O Imposto Seletivo é federal e possui finalidade e incidências constitucionais próprias. A LC 214/2025 disciplina os novos tributos e deve ser lida na redação consolidada."],["Governança e regimes","A LC 227/2026 institui o Comitê Gestor do IBS, disciplina o processo administrativo do imposto, a distribuição da arrecadação e normas gerais de ITCMD, entre outras alterações. Regras de transição, créditos, regimes diferenciados e obrigações acessórias devem ser estudados na legislação atual e na regulamentação pertinente. Não confunda alíquota de referência com alíquota universal definitiva."]],"map":["EC 132 → novo modelo","IBS → Estados, DF e Municípios","CBS e IS → União","LC 227 → Comitê Gestor e processo do IBS"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp227.htm"}];const taxQuestions=[{"id":8001,"s":7,"module":0,"topic":"Sistema tributário e espécies de tributos","difficulty":"Intermediária","q":"Um Município cria cobrança denominada taxa baseada exclusivamente na propriedade de imóvel, sem serviço específico divisível nem poder de polícia. A denominação basta para classificá-la como taxa?","a":["Sim, pois o nome define a espécie","Não, é necessário examinar o fato gerador e o regime constitucional","Sim, se a cobrança for anual","Sim, se aprovada por decreto"],"ok":1,"e":"A natureza da cobrança depende de sua estrutura jurídica; taxas exigem os pressupostos do art. 145, II, da CF e art. 77 do CTN.","src":"CTN, arts. 3º a 5º; CF, arts. 145, 148 e 149","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8002,"s":7,"module":0,"topic":"Sistema tributário e espécies de tributos","difficulty":"Intermediária","q":"Uma sanção pecuniária aplicada por descumprimento de obrigação tributária é, por essa razão, um tributo?","a":["Sim, todo pagamento obrigatório é tributo","Sim, se destinada à União","Não, tributo não constitui sanção de ato ilícito","Sim, se houver lançamento"],"ok":2,"e":"O art. 3º do CTN distingue tributo de sanção por ilícito. A multa pode integrar obrigação tributária principal sem se tornar espécie tributária.","src":"CTN, arts. 3º a 5º; CF, arts. 145, 148 e 149","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8003,"s":7,"module":1,"topic":"Competência tributária e repartição de receitas","difficulty":"Intermediária","q":"O Município recebe parcela da arrecadação de imposto de competência estadual. Isso transfere ao Município o poder de instituir esse imposto?","a":["Não, repartição de receita não transfere competência","Sim, integralmente","Sim, desde que por decreto municipal","Sim, após cinco anos"],"ok":0,"e":"A repartição constitucional de receitas não altera a competência para instituir tributos, conforme a estrutura da CF e do CTN.","src":"CF, arts. 145 a 162; CTN, arts. 6º a 8º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":8004,"s":7,"module":1,"topic":"Competência tributária e repartição de receitas","difficulty":"Intermediária","q":"O não exercício de competência tributária por determinado ente transfere automaticamente essa competência a outro?","a":["Sim, sempre","Sim, se o outro ente arrecadar mais","Sim, após um exercício financeiro","Não, conforme o art. 8º do CTN"],"ok":3,"e":"O art. 8º do CTN determina que o não exercício da competência não a defere a pessoa jurídica de direito público diversa.","src":"CTN, art. 8º","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8005,"s":7,"module":2,"topic":"Limitações ao poder de tributar","difficulty":"Intermediária","q":"Uma lei institui imposto sujeito simultaneamente às anterioridades anual e nonagesimal, sem exceção aplicável. Basta aguardar o início do exercício seguinte?","a":["Sim, sempre","Não, é preciso respeitar também a noventena","Sim, se o contribuinte concordar","Não, pois deve aguardar sempre dois anos"],"ok":1,"e":"As duas limitações do art. 150, III, b e c, devem ser respeitadas quando aplicáveis cumulativamente.","src":"CF, arts. 150 a 152","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":8006,"s":7,"module":2,"topic":"Limitações ao poder de tributar","difficulty":"Intermediária","q":"Qual a diferença central entre imunidade e isenção?","a":["Ambas são exclusivamente multas","Imunidade depende sempre de decreto","Isenção extingue a competência constitucional","Imunidade limita constitucionalmente a competência; isenção decorre de lei"],"ok":3,"e":"A imunidade decorre da Constituição; a isenção integra disciplina legal de exclusão do crédito, conforme CTN.","src":"CF, arts. 150 a 152","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":8007,"s":7,"module":3,"topic":"Legislação, interpretação e vigência tributária","difficulty":"Intermediária","q":"Na ausência de previsão legal de determinado tributo, a administração pode criá-lo por analogia?","a":["Sim, se houver fato semelhante","Sim, para completar receita pública","Não, a analogia não pode resultar em exigência de tributo não previsto em lei","Sim, mediante parecer interno"],"ok":2,"e":"O art. 108, § 1º, do CTN veda a criação dessa exigência por analogia.","src":"CTN, arts. 96 a 112","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8008,"s":7,"module":3,"topic":"Legislação, interpretação e vigência tributária","difficulty":"Intermediária","q":"Qual regra aplica-se a ato ainda não definitivamente julgado quando lei posterior comina penalidade menos severa?","a":["Pode retroagir nas condições do art. 106 do CTN","Jamais retroage","Extingue automaticamente todo o tributo","Depende de aprovação do contribuinte"],"ok":0,"e":"O art. 106, II, c, admite aplicação retroativa da penalidade menos severa a ato não definitivamente julgado.","src":"CTN, arts. 96 a 112","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8009,"s":7,"module":4,"topic":"Obrigação tributária, fato gerador e sujeitos","difficulty":"Intermediária","q":"O locador e o locatário convencionam que o locatário pagará IPTU. Sem alteração legal, esse contrato modifica a sujeição passiva perante o Fisco?","a":["Sim, automaticamente","Não, convenções privadas não se opõem à Fazenda para modificar a definição legal, salvo disposição legal em contrário","Sim, se reconhecido em cartório","Sim, porque todo contrato altera a lei tributária"],"ok":1,"e":"O art. 123 do CTN preserva a definição legal da sujeição passiva diante de convenções particulares.","src":"CTN, arts. 113 a 127","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8010,"s":7,"module":4,"topic":"Obrigação tributária, fato gerador e sujeitos","difficulty":"Intermediária","q":"A entrega de declaração fiscal sem pagamento de valor, quando exigida pela legislação, é exemplo de quê?","a":["Imunidade","Empréstimo compulsório","Obrigação acessória","Extinção do crédito por compensação"],"ok":2,"e":"O art. 113, § 2º, contempla prestações positivas ou negativas de interesse da arrecadação e fiscalização.","src":"CTN, arts. 113 a 127","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8011,"s":7,"module":5,"topic":"Responsabilidade e sucessão tributária","difficulty":"Intermediária","q":"A sociedade apenas deixa de pagar tributo, sem demonstração de atos do administrador enquadráveis no art. 135. O inadimplemento isolado gera automaticamente responsabilidade pessoal?","a":["Sim, de todos os sócios","Sim, se houver lucro","Não, o mero inadimplemento não basta","Sim, de qualquer empregado"],"ok":2,"e":"A responsabilidade do administrador exige os pressupostos legais. A Súmula 430 do STJ afasta a imputação automática por mero inadimplemento.","src":"CTN, arts. 128 a 138","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8012,"s":7,"module":5,"topic":"Responsabilidade e sucessão tributária","difficulty":"Intermediária","q":"O contribuinte comunica infração após início de procedimento fiscal diretamente relacionado a ela. A comunicação é espontânea para fins do art. 138?","a":["Sim, sempre","Sim, se realizada no mesmo dia","Sim, desde que verbal","Não, após o início do procedimento relacionado à infração não há espontaneidade"],"ok":3,"e":"O parágrafo único do art. 138 exclui espontaneidade da denúncia apresentada após início de procedimento administrativo ou fiscalização relacionados à infração.","src":"CTN, arts. 128 a 138","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8013,"s":7,"module":6,"topic":"Crédito tributário e modalidades de lançamento","difficulty":"Intermediária","q":"Em qual modalidade há, nos termos do art. 150, antecipação do pagamento pelo sujeito passivo sem prévio exame da autoridade?","a":["Lançamento por homologação","Lançamento por arbitragem privada","Lançamento exclusivamente de ofício","Isenção"],"ok":0,"e":"O art. 150 descreve a modalidade por homologação, com pagamento antecipado e controle administrativo posterior.","src":"CTN, arts. 139 a 150","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8014,"s":7,"module":6,"topic":"Crédito tributário e modalidades de lançamento","difficulty":"Intermediária","q":"O lançamento tributário é atividade administrativa facultativa conforme mera conveniência do fiscal?","a":["Sim, quando o tributo for pequeno","Sim, se o contribuinte pedir","Sim, em qualquer imposto","Não, trata-se de atividade vinculada e obrigatória"],"ok":3,"e":"O parágrafo único do art. 142 qualifica a atividade administrativa de lançamento como vinculada e obrigatória, sob pena de responsabilidade funcional.","src":"CTN, arts. 139 a 150","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8015,"s":7,"module":7,"topic":"Suspensão, extinção e exclusão do crédito","difficulty":"Intermediária","q":"Qual instituto suspende a exigibilidade do crédito tributário, sem extingui-lo automaticamente?","a":["Pagamento integral","Remissão integral","Parcelamento","Decadência consumada"],"ok":2,"e":"O art. 151, VI, inclui parcelamento entre as hipóteses de suspensão.","src":"CTN, arts. 151 a 182","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8016,"s":7,"module":7,"topic":"Suspensão, extinção e exclusão do crédito","difficulty":"Intermediária","q":"Quais institutos são classificados pelo art. 175 como exclusão do crédito tributário?","a":["Isenção e anistia","Prescrição e decadência","Pagamento e compensação","Moratória e parcelamento"],"ok":0,"e":"O art. 175 distingue isenção e anistia das causas de suspensão e extinção.","src":"CTN, arts. 151 a 182","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8017,"s":7,"module":8,"topic":"Administração tributária, garantias e execução fiscal","difficulty":"Intermediária","q":"Um contribuinte possui crédito tributário com exigibilidade suspensa. Qual documento pode obter, atendidos os requisitos do CTN?","a":["Somente certidão positiva sem efeitos","Certidão positiva com efeitos de negativa","Nenhuma certidão em qualquer caso","Certidão de extinção definitiva automática"],"ok":1,"e":"O art. 206 atribui efeitos de certidão negativa à positiva nas hipóteses legais, incluindo exigibilidade suspensa.","src":"CTN, arts. 183 a 208; Lei 6.830/1980","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8018,"s":7,"module":8,"topic":"Administração tributária, garantias e execução fiscal","difficulty":"Intermediária","q":"A presunção de certeza e liquidez da dívida regularmente inscrita é absoluta?","a":["Sim, impede qualquer defesa","Sim, em todos os tributos federais","Sim, salvo autorização do Fisco","Não, pode ser afastada mediante prova inequívoca"],"ok":3,"e":"O art. 204 do CTN prevê presunção relativa, passível de afastamento por prova inequívoca a cargo do sujeito passivo ou terceiro interessado.","src":"CTN, arts. 183 a 208; Lei 6.830/1980","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8019,"s":7,"module":9,"topic":"Impostos e reforma tributária do consumo","difficulty":"Intermediária","q":"Qual ente ou conjunto de entes possui competência compartilhada para o IBS nos termos da reforma?","a":["União exclusivamente","Somente os Municípios","Estados, Distrito Federal e Municípios","Apenas o Senado Federal"],"ok":2,"e":"A competência compartilhada do IBS é estabelecida pelo art. 156-A da Constituição, incluído pela EC 132/2023.","src":"CF, art. 156-A; EC 132/2023","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc132.htm"},{"id":8020,"s":7,"module":9,"topic":"Impostos e reforma tributária do consumo","difficulty":"Intermediária","q":"Qual matéria é diretamente disciplinada pela LC 227/2026?","a":["Comitê Gestor do IBS e processo administrativo tributário do IBS","Criação do Código Penal","Regime geral de casamento","Extinção imediata de todos os impostos antigos"],"ok":0,"e":"A LC 227/2026 trata da governança, do contencioso administrativo e da distribuição do IBS, além de normas gerais de ITCMD e alterações de outras leis.","src":"LC 227/2026","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp227.htm"}];const laborModules=[{"t":"Fontes, princípios e direitos fundamentais","ref":"CF, arts. 7º a 11; CLT, arts. 8º e 9º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Fontes e proteção constitucional","O estudo parte da Constituição, da CLT, das leis especiais, dos instrumentos coletivos e dos precedentes aplicáveis. A proteção trabalhista não elimina a autonomia coletiva nem permite afastar livremente a legislação. É necessário distinguir normas indisponíveis e aquelas que admitem negociação."],["Primazia da realidade","A qualificação da relação depende dos fatos efetivamente comprovados, não apenas do título contratual. O princípio não permite presumir vínculo em qualquer prestação de serviço: os elementos legais devem estar presentes e os regimes especiais precisam ser considerados."],["Fraude e prescrição","Atos destinados a contornar a proteção legal podem ser nulos. A prescrição trabalhista geral combina alcance quinquenal dos créditos com prazo de dois anos após a extinção contratual para ajuizar ação, observadas hipóteses especiais. Distinga a perda da pretensão da inexistência do direito material."]],"map":["Fontes → Constituição e legislação","Realidade → fatos comprovados","Fraude → nulidade","Prescrição → cinco anos, limite bienal"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Relação de emprego e sujeitos","ref":"CLT, arts. 2º a 6º e 10 a 10-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Elementos do vínculo","O empregado é pessoa natural que presta trabalho não eventual, remunerado e subordinado, com pessoalidade. Esses elementos são examinados conjuntamente. A exclusividade não é requisito geral. A subordinação pode manifestar-se por meios digitais, sem exigir presença física."],["Empregador e risco econômico","O empregador organiza a atividade e assume seus riscos. Grupo econômico trabalhista exige os elementos legais, não bastando identidade de sócios. A prestação de serviços a diferentes empresas exige análise concreta do vínculo e da responsabilidade."],["Sucessão e outras relações","Alterações na estrutura jurídica da empresa não afetam automaticamente contratos e direitos dos empregados. Trabalho autônomo, estágio, terceirização e emprego têm regimes distintos. A jurisprudência sobre contratação empresarial deve ser examinada juntamente com a prova de eventual fraude."]],"map":["Empregado → pessoa natural","Vínculo → pessoalidade, onerosidade, não eventualidade e subordinação","Empregador → risco econômico","Grupo → requisitos legais"]},{"t":"Contrato de trabalho e modalidades especiais","ref":"CLT, arts. 442 a 456 e 75-A a 75-F; Lei 11.788/2008","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Prazo e experiência","O contrato por tempo indeterminado constitui a modalidade ordinária. O prazo determinado depende das hipóteses admitidas, com limite geral de dois anos, ressalvados regimes próprios. O contrato de experiência não pode exceder noventa dias, considerando as prorrogações."],["Teletrabalho e intermitente","O teletrabalho tem regime próprio de formalização, equipamentos e organização. Nem todo empregado remoto está excluído do controle de jornada. O contrato intermitente exige forma escrita e alternância entre períodos de prestação e inatividade, observadas as regras legais e jurisprudenciais."],["Estágio e aprendizagem","Estágio regular é ato educativo supervisionado, condicionado aos requisitos da Lei 11.788/2008. Aprendizagem é contrato especial de emprego, com formação técnico-profissional. O descumprimento dos requisitos do estágio pode produzir efeitos trabalhistas conforme o caso, sem afastar limites constitucionais de contratação pública."]],"map":["Indeterminado → modalidade ordinária","Experiência → até 90 dias","Teletrabalho → regime específico","Estágio → finalidade educativa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2008/lei/l11788.htm"},{"t":"Jornada, horas extras e transição constitucional","ref":"CF, art. 7º; EC 141/2026, arts. 1º a 10; CLT, arts. 58 a 75","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc141.htm","lessons":[["Limites e transição de 2026","A EC 141/2026 estabeleceu redução progressiva do limite semanal normal: 42 horas após dois meses da publicação e 40 horas um ano depois dessa primeira etapa, mantido o limite diário constitucional geral de oito horas. Na data de 25/11/2026, o primeiro prazo ainda não havia decorrido. A redução e a ampliação do repouso não autorizam redução salarial. Verifique a data do fato e regimes especiais, inclusive contratos públicos e a exceção do art. 8º da emenda."],["Horas extras e compensação","A remuneração extraordinária tem adicional constitucional mínimo de cinquenta por cento. Banco de horas, compensação e jornadas especiais exigem verificação do instrumento e dos prazos permitidos. Durante a transição, o art. 7º da emenda admite negociação específica para distribuição da jornada, respeitado o repouso. As exclusões de controle de jornada dependem dos requisitos legais."],["Intervalos e repouso","Entre jornadas, a CLT prevê intervalo mínimo geral de onze horas. Na jornada contínua superior a seis horas, o intervalo intrajornada tem regra geral de uma hora, com hipóteses legais de redução. A EC 141/2026 prevê dois dias de repouso semanal a partir de dois meses da publicação e regime compensatório coletivo excepcional; confira a vigência e as regras especiais."]],"map":["Transição → 42h, depois 40h","Horas extras → mínimo de 50%","Interjornada → 11h, regra geral","Repouso → nova regra com vigência diferida"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"t":"Remuneração, salário e equiparação","ref":"CLT, arts. 457 a 467; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Salário e remuneração","Salário corresponde à contraprestação paga pelo empregador; remuneração abrange salário e gorjetas nos termos legais. Comissões e gratificações legais integram o salário conforme art. 457. Ajuda de custo, diárias e prêmios possuem disciplina própria; a denominação não legitima fraude."],["Proteção salarial","O salário não pode sofrer descontos arbitrários. Descontos decorrentes de adiantamentos, lei e instrumentos coletivos têm regras específicas; danos causados pelo empregado exigem os pressupostos do art. 462. Identifique também periodicidade e forma de pagamento."],["Equiparação salarial","A equiparação do art. 461 exige trabalho de igual valor na mesma função, para o mesmo empregador e estabelecimento, considerando produtividade, perfeição técnica e limites temporais. A igualdade salarial entre mulheres e homens também recebe proteção específica, inclusive pela Lei 14.611/2023."]],"map":["Remuneração → salário e gorjetas","Desconto → autorização legal","Equiparação → requisitos cumulativos","Discriminação → vedação"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Férias, décimo terceiro e repousos","ref":"CLT, arts. 129 a 153; Lei 4.090/1962; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Aquisição e concessão de férias","Em regra, o direito às férias é adquirido a cada doze meses de contrato, e a concessão deve ocorrer nos doze meses seguintes. Faltas injustificadas podem alterar a duração conforme a escala legal. As férias anuais remuneradas incluem adicional constitucional mínimo de um terço."],["Fracionamento e pagamento","Com concordância do empregado, as férias podem ser divididas em até três períodos, um de pelo menos quatorze dias corridos e os demais de pelo menos cinco dias cada. Há restrição legal ao início próximo a feriado ou repouso. A remuneração deve ser paga no prazo do art. 145."],["Décimo terceiro e descanso","A gratificação natalina é calculada por duodécimos segundo meses de serviço, com fração de pelo menos quinze dias considerada mês integral. Descanso semanal remunerado e férias são institutos distintos; o novo regime de repousos da EC 141/2026 deve ser observado conforme sua vigência."]],"map":["Aquisição → 12 meses","Concessão → 12 meses seguintes","Fracionamento → 14 + períodos de pelo menos 5 dias","Férias → terço constitucional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l4090.htm"},{"t":"Alteração, suspensão e interrupção contratual","ref":"CLT, arts. 468 a 476-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Alteração contratual","A modificação das condições pactuadas exige, como regra, consentimento e ausência de prejuízo direto ou indireto ao empregado. O poder diretivo admite ajustes dentro dos limites legais. Identifique hipóteses específicas, como reversão de função de confiança, sem generalizar a incorporação de gratificações."],["Transferência","A transferência que implica mudança de domicílio tem limites próprios. A necessidade de serviço e as hipóteses legais devem ser demonstradas quando exigidas. Na transferência provisória nas condições do art. 469, § 3º, é devido adicional enquanto durar a situação."],["Suspensão e interrupção","Na interrupção, em geral, não há prestação de trabalho, mas permanece o pagamento e a contagem do período. Na suspensão, esses efeitos principais ficam paralisados, ressalvadas exceções legais. Afastamentos por doença, férias e licenças exigem classificação conforme o período e o regime aplicável."]],"map":["Alteração → consentimento e sem prejuízo","Transferência → mudança de domicílio","Interrupção → remuneração em regra mantida","Suspensão → efeitos principais paralisados"]},{"t":"Extinção contratual, aviso-prévio e FGTS","ref":"CLT, arts. 477 a 491; Leis 8.036/1990 e 12.506/2011","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Formas de término","Dispensa sem justa causa, pedido de demissão, justa causa, rescisão indireta e acordo têm efeitos diferentes. A justa causa exige enquadramento legal e análise das circunstâncias. Rescisão indireta decorre de falta patronal nas hipóteses do art. 483. A extinção consensual do art. 484-A possui verbas específicas."],["Aviso e quitação","O aviso-prévio proporcional segue a Constituição e a Lei 12.506/2011, com mínimo de trinta dias e acréscimos nos termos legais até noventa dias. O art. 477 prevê prazo geral de dez dias contados do término para entrega de documentos e pagamento das verbas rescisórias."],["FGTS e indenizações","A dispensa sem justa causa normalmente enseja indenização de quarenta por cento dos depósitos do FGTS pertinentes ao contrato, ressalvados regimes especiais. No acordo do art. 484-A, a indenização é reduzida à metade, e o saque tem limite legal de oitenta por cento; não há ingresso no seguro-desemprego por essa modalidade."]],"map":["Dispensa ≠ pedido de demissão","Falta patronal → possível rescisão indireta","Quitação → prazo geral de 10 dias","Acordo → regime específico"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8036consol.htm"},{"t":"Estabilidades, saúde e proteção do trabalho","ref":"ADCT, art. 10; CLT, arts. 157 a 201 e 391 a 400; Lei 8.213/1991","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Garantias provisórias","A garantia da gestante protege desde a confirmação da gravidez até cinco meses após o parto, nos termos constitucionais e jurisprudenciais. A estabilidade acidentária e a proteção de representantes dos trabalhadores possuem condições próprias. Diferencie garantia de emprego de estabilidade do servidor estatutário."],["Saúde e segurança","O empregador deve observar e fazer cumprir normas de segurança e medicina do trabalho. Equipamentos de proteção, medidas coletivas e treinamento integram prevenção. Insalubridade e periculosidade exigem os pressupostos normativos e prova pertinente, não sendo automaticamente devidas pelo nome da profissão."],["Proteção de grupos e não discriminação","A Constituição proíbe trabalho noturno, perigoso ou insalubre a menores de dezoito anos e trabalho antes dos dezesseis, salvo aprendizagem a partir de quatorze. Trabalho doméstico segue a LC 150/2015. Direitos relacionados à maternidade e prevenção de discriminação devem ser estudados conforme as normas específicas."]],"map":["Gestante → proteção constitucional","Acidente → requisitos próprios","Segurança → prevenção","Aprendizagem → a partir de 14 anos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direito coletivo, sindicatos e negociação","ref":"CF, arts. 8º e 9º; CLT, arts. 611 a 625; Lei 7.783/1989","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Organização sindical","A liberdade sindical impede obrigatoriedade de filiação. A Constituição mantém regras de unicidade por categoria e base territorial e atribui aos sindicatos defesa de interesses coletivos e individuais da categoria. A representação sindical não se confunde com filiação individual."],["Acordos e convenções","Convenção coletiva é celebrada entre sindicatos representativos das categorias; acordo coletivo envolve sindicato profissional e empresa ou empresas. Os arts. 611-A e 611-B tratam de matérias negociáveis e direitos cuja supressão ou redução constitui objeto ilícito. O Tema 1046 do STF deve ser considerado na interpretação dos limites."],["Greve e atualização normativa","A greve é direito constitucional, disciplinado pela Lei 7.783/1989. Serviços essenciais possuem requisitos de continuidade e comunicação. A EC 141/2026 também prevê perda de efeito de cláusulas coletivas incompatíveis após dois meses de sua publicação e hipóteses especiais de compensação de repouso; instrumentos coletivos devem respeitar a vigência aplicável."]],"map":["Filiação → liberdade","Convenção → sindicatos","Acordo → sindicato profissional e empresa","Negociação → limites constitucionais e legais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l7783.htm"}];const laborQuestions=[{"id":9001,"s":8,"module":0,"topic":"Fontes, princípios e direitos fundamentais","difficulty":"Intermediária","q":"Um empregador registra jornada fictícia com finalidade de fraudar direitos trabalhistas. Qual a consequência prevista no art. 9º da CLT?","a":["Validade automática se assinada","Nulidade dos atos fraudulentos","Validade após um mês","Impossibilidade de revisão judicial"],"ok":1,"e":"O art. 9º invalida atos destinados a desvirtuar, impedir ou fraudar a aplicação da CLT.","src":"CF, arts. 7º a 11; CLT, arts. 8º e 9º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9002,"s":8,"module":0,"topic":"Fontes, princípios e direitos fundamentais","difficulty":"Intermediária","q":"Em regra, após a extinção do contrato, qual o prazo constitucional para propor ação relativa a créditos trabalhistas?","a":["Cinco dias","Cinco anos sem outro limite","Dois anos","Dez anos"],"ok":2,"e":"O art. 7º, XXIX, da Constituição estabelece limite de dois anos após a extinção contratual, com alcance quinquenal dos créditos, ressalvadas regras especiais.","src":"CF, art. 7º, XXIX","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":9003,"s":8,"module":1,"topic":"Relação de emprego e sujeitos","difficulty":"Intermediária","q":"O trabalhador presta serviços a dois empregadores, estando presentes os elementos do vínculo em cada relação. A falta de exclusividade impede o reconhecimento?","a":["Não, exclusividade não é requisito geral","Sim, necessariamente","Sim, se ambos forem empresas privadas","Sim, salvo autorização sindical"],"ok":0,"e":"Os arts. 2º e 3º da CLT não estabelecem exclusividade como requisito geral da relação empregatícia.","src":"CLT, arts. 2º a 6º e 10 a 10-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9004,"s":8,"module":1,"topic":"Relação de emprego e sujeitos","difficulty":"Intermediária","q":"Duas empresas têm sócios em comum, sem outros elementos comprovados de integração ou atuação conjunta. Basta essa identidade para configurar grupo econômico trabalhista?","a":["Sim, em qualquer caso","Sim, se estiverem no mesmo Município","Sim, se possuírem CNPJ","Não, a identidade de sócios isoladamente não é suficiente"],"ok":3,"e":"O art. 2º, § 3º, exige demonstração de interesse integrado, comunhão efetiva de interesses e atuação conjunta para caracterização do grupo na hipótese pertinente.","src":"CLT, arts. 2º a 6º e 10 a 10-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9005,"s":8,"module":2,"topic":"Contrato de trabalho e modalidades especiais","difficulty":"Intermediária","q":"Qual o prazo máximo total do contrato de experiência previsto na CLT?","a":["Trinta dias","Noventa dias","Cento e oitenta dias","Dois anos"],"ok":1,"e":"O art. 445, parágrafo único, limita o contrato de experiência a noventa dias.","src":"CLT, arts. 442 a 456 e 75-A a 75-F; Lei 11.788/2008","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9006,"s":8,"module":2,"topic":"Contrato de trabalho e modalidades especiais","difficulty":"Intermediária","q":"O mero fato de trabalhar remotamente elimina necessariamente o direito ao controle de jornada?","a":["Sim, em todos os casos","Sim, se utilizar computador","Não, é necessário examinar o regime e as hipóteses legais de exclusão","Sim, por escolha unilateral do empregador"],"ok":2,"e":"As regras de teletrabalho e as exceções do art. 62 exigem análise do regime efetivo, inclusive prestação por produção ou tarefa e demais hipóteses legais.","src":"CLT, arts. 442 a 456 e 75-A a 75-F; Lei 11.788/2008","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9007,"s":8,"module":3,"topic":"Jornada, horas extras e transição constitucional","difficulty":"Intermediária","q":"Segundo a EC 141/2026, qual será o limite semanal normal na primeira etapa, dois meses após sua publicação?","a":["48 horas","44 horas","36 horas","42 horas"],"ok":3,"e":"O art. 6º, I, da EC 141 prevê 42 horas nessa etapa; o inciso II prevê 40 horas um ano depois, observados os regimes pertinentes.","src":"CF, art. 7º; EC 141/2026, arts. 1º a 10; CLT, arts. 58 a 75","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc141.htm"},{"id":9008,"s":8,"module":3,"topic":"Jornada, horas extras e transição constitucional","difficulty":"Intermediária","q":"A redução da duração normal do trabalho em cumprimento à EC 141/2026 autoriza reduzir proporcionalmente o salário contratado?","a":["Não, a emenda protege a irredutibilidade salarial inclusive dos pisos","Sim, automaticamente","Sim, se a jornada diminuir uma hora","Sim, sem qualquer condição"],"ok":0,"e":"O art. 2º da emenda determina implementação sem redução salarial, inclusive dos pisos.","src":"CF, art. 7º; EC 141/2026, arts. 1º a 10; CLT, arts. 58 a 75","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc141.htm"},{"id":9009,"s":8,"module":4,"topic":"Remuneração, salário e equiparação","difficulty":"Intermediária","q":"Gorjetas recebidas pelo empregado, nos termos do art. 457, integram qual conceito?","a":["Patrimônio do empregador exclusivamente","Remuneração do empregado","FGTS exclusivamente","Verba necessariamente indenizatória"],"ok":1,"e":"O art. 457 inclui gorjetas na remuneração, além do salário pago diretamente pelo empregador.","src":"CLT, arts. 457 a 467; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9010,"s":8,"module":4,"topic":"Remuneração, salário e equiparação","difficulty":"Intermediária","q":"A simples identidade do nome do cargo entre dois empregados garante equiparação salarial independentemente dos demais requisitos?","a":["Sim, sempre","Sim, se ambos usarem uniforme","Não, devem ser examinados os requisitos do art. 461","Sim, mesmo se trabalharem para empregadores distintos"],"ok":2,"e":"A equiparação depende da função efetiva, do trabalho de igual valor e dos demais requisitos legais, não apenas do título do cargo.","src":"CLT, arts. 457 a 467; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9011,"s":8,"module":5,"topic":"Férias, décimo terceiro e repousos","difficulty":"Intermediária","q":"Qual adicional mínimo constitucional incide sobre a remuneração de férias?","a":["Um décimo","Metade obrigatória","Dois terços","Um terço"],"ok":3,"e":"O art. 7º, XVII, garante férias remuneradas com pelo menos um terço a mais que o salário normal.","src":"CF, art. 7º, XVII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":9012,"s":8,"module":5,"topic":"Férias, décimo terceiro e repousos","difficulty":"Intermediária","q":"Com concordância do empregado, qual divisão atende aos limites gerais de fracionamento de 30 dias de férias?","a":["14, 8 e 8 dias","10, 10 e 10 dias","20, 4 e 6 dias","7, 7 e 16 dias em quatro períodos"],"ok":0,"e":"O art. 134, § 1º, admite até três períodos, sendo um de pelo menos 14 dias e os demais de pelo menos cinco dias.","src":"CLT, arts. 129 a 153; Lei 4.090/1962; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9013,"s":8,"module":6,"topic":"Alteração, suspensão e interrupção contratual","difficulty":"Intermediária","q":"As partes acordam alteração contratual que reduz ilicitamente direitos do empregado. A concordância isolada torna a alteração válida?","a":["Não, o art. 468 também exige ausência de prejuízo","Sim, em qualquer caso","Sim, se o acordo for verbal","Sim, após cinco dias"],"ok":0,"e":"A alteração contratual individual exige consentimento e ausência de prejuízo direto ou indireto, ressalvados os regimes legalmente autorizados.","src":"CLT, arts. 468 a 476-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9014,"s":8,"module":6,"topic":"Alteração, suspensão e interrupção contratual","difficulty":"Intermediária","q":"Férias remuneradas representam, em regra, qual situação do contrato?","a":["Extinção contratual","Suspensão sem remuneração","Interrupção contratual","Renúncia à relação de emprego"],"ok":2,"e":"Nas férias o trabalho não é prestado, mas a remuneração e os efeitos legais do contrato são preservados.","src":"CLT, arts. 468 a 476-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9015,"s":8,"module":7,"topic":"Extinção contratual, aviso-prévio e FGTS","difficulty":"Intermediária","q":"Qual prazo geral do art. 477, § 6º, para pagamento das verbas rescisórias?","a":["Trinta dias","Dez dias contados do término do contrato","Quinze dias úteis","Sessenta dias"],"ok":1,"e":"O art. 477, § 6º, estabelece dez dias a partir do término do contrato para pagamento e entrega dos documentos pertinentes.","src":"CLT, arts. 477 a 491; Leis 8.036/1990 e 12.506/2011","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9016,"s":8,"module":7,"topic":"Extinção contratual, aviso-prévio e FGTS","difficulty":"Intermediária","q":"A extinção contratual por acordo do art. 484-A autoriza ingresso no programa de seguro-desemprego?","a":["Sim, sempre","Sim, após trinta dias","Sim, com anuência do sindicato","Não, essa modalidade não autoriza o benefício"],"ok":3,"e":"O § 2º do art. 484-A expressamente afasta o ingresso no programa de seguro-desemprego.","src":"CLT, arts. 477 a 491; Leis 8.036/1990 e 12.506/2011","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9017,"s":8,"module":8,"topic":"Estabilidades, saúde e proteção do trabalho","difficulty":"Intermediária","q":"Qual a proteção constitucional provisória da gestante prevista no ADCT?","a":["Da confirmação da gravidez até cinco meses após o parto","Apenas durante o parto","Somente após o retorno ao trabalho","Por dez anos após o nascimento"],"ok":0,"e":"O art. 10, II, b, do ADCT protege contra dispensa arbitrária ou sem justa causa da confirmação da gravidez até cinco meses após o parto.","src":"ADCT, art. 10, II, b","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":9018,"s":8,"module":8,"topic":"Estabilidades, saúde e proteção do trabalho","difficulty":"Intermediária","q":"Uma pessoa de quinze anos pode trabalhar regularmente em atividade comum fora da aprendizagem?","a":["Sim, em qualquer função","Sim, desde que noturna","Não, o trabalho antes dos dezesseis só é permitido como aprendiz a partir dos quatorze","Sim, se tiver autorização verbal"],"ok":2,"e":"O art. 7º, XXXIII, estabelece essa proteção etária e veda trabalho noturno, perigoso e insalubre a menores de dezoito anos.","src":"CF, art. 7º, XXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":9019,"s":8,"module":9,"topic":"Direito coletivo, sindicatos e negociação","difficulty":"Intermediária","q":"Sindicato profissional celebra instrumento normativo com uma empresa para regular condições de trabalho. Qual é a modalidade?","a":["Convenção entre dois sindicatos necessariamente","Acordo coletivo de trabalho","Contrato de estágio","Sentença penal"],"ok":1,"e":"O art. 611, § 1º, disciplina acordo coletivo entre sindicato profissional e uma ou mais empresas.","src":"CF, arts. 8º e 9º; CLT, arts. 611 a 625; Lei 7.783/1989","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9020,"s":8,"module":9,"topic":"Direito coletivo, sindicatos e negociação","difficulty":"Intermediária","q":"Uma convenção coletiva pode suprimir livremente qualquer direito constitucional e legal dos empregados?","a":["Sim, sem limites","Sim, sempre que votada por maioria","Sim, se tiver vigência anual","Não, existem limites legais e direitos indisponíveis"],"ok":3,"e":"A negociação coletiva possui proteção constitucional, mas deve observar os limites aplicáveis, inclusive art. 611-B da CLT e interpretação do STF.","src":"CF, arts. 8º e 9º; CLT, arts. 611 a 625; Lei 7.783/1989","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"}];const processLaborModules=[{"t":"Organização, competência e jurisdição trabalhista","ref":"CF, arts. 111 a 116; CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Estrutura da Justiça do Trabalho","A Justiça do Trabalho é organizada em Varas, Tribunais Regionais e Tribunal Superior do Trabalho. As Varas são órgãos de primeiro grau; os TRTs julgam recursos e determinadas ações originárias; o TST uniformiza a interpretação do direito trabalhista dentro de suas atribuições."],["Competência material","O art. 114 da Constituição estabelece a competência sobre ações decorrentes das relações de trabalho e outras hipóteses expressas, como indenizações relacionadas ao trabalho. Não confunda relação de trabalho com emprego: a primeira é gênero. Relações jurídico-administrativas estatutárias seguem a delimitação constitucional fixada pelo STF."],["Competência territorial","A regra do art. 651 da CLT privilegia a localidade da prestação de serviços, ainda que a contratação tenha ocorrido em outro lugar. Existem exceções para situações específicas, como agente viajante e empregador que promove atividades fora do local do contrato."]],"map":["Vara → primeiro grau","TRT → recursos e competência originária","TST → uniformização","Território → prestação de serviços, em regra"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"t":"Princípios, partes e representação","ref":"CLT, arts. 763 a 769, 791 e 843; Súmula 425 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Especialidade e aplicação subsidiária","O processo trabalhista valoriza oralidade, concentração de atos e conciliação. O CPC pode suprir lacunas quando compatível com o regime trabalhista. Na execução, também se observa o art. 889 da CLT. A existência de norma especial impede substituição automática pela disciplina civil."],["Capacidade e jus postulandi","A CLT admite atuação pessoal de empregado e empregador nos limites legais. A Súmula 425 do TST restringe o jus postulandi às Varas e TRTs, excluindo, entre outros, recursos de competência do TST, ação rescisória e mandado de segurança. A representação por advogado continua recomendável."],["Preposto e representação","O empregador pode ser representado por preposto que conheça os fatos, cujas declarações o vinculam. O preposto não precisa ser empregado da parte reclamada. A regularidade da representação técnica e a presença das partes devem ser examinadas separadamente."]],"map":["Especialidade → CLT","CPC → lacuna e compatibilidade","Jus postulandi → limites da Súmula 425","Preposto → conhecimento dos fatos"],"extraUrl":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"t":"Atos processuais, prazos e nulidades","ref":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Contagem de prazos","Os prazos processuais trabalhistas expressos em dias são contados em dias úteis, excluindo-se o dia inicial e incluindo-se o vencimento. A identificação da intimação e do termo inicial é indispensável. Prazos de direito material não se confundem com prazos processuais."],["Suspensão e comunicação","O curso dos prazos processuais é suspenso de 20 de dezembro a 20 de janeiro, inclusive, conforme o art. 775-A. A comunicação eletrônica exige atenção à data de ciência e à regulamentação pertinente. Não confunda suspensão com interrupção: na suspensão, preserva-se a parcela já transcorrida."],["Nulidades","O sistema privilegia aproveitamento de atos e demonstração de prejuízo. Em regra, a nulidade deve ser arguida na primeira oportunidade de manifestação, observadas exceções. A parte não pode beneficiar-se de vício ao qual deu causa nos termos do art. 796."]],"map":["Prazo processual → dias úteis","20/12 a 20/01 → suspensão","Nulidade → prejuízo","Arguição → primeira oportunidade, em regra"]},{"t":"Reclamação trabalhista e ritos","ref":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Petição inicial","A reclamação pode ser escrita ou verbal nas hipóteses legais. Na escrita, o art. 840 exige designação do juízo, qualificação, breve exposição dos fatos, pedidos certos e determinados com indicação de valor, data e assinatura. Pedidos que não atendam aos requisitos do § 1º sujeitam-se à consequência do § 3º."],["Procedimento sumaríssimo","Dissídios individuais cujo valor não excede quarenta salários mínimos na data do ajuizamento submetem-se ao sumaríssimo, ressalvadas exclusões legais. Demandas em que seja parte administração pública direta, autárquica ou fundacional não se enquadram nesse rito. Não confunda com o procedimento sumário de alçada."],["Particularidades do rito","No sumaríssimo, os pedidos devem ser certos, determinados e valorados, e não se admite citação por edital. A concentração de atos procura acelerar o julgamento. A escolha do rito interfere na instrução e nos requisitos de recurso de revista."]],"map":["Inicial → fatos e pedidos valorados","Sumaríssimo → até 40 salários mínimos","Administração direta, autárquica e fundacional → exclusão","Sumaríssimo → sem edital"]},{"t":"Audiência, conciliação e resposta","ref":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Comparecimento","A audiência concentra atos relevantes. A ausência do reclamante pode ensejar arquivamento; a do reclamado pode produzir revelia e confissão quanto à matéria de fato, observadas exceções do art. 844. A presença de advogado do reclamado permite recebimento de contestação e documentos nos termos do § 5º."],["Conciliação","O julgador deve estimular composição, inclusive nas oportunidades previstas nos arts. 846 e 850. O acordo homologado produz efeitos jurídicos próprios, ressalvadas hipóteses de impugnação legal. A ausência de acordo não representa presunção contra a parte."],["Defesa e instrução","Frustrada a conciliação, a parte reclamada apresenta defesa conforme art. 847, inclusive por escrito no sistema eletrônico até a audiência. A instrução permite produção de provas e razões finais. Exceção de incompetência territorial possui procedimento próprio no art. 800."]],"map":["Ausência do autor → arquivamento, em regra","Ausência do réu → revelia e confissão, com ressalvas","Conciliação → antes e depois da instrução","Defesa → art. 847"]},{"t":"Provas, ônus probatório e sentença","ref":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Distribuição do ônus","Cabe ao reclamante provar fato constitutivo de seu direito e ao reclamado demonstrar fato impeditivo, modificativo ou extintivo. O art. 818 admite redistribuição fundamentada em condições específicas, assegurando oportunidade real de cumprimento do novo encargo."],["Testemunhas e perícia","No rito ordinário, cada parte pode indicar até três testemunhas, ressalvado o inquérito para apuração de falta grave, que tem regra própria. No sumaríssimo, o limite é de duas por parte. A perícia atende questões técnicas, e o laudo deve ser avaliado de forma fundamentada."],["Sentença e motivação","A decisão deve identificar fundamentos, apreciar pedidos e observar os limites da demanda. O relatório pode ser dispensado no sumaríssimo, mas a fundamentação permanece necessária. Distinga reconhecimento de direito, quantificação e efetiva satisfação do crédito."]],"map":["Autor → fato constitutivo","Réu → fato impeditivo, modificativo ou extintivo","Ordinário → 3 testemunhas, regra geral","Sumaríssimo → 2 testemunhas"]},{"t":"Custas, gratuidade e honorários","ref":"CLT, arts. 789 a 791-A; STF, ADI 5766","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Custas e preparo","As custas do conhecimento seguem, em regra, percentual de dois por cento e limites do art. 789. O depósito recursal tem finalidade de garantia e não se confunde com custas. Isenções, reduções e limites de depósito devem ser avaliados segundo a parte e o recurso, usando valores oficiais vigentes."],["Justiça gratuita","A gratuidade protege o acesso à justiça quando presentes os requisitos legais. O art. 790 prevê parâmetros e insuficiência de recursos. A jurisprudência atual deve ser observada na avaliação de declarações e provas de hipossuficiência, distinguindo pessoa natural e pessoa jurídica."],["Honorários após ADI 5766","A sucumbência advocatícia trabalhista segue o art. 791-A, com percentual entre cinco e quinze por cento. Conforme a interpretação aplicada pelo TST à ADI 5766, créditos obtidos em juízo não autorizam cobrança automática do beneficiário da gratuidade; a exigibilidade pode permanecer suspensa por dois anos, cabendo demonstração de superação da insuficiência. Honorários periciais possuem disciplina própria."]],"map":["Custas → regra de 2%","Depósito → garantia recursal","Gratuidade → insuficiência","ADI 5766 → sem cobrança automática"],"extraUrl":"https://jurisprudencia-backend.tst.jus.br/rest/documentos/35018180d7c8c03d5dc82d4f7bff208b"},{"t":"Recursos trabalhistas","ref":"CLT, arts. 893 a 900; Súmula 214 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Sistema recursal","O recurso ordinário impugna decisões definitivas ou terminativas nas hipóteses do art. 895. O recurso de revista tem pressupostos próprios e não funciona como nova instância de reexame amplo de fatos. O agravo de instrumento pode buscar destrancar recurso cuja interposição foi denegada."],["Prazos e efeitos","O prazo geral de recursos trabalhistas é de oito dias, ressalvadas exceções. Embargos de declaração têm prazo de cinco dias e interrompem, em regra, o prazo dos demais recursos. Os recursos possuem efeito meramente devolutivo como regra da CLT, ressalvadas situações específicas."],["Interlocutórias e revista","Decisões interlocutórias geralmente não admitem recurso imediato; a Súmula 214 delimita exceções. O recurso de revista exige análise das hipóteses de cabimento, pressupostos formais e transcendência. No sumaríssimo, seu cabimento tem restrições adicionais."]],"map":["Sentença → recurso ordinário, em regra","Revista → requisitos especiais","Embargos declaratórios → 5 dias","Interlocutória → irrecorribilidade imediata, em regra"],"extraUrl":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"t":"Liquidação e execução trabalhista","ref":"CLT, arts. 876 a 892 e 897","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Título e liquidação","A execução realiza obrigações constantes de títulos reconhecidos pela legislação. A liquidação quantifica decisão ilíquida sem alterar o mérito. Elaborada a conta, o art. 879, § 2º, estabelece prazo comum para impugnação fundamentada, com indicação dos itens e valores controvertidos."],["Iniciativa e pagamento","O art. 878 prevê iniciativa das partes, permitindo execução de ofício quando não representadas por advogado. Citado para cumprir decisão ou acordo, o executado tem prazo legal de quarenta e oito horas para pagar ou garantir a execução, nas hipóteses do art. 880."],["Defesa e recursos","Garantida a execução ou penhorados bens, o art. 884 prevê cinco dias para embargos, ressalvadas regras especiais. O agravo de petição é recurso típico das decisões em execução, exigindo delimitação justificada das matérias e valores impugnados nos termos legais."]],"map":["Liquidação → quantificação","Conta → impugnação fundamentada","Citação executiva → 48 horas","Execução → agravo de petição"]},{"t":"Ações especiais, dissídios coletivos e homologação","ref":"CF, art. 114; CLT, arts. 853 a 855-E e 856 a 875","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Inquérito para apuração de falta grave","Quando exigido pelo regime de garantia de emprego, o inquérito judicial busca apurar falta grave que autorize resolução contratual. O art. 853 prevê prazo de trinta dias da suspensão para ajuizamento na hipótese legal. Não generalize esse procedimento para toda garantia provisória."],["Homologação extrajudicial","O processo de homologação de acordo extrajudicial inicia-se por petição conjunta, com representação obrigatória por advogados distintos. O juiz analisa a legalidade e pode designar audiência. O pedido não dispensa o cumprimento do prazo rescisório legal."],["Dissídios coletivos","Dissídios coletivos jurídicos e econômicos possuem objetos distintos. No dissídio econômico, a Constituição prevê negociação ou arbitragem prévias e comum acordo nas condições do art. 114, § 2º, consideradas as interpretações judiciais pertinentes. Greve em atividade essencial com possibilidade de lesão do interesse público possui disciplina específica."]],"map":["Inquérito → hipóteses específicas","Acordo ext
