</style></head><body><div id="root"></div><script>
const subjects=['Ética Profissional','Direito Constitucional','Direito Civil','Processo Civil','Direito Penal','Processo Penal','Direito Administrativo','Direito Tributário','Direito do Trabalho','Processo do Trabalho','Direito Empresarial','Direitos Humanos','Direito Ambiental','Direito Internacional','Direito do Consumidor','ECA','Filosofia do Direito','Direito Eleitoral','Direito Financeiro','Direito Previdenciário'];
const qs=[{id:1,s:1,q:'Segundo a Constituição Federal, qual é o prazo de validade de um concurso público?',a:['Até um ano, sem prorrogação','Até dois anos, prorrogável uma vez por igual período','Sempre quatro anos','Indeterminado'],ok:1,e:'O art. 37, III, da Constituição prevê validade de até dois anos, prorrogável uma vez por igual período.',src:'Constituição Federal, art. 37, III',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'},{id:2,s:2,q:'Em regra, em qual idade cessa a menoridade civil?',a:['16 anos','21 anos','18 anos completos','25 anos'],ok:2,e:'O art. 5º do Código Civil prevê que a menoridade cessa aos dezoito anos completos, ressalvadas as hipóteses legais de emancipação.',src:'Código Civil, art. 5º',url:'https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm'},{id:3,s:4,q:'Qual princípio impede que uma conduta seja considerada crime sem lei anterior que a defina?',a:['Legalidade penal','Publicidade','Eficiência','Contraditório'],ok:0,e:'O art. 1º do Código Penal estabelece que não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal.',src:'Código Penal, art. 1º',url:'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'},{id:4,s:0,q:'Qual instituição é indispensável à administração da justiça nos termos do art. 133 da Constituição?',a:['A advocacia','O registro de imóveis','A junta comercial','O tribunal de contas'],ok:0,e:'A Constituição afirma a indispensabilidade do advogado à administração da justiça, nos limites da lei.',src:'Constituição Federal, art. 133',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'}];
const ethicsModules=[{"t":"Atividade da advocacia e mandato","ref":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Atividades privativas","Distinga representação processual de consultoria, assessoria e direção jurídicas. O bacharelado não substitui a inscrição profissional. A impetração de habeas corpus é expressamente excluída do rol de atividades privativas. Não generalize a exigência de advogado para todos os procedimentos: há exceções legais e constitucionais."],["Mandato e urgência","A procuração demonstra os poderes recebidos. Quando a urgência impede sua apresentação imediata, o profissional pode agir e regularizar a representação no prazo legal de quinze dias, prorrogável por igual período. Na renúncia, a assistência permanece por dez dias após a notificação, salvo substituição anterior."],["Aplicação prática","Em uma questão sobre prazo processual iminente, identifique urgência, regularização e prova da comunicação ao cliente. Renunciar não equivale a abandonar o processo. Compare o prazo de apresentação da procuração com o período de continuidade da representação."]],"map":["Atuação privativa → inscrição","Habeas corpus → exceção","Urgência → 15 + 15 dias","Renúncia → notificação + 10 dias"]},{"t":"Inscrição, inscrição suplementar e licenciamento","ref":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Ingresso profissional","A inscrição exige os requisitos do art. 8º, entre eles habilitação acadêmica, aprovação no Exame de Ordem, idoneidade moral, capacidade civil e ausência de atividade incompatível. O compromisso perante o Conselho também integra o procedimento."],["Inscrição principal e suplementar","A principal relaciona-se ao domicílio profissional. A atuação habitual em outra unidade federativa exige inscrição suplementar. Para esse efeito, habitualidade corresponde à intervenção judicial em mais de cinco causas por ano no território de outro Conselho."],["Licenciamento ou cancelamento","Licenciamento é afastamento temporário nas hipóteses legais; cancelamento encerra a inscrição. A atividade incompatível temporária é exemplo de licenciamento; incompatibilidade definitiva é hipótese de cancelamento. O número anterior não é restabelecido automaticamente em nova inscrição."]],"map":["Inscrição → requisitos cumulativos","Principal → domicílio profissional","Suplementar → mais de 5 causas/ano","Licença temporária ≠ cancelamento"]},{"t":"Direitos e prerrogativas profissionais","ref":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Independência e respeito","As funções de magistratura, Ministério Público e advocacia têm atribuições distintas, sem subordinação hierárquica entre elas. Prerrogativas protegem a atuação profissional e o direito de defesa, não constituindo imunidade para ilícitos."],["Acesso a investigações","O advogado pode consultar elementos documentados de investigação nas condições legais, inclusive sem procuração quando não há sigilo. Em autos sigilosos, exige-se mandato. Diligências em andamento e ainda não documentadas podem ter acesso delimitado nos termos do Estatuto."],["Inviolabilidade","O escritório e os instrumentos de trabalho recebem proteção vinculada à atividade profissional. Não é proteção absoluta: medidas judiciais excepcionais exigem os pressupostos e salvaguardas legais. Em provas, desconfie de alternativas que usem 'sempre' ou 'nunca' sem ressalvas."]],"map":["Prerrogativa → defesa","Sem sigilo → acesso nos limites legais","Sigilo → procuração","Inviolabilidade → proteção qualificada"]},{"t":"Sociedades de advogados e associação","ref":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Formas de organização","A advocacia admite sociedade de advogados e sociedade unipessoal. O registro constitutivo no Conselho Seccional competente confere personalidade jurídica. A finalidade é a prestação de serviços advocatícios, e não a organização de uma atividade mercantil genérica."],["Limites societários","Não se admite sócio que não seja advogado inscrito ou que esteja totalmente proibido de advogar, nem denominação de fantasia nas sociedades abrangidas pelo Estatuto. A organização deve respeitar os conflitos de interesse e as limitações territoriais de participação societária."],["Responsabilidade e associação","Além da sociedade, o sócio ou titular responde subsidiária e ilimitadamente por danos causados aos clientes no exercício da advocacia, sem prejuízo da responsabilidade disciplinar. Associação profissional sem vínculo de emprego é possível, mas deve atender aos requisitos legais; o nome do contrato não afasta uma relação empregatícia efetivamente caracterizada."]],"map":["Registro → Conselho Seccional","Objeto → advocacia","Sócio → advogado habilitado","Danos ao cliente → responsabilidade subsidiária"]},{"t":"Honorários advocatícios","ref":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Três modalidades","Honorários convencionados decorrem do acordo profissional; arbitrados são estabelecidos judicialmente nas hipóteses pertinentes; sucumbenciais resultam da derrota processual da parte adversa. Diferencie origem do crédito e titularidade. A sucumbência pertence ao advogado."],["Contratação e cobrança","A clareza do contrato reduz conflitos: delimite serviços, forma de remuneração e hipóteses de encerramento. A ação de cobrança tem prazo prescricional de cinco anos, com marcos iniciais definidos no art. 25. Não trate todos os casos como se contassem da assinatura do contrato."],["Substabelecimento","O substabelecimento com reserva mantém poderes no profissional originário. Em regra, o substabelecido não cobra honorários sem a intervenção do substabelecente. O art. 26 prevê exceção quando possui contrato celebrado com o cliente."]],"map":["Convencionados → contrato","Arbitrados → decisão judicial","Sucumbência → advogado","Cobrança → 5 anos"]},{"t":"Incompatibilidades e impedimentos","ref":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Distinção fundamental","A incompatibilidade exclui totalmente o exercício da advocacia enquanto presente a condição. O impedimento restringe determinadas atuações, sem necessariamente afastar o profissional de toda a advocacia. Primeiro classifique a atividade, depois identifique o alcance da restrição."],["Atividades incompatíveis","O Estatuto relaciona categorias como membros do Judiciário e titulares de serviços notariais e registrais. Há especificidades e decisões judiciais relevantes para certas categorias; consulte o texto consolidado e os precedentes aplicáveis antes de estender uma regra."],["Impedimento do servidor","O servidor público, quando abrangido pelo art. 30, I, não pode advogar contra a Fazenda Pública que o remunera ou à qual está vinculada a entidade empregadora. A exceção legal dos docentes de cursos jurídicos e as hipóteses de incompatibilidade merecem atenção."]],"map":["Incompatibilidade → proibição total","Impedimento → proibição parcial","Cargo temporário incompatível → licença","Servidor → observar Fazenda vinculada"]},{"t":"Relação com o cliente e conflitos de interesse","ref":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015","lessons":[["Confiança e informação","Explique riscos relevantes, alternativas e limites da estratégia profissional. A independência técnica não elimina o dever de informar. A contratação não é uma promessa de resultado."],["Conflitos de interesse","Profissionais da mesma sociedade não representam interesses opostos. Se um conflito superveniente não puder ser resolvido, é preciso escolher a representação a manter, renunciar às demais e preservar informações confidenciais."],["Encerramento e defesa","A revogação pelo cliente não elimina automaticamente os honorários devidos pelo trabalho. A defesa criminal é função de garantia processual, independentemente da opinião pessoal do advogado sobre a culpa. O profissional não deve deixar o cliente desamparado."]],"map":["Informar riscos → confiança","Interesses opostos → conflito","Renúncia → preservar sigilo","Defesa → garantias processuais"]},{"t":"Sigilo profissional e publicidade jurídica","ref":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015","lessons":[["Confidencialidade","O sigilo é dever profissional independentemente de pedido do cliente. Comunicações advogado-cliente são presumidamente confidenciais. A obrigação abrange também fatos conhecidos no exercício de funções da Ordem."],["Exceções","Circunstâncias excepcionais podem justificar a revelação, como defesa própria ou grave ameaça à vida e à honra. A análise exige necessidade e proporcionalidade. O advogado não é obrigado a depor sobre fatos sujeitos ao sigilo."],["Marketing jurídico","A publicidade é informativa, discreta e sóbria. O conteúdo jurídico pode ser divulgado em redes sociais e por meios permitidos, inclusive anúncios nas condições regulamentares. Captação indevida, mercantilização e promessa de resultado são incompatíveis com esse regime. Consulte também o Provimento 205/2021 e alterações vigentes."]],"map":["Sigilo → dever independente de pedido","Justa causa → exceção","Publicidade → informação","Captação e promessa → vedadas"],"extraUrl":"https://www.oab.org.br/leisnormas/legislacao/provimentos/205-2021"},{"t":"Infrações e sanções disciplinares","ref":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Identificação da infração","A questão exige enquadramento da conduta no Estatuto e identificação da consequência aplicável. Diferencie a infração disciplinar da responsabilidade civil e penal: podem coexistir. A falta de prestação de contas e a captação de causas, por exemplo, não são categorias equivalentes."],["Sistema de sanções","As quatro espécies são censura, suspensão, exclusão e multa. A censura pode ser convertida em advertência reservada quando presentes as condições legais. A suspensão restringe temporariamente o exercício profissional em todo o território nacional. A exclusão demanda requisitos próprios."],["Individualização e prescrição","Analise agravantes, atenuantes, reincidência e a natureza da conduta. A pretensão punitiva disciplinar prescreve em cinco anos contados da constatação oficial do fato, observadas interrupções e a prescrição intercorrente prevista no Estatuto. Não confunda prescrição disciplinar com cobrança de honorários."]],"map":["Conduta → art. 34","Sanção → arts. 35–39","Exclusão → quórum qualificado","Prescrição → art. 43"]},{"t":"Organização da OAB e processo disciplinar","ref":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Estrutura institucional","A OAB exerce serviço público com personalidade jurídica e forma federativa. Integram sua estrutura o Conselho Federal, os Conselhos Seccionais, as Subseções e as Caixas de Assistência. A Subseção é parte autônoma da Seccional, não um Conselho Federal local."],["Competência disciplinar","Em regra, o Conselho Seccional do território da infração exerce a competência disciplinar, com ressalva legal para faltas cometidas perante o Conselho Federal. O Tribunal de Ética e Disciplina exerce funções de julgamento conforme o Estatuto e os regulamentos."],["Garantias processuais","O processo pode começar de ofício ou por representação. O sigilo durante a tramitação protege as partes, sem eliminar acesso legal dos interessados e defensores. Observe contraditório, defesa, competência e recursos próprios. O sigilo não equivale a ausência de controle."]],"map":["Conselho Federal → âmbito nacional","Seccional → território","Subseção → parte autônoma","Disciplina → competência e defesa"]}];const ethicsQuestions=[{"id":1001,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Um advogado é chamado para uma medida urgente, sem procuração assinada. Qual a solução prevista no Estatuto?","a":["Nunca pode atuar","Pode atuar, regularizando o mandato em 15 dias, prorrogáveis por igual período","Tem 48 horas sem prorrogação","O mandato torna-se dispensável definitivamente"],"ok":1,"e":"A urgência permite a atuação inicial sem procuração, mas não elimina a obrigação de regularizá-la. O prazo consta do art. 5º, § 1º.","src":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1002,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Após notificar o cliente sobre a renúncia, o advogado é substituído por outro profissional no quarto dia. O que ocorre?","a":["Deve continuar por dez dias mesmo substituído","Deve permanecer por trinta dias","Pode cessar a representação com a substituição anterior","A renúncia depende de homologação da OAB"],"ok":2,"e":"A continuidade de dez dias protege o cliente contra desamparo. A substituição anterior encerra essa obrigação, conforme art. 5º, § 3º.","src":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1003,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Uma advogada inscrita em SP patrocina seis novas causas judiciais em MG no mesmo ano, em atuação habitual. O que deve providenciar?","a":["Inscrição suplementar em MG","Cancelamento obrigatório em SP","Apenas comunicação ao cliente","Novo Exame de Ordem"],"ok":0,"e":"O art. 10, § 2º, exige inscrição suplementar quando a intervenção judicial em outro território ultrapassa cinco causas anuais.","src":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1004,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Um advogado assume temporariamente atividade incompatível com a advocacia. Qual medida de inscrição é prevista?","a":["Inscrição suplementar","Transferência automática","Exclusão disciplinar","Licenciamento"],"ok":3,"e":"O licenciamento se aplica à incompatibilidade temporária (art. 12, II), diferentemente da incompatibilidade definitiva.","src":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1005,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Em investigação sob sigilo, o advogado pretende exercer a prerrogativa de acesso do art. 7º, XIV. Que documento deve apresentar?","a":["Certidão de graduação","Procuração","Autorização de todos os investigados","Contrato de sociedade"],"ok":1,"e":"O art. 7º, § 10, exige procuração para o acesso previsto no inciso XIV quando os autos são sigilosos.","src":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1006,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Um magistrado afirma ser superior hierárquico ao advogado em razão do cargo. Qual a resposta correta?","a":["É superior em qualquer audiência","É superior apenas em processo penal","Não há hierarquia entre magistrados, membros do MP e advogados","A hierarquia depende do tempo de inscrição"],"ok":2,"e":"O art. 6º rejeita essa subordinação hierárquica e exige respeito recíproco no exercício das funções.","src":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1007,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Dois advogados constituem sociedade exclusivamente para prestar serviços jurídicos. Onde se registra o ato constitutivo para adquirir personalidade jurídica?","a":["Junta Comercial","Cartório eleitoral","Conselho Seccional da OAB competente","Conselho Nacional de Justiça"],"ok":2,"e":"O registro profissional da sociedade é feito perante o Conselho Seccional da OAB competente, conforme art. 15, § 1º.","src":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1008,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Uma sociedade pretende admitir como sócio investidor alguém que não possui inscrição como advogado. A proposta é admissível?","a":["Sim, desde que não assine petições","Não, pela vedação do art. 16","Sim, se a participação for inferior a 10%","Sim, se o contrato for registrado em cartório"],"ok":1,"e":"O Estatuto veda a presença de sócio não inscrito como advogado nas sociedades de advocacia.","src":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1009,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Em uma sentença que condena a parte vencida ao pagamento de honorários sucumbenciais, quem é titular dessa verba segundo o Estatuto?","a":["O advogado","O juiz","A parte vencedora exclusivamente","A OAB"],"ok":0,"e":"O art. 23 assegura ao advogado a titularidade dos honorários incluídos na condenação por sucumbência.","src":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1010,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Em regra, qual o prazo de prescrição da ação de cobrança de honorários advocatícios?","a":["Um ano","Dois anos","Dez anos","Cinco anos"],"ok":3,"e":"O art. 25 estabelece cinco anos, com início variável segundo a hipótese legal.","src":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1011,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Uma pessoa exerce atividade que a lei classifica expressamente como incompatível com a advocacia. Qual o alcance da restrição?","a":["Somente causas tributárias","Somente causas contra a União","Proibição parcial","Proibição total"],"ok":3,"e":"A distinção está no art. 27: incompatibilidade é proibição total; impedimento, parcial.","src":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1012,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Servidor público sujeito apenas ao art. 30, I, pretende advogar contra a Fazenda que o remunera. Pode fazê-lo?","a":["Sim, fora do horário de trabalho","Não, há impedimento nessa atuação","Sim, se cobrar honorários reduzidos","Não pode advogar em nenhuma hipótese"],"ok":1,"e":"A restrição desse dispositivo é parcial e incide contra a Fazenda que o remunera ou à qual se vincula a entidade empregadora.","src":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1013,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Dois clientes do mesmo advogado passam a ter interesses opostos e o conflito não pode ser harmonizado. Qual conduta é adequada?","a":["Representar ambos até a sentença","Revelar as confidências de ambos","Escolher um mandato, renunciar aos demais e preservar o sigilo","Entregar os processos ao cliente adversário"],"ok":2,"e":"O art. 20 do Código de Ética orienta a escolha prudente de um mandato e a renúncia aos demais, com preservação do sigilo.","src":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1014,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"A revogação do mandato pelo cliente extingue automaticamente a obrigação de pagar os honorários contratados?","a":["Sim, em qualquer hipótese","Não; devem ser observados os honorários devidos","Sim, se ocorrer antes da sentença","Sim, se não houver sucumbência"],"ok":1,"e":"O art. 17 do Código de Ética preserva o direito aos honorários contratados e à sucumbência eventualmente devida na proporção pertinente.","src":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1015,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Um cliente contou um fato confidencial, sem pedir expressamente segredo. O advogado pode divulgá-lo livremente?","a":["Sim, por não haver pedido","Não; o sigilo independe de solicitação","Sim, após o fim do contrato","Sim, se omitir o nome em qualquer circunstância"],"ok":1,"e":"O art. 36 do Código de Ética estabelece o sigilo independentemente de solicitação do cliente.","src":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1016,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Uma advogada publica conteúdo informativo em rede social e deseja contratar anúncio dentro dos limites regulamentares. Qual afirmação é correta?","a":["Todo anúncio pago é proibido","Pode prometer resultados para captar clientes","A publicidade informativa pode ser admitida, sem captação indevida ou mercantilização","Qualquer anúncio permite divulgar êxitos como garantia"],"ok":2,"e":"O Provimento 205/2021 admite publicidade e marketing de conteúdo observados os limites éticos e os meios permitidos.","src":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1017,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Qual alternativa reúne as quatro espécies de sanção disciplinar do Estatuto?","a":["Advertência, prisão, multa e cassação","Censura, suspensão, exclusão e multa","Censura, detenção, exclusão e indenização","Suspensão, interdição civil, advertência e prisão"],"ok":1,"e":"O art. 35 enumera censura, suspensão, exclusão e multa. Advertência reservada pode resultar da conversão da censura em condições específicas.","src":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1018,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Qual quórum é exigido pelo Estatuto para aplicação da sanção de exclusão?","a":["Maioria simples dos presentes","Unanimidade nacional","Um terço da Subseção","Manifestação favorável de dois terços dos membros do Conselho Seccional competente"],"ok":3,"e":"O art. 38, parágrafo único, prevê o quórum de dois terços dos membros do Conselho Seccional competente.","src":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1019,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Quais são os órgãos previstos na estrutura da OAB pelo art. 45?","a":["Conselho Federal, Conselhos Seccionais, Subseções e Caixas de Assistência","STF, CNJ, OAB e Defensoria","Juntas comerciais, cartórios e conselhos fiscais","Apenas Conselho Federal e Tribunais de Ética"],"ok":0,"e":"O art. 45 identifica os quatro órgãos da estrutura da OAB.","src":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1020,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Em regra, o processo disciplinar da OAB tramita de que maneira até seu término?","a":["Sempre aberto a qualquer pessoa","Sem defesa técnica","Em sigilo, com acesso nas hipóteses legais","Exclusivamente em juízo criminal"],"ok":2,"e":"O art. 72, § 2º, do Estatuto prevê sigilo até o término, com acesso às partes, defensores e autoridade judiciária competente.","src":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1021,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Lívia, bacharel em Direito sem inscrição na OAB, pretende impetrar habeas corpus em favor de um parente. Seu colega afirma que toda postulação judicial é privativa de advogado. Qual orientação é correta?","a":["A impetração de habeas corpus não é atividade privativa da advocacia.","A impetração exige inscrição como estagiária da OAB.","A impetração é possível apenas se o paciente for advogado.","A impetração exige aprovação no Exame de Ordem, ainda sem inscrição."],"ok":0,"e":"O art. 1º, § 1º, exclui expressamente o habeas corpus das atividades privativas. Isso não autoriza o exercício de outras atividades reservadas.","src":"Estatuto, art. 1º, § 1º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1022,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Uma sociedade comercial contrata um bacharel não inscrito para prestar consultoria jurídica habitual aos seus clientes. Não haverá representação em processos. Qual a avaliação?","a":["A consultoria extrajudicial é livre a todo bacharel.","A atividade é privativa da advocacia, mesmo sem representação judicial.","O registro comercial da empresa substitui a inscrição profissional.","A atividade é permitida se os pareceres não forem assinados."],"ok":1,"e":"O art. 1º, II, reserva consultoria, assessoria e direção jurídicas à advocacia. A ausência de processo não altera esse enquadramento.","src":"Estatuto, art. 1º, II","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1023,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Um advogado regularmente inscrito presta consultoria jurídica verbal sobre contrato, sem procuração ou contrato escrito de honorários. A ausência desses documentos torna a consultoria juridicamente proibida?","a":["Sim. O mandato é indispensável para toda orientação jurídica.","Sim. A consultoria só pode ser prestada por sociedade registrada.","Não. Consultoria e assessoria podem ser verbais ou escritas, independentemente de mandato ou formalização contratual.","Não, mas somente se a consulta for gratuita."],"ok":2,"e":"O art. 5º, § 4º, admite consultoria e assessoria verbal ou escrita sem necessidade de outorga de mandato ou formalização contratual de honorários.","src":"Estatuto, art. 5º, § 4º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1024,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Uma advogada renuncia ao mandato após divergência estratégica com a cliente. Ao comunicar a renúncia, deseja divulgar no processo os motivos confidenciais da divergência. Como deve proceder?","a":["Expor todos os motivos para que a renúncia produza efeitos.","Aguardar autorização da cliente para renunciar.","Divulgar as confidências somente se o processo for público.","Comunicar a renúncia sem mencionar o motivo que a determinou, preservando o sigilo."],"ok":3,"e":"A renúncia deve preservar o sigilo e omitir seu motivo; a continuidade da representação observa o prazo estatutário e eventual substituição.","src":"Código de Ética, art. 16","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1025,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Rafael, advogado inscrito no Paraná, muda definitivamente seu domicílio profissional para Santa Catarina. Pretende manter a inscrição principal no Paraná por conveniência. Qual providência corresponde ao Estatuto?","a":["Solicitar obrigatoriamente cancelamento e repetir o Exame de Ordem.","Requerer transferência da inscrição principal para a Seccional do novo domicílio profissional.","Apenas registrar inscrição suplementar, independentemente da mudança definitiva.","Manter a principal no Paraná sem comunicação à OAB."],"ok":1,"e":"O art. 10, § 3º, exige transferência em caso de mudança efetiva do domicílio profissional para outra unidade federativa.","src":"Estatuto, art. 10, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1026,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Uma advogada pede voluntariamente cancelamento da inscrição e, anos depois, decide voltar à profissão. Qual efeito decorre do novo pedido deferido?","a":["O número anterior é obrigatoriamente restaurado.","É obrigatória nova aprovação no Exame de Ordem, em toda hipótese.","Não se restaura o número de inscrição anterior; devem ser cumpridos os requisitos do novo pedido previstos em lei.","O cancelamento voluntário impede definitivamente nova inscrição."],"ok":2,"e":"O art. 11, § 2º, prevê novo pedido sem restauração do número anterior, com comprovação dos requisitos ali indicados.","src":"Estatuto, art. 11, § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1027,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Ao analisar pedido de inscrição, um conselheiro suscita inidoneidade moral do candidato. Qual garantia deve ser respeitada para declaração da inidoneidade?","a":["Decisão individual definitiva do presidente da Seccional.","Votação por maioria simples dos presentes, sem defesa.","Rejeição automática em razão de denúncia anônima.","Procedimento com garantias de defesa e decisão de pelo menos dois terços dos votos de todos os membros do Conselho competente."],"ok":3,"e":"O art. 8º, § 3º, estabelece procedimento conforme o processo disciplinar e quórum de dois terços dos votos de todos os membros.","src":"Estatuto, art. 8º, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1028,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Uma estudante de Direito inscrita como estagiária da OAB deseja ajuizar ação cível em nome de cliente, sozinha e sem advogado responsável. Qual a regra estatutária geral?","a":["Deve praticar os atos privativos em conjunto com advogado e sob responsabilidade deste, ressalvados atos isolados autorizados pelo regulamento.","Pode atuar sozinha em qualquer processo por estar inscrita.","Pode atuar sozinha se não cobrar honorários.","Sua inscrição permite exercício pleno da advocacia."],"ok":0,"e":"O art. 3º, § 2º, exige atuação conjunta e responsabilidade do advogado, observadas as hipóteses regulamentares específicas.","src":"Estatuto, art. 3º, § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1029,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Um advogado procura cliente preso que ainda não lhe outorgou procuração. A administração do presídio impede qualquer conversa reservada exclusivamente pela falta de mandato. Qual a regra?","a":["A comunicação reservada depende sempre de procuração pública.","O advogado só pode conversar na presença de policial.","O advogado tem direito de comunicar-se pessoal e reservadamente com o cliente preso, mesmo sem procuração.","A prerrogativa existe apenas após o oferecimento de denúncia."],"ok":2,"e":"O art. 7º, III, protege comunicação pessoal e reservada com clientes presos, detidos ou recolhidos, mesmo sem procuração.","src":"Estatuto, art. 7º, III","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1030,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"A audiência foi designada para as 14h. Às 14h35, a autoridade que deveria presidi-la ainda não compareceu. A advogada deseja retirar-se. Qual procedimento está previsto?","a":["Deve aguardar obrigatoriamente duas horas.","Pode retirar-se imediatamente sem comunicação, desde o horário marcado.","Só pode sair com autorização expressa da parte contrária.","Pode retirar-se após trinta minutos, mediante comunicação protocolizada em juízo."],"ok":3,"e":"O art. 7º, XX, permite a retirada quando a autoridade não comparece após trinta minutos do horário designado, exigindo comunicação protocolizada.","src":"Estatuto, art. 7º, XX","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1031,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Um magistrado condiciona o atendimento de advogado em seu gabinete à marcação prévia, embora esteja disponível para recebê-lo. Qual prerrogativa é pertinente?","a":["Dirigir-se diretamente aos magistrados em salas e gabinetes, independentemente de horário previamente marcado, observada a ordem de chegada.","Entrar em qualquer recinto judicial sem respeitar regras de segurança.","Exigir atendimento antes de todos os demais advogados.","Solicitar audiência somente por intermédio da OAB."],"ok":0,"e":"O art. 7º, VIII, assegura acesso direto ao magistrado, independentemente de horário previamente marcado ou outra condição, observada a ordem de chegada.","src":"Estatuto, art. 7º, VIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1032,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Em investigação não sigilosa, a autoridade nega a um advogado sem procuração acesso a autos concluídos e elementos já documentados. Qual resposta corresponde à prerrogativa legal?","a":["O acesso sempre exige procuração com poderes especiais.","O acesso aos autos de investigação, nas condições legais e sem sigilo, independe de procuração.","A prerrogativa existe apenas em ação penal já ajuizada.","Somente o Ministério Público pode consultar investigação concluída."],"ok":1,"e":"O art. 7º, XIV, admite exame de autos de investigação mesmo sem procuração; o § 10 exige mandato quando houver sigilo.","src":"Estatuto, art. 7º, XIV e § 10","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1033,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Carlos integra uma sociedade de advogados com sede em São Paulo e deseja integrar outra com sede no território da mesma Seccional. Qual regra deve observar?","a":["Pode integrar ilimitadamente sociedades na mesma Seccional.","Pode integrar duas sociedades se os demais sócios concordarem.","A vedação só alcança sociedades com a mesma denominação.","Não pode integrar mais de uma sociedade com sede ou filial na mesma área territorial da Seccional, conforme o art. 15, § 4º."],"ok":3,"e":"O art. 15, § 4º, limita a participação simultânea em sociedades de advocacia no território da mesma Seccional.","src":"Estatuto, art. 15, § 4º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1034,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Uma sociedade de advocacia causa prejuízo a cliente por atuação profissional de um sócio. A sociedade não possui bens suficientes para reparação. Qual regime estatutário é pertinente?","a":["O sócio ou titular responde subsidiária e ilimitadamente pelos danos profissionais aos clientes, sem prejuízo da responsabilidade disciplinar.","A responsabilidade é sempre limitada ao valor das quotas, mesmo perante o cliente prejudicado.","O dano só pode ser reparado pelo Conselho Federal.","A responsabilidade civil inexiste quando a contratação é feita pela sociedade."],"ok":0,"e":"O art. 17 estabelece responsabilidade subsidiária e ilimitada do sócio ou titular pelos danos causados aos clientes no exercício da advocacia.","src":"Estatuto, art. 17","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1035,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Dois sócios do mesmo escritório são procurados, separadamente, por partes com interesses opostos no mesmo litígio. Ambos desejam aceitar os mandatos. É admissível?","a":["Sim, desde que trabalhem em salas diferentes.","Não. Advogados da mesma sociedade não podem representar em juízo clientes de interesses opostos.","Sim, se os honorários forem cobrados separadamente.","Sim, se o contrato social for omisso."],"ok":1,"e":"O art. 15, § 6º, veda representação judicial de interesses opostos por advogados da mesma sociedade.","src":"Estatuto, art. 15, § 6º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1036,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Uma advogada pretende constituir sociedade unipessoal utilizando exclusivamente uma denominação de fantasia, sem qualquer nome da titular. Como deve proceder?","a":["Usar qualquer nome de fantasia registrado como marca.","Registrar a sociedade como empresa de consultoria na Junta Comercial.","Usar denominação formada pelo nome completo ou parcial da titular, com a expressão legal Sociedade Individual de Advocacia.","Incluir obrigatoriamente o nome de um segundo advogado."],"ok":2,"e":"O art. 16, § 4º, disciplina a denominação da sociedade unipessoal, vinculando-a ao nome da titular e à expressão legal.","src":"Estatuto, art. 16, § 4º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1037,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Em ação judicial, cliente e advogado não pactuaram honorários, e as partes divergem posteriormente sobre a remuneração. Qual via é prevista para fixação?","a":["Arbitramento judicial conforme os parâmetros legais pertinentes.","Fixação unilateral irrevogável pelo cliente.","Cobrança necessariamente igual ao salário mínimo.","Renúncia automática a qualquer remuneração."],"ok":0,"e":"O art. 22, § 2º, permite arbitramento judicial na falta de estipulação ou acordo, observados os critérios legais.","src":"Estatuto, art. 22, § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1038,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Uma advogada possui contrato escrito de honorários vencidos e pretende executá-lo judicialmente. O contrato tem eficácia executiva nos termos do Estatuto?","a":["Não, exige sentença prévia em ação de conhecimento em qualquer caso.","Sim. O contrato escrito de honorários constitui título executivo.","Somente se homologado pelo Conselho Seccional.","Somente quando firmado por três testemunhas."],"ok":1,"e":"O art. 24 atribui eficácia de título executivo ao contrato escrito de honorários e à decisão judicial que os fixa ou arbitra.","src":"Estatuto, art. 24","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1039,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Na execução de sentença, o advogado pretende executar autonomamente a parcela de honorários sucumbenciais que lhe pertence. Qual solução é prevista?","a":["Somente o cliente pode executar honorários sucumbenciais.","O advogado depende de cessão de crédito do cliente.","O advogado possui direito autônomo de executar a sentença quanto aos honorários.","A verba deve ser recolhida integralmente à OAB."],"ok":2,"e":"O art. 23 reconhece direito autônomo do advogado para executar a sentença nessa parte, observadas as regras aplicáveis.","src":"Estatuto, art. 23","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1040,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"O profissional substabelecido com reserva de poderes possui contrato de honorários celebrado diretamente com o cliente. Precisa necessariamente da intervenção do substabelecente para cobrar o que pactuou?","a":["Sim, sem exceção.","Não, mas apenas se o substabelecente falecer.","Sim, salvo autorização do juiz da causa.","Não. O art. 26 prevê exceção para contrato celebrado diretamente com o cliente."],"ok":3,"e":"O parágrafo único do art. 26 excepciona a exigência de intervenção quando o substabelecido possui contrato com o cliente.","src":"Estatuto, art. 26, parágrafo único","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1041,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Uma vereadora que não integra a Mesa da Câmara Municipal deseja advogar contra autarquia estadual. Qual regra específica deve examinar?","a":["A atuação é livre porque a autarquia não pertence ao Município.","O impedimento dos membros do Legislativo alcança atuação contra ou a favor das entidades públicas enumeradas no art. 30, II.","A condição de vereadora sempre gera incompatibilidade total.","O impedimento existe apenas contra a Câmara Municipal."],"ok":1,"e":"O art. 30, II, estabelece impedimento amplo para membros do Legislativo, envolvendo as entidades públicas enumeradas no dispositivo.","src":"Estatuto, art. 30, II","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1042,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Um advogado assume definitivamente cargo de magistrado. Pretende manter a inscrição ativa e advogar exclusivamente em causas próprias. Qual providência estatutária se aplica?","a":["Licenciamento temporário obrigatório, ainda que o cargo seja definitivo.","Inscrição suplementar na Seccional do tribunal.","Cancelamento da inscrição em razão de atividade incompatível definitiva.","Manutenção da inscrição ativa para causas próprias."],"ok":2,"e":"A magistratura é atividade incompatível, e o exercício definitivo de atividade incompatível constitui hipótese de cancelamento (arts. 11, IV, e 28, II).","src":"Estatuto, arts. 11, IV, e 28, II","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1043,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Uma professora de curso jurídico de universidade pública é advogada e não exerce outra atividade incompatível. O impedimento do servidor do art. 30, I, aplica-se automaticamente à docência jurídica?","a":["Sim, e a docência implica proibição total.","Sim, inclusive quanto a causas privadas.","A docência exige cancelamento imediato da inscrição.","Não. O parágrafo único ressalva docentes dos cursos jurídicos."],"ok":3,"e":"O art. 30, parágrafo único, exclui os docentes dos cursos jurídicos do impedimento previsto no inciso I, sem afastar outras restrições eventualmente aplicáveis.","src":"Estatuto, art. 30, parágrafo único","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1044,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Um advogado é investido na função de Procurador-Geral de ente público. Deseja manter escritório particular e atender clientes em causas sem conexão com o ente. Qual regra específica do art. 29?","a":["Durante a investidura, somente é legitimado à advocacia vinculada à função exercida.","Pode atuar livremente em causas particulares fora do expediente.","Pode advogar contra qualquer entidade pública mediante autorização verbal.","A restrição depende exclusivamente de cláusula contratual."],"ok":0,"e":"O art. 29 reserva aos dirigentes jurídicos ali enumerados a advocacia vinculada à função durante a investidura.","src":"Estatuto, art. 29","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1045,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Um cliente exige que seu advogado aceite uma causa e garanta vitória em contrato. Qual postura é compatível com os deveres éticos?","a":["Garantir resultado sempre que houver contrato escrito.","Ocultar riscos para preservar a confiança do cliente.","Explicar riscos e consequências, sem garantir resultado processual.","Transferir integralmente ao cliente a responsabilidade técnica pela estratégia."],"ok":2,"e":"O Código de Ética exige informação clara sobre riscos e consequências e preservação da independência profissional.","src":"Código de Ética, art. 9º","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1046,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Uma advogada recebe proposta para atuar contra antigo cliente em matéria distinta, mas possui informações confidenciais relevantes para o novo litígio. Como deve avaliar a contratação?","a":["Pode utilizar livremente informações porque o mandato anterior terminou.","Deve publicar previamente as informações para eliminar sua confidencialidade.","A existência de ex-cliente torna toda atuação futura proibida, mesmo sem conflito.","Deve preservar o sigilo e abster-se quando a atuação implicar conflito ou uso indevido das informações."],"ok":3,"e":"O dever de sigilo subsiste após o fim do mandato e a atuação contra ex-cliente deve respeitar as restrições éticas pertinentes.","src":"Código de Ética, arts. 21 e 22","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1047,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"O advogado encerra a prestação de serviços e conserva documentos originais e valores recebidos em nome do cliente. Qual conduta é exigida?","a":["Devolver documentos e bens e prestar contas pormenorizadas, observados os direitos contratuais pertinentes.","Manter todos os documentos indefinidamente como garantia automática.","Dispensar prestação de contas quando não houve processo judicial.","Destruir documentos após o encerramento da atuação."],"ok":0,"e":"O Código de Ética exige devolução de bens, valores e documentos e prestação de contas ao fim ou desistência da causa, ressalvados direitos legítimos.","src":"Código de Ética, art. 12","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1048,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Um advogado criminalista é procurado por pessoa acusada de crime grave. Considera que o acusado provavelmente é culpado. Qual orientação ética se aplica à defesa?","a":["A defesa técnica só é legítima se o advogado acreditar na inocência.","É direito e dever assumir a defesa criminal sem considerar a opinião pessoal sobre a culpa, preservada a liberdade profissional de aceitar o patrocínio.","O advogado deve auxiliar a acusação sempre que tiver dúvida.","A gravidade da acusação elimina o direito de defesa."],"ok":1,"e":"O Código de Ética afirma que a defesa criminal deve ser exercida independentemente da opinião pessoal sobre a culpa do acusado.","src":"Código de Ética, art. 23","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1049,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Uma advogada é intimada como testemunha sobre fatos que conheceu no exercício profissional. Seu ex-cliente afirma que autoriza a divulgação. Qual prerrogativa subsiste?","a":["Deve revelar tudo sempre que o cliente autorizar.","Perde automaticamente o sigilo após a extinção do mandato.","A recusa só é possível em processo penal.","Pode recusar-se a depor sobre fato protegido pelo sigilo profissional, mesmo quando autorizada pelo cliente."],"ok":3,"e":"O art. 7º, XIX, protege a recusa de depoimento sobre fatos relacionados à atuação profissional e ao sigilo, mesmo quando autorizada ou solicitada pelo constituinte.","src":"Estatuto, art. 7º, XIX","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1050,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Um advogado pretende publicar anúncio que promete resultado certo e oferece contratação imediata com desconto para os primeiros interessados. Qual a avaliação ética?","a":["A promessa de resultado e a oferta voltada à captação indevida são incompatíveis com a publicidade informativa.","A publicidade é admitida se o anúncio for digital.","A promessa é permitida quando o advogado tem experiência.","O desconto torna a publicidade automaticamente ética."],"ok":0,"e":"O marketing jurídico deve respeitar a natureza informativa, sem captação indevida, mercantilização ou promessa de resultados.","src":"Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/provimentos/205-2021"},{"id":1051,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Um escritório cria vídeo educativo que explica genericamente direitos do consumidor, sem divulgar resultados de casos ou estimular contratação. Qual a regra?","a":["Todo conteúdo jurídico em redes sociais é proibido.","A divulgação informativa é admissível, observados os limites éticos e regulamentares.","A divulgação só pode ocorrer em jornais impressos.","O vídeo deve obrigatoriamente incluir tabela de honorários."],"ok":1,"e":"O Provimento 205/2021 admite marketing de conteúdo jurídico respeitados os limites de publicidade e captação.","src":"Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/provimentos/205-2021"},{"id":1052,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Uma advogada sofre acusação disciplinar e precisa utilizar informação confidencial estritamente necessária à própria defesa. O sigilo é absolutamente inderrogável?","a":["Sim, mesmo quando indispensável à defesa própria.","Não, qualquer acusação autoriza publicar integralmente todos os documentos.","Não. A defesa própria pode constituir justa causa excepcional, limitada ao necessário.","Sim, salvo autorização de todos os clientes do escritório."],"ok":2,"e":"O art. 37 prevê circunstâncias excepcionais de justa causa, inclusive defesa própria, sem afastar a necessidade de limitar a revelação.","src":"Código de Ética, art. 37","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1053,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Um advogado solicita a intermediário que procure potenciais clientes oferecendo seus serviços, em troca de participação nos honorários. Qual enquadramento é pertinente?","a":["Constitui infração disciplinar valer-se de agenciador de causas mediante participação nos honorários.","É permitido desde que a comissão seja pequena.","É permitido quando o intermediário não assina peças.","Constitui apenas irregularidade tributária."],"ok":0,"e":"O art. 34, III, tipifica valer-se de agenciador de causas mediante participação nos honorários a receber.","src":"Estatuto, art. 34, III","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1054,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Um profissional recebe valores em nome do cliente e, sem justificativa, recusa prestar contas. Qual consequência disciplinar é prevista para essa infração?","a":["Apenas advertência pública obrigatória.","Suspensão, observada a disciplina específica do art. 37.","Exclusão automática sem procedimento.","Nenhuma sanção quando houver procuração."],"ok":1,"e":"O art. 34, XXI, tipifica a recusa injustificada de prestar contas, e o art. 37 prevê suspensão, inclusive regra de duração pertinente.","src":"Estatuto, arts. 34, XXI, e 37","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1055,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Um advogado primário com circunstância atenuante recebe censura. O órgão julgador examina a possibilidade de convertê-la em advertência reservada. Isso é juridicamente possível?","a":["Não, a censura jamais pode ser convertida.","Sim, mas somente em advertência pública registrada nos assentamentos.","Sim, presente circunstância atenuante, nos termos do art. 36, parágrafo único.","A conversão exige condenação criminal anterior."],"ok":2,"e":"O art. 36 admite conversão da censura em advertência, em ofício reservado, sem registro nos assentamentos, quando presente atenuante.","src":"Estatuto, art. 36, parágrafo único","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1056,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Um processo disciplinar permanece paralisado por mais de três anos, pendente de despacho ou julgamento. Qual instituto deve ser examinado?","a":["Imprescritibilidade de toda infração ética.","Cancelamento automático da inscrição do representado.","Conversão automática em processo criminal.","Prescrição intercorrente disciplinar, com arquivamento nas condições legais."],"ok":3,"e":"O art. 43, § 1º, prevê prescrição do processo disciplinar paralisado por mais de três anos, pendente de despacho ou julgamento.","src":"Estatuto, art. 43, § 1º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1057,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Uma autoridade sustenta que a OAB está hierarquicamente subordinada a ministério federal por exercer serviço público. Qual a regra do Estatuto?","a":["A OAB é departamento do Ministério da Justiça.","A OAB não mantém vínculo funcional ou hierárquico com órgão da Administração Pública.","A OAB é subordinada ao TCU para toda decisão disciplinar.","A OAB integra a estrutura do Poder Judiciário."],"ok":1,"e":"O art. 44, § 1º, afasta vínculo funcional ou hierárquico com órgãos da Administração Pública.","src":"Estatuto, art. 44, § 1º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1058,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"A infração disciplinar foi praticada no território de Seccional diferente daquela da inscrição principal do advogado, sem envolver o Conselho Federal. Qual competência ordinária?","a":["A competência é sempre da Seccional de inscrição principal.","Somente o Conselho Federal pode apurar faltas fora do domicílio.","O poder de punir compete ao Conselho Seccional em cuja base territorial ocorreu a infração.","O cliente escolhe livremente qualquer Seccional."],"ok":2,"e":"O art. 70 estabelece competência territorial da infração, ressalvada falta cometida perante o Conselho Federal.","src":"Estatuto, art. 70","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1059,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Uma Seccional recebe notícia idônea de infração disciplinar sem representação formal do cliente. Pode instaurar processo de ofício?","a":["Não, somente mediante queixa-crime.","Não, exige representação exclusiva do cliente.","Sim, mas sem necessidade de garantir defesa.","Sim. O processo disciplinar pode ser instaurado de ofício ou mediante representação de autoridade ou pessoa interessada."],"ok":3,"e":"O art. 72 autoriza instauração de ofício ou mediante representação, preservadas as garantias processuais.","src":"Estatuto, art. 72","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1060,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Um advogado recebe sanção disciplinar e pretende recorrer ao órgão competente da OAB. Qual regra geral sobre efeito do recurso consta do Estatuto?","a":["Os recursos têm efeito suspensivo, ressalvadas as exceções legais.","Nenhum recurso possui efeito suspensivo.","Todos têm efeito suspensivo sem exceção.","Só possuem efeito suspensivo se houver depósito judicial."],"ok":0,"e":"O art. 77 prevê efeito suspensivo como regra e excepciona matérias específicas, como eleições, suspensão preventiva e cancelamento de inscrição obtida com falsa prova.","src":"Estatuto, art. 77","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1061,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Um advogado suspenso pela OAB assina petição em ação cível durante o cumprimento da sanção. Qual é a consequência prevista no Estatuto para esse ato privativo?","a":["O ato é válido se o cliente não souber da suspensão.","O ato só é anulável mediante decisão da OAB.","O ato é nulo, sem prejuízo das demais consequências cabíveis.","A suspensão impede apenas a captação de novos clientes."],"ok":2,"e":"A suspensão impede o exercício profissional. O art. 4º, parágrafo único, declara nulos os atos praticados por advogado suspenso.","src":"Estatuto, art. 4º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1062,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"O cliente outorga procuração geral para o foro. O advogado pretende praticar ato para o qual a legislação exige poderes especiais. A procuração genérica é suficiente?","a":["Sim, pois a procuração geral abrange todas as disposições de direitos.","Sim, desde que o ato seja oral.","Não, porque toda procuração judicial deve ser pública.","Não. Deve haver a outorga dos poderes especiais exigidos para esse ato."],"ok":3,"e":"O art. 5º, § 2º, distingue poderes gerais de atos que exigem autorização específica.","src":"Estatuto, art. 5º, § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1063,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Uma advogada empregada recebe ordem empresarial para subscrever parecer contrário à sua convicção jurídica. O vínculo de emprego elimina sua independência técnica?","a":["Não. O vínculo empregatício não retira a isenção técnica nem a independência profissional.","Sim, o empregador determina obrigatoriamente o conteúdo jurídico.","Sim, desde que exista cláusula de subordinação técnica.","Não, mas apenas se o parecer for gratuito."],"ok":0,"e":"O art. 18 preserva a independência e a isenção técnica do advogado empregado, apesar da relação de emprego.","src":"Estatuto, art. 18","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1064,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Uma advogada é contratada como assessora jurídica de uma empresa. Seu diretor exige que ela patrocine gratuitamente um divórcio pessoal dele, estranho ao contrato de trabalho. Qual regra protege a profissional?","a":["Ela é obrigada a aceitar qualquer causa do diretor.","Ela não está obrigada a prestar serviços de interesse pessoal do empregador fora da relação de emprego.","Ela só pode recusar se pedir demissão.","Ela deve atender todos os sócios gratuitamente."],"ok":1,"e":"O art. 18, § 1º, distingue as obrigações profissionais contratadas de serviços de interesse pessoal do empregador.","src":"Estatuto, art. 18, § 1º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1065,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Uma candidata à inscrição na OAB possui diploma de Direito obtido no exterior. A apresentação desse diploma, sem revalidação, satisfaz o requisito acadêmico?","a":["Sim, qualquer diploma estrangeiro é automaticamente reconhecido.","Sim, desde que seja traduzido, dispensados os demais requisitos.","Não, pois graduados no exterior nunca podem inscrever-se.","Não. Deve comprovar revalidação do título e atender aos demais requisitos legais."],"ok":3,"e":"O art. 8º, § 2º, exige título de graduação devidamente revalidado e atendimento aos demais requisitos.","src":"Estatuto, art. 8º, § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1066,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Um profissional inscrito na OAB enfrenta doença mental considerada curável e requer afastamento. Qual modalidade de alteração da inscrição contempla expressamente essa situação?","a":["Licenciamento.","Exclusão disciplinar definitiva.","Transferência obrigatória para outra Seccional.","Inscrição suplementar."],"ok":0,"e":"O art. 12, III, prevê licenciamento na hipótese de doença mental considerada curável. Não se trata de sanção disciplinar.","src":"Estatuto, art. 12, III","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1067,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Uma advogada decide interromper temporariamente a carreira por motivo pessoal justificado, sem assumir cargo incompatível. Existe hipótese legal de licenciamento a pedido?","a":["Não, só há licenciamento por incompatibilidade.","Sim. O requerimento com motivo justificado é hipótese de licenciamento.","Não, a única opção é exclusão disciplinar.","Sim, mas somente após cinco anos de exercício."],"ok":1,"e":"O art. 12, I, permite o licenciamento solicitado por motivo justificado, distinto do cancelamento a pedido.","src":"Estatuto, art. 12, I","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1068,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Após falecimento de advogado regularmente inscrito, a família pretende transferir a inscrição profissional para um herdeiro bacharel em Direito. Qual solução é correta?","a":["O herdeiro pode utilizar a inscrição se concluir o curso.","A inscrição é transferida mediante inventário.","A inscrição do falecido deve ser cancelada; o herdeiro necessita de inscrição própria.","A inscrição permanece ativa até o pagamento das anuidades futuras."],"ok":2,"e":"O art. 11, III, prevê cancelamento por falecimento. A inscrição é pessoal e não constitui direito transmissível por herança.","src":"Estatuto, art. 11, III","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1069,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Uma advogada sofre ofensa pública relacionada diretamente ao exercício de sua profissão. Qual instrumento institucional pode ser utilizado para defender a dignidade da advocacia?","a":["Desagravo público promovido pela OAB, nas condições regulamentares.","Cancelamento da inscrição da advogada ofendida.","Revisão automática de todos os processos que ela patrocina.","Transferência obrigatória do processo para a Justiça Federal."],"ok":0,"e":"O art. 7º, XVII, assegura desagravo público quando a ofensa decorre do exercício profissional ou de cargo ou função da OAB.","src":"Estatuto, art. 7º, XVII","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1070,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Em repartição pública, um advogado precisa examinar autos de processo administrativo não sigiloso, mesmo sem procuração. O servidor afirma que somente as partes podem consultar. Qual a orientação?","a":["O acesso sempre depende de mandato específico.","O advogado pode examinar os autos não sujeitos a sigilo e obter cópias, observadas as condições legais.","A prerrogativa existe apenas perante tribunais judiciais.","O acesso depende de autorização de todos os interessados."],"ok":1,"e":"O art. 7º, XIII, disciplina exame de autos findos ou em andamento, sem procuração, quando não submetidos a sigilo ou segredo de justiça.","src":"Estatuto, art. 7º, XIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1071,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Durante sessão de julgamento, a parte contrária utiliza documento com equívoco factual que pode influenciar a decisão. Qual prerrogativa permite ao advogado fazer esclarecimento pontual nos limites legais?","a":["Interromper o julgamento por tempo ilimitado.","Exigir mudança imediata da composição do tribunal.","Usar da palavra pela ordem para intervenção pontual nas hipóteses previstas no Estatuto.","Substituir o relator na leitura do voto."],"ok":2,"e":"O art. 7º, X, disciplina a intervenção pela ordem, pontual e voltada ao esclarecimento de equívocos ou dúvidas relevantes.","src":"Estatuto, art. 7º, X","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1072,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Uma audiência de instrução coloca os advogados das partes em posições de distância desigual em relação ao juiz. Qual garantia específica deve orientar a organização da sala?","a":["O advogado do autor deve necessariamente ficar em plano superior.","O advogado com inscrição mais antiga deve ficar mais próximo do juiz.","A distância é determinada exclusivamente pelo valor da causa.","Advogados de autor e requerido devem permanecer no mesmo plano e em posição equidistante do magistrado."],"ok":3,"e":"O art. 6º, § 2º, disciplina a paridade espacial entre os advogados nas audiências de instrução e julgamento.","src":"Estatuto, art. 6º, § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1073,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Uma sociedade de advogados abre filial em outro Estado. Além da averbação pertinente, qual providência registral é exigida dos sócios pelo Estatuto?","a":["Cancelamento da inscrição principal de todos os sócios.","Inscrição suplementar no Conselho Seccional em cujo território funcionar a filial.","Registro individual dos sócios na Junta Comercial.","Nenhuma inscrição adicional, ainda que exista filial."],"ok":1,"e":"O art. 15, § 5º, exige registro da filial e inscrição suplementar dos sócios no território correspondente.","src":"Estatuto, art. 15, § 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1074,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"O cliente contrata um escritório organizado como sociedade de advogados. Na procuração judicial, pretende indicar somente a pessoa jurídica, sem individualizar profissionais. Qual é a regra?","a":["A procuração deve ser outorgada apenas à sociedade.","Basta indicar o CNPJ da sociedade, dispensado o nome do advogado.","A procuração deve ser outorgada individualmente aos advogados e indicar a sociedade de que façam parte.","A procuração deve ser outorgada ao Conselho Seccional."],"ok":2,"e":"O art. 15, § 3º, exige outorga individual aos advogados com indicação da sociedade.","src":"Estatuto, art. 15, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1075,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Uma sociedade de advogados propõe contrato de associação com advogado autônomo para prestação de serviços e partilha de resultados. Qual condição formal o Estatuto prevê?","a":["Registro obrigatório na Junta Comercial como sociedade empresária.","Dispensa de qualquer registro se o associado já estiver inscrito.","Homologação necessária pelo Tribunal Superior do Trabalho.","Registro do contrato de associação no Conselho Seccional em cuja base territorial se situe a sede da sociedade."],"ok":3,"e":"Os arts. 17-A e 17-B permitem associação, observados seus pressupostos e registro perante a Seccional competente. O contrato não pode mascarar vínculo empregatício.","src":"Estatuto, arts. 17-A e 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1076,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Um escritório deseja incluir no objeto social a revenda habitual de produtos eletrônicos aos clientes, mantendo a forma de sociedade de advocacia. É permitido?","a":["Não. A sociedade de advocacia não pode realizar atividades estranhas à advocacia.","Sim, desde que os lucros sejam usados para pagar advogados.","Sim, quando os produtos forem vendidos somente aos clientes.","Sim, se os sócios aprovarem por unanimidade."],"ok":0,"e":"O art. 16 impede registro e funcionamento de sociedades de advocacia que realizem atividades estranhas à profissão.","src":"Estatuto, art. 16","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1077,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Cliente e advogado pactuam honorários, mas o contrato não estabelece datas de pagamento. Qual regra supletiva o Estatuto prevê?","a":["Pagamento integral obrigatório antes de qualquer ato.","Pagamento exclusivamente após o trânsito em julgado.","Um terço no início, outro até a decisão de primeira instância e o restante ao final.","Parcelamento obrigatório em doze prestações iguais."],"ok":2,"e":"O art. 22, § 3º, estabelece essa divisão na ausência de estipulação em contrário.","src":"Estatuto, art. 22, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1078,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Antes da expedição de mandado de levantamento, o advogado junta aos autos seu contrato de honorários. O cliente ainda não pagou essa verba. Qual providência é prevista?","a":["A liberação integral ao cliente, vedada qualquer dedução.","A transferência integral do crédito ao advogado.","A retenção de todos os valores pela OAB.","O pagamento direto dos honorários por dedução da quantia do constituinte, salvo prova de pagamento anterior."],"ok":3,"e":"O art. 22, § 4º, disciplina o pagamento direto mediante dedução, desde que atendidas as condições legais.","src":"Estatuto, art. 22, § 4º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1079,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Um advogado falece antes de receber honorários sucumbenciais por serviços que já prestou. Qual é a regra sobre o crédito?","a":["Os honorários proporcionais ao trabalho realizado podem ser recebidos pelos sucessores ou representantes legais.","Os honorários revertem automaticamente ao Estado.","A morte extingue qualquer crédito honorário.","A verba passa integralmente à parte adversa."],"ok":0,"e":"O art. 24, § 2º, protege o crédito proporcional ao trabalho do advogado falecido ou civilmente incapaz.","src":"Estatuto, art. 24, § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1080,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Cliente e parte adversária firmam acordo sem anuência do advogado, incluindo cláusula que pretende afastar seus honorários. Qual efeito essa cláusula produz sobre o crédito profissional?","a":["Os honorários são automaticamente extintos.","O acordo sem aquiescência do advogado não prejudica os honorários convencionados ou concedidos por sentença.","A cláusula é eficaz apenas porque a causa terminou.","O advogado só mantém honorários se o acordo for extrajudicial."],"ok":1,"e":"O art. 24, § 4º, resguarda a verba honorária contra acordo celebrado sem a aquiescência do profissional.","src":"Estatuto, art. 24, § 4º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1081,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Um advogado assume cargo titular de serviço de registro imobiliário e deseja atuar em ações privadas sem relação com o cartório. Qual é a restrição estatutária?","a":["Existe apenas impedimento contra o Município.","A advocacia privada é livre fora do expediente.","A restrição depende de pedido do usuário do cartório.","A atividade de titular de serviço notarial ou registral é incompatível com a advocacia."],"ok":3,"e":"O art. 28, IV, prevê incompatibilidade para ocupantes de cargos ou funções vinculados aos serviços notariais e de registro.","src":"Estatuto, art. 28, IV","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1082,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Uma deputada passa a integrar a Mesa de sua Casa Legislativa e pretende continuar patrocinando causas particulares. Qual é a consequência profissional durante a função?","a":["Incompatibilidade com a advocacia, inclusive em causas próprias, segundo a regra geral.","Apenas impedimento contra a União.","Liberdade profissional para todas as causas privadas.","Suspensão limitada às causas eleitorais."],"ok":0,"e":"O art. 28, I, prevê incompatibilidade dos membros da Mesa do Poder Legislativo e de seus substitutos legais.","src":"Estatuto, art. 28, I","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1083,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Um advogado ocupa função pública de direção sem poder decisório relevante sobre interesses de terceiros. A mera denominação do cargo determina incompatibilidade automaticamente?","a":["Sim, todo cargo chamado de direção é incompatível sem exceção.","Não. O art. 28, § 2º, prevê ressalva para quem não detém poder de decisão relevante, a juízo do Conselho competente.","Não, porque cargos de direção nunca geram restrições.","Sim, mas exclusivamente quando houver remuneração elevada."],"ok":1,"e":"O art. 28, § 2º, estabelece exceção ao inciso III, cabendo examinar a efetiva relevância decisória e a apreciação pelo Conselho competente.","src":"Estatuto, art. 28, III e § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1084,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Um profissional exerce função diretamente vinculada à fiscalização de tributos e pretende atuar como advogado em causas de família. Qual enquadramento prevê o Estatuto?","a":["Impedimento apenas em processos de cobrança de tributos.","Liberdade para qualquer causa fora do expediente.","Incompatibilidade total, mesmo em matéria alheia à fiscalização tributária.","Impedimento somente perante o órgão que o remunera."],"ok":2,"e":"O art. 28, VII, prevê incompatibilidade para ocupantes de funções com competência de lançamento, arrecadação ou fiscalização de tributos e contribuições parafiscais.","src":"Estatuto, art. 28, VII","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1085,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Um cliente já possui advogado constituído e procura outro profissional para assumir a mesma causa. Não há urgência nem motivo justificável. Qual cuidado ético antecede a aceitação?","a":["Dar conhecimento prévio ao advogado anteriormente constituído.","Aceitar secretamente o mandato e ocultar a contratação.","Exigir que o cliente renuncie a todos os direitos.","Solicitar autorização da parte contrária."],"ok":0,"e":"O art. 14 do Código de Ética exige conhecimento prévio do patrono anterior, ressalvando motivo plenamente justificável ou medidas judiciais urgentes e inadiáveis.","src":"Código de Ética, art. 14","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1086,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Uma advogada percebe que o cliente exige manutenção de versão fática deliberadamente falsa em juízo. Qual dever ético deve orientar a atuação?","a":["Reproduzir a versão falsa sempre que houver ordem escrita.","Preservar lealdade e boa-fé, abstendo-se de expor fatos falseando deliberadamente a verdade.","Alterar provas para proteger o interesse do cliente.","Divulgar publicamente todas as confidências recebidas."],"ok":1,"e":"O art. 6º do Código de Ética proíbe a exposição deliberadamente falsa dos fatos em juízo ou na via administrativa. O sigilo e a eventual renúncia devem ser respeitados.","src":"Código de Ética, art. 6º","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1087,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Uma advogada decide substabelecer o mandato sem reserva de poderes, encerrando sua própria representação. Qual exigência ética deve ser observada?","a":["Obter consentimento da p
