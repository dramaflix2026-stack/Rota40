abalho?","Sim, nas hipóteses legais."],["Culpa concorrente sempre elimina indenização?","Não; pode influenciar seu valor."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Posse, propriedade e direitos reais":{"intro":"Quem mora em um imóvel alugado exerce poderes sobre ele, mas não é necessariamente seu proprietário. A distinção entre posse, propriedade e direitos reais limitados explica como o sistema protege o uso de bens e organiza a aquisição do domínio.","objectives":["Diferenciar posse, detenção e propriedade.","Reconhecer a proteção possessória.","Identificar requisitos de aquisição.","Distinguir usufruto, servidão e garantias reais."],"sections":[{"title":"1. Posse como situação de fato","ref":"CC, arts. 1.196 a 1.208","paragraphs":["Possuidor exerce de fato algum dos poderes inerentes à propriedade. Essa situação pode existir independentemente da demonstração do domínio. A proteção da posse não transforma automaticamente seu titular em proprietário.","Detenção ocorre nas situações legalmente definidas de conservação da posse em nome de outra pessoa, sob dependência e instruções. Observe também atos de mera permissão ou tolerância. A distinção depende da relação concreta, não apenas do contato físico com o bem."],"example":"Um empregado conserva equipamento da empresa sob ordens de seu responsável. A utilização física não basta para enquadrá-lo como possuidor autônomo.","trap":"Ter acesso físico a um bem não significa necessariamente ter posse juridicamente autônoma."},{"title":"2. Posse direta e indireta","ref":"CC, art. 1.197","paragraphs":["A posse direta pertence a quem mantém relação imediata com a coisa em razão de direito pessoal ou real, em situações como locação. A posse indireta permanece com aquele de quem a posse direta foi obtida, conforme o instituto.","Essas posições podem coexistir. Não é necessário que apenas uma pessoa exerça proteção possessória em toda situação. Na prova, identifique a relação que explica o desdobramento da posse e os limites do direito de cada parte."],"example":"O locatário utiliza a residência enquanto o locador mantém posse indireta. A existência de locação não elimina automaticamente uma dessas posições.","trap":"Posse indireta não significa ausência absoluta de proteção possessória."},{"title":"3. Proteção contra ameaça, turbação e esbulho","ref":"CC, art. 1.210; CPC, arts. 560 a 568","paragraphs":["Ameaça indica risco de agressão à posse; turbação consiste em perturbação sem perda total da posse; esbulho representa sua privação. Essa classificação direciona os instrumentos possessórios, observados os requisitos processuais.","Interdito proibitório protege diante de ameaça juridicamente relevante, manutenção enfrenta turbação e reintegração busca recuperar posse perdida. Para resolver a questão, descreva a agressão antes de escolher o nome da ação."],"example":"Um vizinho impede parcialmente o acesso a uma área utilizada pelo possuidor, sem retirar toda sua posse. Investigue turbação e os requisitos da manutenção.","trap":"Não confunda reintegração de posse com ação fundada exclusivamente no domínio."},{"title":"4. Aquisição da propriedade e usucapião","ref":"CC, arts. 1.238 a 1.245","paragraphs":["A usucapião é modo de aquisição sujeito a requisitos que variam conforme a modalidade. Tempo é apenas um elemento. Examine características da posse, finalidade, área, boa-fé ou título quando exigidos e eventuais vedações.","Na transferência imobiliária entre vivos, o registro do título translativo possui papel essencial para aquisição do domínio. Isso é distinto da aquisição por usucapião e da sucessão hereditária. Identifique primeiro qual modo de aquisição é descrito."],"example":"Uma pessoa possui escritura de compra e venda, mas ainda não registrou o título. Não presuma a aquisição do domínio pelo contrato isoladamente.","trap":"Posse prolongada não garante usucapião se faltarem requisitos ou o bem for público."},{"title":"5. Direitos reais sobre coisa alheia","ref":"CC, arts. 1.225, 1.378 e seguintes","paragraphs":["O proprietário reúne poderes sobre o bem, mas alguns direitos reais permitem distribuir faculdades entre pessoas distintas. Usufruto atribui poderes de uso e fruição nos termos legais, preservando a posição do nu-proprietário.","Servidão predial beneficia um imóvel em relação a outro, conforme sua constituição. Direitos reais de garantia vinculam bens à satisfação de obrigações sob regimes próprios. Não confunda garantia real com transferência automática do domínio ao credor."],"example":"Uma pessoa recebe usufruto de imóvel e pode fruí-lo dentro das condições do direito constituído. Outra mantém a nua-propriedade.","trap":"Usufruto não equivale a propriedade plena."}],"checks":[["Posse e propriedade são sinônimos?","Não."],["Locador e locatário podem possuir simultaneamente?","Sim, por meio da posse indireta e direta."],["Qual instrumento enfrenta esbulho?","Reintegração de posse, observados os requisitos."],["Usucapião exige somente tempo?","Não. Os requisitos variam por modalidade."],["O que caracteriza o usufruto?","Faculdades de uso e fruição nos termos legais."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Direito de família":{"intro":"Família envolve vínculos pessoais, patrimônio e responsabilidades. O estudo civil não se limita à celebração do casamento: também abrange união estável, filiação, alimentos e cuidado com filhos. Vamos separar essas dimensões para evitar conclusões automáticas.","objectives":["Identificar efeitos patrimoniais do casamento.","Compreender a união estável.","Reconhecer igualdade de filiação.","Analisar alimentos, poder familiar e guarda."],"sections":[{"title":"1. Casamento e escolha do regime de bens","ref":"CC, arts. 1.511, 1.639 e 1.640","paragraphs":["O casamento constitui relação familiar submetida a deveres pessoais e efeitos jurídicos patrimoniais. Regime de bens define como o patrimônio se comunica, se administra e se divide nas situações pertinentes.","Na falta de convenção válida, aplica-se em regra a comunhão parcial, ressalvadas hipóteses de regime obrigatório. Outros regimes seguem suas próprias condições. Identifique eventual pacto e a disciplina vigente, inclusive decisões constitucionais que influenciam sua aplicação."],"example":"Um casal celebra casamento sem escolher regime diverso. A análise começa pela regra supletiva e pela verificação de eventual exceção legal.","trap":"Casamento não implica necessariamente comunicação de todos os bens."},{"title":"2. Comunhão parcial e bens excluídos","ref":"CC, arts. 1.658 a 1.666","paragraphs":["A comunhão parcial distingue, em linhas gerais, aquisições onerosas realizadas durante o casamento de patrimônios que permanecem particulares nas hipóteses legais. A data e a origem da aquisição importam.","Bens anteriores e determinados recebimentos por doação ou sucessão podem ser excluídos. Sub-rogação, frutos, benfeitorias e outras situações possuem regras próprias. Identifique a categoria do bem antes de calcular meação."],"example":"Um cônjuge recebe uma herança durante o casamento. Não se deve presumir comunicação integral apenas porque o recebimento aconteceu na constância da união.","trap":"Meação depende do regime de bens e da origem do patrimônio."},{"title":"3. União estável e reconhecimento","ref":"CC, arts. 1.723 a 1.727; CF, art. 226","paragraphs":["União estável exige convivência pública, contínua e duradoura com objetivo de constituir família, observados impedimentos e demais condições. O Código Civil não estabelece prazo mínimo geral de convivência.","A interpretação constitucional reconhece a proteção familiar das uniões homoafetivas. No âmbito patrimonial, a regra da comunhão parcial se aplica na ausência de contrato escrito em sentido diverso, ressalvadas particularidades jurídicas."],"example":"Duas pessoas mantêm relacionamento por longo período, mas os fatos não esclarecem se existe objetivo de constituir família. A duração isolada não resolve a classificação.","trap":"Namoro prolongado e união estável não são automaticamente equivalentes."},{"title":"4. Filiação e poder familiar","ref":"CC, arts. 1.596 e 1.630 a 1.638; CF, art. 227","paragraphs":["A igualdade entre filhos impede tratamento discriminatório em razão da origem da filiação. Vínculos biológicos, adotivos e socioafetivos exigem análise dos respectivos regimes e da jurisprudência quando pertinente.","Poder familiar envolve responsabilidades parentais de cuidado, proteção e formação, exercidas segundo o interesse dos filhos. Não se confunde com propriedade sobre a criança. Separação dos pais não extingue automaticamente suas responsabilidades."],"example":"Após o término da relação entre os pais, permanece a necessidade de organizar cuidado e convivência da criança. A relação conjugal é distinta da relação parental.","trap":"Fim do casamento não equivale a fim do poder familiar."},{"title":"5. Alimentos, guarda e proteção","ref":"CC, arts. 1.583 a 1.584 e 1.694 a 1.710","paragraphs":["Alimentos atendem necessidades juridicamente reconhecidas considerando recursos da pessoa obrigada e proporcionalidade. A fixação não segue porcentagem universal. Alterações relevantes na situação das partes podem justificar revisão.","A guarda deve respeitar a proteção integral da criança e as regras legais aplicáveis. Guarda compartilhada não significa necessariamente divisão matemática do tempo. A legislação prevê atenção ao risco de violência doméstica ou familiar, entre outras circunstâncias."],"example":"Uma mudança comprovada nas necessidades de uma criança ou nos recursos de quem presta alimentos pode justificar análise de revisão judicial.","trap":"Não existe percentual único de pensão aplicável a todos os casos."}],"checks":[["Qual regime é supletivo em regra?","Comunhão parcial, ressalvadas hipóteses legais."],["Herança recebida durante casamento comunica sempre?","Não. Verifique o regime e as exclusões."],["União estável exige prazo mínimo geral?","Não."],["Separação extingue automaticamente poder familiar?","Não."],["Guarda compartilhada exige exatamente metade do tempo com cada genitor?","Não. A organização deve respeitar as condições legais e o interesse da criança."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]},"Direito das sucessões":{"intro":"Quando uma pessoa falece, é necessário identificar quais bens pertenciam a ela, quem pode sucedê-la e como dividir o patrimônio. O primeiro cuidado é distinguir meação de herança. Em seguida, examinam-se os herdeiros, o testamento e as dívidas.","objectives":["Reconhecer abertura e transmissão da sucessão.","Separar aceitação, renúncia e partilha.","Identificar ordem sucessória e legítima.","Compreender meação, testamento e limites das dívidas."],"sections":[{"title":"1. Abertura da sucessão e transmissão","ref":"CC, arts. 1.784 a 1.791","paragraphs":["A morte abre a sucessão. Pelo princípio da saisine, a herança se transmite desde logo aos herdeiros legítimos e testamentários nas condições legais. Inventário e partilha são relevantes para organizar, apurar e individualizar esse patrimônio.","Até a partilha, a herança é considerada uma unidade indivisível. O herdeiro não pode presumir que determinado objeto já lhe pertence individualmente apenas por sua expectativa de quinhão. Identifique a data de abertura e a lei aplicável."],"example":"Uma pessoa falece deixando três herdeiros e diversos bens. A transmissão da herança não significa que cada um possa escolher imediatamente um bem específico como exclusivamente seu.","trap":"Abertura da sucessão não se confunde com conclusão do inventário."},{"title":"2. Aceitação e renúncia","ref":"CC, arts. 1.804 a 1.813","paragraphs":["Aceitação confirma a transmissão nos termos legais e pode ocorrer pelas formas previstas. Renúncia rejeita a posição hereditária e exige manifestação expressa por instrumento público ou termo judicial.","Não confunda renunciar à herança com ceder direitos hereditários a uma pessoa determinada. A destinação, a forma e os efeitos tributários e civis podem ser diferentes. O Código também disciplina situações de prejuízo a credores do renunciante."],"example":"Um herdeiro informa verbalmente a parentes que não deseja receber nada. A declaração isolada não satisfaz a forma legal da renúncia.","trap":"Não presuma renúncia válida a partir de mera inatividade."},{"title":"3. Ordem de vocação e concorrência","ref":"CC, arts. 1.829 a 1.844; STF, Tema 809","paragraphs":["A sucessão legítima segue ordem de vocação hereditária. Descendentes, ascendentes, cônjuge e colaterais aparecem em posições e condições distintas. A concorrência entre cônjuge e outros sucessores depende do enquadramento legal.","A sucessão do companheiro deve considerar a tese do STF que aplica a ordem do art. 1.829 também à união estável. Não utilize isoladamente o antigo art. 1.790 como regra vigente de diferenciação sucessória. Questões sobre outros efeitos exigem exame próprio."],"example":"Uma pessoa deixa companheiro sobrevivente e parentes colaterais. A análise precisa considerar o art. 1.829 e a tese constitucional, não apenas o texto histórico do art. 1.790.","trap":"Não confunda a equiparação da ordem sucessória com solução automática de toda controvérsia familiar."},{"title":"4. Legítima e testamento","ref":"CC, arts. 1.845 a 1.857","paragraphs":["O testamento permite ao titular organizar disposições para depois da morte dentro dos limites legais. A existência de herdeiros necessários restringe a liberdade de disposição patrimonial pela proteção da legítima.","O art. 1.845 enumera descendentes, ascendentes e cônjuge como herdeiros necessários. Metade da herança constitui a legítima desses herdeiros nas condições legais. Para companheiros, consulte o alcance dos precedentes aplicáveis antes de generalizar efeitos."],"example":"Uma pessoa com herdeiros necessários pretende destinar todo o patrimônio a um terceiro por testamento. É necessário apurar a parcela disponível e proteger a legítima.","trap":"Testamento não afasta indistintamente as regras imperativas da sucessão."},{"title":"5. Meação, dívidas e partilha","ref":"CC, arts. 1.792 e 1.997 a 2.027","paragraphs":["Meação é a parcela patrimonial própria decorrente do regime de bens; herança é o acervo transmitido pelo falecido. Antes de calcular quinhões, apure a titularidade dos bens e separe eventual meação.","As dívidas do falecido são consideradas no acervo segundo o regime legal. O herdeiro não responde além das forças da herança, observadas as regras de prova. A partilha individualiza os quinhões após apuração das posições patrimoniais."],"example":"Em um casamento submetido a regime comunicativo, parte de determinado patrimônio pode pertencer ao sobrevivente por meação. Somente o acervo do falecido integra a herança a distribuir.","trap":"Não calcule a legítima sobre patrimônio que já pertence exclusivamente ao sobrevivente."}],"checks":[["Quando se abre a sucessão?","Com a morte."],["Renúncia verbal basta?","Não. Exige escritura pública ou termo judicial."],["Qual regra de vocação se aplica ao companheiro segundo o Tema 809?","A do art. 1.829 do Código Civil."],["O que é legítima?","Parcela reservada aos herdeiros necessários nas condições legais."],["Herdeiro responde ilimitadamente por dívidas?","Não. A responsabilidade é limitada às forças da herança, observadas as regras legais."]],"schedule":[["Leitura guiada",12],["Consultar os dispositivos indicados",8],["Resolver os casos e testar a compreensão",7],["Revisar e anotar dúvidas",3]]}};

function stopTimer(){if(timerId!==null){clearInterval(timerId);timerId=null}}function persistSession(){state.session={...state.session,title:view,ids:queue.map(q=>q.id),pos,answered,selectedAnswer,score:sessionScore,deadline:state.session?.deadline||null,answers:state.session?.answers||[]};save()}function start(list,title,mode='practice',routeTask=null,confirmed=false){if(!list.length)return;if(state.session&&!confirmed){const previous=state.session;rotaDialog({title:'Iniciar outra atividade?',message:'Você tem um treino em andamento. Ao iniciar outro, a sessão anterior será encerrada.',action:'Iniciar nova atividade',onConfirm:()=>{if(state.session===previous)start(list,title,mode,routeTask,true)}});return}stopTimer();view=title;queue=list;pos=0;answered=false;selectedAnswer=null;sessionScore=0;state.session={title,mode,routeTask,startedAt:Date.now(),deadline:title==='Simulados'?Date.now()+(mode==='full'?300:list.length*3)*60000:null,answers:[],selections:{},marks:{}};history.pushState(null,'','#'+encodeURIComponent(title));persistSession();question()}function resumeSession(navigate=true){const s=state.session;if(!s)return false;const items=s.ids.map(id=>questionById.get(id));if(items.some(q=>!q)||!items.length){state.session=null;save();return false}stopTimer();view=s.title;queue=items;pos=s.pos;answered=s.answered;selectedAnswer=s.selectedAnswer;sessionScore=s.score;if(navigate)history.pushState(null,'','#'+encodeURIComponent(view));question();return true}function endSession(timedOut=false){stopTimer();const s=state.session;if(!s)return;if(s.mode==='full'){finishFullExam(timedOut);return}if(s.mode==='personal'){finishPersonalExam(timedOut);return}if(s.mode==='diagnostic'){finishDiagnostic();return}if(s.mode==='adaptive'){finishAdaptive(s);return}const result={title:view,score:sessionScore,total:queue.length,date:Date.now(),timedOut,answers:s.answers||[]};state.results.push(result);state.session=null;save();layout(`<div class="panel"><h2>${timedOut?'Tempo encerrad function errorEvidence(pool,attempts,reviews={},weights=[],now=Date.now()){const byId=new Map(pool.map(q=>[q.id,q])),history=new Map();for(const x of attempts){if(!byId.has(x.id)||!Number.isFinite(x.date)||x.date>now)continue;const h=history.get(x.id)||[];h.push(x);history.set(x.id,h)}const rows=[];for(const [id,h] of history){h.sort((a,b)=>a.date-b.date);const q=byId.get(id),latest=h[h.length-1],wrong=x=>x.correct!==true||!!x.unknown||!!x.blank,failures=h.filter(wrong).length;if(!failures)continue;let streak=0;for(let i=h.length-1;i>=0&&wrong(h[i]);i--)streak++;const pending=wrong(latest),due=Number.isFinite(reviews[id]?.due)&&reviews[id].due<=now,age=Math.min(14,Math.max(0,(now-latest.date)/86400000)),weight=Number(weights[q.s])||0;const score=Math.min(streak,5)*8+Math.min(failures,8)*3+(due?10:0)+Math.min(weight,8)*2+age+(q.difficulty==='Avançada'?2:q.difficulty==='Intermediária'?1:0);rows.push({q,latest,failures,streak,pending,due,score,reason:latest.unknown?'Não sei':latest.blank?'Em branco':'Resposta incorreta'})}return rows.sort((a,b)=>Number(b.pending)-Number(a.pending)||b.score-a.score||a.q.id-b.q.id)}

function nextReviewSchedule(previous={},grade='again',difficulty='Intermediária',source='flash',now=Date.now()){const day=86400000,old=Math.max(0,Math.min(30,Number(previous?.interval)||0)),factor=difficulty==='Fácil'?2.5:difficulty==='Avançada'?1.6:2;let interval,delay;if(grade==='again'){interval=0;delay=source==='flash'?600000:0}else if(grade==='hard'){interval=1;delay=day}else{if(Number.isFinite(previous?.due)&&previous.due>now&&old>0)return {...previous,lastSignal:now};interval=Math.min(30,Math.max(1,Math.round(old*factor)));delay=interval*day}return {...previous,interval,due:now+delay,lastSignal:now,source,grade}}

function spacedQueue(pool,reviews={},attempts=[],now=Date.now()){const evidence=new Map();for(const x of attempts){if(!Number.isFinite(x.date)||x.date>now)continue;const old=evidence.get(x.id);if(!old||x.date>=old.date)evidence.set(x.id,x)}return [...pool].sort((a,b)=>{const score=q=>{const r=reviews[q.id],x=evidence.get(q.id),due=Number.isFinite(r?.due)?r.due:null,group=due===null?1:due<=now?0:2;return [group,group===0?Number(x?.correct!==false):0,due??0,q.id]};const x=score(a),y=score(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0})}

 if(type==='mapas'||type==='revisao')return back+`<div class="panel"><h2>${type==='mapas'?'Mapas mentais':'Revisão estratégica'}</h2><p class="muted">Organize os conceitos e pratique a recuperação ativa.</p></div>${modules.map((m,j)=>`<div class="panel ethics-lesson"><h3>${m.t}</h3>${trackMap(m)}<button class="btn alt" onclick="trackPractice(${k},${j})">Revisar com questões</button></div>`).join('')}`;
 if(type==='simulado')return back+`<div class="panel"><h2>Simulado temático — ${subjects[k]}</h2><p class="muted">${modules.length} questões autorais · ${modules.length*3} minutos · uma por módulo · correção ao final. Não equivale à prova oficial.</p><button class="btn gold" style="margin-top:15px" onclick="trackSim(${k})">Começar simulado</button></div>`;
 if(type==='flash'){const list=trackFlashQueue(k),q=list.find(q=>q.id===trackFlashId)||list[0];trackFlashId=q.id;const due=list.filter(q=>!state.reviews[q.id]||state.reviews[q.id].due<=Date.now()).length;return back+`<div class="panel question"><div class="label">FLASHCARDS · ${due} disponíveis para revisão</div><p class="muted">${q.topic}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div class="sessiontools"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="trackFlashMove(${k},false)">Revisar em 10 min</button><button class="btn gold" onclick="trackFlashMove(${k},true)">Já sei</button>`:`<button class="btn alt" onclick="trackFlashNext(${k})">Próximo cartão</button>`}</div></div>`}
 return back;
}
function render(){const attempts=state.attempts.filter(x=>x.id>=1000&&questionById.has(x.id)),correct=attempts.filter(x=>x.correct).length,recent=last(),errors=authoredQuestions.filter(q=>recent[q.id]?.correct===false);let b='';if(view==='Conquistas'){b=gameHome()}else if(view==='Diagnóstico'){b=diagnosticHome()}else if(view==='Meu desempenho'){b=`<p class="muted">Acompanhe o histórico de treino da sua conta.</p>${readinessPanel()}<div class="grid"><div class="tile"><div class="label">Respostas registradas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros pendentes</div><div class="metric">${errors.length}</div></div></div><div class="panel"><h3>Desempenho por disciplina</h3><p class="muted">São considerados os registros de treino, inclusive dúvidas e questões em branco dos simulados.</p>${subjects.map((s,i)=>{const a=attempts.filter(x=>questionById.get(x.id)?.s===i);const p=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0;return '<div class="listline"><div class="smallrow"><strong>'+s+'</strong><span class="muted">'+(a.length?p+'%':'Sem dados')+'</span></div>'+(a.length?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}).join('')}</div>${difficultyMap()}`}else if(view==='Provas anteriores'){officialSearch='';b=officialLibrary()}else if(view==='Configurações'){b=`<div class="panel"><h3>${state.profileReady?'Preferências de estudo':'Vamos configurar sua preparação'}</h3><p class="muted" style="margin:8px 0 18px">Informe o tempo diário e a data da prova. Suas preferências são salvas na conta.</p>${profileForm()}<div class="settingsrow"><strong>Meta de treinamento sugerida</strong><strong>45/80</strong></div><div class="settingsrow"><div><strong>Conta e sincronização</strong><div class="muted">Sua conta autenticada salva o progresso no Supabase.</div></div><span class="badge-mini">Ativa</span></div></div>`}else if(view==='Ajuda'){b=`<div class="panel"><h3>Como usar o Rota 40</h3><div class="listline"><strong>1. Comece pelo diagnóstico</strong><p class="muted">Responda às 60 questões e descubra suas prioridades nas 20 disciplinas.</p></div><div class="listline"><strong>2. Abra Minha rota</strong><p class="muted">Defina o tempo que tem disponível e veja as prioridades.</p></div><div class="listline"><strong>3. Revise e acompanhe</strong><p class="muted">Use o caderno de erros e o painel de desempenho.</p></div><div class="notice">Seu progresso é vinculado à conta. O Mentor IA auxilia no estudo, mas pode cometer erros; confira sempre as fontes oficiais.</div><button class="btn alt" onclick="go('Diagnóstico')">Começar diagnóstico</button></div>`}else if(view.startsWith('Etica:')){b=ethicsScreen()}else if(view.startsWith('Trilha:')){b=trackScreen(trackIndex())}else if(view.startsWith('Disciplina:')&&studyTracks[Number(view.split(':')[1])]){b=trackPage(Number(view.split(':')[1]))}else if(view.startsWith('Disciplina:')){const i=Number(view.split(':')[1]),n=qs.filter(q=>q.s===i).length;b=`<button class="breadcrumb" onclick="go('Disciplinas')">${ico('Página inicial')} Todas as disciplinas</button><div class="panel"><div class="tilehead"><span class="tileicon gold">${ico('Disciplinas')}</span><div><h3>${subjects[i]}</h3><p class="muted">Trilha de preparação · primeira fase</p></div></div></div><h3 class="sectiontitle">Materiais e ferramentas</h3><div class="grid two">${['Teoria resumida','Legislação comentada','Mapas mentais','Questões comentadas','Flashcards','Revisão da disciplina'].map(m=>`<div class="tile"><div class="tilehead"><span class="tileicon">${ico(m==='Questões comentadas'?'Questões':m==='Flashcards'?'Flashcards':'Disciplinas')}</span><div class="tilecopy"><strong>${m}</strong><div class="muted">${m==='Questões comentadas'&&n?n+' questão demonstrativa':'Conteúdo em preparação'}</div></div></div>${m==='Questões comentadas'&&n?`<button class="btn alt" onclick="train(${i})">Praticar →</button>`:''}</div>`).join('')}</div>`}else if(view==='Painel'){b=`${journeyPanel()}${gameSummary()}${readinessPanel(true)}<div class="grid"><div class="tile"><div class="label">Registros de treino</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros para revisar</div><div class="metric">${errors.length}</div></div></div><h3 class="sectiontitle">Estudo e prática</h3><div class="grid two">${['Disciplinas','Questões','Simulados','Provas anteriores'].map(m=>actionTile(m)).join('')}</div><h3 class="sectiontitle">Revisão e acompanhamento</h3><div class="grid two">${['Caderno de erros','Flashcards','Meu desempenho','Conquistas','Mentor IA'].map(m=>actionTile(m)).join('')}</div>`}else if(view==='Minha rota'){b=adaptiveHome()}else if(view==='Disciplinas'){b=`<p class="muted">Escolha uma das 20 matérias para explorar sua trilha. ${Object.keys(studyTracks).length} disciplinas com 200 módulos de estudo e 2.000 questões.</p><label class="searchbox">${ico('search')}<input aria-label="Buscar disciplina" placeholder="Buscar disciplina..." oninput="filterSubjects(this.value)"></label><div class="catalog" id="catalog">${subjects.map((s,i)=>`<button class="tile action" data-subject="${i}" onclick="go('Disciplina:${i}')"><div class="tilehead"><span class="tileicon">${ico('Disciplinas')}</span><div class="tilecopy"><strong>${s}</strong><div class="muted">${studyTracks[i]?studyTracks[i].modules.length+' módulos disponíveis':'Em preparação'}</div></div><span class="arrow">${ico('arrow')}</span></div></button>`).join('')}</div><p class="muted hidden" id="noSubjects">Nenhuma disciplina encontrada.</p>`}else if(view==='Questões'){b=`<div class="panel"><h3>Banco de questões autorais</h3><p>${authoredQuestions.length.toLocaleString('pt-BR')} questões autorais com fundamentação legal, distribuídas nas 20 disciplinas. Escolha o tamanho do treino; questões ainda não praticadas têm prioridade.</p><div class="filterrow"><select id="questionSubject" aria-label="Filtrar matéria" onchange="updateDifficultyAvailability()"><option value="">Todas as matérias</option>${subjects.map((s,i)=>`<option value="${i}" ${authoredQuestions.some(q=>q.s===i)?"":"disabled"}>${s}</option>`).join("")}</select><select id="questionDifficulty" aria-label="Dificuldade" onchange="updateDifficultyAvailability()"><option value="all">Todos os níveis</option><option value="adaptive">Adaptativo</option><option value="Fácil">Fácil</option><option value="Intermediária">Intermediária</option><option value="Avançada">Avançada</option></select><select id="questionCount" aria-label="Quantidade de questões" onchange="updateDifficultyAvailability()"><option value="10">10 questões</option><option value="20" selected>20 questões</option><option value="50">50 questões</option><option value="100">100 questões</option></select><button class="btn" id="questionTrainButton" onclick="trainSelected()">Iniciar treino</button></div><p class="muted" id="difficultyAvailability" aria-live="polite">${authoredQuestions.length} questões disponíveis</p><p class="muted">O treino adaptativo considera acertos recentes por disciplina; não equivale a uma previsão de aprovação.</p></div>`}else if(view==='Simulados'){b=fullExamHome()}else if(view==='Caderno de erros'){b=errorReviewHome()}else if(view==='Flashcards'){const q=authoredQuestions[flash%authoredQuestions.length];b=reviewOverview()+`<div class="panel question"><div class="label">Cartão ${flash%authoredQuestions.length+1} de ${authoredQuestions.length} · ${subjects[q.s]}</div><p class="muted">${state.reviews[q.id]?state.reviews[q.id].due<=Date.now()?"Revisão disponível":"Próxima revisão: "+new Date(state.reviews[q.id].due).toLocaleString("pt-BR"):"Ainda não revisado"}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="reviewCard(false)">Não lembrei · 10 min</button><button class="btn alt" onclick="reviewCard(&quot;hard&quot;)">Difícil · 1 dia</button><button class="btn alt" onclick="reviewCard(true)">Já sei · agendar revisão</button>`:`<button class="btn alt" onclick="nextGeneralFlash();showBack=false;render()">Próximo cartão</button>`}</div></div>`}else if(view==='Mentor IA'){b=mentorHome();queueMicrotask(mentorCheck)}else{b='<div class="panel"><p>Consulte as opções no menu.</p></div>'}layout(b)}routeFromHash();
</script></body></html>
