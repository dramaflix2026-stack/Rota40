rajudicial → petição conjunta","Advogados distintos → obrigatórios","Dissídio coletivo → competência e pressupostos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const processLaborQuestions=[{"id":10001,"s":9,"module":0,"topic":"Organização, competência e jurisdição trabalhista","difficulty":"Intermediária","q":"Uma empregada é contratada em uma cidade, mas trabalha durante todo o contrato em outra. Sem exceção aplicável, qual local define a competência territorial?","a":["O local da prestação de serviços","Sempre o domicílio do empregador","A sede do TST","O local de assinatura do contrato"],"ok":0,"e":"O art. 651 da CLT estabelece como regra a localidade da prestação de serviços, ainda que a contratação tenha ocorrido em outro local.","src":"CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10002,"s":9,"module":0,"topic":"Organização, competência e jurisdição trabalhista","difficulty":"Intermediária","q":"Uma ação indenizatória por dano moral decorrente da relação de emprego, entre empregado e empregador, pertence em regra a qual Justiça?","a":["Justiça Eleitoral","Justiça Militar","Justiça do Trabalho","Justiça Federal comum necessariamente"],"ok":2,"e":"O art. 114, VI, da Constituição atribui à Justiça do Trabalho as ações de indenização por dano moral ou patrimonial decorrentes da relação de trabalho.","src":"CF, arts. 111 a 116; CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":10003,"s":9,"module":1,"topic":"Princípios, partes e representação","difficulty":"Intermediária","q":"O empregado pode interpor recurso de revista ao TST pessoalmente, invocando o jus postulandi?","a":["Sim, sem restrição","Não, o jus postulandi não alcança recursos da competência do TST","Sim, se o valor for baixo","Sim, com autorização do preposto"],"ok":1,"e":"A Súmula 425 delimita o jus postulandi às Varas e TRTs, não abrangendo recursos de competência do TST.","src":"TST, Súmula 425","url":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"id":10004,"s":9,"module":1,"topic":"Princípios, partes e representação","difficulty":"Intermediária","q":"Nos termos do art. 843, § 3º, da CLT, o preposto deve necessariamente ser empregado da reclamada?","a":["Sim, sempre","Sim, por pelo menos um ano","Sim, salvo homologação sindical","Não"],"ok":3,"e":"A CLT expressamente dispensa que o preposto tenha vínculo empregatício com a parte reclamada, mantidas as demais exigências.","src":"CLT, arts. 763 a 769, 791 e 843; Súmula 425 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10005,"s":9,"module":2,"topic":"Atos processuais, prazos e nulidades","difficulty":"Intermediária","q":"Um prazo processual trabalhista de oito dias começa a fluir regularmente. Como são contados os dias?","a":["Dias corridos","Somente dias úteis quando autorizado","Dias úteis, conforme art. 775","Somente dias de audiência"],"ok":2,"e":"O art. 775 determina contagem em dias úteis, com exclusão do começo e inclusão do vencimento.","src":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10006,"s":9,"module":2,"topic":"Atos processuais, prazos e nulidades","difficulty":"Intermediária","q":"Qual período de suspensão do curso dos prazos processuais consta do art. 775-A?","a":["20 de dezembro a 20 de janeiro, inclusive","Todo o mês de fevereiro","15 a 31 de dezembro exclusivamente","Apenas feriados nacionais"],"ok":0,"e":"O art. 775-A fixa esse intervalo, sem confundir suspensão de prazos com férias individuais de magistrados.","src":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10007,"s":9,"module":3,"topic":"Reclamação trabalhista e ritos","difficulty":"Intermediária","q":"Uma reclamação individual contra empresa privada tem valor de 30 salários mínimos. Sem exclusão especial, qual rito se aplica?","a":["Ordinário obrigatório","Sumaríssimo","Ação rescisória","Procedimento penal"],"ok":1,"e":"O art. 852-A abrange dissídios individuais de até quarenta salários mínimos, respeitadas as exclusões legais.","src":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10008,"s":9,"module":3,"topic":"Reclamação trabalhista e ritos","difficulty":"Intermediária","q":"No procedimento sumaríssimo, o reclamante pede citação por edital. Qual a regra legal?","a":["Admitida automaticamente","Obrigatória em qualquer processo","Admitida mediante simples requerimento","Não se admite citação por edital"],"ok":3,"e":"O art. 852-B, II, veda a citação por edital nesse procedimento e atribui ao autor a correta indicação do nome e endereço do reclamado.","src":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10009,"s":9,"module":4,"topic":"Audiência, conciliação e resposta","difficulty":"Intermediária","q":"O reclamante falta injustificadamente à audiência inicial, sem situação excepcional. Qual consequência geral do art. 844?","a":["Arquivamento da reclamação","Condenação automática do réu","Procedência integral","Conversão em recurso de revista"],"ok":0,"e":"O caput do art. 844 prevê arquivamento em caso de ausência do reclamante; outras consequências possuem disciplina própria.","src":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10010,"s":9,"module":4,"topic":"Audiência, conciliação e resposta","difficulty":"Intermediária","q":"O reclamado está ausente, mas seu advogado comparece. A contestação escrita e os documentos devem ser necessariamente recusados?","a":["Sim, em todos os casos","Sim, se houver pedido de horas extras","Não, o § 5º do art. 844 prevê seu recebimento","Sim, porque a defesa técnica é proibida"],"ok":2,"e":"O art. 844, § 5º, determina o recebimento da contestação e dos documentos quando o advogado comparece, ainda que ausente o reclamado. Isso não elimina automaticamente os efeitos da ausência.","src":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10011,"s":9,"module":5,"topic":"Provas, ônus probatório e sentença","difficulty":"Intermediária","q":"O empregador alega ter quitado verba cuja existência é incontroversa. Quem deve provar o pagamento segundo a distribuição geral?","a":["O juiz","O reclamante em qualquer caso","O sindicato","O reclamado"],"ok":3,"e":"O pagamento é fato extintivo, cujo ônus recai em regra sobre o reclamado pelo art. 818, II.","src":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10012,"s":9,"module":5,"topic":"Provas, ônus probatório e sentença","difficulty":"Intermediária","q":"Qual o limite geral de testemunhas por parte no procedimento sumaríssimo?","a":["Duas","Três","Seis","Dez"],"ok":0,"e":"O art. 852-H, § 2º, limita a duas testemunhas por parte no sumaríssimo.","src":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10013,"s":9,"module":6,"topic":"Custas, gratuidade e honorários","difficulty":"Intermediária","q":"Qual faixa percentual o art. 791-A prevê para honorários advocatícios sucumbenciais?","a":["Um a dois por cento","Cinco a quinze por cento","Vinte a cinquenta por cento","Percentual fixo de trinta por cento"],"ok":1,"e":"O caput do art. 791-A estabelece mínimo de cinco e máximo de quinze por cento, calculados segundo as bases legais.","src":"CLT, arts. 789 a 791-A; STF, ADI 5766","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10014,"s":9,"module":6,"topic":"Custas, gratuidade e honorários","difficulty":"Intermediária","q":"O simples recebimento de créditos judiciais por beneficiário da justiça gratuita autoriza cobrança automática de honorários advocatícios suspensos?","a":["Sim, sem examinar a situação econômica","Sim, sempre que houver qualquer crédito","Não, deve ser observada a ADI 5766 e demonstrada a superação da hipossuficiência nos termos aplicáveis","Sim, por decisão exclusiva do advogado credor"],"ok":2,"e":"A interpretação do TST à ADI 5766 afasta a presunção automática de superação da insuficiência pela mera obtenção de créditos.","src":"STF, ADI 5766; aplicação pelo TST","url":"https://jurisprudencia-backend.tst.jus.br/rest/documentos/35018180d7c8c03d5dc82d4f7bff208b"},{"id":10015,"s":9,"module":7,"topic":"Recursos trabalhistas","difficulty":"Intermediária","q":"Contra sentença definitiva de Vara do Trabalho, qual é o recurso típico e o prazo geral?","a":["Recurso ordinário, oito dias úteis","Agravo de petição, trinta dias","Recurso de revista, cinco dias","Apelação civil, quinze dias"],"ok":0,"e":"O art. 895, I, prevê recurso ordinário em oito dias, contados segundo o art. 775.","src":"CLT, arts. 893 a 900; Súmula 214 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10016,"s":9,"module":7,"topic":"Recursos trabalhistas","difficulty":"Intermediária","q":"O prazo dos embargos de declaração trabalhistas previsto no art. 897-A é de quantos dias?","a":["Oito","Dez","Quinze","Cinco"],"ok":3,"e":"O art. 897-A prevê cinco dias para embargos de declaração, observada a contagem processual.","src":"CLT, arts. 893 a 900; Súmula 214 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10017,"s":9,"module":8,"topic":"Liquidação e execução trabalhista","difficulty":"Intermediária","q":"Qual prazo comum previsto no art. 879, § 2º, para impugnar fundamentadamente a conta de liquidação?","a":["Quarenta e oito horas","Oito dias","Trinta dias","Sessenta dias"],"ok":1,"e":"O dispositivo fixa prazo comum de oito dias, exigindo indicação dos itens e valores objeto de discordância, sob pena de preclusão.","src":"CLT, arts. 876 a 892 e 897","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10018,"s":9,"module":8,"topic":"Liquidação e execução trabalhista","difficulty":"Intermediária","q":"Qual recurso é tipicamente cabível das decisões do juiz na execução trabalhista, conforme art. 897, a?","a":["Recurso ordinário","Recurso especial","Agravo de petição","Apelação civil"],"ok":2,"e":"O agravo de petição é previsto no art. 897, a, com prazo de oito dias e requisitos específicos.","src":"CLT, arts. 876 a 892 e 897","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10019,"s":9,"module":9,"topic":"Ações especiais, dissídios coletivos e homologação","difficulty":"Intermediária","q":"Empregado e empregador pretendem homologar acordo extrajudicial pela CLT. Podem utilizar o mesmo advogado?","a":["Sim, sempre","Sim, se houver concordância verbal","Sim, se o valor for pequeno","Não, o art. 855-B exige advogados distintos"],"ok":3,"e":"O § 1º do art. 855-B proíbe representação das partes por advogado comum nesse procedimento.","src":"CF, art. 114; CLT, arts. 853 a 855-E e 856 a 875","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10020,"s":9,"module":9,"topic":"Ações especiais, dissídios coletivos e homologação","difficulty":"Intermediária","q":"Qual prazo o art. 853 prevê para ajuizamento de inquérito de apuração de falta grave, contado da suspensão do empregado na hipótese legal?","a":["Trinta dias","Cinco dias","Um ano","Dois anos"],"ok":0,"e":"O art. 853 prevê apresentação da reclamação escrita em trinta dias contados da suspensão, quando aplicável o inquérito.","src":"CF, art. 114; CLT, arts. 853 a 855-E e 856 a 875","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"}];const businessModules=[{"t":"Teoria da empresa e empresário","ref":"CC, arts. 966 a 980","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Atividade empresarial","A teoria da empresa centra-se na atividade econômica organizada de produção ou circulação de bens ou serviços, exercida profissionalmente. Analise a organização dos fatores de produção, a habitualidade e a finalidade econômica. Empresa é atividade; empresário é o sujeito que a exerce."],["Profissionais intelectuais","O exercício de profissão científica, literária ou artística não caracteriza, por si só, empresário, mesmo com auxiliares. A exceção ocorre quando a profissão constitui elemento de empresa. Compare um profissional que presta pessoalmente seus serviços com uma organização na qual a atividade intelectual integra estrutura empresarial mais ampla."],["Registro e capacidade","O empresário deve inscrever-se no registro mercantil antes de iniciar a atividade. A falta de inscrição não elimina necessariamente sua condição material de empresário, mas gera irregularidade. O empresário rural possui regime facultativo de inscrição nos termos do art. 971. A continuidade de empresa por incapaz depende das condições e autorização judicial previstas em lei."]],"map":["Empresa → atividade","Empresário → sujeito","Profissão intelectual → exceção do elemento de empresa","Registro rural → regime próprio"]},{"t":"Estabelecimento, nome empresarial e registro","ref":"CC, arts. 1.142 a 1.168; Lei 8.934/1994","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Estabelecimento empresarial","O estabelecimento reúne bens organizados para exercício da empresa. Pode abranger bens materiais e imateriais e não se confunde com imóvel, endereço ou pessoa jurídica. Um estabelecimento pode ser objeto unitário de negócios jurídicos, observadas exigências específicas."],["Trespasse e credores","Na alienação do estabelecimento, o art. 1.145 protege credores quando não restam ao alienante bens suficientes para quitar o passivo. O adquirente responde por débitos anteriores regularmente contabilizados, com responsabilidade solidária temporária do alienante nos termos do art. 1.146. Sucessão fiscal e trabalhista têm regras próprias."],["Nome e proteção","Nome empresarial identifica o empresário ou sociedade; marca distingue produtos ou serviços. Firma e denominação seguem regras próprias. O registro mercantil protege o nome no âmbito previsto pela legislação, sem substituir registro de marca. Salvo autorização expressa, o alienante não pode concorrer com o adquirente nos cinco anos seguintes à transferência."]],"map":["Estabelecimento → conjunto organizado de bens","Trespasse → proteção de credores","Nome empresarial ≠ marca","Não concorrência → 5 anos, regra geral"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8934.htm"},{"t":"Sociedades: classificação e personalidade jurídica","ref":"CC, arts. 981 a 996","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Sociedade simples e empresária","A classificação decorre, em regra, da natureza da atividade, e não da quantidade de sócios. Sociedade por ações é sempre empresária e cooperativa é sempre simples, independentemente do objeto. A forma limitada pode ser adotada em regimes distintos, observadas as normas de registro."],["Personalização e autonomia","A sociedade adquire personalidade com inscrição regular do ato constitutivo no registro adequado. Patrimônio social e patrimônio dos sócios não se confundem automaticamente. A desconsideração depende dos pressupostos do regime jurídico aplicável e não corresponde à dissolução da sociedade."],["Sociedades não personificadas","A sociedade em comum é disciplinada enquanto seus atos constitutivos não estão inscritos, ressalvadas hipóteses legais. A sociedade em conta de participação tem sócio ostensivo que atua em nome próprio perante terceiros e sócio participante com relação interna. Seu contrato não lhe confere personalidade, mesmo se registrado."]],"map":["Empresária → atividade, ressalvadas regras especiais","S.A. → sempre empresária","Cooperativa → sempre simples","SCP → sem personalidade jurídica"]},{"t":"Sociedade limitada e governança","ref":"CC, arts. 1.052 a 1.087","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Quotas e capital","A limitada admite uma ou mais pessoas. Cada sócio tem responsabilidade restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital. A prestação de serviços não pode constituir contribuição ao capital da limitada. Distinga capital subscrito de capital efetivamente integralizado."],["Administração e deliberações","A administração pode ser atribuída a sócios ou não sócios, observados requisitos e quóruns vigentes. Deliberações sobre alteração contratual e administração seguem o Código Civil e o contrato social. Não memorize quóruns antigos: as Leis 13.792/2019 e 14.451/2022 modificaram regras relevantes."],["Saída e exclusão","Retirada, morte e exclusão de sócio possuem pressupostos e efeitos próprios. A exclusão extrajudicial por justa causa exige os requisitos do art. 1.085, inclusive previsão contratual e deliberação pertinente. A apuração de haveres não elimina automaticamente responsabilidade por obrigações anteriores nos limites legais."]],"map":["Limitada → um ou mais sócios","Quotas → responsabilidade limitada","Integralização → solidariedade","Exclusão → requisitos legais e contratuais"]},{"t":"Sociedades anônimas e mercado de capitais","ref":"Lei 6.404/1976, arts. 1º a 4º, 109, 116 a 117 e 138 a 158","url":"https://www.planalto.gov.br/ccivil_03/leis/l6404compilada.htm","lessons":[["Capital e ações","A companhia tem capital dividido em ações. A responsabilidade do acionista limita-se ao preço de emissão das ações subscritas ou adquiridas, observadas hipóteses próprias de responsabilização. Ações ordinárias e preferenciais possuem direitos definidos por lei e estatuto; não se presume que todas tenham voto idêntico."],["Companhias abertas e fechadas","A distinção depende da admissão dos valores mobiliários à negociação no mercado de valores mobiliários. Companhias abertas submetem-se ao regime de registro, fiscalização e divulgação pertinente à CVM. Não basta possuir muitos acionistas para caracterizar companhia aberta."],["Órgãos e deveres","Assembleia geral, administração e conselho fiscal exercem atribuições distintas. Administradores devem atuar com diligência, lealdade e finalidade compatível com o interesse social. O controlador não possui liberdade para abusar do poder de controle em prejuízo da companhia ou dos demais acionistas."]],"map":["Capital → ações","Acionista → preço de emissão","Aberta → mercado de valores mobiliários","Controle → deveres e limites"]},{"t":"Títulos de crédito: princípios e circulação","ref":"CC, arts. 887 a 926","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Princípios cambiários","Literalidade delimita o conteúdo do direito incorporado ao título; autonomia protege a independência das obrigações cambiárias nos limites legais. A cartularidade tradicional deve ser compreendida considerando títulos eletrônicos admitidos pela legislação. Nem todo documento representativo de crédito é título cambiário."],["Endosso e cessão","O endosso é meio de circulação de títulos à ordem. Sua forma e responsabilidade do endossante dependem do regime aplicável, especialmente de leis cambiárias especiais. Não confunda endosso com cessão civil, que possui regras próprias quanto a efeitos e defesas oponíveis."],["Aval e garantias","O aval garante obrigação cambiária e tem autonomia própria, distinta da fiança. O avalista equipara-se ao avalizado nos termos do regime jurídico correspondente. O Código Civil veda aval parcial, mas leis especiais podem admiti-lo; antes de responder, identifique o título e a lei aplicável."]],"map":["Literalidade → conteúdo do título","Autonomia → obrigações cambiárias","Endosso → circulação","Aval ≠ fiança"]},{"t":"Cheque, nota promissória e duplicata","ref":"Lei 7.357/1985; Lei 5.474/1968; Decreto 57.663/1966","url":"https://www.planalto.gov.br/ccivil_03/leis/l7357.htm","lessons":[["Cheque","Cheque constitui ordem de pagamento à vista. A indicação de data futura não altera essa natureza cambiária, embora a apresentação antecipada possa produzir consequências civis. Os prazos de apresentação variam conforme a praça de emissão e pagamento; a prescrição executiva possui termo inicial próprio."],["Nota promissória","A nota promissória contém promessa de pagamento, ao contrário da ordem característica do cheque. A Lei Uniforme de Genebra disciplina seus requisitos e aplicação de regras cambiárias pertinentes. Examine vencimento, assinaturas, aval e endosso antes de determinar a obrigação exigível."],["Duplicata","A duplicata vincula-se a operação mercantil ou prestação de serviços documentada, segundo a legislação. Para cobrança executiva de duplicata não aceita, devem ser examinados protesto, prova de entrega ou prestação e ausência de recusa legítima, conforme o regime. A duplicata escritural também possui disciplina própria."]],"map":["Cheque → ordem à vista","Promissória → promessa","Duplicata → operação causal","Execução → requisitos do título"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5474.htm"},{"t":"Propriedade industrial e contratos empresariais","ref":"Lei 9.279/1996, arts. 8º, 9º, 40, 122 a 129 e 133; Lei 13.966/2019","url":"https://www.planalto.gov.br/ccivil_03/leis/l9279.htm","lessons":[["Patentes e desenhos industriais","A proteção de invenções exige novidade, atividade inventiva e aplicação industrial. Modelo de utilidade tem requisitos distintos relacionados à melhoria funcional. Patente e registro de desenho industrial não se confundem com marca. A vigência da patente deve observar o art. 40 e a decisão do STF na ADI 5529."],["Marcas e concorrência","A marca protege sinal distintivo nas condições legais, e a aquisição do direito de propriedade decorre, em regra, de registro válido. A proteção admite situações especiais, como marca notoriamente conhecida. O prazo de registro da marca é de dez anos, prorrogável por períodos iguais sucessivos."],["Franquia e outros contratos","Na franquia empresarial, o franqueador autoriza uso de marca e outros direitos e métodos de negócio, conforme contrato e lei específica. A circular de oferta deve ser entregue pelo menos dez dias antes da assinatura ou pagamento previsto em lei. A franquia não configura, por si só, vínculo empregatício ou relação de consumo entre franqueador e franqueado."]],"map":["Patente → requisitos técnicos","Marca → sinal distintivo","Marca registrada → 10 anos renováveis","Franquia → circular prévia"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/lei/l13966.htm"},{"t":"Recuperação judicial e extrajudicial","ref":"Lei 11.101/2005, arts. 1º a 6º, 47 a 69 e 161 a 167","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm","lessons":[["Objetivo e legitimidade","A recuperação busca superar crise econômico-financeira de atividade viável, preservando atividade produtiva, empregos e interesses dos credores. Sua incidência depende do sujeito e das exclusões do art. 2º. O art. 48 exige exercício regular de atividade por mais de dois anos e outros requisitos cumulativos."],["Processamento, créditos e plano","Deferimento do processamento não equivale à concessão da recuperação. A suspensão de execuções e a sujeição de créditos têm exceções expressas. Em regra, os créditos existentes na data do pedido se submetem, ainda que não vencidos. O plano deve ser apresentado no prazo legal de sessenta dias contado da publicação da decisão de processamento."],["Assembleia e recuperação extrajudicial","Credores deliberam sobre o plano conforme classes e quóruns pertinentes; existem hipóteses de concessão judicial em condições legais mesmo sem aprovação ordinária. A recuperação extrajudicial permite negociação e homologação nos limites de sua disciplina. Verifique créditos excluídos, quóruns e requisitos na redação atualizada pela Lei 14.112/2020."]],"map":["Recuperação → atividade viável","Processamento ≠ concessão","Plano → 60 dias, regra legal","Créditos → sujeição e exceções"]},{"t":"Falência, classificação de créditos e encerramento","ref":"Lei 11.101/2005, arts. 75 a 160","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm","lessons":[["Pressupostos da falência","A falência é procedimento coletivo de liquidação e reorganização de ativos, submetido às finalidades legais. O art. 94 prevê hipóteses distintas de impontualidade injustificada, execução frustrada e atos falimentares. Não se decreta falência apenas porque a empresa está momentaneamente com prejuízo contábil."],["Efeitos e administração","A decretação altera a administração e disponibilidade patrimonial do falido. O administrador judicial desempenha funções de arrecadação, verificação de créditos e outras previstas em lei, sob fiscalização judicial. O juízo falimentar possui competência própria, com exceções expressas."],["Pagamento e encerramento","A ordem de pagamento deve distinguir créditos extraconcursais do art. 84 e concursais do art. 83. Créditos trabalhistas têm preferência nos limites legais e existem regras para garantias reais, tributários e outras classes. Encerramento do processo e extinção das obrigações do falido possuem requisitos próprios, alterados pela reforma de 2020."]],"map":["Falência → hipóteses do art. 94","Administrador judicial → funções legais","Extraconcursal → art. 84","Concursal → ordem do art. 83"]}];const businessQuestions=[{"id":11001,"s":10,"module":0,"topic":"Teoria da empresa e empresário","difficulty":"Intermediária","q":"Uma escritora trabalha pessoalmente com auxílio de uma secretária, sem que a profissão constitua elemento de empresa. É necessariamente empresária?","a":["Sim, por possuir auxiliar","Não, aplica-se a ressalva do art. 966","Sim, por receber remuneração","Sim, se publicar livros"],"ok":1,"e":"A contratação de auxiliares não basta para caracterizar atividade empresarial intelectual. Deve estar presente o elemento de empresa (art. 966, parágrafo único).","src":"CC, arts. 966 a 980","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11002,"s":10,"module":0,"topic":"Teoria da empresa e empresário","difficulty":"Intermediária","q":"Qual o regime geral de inscrição do empresário cuja atividade rural constitui sua principal profissão?","a":["Inscrição obrigatória em cartório civil em qualquer caso","Proibição de inscrição mercantil","Inscrição facultativa no registro mercantil, com os efeitos legais","Registro exclusivo na CVM"],"ok":2,"e":"O art. 971 permite requerer inscrição ao empresário rural, que, depois de inscrito, se equipara ao empresário sujeito a registro.","src":"CC, arts. 966 a 980","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11003,"s":10,"module":1,"topic":"Estabelecimento, nome empresarial e registro","difficulty":"Intermediária","q":"Qual conceito corresponde ao conjunto de bens organizado para exercer a empresa?","a":["Estabelecimento empresarial","Capital social exclusivamente","Pessoa jurídica","Marca registrada necessariamente"],"ok":0,"e":"O art. 1.142 define o estabelecimento pela organização de bens para exercício da empresa, e não apenas pelo local físico.","src":"CC, arts. 1.142 a 1.168; Lei 8.934/1994","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11004,"s":10,"module":1,"topic":"Estabelecimento, nome empresarial e registro","difficulty":"Intermediária","q":"Salvo autorização expressa, por quanto tempo o alienante de estabelecimento fica impedido de concorrer com o adquirente?","a":["Um ano","Dois anos","Dez anos","Cinco anos"],"ok":3,"e":"O art. 1.147 estabelece vedação de concorrência por cinco anos subsequentes à transferência, salvo autorização expressa.","src":"CC, arts. 1.142 a 1.168; Lei 8.934/1994","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11005,"s":10,"module":2,"topic":"Sociedades: classificação e personalidade jurídica","difficulty":"Intermediária","q":"Independentemente de seu objeto, como se classifica a cooperativa segundo o art. 982?","a":["Sempre sociedade empresária","Sempre sociedade simples","Sempre sociedade anônima","Sempre sociedade em comum"],"ok":1,"e":"O parágrafo único do art. 982 atribui natureza simples à cooperativa e empresária à sociedade por ações.","src":"CC, arts. 981 a 996","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11006,"s":10,"module":2,"topic":"Sociedades: classificação e personalidade jurídica","difficulty":"Intermediária","q":"O registro do contrato de sociedade em conta de participação lhe confere personalidade jurídica?","a":["Sim, em qualquer registro","Sim, se houver três sócios","Não, conforme art. 993","Sim, após aprovação da CVM"],"ok":2,"e":"O art. 993 estabelece que eventual inscrição do instrumento em registro não confere personalidade jurídica à SCP.","src":"CC, arts. 981 a 996","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11007,"s":10,"module":3,"topic":"Sociedade limitada e governança","difficulty":"Intermediária","q":"É possível constituir sociedade limitada com apenas uma pessoa?","a":["Não, exige dois sócios em todos os casos","Não, exige cinco sócios","Sim, o art. 1.052 admite uma ou mais pessoas","Apenas mediante autorização judicial"],"ok":2,"e":"O art. 1.052, § 1º, admite sociedade limitada unipessoal ou pluripessoal.","src":"CC, arts. 1.052 a 1.087","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11008,"s":10,"module":3,"topic":"Sociedade limitada e governança","difficulty":"Intermediária","q":"Na limitada, como se dá a responsabilidade dos sócios pela integralização do capital social?","a":["Todos respondem solidariamente","Nenhum responde pela integralização","Somente o administrador responde","É sempre exclusiva do maior quotista"],"ok":0,"e":"O art. 1.052 distingue responsabilidade restrita ao valor das quotas da solidariedade pela integralização do capital.","src":"CC, arts. 1.052 a 1.087","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11009,"s":10,"module":4,"topic":"Sociedades anônimas e mercado de capitais","difficulty":"Intermediária","q":"Qual elemento caracteriza a divisão do capital de uma sociedade anônima?","a":["Quotas de trabalho exclusivamente","Ações","Títulos públicos obrigatoriamente","Frações de imóvel"],"ok":1,"e":"O art. 1º da Lei 6.404/1976 caracteriza a companhia pelo capital dividido em ações.","src":"Lei 6.404/1976, arts. 1º a 4º, 109, 116 a 117 e 138 a 158","url":"https://www.planalto.gov.br/ccivil_03/leis/l6404compilada.htm"},{"id":11010,"s":10,"module":4,"topic":"Sociedades anônimas e mercado de capitais","difficulty":"Intermediária","q":"O que distingue uma companhia aberta da fechada, nos termos do art. 4º?","a":["A quantidade mínima de funcionários","O tamanho da sede","A nacionalidade do controlador","A admissão ou não dos valores mobiliários à negociação no mercado"],"ok":3,"e":"O art. 4º adota como critério a admissão de valores mobiliários de emissão da companhia à negociação no mercado de valores mobiliários.","src":"Lei 6.404/1976, arts. 1º a 4º, 109, 116 a 117 e 138 a 158","url":"https://www.planalto.gov.br/ccivil_03/leis/l6404compilada.htm"},{"id":11011,"s":10,"module":5,"topic":"Títulos de crédito: princípios e circulação","difficulty":"Intermediária","q":"Qual princípio relaciona a extensão do direito cambiário ao conteúdo expresso no título?","a":["Oralidade","Publicidade processual","Literalidade","Anterioridade tributária"],"ok":2,"e":"A literalidade vincula o exercício do direito ao conteúdo documentado, consideradas as normas específicas do título.","src":"CC, arts. 887 a 926","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11012,"s":10,"module":5,"topic":"Títulos de crédito: princípios e circulação","difficulty":"Intermediária","q":"Qual instituto constitui garantia tipicamente cambiária, distinguindo-se da fiança civil?","a":["Aval","Usucapião","Comodato","Novação obrigatória"],"ok":0,"e":"O aval é garantia própria de títulos de crédito, submetida ao regime cambiário pertinente.","src":"CC, arts. 887 a 926","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11013,"s":10,"module":6,"topic":"Cheque, nota promissória e duplicata","difficulty":"Intermediária","q":"Segundo o art. 32 da Lei do Cheque, qual a natureza temporal da ordem de pagamento?","a":["À vista","Obrigatoriamente a prazo","Somente após noventa dias","Somente após autorização judicial"],"ok":0,"e":"A lei considera cheque pagável à vista, ainda que conste indicação em contrário. Eventuais efeitos civis do pacto de pós-datação são questão distinta.","src":"Lei 7.357/1985; Lei 5.474/1968; Decreto 57.663/1966","url":"https://www.planalto.gov.br/ccivil_03/leis/l7357.htm"},{"id":11014,"s":10,"module":6,"topic":"Cheque, nota promissória e duplicata","difficulty":"Intermediária","q":"Qual título está causalmente ligado, nos termos da legislação própria, à venda mercantil ou prestação de serviços?","a":["Cheque em qualquer hipótese","Nota promissória em qualquer hipótese","Ação ordinária de companhia","Duplicata"],"ok":3,"e":"A Lei 5.474/1968 disciplina a duplicata decorrente das operações nela previstas, exigindo atenção aos requisitos legais de emissão e cobrança.","src":"Lei 5.474/1968","url":"https://www.planalto.gov.br/ccivil_03/leis/l5474.htm"},{"id":11015,"s":10,"module":7,"topic":"Propriedade industrial e contratos empresariais","difficulty":"Intermediária","q":"Qual é o prazo ordinário de vigência do registro de marca, admitidas prorrogações sucessivas?","a":["Cinco anos sem renovação","Dez anos","Vinte anos sem renovação","Prazo necessariamente perpétuo"],"ok":1,"e":"O art. 133 da Lei 9.279/1996 prevê dez anos de vigência do registro, prorrogáveis por períodos iguais e sucessivos.","src":"Lei 9.279/1996, arts. 8º, 9º, 40, 122 a 129 e 133; Lei 13.966/2019","url":"https://www.planalto.gov.br/ccivil_03/leis/l9279.htm"},{"id":11016,"s":10,"module":7,"topic":"Propriedade industrial e contratos empresariais","difficulty":"Intermediária","q":"Qual conjunto de requisitos caracteriza a patenteabilidade de uma invenção segundo o art. 8º?","a":["Somente valor comercial","Somente criatividade artística","Novidade, atividade inventiva e aplicação industrial","Registro prévio de marca"],"ok":2,"e":"O art. 8º exige conjuntamente novidade, atividade inventiva e aplicação industrial para invenções patenteáveis.","src":"Lei 9.279/1996, arts. 8º, 9º, 40, 122 a 129 e 133; Lei 13.966/2019","url":"https://www.planalto.gov.br/ccivil_03/leis/l9279.htm"},{"id":11017,"s":10,"module":8,"topic":"Recuperação judicial e extrajudicial","difficulty":"Intermediária","q":"Qual tempo mínimo de exercício regular da atividade exige, em regra, o caput do art. 48 para requerer recuperação judicial?","a":["Seis meses","Um ano exato","Mais de dois anos","Dez anos"],"ok":2,"e":"O art. 48 exige exercício regular por mais de dois anos no momento do pedido, além dos demais requisitos cumulativos.","src":"Lei 11.101/2005, arts. 1º a 6º, 47 a 69 e 161 a 167","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm"},{"id":11018,"s":10,"module":8,"topic":"Recuperação judicial e extrajudicial","difficulty":"Intermediária","q":"Qual prazo do art. 53 para apresentação do plano de recuperação judicial após a publicação da decisão que deferiu o processamento?","a":["Sessenta dias","Quinze dias","Cento e oitenta dias","Prazo ilimitado"],"ok":0,"e":"O art. 53 fixa prazo improrrogável de sessenta dias, sob a consequência legal prevista.","src":"Lei 11.101/2005, arts. 1º a 6º, 47 a 69 e 161 a 167","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm"},{"id":11019,"s":10,"module":9,"topic":"Falência, classificação de créditos e encerramento","difficulty":"Intermediária","q":"Qual limite geral em salários mínimos por credor é previsto para classificação preferencial de créditos derivados da legislação do trabalho no art. 83, I?","a":["Trinta","Cento e cinquenta","Quarenta","Mil"],"ok":1,"e":"O art. 83, I, limita essa classificação dos créditos trabalhistas a 150 salários mínimos por credor e contempla os decorrentes de acidentes de trabalho em disciplina própria.","src":"Lei 11.101/2005, arts. 75 a 160","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm"},{"id":11020,"s":10,"module":9,"topic":"Falência, classificação de créditos e encerramento","difficulty":"Intermediária","q":"A sentença de falência é consequência automática de qualquer prejuízo econômico apresentado no balanço?","a":["Sim, independentemente de hipótese legal","Sim, se ocorrer por dois meses","Sim, por escolha exclusiva de fornecedor","Não, é necessário enquadramento em hipótese legal e procedimento pertinente"],"ok":3,"e":"A falência exige os pressupostos legais e o procedimento correspondente. Prejuízo contábil isolado não substitui a análise das hipóteses do art. 94.","src":"Lei 11.101/2005, arts. 75 a 160","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm"}];const humanRightsModules=[{"t":"Fundamentos, evolução e características","ref":"DUDH, preâmbulo e arts. 1º a 2º; CF, arts. 1º e 4º","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights","lessons":[["Dignidade e universalidade","Direitos humanos protegem a pessoa contra abusos e orientam a criação de condições para uma existência digna. A universalidade não depende de nacionalidade ou cidadania. Direitos fundamentais designam, em sentido técnico, direitos reconhecidos na ordem constitucional interna, sem negar a relação com os direitos humanos internacionais."],["Dimensões e interdependência","A classificação em dimensões organiza didaticamente liberdades civis e políticas, direitos sociais, econômicos e culturais e direitos de solidariedade. As dimensões não se substituem: o exercício de um direito pode depender da efetividade de outros. O acesso à educação, por exemplo, amplia as condições de participação política."],["Deveres do Estado","Respeitar significa evitar interferências indevidas; proteger envolve prevenir violações por terceiros; realizar demanda medidas para efetivação. Nem todo direito é absoluto, mas restrições precisam respeitar legalidade e justificativa adequada. Algumas proibições, como a tortura, não admitem suspensão."]],"map":["Dignidade → fundamento","Universalidade → toda pessoa","Dimensões → complementares","Estado → respeitar, proteger e realizar"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Declaração Universal e sistema global","ref":"DUDH, arts. 3º a 30; Carta da ONU","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights","lessons":[["Origem e natureza","A Declaração Universal foi adotada pela Assembleia Geral da ONU em 1948. Não é, por sua forma, um tratado sujeito à ratificação, mas tornou-se referência central do sistema internacional. Sua relevância normativa não se resume à classificação formal, pois alguns de seus conteúdos refletem normas internacionais reconhecidas por outras fontes."],["Liberdades e proteção","A Declaração contempla vida, liberdade, igualdade, acesso a remédios efetivos, julgamento imparcial e liberdade de consciência e expressão. Ao resolver questões, identifique a garantia afetada e evite interpretar a liberdade de expressão como autorização irrestrita para violações de outros direitos."],["Direitos sociais e culturais","A DUDH também reconhece trabalho, educação, segurança social, participação cultural e condições adequadas de vida. A presença desses direitos no mesmo documento reforça a indivisibilidade. O art. 29 trata de deveres e limites compatíveis com os fins democráticos e os direitos de terceiros."]],"map":["1948 → Assembleia Geral","Declaração ≠ tratado","Liberdades → proteção da pessoa","Direitos sociais → dignidade"],"extraUrl":"https://uhri.ohchr.org/en/about"},{"t":"Pactos internacionais de 1966","ref":"PIDCP, Decreto 592/1992; PIDESC, Decreto 591/1992","url":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0592.htm","lessons":[["Direitos civis e políticos","O PIDCP estabelece obrigações de respeito e garantia de direitos, abrangendo participação política, liberdade pessoal e garantias processuais. O Comitê de Direitos Humanos monitora sua aplicação. Comunicações individuais dependem do reconhecimento do mecanismo pertinente, como o Protocolo Facultativo."],["Direitos econômicos, sociais e culturais","O PIDESC disciplina direitos como educação, saúde, trabalho e seguridade social. A realização progressiva conforme recursos disponíveis não transforma todas as obrigações em promessas facultativas. A adoção de medidas e a não discriminação possuem importância imediata."],["Derrogações e limites","O PIDCP prevê regras especiais para emergências públicas oficialmente proclamadas, sem permitir suspensão de todos os direitos. A proibição de tortura não pode ser afastada por esse mecanismo. Limitações ordinárias e derrogações excepcionais são institutos distintos e exigem seus próprios pressupostos."]],"map":["PIDCP → liberdades e garantias","PIDESC → direitos econômicos e sociais","Progressividade → dever de agir","Emergência → limites estritos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0591.htm"},{"t":"Mecanismos de monitoramento da ONU","ref":"OHCHR, mecanismos internacionais de direitos humanos","url":"https://uhri.ohchr.org/en/about","lessons":[["Órgãos e comitês","O Conselho de Direitos Humanos é órgão intergovernamental. Os comitês de tratados são compostos por especialistas independentes e monitoram instrumentos específicos. Não confunda o Conselho com o Comitê de Direitos Humanos do PIDCP nem atribua a todos os órgãos competência jurisdicional."],["Revisão Periódica Universal","A RPU é mecanismo de avaliação entre Estados no âmbito do Conselho de Direitos Humanos. Examina a situação dos Estados membros da ONU e gera recomendações. Não é processo criminal nem tribunal internacional que condena indivíduos."],["Procedimentos especiais","Relatores especiais e grupos de trabalho possuem mandatos temáticos ou relativos a países. Podem produzir relatórios e comunicações nos limites do mandato. Reclamações individuais perante comitês dependem da competência reconhecida, de requisitos de admissibilidade e do instrumento específico."]],"map":["Conselho → órgão intergovernamental","Comitês → especialistas","RPU → revisão entre Estados","Relatores → mandatos específicos"]},{"t":"Sistema interamericano e Convenção Americana","ref":"CADH, arts. 1º a 32 e 33","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm","lessons":[["Proteção regional","O sistema interamericano integra a estrutura regional da OEA e possui diferentes instrumentos de proteção. A Convenção Americana, também conhecida como Pacto de São José, foi promulgada no Brasil pelo Decreto 678/1992. Sua aplicação deve considerar os compromissos assumidos por cada Estado."],["Direitos e garantias","A Convenção contempla integridade pessoal, liberdade, garantias judiciais e proteção judicial. O art. 8º protege garantias do processo; o art. 25 prevê proteção por recurso efetivo. A análise de violações deve considerar deveres de respeito e garantia, e não somente a existência formal de leis nacionais."],["Comissão e Corte","O art. 33 identifica Comissão e Corte Interamericanas como órgãos competentes quanto aos compromissos convencionais. A Comissão recebe petições e desempenha funções de promoção e monitoramento; a Corte exerce funções jurisdicionais e consultivas conforme seus pressupostos."]],"map":["OEA → sistema regional","CADH → Pacto de São José","Art. 8º → garantias judiciais","Comissão ≠ Corte"]},{"t":"Petições, admissibilidade e Corte Interamericana","ref":"CADH, arts. 44 a 51 e 61 a 69","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm","lessons":[["Petição individual","Pessoas, grupos e entidades não governamentais legalmente reconhecidas em Estado membro da OEA podem apresentar petições à Comissão nos termos do art. 44. Não é necessário que a pessoa que peticiona seja a própria vítima. Isso não equivale a ajuizar diretamente um caso contencioso perante a Corte."],["Admissibilidade","Em regra, exige-se esgotamento dos recursos internos e apresentação dentro de seis meses da notificação da decisão definitiva. Existem exceções, como inexistência de devido processo, impedimento de acesso aos recursos e demora injustificada. Também se examina duplicidade internacional e os demais requisitos."],["Julgamento e reparações","Estados-partes e Comissão podem submeter casos à Corte conforme o art. 61 e a jurisdição reconhecida. As sentenças são definitivas e obrigatórias para os Estados que sejam partes no caso, nos termos da Convenção. Reparações podem incluir indenizações, medidas de investigação, reconhecimento e garantias de não repetição."]],"map":["Pessoa → petição à Comissão","Admissibilidade → regra e exceções","Corte → Estados e Comissão","Sentença → cumprimento pelo Estado parte"]},{"t":"Incorporação, hierarquia e convencionalidade","ref":"CF, art. 5º, §§ 2º a 4º; Decreto 6.949/2009","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Incorporação e aprovação qualificada","O procedimento interno de incorporação de tratados envolve as competências constitucionais pertinentes. Tratados de direitos humanos aprovados em cada Casa do Congresso em dois turnos por três quintos dos membros equivalem a emendas constitucionais. A Convenção sobre Direitos das Pessoas com Deficiência é exemplo."],["Supralegalidade","Segundo a orientação do STF no RE 466.343, tratados de direitos humanos incorporados sem o rito do art. 5º, § 3º, possuem status supralegal: acima da legislação ordinária e abaixo da Constituição. A Súmula Vinculante 25 considera ilícita a prisão civil do depositário infiel, qualquer que seja a modalidade de depósito."],["Controle de convencionalidade","A análise de compatibilidade das normas internas com obrigações internacionais de direitos humanos complementa o controle constitucional. É importante diferenciar hierarquia doméstica de responsabilidade internacional: o Estado não pode simplesmente justificar o descumprimento de tratado por referência à sua lei interna."]],"map":["Rito qualificado → equivalência a emenda","Demais tratados de DH → supralegalidade segundo STF","SV 25 → depositário infiel","Convencionalidade → compatibilidade com tratado"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm"},{"t":"Igualdade, discriminação e grupos vulnerabilizados","ref":"Convenção sobre Direitos das Pessoas com Deficiência; Convenção contra Discriminação Racial","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm","lessons":[["Igualdade material","Igualdade não significa ignorar barreiras que impedem o exercício de direitos. Medidas destinadas a remover desigualdades podem ser legítimas conforme seus fundamentos e proporcionalidade. A proteção contra discriminação alcança situações de exclusão direta e indireta nos regimes aplicáveis."],["Deficiência e acessibilidade","A Convenção adota perspectiva que considera impedimentos em interação com barreiras. Acessibilidade e adaptações razoáveis promovem participação em igualdade de condições. Deficiência não implica automaticamente incapacidade civil; as medidas de apoio devem respeitar autonomia, vontade e preferências."],["Racismo e discriminação","A Convenção internacional contra discriminação racial exige medidas de prevenção e combate a práticas discriminatórias. A igualdade perante a lei deve ser efetiva, abrangendo direitos civis, políticos e sociais. A Convenção Interamericana contra o Racismo também foi incorporada pelo Brasil com aprovação qualificada."]],"map":["Igualdade → remoção de barreiras","Acessibilidade → participação","Deficiência ≠ incapacidade automática","Racismo → dever de prevenção e combate"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/1950-1969/d65810.html"},{"t":"Proteção de mulheres, crianças e pessoas refugiadas","ref":"Convenção de Belém do Pará; Lei 9.474/1997; Convenção sobre os Direitos da Criança","url":"https://www.planalto.gov.br/ccivil_03/decreto/1996/d1973.htm","lessons":[["Violência contra mulheres","A Convenção de Belém do Pará orienta prevenção, punição e erradicação da violência contra a mulher. A violência pode ocorrer no âmbito público ou privado. O Estado tem deveres de proteção e atuação diligente, sem reduzir a questão à existência de uma relação doméstica formal."],["Direitos da criança","O interesse superior da criança orienta decisões que a afetam. A proteção integral é compatível com o reconhecimento da criança como sujeito de direitos. Participação e escuta devem considerar idade e maturidade; proteção não equivale à supressão de toda autonomia."],["Refúgio e não devolução","A Lei 9.474/1997 disciplina reconhecimento da condição de refugiado, incluindo hipóteses relacionadas a perseguição e grave e generalizada violação de direitos humanos. O princípio de não devolução protege contra retorno a situações de risco nos limites do regime aplicável. Refúgio não se confunde com qualquer modalidade de imigração."]],"map":["Belém do Pará → combate à violência","Criança → proteção integral e participação","Refúgio → hipóteses legais","Não devolução → proteção contra retorno a risco"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9474.htm"},{"t":"Responsabilidade internacional e proteção no Brasil","ref":"CF, arts. 5º, 109, V-A e § 5º; CADH, arts. 63 e 68","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Responsabilidade do Estado","O descumprimento de obrigação internacional imputável ao Estado pode gerar responsabilidade internacional. Atos e omissões dos poderes públicos devem ser examinados conforme o dever aplicável. A responsabilização internacional do Estado é diferente da eventual responsabilidade penal ou civil individual de agentes."],["Reparação e cumprimento","A resposta a uma violação pode exigir cessação, investigação, reparação material e imaterial e medidas para evitar repetição. O art. 68 da Convenção Americana estabelece o compromisso de cumprir decisões da Corte em casos de que os Estados sejam partes. A implementação pode envolver diversos órgãos nacionais."],["Incidente de deslocamento de competência","Em graves violações de direitos humanos, o Procurador-Geral da República pode suscitar perante o STJ incidente de deslocamento para a Justiça Federal, com finalidade de assegurar obrigações decorrentes de tratados internacionais. A federalização não é automática nem depende apenas de repercussão pública."]],"map":["Estado → responsabilidade internacional","Reparação → medidas adequadas","IDC → Procurador-Geral da República","STJ → exame do deslocamento"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"}];const humanRightsQuestions=[{"id":12001,"s":11,"module":0,"topic":"Fundamentos, evolução e características","difficulty":"Intermediária","q":"A universalidade dos direitos humanos exige nacionalidade de um Estado específico para que a pessoa seja titular desses direitos?","a":["Sim, sempre","Não, a titularidade decorre da condição humana","Sim, salvo contrato internacional privado","Sim, se a pessoa não votar"],"ok":1,"e":"A DUDH parte da igualdade em dignidade e direitos, independentemente da nacionalidade, sem eliminar regimes próprios de determinados direitos políticos.","src":"DUDH, preâmbulo e arts. 1º a 2º; CF, arts. 1º e 4º","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights"},{"id":12002,"s":11,"module":0,"topic":"Fundamentos, evolução e características","difficulty":"Intermediária","q":"Como se relacionam as diferentes dimensões de direitos humanos?","a":["Cada dimensão revoga a anterior","Direitos sociais eliminam liberdades civis","São complementares e interdependentes","Apenas a dimensão mais recente permanece válida"],"ok":2,"e":"A classificação é didática, não uma sucessão de regimes excludentes. Direitos civis, políticos, sociais, econômicos e culturais relacionam-se entre si.","src":"DUDH, preâmbulo e arts. 1º a 2º; CF, arts. 1º e 4º","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights"},{"id":12003,"s":11,"module":1,"topic":"Declaração Universal e sistema global","difficulty":"Intermediária","q":"A DUDH foi adotada em qual ano pela Assembleia Geral da ONU?","a":["1948","1969","1988","2002"],"ok":0,"e":"A Assembleia Geral adotou a Declaração Universal em 10 de dezembro de 1948.","src":"DUDH, arts. 3º a 30; Carta da ONU","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights"},{"id":12004,"s":11,"module":1,"topic":"Declaração Universal e sistema global","difficulty":"Intermediária","q":"A Declaração Universal é formalmente um tratado internacional que cada Estado ratifica?","a":["Sim, em todos os casos","Sim, apenas na América","Sim, por decisão judicial individual","Não, foi adotada como declaração da Assembleia Geral"],"ok":3,"e":"A forma de declaração difere da de um tratado. Isso não elimina a importância jurídica de seus princípios nem a existência de obrigações equivalentes em outras fontes.","src":"DUDH, arts. 3º a 30; Carta da ONU","url":"https://www.un.org/en/about-us/universal-declaration-of-human-rights"},{"id":12005,"s":11,"module":2,"topic":"Pactos internacionais de 1966","difficulty":"Intermediária","q":"Qual instrumento internacional promulgado pelo Decreto 591/1992 trata especialmente de direitos econômicos, sociais e culturais?","a":["Convenção Americana","PIDESC","Estatuto de Roma","Convenção de Viena sobre relações diplomáticas"],"ok":1,"e":"O Decreto 591 promulga o Pacto Internacional sobre Direitos Econômicos, Sociais e Culturais.","src":"Decreto 591/1992; PIDESC","url":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0591.htm"},{"id":12006,"s":11,"module":2,"topic":"Pactos internacionais de 1966","difficulty":"Intermediária","q":"Uma emergência pública permite suspender a proibição de tortura pelo mecanismo de derrogação do PIDCP?","a":["Sim, mediante autorização policial","Sim, se temporária","Não, o art. 4º protege a proibição de tortura contra derrogação","Sim, se o Estado declarar crise econômica"],"ok":2,"e":"O art. 4º, § 2º, do PIDCP exclui da derrogação, entre outros, o art. 7º, relativo à proibição de tortura e tratamentos cruéis.","src":"PIDCP, Decreto 592/1992; PIDESC, Decreto 591/1992","url":"https://www.planalto.gov.br/ccivil_03/decreto/1990-1994/d0592.htm"},{"id":12007,"s":11,"module":3,"topic":"Mecanismos de monitoramento da ONU","difficulty":"Intermediária","q":"A Revisão Periódica Universal é principalmente qual mecanismo?","a":["Revisão da situação de direitos humanos dos Estados membros por seus pares","Julgamento criminal individual","Recurso de apelação nacional","Tratado de comércio"],"ok":0,"e":"A RPU funciona no Conselho de Direitos Humanos como mecanismo de avaliação entre Estados.","src":"OHCHR, mecanismos internacionais de direitos humanos","url":"https://uhri.ohchr.org/en/about"},{"id":12008,"s":11,"module":3,"topic":"Mecanismos de monitoramento da ONU","difficulty":"Intermediária","q":"Os comitês de tratados de direitos humanos são compostos, em regra, por quem?","a":["Juízes nacionais de cada município","Deputados eleitos pela ONU","Representantes comerciais obrigatórios","Especialistas independentes"],"ok":3,"e":"Os órgãos de tratados exercem mandatos de monitoramento atribuídos pelos instrumentos internacionais e são compostos por especialistas independentes.","src":"OHCHR, mecanismos internacionais de direitos humanos","url":"https://uhri.ohchr.org/en/about"},{"id":12009,"s":11,"module":4,"topic":"Sistema interamericano e Convenção Americana","difficulty":"Intermediária","q":"Qual diploma promulgou a Convenção Americana sobre Direitos Humanos no Brasil?","a":["Decreto 592/1992","Decreto 678/1992","Decreto 6.949/2009","Código Civil de 2002"],"ok":1,"e":"O Decreto 678/1992 promulga o Pacto de São José da Costa Rica.","src":"CADH, arts. 1º a 32 e 33","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":12010,"s":11,"module":4,"topic":"Sistema interamericano e Convenção Americana","difficulty":"Intermediária","q":"Quais órgãos são indicados no art. 33 da Convenção Americana?","a":["STF e STJ","Conselho de Segurança e Tribunal Penal Internacional","Comissão Interamericana e Corte Interamericana","Congresso Nacional e OAB"],"ok":2,"e":"A Convenção distingue as competências da Comissão e da Corte Interamericanas no sistema regional.","src":"CADH, arts. 1º a 32 e 33","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":12011,"s":11,"module":5,"topic":"Petições, admissibilidade e Corte Interamericana","difficulty":"Intermediária","q":"Uma pessoa pretende apresentar diretamente à Corte Interamericana um novo caso contencioso. Qual a regra do art. 61?","a":["Qualquer pessoa possui legitimidade direta irrestrita","Somente empresas privadas podem fazê-lo","Apenas Estados-partes e a Comissão podem submeter casos","Somente o STF pode fazê-lo"],"ok":2,"e":"O art. 61 limita a submissão de casos à Corte aos Estados-partes e à Comissão, sem impedir a participação das vítimas segundo o procedimento aplicável.","src":"CADH, arts. 44 a 51 e 61 a 69","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":12012,"s":11,"module":5,"topic":"Petições, admissibilidade e Corte Interamericana","difficulty":"Intermediária","q":"A demora injustificada na decisão sobre recursos internos pode afastar a exigência ordinária de esgotamento para petição à Comissão?","a":["Sim, é hipótese de exceção prevista no art. 46","Não, nunca","Sim, somente por contrato privado","Não, a Convenção não prevê exceções"],"ok":0,"e":"O art. 46, § 2º, c, contempla demora injustificada na decisão sobre os recursos internos.","src":"CADH, arts. 44 a 51 e 61 a 69","url":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"},{"id":12013,"s":11,"module":6,"topic":"Incorporação, hierarquia e convencionalidade","difficulty":"Intermediária","q":"Qual quórum o art. 5º, § 3º, exige para equivalência de tratado de direitos humanos a emenda constitucional?","a":["Maioria simples em turno único","Unanimidade apenas no Senado","Dois terços apenas na Câmara","Três quintos dos membros, em dois turnos em cada Casa"],"ok":3,"e":"O dispositivo prevê aprovação qualificada nas duas Casas e em dois turnos, com três quintos de seus respectivos membros.","src":"CF, art. 5º, §§ 2º a 4º; Decreto 6.949/2009","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":12014,"s":11,"module":6,"topic":"Incorporação, hierarquia e convencionalidade","difficulty":"Intermediária","q":"Qual é a orientação do STF sobre a prisão civil de depositário infiel?","a":["É ilícita em qualquer modalidade de depósito","É obrigatória em todo contrato","É válida se o credor pedir","É permitida apenas em depósito voluntário"],"ok":0,"e":"A Súmula Vinculante 25 afasta a prisão civil por depósito infiel, em contexto de aplicação dos tratados de direitos humanos.","src":"CF, art. 5º, §§ 2º a 4º; Decreto 6.949/2009","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":12015,"s":11,"module":7,"topic":"Igualdade, discriminação e grupos vulnerabilizados","difficulty":"Intermediária","q":"A existência de deficiência implica automaticamente incapacidade para todos os atos da vida civil?","a":["Sim, em qualquer circunstância","Não, a proteção reconhece capacidade legal em igualdade de condições","Sim, se a deficiência for permanente","Sim, por decisão do empregador"],"ok":1,"e":"O art. 12 da Convenção reconhece capacidade legal em igualdade de condições, com acesso a apoio e salvaguardas pertinentes.","src":"Convenção sobre Direitos das Pessoas com Deficiência; Convenção contra Discriminação Racial","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm"},{"id":12016,"s":11,"module":7,"topic":"Igualdade, discriminação e grupos vulnerabilizados","difficulty":"Intermediária","q":"Uma adaptação razoável busca qual finalidade?","a":["Excluir a pessoa de atividades coletivas","Substituir integralmente a autonomia da pessoa","Assegurar exercício de direitos em igualdade, observados os limites do conceito","Criar sanção penal automática"],"ok":2,"e":"A adaptação razoável envolve ajustes necessários e adequados, sem ônus desproporcional ou indevido, para assegurar igualdade de exercício de direitos.","src":"Convenção sobre Direitos das Pessoas com Deficiência; Convenção contra Discriminação Racial","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d6949.htm"},{"id":12017,"s":11,"module":8,"topic":"Proteção de mulheres, crianças e pessoas refugiadas","difficulty":"Intermediária","q":"A Convenção de Belém do Pará limita a proteção à violência praticada dentro da residência da vítima?","a":["Sim, exclusivamente","Sim, apenas no casamento","Sim, se houver coabitação","Não, contempla violência também no âmbito público"],"ok":3,"e":"A Convenção reconhece violência contra a mulher tanto na esfera pública quanto na privada, nos termos de seus arts. 1º e 2º.","src":"Convenção de Belém do Pará; Lei 9.474/1997; Convenção sobre os Direitos da Criança","url":"https://www.planalto.gov.br/ccivil_03/decreto/1996/d1973.htm"},{"id":12018,"s":11,"module":8,"topic":"Proteção de mulheres, crianças e pessoas refugiadas","difficulty":"Intermediária","q":"A grave e generalizada violação de direitos humanos pode integrar hipótese de reconhecimento da condição de refugiado na lei brasileira?","a":["Sim, conforme art. 1º, III, da Lei 9.474/1997","Não, jamais","Somente se a pessoa possuir cidadania brasileira","Somente em caso de contrato de trabalho"],"ok":0,"e":"A lei brasileira inclui a situação de quem é obrigado a deixar seu país de nacionalidade para buscar refúgio em razão de grave e generalizada violação de direitos humanos.","src":"Lei 9.474/1997, art. 1º, III","url":"https://www.planalto.gov.br/ccivil_03/leis/l9474.htm"},{"id":12019,"s":11,"module":9,"topic":"Responsabilidade internacional e proteção no Brasil","difficulty":"Intermediária","q":"Quem pode suscitar perante o STJ o incidente de deslocamento de competência previsto no art. 109, § 5º, da Constituição?","a":["Qualquer advogado diretamente","Procurador-Geral da República","Qualquer testemunha","Presidente de associação privada"],"ok":1,"e":"O texto constitucional atribui essa iniciativa ao Procurador-Geral da República, nas hipóteses e para a finalidade previstas.","src":"CF, arts. 5º, 109, V-A e § 5º; CADH, arts. 63 e 68","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":12020,"s":11,"module":9,"topic":"Responsabilidade internacional e proteção no Brasil","difficulty":"Intermediária","q":"A responsabilidade internacional de um Estado por violação de direitos humanos é necessariamente idêntica à condenação criminal de um agente individual?","a":["Sim, são o mesmo instituto","Sim, quando há indenização","Não, são regimes jurídicos distintos","Sim, se a violação ocorrer no território nacional"],"ok":2,"e":"A responsabilidade internacional do Estado e a responsabilização individual possuem sujeitos, pressupostos e consequências próprias.","src":"CF, arts. 5º, 109, V-A e § 5º; CADH, arts. 63 e 68","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const environmentModules=[{"t":"Fundamentos constitucionais e princípios ambientais","ref":"CF, art. 225; Lei 6.938/1981","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Direito fundamental ao ambiente","A Constituição protege o meio ambiente ecologicamente equilibrado como bem de uso comum e condição da qualidade de vida. Poder público e coletividade têm dever de defendê-lo para gerações presentes e futuras. A titularidade coletiva não impede proteção judicial de danos individuais relacionados."],["Prevenção e precaução","Prevenção atua sobre riscos conhecidos; precaução orienta decisões diante de incertezas científicas relevantes sobre danos potencialmente graves. Nenhum dos princípios dispensa análise fundamentada das circunstâncias e medidas proporcionais."],["Poluidor-pagador e desenvolvimento sustentável","O poluidor-pagador busca internalizar custos de prevenção e reparação, sem conferir licença para poluir. Desenvolvimento sustentável integra proteção ecológica, atividade econômica e justiça social. Participação e informação qualificam decisões ambientais."]],"map":["Art. 225 → direito e dever coletivo","Prevenção → risco conhecido","Precaução → incerteza relevante","Poluidor-pagador → internalização de custos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"t":"Política Nacional do Meio Ambiente e SISNAMA","ref":"Lei 6.938/1981, arts. 2º a 9º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm","lessons":[["Finalidades da PNMA","A política nacional organiza instrumentos para preservar, melhorar e recuperar a qualidade ambiental, compatibilizando desenvolvimento e equilíbrio ecológico. O conceito legal de poluição abrange diferentes formas de degradação, não somente descarte de resíduos."],["Estrutura institucional","O SISNAMA reúne órgãos e entidades dos diferentes níveis federativos. O CONAMA exerce funções consultivas e deliberativas nos limites legais. IBAMA e ICMBio têm atribuições executivas próprias; órgãos estaduais e municipais também integram o sistema."],["Instrumentos","Padrões de qualidade, zoneamento, avaliação de impactos, licenciamento e instrumentos econômicos integram a política. Um instrumento não substitui necessariamente outro: a autorização para atividade pode exigir licenças, estudos e outras providências autônomas conforme o caso."]],"map":["PNMA → qualidade ambiental","SISNAMA → sistema federativo","CONAMA → funções consultivas e deliberativas","Instrumentos → atuação complementar"]},{"t":"Competências e federalismo ambiental","ref":"CF, arts. 23, 24 e 30; LC 140/2011","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp140.htm","lessons":[["Competência material","Proteger o ambiente e combater a poluição integra competências comuns dos entes federativos. A LC 140/2011 organiza a cooperação administrativa, distribuindo ações de licenciamento e fiscalização. Competência comum não significa que todos emitam licenças simultaneamente para o mesmo empreendimento."],["Competência legislativa","União, Estados e Distrito Federal legislam concorrentemente sobre matérias ambientais previstas no art. 24. Municípios possuem competência de interesse local e suplementação, observada a Constituição. Norma local deve ser analisada à luz das competências e da proteção ambiental pertinente."],["Licenciamento e fiscalização","A LC 140 prevê licenciamento ou autorização ambiental por um único ente federativo, segundo os critérios legais. Os demais podem manifestar-se nos termos da lei. Fiscalização e adoção de medidas urgentes seguem regras próprias; a repartição não elimina o dever comum de proteção."]],"map":["Art. 23 → competência comum","Art. 24 → competência concorrente","Município → interesse local e suplementação","Licenciamento → ente competente"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Licenciamento e avaliação de impactos ambientais","ref":"CF, art. 225, § 1º, IV; Leis 15.190/2025 e 15.300/2025","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15190.htm","lessons":[["Licenciamento e licenças","A Lei 15.190/2025 disciplina o licenciamento ambiental e seus procedimentos. As licenças e condicionantes devem corresponder ao tipo de atividade e aos impactos avaliados. A escolha de procedimento não é arbitrária: deve observar a lei, os critérios da autoridade competente e eventuais decisões judiciais aplicáveis."],["EIA e RIMA","Para obra ou atividade potencialmente causadora de significativa degradação, a Constituição exige estudo prévio de impacto ambiental, ao qual se dá publicidade. O EIA analisa impactos, alternativas e medidas de controle; o RIMA comunica resultados de forma compreensível. Estudos simplificados não substituem o EIA quando constitucionalmente exigido."],["Atualizações e licenciamento especial","A Lei 15.300/2025 disciplina a Licença Ambiental Especial para atividades e empreendimentos estratégicos conforme critérios legais. A nova legislação não elimina o dever constitucional de proteção. Ao estudar hipóteses de dispensa, modalidades simplificadas e participação pública, consulte a redação consolidada, os vetos promulgados e a jurisprudência atual."]],"map":["Licenciamento → avaliação e condicionantes","Impacto significativo → EIA prévio","RIMA → comunicação dos impactos","LAE → regime especial"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15300.htm"},{"t":"Florestas, APP, reserva legal e cadastro rural","ref":"Lei 12.651/2012, arts. 3º, 4º, 12, 17 e 29","url":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm","lessons":[["Área de Preservação Permanente","APP protege funções ecológicas, como recursos hídricos, estabilidade do solo e biodiversidade. Pode existir mesmo sem vegetação nativa presente. Intervenção ou supressão depende de enquadramento nas hipóteses legais e das autorizações exigíveis."],["Reserva Legal","Reserva Legal é área situada no interior de imóvel rural destinada à conservação e ao uso sustentável nos termos legais. Seus percentuais variam conforme localização e características da vegetação. Não confunda percentuais de reserva com regras de APP, nem aplique regra geral sem examinar exceções."],["CAR e regularização","O Cadastro Ambiental Rural reúne informações ambientais dos imóveis rurais. A inscrição é obrigatória conforme o art. 29 e não constitui título de propriedade. Programas de regularização, compensação e recomposição têm requisitos próprios; cadastro não equivale a autorização para supressão."]],"map":["APP → função ecológica","Reserva Legal → imóvel rural","Percentuais → localização e bioma","CAR → cadastro, não título"]},{"t":"Unidades de conservação e biodiversidade","ref":"Lei 9.985/2000, arts. 7º a 21; CF, art. 225","url":"https://www.planalto.gov.br/ccivil_03/leis/l9985.htm","lessons":[["Categorias do SNUC","Unidades de conservação dividem-se em dois grupos: proteção integral e uso sustentável. A primeira prioriza preservação da natureza e uso indireto, ressalvadas hipóteses legais. O segundo compatibiliza conservação com uso sustentável de parcela dos recursos."],["Criação e gestão","A criação de unidade exige ato do poder público e, em regra, estudos técnicos e consulta pública, observadas exceções legais. Plano de manejo orienta uso, zoneamento e proteção. Redução ou desafetação de espaços especialmente protegidos deve observar a reserva legal constitucional."],["Categorias e particularidades","Parque Nacional, Estação Ecológica e Reserva Biológica integram proteção integral. APA, Floresta Nacional e Reserva Extrativista pertencem ao grupo de uso sustentável. Regime dominial, visitação, pesquisa e presença de populações tradicionais dependem da categoria escolhida."]],"map":["Proteção integral → preservação","Uso sustentável → conservação e uso compatível","Parque → proteção integral","APA → uso sustentável"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Recursos hídricos e gestão de resíduos","ref":"Leis 9.433/1997 e 12.305/2010","url":"https://www.planalto.gov.br/ccivil_03/leis/l9433.htm","lessons":[["Política de recursos hídricos","A água é bem de domínio público e recurso natural limitado, dotado de valor econômico. Em situações de escassez, o uso prioritário é consumo humano e dessedentação de animais. A bacia hidrográfica constitui unidade territorial para implementação da política."],["Outorga e gestão","A outorga disciplina o direito de uso da água nas hipóteses legais e não aliena o recurso hídrico. Planos, cobrança, enquadramento dos corpos de água e sistemas de informação integram instrumentos da política. Usos legalmente dispensados de outorga não afastam todos os deveres ambientais."],["Resíduos sólidos","A política estabelece prioridade de não geração, redução, reutilização, reciclagem, tratamento e disposição adequada de rejeitos. Responsabilidade compartilhada pelo ciclo de vida e logística reversa distribuem deveres conforme produtos e agentes. Resíduo aproveitável não se confunde com rejeito sem alternativa viável de tratamento ou recuperação."]],"map":["Água → domínio público","Bacia → unidade territorial","Outorga → direito de uso","Resíduos → prioridade à não geração"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2010/lei/l12305.htm"},{"t":"Responsabilidade civil por dano ambiental","ref":"Lei 6.938/1981, art. 14, § 1º; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm","lessons":[["Responsabilidade objetiva","O poluidor responde pela reparação ou indenização de danos ambientais independentemente de culpa, observados dano, nexo de imputação e regime aplicável. A jurisprudência do STJ adota a teoria do risco integral em matéria de responsabilidade civil ambiental. A licença não exclui automaticamente responsabilidade por dano efetivamente causado."],["Reparação integral","A recuperação do ambiente degradado é prioritária quando tecnicamente possível. Obrigações de fazer e indenizações podem ser cumuladas conforme os danos existentes, como reconhece a Súmula 629 do STJ. A indenização não é autorização para manter degradação."],["Obrigações propter rem e prescrição","A jurisprudência reconhece natureza propter rem de obrigações ambientais, com possibilidades e limites de imputação a titulares e possuidores, inclusive conforme Tema 1204 do STJ. O STF, no Tema 999, considera imprescritível a pretensão de reparação civil de dano ambiental. Diferencie essa pretensão de sanções administrativas e penais."]],"map":["Civil → objetiva","Reparação → recuperação e indenização cabível","Propter rem → vínculo com o bem","Tema 999 STF → reparação civil imprescritível"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Infrações administrativas e crimes ambientais","ref":"Lei 9.605/1998; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9605.htm","lessons":[["Esferas de responsabilização","Condutas e atividades lesivas podem gerar responsabilidade civil, administrativa e penal, observados os pressupostos próprios de cada esfera. A reparação civil objetiva não transforma automaticamente toda infração em crime. Sanções administrativas também exigem procedimento, motivação e direito de defesa."],["Pessoa jurídica","A Lei 9.605/1998 admite responsabilização de pessoas jurídicas quando a infração for cometida por decisão de representante legal ou contratual, ou órgão colegiado, no interesse ou benefício da entidade. A responsabilidade da pessoa jurídica não exclui a de pessoas naturais conforme suas contribuições."],["Sanções e garantias","Infrações administrativas podem ensejar advertência, multas, embargo e outras sanções legalmente previstas. Na esfera penal, a tipicidade exige análise de elementos legais e subjetivos. A imposição de medida cautelar administrativa não equivale à condenação penal."]],"map":["Civil ≠ administrativa ≠ penal","Pessoa jurídica → requisitos do art. 3º","Sanção → procedimento e defesa","Crime → tipicidade e culpabilidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Tutela coletiva e instrumentos processuais ambientais","ref":"Lei 7.347/1985, arts. 1º, 3º, 5º e 13; CF, art. 5º, LXXIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l7347compilada.htm","lessons":[["Ação civil pública","A ACP permite tutela de interesses difusos e coletivos relacionados ao ambiente. Pode buscar condenação em dinheiro e obrigações de fazer ou não fazer conforme o regime legal. Ministério Público, Defensoria, entes públicos e associações que preencham requisitos legais estão entre os legitimados."],["Ação popular e participação","O cidadão pode propor ação popular visando anular ato lesivo ao meio ambiente, conforme a Constituição. Não se confunde a legitimidade do cidadão com a de associação em ação civil pública. A fiscalização social também envolve acesso a informações e participação nos processos decisórios."],["Compromisso de ajustamento e reparação","Órgãos públicos legitimados podem tomar compromisso de ajustamento de conduta com eficácia de título executivo extrajudicial, nos termos legais. O instrumento busca adequação da conduta e reparação, sem autorizar renúncia indiscriminada a direitos indisponíveis. A destinação de condenações pecuniárias coletivas segue a legislação."]],"map":["ACP → tutela coletiva","Ação popular → cidadão","TAC → título executivo extrajudicial","Reparação → interesse coletivo"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const environmentQuestions=[{"id":13001,"s":12,"module":0,"topic":"Fundamentos constitucionais e princípios ambientais","difficulty":"Intermediária","q":"O dever constitucional de preservar o ambiente dirige-se somente ao Estado?","a":["Sim, exclusivamente","Não, também à coletividade","Sim, exceto em parques nacionais","Sim, salvo contrato privado"],"ok":1,"e":"O art. 225 atribui o dever de defesa e preservação ao poder público e à coletividade.","src":"CF, art. 225; Lei 6.938/1981","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":13002,"s":12,"module":0,"topic":"Fundamentos constitucionais e princípios ambientais","difficulty":"Intermediária","q":"Qual princípio se relaciona especialmente à adoção de medidas protetivas diante de incerteza científica sobre risco grave?","a":["Anterioridade","Livre concorrência","Precaução","Irretroatividade tributária"],"ok":2,"e":"A precaução orienta a gestão de riscos relevantes ainda não plenamente conhecidos, mediante avaliação fundamentada.","src":"CF, art. 225; Lei 6.938/1981","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":13003,"s":12,"module":1,"topic":"Política Nacional do Meio Ambiente e SISNAMA","difficulty":"Intermediária","q":"Qual lei instituiu a Política Nacional do Meio Ambiente?","a":["Lei 6.938/1981","Lei 9.099/1995","Lei 8.078/1990","Lei 10.406/2002"],"ok":0,"e":"A Lei 6.938/1981 institui a PNMA e estrutura o SISNAMA.","src":"Lei 6.938/1981, arts. 2º a 9º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"id":13004,"s":12,"module":1,"topic":"Política Nacional do Meio Ambiente e SISNAMA","difficulty":"Intermediária","q":"O SISNAMA é composto exclusivamente por órgãos federais?","a":["Sim, exclusivamente","Sim, exceto o CONAMA","Sim, quando se tratar de água","Não, reúne órgãos e entidades dos diferentes níveis federativos"],"ok":3,"e":"O art. 6º prevê estrutura que abrange União, Estados, Distrito Federal e Municípios, conforme as atribuições legais.","src":"Lei 6.938/1981, arts. 2º a 9º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"id":13005,"s":12,"module":2,"topic":"Competências e federalismo ambiental","difficulty":"Intermediária","q":"Pela regra da LC 140/2011, quantos entes federativos realizam o licenciamento ambiental de uma mesma atividade?","a":["Todos obrigatoriamente","Um ente federativo, conforme atribuições legais","Nenhum
