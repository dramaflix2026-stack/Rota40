, se houver fiscalização","Sempre dois"],"ok":1,"e":"O art. 13 prevê licenciamento ou autorização por um único ente federativo, sem excluir as formas legais de cooperação.","src":"CF, arts. 23, 24 e 30; LC 140/2011","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp140.htm"},{"id":13006,"s":12,"module":2,"topic":"Competências e federalismo ambiental","difficulty":"Intermediária","q":"A proteção administrativa do meio ambiente constitui competência exclusiva da União?","a":["Sim, em qualquer caso","Sim, fora de área urbana","Não, constitui competência comum","Sim, quando houver vegetação"],"ok":2,"e":"O art. 23, VI e VII, da Constituição prevê competências comuns de proteção ambiental.","src":"CF, arts. 23, 24 e 30; LC 140/2011","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp140.htm"},{"id":13007,"s":12,"module":3,"topic":"Licenciamento e avaliação de impactos ambientais","difficulty":"Intermediária","q":"Uma atividade é potencialmente causadora de significativa degradação ambiental. Qual exigência constitucional deve ser observada?","a":["Apenas autorização verbal","Apenas pagamento de taxa","Somente comunicação ao Município","Estudo prévio de impacto ambiental com publicidade"],"ok":3,"e":"O art. 225, § 1º, IV, impõe estudo prévio para essa hipótese.","src":"CF, art. 225, § 1º, IV","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":13008,"s":12,"module":3,"topic":"Licenciamento e avaliação de impactos ambientais","difficulty":"Intermediária","q":"Qual lei dispõe especificamente sobre licenciamento ambiental especial de empreendimentos estratégicos?","a":["Lei 15.300/2025","Código de Processo Civil","Lei de Locação","Lei 8.112/1990"],"ok":0,"e":"A Lei 15.300/2025 disciplina o regime especial e altera a Lei 15.190/2025. A aplicação concreta depende das condições legais e regulamentares.","src":"Lei 15.300/2025","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15300.htm"},{"id":13009,"s":12,"module":4,"topic":"Florestas, APP, reserva legal e cadastro rural","difficulty":"Intermediária","q":"A inscrição no CAR constitui, por si só, título de propriedade ou posse?","a":["Sim, em todo imóvel rural","Não, o art. 29 afasta esse efeito","Sim, após cinco anos","Sim, se houver mapa"],"ok":1,"e":"O art. 29, § 2º, esclarece que a inscrição não é título para fins de reconhecimento do direito de propriedade ou posse.","src":"Lei 12.651/2012, arts. 3º, 4º, 12, 17 e 29","url":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm"},{"id":13010,"s":12,"module":4,"topic":"Florestas, APP, reserva legal e cadastro rural","difficulty":"Intermediária","q":"Uma APP deixa necessariamente de existir juridicamente quando não há vegetação nativa no local?","a":["Sim, sempre","Sim, se houver estrada próxima","Não, sua definição abrange área coberta ou não por vegetação nativa","Sim, mediante declaração do ocupante"],"ok":2,"e":"O art. 3º, II, define APP segundo sua função ambiental, podendo ser coberta ou não por vegetação nativa.","src":"Lei 12.651/2012, arts. 3º, 4º, 12, 17 e 29","url":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm"},{"id":13011,"s":12,"module":5,"topic":"Unidades de conservação e biodiversidade","difficulty":"Intermediária","q":"Qual categoria integra o grupo de proteção integral do SNUC?","a":["Área de Proteção Ambiental","Floresta Nacional","Parque Nacional","Reserva Extrativista"],"ok":2,"e":"O art. 8º inclui parques no grupo de proteção integral; as demais alternativas pertencem ao grupo de uso sustentável.","src":"Lei 9.985/2000, arts. 7º a 21; CF, art. 225","url":"https://www.planalto.gov.br/ccivil_03/leis/l9985.htm"},{"id":13012,"s":12,"module":5,"topic":"Unidades de conservação e biodiversidade","difficulty":"Intermediária","q":"A redução dos limites de unidade de conservação pode ocorrer livremente por simples despacho administrativo?","a":["Não, a Lei 9.985 exige lei específica","Sim, sempre","Sim, se houver interesse econômico","Sim, mediante acordo privado"],"ok":0,"e":"O art. 22, § 7º, exige lei específica para desafetação ou redução dos limites de unidade de conservação.","src":"Lei 9.985/2000, arts. 7º a 21; CF, art. 225","url":"https://www.planalto.gov.br/ccivil_03/leis/l9985.htm"},{"id":13013,"s":12,"module":6,"topic":"Recursos hídricos e gestão de resíduos","difficulty":"Intermediária","q":"Em situação de escassez hídrica, qual uso prioritário prevê a Lei 9.433?","a":["Somente geração de energia","Consumo humano e dessedentação de animais","Somente irrigação industrial","Exclusivamente navegação"],"ok":1,"e":"O art. 1º, III, estabelece essa prioridade em situações de escassez.","src":"Leis 9.433/1997 e 12.305/2010","url":"https://www.planalto.gov.br/ccivil_03/leis/l9433.htm"},{"id":13014,"s":12,"module":6,"topic":"Recursos hídricos e gestão de resíduos","difficulty":"Intermediária","q":"Qual é a primeira prioridade da ordem de gestão de resíduos prevista na Lei 12.305?","a":["Disposição final de todos os resíduos","Incineração obrigatória","Exportação","Não geração"],"ok":3,"e":"O art. 9º prioriza não geração, seguida de redução, reutilização, reciclagem, tratamento e disposição final adequada dos rejeitos.","src":"Lei 12.305/2010, art. 9º","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2010/lei/l12305.htm"},{"id":13015,"s":12,"module":7,"topic":"Responsabilidade civil por dano ambiental","difficulty":"Intermediária","q":"Para responsabilização civil ambiental segundo a Lei 6.938/1981, a prova de culpa do poluidor é requisito indispensável?","a":["Não, a responsabilidade é objetiva","Sim, sempre","Sim, salvo confissão","Sim, quando houver licença"],"ok":0,"e":"O art. 14, § 1º, prevê responsabilidade independentemente de culpa, sem afastar a análise dos demais pressupostos.","src":"Lei 6.938/1981, art. 14, § 1º; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"id":13016,"s":12,"module":7,"topic":"Responsabilidade civil por dano ambiental","difficulty":"Intermediária","q":"Qual orientação do STF no Tema 999 se refere à pretensão de reparação civil de dano ambiental?","a":["Prescreve sempre em dois anos","Prescreve sempre em cinco anos","É imprescritível","É vedada se o dano for antigo"],"ok":2,"e":"O Tema 999 estabelece a imprescritibilidade da pretensão de reparação civil de dano ambiental. Isso não equivale a afirmar imprescritibilidade de toda sanção ambiental.","src":"STF, Tema 999","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/tema.asp?num=999"},{"id":13017,"s":12,"module":8,"topic":"Infrações administrativas e crimes ambientais","difficulty":"Intermediária","q":"Uma pessoa jurídica pode responder criminalmente por infração ambiental nas condições previstas em lei?","a":["Não, em nenhuma hipótese","Sim, nos termos constitucionais e do art. 3º da Lei 9.605","Sim, sem qualquer requisito","Somente se for pessoa jurídica pública"],"ok":1,"e":"A Constituição admite sanções penais a pessoas jurídicas, e o art. 3º estabelece os pressupostos da responsabilização ambiental.","src":"Lei 9.605/1998; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9605.htm"},{"id":13018,"s":12,"module":8,"topic":"Infrações administrativas e crimes ambientais","difficulty":"Intermediária","q":"A obrigação de reparar dano ambiental exclui necessariamente sanções penais e administrativas cabíveis?","a":["Sim, em qualquer caso","Sim, quando houver pagamento","Sim, após laudo pericial","Não, as esferas podem coexistir, respeitados seus requisitos"],"ok":3,"e":"O art. 225, § 3º, prevê sanções independentemente da obrigação de reparar os danos.","src":"Lei 9.605/1998; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9605.htm"},{"id":13019,"s":12,"module":9,"topic":"Tutela coletiva e instrumentos processuais ambientais","difficulty":"Intermediária","q":"Quem possui legitimidade constitucional para propor ação popular visando invalidar ato lesivo ao ambiente?","a":["Somente empresa estrangeira","Somente autoridade policial","Cidadão","Exclusivamente ministro do STF"],"ok":2,"e":"O art. 5º, LXXIII, atribui legitimidade ao cidadão para ação popular, observados requisitos legais.","src":"CF, art. 5º, LXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":13020,"s":12,"module":9,"topic":"Tutela coletiva e instrumentos processuais ambientais","difficulty":"Intermediária","q":"Qual eficácia a Lei 7.347 atribui ao compromisso de ajustamento tomado por órgão público legitimado?","a":["Título executivo extrajudicial","Simples recomendação sem efeito jurídico","Sentença penal condenatória","Emenda constitucional"],"ok":0,"e":"O art. 5º, § 6º, prevê compromisso de ajustamento de conduta com eficácia de título executivo extrajudicial.","src":"Lei 7.347/1985, arts. 1º, 3º, 5º e 13; CF, art. 5º, LXXIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l7347compilada.htm"}];const internationalModules=[{"t":"Fundamentos e fontes do Direito Internacional","ref":"Estatuto da CIJ, art. 38; CF, art. 4º","url":"https://www.un.org/en/about-us/un-charter/full-text","lessons":[["Ordem jurídica internacional","O Direito Internacional Público disciplina relações entre Estados, organizações internacionais e outros sujeitos reconhecidos pelo ordenamento. A soberania não exclui obrigações jurídicas assumidas internacionalmente. Diferencie igualdade soberana, autonomia estatal e exercício de competências de organizações internacionais."],["Fontes internacionais","O art. 38 do Estatuto da Corte Internacional de Justiça indica convenções internacionais, costume e princípios gerais de direito, além de decisões judiciais e doutrina como meios auxiliares de determinação das regras. Costume exige prática geral aceita como direito. Não se resume a comportamento reiterado sem convicção jurídica."],["Normas imperativas","Normas de jus cogens são aceitas e reconhecidas pela comunidade internacional dos Estados como um todo, sem possibilidade de derrogação, salvo por norma posterior de igual natureza. Um tratado em conflito com norma imperativa existente é nulo segundo a Convenção de Viena."]],"map":["Soberania → igualdade jurídica","Costume → prática e opinio juris","Jurisprudência e doutrina → meios auxiliares","Jus cogens → inderrogabilidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"t":"Tratados internacionais: formação, vigência e extinção","ref":"Convenção de Viena de 1969, arts. 2º, 11, 19 a 27 e 54 a 64","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm","lessons":[["Formação e consentimento","A Convenção de Viena disciplina tratados escritos entre Estados regidos pelo Direito Internacional. Consentimento pode ser expresso por assinatura, ratificação, aceitação, aprovação ou adesão conforme o regime aplicável. Assinatura e ratificação não são necessariamente equivalentes. Entrada em vigor depende das condições do tratado."],["Reservas e interpretação","Reserva é declaração unilateral destinada a excluir ou modificar o efeito jurídico de determinadas disposições em relação ao Estado que a formula. Sua admissibilidade depende do tratado, inclusive compatibilidade com objeto e finalidade. Interpretação deve ocorrer de boa-fé, segundo sentido comum, contexto, objeto e finalidade."],["Cumprimento e extinção","Pacta sunt servanda impõe cumprimento de boa-fé dos tratados em vigor. Como regra, o Estado não pode invocar seu direito interno para justificar inadimplemento. Denúncia, retirada, suspensão e extinção possuem pressupostos próprios; não decorrem automaticamente de mudança de governo."]],"map":["Consentimento → formas admitidas","Reserva → limites do tratado","Pacta sunt servanda → boa-fé","Extinção → pressupostos jurídicos"]},{"t":"Incorporação e hierarquia dos tratados no Brasil","ref":"CF, arts. 5º, §§ 2º a 4º, 49, I, e 84, VIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Competências constitucionais","A celebração de tratados integra as atribuições presidenciais, sujeita ao referendo do Congresso Nacional nos termos constitucionais. A aprovação parlamentar, a manifestação internacional de consentimento e a promulgação interna constituem etapas distintas. Nem todo compromisso internacional segue necessariamente procedimento idêntico."],["Hierarquia interna","Em regra, tratados comuns incorporados possuem posição equivalente à legislação ordinária, ressalvadas matérias com regimes próprios. Segundo o STF, tratados de direitos humanos incorporados sem aprovação qualificada possuem status supralegal. Os aprovados conforme art. 5º, § 3º, equivalem a emendas constitucionais."],["Plano internacional e plano interno","A solução de conflitos entre normas no direito doméstico não elimina obrigações internacionais do Brasil. O Estado continua sujeito ao regime internacional do tratado. Questões sobre denúncia de tratados exigem considerar competências constitucionais e a jurisprudência do STF, inclusive a ADI 1625."]],"map":["Presidente → celebração","Congresso → aprovação constitucional","Direitos humanos → regime hierárquico próprio","Plano interno ≠ responsabilidade internacional"]},{"t":"Estados, organizações internacionais e solução de controvérsias","ref":"Carta da ONU, arts. 2º, 7º, 33 e 92 a 96; Estatuto da CIJ","url":"https://www.un.org/en/about-us/un-charter/full-text","lessons":[["Sujeitos e competências","Estados possuem personalidade internacional originária; organizações internacionais exercem competências decorrentes de seus instrumentos constitutivos e regras pertinentes. A ONU possui órgãos com funções distintas. A Assembleia Geral não desempenha o mesmo papel do Conselho de Segurança."],["Solução pacífica","Negociação, mediação, conciliação, arbitragem e solução judicial são meios pacíficos previstos na Carta. Arbitragem decorre do consentimento das partes e do regime aplicável. O recurso à força é, em regra, proibido, ressalvadas as hipóteses admitidas pela Carta."],["Corte Internacional de Justiça","A CIJ é o principal órgão judiciário da ONU. Apenas Estados podem ser partes em casos contenciosos perante ela; sua jurisdição depende de fundamento de consentimento. Pareceres consultivos podem ser solicitados pelos órgãos autorizados. A CIJ não se confunde com o Tribunal Penal Internacional."]],"map":["ONU → competências dos órgãos","Controvérsias → meios pacíficos","CIJ → Estados e consentimento","TPI → responsabilidade penal individual"]},{"t":"Nacionalidade brasileira e condição jurídica do estrangeiro","ref":"CF, art. 12; EC 131/2023; Lei 13.445/2017","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Nacionalidade originária","A Constituição prevê hipóteses de nacionalidade brasileira nata relacionadas a nascimento no território e filiação brasileira no exterior, com requisitos e ressalvas próprios. Filhos de estrangeiros nascidos no Brasil não são natos quando os pais estiverem a serviço de seu país, nos termos constitucionais."],["Naturalização e cargos privativos","Brasileiros naturalizados possuem, em regra, igualdade de direitos com natos, ressalvadas distinções constitucionais. A naturalização possui modalidades e requisitos legais. Cargos privativos de nato incluem Presidente e Vice-Presidente da República, Ministro do STF e outros expressamente previstos no art. 12, § 3º."],["Perda e reaquisição","A EC 131/2023 modificou as hipóteses de perda da nacionalidade, afastando a perda automática pela simples aquisição de outra nacionalidade. A perda pode decorrer de cancelamento da naturalização por sentença judicial nas hipóteses constitucionais ou de pedido expresso, ressalvada situação de apatridia. Reaquisição observa o regime legal."]],"map":["Nato → hipóteses constitucionais","Naturalizado → igualdade com ressalvas","Cargos privativos → art. 12, § 3º","EC 131 → aquisição de outra nacionalidade não basta"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc131.htm"},{"t":"Migração, refúgio e medidas de retirada","ref":"Lei 13.445/2017; Lei 9.474/1997","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm","lessons":[["Direitos e política migratória","A Lei de Migração orienta-se pelos direitos humanos, não criminalização da migração, igualdade de tratamento e combate à discriminação. Visto, autorização de residência e naturalização são institutos diferentes. A irregularidade documental não elimina os direitos fundamentais da pessoa migrante."],["Repatriação, deportação e expulsão","Repatriação é medida de devolução de pessoa em situação de impedimento ao ingresso, nos termos legais. Deportação decorre de situação migratória irregular e deve observar procedimento e oportunidade de regularização. Expulsão é medida administrativa com impedimento de reingresso por prazo determinado, fundada nas hipóteses legais e sujeita a garantias."],["Refúgio e asilo","Refúgio possui requisitos previstos na Lei 9.474/1997, incluindo perseguição por motivos legalmente indicados ou grave e generalizada violação de direitos humanos. Asilo político tem disciplina própria e não se confunde com refúgio. O princípio de não devolução protege pessoas contra retorno a situações de risco nos limites aplicáveis."]],"map":["Migração → direitos e garantias","Deportação → irregularidade migratória","Expulsão → hipóteses legais","Refúgio → proteção internacional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9474.htm"},{"t":"Direito Internacional Privado: conflitos de leis","ref":"LINDB, arts. 7º a 10 e 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm","lessons":[["Elementos de conexão","O Direito Internacional Privado determina a lei aplicável às relações privadas conectadas a diferentes países. Domicílio, localização dos bens e lugar de constituição da obrigação são critérios previstos na LINDB. Lei aplicável e competência jurisdicional não se confundem: o juiz brasileiro pode aplicar direito estrangeiro nas hipóteses pertinentes."],["Pessoa, família e bens","O art. 7º adota a lei do país do domicílio para regras sobre começo e fim da personalidade, nome, capacidade e direitos de família, ressalvadas disposições específicas. Para qualificar bens e regular relações a eles concernentes, o art. 8º adota, como regra, a lei do país onde estão situados."],["Obrigações, sucessão e ordem pública","O art. 9º prevê a lei do país em que se constituírem as obrigações, com disciplina própria para contratos. A sucessão segue, em regra, a lei do domicílio do falecido, observadas regras protetivas. Leis e atos estrangeiros não produzem efeitos no Brasil quando ofendem soberania nacional, ordem pública ou bons costumes, conforme art. 17."]],"map":["Conexão → lei aplicável","Pessoa → domicílio","Bens → localização","Ordem pública → limite"]},{"t":"Jurisdição internacional e cooperação jurídica","ref":"CPC, arts. 21 a 41 e 960 a 965; CF, art. 105, I, i","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","lessons":[["Competência concorrente e exclusiva","O CPC prevê hipóteses em que a autoridade brasileira pode julgar causas com elementos internacionais. Algumas são concorrentes; outras, como ações relativas a imóveis situados no Brasil, são exclusivas. A existência de processo no exterior não induz, em regra, litispendência no Brasil, ressalvadas regras internacionais."],["Cooperação internacional","Auxílio direto, carta rogatória e homologação de decisão estrangeira possuem finalidades diferentes. A autoridade central facilita a comunicação conforme o regime aplicável. A cooperação deve observar garantias processuais, publicidade quando pertinente e respeito à ordem pública."],["Homologação e exequatur","Compete ao STJ homologar decisões estrangeiras e conceder exequatur às cartas rogatórias, segundo a Constituição. A homologação examina requisitos de reconhecimento, sem transformar-se em novo julgamento amplo do mérito. O CPC excepciona a necessidade de homologação para sentença estrangeira de divórcio consensual simples."]],"map":["Jurisdição → arts. 21 a 25","Imóveis no Brasil → competência exclusiva","STJ → homologação e exequatur","Auxílio direto → regime próprio"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Extradição, imunidades e relações diplomáticas","ref":"CF, arts. 5º, LI e LII, e 102, I, g; Lei 13.445/2017; Convenção de Viena de 1961","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm","lessons":[["Extradição","Extradição é mecanismo de entrega de pessoa a outro Estado para fins de persecução penal ou cumprimento de condenação, conforme pressupostos legais e tratados. Diferencia-se de deportação e expulsão. No Brasil, o STF aprecia pedido de extradição formulado por Estado estrangeiro, e a execução segue o regime constitucional e legal."],["Limites constitucionais","Brasileiro nato não pode ser extraditado. Naturalizado pode sê-lo nas hipóteses de crime comum praticado antes da naturalização ou comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei. Não se concede extradição de estrangeiro por crime político ou de opinião."],["Imunidades diplomáticas","A Convenção de Viena sobre Relações Diplomáticas estabelece imunidades destinadas ao exercício das funções da missão. Agentes diplomáticos possuem imunidade de jurisdição penal no Estado acreditado, além de regime próprio para jurisdição civil e administrativa. Imunidade não equivale a autorização para descumprir a lei; o Estado acreditante pode renunciar expressamente à imunidade."]],"map":["Extradição ≠ deportação","STF → julgamento do pedido","Nato → vedação de extradição","Imunidade → proteção funcional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/antigos/d56435.htm"},{"t":"Responsabilidade internacional e Tribunal Penal Internacional","ref":"Estatuto de Roma, arts. 1º, 5º, 11, 17 e 25; CF, art. 5º, § 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto/2002/d4388.htm","lessons":[["Responsabilidade do Estado","A violação de obrigação internacional atribuível a Estado pode gerar responsabilidade internacional. Cessação do ilícito e reparação seguem o regime jurídico aplicável. Responsabilidade do Estado não se confunde com responsabilidade penal individual nem decorre automaticamente de toda controvérsia privada transnacional."],["Tribunal Penal Internacional","O TPI, instituído pelo Estatuto de Roma, exerce jurisdição penal sobre pessoas naturais nos limites de competência material, temporal e demais condições do Estatuto. Sua competência abrange genocídio, crimes contra a humanidade, crimes de guerra e crime de agressão, sujeitos às regras próprias. Não é órgão judiciário da ONU."],["Complementaridade e entrega","A atuação do TPI é complementar às jurisdições penais nacionais. A admissibilidade considera se o Estado está efetivamente disposto e apto a investigar ou processar. O Estatuto distingue entrega ao Tribunal de extradição entre Estados. O Brasil submete-se à jurisdição do TPI a cuja criação tenha manifestado adesão, conforme a Constituição."]],"map":["Estado → responsabilidade internacional","TPI → pessoas naturais","Complementaridade → jurisdições nacionais","Entrega ao TPI ≠ extradição"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const internationalQuestions=[{"id":14001,"s":13,"module":0,"topic":"Fundamentos e fontes do Direito Internacional","difficulty":"Intermediária","q":"Qual elemento diferencia o costume internacional de mera prática repetida?","a":["Obrigatoriedade de registro em cartório","Aceitação da prática como direito","Existência de contrato individual","Aprovação obrigatória pelo Congresso brasileiro"],"ok":1,"e":"O art. 38 do Estatuto da CIJ caracteriza o costume como prova de prática geral aceita como direito. A aceitação jurídica é usualmente denominada opinio juris.","src":"Estatuto da CIJ, art. 38; CF, art. 4º","url":"https://www.un.org/en/about-us/un-charter/full-text"},{"id":14002,"s":13,"module":0,"topic":"Fundamentos e fontes do Direito Internacional","difficulty":"Intermediária","q":"Um tratado conflita, no momento de sua conclusão, com norma imperativa de Direito Internacional geral. Qual consequência prevê a Convenção de Viena?","a":["Validade plena","Apenas recomendação de revisão","Nulidade do tratado","Validade se celebrado por dois Estados"],"ok":2,"e":"O art. 53 da Convenção de Viena de 1969 prevê nulidade de tratado incompatível com norma imperativa de Direito Internacional geral.","src":"Convenção de Viena de 1969, art. 53","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"id":14003,"s":13,"module":1,"topic":"Tratados internacionais: formação, vigência e extinção","difficulty":"Intermediária","q":"O que expressa o princípio pacta sunt servanda?","a":["Tratados em vigor obrigam as partes e devem ser cumpridos de boa-fé","Tratados nunca produzem efeitos jurídicos","Qualquer Estado pode ignorar livremente suas obrigações","Apenas costumes são obrigatórios"],"ok":0,"e":"O art. 26 da Convenção de Viena estabelece a obrigatoriedade e o cumprimento de boa-fé dos tratados em vigor.","src":"Convenção de Viena de 1969, arts. 2º, 11, 19 a 27 e 54 a 64","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"id":14004,"s":13,"module":1,"topic":"Tratados internacionais: formação, vigência e extinção","difficulty":"Intermediária","q":"Uma reserva incompatível com o objeto e a finalidade de tratado é, em regra, admissível?","a":["Sim, sempre","Sim, se feita oralmente","Sim, por simples decisão administrativa","Não, conforme art. 19"],"ok":3,"e":"O art. 19, c, da Convenção de Viena limita a formulação de reservas incompatíveis com o objeto e a finalidade do tratado.","src":"Convenção de Viena de 1969, arts. 2º, 11, 19 a 27 e 54 a 64","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"id":14005,"s":13,"module":2,"topic":"Incorporação e hierarquia dos tratados no Brasil","difficulty":"Intermediária","q":"Tratado de direitos humanos aprovado em dois turnos em cada Casa por três quintos dos respectivos membros terá qual posição?","a":["Regulamento administrativo","Equivalência a emenda constitucional","Simples contrato privado","Resolução municipal"],"ok":1,"e":"O art. 5º, § 3º, prevê equivalência às emendas constitucionais para tratados aprovados pelo procedimento qualificado.","src":"CF, arts. 5º, §§ 2º a 4º, 49, I, e 84, VIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14006,"s":13,"module":2,"topic":"Incorporação e hierarquia dos tratados no Brasil","difficulty":"Intermediária","q":"Segundo o STF, qual o status dos tratados de direitos humanos regularmente incorporados sem o rito qualificado do art. 5º, § 3º?","a":["Inferior aos decretos","Igual ao de contrato particular","Supralegal","Superior à Constituição em qualquer hipótese"],"ok":2,"e":"A orientação do STF no RE 466.343 atribui status supralegal a esses tratados: acima da legislação ordinária e abaixo da Constituição.","src":"CF, arts. 5º, §§ 2º a 4º, 49, I, e 84, VIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14007,"s":13,"module":3,"topic":"Estados, organizações internacionais e solução de controvérsias","difficulty":"Intermediária","q":"Quem pode figurar como parte em caso contencioso perante a CIJ?","a":["Qualquer pessoa natural","Qualquer empresa diretamente","Qualquer associação privada","Estados"],"ok":3,"e":"O art. 34, § 1º, do Estatuto da CIJ limita às entidades estatais a condição de partes em casos contenciosos.","src":"Carta da ONU, arts. 2º, 7º, 33 e 92 a 96; Estatuto da CIJ","url":"https://www.un.org/en/about-us/un-charter/full-text"},{"id":14008,"s":13,"module":3,"topic":"Estados, organizações internacionais e solução de controvérsias","difficulty":"Intermediária","q":"Qual meio de solução de controvérsias consta expressamente do art. 33 da Carta da ONU?","a":["Mediação","Anexação territorial unilateral","Retaliação armada obrigatória","Extinção de direitos individuais"],"ok":0,"e":"O art. 33 lista meios pacíficos, entre eles negociação, investigação, mediação, conciliação, arbitragem e solução judicial.","src":"Carta da ONU, arts. 2º, 7º, 33 e 92 a 96; Estatuto da CIJ","url":"https://www.un.org/en/about-us/un-charter/full-text"},{"id":14009,"s":13,"module":4,"topic":"Nacionalidade brasileira e condição jurídica do estrangeiro","difficulty":"Intermediária","q":"Após a EC 131/2023, a simples aquisição voluntária de outra nacionalidade provoca automaticamente perda da nacionalidade brasileira?","a":["Sim, sem exceção","Não","Sim, após dez anos","Sim, se o país estiver na Europa"],"ok":1,"e":"A EC 131 retirou a aquisição de outra nacionalidade como hipótese autônoma de perda da nacionalidade brasileira.","src":"EC 131/2023","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc131.htm"},{"id":14010,"s":13,"module":4,"topic":"Nacionalidade brasileira e condição jurídica do estrangeiro","difficulty":"Intermediária","q":"Qual cargo é privativo de brasileiro nato?","a":["Vereador","Prefeito","Ministro do Supremo Tribunal Federal","Deputado estadual"],"ok":2,"e":"O art. 12, § 3º, IV, reserva o cargo de Ministro do STF a brasileiros natos.","src":"CF, art. 12; EC 131/2023; Lei 13.445/2017","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14011,"s":13,"module":5,"topic":"Migração, refúgio e medidas de retirada","difficulty":"Intermediária","q":"A irregularidade migratória elimina automaticamente os direitos fundamentais de uma pessoa estrangeira no Brasil?","a":["Não, os direitos fundamentais e garantias legais continuam aplicáveis","Sim, em qualquer circunstância","Sim, após trinta dias","Sim, se não houver vínculo de emprego"],"ok":0,"e":"A Lei 13.445/2017 protege direitos de migrantes e adota a não criminalização da migração como princípio.","src":"Lei 13.445/2017; Lei 9.474/1997","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm"},{"id":14012,"s":13,"module":5,"topic":"Migração, refúgio e medidas de retirada","difficulty":"Intermediária","q":"Qual medida administrativa se relaciona especificamente à retirada de pessoa em situação migratória irregular, com procedimento legal próprio?","a":["Naturalização","Asilo diplomático","Reconhecimento de sentença estrangeira","Deportação"],"ok":3,"e":"A Lei 13.445, art. 50, define deportação como medida decorrente de procedimento administrativo que consiste em retirada compulsória de pessoa em situação migratória irregular.","src":"Lei 13.445/2017; Lei 9.474/1997","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm"},{"id":14013,"s":13,"module":6,"topic":"Direito Internacional Privado: conflitos de leis","difficulty":"Intermediária","q":"Pela regra geral do art. 7º da LINDB, qual elemento determina a lei aplicável à capacidade da pessoa?","a":["Nacionalidade obrigatoriamente","País do domicílio","Local do nascimento em todo caso","Local do ajuizamento sempre"],"ok":1,"e":"A LINDB adota o domicílio como elemento de conexão para capacidade, personalidade, nome e direitos de família, ressalvadas regras próprias.","src":"LINDB, arts. 7º a 10 e 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":14014,"s":13,"module":6,"topic":"Direito Internacional Privado: conflitos de leis","difficulty":"Intermediária","q":"Qual critério geral do art. 8º rege a qualificação dos bens e as relações a eles concernentes?","a":["Nacionalidade do advogado","Idioma do contrato","Lei do país onde os bens estão situados","Lei escolhida pelo juiz sem critério"],"ok":2,"e":"O art. 8º prevê a lex rei sitae, com ressalvas específicas para determinados bens móveis e garantias.","src":"LINDB, arts. 7º a 10 e 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"id":14015,"s":13,"module":7,"topic":"Jurisdição internacional e cooperação jurídica","difficulty":"Intermediária","q":"Qual tribunal é constitucionalmente competente para homologação de decisões estrangeiras, quando necessária?","a":["STF","TST","TRF em qualquer hipótese","STJ"],"ok":3,"e":"O art. 105, I, i, da Constituição atribui essa competência ao Superior Tribunal de Justiça.","src":"CF, art. 105, I, i","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14016,"s":13,"module":7,"topic":"Jurisdição internacional e cooperação jurídica","difficulty":"Intermediária","q":"Uma ação diretamente relativa a imóvel situado no Brasil está sujeita a qual regime de competência internacional?","a":["Competência exclusiva da autoridade judiciária brasileira","Competência exclusiva de tribunal estrangeiro","Ausência de competência de qualquer Estado","Competência determinada pela nacionalidade do réu exclusivamente"],"ok":0,"e":"O art. 23, I, do CPC atribui competência exclusiva à autoridade brasileira para ações relativas a imóveis situados no Brasil.","src":"CPC, arts. 21 a 41 e 960 a 965; CF, art. 105, I, i","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":14017,"s":13,"module":8,"topic":"Extradição, imunidades e relações diplomáticas","difficulty":"Intermediária","q":"Brasileiro nato pode ser extraditado por crime comum cometido no exterior?","a":["Sim, se houver tratado","Não, a Constituição veda sua extradição","Sim, se houver pena superior a quatro anos","Sim, mediante decisão de autoridade policial"],"ok":1,"e":"O art. 5º, LI, da Constituição veda a extradição de brasileiro nato.","src":"CF, arts. 5º, LI, e 102, I, g","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14018,"s":13,"module":8,"topic":"Extradição, imunidades e relações diplomáticas","difficulty":"Intermediária","q":"Qual órgão julga pedido de extradição solicitado por Estado estrangeiro?","a":["STJ","Tribunal de Contas da União","STF","Conselho Nacional de Justiça"],"ok":2,"e":"O art. 102, I, g, da Constituição atribui ao STF o processamento e julgamento da extradição solicitada por Estado estrangeiro.","src":"CF, arts. 5º, LI, e 102, I, g","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14019,"s":13,"module":9,"topic":"Responsabilidade internacional e Tribunal Penal Internacional","difficulty":"Intermediária","q":"Qual princípio caracteriza a relação do TPI com as jurisdições penais nacionais?","a":["Substituição automática de todos os tribunais nacionais","Complementaridade","Imunidade absoluta de qualquer pessoa","Exclusividade universal sem condições"],"ok":1,"e":"Os arts. 1º e 17 do Estatuto de Roma estabelecem caráter complementar e critérios de admissibilidade em relação às jurisdições nacionais.","src":"Estatuto de Roma, arts. 1º, 5º, 11, 17 e 25; CF, art. 5º, § 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto/2002/d4388.htm"},{"id":14020,"s":13,"module":9,"topic":"Responsabilidade internacional e Tribunal Penal Internacional","difficulty":"Intermediária","q":"O TPI julga diretamente a responsabilidade internacional de Estados, substituindo a CIJ?","a":["Sim, em qualquer controvérsia","Sim, em matéria comercial","Sim, se houver tratado bilateral","Não, sua jurisdição penal recai sobre pessoas naturais"],"ok":3,"e":"O art. 25 do Estatuto de Roma trata de responsabilidade penal individual; a CIJ possui função e competência distintas.","src":"Estatuto de Roma, arts. 1º, 5º, 11, 17 e 25; CF, art. 5º, § 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto/2002/d4388.htm"}];const consumerModules=[{"t":"Relação de consumo e princípios do CDC","ref":"CDC, arts. 1º a 5º; CF, arts. 5º, XXXII e 170, V","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Consumidor e destinatário final","Consumidor é pessoa natural ou jurídica que adquire ou utiliza produto ou serviço como destinatária final. A jurisprudência do STJ admite mitigação da teoria finalista em situações de vulnerabilidade demonstrada. A aquisição para integrar atividade produtiva não caracteriza automaticamente relação de consumo."],["Fornecedor, produto e serviço","Fornecedor abrange sujeitos públicos ou privados que desenvolvem atividades de fornecimento nos termos do art. 3º. Produto pode ser material ou imaterial, móvel ou imóvel. Serviço envolve atividade fornecida mediante remuneração, inclusive bancária, financeira, de crédito e securitária, ressalvadas relações trabalhistas."],["Vulnerabilidade e equiparação","O CDC reconhece a vulnerabilidade do consumidor como princípio da política nacional. Equiparações legais alcançam coletividade, vítimas de acidentes de consumo e pessoas expostas a práticas comerciais, conforme cada dispositivo. Não se deve exigir aquisição direta do produto em todas as hipóteses."]],"map":["Consumidor → destinatário final","Fornecedor → atividade de fornecimento","Vulnerabilidade → princípio","Equiparação → hipóteses legais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direitos básicos, informação e segurança","ref":"CDC, arts. 6º a 10","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Informação e transparência","O consumidor tem direito à informação adequada e clara sobre características, composição, quantidade, preço e riscos. Informação incompleta pode comprometer consentimento e segurança. A oferta precisa permitir comparação e compreensão das condições relevantes, inclusive de custos adicionais."],["Proteção da saúde e segurança","Produtos e serviços não devem acarretar riscos à saúde ou segurança, exceto os normais e previsíveis em decorrência de sua natureza e fruição, com informação adequada. Produto com alto grau de nocividade ou periculosidade conhecida não pode ser colocado no mercado pelo fornecedor."],["Reparação e facilitação da defesa","O consumidor tem direito à prevenção e reparação de danos patrimoniais e morais, individuais e coletivos. A inversão judicial do ônus da prova pode ocorrer diante de verossimilhança ou hipossuficiência, segundo critérios legais. Não é consequência automática de toda ação de consumo."]],"map":["Informação → clareza e adequação","Segurança → riscos e prevenção","Recall → comunicação posterior de risco","Ônus da prova → critérios legais"]},{"t":"Responsabilidade pelo fato do produto e do serviço","ref":"CDC, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Acidente de consumo","O fato do produto ou serviço envolve defeito que compromete a segurança legitimamente esperada e causa dano. Distingue-se do vício de adequação, que afeta qualidade, quantidade ou funcionamento. O fabricante, produtor, construtor, importador e fornecedor de serviços respondem objetivamente nas hipóteses legais."],["Comerciante e excludentes","O comerciante possui responsabilidade pelo fato do produto nas hipóteses específicas do art. 13. O fornecedor pode afastar responsabilidade demonstrando excludentes legalmente previstas, como inexistência do defeito ou culpa exclusiva do consumidor ou terceiro, conforme o regime. Não basta alegação genérica de ausência de culpa."],["Profissionais liberais","A responsabilidade pessoal dos profissionais liberais por fato do serviço é apurada mediante verificação de culpa, conforme art. 14, § 4º. Essa exceção não se estende automaticamente a toda pessoa jurídica prestadora de serviços. A análise deve identificar quem forneceu o serviço, o defeito e o nexo causal."]],"map":["Fato → acidente e dano","Defeito → segurança esperada","Responsabilidade → objetiva, em regra","Profissional liberal → culpa pessoal"]},{"t":"Vícios de produtos e serviços, garantias e prazos","ref":"CDC, arts. 18 a 27 e 50","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Vício de adequação","Fornecedores de produtos respondem solidariamente pelos vícios de qualidade ou quantidade nos termos do art. 18. Em regra, o fornecedor dispõe de até trinta dias para sanar o vício. Não resolvido, o consumidor escolhe substituição, restituição do preço ou abatimento proporcional. Há situações de exercício imediato previstas no § 3º."],["Vícios de serviços","O art. 20 oferece alternativas como reexecução sem custo adicional, restituição da quantia paga e abatimento proporcional. A disciplina não se confunde integralmente com a do vício de produto. O consumidor deve demonstrar inadequação e a solução depende das circunstâncias e do regime aplicável."],["Decadência e prescrição","O direito de reclamar por vícios aparentes ou de fácil constatação tem prazo decadencial de trinta dias para produtos e serviços não duráveis e noventa para duráveis. No vício oculto, a contagem começa quando evidenciado. A pretensão de reparação por fato do produto ou serviço segue prazo de cinco anos do conhecimento do dano e autoria. Garantia contratual complementa a legal."]],"map":["Vício → inadequação","Reparo do produto → até 30 dias, regra geral","Decadência → 30 ou 90 dias","Fato do consumo → prescrição de 5 anos"]},{"t":"Oferta, publicidade e práticas abusivas","ref":"CDC, arts. 29 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Vinculação da oferta","Informação ou publicidade suficientemente precisa obriga o fornecedor que a fizer veicular ou dela se utilizar e integra o contrato. Se houver recusa de cumprimento, o art. 35 prevê alternativas, incluindo cumprimento forçado, prestação equivalente ou resolução com restituição e eventuais perdas e danos."],["Publicidade enganosa e abusiva","Publicidade enganosa contém informação falsa ou capaz de induzir em erro, inclusive por omissão de dado essencial. Publicidade abusiva viola valores protegidos, como aquela discriminatória ou que explore a deficiência de julgamento da criança. O ônus da prova da veracidade e correção da publicidade cabe a quem a patrocina."],["Práticas comerciais vedadas","O art. 39 proíbe condicionar fornecimento à aquisição de outro produto ou serviço, salvo as distinções legais aplicáveis, e outras práticas abusivas. Envio de produto não solicitado, em regra, equivale a amostra grátis. A cobrança de vantagem manifestamente excessiva exige exame da prática concreta."]],"map":["Oferta precisa → vincula","Enganosa → indução ao erro","Abusiva → valores protegidos","Venda casada → vedação"]},{"t":"Contratos de consumo e cláusulas abusivas","ref":"CDC, arts. 46 a 54","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Conhecimento e interpretação","Contratos não obrigam o consumidor quando não lhe é dada oportunidade de conhecimento prévio ou quando instrumentos dificultam a compreensão de seu sentido e alcance. Cláusulas contratuais devem ser interpretadas de maneira mais favorável ao consumidor, conforme art. 47."],["Cláusulas abusivas","O art. 51 estabelece nulidade de pleno direito de cláusulas abusivas, como aquelas que imponham desvantagem exagerada ou afastem indevidamente responsabilidade legal. A nulidade de uma cláusula não invalida necessariamente todo o contrato, salvo consequências previstas no § 2º."],["Adesão e revisão","Contrato de adesão tem cláusulas previamente estabelecidas sem possibilidade de discussão substancial pelo consumidor. Cláusulas limitativas de direitos exigem destaque. O art. 6º, V, protege modificação de prestações desproporcionais e revisão diante de fatos supervenientes que as tornem excessivamente onerosas."]],"map":["Prévio conhecimento → exigência","Interpretação → favorável ao consumidor","Abusividade → nulidade","Adesão → destaque de limitações"]},{"t":"Comércio eletrônico e direito de arrependimento","ref":"CDC, art. 49; Decreto 7.962/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Contratação a distância","O comércio eletrônico exige informação clara sobre fornecedor, produto, despesas adicionais e condições integrais da oferta. O Decreto 7.962/2013 prevê mecanismos para correção de erros antes da contratação, confirmação da aceitação e atendimento facilitado."],["Arrependimento","Nas contratações fora do estabelecimento comercial, o art. 49 prevê prazo de sete dias a partir da assinatura ou do recebimento do produto ou serviço, conforme o caso. O direito não exige demonstração de defeito. Valores pagos a qualquer título durante o prazo de reflexão devem ser devolvidos nos termos legais."],["Atendimento e cancelamento","O fornecedor deve disponibilizar meios adequados para exercício do arrependimento, inclusive pela mesma ferramenta utilizada para contratação, sem prejuízo de outros meios. O cancelamento de contratos acessórios vinculados segue a disciplina regulamentar. Não confunda arrependimento com garantia por vício."]],"map":["E-commerce → transparência","Fora do estabelecimento → art. 49","Arrependimento → 7 dias","Devolução → valores pagos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/decreto/d7962.htm"},{"t":"Cobrança de dívidas e cadastros de consumidores","ref":"CDC, arts. 42 a 44","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Cobrança legítima e abuso","O consumidor inadimplente não pode ser exposto ao ridículo nem submetido a ameaça ou constrangimento. O fornecedor pode buscar satisfação de crédito legítimo por meios lícitos. A existência de dívida não afasta deveres de respeito, privacidade e adequação dos contatos de cobrança."],["Repetição do indébito","O consumidor cobrado indevidamente que paga valor em excesso tem direito à repetição em dobro, acrescida de correção e juros legais, salvo engano justificável. A jurisprudência do STJ considera a boa-fé objetiva, observadas as condições e modulação temporal pertinentes. Cobrança sem pagamento não gera automaticamente repetição de valor inexistente."],["Cadastros e correção","O consumidor tem acesso a dados cadastrais e respectivas fontes. Informações devem ser objetivas, claras e verdadeiras. Dados negativos não podem referir-se a período superior a cinco anos, observadas as regras legais. A abertura de cadastro não solicitada deve ser comunicada por escrito e dados inexatos podem ser corrigidos."]],"map":["Cobrança → sem constrangimento","Pagamento indevido → repetição conforme requisitos","Cadastro → informação e acesso","Negativação → limite legal"]},{"t":"Crédito responsável e superendividamento","ref":"CDC, arts. 54-A a 54-G e 104-A a 104-C; Lei 14.181/2021","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Conceito e prevenção","Superendividamento é impossibilidade manifesta de consumidor pessoa natural, de boa-fé, pagar a totalidade das dívidas de consumo exigíveis e vincendas sem comprometer o mínimo existencial, nos termos da regulamentação. O regime possui exclusões, como dívidas contraídas mediante fraude ou má-fé nas condições legais."],["Crédito responsável","O fornecedor deve informar custos, encargos, consequências do inadimplemento e avaliar responsavelmente as condições de crédito. É vedado ocultar riscos ou assediar consumidores para contratar, especialmente em situações de vulnerabilidade agravada. A proteção não significa proibição geral de concessão de crédito."],["Repactuação","O processo de repactuação permite audiência conciliatória com credores abrangidos e proposta de plano de pagamento em até cinco anos, preservado o mínimo existencial e observadas exclusões do art. 104-A. Frustrada a conciliação, existem mecanismos judiciais próprios. Nem toda dívida é incluída e o valor regulamentar do mínimo existencial deve ser conferido na data aplicável."]],"map":["Boa-fé → requisito","Crédito → informação e avaliação","Mínimo existencial → preservação","Plano → até 5 anos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14181.htm"},{"t":"Tutela individual, coletiva e sistema de defesa","ref":"CDC, arts. 55 a 60 e 81 a 104","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Tutela administrativa","O Sistema Nacional de Defesa do Consumidor articula órgãos públicos e entidades de defesa. Procons exercem atribuições administrativas, inclusive fiscalização e sanções nos limites de competência. Sanção administrativa não se confunde com indenização civil nem exclui outras medidas cabíveis."],["Direitos difusos, coletivos e individuais homogêneos","Direitos difusos são transindividuais indivisíveis de titulares indeterminados ligados por circunstâncias de fato. Coletivos em sentido estrito envolvem grupo, categoria ou classe ligados por relação jurídica base. Individuais homogêneos decorrem de origem comum, permitindo tutela coletiva conforme a lei."],["Legitimidade e acesso à Justiça","O art. 82 atribui legitimidade coletiva ao Ministério Público, entes públicos, entidades administrativas específicas e associações que atendam requisitos legais. A ação individual por responsabilidade do fornecedor pode ser proposta no domicílio do autor conforme art. 101, I. A coisa julgada coletiva segue regras diferenciadas conforme a espécie de direito."]],"map":["Procon → atuação administrativa","Difuso → titulares indeterminados","Coletivo estrito → relação jurídica base","Homogêneo → origem comum"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l7347compilada.htm"}];const consumerQuestions=[{"id":15001,"s":14,"module":0,"topic":"Relação de consumo e princípios do CDC","difficulty":"Intermediária","q":"Uma pessoa jurídica pode ser consumidora nos termos do CDC?","a":["Não, em nenhuma hipótese","Sim, quando preenchidos os pressupostos da relação de consumo","Somente se for entidade pública","Somente se tiver um empregado"],"ok":1,"e":"O art. 2º admite pessoa natural ou jurídica como consumidora, desde que seja destinatária final, consideradas as hipóteses reconhecidas pela jurisprudência.","src":"CDC, arts. 1º a 5º; CF, arts. 5º, XXXII e 170, V","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15002,"s":14,"module":0,"topic":"Relação de consumo e princípios do CDC","difficulty":"Intermediária","q":"Uma pessoa sofre dano em acidente de consumo embora não tenha adquirido o produto. Pode ser equiparada a consumidor?","a":["Não, pois não assinou contrato","Não, salvo se for empregada do fabricante","Sim, o art. 17 equipara todas as vítimas do evento","Somente se for revendedora"],"ok":2,"e":"O art. 17 equipara às figuras de consumidor todas as vítimas do evento para os efeitos da seção sobre responsabilidade pelo fato do produto ou serviço.","src":"CDC, arts. 1º a 5º; CF, arts. 5º, XXXII e 170, V","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15003,"s":14,"module":1,"topic":"Direitos básicos, informação e segurança","difficulty":"Intermediária","q":"O fornecedor descobre, após colocar produto no mercado, periculosidade relevante anteriormente desconhecida. Qual dever prevê o art. 10, § 1º?","a":["Comunicar imediatamente autoridades competentes e consumidores","Manter segredo comercial","Aguardar ocorrência de dano antes de informar","Apenas alterar o preço"],"ok":0,"e":"O art. 10, § 1º, determina comunicação imediata às autoridades e consumidores mediante anúncios publicitários, nos termos legais.","src":"CDC, arts. 6º a 10","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15004,"s":14,"module":1,"topic":"Direitos básicos, informação e segurança","difficulty":"Intermediária","q":"A inversão judicial do ônus da prova do art. 6º, VIII, é automaticamente obrigatória em todo processo de consumo?","a":["Sim, independentemente do caso","Sim, se o pedido for verbal","Sim, por mera escolha do fornecedor","Não, depende da avaliação dos requisitos legais"],"ok":3,"e":"A facilitação da defesa inclui inversão a critério do juiz quando verossímil a alegação ou quando o consumidor for hipossuficiente, segundo regras de experiência.","src":"CDC, arts. 6º a 10","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15005,"s":14,"module":2,"topic":"Responsabilidade pelo fato do produto e do serviço","difficulty":"Intermediária","q":"Qual regime o art. 14, § 4º, estabelece para responsabilidade pessoal de profissional liberal?","a":["Responsabilidade objetiva em todos os casos","Verificação de culpa","Imunidade civil absoluta","Responsabilidade exclusivamente penal"],"ok":1,"e":"O § 4º estabelece apuração mediante verificação de culpa para responsabilidade pessoal dos profissionais liberais.","src":"CDC, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15006,"s":14,"module":2,"topic":"Responsabilidade pelo fato do produto e do serviço","difficulty":"Intermediária","q":"Qual situação caracteriza, em princípio, fato do produto, e não mero vício de adequação?","a":["Produto entregue em cor diferente sem outro dano","Atraso na entrega sem acidente","Defeito de segurança que causa lesão ao consumidor","Ausência de embalagem decorativa"],"ok":2,"e":"O fato do produto envolve defeito de segurança e dano decorrente, conforme art. 12; o vício possui disciplina específica nos arts. 18 e seguintes.","src":"CDC, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15007,"s":14,"module":3,"topic":"Vícios de produtos e serviços, garantias e prazos","difficulty":"Intermediária","q":"Qual o prazo decadencial para reclamar de vício aparente de produto durável?","a":["Sete dias","Trinta dias","Cinco anos","Noventa dias"],"ok":3,"e":"O art. 26, II, prevê noventa dias para produtos e serviços duráveis, observadas as regras de início e obstáculos à decadência.","src":"CDC, arts. 18 a 27 e 50","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15008,"s":14,"module":3,"topic":"Vícios de produtos e serviços, garantias e prazos","difficulty":"Intermediária","q":"Quando começa o prazo decadencial para reclamação de vício oculto?","a":["No momento em que o defeito fica evidenciado","Sempre na fabricação","Sempre na assinatura do contrato","Após cinco anos da compra"],"ok":0,"e":"O art. 26, § 3º, estabelece início da contagem no momento em que ficar evidenciado o defeito oculto.","src":"CDC, arts. 18 a 27 e 50","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15009,"s":14,"module":4,"topic":"Oferta, publicidade e práticas abusivas","difficulty":"Intermediária","q":"Um fornecedor recusa cumprir oferta suficientemente precisa que integra a contratação. Qual alternativa está prevista no art. 35?","a":["Exigir o cumprimento forçado da oferta","Perder obrigatoriamente todo valor pago","Aceitar qualquer produto imposto pelo fornecedor","Aguardar autorização legislativa"],"ok":0,"e":"O art. 35 permite ao consumidor optar pelo cumprimento forçado, aceitar equivalente ou rescindir o contrato, com os efeitos previstos.","src":"CDC, arts. 29 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15010,"s":14,"module":4,"topic":"Oferta, publicidade e práticas abusivas","difficulty":"Intermediária","q":"O fornecedor condiciona injustificadamente a venda de um produto à aquisição de outro. Qual prática é caracterizada?","a":["Exercício obrigatório de garantia","Compensação tributária","Venda casada","Direito de arrependimento"],"ok":2,"e":"O art. 39, I, veda condicionar fornecimento de produto ou serviço ao fornecimento de outro, bem como impor limites quantitativos sem justa causa.","src":"CDC, arts. 29 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15011,"s":14,"module":5,"topic":"Contratos de consumo e cláusulas abusivas","difficulty":"Intermediária","q":"Havendo dúvida interpretativa sobre cláusula de contrato de consumo, qual regra prevê o art. 47?","a":["Interpretação necessariamente favorável ao fornecedor","Interpretação mais favorável ao consumidor","Inexistência de qualquer interpretação","Nulidade integral obrigatória"],"ok":1,"e":"O art. 47 determina interpretação das cláusulas contratuais de maneira mais favorável ao consumidor.","src":"CDC, arts. 46 a 54","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15012,"s":14,"module":5,"topic":"Contratos de consumo e cláusulas abusivas","difficulty":"Intermediária","q":"A nulidade de uma cláusula abusiva sempre invalida o contrato inteiro?","a":["Sim, sem exceção","Sim, independentemente das demais cláusulas","Sim, se o fornecedor desejar","Não, deve ser observado o art. 51, § 2º"],"ok":3,"e":"A nulidade de cláusula abusiva não invalida o contrato, exceto quando sua ausência, apesar de esforços de integração, acarretar ônus excessivo a qualquer das partes.","src":"CDC, arts. 46 a 54","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15013,"s":14,"module":6,"topic":"Comércio eletrônico e direito de arrependimento","difficulty":"Intermediária","q":"Uma consumidora compra um produto pela internet e o recebe sem defeito. Dentro do prazo legal, pode exercer o arrependimento sem justificar vício?","a":["Sim, o art. 49 não exige defeito","Não, apenas se o produto estiver quebrado","Não, porque pagou antecipadamente","Somente com autorização judicial"],"ok":0,"e":"A contratação a distância sujeita-se ao direito de arrependimento no prazo legal de sete dias, não condicionado à existência de defeito.","src":"CDC, art. 49; Decreto 7.962/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15014,"s":14,"module":6,"topic":"Comércio eletrônico e direito de arrependimento","difficulty":"Intermediária","q":"Qual o prazo geral de reflexão previsto no art. 49 para contratação fora do estabelecimento?","a":["Trinta dias","Quarenta e oito horas","Sete dias","Noventa dias"],"ok":2,"e":"O art. 49 estabelece sete dias a contar da assinatura ou do recebimento do produto ou serviço, conforme a situação.","src":"CDC, art. 49; Decreto 7.962/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15015,"s":14,"module":7,"topic":"Cobrança de dívidas e cadastros de consumidores","difficulty":"Intermediária","q":"Qual direito prevê o art. 42, parágrafo único, quando o consumidor paga quantia indevida em excesso, sem engano justificável?","a":["Perda integral da quantia","Restituição apenas quando houver crime","Repetição em dobro do excesso, com correção e juros legais","Restituição obrigatoriamente tripla"],"ok":2,"e":"A repetição em dobro exige pagamento indevido e ressalva o engano justificável; a interpretação jurisprudencial deve ser considerada.","src":"CDC, arts. 42 a 44","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15016,"s":14,"module":7,"topic":"Cobrança de dívidas e cadastros de consumidores","difficulty":"Intermediária","q":"Qual limite temporal estabelece o art. 43, § 1º, para informações negativas nos cadastros?","a":["Um ano","Cinco anos","Dez anos","Prazo ilimitado"],"ok":1,"e":"O art. 43, § 1º, veda informações negativas referentes a período superior a cinco anos.","src":"CDC, arts. 42 a 44","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15017,"s":14,"module":8,"topic":"Crédito responsável e superendividamento","difficulty":"Intermediária","q":"O regime de superendividamento do art. 54-A destina-se, em seu conceito legal, a qual sujeito?","a":["Qualquer empresa insolvente","Consumidor pessoa natural de boa-fé","Somente instituição financeira","Somente pessoa jurídica de direito público"],"ok":1,"e":"O art. 54-A, § 1º, define superendividamento em relação à pessoa natural de boa-fé, considerando dívidas de consumo e mínimo existencial.","src":"CDC, arts. 54-A a 54-G e 104-A a 104-C; Lei 14.181/2021","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15018,"s":14,"module":8,"topic":"Crédito responsável e superendividamento","difficulty":"Intermediária","q":"Qual o prazo máximo do plano de pagamento proposto na audiência de repactuação do art. 104-A?","a":["Trinta dias","Um ano","Dez anos","Cinco anos"],"ok":3,"e":"O art. 104-A estabelece proposta de plano com prazo máximo de cinco anos, observados os demais requisitos legais.","src":"CDC, arts. 54-A a 54-G e 104-A a 104-C; Lei 14.181/2021","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15019,"s":14,"module":9,"topic":"Tutela individual, coletiva e sistema de defesa","difficulty":"Intermediária","q":"Qual característica define direitos individuais homogêneos para o CDC?","a":["Decorrência de origem comum","Indeterminação absoluta de qualquer titular em todos os casos","Ausência de qualquer vínculo fático","Titularidade exclusivamente estatal"],"ok":0,"e":"O art. 81, parágrafo único, III, caracteriza direitos individuais homogêneos como decorrentes de origem comum.","src":"CDC, arts. 55 a 60 e 81 a 104","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15020,"s":14,"module":9,"topic":"Tutela individual, coletiva e sistema de defesa","difficulty":"Intermediária","q":"Em ação de responsabilidade civil do fornecedor, qual faculdade territorial o art. 101, I, assegura ao consumidor autor?","a":["Ajuizar exclusivamente no exterior","Ajuizar apenas na sede do fornecedor","Ajuizar a ação em seu domicílio","Escolher qualquer país sem conexão"],"ok":2,"e":"O art. 101, I, permite propor a ação no domicílio do autor, sem confundir essa regra com a competência de ações coletivas.","src":"CDC, arts. 55 a 60 e 81 a 104","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"}];const studyTracks={0:{modules:ethicsModules,questions:ethicsQuestions},1:{modules:constitutionalModules,questions:constitutionalQuestions},2:{modules:civilModules,questions:civilQuestions},3:{modules:processCivil function trackSource(m){return `<a class="link" target="_blank" rel="noopener noreferrer" href="${m.url}">${m.ref}</a>${m.extraUrl?`<p><a class="link" target="_blank" rel="noopener noreferrer" href="${m.extraUrl}">Fonte complementar</a></p>`:''}`}
function trackFlashQueue(k){return [...studyTracks[k].questions].sort((a,b)=>(state.reviews[a.id]?.due||0)-(state.reviews[b.id]?.due||0)||a.id-b.id)}
function trackFlashMove(k,known){const q=studyTracks[k].questions.find(q=>q.id===trackFlashId);if(!q)return;const prev=state.reviews[q.id]||{interval:0};const interval=known?Math.min(30,Math.max(1,prev.interval*2)):0;state.reviews[q.id]={interval,due:Date.now()+(known?interval*86400000:600000)};save();trackFlashId=null;showBack=false;render()}
function trackFlashNext(k){const l=trackFlashQueue(k),i=l.findIndex(q=>q.id===trackFlashId);trackFlashId=l[(i+1)%l.length].id;showBack=false;render()}
function trackScreen(k){
 const parts=view.split(':'), type=parts[2], i=Number(parts[3]), {modules,questions}=studyTracks[k], d=trackDone(k), back=trackBack(k);
 if(type==='modulo'){const m=modules[i];return back+`<div class="panel"><div class="eyebrow">MÓDULO ${String(i+1).padStart(2,'0')} / ${modules.length}</div><h2>${m.t}</h2><p class="muted">${m.ref}</p></div>${m.lessons.map(([t,p],j)=>`<article class="panel ethics-lesson"><div class="label">TÓPICO ${j+1}</div><h3>${t}</h3><p>${p}</p></article>`).join('')}<div class="panel ethics-lesson"><h3>Mapa de revisão</h3>${trackMap(m)}${trackSource(m)}</div><div class="sessiontools"><button class="btn gold" onclick="trackMark(${k},${i})">${d[i]?'Desmarcar conclusão':'Marcar como concluído'}</button><button class="btn" onclick="trackPractice(${k},${i})">Praticar ${questions.filter(q=>q.module===i).length} questões</button>${i<modules.length-1?`<button class="btn alt" onclick="go('${trackRoute(k,i+1,'modulo')}')">Próximo módulo →</button>`:''}</div>`}
 if(type==='lei')return back+`<div class="panel"><h2>Legislação comentada</h2><p class="muted">Guia de estudo: confira a redação oficial e a jurisprudência vigente.</p></div>${modules.map(m=>`<article class="panel ethics-lesson"><h3>${m.t}</h3>${m.lessons.map(([t,p])=>`<p><strong>${t}.</strong> ${p}</p>`).join('')}${trackSource(m)}</article>`).join('')}`;
 if(type==='mapas'||type==='revisao')return back+`<div class="panel"><h2>${type==='mapas'?'Mapas mentais':'Revisão estratégica'}</h2><p class="muted">Organize os conceitos e pratique a recuperação ativa.</p></div>${modules.map((m,j)=>`<div class="panel ethics-lesson"><h3>${m.t}</h3>${trackMap(m)}<button class="btn alt" onclick="trackPractice(${k},${j})">Revisar com questões</button></div>`).join('')}`;
 if(type==='simulado')return back+`<div class="panel"><h2>Simulado temático — ${subjects[k]}</h2><p class="muted">${modules.length} questões autorais · ${modules.length*3} minutos · uma por módulo · correção ao final. Não equivale à prova oficial.</p><button class="btn gold" style="margin-top:15px" onclick="trackSim(${k})">Começar simulado</button></div>`;
 if(type==='flash'){const list=trackFlashQueue(k),q=list.find(q=>q.id===trackFlashId)||list[0];trackFlashId=q.id;const due=list.filter(q=>!state.reviews[q.id]||state.reviews[q.id].due<=Date.now()).length;return back+`<div class="panel question"><div class="label">FLASHCARDS · ${due} disponíveis para revisão</div><p class="muted">${q.topic}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div class="sessiontools"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="trackFlashMove(${k},false)">Revisar em 10 min</button><button class="btn gold" onclick="trackFlashMove(${k},true)">Já sei</button>`:`<button class="btn alt" onclick="trackFlashNext(${k})">Próximo cartão</button>`}</div></div>`}
 return back;
}
function render(){const attempts=state.attempts,correct=attempts.filter(x=>x.correct).length,errors=qs.filter(q=>last()[q.id]?.correct===false);let b='';if(view==='Diagnóstico'){b=`<div class="panel"><span class="tileicon gold">${ico('Diagnóstico')}</span><h3 style="margin-top:14px">Descubra seu ponto de partida</h3><p class="muted" style="margin:8px 0 16px">Faça o diagnóstico demonstrativo para conhecer o fluxo. São quatro questões de exemplo, não uma avaliação representativa do exame.</p><button class="btn" onclick="start(sampleQuestions,'Diagnóstico')">Começar diagnóstico →</button></div>`}else if(view==='Meu desempenho'){b=`<p class="muted">Acompanhe o seu histórico de treino neste navegador.</p><div class="grid"><div class="tile"><div class="label">Respostas registradas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros pendentes</div><div class="metric">${errors.length}</div></div></div><div class="panel"><h3>Desempenho por disciplina</h3><p class="muted">Somente questões respondidas são consideradas.</p>${subjects.map((s,i)=>{const a=attempts.filter(x=>qs.some(q=>q.id===x.id&&q.s===i));const p=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0;return '<div class="listline"><div class="smallrow"><strong>'+s+'</strong><span class="muted">'+(a.length?p+'%':'Sem dados')+'</span></div>'+(a.length?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}).join('')}</div>`}else if(view==='Provas anteriores'){b=`<div class="panel empty"><span class="tileicon">${ico(view)}</span><h3>Biblioteca de provas anteriores</h3><p class="muted">A estrutura está pronta para receber cadernos, gabaritos e filtros por edição. O acervo será incluído na etapa de conteúdo.</p><p><a class="link" href="https://oab.fgv.br/" target="_blank" rel="noopener noreferrer">Consultar portal oficial do exame ↗</a></p></div>`}else if(view==='Configurações'){b=`<div class="panel"><h3>${state.profileReady?'Preferências de estudo':'Vamos configurar sua preparação'}</h3><p class="muted" style="margin:8px 0 18px">Informe o tempo diário e a data da prova. Os dados ficam neste navegador.</p>${profileForm()}<div class="settingsrow"><strong>Meta de treinamento sugerida</strong><strong>45/80</strong></div><div class="settingsrow"><div><strong>Conta e sincronização</strong><div class="muted">Autenticação ainda não integrada.</div></div><span class="badge-mini">Em preparação</span></div></div>`}else if(view==='Ajuda'){b=`<div class="panel"><h3>Como usar o Rota 40</h3><div class="listline"><strong>1. Comece pelo diagnóstico</strong><p class="muted">Conheça o fluxo de questões e respostas.</p></div><div class="listline"><strong>2. Abra Minha rota</strong><p class="muted">Defina o tempo que tem disponível e veja as prioridades.</p></div><div class="listline"><strong>3. Revise e acompanhe</strong><p class="muted">Use o caderno de erros e o painel de desempenho.</p></div><div class="notice">Prévia não comercial. As informações ficam apenas neste navegador. Não há conta, cobrança ou mentor IA ativo.</div><button class="btn alt" onclick="go('Diagnóstico')">Começar diagnóstico</button></div>`}else if(view.startsWith('Etica:')){b=ethicsScreen()}else if(view.startsWith('Trilha:')){b=trackScreen(trackIndex())}else if(view.startsWith('Disciplina:')&&studyTracks[Number(view.split(':')[1])]){b=trackPage(Number(view.split(':')[1]))}else if(view.startsWith('Disciplina:')){const i=Number(view.split(':')[1]),n=qs.filter(q=>q.s===i).length;b=`<button class="breadcrumb" onclick="go('Disciplinas')">${ico('Página inicial')} Todas as disciplinas</button><div class="panel"><div class="tilehead"><span class="tileicon gold">${ico('Disciplinas')}</span><div><h3>${subjects[i]}</h3><p class="muted">Trilha de preparação · primeira fase</p></div></div></div><h3 class="sectiontitle">Materiais e ferramentas</h3><div class="grid two">${['Teoria resumida','Legislação comentada','Mapas mentais','Questões comentadas','Flashcards','Revisão da disciplina'].map(m=>`<div class="tile"><div class="tilehead"><span class="tileicon">${ico(m==='Questões comentadas'?'Questões':m==='Flashcards'?'Flashcards':'Disciplinas')}</span><div class="tilecopy"><strong>${m}</strong><div class="muted">${m==='Questões comentadas'&&n?n+' questão demonstrativa':'Conteúdo em preparação'}</div></div></div>${m==='Questões comentadas'&&n?`<button class="btn alt" onclick="train(${i})">Praticar →</button>`:''}</div>`).join('')}</div>`}else if(view==='Painel'){b=`<p class="muted">Comece pelo diagnóstico e siga sua próxima missão.</p>${state.session?`<div class="panel" style="margin:15px 0"><h3>Treino em andamento</h3><p class="muted">${state.session.title} · questão ${Math.min(state.session.pos+1,state.session.ids.length)} de ${state.session.ids.length}</p><button class="btn" style="margin-top:10px" onclick="resumeSession()">Continuar treino →</button></div>`:""}<div class="panel mission"><div class="eyebrow" style="color:#dec38c">Sua missão</div><h2>${attempts.length?'Continue sua rota':'Descubra seu ponto de partida'}</h2><p>${attempts.length?'Priorize as questões ainda não dominadas.':'Responda às quatro questões de demonstração.'}</p><button class="btn gold" onclick="${attempts.length?"go('Minha rota')":"go('Diagnóstico')"}">${attempts.length?'Iniciar revisão':'Iniciar diagnóstico'} →</button></div><div class="grid"><div class="tile"><div class="label">Questões respondidas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros para revisar</div><div class="metric">${errors.length}</div></div></div><h3 class="sectiontitle">Estudo e prática</h3><div class="grid two">${['Disciplinas','Questões','Simulados','Provas anteriores'].map(m=>actionTile(m)).join('')}</div><h3 class="sectiontitle">Revisão e acompanhamento</h3><div class="grid two">${['Caderno de erros','Flashcards','Meu desempenho','Mentor IA'].map(m=>actionTile(m)).join('')}</div>`}else if(view==='Minha rota'){const d=daysLeft(),plan=routePlan();b=`<div class="panel mission"><div class="eyebrow" style="color:#dec38c">${d!==null&&d>=0&&d<=14?'Reta final':'Sua preparação diária'}</div><h2>${state.minutes} minutos para avançar</h2><p>${d===null?'Defina a data da prova nas configurações.':d<0?'Atualize a data da prova.':d===0?'Hoje é a data de prova informada.':d+' dias até a data informada.'} Rota baseada em regras e no banco disponível; cobertura parcial das matérias da OAB.</p><button class="btn gold" onclick="start(routePlan(),'Minha rota')">Começar missão →</button></div><div class="panel"><div class="smallrow"><h3>Prioridades de hoje</h3><button class="btn alt" onclick="go('Configurações')">Ajustar perfil</button></div>${plan.map(q=>`<div class="listline"><div class="smallrow"><strong>${subjects[q.s]}</strong><span class="muted">${last()[q.id]?.correct===false?'Refazer erro':!last()[q.id]?'Praticar':'Consolidar'}</span></div></div>`).join('')}<p class="muted" style="margin-top:14px">A incidência histórica das provas será integrada após curadoria do acervo.</p></div>`}else if(view==='Disciplinas'){b=`<p class="muted">Escolha uma das 20 matérias para explorar sua trilha. ${Object.keys(studyTracks).length} disciplinas já têm módulos de estudo. As demais estão em preparação.</p><label class="searchbox">${ico('search')}<input aria-label="Buscar disciplina" placeholder="Buscar disciplina..." oninput="filterSubjects(this.value)"></label><div class="catalog" id="catalog">${subjects.map((s,i)=>`<button class="tile action" data-subject="${i}" onclick="go('Disciplina:${i}')"><div class="tilehead"><span class="tileicon">${ico('Disciplinas')}</span><div class="tilecopy"><strong>${s}</strong><div class="muted">${studyTracks[i]?studyTracks[i].modules.length+' módulos disponíveis':'Em preparação'}</div></div><span class="arrow">${ico('arrow')}</span></div></button>`).join('')}</div><p class="muted hidden" id="noSubjects">Nenhuma disciplina encontrada.</p>`}else if(view==='Questões'){b=`<div class="panel"><h3>Banco de questões — amostra</h3><p>${qs.length} exercícios autorais com fundamentação legal. Conteúdo inicial disponível nas trilhas de ${Object.keys(studyTracks).map(i=>subjects[Number(i)]).join(', ')}.</p><div class="filterrow"><select id="questionSubject" aria-label="Filtrar matéria"><option value="">Todas as matérias</option>${subjects.map((s,i)=>`<option value="${i}" ${qs.some(q=>q.s===i)?"":"disabled"}>${s}</option>`).join("")}</select><button class="btn" onclick="trainSelected()">Iniciar treino</button></div></div>`}else if(view==='Simulados'){b=`<div class="panel"><h3>Mini-simulado demonstrativo</h3><p class="muted">4 questões · 12 minutos · gabarito ao final. Não representa a distribuição ou dificuldade de uma prova oficial de 80 questões.</p><button class="btn" style="margin-top:12px" onclick="start(sampleQuestions,'Simulados')">Começar mini-simulado</button></div>`}else if(view==='Caderno de erros'){b=`<div class="panel"><h3>${errors.length?'Seus pontos de revisão':'Nenhum erro pendente'}</h3>${errors.length?errors.map(q=>`<div class="listline"><strong>${subjects[q.s]}</strong><p>${q.q}</p></div>`).join(''):'<p class="muted">As questões que você errar aparecerão aqui.</p>'}<button class="btn" ${errors.length?'':'disabled'} style="margin-top:12px" onclick="start(qs.filter(q=>last()[q.id]?.correct===false),'Caderno de erros')">Refazer erros</button></div>`}else if(view==='Flashcards'){const q=qs[flash%qs.length];b=`<div class="panel question"><div class="label">Cartão ${flash%qs.length+1} de ${qs.length} · ${subjects[q.s]}</div><p class="muted">${state.reviews[q.id]?state.reviews[q.id].due<=Date.now()?"Revisão disponível":"Próxima revisão: "+new Date(state.reviews[q.id].due).toLocaleString("pt-BR"):"Ainda não revisado"}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="reviewCard(false)">Revisar em 10 min</button><button class="btn alt" onclick="reviewCard(true)">Já sei · agendar revisão</button>`:`<button class="btn alt" onclick="flash++;showBack=false;render()">Próximo cartão</button>`}</div></div>`}else{b=`<div class="panel"><h3>Mentor Jurídico IA</h3><p class="notice">Integração de IA ainda não configurada. Nenhuma resposta de IA será simulada como se fosse real.</p><p class="muted">A versão planejada consultará legislação oficial, explicará questões com fontes e sinalizará incertezas. Por enquanto, você pode consultar as explicações fundamentadas do banco demonstrativo.</p><button class="btn alt" style="margin-top:14px" onclick="go('Questões')">Acessar questões comentadas</button></div>`}layout(b)}routeFromHash();
</script></body></html>
