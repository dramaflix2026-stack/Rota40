arte contrária.","Aguardar a sentença final obrigatoriamente.","Dar prévio e inequívoco conhecimento ao cliente.","Manter a alteração em segredo perante o cliente."],"ok":2,"e":"O art. 26, § 1º, exige conhecimento prévio e inequívoco do cliente no substabelecimento sem reserva.","src":"Código de Ética, art. 26, § 1º","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1088,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Uma associação sem fins econômicos atende pessoas vulneráveis e solicita assistência jurídica voluntária. Qual condição distingue a advocacia pro bono de captação comercial?","a":["Promessa de contratação remunerada obrigatória posterior.","Divulgação de descontos condicionados à contratação imediata.","Obrigação de cobrar honorários de sucumbência diretamente do assistido em todos os casos.","Prestação gratuita, eventual e voluntária nos termos éticos, sem emprego como instrumento de captação."],"ok":3,"e":"O art. 30 do Código de Ética disciplina a advocacia pro bono e veda sua utilização como instrumento de captação de clientela.","src":"Código de Ética, art. 30","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1089,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Uma advogada presta serviços jurídicos e também administra imobiliária. Deseja anunciar conjuntamente ambas as atividades em uma mesma peça publicitária. Qual é a orientação geral?","a":["É permitida toda divulgação conjunta se o CNPJ for o mesmo.","É vedada a divulgação da advocacia em conjunto com outra atividade.","É permitida se o anúncio não informar valores.","A vedação existe apenas quando a outra atividade é pública."],"ok":1,"e":"O art. 1º, § 3º, do Estatuto veda divulgação da advocacia juntamente com outra atividade.","src":"Estatuto, art. 1º, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1090,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Um escritório deseja divulgar artigo jurídico com seu nome e número de inscrição, de modo sóbrio. Qual é o caráter exigido para a publicidade profissional?","a":["Necessariamente promocional, com comparação de preços.","Focado em garantias de vitória judicial.","Meramente informativo, discreto e sóbrio, sem captação indevida ou mercantilização.","Exclusivamente restrito a cartões impressos entregues a clientes antigos."],"ok":2,"e":"O art. 39 do Código de Ética exige caráter informativo e veda publicidade voltada à captação ou mercantilização.","src":"Código de Ética, art. 39","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1091,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Um advogado recebe informação sigilosa ao exercer função institucional na OAB, e não no patrocínio de cliente. Pretende divulgá-la livremente por essa razão. O dever de sigilo incide?","a":["Não, pois só protege contratos privados.","Não, desde que não exista procuração.","Somente se a informação tiver sido enviada em papel.","Sim. Abrange fatos conhecidos em virtude de funções desempenhadas na OAB."],"ok":3,"e":"O art. 35, parágrafo único, do Código de Ética estende o sigilo aos fatos conhecidos no exercício de funções na OAB.","src":"Código de Ética, art. 35, parágrafo único","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1092,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Uma advogada participa de entrevista jornalística sobre tema jurídico de interesse geral. O apresentador pede que ela use o espaço para promover seu escritório de forma ostensiva. Qual conduta é adequada?","a":["Manter finalidade ilustrativa, educacional ou instrutiva, evitando promoção pessoal e captação.","Apresentar oferta de serviços vinculada à audiência.","Garantir a solução de casos concretos de todos os telespectadores.","Divulgar informações sigilosas de clientes para demonstrar experiência."],"ok":0,"e":"O art. 43 do Código de Ética disciplina manifestações em meios de comunicação, exigindo finalidade informativa sem promoção pessoal indevida.","src":"Código de Ética, art. 43","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1093,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Sem justo motivo, um advogado abandona processo enquanto ainda possui mandato vigente, deixando transcorrer prazo essencial. Qual é o enquadramento disciplinar pertinente?","a":["Exclusão automática, sem processo disciplinar.","Conduta permitida porque o advogado tem independência técnica.","Infração por abandono de causa sem justo motivo, sujeita ao regime de censura.","Infração exclusivamente tributária."],"ok":2,"e":"O art. 34, XI, tipifica abandono injustificado da causa, e o art. 36, I, estabelece a censura para essa hipótese, observada a individualização.","src":"Estatuto, arts. 34, XI, e 36, I","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1094,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Um advogado acumula três aplicações da sanção disciplinar de suspensão. O Conselho examina nova consequência prevista no Estatuto. Qual hipótese legal é pertinente?","a":["A terceira suspensão extingue automaticamente a anuidade.","A exclusão é vedada para quem já foi suspenso.","A terceira suspensão deve ser convertida em advertência reservada.","A aplicação de suspensão por três vezes é hipótese de exclusão, observado o procedimento e quórum legais."],"ok":3,"e":"O art. 38, I, prevê exclusão na hipótese de aplicação, por três vezes, de suspensão. A exclusão exige o quórum próprio.","src":"Estatuto, art. 38, I","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1095,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Em julgamento disciplinar são reconhecidas circunstâncias agravantes na prática de infração punível com censura. Como pode ser aplicada a multa?","a":["Cumulativamente com a censura, se houver circunstâncias agravantes, nos limites legais.","Obrigatoriamente em substituição a toda censura.","Somente em conjunto com a exclusão.","Apenas para compensar danos materiais do cliente."],"ok":0,"e":"O art. 39 prevê multa cumulada com censura ou suspensão quando presentes circunstâncias agravantes.","src":"Estatuto, art. 39","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1096,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Um advogado cumpriu integralmente sanção disciplinar não decorrente de crime e deseja requerer reabilitação. Qual condição temporal geral é prevista?","a":["Imediatamente após a comunicação da sanção, sem requisito adicional.","Um ano após o cumprimento, mediante provas efetivas de bom comportamento.","Cinco anos a partir da inscrição profissional, qualquer que seja a data da sanção.","Dez anos após a decisão, obrigatoriamente."],"ok":1,"e":"O art. 41 permite requerer reabilitação um ano após o cumprimento da sanção, mediante prova de bom comportamento. Quando a sanção resulta de crime, há condição adicional.","src":"Estatuto, art. 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1097,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Em deliberação da OAB, um conselheiro federal afirma que cada delegação estadual possui quantidade de votos proporcional ao número de advogados inscritos. Qual é a regra geral?","a":["Cada advogado inscrito vota diretamente em todas as deliberações do Conselho Federal.","As delegações mais numerosas possuem dez votos.","O presidente da Seccional vota em nome de todas as demais.","Cada delegação possui um voto, observadas as exceções estatutárias."],"ok":3,"e":"O art. 53, § 2º, disciplina o voto por delegação, com as ressalvas legais.","src":"Estatuto, art. 53, § 2º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1098,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Uma Subseção passa a atuar como se fosse pessoa jurídica independente do Conselho Seccional. Qual é sua natureza estatutária?","a":["É parte autônoma do Conselho Seccional, nos termos dos atos de constituição e do regulamento.","É autarquia federal vinculada ao Ministério da Justiça.","É sociedade privada de seus membros.","É órgão do Poder Judiciário com competência disciplinar criminal."],"ok":0,"e":"O art. 45, § 3º, caracteriza as Subseções como partes autônomas do Conselho Seccional.","src":"Estatuto, art. 45, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1099,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Um candidato solicita ao órgão eleitoral da OAB informação sobre a duração do mandato dos membros eleitos dos órgãos da Ordem. Qual é a duração geral?","a":["Um ano.","Três anos.","Quatro anos.","Cinco anos."],"ok":1,"e":"O art. 65 prevê mandato de três anos para os membros dos órgãos da OAB, com datas de início próprias.","src":"Estatuto, art. 65","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1100,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Um advogado é representado disciplinarmente por pessoa identificada e deseja acompanhar a instrução e produzir defesa. O sigilo processual elimina essas garantias?","a":["Sim. O sigilo impede acesso inclusive pelo representado.","Sim, até eventual condenação definitiva.","Não. O representado tem direito de defesa, acompanhamento e produção das provas cabíveis, observadas as regras do processo.","Não, mas apenas se a representação tiver sido feita por juiz."],"ok":2,"e":"O art. 73, § 1º, assegura ao representado amplo direito de defesa. O sigilo não afasta essas garantias.","src":"Estatuto, art. 73, § 1º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"}];const constitutionalModules=[{"t":"Teoria constitucional e poder constituinte","ref":"CF, arts. 1º a 4º e 60","lessons":[["Fundamentos e objetivos","Os fundamentos definem bases da ordem constitucional; os objetivos indicam fins a perseguir. Cidadania, dignidade e pluralismo pertencem ao primeiro grupo. Reduzir desigualdades é objetivo. Identifique a categoria antes de responder; não confunda princípios das relações internacionais com objetivos internos."],["Poder constituinte","O poder originário institui uma nova ordem; o derivado atua dentro da Constituição, sujeito a limites. A reforma constitucional exige procedimento agravado. A proposta deve ser aprovada em dois turnos em cada Casa do Congresso, por três quintos dos respectivos membros."],["Limites à reforma","O núcleo protegido pelo art. 60, § 4º, impede propostas tendentes a abolir federação, voto direto, secreto, universal e periódico, separação de poderes e direitos e garantias individuais. Não se pode emendar a Constituição durante intervenção federal, estado de defesa ou estado de sítio."]],"map":["Fundamentos ≠ objetivos","Reforma → 2 turnos por Casa","Aprovação → 3/5 dos membros","Cláusulas pétreas → proteção contra abolição"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direitos e garantias fundamentais","ref":"CF, art. 5º","lessons":[["Liberdades e igualdade","A igualdade constitucional veda discriminações arbitrárias e permite distinções justificadas. A liberdade de manifestação não torna lícitas todas as condutas; responsabilização ulterior e tutela de outros direitos podem ocorrer. A proibição de anonimato não impede por si só mecanismos lícitos de proteção de identidade."],["Casa e comunicações","A proteção do domicílio abrange espaços privados nos limites jurídicos aplicáveis. Sem consentimento, entrada é admitida em flagrante, desastre, socorro ou, durante o dia, por ordem judicial. Diferencie essas hipóteses da interceptação de comunicações telefônicas, que tem requisitos próprios."],["Garantias processuais","Devido processo, contraditório, ampla defesa e presunção de inocência limitam o poder estatal. Provas ilícitas são inadmissíveis. Em questões, diferencie prisão cautelar justificada de antecipação indevida de pena e considere as particularidades da jurisprudência aplicável."]],"map":["Igualdade → justificativa de distinções","Domicílio → exceções delimitadas","Defesa → contraditório","Prova ilícita → inadmissibilidade"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Remédios constitucionais","ref":"CF, art. 5º, LXVIII a LXXIII","lessons":[["Habeas corpus e habeas data","Habeas corpus tutela a liberdade de locomoção diante de ilegalidade ou abuso. Habeas data permite acessar ou retificar dados pessoais em registros governamentais ou de caráter público, observados os requisitos legais. Não é instrumento genérico de acesso a dados de terceiros."],["Mandado de segurança e injunção","Mandado de segurança protege direito líquido e certo não amparado por habeas corpus ou habeas data, contra ilegalidade ou abuso de autoridade. A prova deve ser pré-constituída. Mandado de injunção enfrenta omissão normativa que inviabiliza o exercício de direitos e prerrogativas constitucionais pertinentes."],["Ação popular","A cidadania legitima a ação popular para invalidar ato lesivo ao patrimônio público, moralidade administrativa, meio ambiente ou patrimônio histórico e cultural. A isenção de custas e sucumbência ressalva má-fé comprovada. Distinga o cidadão dos legitimados de outras ações coletivas."]],"map":["HC → locomoção","HD → dados pessoais","MS → direito líquido e certo","MI → omissão normativa"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Nacionalidade e direitos políticos","ref":"CF, arts. 12 a 17","lessons":[["Nacionalidade","Diferencie brasileiros natos e naturalizados pelas hipóteses constitucionais. Certos cargos são reservados a natos, como Presidente da República e Ministro do STF. Não confunda nacionalidade com cidadania eleitoral. A perda de nacionalidade deve ser estudada conforme a redação constitucional atual, inclusive EC 131/2023."],["Alistamento e voto","O voto é obrigatório para alfabetizados maiores de dezoito anos, ressalvado o regime facultativo para maiores de setenta; também é facultativo para analfabetos e pessoas de dezesseis a dezoito anos. Estrangeiros e conscritos durante o serviço militar obrigatório não podem se alistar."],["Elegibilidade","Nacionalidade, direitos políticos, alistamento, domicílio eleitoral, filiação e idade mínima compõem os requisitos constitucionais. Analfabetos podem votar, mas são inelegíveis. Reeleição e inelegibilidades seguem regras específicas; identifique o cargo e a situação familiar ou funcional."]],"map":["Nacionalidade ≠ elegibilidade","Voto facultativo → hipóteses do art. 14","Analfabeto → inelegível","STF → cargo privativo de nato"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Federação e repartição de competências","ref":"CF, arts. 18 a 36","lessons":[["Entes federativos","União, Estados, Distrito Federal e Municípios possuem autonomia nos termos constitucionais. A soberania pertence à República Federativa do Brasil. O Distrito Federal acumula competências legislativas estaduais e municipais e não se divide em municípios."],["Competências legislativas","A União tem competências privativas enumeradas no art. 22; lei complementar pode autorizar Estados a legislar sobre questões específicas dessas matérias. Em competência concorrente, a União estabelece normas gerais, e os Estados suplementam. Na falta de norma geral federal, podem exercer competência plena nas condições constitucionais."],["Competências comuns e locais","Competência administrativa comum não equivale a competência legislativa concorrente. Municípios legislam sobre interesse local e suplementam legislação federal e estadual quando couber. A intervenção é excepcional e exige hipótese constitucional específica."]],"map":["Federação → autonomia","Art. 22 → competência privativa","Art. 24 → concorrente","Art. 30 → interesse local"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Administração pública constitucional","ref":"CF, arts. 37 a 41","lessons":[["Princípios administrativos","Legalidade, impessoalidade, moralidade, publicidade e eficiência orientam a administração direta e indireta. Publicidade não elimina proteção legal de informações sigilosas. Impessoalidade impede promoção pessoal em publicidade institucional."],["Ingresso e estabilidade","A investidura em cargo ou emprego público depende, em regra, de concurso; cargos em comissão legalmente definidos admitem livre nomeação e exoneração. Estabilidade é instituto distinto da aprovação: aplica-se aos servidores nomeados para cargo efetivo por concurso após três anos de efetivo exercício, com avaliação especial de desempenho."],["Responsabilidade estatal","Pessoas jurídicas de direito público e prestadoras de serviço público de direito privado respondem por danos causados por seus agentes nessa qualidade, conforme art. 37, § 6º. A ação regressiva exige dolo ou culpa. Identifique nexo causal e circunstâncias concretas; não trate toda omissão como caso idêntico."]],"map":["LIMPE → princípios","Concurso → regra","Estabilidade → requisitos do art. 41","Regresso → dolo ou culpa"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Poder Legislativo e processo legislativo","ref":"CF, arts. 44 a 69","lessons":[["Estrutura e funções","Congresso Nacional reúne Câmara e Senado; a Câmara representa o povo, e o Senado representa Estados e Distrito Federal. Fiscalização e produção legislativa são funções centrais. CPIs têm poderes de investigação próprios de autoridades judiciais, mas não todos os poderes de um juiz."],["Espécies normativas","Lei ordinária e complementar possuem regimes de aprovação distintos; a lei complementar exige maioria absoluta. Emendas não passam por sanção presidencial. Iniciativa reservada, deliberação, sanção ou veto e promulgação dependem da espécie normativa."],["Medidas provisórias","São editadas pelo Presidente em situações de relevância e urgência, com força de lei e submissão ao Congresso. O prazo geral é de sessenta dias, prorrogável uma vez por igual período, observadas regras constitucionais. Há matérias vedadas, como direito penal e processual penal."]],"map":["Câmara → povo","Senado → Estados e DF","LC → maioria absoluta","MP → urgência e relevância"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Executivo e responsabilidade constitucional","ref":"CF, arts. 76 a 91","lessons":[["Presidencialismo","O Presidente acumula funções de chefia de Estado e de governo. Ministros auxiliam o Executivo. Competências privativas estão no art. 84; apenas hipóteses constitucionalmente indicadas podem ser delegadas nos limites ali previstos."],["Substituição e sucessão","O Vice substitui o Presidente nos impedimentos e o sucede em caso de vaga. Na ausência de ambos, o exercício segue a ordem constitucional: presidências da Câmara, Senado e STF. A dupla vacância tem regimes de eleição distintos conforme o momento do mandato."],["Responsabilização","Crimes de responsabilidade não se confundem com infrações penais comuns. A Câmara tem competência de autorização nos termos constitucionais; o julgamento depende da natureza da infração. Não confunda aprovação política inicial com condenação final."]],"map":["Presidente → chefia de Estado e governo","Vice → substituição e sucessão","Dupla vacância → art. 81","Responsabilização → distinguir natureza"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Judiciário e funções essenciais à justiça","ref":"CF, arts. 92 a 135","lessons":[["Organização judicial","Identifique órgãos do Judiciário e respectivas competências. O STF guarda a Constituição; o STJ tem competência relevante na uniformização do direito federal infraconstitucional. A competência de cada recurso depende dos requisitos constitucionais e legais, não apenas do nome da questão."],["Garantias e controle","Vitaliciedade, inamovibilidade e irredutibilidade de subsídio possuem regimes constitucionais específicos. O CNJ integra o Judiciário e controla aspectos administrativos, financeiros e disciplinares nos limites constitucionais. Não funciona como instância recursal genérica de decisões jurisdicionais."],["Funções essenciais","Ministério Público, advocacia pública, advocacia e Defensoria Pública possuem regimes distintos. O MP defende ordem jurídica, regime democrático e interesses sociais e individuais indisponíveis. A Defensoria presta orientação e defesa jurídica aos necessitados conforme a Constituição."]],"map":["STF → Constituição","STJ → direito federal infraconstitucional","CNJ → controle administrativo","Defensoria → acesso à justiça"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Controle de constitucionalidade","ref":"CF, arts. 97, 102 e 103; SV 10","lessons":[["Difuso e concentrado","No controle difuso, a constitucionalidade pode surgir como questão incidental em litígio concreto. No concentrado, ações próprias discutem a validade constitucional conforme objeto e legitimidade definidos. Não presuma que todos os efeitos são idênticos: observe o tipo de ação e o pronunciamento."],["Ações constitucionais","ADI e ADC no STF têm objetos específicos definidos pelo art. 102. A ADC federal trata de lei ou ato normativo federal; a ADI federal pode ter objeto federal ou estadual. A ADPF e a ADO possuem finalidades e requisitos próprios. O art. 103 enumera legitimados para ADI e ADC."],["Reserva de plenário","Nos tribunais, a declaração de inconstitucionalidade exige maioria absoluta dos membros ou do órgão especial. A SV 10 alcança afastamento de norma por órgão fracionário com fundamento constitucional, mesmo sem declaração expressa, observadas exceções legais e jurisprudenciais. Não se aplica essa exigência colegiada indistintamente ao juiz singular."]],"map":["Difuso → caso concreto","ADI → ato federal ou estadual","ADC → ato federal","Reserva de plenário → maioria absoluta"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const constitutionalQuestions=[{"id":2001,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Uma PEC foi aprovada por três quintos em dois turnos na Câmara e por maioria simples em dois turnos no Senado. Pode ser promulgada?","a":["Sim, pois a Câmara atingiu o quórum","Não, o Senado também precisa de três quintos em cada turno","Sim, com sanção presidencial","Sim, se houver consulta popular"],"ok":1,"e":"O art. 60, § 2º, exige três quintos dos membros de cada Casa em ambos os turnos.","src":"CF, arts. 1º a 4º e 60","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2002,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Durante intervenção federal, o Congresso pretende aprovar uma emenda constitucional. Qual o obstáculo?","a":["Apenas a ausência de sanção presidencial","Necessidade de autorização do STF","A Constituição não pode ser emendada durante a intervenção","Nenhum, se a votação for unânime"],"ok":2,"e":"O art. 60, § 1º, prevê limite circunstancial durante intervenção federal, estado de defesa ou de sítio.","src":"CF, arts. 1º a 4º e 60","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2003,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Sem consentimento do morador e fora das hipóteses de flagrante, desastre ou socorro, quando a ordem judicial permite ingresso em casa?","a":["Em qualquer horário","Somente à noite","Apenas em feriado","Durante o dia"],"ok":3,"e":"O art. 5º, XI, limita o ingresso baseado em determinação judicial ao período diurno.","src":"CF, art. 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2004,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Um servidor responde a processo administrativo sancionador sem oportunidade de apresentar defesa. Qual garantia está diretamente afetada?","a":["Contraditório e ampla defesa","Livre iniciativa","Anterioridade tributária","Imunidade parlamentar"],"ok":0,"e":"O art. 5º, LV, estende contraditório e ampla defesa aos litigantes em processos judiciais e administrativos e aos acusados.","src":"CF, art. 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2005,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Uma pessoa sofre ameaça ilegal de prisão. Qual remédio é diretamente vocacionado à proteção da locomoção?","a":["Habeas data","Mandado de injunção","Habeas corpus","Ação popular"],"ok":2,"e":"A finalidade constitucional do habeas corpus consta do art. 5º, LXVIII.","src":"CF, art. 5º, LXVIII a LXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2006,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"A ausência de norma regulamentadora impede o exercício de uma prerrogativa constitucional ligada à cidadania. Qual instrumento é especialmente previsto?","a":["Mandado de injunção","Habeas corpus","Ação de cobrança","Habeas data"],"ok":0,"e":"O art. 5º, LXXI, prevê mandado de injunção diante da omissão regulamentadora impeditiva.","src":"CF, art. 5º, LXVIII a LXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2007,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Uma cidadã brasileira naturalizada pretende ocupar o cargo de Ministra do STF. É constitucionalmente possível?","a":["Sim, após dez anos de naturalização","Não, é cargo privativo de brasileiro nato","Sim, se indicada pelo Senado","Sim, desde que tenha outro cargo público"],"ok":1,"e":"O art. 12, § 3º, IV, reserva o cargo de Ministro do STF a brasileiros natos.","src":"CF, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2008,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Um cidadão analfabeto regularmente alistado pretende concorrer a vereador. Qual regra se aplica?","a":["Pode concorrer, pois pode votar","Não pode votar nem concorrer","Pode concorrer com autorização judicial","Pode votar facultativamente, mas é inelegível"],"ok":3,"e":"O art. 14, §§ 1º e 4º, distingue voto facultativo e inelegibilidade dos analfabetos.","src":"CF, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2009,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Um Município quer legislar sobre assunto predominantemente de interesse local. Qual fundamento constitucional?","a":["Art. 30, I","Art. 22, I","Art. 60, § 4º","Art. 102, I"],"ok":0,"e":"O art. 30, I, atribui aos Municípios competência para legislar sobre interesse local.","src":"CF, arts. 18 a 36","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2010,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Em matéria concorrente, sobrevém norma geral federal incompatível com disposição estadual anterior. Qual efeito constitucional?","a":["Revoga integralmente toda a lei estadual","Anula automaticamente a Constituição estadual","Suspende a eficácia da lei estadual no que lhe for contrário","Não produz qualquer efeito"],"ok":2,"e":"O art. 24, § 4º, estabelece suspensão da eficácia da norma estadual incompatível com a norma geral federal superveniente.","src":"CF, arts. 18 a 36","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2011,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Publicidade institucional destaca nome e imagem de autoridade para promoção pessoal. Qual princípio é diretamente comprometido?","a":["Soberania","Impessoalidade","Livre concorrência","Anterioridade"],"ok":1,"e":"O art. 37, § 1º, veda promoção pessoal em publicidade de órgãos públicos.","src":"CF, arts. 37 a 41","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2012,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Após indenizar terceiro por dano provocado por agente público, em que condição constitucional cabe regresso contra o agente?","a":["Sempre, sem examinar conduta","Somente por decisão criminal","Somente se o terceiro concordar","Nos casos de dolo ou culpa"],"ok":3,"e":"O art. 37, § 6º, assegura direito de regresso em caso de dolo ou culpa.","src":"CF, arts. 37 a 41","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2013,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"Qual quórum a Constituição exige para aprovação de lei complementar?","a":["Maioria absoluta","Três quintos em dois turnos","Dois terços","Unanimidade"],"ok":0,"e":"O art. 69 exige maioria absoluta para lei complementar.","src":"CF, arts. 44 a 69","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2014,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"O Presidente pretende disciplinar crimes e penas por medida provisória. É admissível?","a":["Sim, se houver urgência","Sim, com autorização judicial","Não, a matéria penal é vedada a medidas provisórias","Sim, se durar menos de sessenta dias"],"ok":2,"e":"O art. 62, § 1º, I, b, proíbe medida provisória sobre direito penal, processual penal e processual civil.","src":"CF, arts. 44 a 69","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2015,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"O Presidente sofre impedimento temporário e o Vice está disponível. Quem o substitui?","a":["Presidente do STF","Vice-Presidente","Presidente do Senado","Ministro da Justiça"],"ok":1,"e":"O art. 79 prevê substituição pelo Vice nos impedimentos e sucessão em caso de vaga.","src":"CF, arts. 76 a 91","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2016,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"Em caso de dupla vacância dos cargos de Presidente e Vice nos primeiros dois anos do mandato, qual regra geral constitucional?","a":["Nomeação definitiva pelo STF","Eleição indireta em trinta dias pelo Congresso","Manutenção automática do Presidente da Câmara até o fim","Eleição em noventa dias após aberta a última vaga"],"ok":3,"e":"O art. 81 prevê eleição em noventa dias; nos últimos dois anos, aplica-se o regime de eleição pelo Congresso em trinta dias.","src":"CF, arts. 76 a 91","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2017,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Uma parte pretende usar o CNJ como instância recursal comum para reformar sentença judicial de mérito. É essa a sua função?","a":["Sim, em qualquer processo","Sim, se a decisão for estadual","Não, seu controle tem natureza administrativa, financeira e disciplinar nos limites constitucionais","Sim, quando não houver advogado"],"ok":2,"e":"O art. 103-B, § 4º, delimita a competência do CNJ; não o torna instância jurisdicional recursal comum.","src":"CF, arts. 92 a 135","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2018,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Qual órgão é especialmente incumbido da guarda da Constituição pelo art. 102?","a":["Supremo Tribunal Federal","Superior Tribunal de Justiça","Tribunal Superior Eleitoral","Conselho Nacional de Justiça"],"ok":0,"e":"O art. 102 atribui precipuamente ao STF a guarda da Constituição.","src":"CF, arts. 92 a 135","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2019,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Uma lei estadual é objeto de ADC ajuizada diretamente no STF. Qual problema há quanto ao objeto?","a":["ADC só pode tratar de lei municipal","ADC exige lei ou ato normativo federal","ADC só admite emenda constitucional","ADC não existe na ordem constitucional"],"ok":1,"e":"O art. 102, I, a, restringe a ADC no STF a lei ou ato normativo federal.","src":"CF, arts. 97, 102 e 103; SV 10","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2020,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Um órgão fracionário de tribunal pretende declarar lei inconstitucional sem precedente aplicável nem submissão ao plenário ou órgão especial. Qual regra deve observar?","a":["Apenas unanimidade dos integrantes da turma","Autorização da parte autora","Sanção do Presidente da República","Reserva de plenário do art. 97"],"ok":3,"e":"O art. 97 exige maioria absoluta dos membros do tribunal ou órgão especial; a SV 10 impede contornar a regra pelo afastamento de norma por fundamento de inconstitucionalidade.","src":"CF, arts. 97, 102 e 103; SV 10","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2021,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Uma PEC pretende abolir o voto direto, secreto, universal e periódico, substituindo-o definitivamente por escolha dos governantes por um colegiado vitalício. Qual é o limite aplicável?","a":["A proposta não pode ser objeto de deliberação por tender a abolir cláusula pétrea.","Pode ser aprovada por unanimidade das Casas.","É permitida mediante sanção presidencial.","É admissível se aprovada por lei complementar."],"ok":0,"e":"O art. 60, § 4º, II, protege o voto direto, secreto, universal e periódico contra propostas tendentes à sua abolição.","src":"CF, art. 60, § 4º, II","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2022,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"O Presidente da República deseja apresentar PEC e um parlamentar afirma que a iniciativa é exclusiva das Casas Legislativas. Qual interpretação é correta?","a":["A iniciativa é exclusiva de um terço do Senado.","O Presidente também possui iniciativa para propor emenda à Constituição.","A iniciativa é exclusiva do STF.","A iniciativa presidencial depende de plebiscito prévio."],"ok":1,"e":"O art. 60, II, prevê expressamente a iniciativa presidencial, ao lado das demais hipóteses constitucionais.","src":"CF, art. 60, II","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2023,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Uma PEC foi rejeitada em março. Em setembro da mesma sessão legislativa, seus autores reapresentam proposta sobre a mesma matéria. Qual solução?","a":["Pode ser reapresentada se houver maioria absoluta.","Pode ser reapresentada por iniciativa presidencial.","A matéria não pode ser objeto de nova proposta na mesma sessão legislativa.","Pode ser reapresentada após noventa dias."],"ok":2,"e":"O art. 60, § 5º, proíbe nova proposta sobre matéria de PEC rejeitada ou havida por prejudicada na mesma sessão legislativa.","src":"CF, art. 60, § 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2024,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Uma lei anterior à Constituição de 1988 possui conteúdo material incompatível com a nova ordem constitucional. Qual instituto descreve, em regra, seu destino?","a":["Inconstitucionalidade formal superveniente por falta de iniciativa parlamentar.","Convalidação automática pela anterioridade.","Revogação necessária apenas por nova lei expressa.","Não recepção pela nova Constituição."],"ok":3,"e":"A recepção depende da compatibilidade material com a nova Constituição. A incompatibilidade de norma pré-constitucional é tratada como não recepção.","src":"CF, supremacia constitucional; teoria da recepção","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2025,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Um jornalista publica crítica a autoridade pública e é submetido a censura prévia por órgão administrativo apenas pelo teor crítico. Qual garantia constitucional é pertinente?","a":["Direito absoluto de publicar sem qualquer responsabilidade posterior.","Liberdade de expressão e de comunicação, vedada a censura, sem afastar responsabilidades posteriores cabíveis.","Poder administrativo de censurar previamente toda crítica.","Liberdade de expressão condicionada à filiação partidária."],"ok":1,"e":"Os arts. 5º, IX, e 220 protegem a manifestação e a comunicação contra censura prévia, sem excluir responsabilização constitucionalmente legítima.","src":"CF, arts. 5º, IX, e 220","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2026,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Moradores organizam reunião pacífica, sem armas, em praça pública e avisam previamente a autoridade competente, sem frustrar reunião anteriormente convocada. O Município exige autorização discricionária. Qual regra?","a":["Toda reunião pública exige licença discricionária.","O prévio aviso só permite reunião em imóvel privado.","A reunião independe de autorização, observadas as condições constitucionais.","A reunião depende de aprovação judicial."],"ok":2,"e":"O art. 5º, XVI, assegura reunião pacífica e sem armas em locais abertos ao público, independentemente de autorização, mediante prévio aviso e respeito à reunião anterior.","src":"CF, art. 5º, XVI","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2027,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Uma associação regularmente constituída é dissolvida compulsoriamente por ato unilateral de secretário municipal. Qual exigência foi desrespeitada?","a":["A dissolução exige apenas parecer administrativo.","A dissolução compete exclusivamente à assembleia legislativa.","A dissolução depende de simples notificação aos associados.","A dissolução compulsória exige decisão judicial transitada em julgado."],"ok":3,"e":"O art. 5º, XIX, exige decisão judicial para dissolução compulsória ou suspensão das atividades, com trânsito em julgado para a dissolução.","src":"CF, art. 5º, XIX","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2028,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Uma lei penal posterior ao fato reduz a pena do delito pelo qual uma pessoa já foi condenada. Qual garantia temporal se aplica?","a":["A lei penal mais benéfica retroage.","Toda lei penal é necessariamente irretroativa.","A redução só se aplica a crimes futuros.","A retroatividade depende de autorização do Ministério Público."],"ok":0,"e":"O art. 5º, XL, estabelece que a lei penal não retroagirá, salvo para beneficiar o réu.","src":"CF, art. 5º, XL","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2029,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Uma pessoa solicita acesso aos próprios dados em cadastro governamental e recebe negativa administrativa. Deseja conhecer as informações registradas sobre si. Qual remédio específico?","a":["Habeas corpus.","Ação popular.","Habeas data.","Mandado de injunção."],"ok":2,"e":"O habeas data assegura conhecimento de informações pessoais em registros governamentais ou de caráter público. A Lei 9.507 disciplina a demonstração da recusa ou omissão pertinente.","src":"CF, art. 5º, LXXII; Lei 9.507/1997","url":"https://www.planalto.gov.br/ccivil_03/leis/l9507.htm"},{"id":2030,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Uma cidadã em pleno gozo de direitos políticos pretende anular ato administrativo lesivo ao patrimônio histórico e cultural. Qual instrumento constitucional é apropriado?","a":["Habeas data.","Mandado de injunção.","Ação declaratória de constitucionalidade.","Ação popular."],"ok":3,"e":"O art. 5º, LXXIII, legitima qualquer cidadão a propor ação popular para anular ato lesivo aos bens jurídicos nele enumerados, incluindo patrimônio histórico e cultural.","src":"CF, art. 5º, LXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2031,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Um partido com representação no Congresso Nacional quer defender direito líquido e certo coletivo contra ato ilegal de autoridade, não protegido por habeas corpus ou habeas data. Qual instrumento pode utilizar?","a":["Mandado de segurança coletivo.","Ação popular em nome próprio como pessoa jurídica.","Habeas corpus coletivo para direito patrimonial.","Mandado de injunção sem omissão normativa."],"ok":0,"e":"O art. 5º, LXX, a, atribui legitimidade ao partido político com representação no Congresso para impetrar mandado de segurança coletivo, observados os requisitos legais.","src":"CF, art. 5º, LXIX e LXX; Lei 12.016/2009","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/lei/l12016.htm"},{"id":2032,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Uma empresa possui prova documental pré-constituída de direito líquido e certo violado por autoridade pública. Não há questão de locomoção ou acesso a dados pessoais. Qual remédio individual é em tese adequado?","a":["Habeas corpus.","Mandado de segurança.","Habeas data.","Mandado de injunção, independentemente de omissão."],"ok":1,"e":"O art. 5º, LXIX, protege direito líquido e certo não amparado por habeas corpus ou habeas data contra ilegalidade ou abuso de poder. A via exige prova pré-constituída e demais condições.","src":"CF, art. 5º, LXIX; Lei 12.016/2009","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/lei/l12016.htm"},{"id":2033,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Uma criança nasce no Brasil de pais estrangeiros que estão ambos a serviço de seu país de origem. Qual regra de nacionalidade originária territorial se aplica?","a":["É brasileira nata em qualquer circunstância.","É brasileira naturalizada desde o nascimento.","É brasileira nata se os pais permanecerem seis meses no Brasil.","Não é brasileira nata pelo simples nascimento no território brasileiro nessa hipótese."],"ok":3,"e":"O art. 12, I, a, ressalva o nascimento de filhos de estrangeiros quando estes estão a serviço de seu país.","src":"CF, art. 12, I, a","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2034,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Um brasileiro adquire voluntariamente outra nacionalidade após a EC 131/2023. Sem pedido de perda ou outro fundamento constitucional, qual consequência?","a":["A aquisição de outra nacionalidade não provoca automaticamente perda da brasileira.","A perda brasileira ocorre imediatamente.","A nacionalidade brasileira fica suspensa por cinco anos.","A perda depende apenas de ato consular estrangeiro."],"ok":0,"e":"A EC 131/2023 retirou a aquisição de outra nacionalidade como hipótese autônoma de perda da nacionalidade brasileira.","src":"CF, art. 12, § 4º; EC 131/2023","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2035,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Um cidadão de 19 anos, preenchidos os demais requisitos, pretende concorrer a deputado estadual. Qual condição constitucional falta?","a":["Idade mínima de 30 anos.","Idade mínima de 21 anos.","Nacionalidade brasileira nata.","Idade mínima de 35 anos."],"ok":1,"e":"O art. 14, § 3º, VI, c, estabelece 21 anos para deputado federal, estadual ou distrital, prefeito, vice-prefeito e juiz de paz.","src":"CF, art. 14, § 3º, VI, c","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2036,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Um cidadão sofre condenação criminal transitada em julgado, cujos efeitos ainda persistem. Qual consequência constitucional sobre direitos políticos?","a":["Cassação definitiva e irreversível dos direitos políticos.","Perda automática da nacionalidade.","Suspensão enquanto durarem os efeitos da condenação.","Nenhuma consequência em qualquer hipótese."],"ok":2,"e":"O art. 15, III, prevê suspensão dos direitos políticos durante os efeitos da condenação criminal transitada em julgado.","src":"CF, art. 15, III","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2037,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Uma assembleia legislativa estadual pretende instituir novo tipo penal geral sem autorização por lei complementar federal. Qual a questão de competência?","a":["Legislar sobre Direito Penal é competência privativa da União, ressalvada autorização complementar para questões específicas.","Direito Penal é competência comum administrativa.","Cada Estado possui competência legislativa penal irrestrita.","A competência pertence exclusivamente ao Município."],"ok":0,"e":"O art. 22, I, atribui à União competência privativa sobre Direito Penal; o parágrafo único admite autorização por lei complementar sobre questões específicas.","src":"CF, art. 22, I e parágrafo único","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2038,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Em matéria de competência concorrente, inexistem normas gerais federais. O Estado precisa disciplinar suas peculiaridades. Qual possibilidade constitucional?","a":["Ficar impedido de legislar até autorização do STF.","Exercer competência legislativa plena para atender às suas peculiaridades.","Legislar somente mediante decreto presidencial.","Exercer competência apenas para revogar leis municipais."],"ok":1,"e":"O art. 24, § 3º, permite competência legislativa plena estadual na ausência de lei federal sobre normas gerais, para atender às peculiaridades do Estado.","src":"CF, art. 24, § 3º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2039,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"União, Estado e Município discutem quem deve atuar administrativamente para proteger o meio ambiente. Qual é a natureza constitucional dessa atribuição?","a":["Competência exclusiva da União.","Competência exclusiva dos Estados.","Competência comum dos entes federativos, observada a cooperação legal.","Competência exclusivamente municipal."],"ok":2,"e":"O art. 23, VI e VII, prevê competência material comum de proteção ambiental, sem confundir atribuições administrativas com competência legislativa.","src":"CF, art. 23, VI e VII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2040,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"O Distrito Federal pretende dividir seu território em Municípios autônomos por lei distrital. Qual solução constitucional?","a":["É possível mediante simples lei distrital.","É possível por decreto do governador.","É obrigatória sempre que houver mais de um milhão de habitantes.","É vedada a divisão do Distrito Federal em Municípios."],"ok":3,"e":"O art. 32 veda a divisão do Distrito Federal em Municípios. O DF acumula competências legislativas reservadas aos Estados e Municípios, nos termos constitucionais.","src":"CF, art. 32","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2041,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Um órgão público nomeia pessoa para cargo efetivo permanente sem concurso e sem enquadramento em exceção constitucional. Qual regra foi violada?","a":["A investidura depende apenas de escolha discricionária.","A investidura em cargo ou emprego público depende de concurso, ressalvadas as nomeações para cargos em comissão definidos em lei.","O concurso é facultativo para todos os cargos municipais.","O concurso só é exigido para militares."],"ok":1,"e":"O art. 37, II, exige concurso de provas ou de provas e títulos, ressalvando cargos em comissão declarados em lei de livre nomeação e exoneração.","src":"CF, art. 37, II","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2042,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Uma lei cria numerosos cargos em comissão destinados a rotinas técnicas permanentes, sem direção, chefia ou assessoramento. Qual parâmetro constitucional deve ser observado?","a":["Cargos em comissão podem substituir livremente todos os cargos efetivos.","Funções de confiança destinam-se exclusivamente a tarefas operacionais.","Cargos em comissão e funções de confiança destinam-se apenas a direção, chefia e assessoramento.","O caráter permanente da tarefa dispensa concurso."],"ok":2,"e":"O art. 37, V, delimita as atribuições de cargos em comissão e funções de confiança. Funções de confiança são exercidas exclusivamente por servidores efetivos.","src":"CF, art. 37, V","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2043,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Um servidor pretende acumular dois cargos públicos de professor, com compatibilidade de horários e observância dos limites remuneratórios aplicáveis. Qual regra?","a":["A acumulação é vedada sem qualquer exceção.","A acumulação só é permitida em instituições privadas.","A acumulação exige mandato eletivo.","A acumulação é constitucionalmente admitida nessa hipótese."],"ok":3,"e":"O art. 37, XVI, a, excepciona a vedação de acumulação remunerada para dois cargos de professor, com compatibilidade de horários e respeito ao regime constitucional.","src":"CF, art. 37, XVI, a","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2044,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Um servidor nomeado para cargo efetivo por concurso completa três anos de efetivo exercício e passa por avaliação especial de desempenho. Qual instituto constitucional está em questão?","a":["Estabilidade, observadas as condições constitucionais.","Vitaliciedade automática.","Imunidade penal.","Irremovibilidade absoluta."],"ok":0,"e":"O art. 41 prevê estabilidade após três anos de efetivo exercício para servidores nomeados em cargo efetivo por concurso; a avaliação especial é condição obrigatória.","src":"CF, art. 41 e § 4º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2045,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"Um projeto de lei de iniciativa parlamentar pretende alterar diretamente o regime jurídico dos servidores públicos federais da administração direta. Qual limite deve ser examinado?","a":["A competência exclusiva do TCU para propor qualquer lei.","A iniciativa exclusiva de cidadãos por petição.","A iniciativa privativa do Presidente nas matérias do art. 61, § 1º, II, c.","A impossibilidade de legislar sobre servidores federais."],"ok":2,"e":"O art. 61, § 1º, II, c, reserva ao Presidente a iniciativa de leis sobre servidores públicos da União e Territórios e seu regime jurídico, nos termos do dispositivo.","src":"CF, art. 61, § 1º, II, c","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2046,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"O Presidente veta parcialmente um projeto de lei, retirando apenas palavras isoladas de um inciso. Qual limite constitucional incide?","a":["O veto parcial pode atingir qualquer letra de uma palavra.","O veto parcial só pode abranger todo o projeto.","O veto parcial exige autorização prévia do STF.","O veto parcial deve abranger texto integral de artigo, parágrafo, inciso ou alínea."],"ok":3,"e":"O art. 66, § 2º, exige que veto parcial abranja texto integral de uma das unidades normativas enumeradas.","src":"CF, art. 66, § 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2047,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"Uma CPI da Câmara é requerida por um terço de seus membros, para investigar fato determinado e por prazo certo. Qual consequência quanto à criação?","a":["Estão presentes os requisitos constitucionais de criação, sem depender de conveniência da maioria.","É indispensável autorização do Presidente da República.","A criação depende de unanimidade do plenário.","O requerimento é insuficiente sem condenação judicial anterior."],"ok":0,"e":"O art. 58, § 3º, prevê CPI mediante requerimento de um terço dos membros, para apuração de fato determinado e por prazo certo.","src":"CF, art. 58, § 3º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2048,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"Uma medida provisória perde eficácia por não ser convertida em lei no prazo constitucional, consideradas as prorrogações. Qual regra geral sobre as relações jurídicas dela decorrentes?","a":["Todas as relações são automaticamente inexistentes sem exceção.","O Congresso deve discipliná-las por decreto legislativo; na omissão pelo prazo constitucional, aplica-se a regra de conservação do § 11.","O Presidente decide livremente por portaria privada.","A medida provisória converte-se automaticamente em emenda constitucional."],"ok":1,"e":"O art. 62, §§ 3º e 11, disciplina a perda de eficácia e as relações jurídicas constituídas durante a vigência, inclusive a consequência da ausência de decreto legislativo em sessenta dias.","src":"CF, art. 62, §§ 3º e 11","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2049,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"O Presidente da República pretende ausentar-se do Brasil por vinte dias sem licença do Congresso. Qual regra constitucional é aplicável?","a":["Pode ausentar-se por qualquer período sem licença.","Necessita licença apenas quando a viagem excede noventa dias.","A licença compete exclusivamente ao STF.","Não pode ausentar-se por período superior a quinze dias sem licença do Congresso, sob pena de perda do cargo."],"ok":3,"e":"O art. 83 impõe ao Presidente e Vice-Presidente essa limitação para ausências superiores a quinze dias.","src":"CF, art. 83","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2050,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"Na hipótese de dupla vacância da Presidência e Vice-Presidência nos últimos dois anos do mandato, qual regra se aplica?","a":["Eleição pelo Congresso Nacional em trinta dias depois da última vaga, na forma da lei.","Eleição direta obrigatória em noventa dias.","Posse definitiva do presidente do STF sem eleição.","Prorrogação automática do mandato anterior."],"ok":0,"e":"O art. 81, § 1º, prevê eleição indireta pelo Congresso nessa hipótese; os eleitos completam o período dos antecessores.","src":"CF, art. 81, §§ 1º e 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2051,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"Uma acusação por crime de responsabilidade do Presidente é admitida por dois terços da Câmara dos Deputados. Qual órgão tem competência constitucional para processá-lo e julgá-lo nessa hipótese?","a":["Superior Tribunal de Justiça.","Senado Federal.","Tribunal de Contas da União.","Conselho da República."],"ok":1,"e":"Os arts. 52, I, e 86 atribuem ao Senado o processamento e julgamento do Presidente por crimes de responsabilidade, observadas as etapas constitucionais.","src":"CF, arts. 52, I, e 86","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2052,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"O Presidente pretende editar decreto autônomo para extinguir cargos públicos federais atualmente ocupados. Qual limite do art. 84, VI, b?","a":["Pode extinguir por decreto quaisquer cargos ocupados.","Pode extinguir qualquer cargo estadual por decreto federal.","A extinção por decreto nessa hipótese limita-se a funções ou cargos públicos vagos.","A extinção de cargo ocupado independe de fundamento jurídico."],"ok":2,"e":"O art. 84, VI, b, autoriza decreto para extinção de funções ou cargos públicos quando vagos, não abrangendo indistintamente cargos ocupados.","src":"CF, art. 84, VI, b","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2053,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Uma lei estadual é questionada em recurso especial exclusivamente por suposta violação direta da Constituição. Qual distinção de competência recursal é pertinente?","a":["Questão constitucional direta é matéria de recurso extraordinário ao STF, se presentes os requisitos; recurso especial tem objeto próprio de direito federal infraconstitucional.","O STJ substitui o STF na guarda da Constituição.","Todo recurso contra decisão estadual compete ao CNJ.","A questão constitucional direta é decidida exclusivamente pelo TCU."],"ok":0,"e":"Os arts. 102, III, e 105, III, distinguem as competências do STF e do STJ. A admissibilidade depende dos requisitos de cada recurso.","src":"CF, arts. 102, III, e 105, III","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2054,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Um governador ordena ao Ministério Público estadual que deixe de investigar determinado fato, alegando subordinação funcional ao Executivo. Qual princípio institucional é pertinente?","a":["Subordinação hierárquica integral ao governador.","Independência funcional, com autonomia institucional nos termos constitucionais.","Dependência de autorização do Legislativo para toda manifestação.","Obrigação de cumprir ordens de particulares interessados."],"ok":1,"e":"O art. 127 estabelece unidade, indivisibilidade e independência funcional como princípios institucionais do Ministério Público e assegura autonomia funcional e administrativa.","src":"CF, art. 127, §§ 1º e 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2055,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Uma pessoa sem recursos econômicos necessita de assistência jurídica integral e gratuita. Qual instituição constitucional tem missão permanente de orientação jurídica e defesa dos necessitados?","a":["Tribunal de Contas.","Conselho Nacional de Justiça.","Defensoria Pública.","Mesa do Senado."],"ok":2,"e":"O art. 134 define a Defensoria Pública como instituição permanente, essencial à função jurisdicional, responsável pela orientação jurídica e defesa integral e gratuita dos necessitados.","src":"CF, art. 134","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2056,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Um ente federativo pretende atribuir à Advocacia-Geral da União a representação judicial ordinária de todos os Municípios. Qual é a função constitucional própria da AGU?","a":["Representar obrigatoriamente todos os Estados e Municípios.","Substituir o Ministério Público em ações penais.","Fiscalizar contas públicas como tribunal administrativo.","Representar a União judicial e extrajudicialmente e exercer consultoria e assessoramento jurídico do Executivo federal."],"ok":3,"e":"O art. 131 delimita as funções da AGU à representação da União e às atividades de consultoria e assessoramento jurídico do Executivo federal, nos termos legais.","src":"CF, art. 131","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2057,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Um governador pretende impugnar lei estadual posterior à Constituição que considera incompatível com a Constituição Federal. Há pertinência temática. Qual instrumento abstrato pode ser cabível perante o STF?","a":["Recurso especial originário.","Ação direta de inconstitucionalidade.","Ação declaratória de constitucionalidade de lei estadual.","Habeas data."],"ok":1,"e":"O art. 102, I, a, admite ADI de lei ou ato normativo federal ou estadual perante o STF. O governador integra os legitimados do art. 103, observadas as condições jurisprudenciais.","src":"CF, arts. 102, I, a, e 103, V","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2058,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Uma associação municipal de moradores, sem integrar categoria constitucionalmente legitimada, pretende propor ADI em nome próprio perante o STF. Qual obstáculo?","a":["Qualquer pessoa jurídica possui legitimidade universal para ADI.","A legitimidade decorre automaticamente do registro civil.","O rol de legitimados do art. 103 é taxativo, e associação local genérica não está nele.","Somente o pagamento de custas é necessário."],"ok":2,"e":"O art. 103 enumera legitimados para controle abstrato. Associação local genérica não se equipara automaticamente a entidade de classe de âmbito nacional.","src":"CF, art. 103","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2059,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"O STF, ao declarar uma lei inconstitucional em ADI, considera necessário modular os efeitos temporais por segurança jurídica. Qual condição legal de quórum?","a":["Maioria simples de qualquer turma.","Decisão exclusiva do relator.","Unanimidade do Congresso Nacional.","Maioria de dois terços de seus membros, observados os fundamentos legais."],"ok":3,"e":"O art. 27 da Lei 9.868/1999 permite modulação por razões de segurança jurídica ou excepcional interesse social, mediante maioria de dois terços dos membros do STF.","src":"Lei 9.868/1999, art. 27","url":"https://www.planalto.gov.br/ccivil_03/leis/l9868.htm"},{"id":2060,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Em processo concreto, juiz de primeira instância identifica incompatibilidade constitucional de lei relevante ao julgamento. A reserva de plenário impede que ele examine a questão individualmente?","a":["Não. A reserva de plenário do art. 97 é dirigida aos tribunais; o juiz singular pode exercer controle difuso.","Sim, todo juiz deve consultar o Senado antes de decidir.","Sim, somente o STF pode examinar constitucionalidade incidental.","Não, porque juiz singular pode revogar a lei para todos os cidadãos."],"ok":0,"e":"O art. 97 exige maioria absoluta do plenário ou órgão especial dos tribunais para declaração de inconstitucionalidade. O controle incidental por juiz singular não se submete a essa reserva.","src":"CF, art. 97","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2061,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Uma comissão constituinte originária, instaurada em contexto de ruptura da ordem jurídica anterior, debate se o novo texto deve necessariamente observar o procedimento de emenda da Constituição substituída. Segundo a classificação tradicional, qual a resposta?","a":["O poder originário é limitado ao procedimento do art. 60 da Constituição substituída.","Toda nova Constituição depende de sanção presidencial conforme o texto anterior.","O poder constituinte originário inaugura nova ordem jurídica e não se submete ao procedimento de reforma da Constituição anterior.","O poder originário equivale ao poder constituinte derivado decorrente."],"ok":2,"e":"Na teoria constitucional clássica, o poder constituinte originário é inicial e juridicamente autônomo em relação à ordem anterior. Isso não exclui debates sobre condicionamentos políticos, éticos e internacionais.","src":"Teoria do poder constituinte originário","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2062,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Um Estado elabora sua Constituição e inclui dispositivo que suprime a independência do Poder Judiciário estadual perante o governador. Qual limite incide?","a":["A autonomia estadual permite modificar livremente a separação dos Poderes.","A Constituição estadual possui hierarquia superior à federal no território do Estado.","O governador pode afastar princípios federais mediante decreto.","O poder constituinte decorrente estadual deve observar os princípios e limites da Constituição Federal."],"ok":3,"e":"O art. 25 permite que os Estados se organizem por suas Constituições e leis, observados os princípios da Constituição Federal. O poder decorrente é juridicamente limitado.","src":"CF, arts. 2º e 25","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2063,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Uma PEC aprovada regularmente pelas duas Casas é encaminhada ao Presidente da República para sanção ou veto. A etapa é necessária?","a":["Não. A emenda é promulgada pelas Mesas da Câmara e do Senado, com o respectivo número de ordem.","Sim, a sanção presidencial é indispensável.","Sim, mas somente o veto é admitido.","Não, porque a promulgação compete exclusivamente ao STF."],"ok":0,"e":"O art. 60, § 3º, atribui a promulgação às Mesas da Câmara dos Deputados e do Senado Federal; emendas não se submetem a sanção ou veto presidencial.","src":"CF, art. 60, § 3º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2064,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Uma norma constitucional estabelece objetivo de proteção social e remete a regulamentação indispensável de suas condições de exercício a futura lei. Segundo a classificação tradicional de aplicabilidade, qual categoria descreve a situação?","a":["Norma de eficácia plena, porque toda norma constitucional é integralmente autoexecutável.","Norma de eficácia limitada, que depende de integração legislativa para produzir plenamente seus efeitos positivos.","Norma sem qualquer efeito jurídico até regulamentação.","Norma de eficácia contida, necessariamente aplicável em toda sua extensão desde a promulgação."],"ok":1,"e":"Normas de eficácia limitada possuem eficácia jurídica desde a vigência, inclusive vinculando o legislador, mas dependem de integração para plena concretização da disciplina prevista.","src":"Aplicabilidade das normas constitucionais; CF, art. 5º, § 1º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2065,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Um empregado recebe dispensa exclusivamente por sua filiação sindical. Qual garantia constitucional fundamenta a proteção da liberdade de adesão ou não a sindicato?","a":["A filiação sindical depende de aprovação do empregador.","A liberdade sindical é exclusiva dos servidores efetivos.","A Constituição determina a filiação sindical obrigatória de todos os trabalhadores.","Ninguém será obrigado a filiar-se ou a manter-se filiado a sindicato, sendo assegurada a liberdade sindical."],"ok":3,"e":"O art. 8º protege a liberdade sindical, inclusive a faculdade de filiar-se ou desfiliar-se. A dispensa discriminatória deve ser examinada conforme o regime de proteção aplicável.","src":"CF, art. 8º, caput e V","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2066,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Durante calamidade pública, a autoridade competente utiliza temporariamente imóvel privado diante de perigo público iminente. Se houver dano, qual garantia constitucional assiste ao proprietário?","a":["Indenização ulterior, se houver dano.","Indenização prévia obrigatória, mesmo sem dano.","Perda definitiva da propriedade sem indenização.","Indenização apenas se houver desapropriação formal anterior."],"ok":0,"e":"O art. 5º, XXV, admite requisição administrativa diante de perigo público iminente, assegurando indenização ulterior em caso de dano.","src":"CF, art. 5º, XXV","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2067,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Uma pessoa é processada por órgão jurisdicional criado especificamente após os fatos, apenas para julgar aquele episódio. Qual garantia constitucional é diretamente contrariada?","a":["Princípio da anterioridade tributária.","Vedação de juízo ou tribunal de exceção e garantia do juiz natural.","Liberdade de associação sindical.","Direito exclusivo a julgamento por júri em qualquer causa."],"ok":1,"e":"Os incisos XXXVII e LIII do art. 5º vedam tribunal de exceção e asseguram processamento e julgamento pela autoridade competente.","src":"CF, art. 5º, XXXVII e LIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2068,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"A Administração pretende negar matrícula no ensino obrigatório gratuito a uma criança, sustentando que a oferta desse ensino é mera faculdade estatal. Qual parâmetro constitucional se aplica?","a":["A matrícula depende exclusivamente de liberalidade do gestor.","O ensino obrigatório só constitui direito quando houver contrato privado.","O acesso ao ensino obrigatório e gratuito é direito público subjetivo.","A oferta irregular nunca gera responsabilidade da autoridade competente."],"ok":2,"e":"O art. 208, §§ 1º e 2º, reconhece o direito público subjetivo e prevê responsabilidade pela não oferta ou oferta irregular do ensino obrigatório pelo poder público.","src":"CF, art. 208, §§ 1º e 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2069,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Uma pessoa tomou ciência inequívoca de ato administrativo lesivo há 150 dias e pretende impetrar mandado de segurança contra aquele ato único, sem circunstância que altere a contagem. Qual obstáculo legal?","a":["Decurso do prazo decadencial de 120 dias para impetração.","Prescrição de apenas trinta dias.","Inexistência de prazo para mandado de segurança.","Necessidade de aguardar um ano para impetrar."],"ok":0,"e":"O art. 23 da Lei 12.016/2009 estabelece prazo de 120 dias contados da ciência do ato impugnado. O caso exclui fatos que poderiam alterar a contagem.","src":"Lei 12.016/2009, art. 23","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/lei/l12016.htm"},{"id":2070,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Uma associação legalmente constituída e em funcionamento há oito meses pretende impetrar mandado de segurança coletivo em defesa de seus associados, apenas com fundamento em sua condição de associação. Qual requisito temporal falta?","a":["Estar constituída há pelo menos cinco anos.","Estar constituída e em funcionamento há pelo menos um ano.","Não existe requisito temporal para associação.","Possuir registro perante o STF há seis meses."],"ok":1,"e":"O art. 5º, LXX, b, exige para associação constituição legal e funcionamento há pelo menos um ano, para defesa dos interesses de seus membros ou associados.","src":"CF, art. 5º, LXX, b","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2071,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Uma pessoa descobre que órgão público mantém informação incorreta sobre ela. Após solicitar retificação e receber recusa, pretende corrigir judicialmente o dado sem recorrer a processo sigiloso. Qual remédio específico?","a":["Habeas corpus preventivo.","Mandado de injunção por omissão legislativa.","Habeas data para retificação dos dados.","Ação direta de inconstitucionalidade."],"ok":2,"e":"O art. 5º, LXXII, b, prevê habeas data para retificação de dados, observados os requisitos procedimentais da Lei 9.507/1997.","src":"CF, art. 5º, LXXII, b; Lei 9.507/1997","url":"https://www.planalto.gov.br/ccivil_03/leis/l9507.htm"},{"id":2072,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Em mandado de injunção, o tribunal reconhece mora normativa que impede o exercício de direito constitucional. Segundo a Lei 13.300/2016, qual providência pode integrar a decisão?","a":["Editar lei geral por iniciativa parlamentar própria.","Limitar-se obrigatoriamente a arquivar o processo sem providência.","Condenar criminalmente o legislador omisso.","Fixar prazo razoável para edição da norma e estabelecer condições para exercício do direito se a mora persistir, observadas as exceções legais."],"ok":3,"e":"O art. 8º disciplina a fixação de prazo para suprimento da mora e das condições de exercício do direito, inclusive a dispensa de novo prazo quando já houve descumprimento de prazo anterior.","src":"Lei 13.300/2016, art. 8º","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2016/lei/l13300.htm"},{"id":2073,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Uma criança nasce no exterior, filha de brasileira que não está a serviço do Brasil, e é registrada em repartição brasileira competente. Qual a nacionalidade constitucional?","a":["Brasileira naturalizada após completar dezoito anos.","Brasileira nata, pela hipótese de registro em repartição brasileira competente.","Estrangeira obrigatoriamente, por ter nascido fora do território.","Brasileira nata apenas se ambos os pais forem brasileiros."],"ok":1,"e":"O art. 12, I, c, contempla os nascidos no estrangeiro de pai brasileiro ou mãe brasileira registrados em repartição brasileira competente, além da hipótese alternativa de residência e opção.","src":"CF, art. 12, I, c","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2074,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Uma pessoa de 17 anos regularmente alistada pergunta se o voto é obrigatório para ela na eleição. Qual orientação constitucional?","a":["O voto é obrigatório a partir dos dezesseis anos.","O alistamento é proibido antes dos dezoito anos.","O alistamento eleitoral e o voto são facultativos nessa faixa etária.","O voto só é facultativo para maiores de setenta anos."],"ok":2,"e":"O art. 14, § 1º, II, c, prevê facultatividade para maiores de dezesseis e menores de dezoito anos.","src":"CF, art. 14, § 1º, II, c","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2075,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Um prefeito em primeiro mandato deseja concorrer a deputado estadual na eleição seguinte. Qual medida deve adotar em relação ao cargo de prefeito?","a":["Permanecer no cargo até a diplomação sem restrição.","Licenciar-se apenas no dia da votação.","Renunciar somente após tomar posse como deputado.","Renunciar ao mandato até seis meses antes do pleito."],"ok":3,"e":"O art. 14, § 6º, exige que Presidente, governadores e prefeitos renunciem aos respectivos mandatos até seis meses antes do pleito para concorrer a outros cargos.","src":"CF, art. 14, § 6º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2076,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Um eleitor deseja candidatar-se a vereador sem filiação a partido político, embora cumpra os demais requisitos. Qual condição constitucional impede essa candidatura?","a":["A filiação partidária é condição de elegibilidade.","A Constituição admite candidaturas avulsas em qualquer eleição municipal.","A filiação é necessária apenas para candidatos a Presidente.","A exigência partidária depende de escolha da Justiça Eleitoral em cada pleito."],"ok":0,"e":"O art. 14, § 3º, V, estabelece filiação partidária entre as condições de elegibilidade. Não basta preencher idade e alistamento.","src":"CF, art. 14, § 3º, V","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2077,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Um Estado pretende explorar diretamente, ou mediante concessão, os serviços locais de gás canalizado. Qual competência constitucional fundamenta a medida?","a":["Competência exclusiva dos Municípios sobre qualquer serviço de gás.","Competência exclusiva da União sem possibilidade de atuação estadual.","Competência estadual prevista expressamente no art. 25, § 2º, na forma da lei.","Competência administrativa privativa do Distrito Federal."],"ok":2,"e":"O art. 25, § 2º, atribui aos Estados a exploração dos serviços locais de gás canalizado, diretamente ou mediante concessão, na forma da lei.","src":"CF, art. 25, § 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2078,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Um Estado pretende legislar sobre tema não vedado pela Constituição e não atribuído expressamente a outro ente. Qual regra geral pode fundamentar sua atuação?","a":["Toda competência não enumerada pertence exclusivamente à União.","A competência residual é sempre do Município.","O Estado depende de autorização judicial para exercer competência residual.","São reservadas aos Estados as competências que não lhes sejam vedadas pela Constituição."],"ok":3,"e":"O art. 25, § 1º, estabelece a reserva estadual de competências não vedadas, respeitada a repartição constitucional.","src":"CF, art. 25, § 1º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2079,"s":1,"module":4,"topic":"Federação e r
