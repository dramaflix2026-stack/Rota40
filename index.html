iança orienta decisões que a afetam. A proteção integral é compatível com o reconhecimento da criança como sujeito de direitos. Participação e escuta devem considerar idade e maturidade; proteção não equivale à supressão de toda autonomia."],["Refúgio e não devolução","A Lei 9.474/1997 disciplina reconhecimento da condição de refugiado, incluindo hipóteses relacionadas a perseguição e grave e generalizada violação de direitos humanos. O princípio de não devolução protege contra retorno a situações de risco nos limites do regime aplicável. Refúgio não se confunde com qualquer modalidade de imigração."]],"map":["Belém do Pará → combate à violência","Criança → proteção integral e participação","Refúgio → hipóteses legais","Não devolução → proteção contra retorno a risco"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9474.htm"},{"t":"Responsabilidade internacional e proteção no Brasil","ref":"CF, arts. 5º, 109, V-A e § 5º; CADH, arts. 63 e 68","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Responsabilidade do Estado","O descumprimento de obrigação internacional imputável ao Estado pode gerar responsabilidade internacional. Atos e omissões dos poderes públicos devem ser examinados conforme o dever aplicável. A responsabilização internacional do Estado é diferente da eventual responsabilidade penal ou civil individual de agentes."],["Reparação e cumprimento","A resposta a uma violação pode exigir cessação, investigação, reparação material e imaterial e medidas para evitar repetição. O art. 68 da Convenção Americana estabelece o compromisso de cumprir decisões da Corte em casos de que os Estados sejam partes. A implementação pode envolver diversos órgãos nacionais."],["Incidente de deslocamento de competência","Em graves violações de direitos humanos, o Procurador-Geral da República pode suscitar perante o STJ incidente de deslocamento para a Justiça Federal, com finalidade de assegurar obrigações decorrentes de tratados internacionais. A federalização não é automática nem depende apenas de repercussão pública."]],"map":["Estado → responsabilidade internacional","Reparação → medidas adequadas","IDC → Procurador-Geral da República","STJ → exame do deslocamento"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/d0678.htm"}];const humanRightsQuestions=/*BANK:humanRightsQuestions*/null;const environmentModules=[{"t":"Fundamentos constitucionais e princípios ambientais","ref":"CF, art. 225; Lei 6.938/1981","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Direito fundamental ao ambiente","A Constituição protege o meio ambiente ecologicamente equilibrado como bem de uso comum e condição da qualidade de vida. Poder público e coletividade têm dever de defendê-lo para gerações presentes e futuras. A titularidade coletiva não impede proteção judicial de danos individuais relacionados."],["Prevenção e precaução","Prevenção atua sobre riscos conhecidos; precaução orienta decisões diante de incertezas científicas relevantes sobre danos potencialmente graves. Nenhum dos princípios dispensa análise fundamentada das circunstâncias e medidas proporcionais."],["Poluidor-pagador e desenvolvimento sustentável","O poluidor-pagador busca internalizar custos de prevenção e reparação, sem conferir licença para poluir. Desenvolvimento sustentável integra proteção ecológica, atividade econômica e justiça social. Participação e informação qualificam decisões ambientais."]],"map":["Art. 225 → direito e dever coletivo","Prevenção → risco conhecido","Precaução → incerteza relevante","Poluidor-pagador → internalização de custos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm"},{"t":"Política Nacional do Meio Ambiente e SISNAMA","ref":"Lei 6.938/1981, arts. 2º a 9º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm","lessons":[["Finalidades da PNMA","A política nacional organiza instrumentos para preservar, melhorar e recuperar a qualidade ambiental, compatibilizando desenvolvimento e equilíbrio ecológico. O conceito legal de poluição abrange diferentes formas de degradação, não somente descarte de resíduos."],["Estrutura institucional","O SISNAMA reúne órgãos e entidades dos diferentes níveis federativos. O CONAMA exerce funções consultivas e deliberativas nos limites legais. IBAMA e ICMBio têm atribuições executivas próprias; órgãos estaduais e municipais também integram o sistema."],["Instrumentos","Padrões de qualidade, zoneamento, avaliação de impactos, licenciamento e instrumentos econômicos integram a política. Um instrumento não substitui necessariamente outro: a autorização para atividade pode exigir licenças, estudos e outras providências autônomas conforme o caso."]],"map":["PNMA → qualidade ambiental","SISNAMA → sistema federativo","CONAMA → funções consultivas e deliberativas","Instrumentos → atuação complementar"]},{"t":"Competências e federalismo ambiental","ref":"CF, arts. 23, 24 e 30; LC 140/2011","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp140.htm","lessons":[["Competência material","Proteger o ambiente e combater a poluição integra competências comuns dos entes federativos. A LC 140/2011 organiza a cooperação administrativa, distribuindo ações de licenciamento e fiscalização. Competência comum não significa que todos emitam licenças simultaneamente para o mesmo empreendimento."],["Competência legislativa","União, Estados e Distrito Federal legislam concorrentemente sobre matérias ambientais previstas no art. 24. Municípios possuem competência de interesse local e suplementação, observada a Constituição. Norma local deve ser analisada à luz das competências e da proteção ambiental pertinente."],["Licenciamento e fiscalização","A LC 140 prevê licenciamento ou autorização ambiental por um único ente federativo, segundo os critérios legais. Os demais podem manifestar-se nos termos da lei. Fiscalização e adoção de medidas urgentes seguem regras próprias; a repartição não elimina o dever comum de proteção."]],"map":["Art. 23 → competência comum","Art. 24 → competência concorrente","Município → interesse local e suplementação","Licenciamento → ente competente"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Licenciamento e avaliação de impactos ambientais","ref":"CF, art. 225, § 1º, IV; Leis 15.190/2025 e 15.300/2025","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15190.htm","lessons":[["Licenciamento e licenças","A Lei 15.190/2025 disciplina o licenciamento ambiental e seus procedimentos. As licenças e condicionantes devem corresponder ao tipo de atividade e aos impactos avaliados. A escolha de procedimento não é arbitrária: deve observar a lei, os critérios da autoridade competente e eventuais decisões judiciais aplicáveis."],["EIA e RIMA","Para obra ou atividade potencialmente causadora de significativa degradação, a Constituição exige estudo prévio de impacto ambiental, ao qual se dá publicidade. O EIA analisa impactos, alternativas e medidas de controle; o RIMA comunica resultados de forma compreensível. Estudos simplificados não substituem o EIA quando constitucionalmente exigido."],["Atualizações e licenciamento especial","A Lei 15.300/2025 disciplina a Licença Ambiental Especial para atividades e empreendimentos estratégicos conforme critérios legais. A nova legislação não elimina o dever constitucional de proteção. Ao estudar hipóteses de dispensa, modalidades simplificadas e participação pública, consulte a redação consolidada, os vetos promulgados e a jurisprudência atual."]],"map":["Licenciamento → avaliação e condicionantes","Impacto significativo → EIA prévio","RIMA → comunicação dos impactos","LAE → regime especial"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15300.htm"},{"t":"Florestas, APP, reserva legal e cadastro rural","ref":"Lei 12.651/2012, arts. 3º, 4º, 12, 17 e 29","url":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12651.htm","lessons":[["Área de Preservação Permanente","APP protege funções ecológicas, como recursos hídricos, estabilidade do solo e biodiversidade. Pode existir mesmo sem vegetação nativa presente. Intervenção ou supressão depende de enquadramento nas hipóteses legais e das autorizações exigíveis."],["Reserva Legal","Reserva Legal é área situada no interior de imóvel rural destinada à conservação e ao uso sustentável nos termos legais. Seus percentuais variam conforme localização e características da vegetação. Não confunda percentuais de reserva com regras de APP, nem aplique regra geral sem examinar exceções."],["CAR e regularização","O Cadastro Ambiental Rural reúne informações ambientais dos imóveis rurais. A inscrição é obrigatória conforme o art. 29 e não constitui título de propriedade. Programas de regularização, compensação e recomposição têm requisitos próprios; cadastro não equivale a autorização para supressão."]],"map":["APP → função ecológica","Reserva Legal → imóvel rural","Percentuais → localização e bioma","CAR → cadastro, não título"]},{"t":"Unidades de conservação e biodiversidade","ref":"Lei 9.985/2000, arts. 7º a 21; CF, art. 225","url":"https://www.planalto.gov.br/ccivil_03/leis/l9985.htm","lessons":[["Categorias do SNUC","Unidades de conservação dividem-se em dois grupos: proteção integral e uso sustentável. A primeira prioriza preservação da natureza e uso indireto, ressalvadas hipóteses legais. O segundo compatibiliza conservação com uso sustentável de parcela dos recursos."],["Criação e gestão","A criação de unidade exige ato do poder público e, em regra, estudos técnicos e consulta pública, observadas exceções legais. Plano de manejo orienta uso, zoneamento e proteção. Redução ou desafetação de espaços especialmente protegidos deve observar a reserva legal constitucional."],["Categorias e particularidades","Parque Nacional, Estação Ecológica e Reserva Biológica integram proteção integral. APA, Floresta Nacional e Reserva Extrativista pertencem ao grupo de uso sustentável. Regime dominial, visitação, pesquisa e presença de populações tradicionais dependem da categoria escolhida."]],"map":["Proteção integral → preservação","Uso sustentável → conservação e uso compatível","Parque → proteção integral","APA → uso sustentável"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Recursos hídricos e gestão de resíduos","ref":"Leis 9.433/1997 e 12.305/2010","url":"https://www.planalto.gov.br/ccivil_03/leis/l9433.htm","lessons":[["Política de recursos hídricos","A água é bem de domínio público e recurso natural limitado, dotado de valor econômico. Em situações de escassez, o uso prioritário é consumo humano e dessedentação de animais. A bacia hidrográfica constitui unidade territorial para implementação da política."],["Outorga e gestão","A outorga disciplina o direito de uso da água nas hipóteses legais e não aliena o recurso hídrico. Planos, cobrança, enquadramento dos corpos de água e sistemas de informação integram instrumentos da política. Usos legalmente dispensados de outorga não afastam todos os deveres ambientais."],["Resíduos sólidos","A política estabelece prioridade de não geração, redução, reutilização, reciclagem, tratamento e disposição adequada de rejeitos. Responsabilidade compartilhada pelo ciclo de vida e logística reversa distribuem deveres conforme produtos e agentes. Resíduo aproveitável não se confunde com rejeito sem alternativa viável de tratamento ou recuperação."]],"map":["Água → domínio público","Bacia → unidade territorial","Outorga → direito de uso","Resíduos → prioridade à não geração"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2010/lei/l12305.htm"},{"t":"Responsabilidade civil por dano ambiental","ref":"Lei 6.938/1981, art. 14, § 1º; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l6938.htm","lessons":[["Responsabilidade objetiva","O poluidor responde pela reparação ou indenização de danos ambientais independentemente de culpa, observados dano, nexo de imputação e regime aplicável. A jurisprudência do STJ adota a teoria do risco integral em matéria de responsabilidade civil ambiental. A licença não exclui automaticamente responsabilidade por dano efetivamente causado."],["Reparação integral","A recuperação do ambiente degradado é prioritária quando tecnicamente possível. Obrigações de fazer e indenizações podem ser cumuladas conforme os danos existentes, como reconhece a Súmula 629 do STJ. A indenização não é autorização para manter degradação."],["Obrigações propter rem e prescrição","A jurisprudência reconhece natureza propter rem de obrigações ambientais, com possibilidades e limites de imputação a titulares e possuidores, inclusive conforme Tema 1204 do STJ. O STF, no Tema 999, considera imprescritível a pretensão de reparação civil de dano ambiental. Diferencie essa pretensão de sanções administrativas e penais."]],"map":["Civil → objetiva","Reparação → recuperação e indenização cabível","Propter rem → vínculo com o bem","Tema 999 STF → reparação civil imprescritível"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Infrações administrativas e crimes ambientais","ref":"Lei 9.605/1998; CF, art. 225, § 3º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9605.htm","lessons":[["Esferas de responsabilização","Condutas e atividades lesivas podem gerar responsabilidade civil, administrativa e penal, observados os pressupostos próprios de cada esfera. A reparação civil objetiva não transforma automaticamente toda infração em crime. Sanções administrativas também exigem procedimento, motivação e direito de defesa."],["Pessoa jurídica","A Lei 9.605/1998 admite responsabilização de pessoas jurídicas quando a infração for cometida por decisão de representante legal ou contratual, ou órgão colegiado, no interesse ou benefício da entidade. A responsabilidade da pessoa jurídica não exclui a de pessoas naturais conforme suas contribuições."],["Sanções e garantias","Infrações administrativas podem ensejar advertência, multas, embargo e outras sanções legalmente previstas. Na esfera penal, a tipicidade exige análise de elementos legais e subjetivos. A imposição de medida cautelar administrativa não equivale à condenação penal."]],"map":["Civil ≠ administrativa ≠ penal","Pessoa jurídica → requisitos do art. 3º","Sanção → procedimento e defesa","Crime → tipicidade e culpabilidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Tutela coletiva e instrumentos processuais ambientais","ref":"Lei 7.347/1985, arts. 1º, 3º, 5º e 13; CF, art. 5º, LXXIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l7347compilada.htm","lessons":[["Ação civil pública","A ACP permite tutela de interesses difusos e coletivos relacionados ao ambiente. Pode buscar condenação em dinheiro e obrigações de fazer ou não fazer conforme o regime legal. Ministério Público, Defensoria, entes públicos e associações que preencham requisitos legais estão entre os legitimados."],["Ação popular e participação","O cidadão pode propor ação popular visando anular ato lesivo ao meio ambiente, conforme a Constituição. Não se confunde a legitimidade do cidadão com a de associação em ação civil pública. A fiscalização social também envolve acesso a informações e participação nos processos decisórios."],["Compromisso de ajustamento e reparação","Órgãos públicos legitimados podem tomar compromisso de ajustamento de conduta com eficácia de título executivo extrajudicial, nos termos legais. O instrumento busca adequação da conduta e reparação, sem autorizar renúncia indiscriminada a direitos indisponíveis. A destinação de condenações pecuniárias coletivas segue a legislação."]],"map":["ACP → tutela coletiva","Ação popular → cidadão","TAC → título executivo extrajudicial","Reparação → interesse coletivo"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const environmentQuestions=/*BANK:environmentQuestions*/null;const internationalModules=[{"t":"Fundamentos e fontes do Direito Internacional","ref":"Estatuto da CIJ, art. 38; CF, art. 4º","url":"https://www.un.org/en/about-us/un-charter/full-text","lessons":[["Ordem jurídica internacional","O Direito Internacional Público disciplina relações entre Estados, organizações internacionais e outros sujeitos reconhecidos pelo ordenamento. A soberania não exclui obrigações jurídicas assumidas internacionalmente. Diferencie igualdade soberana, autonomia estatal e exercício de competências de organizações internacionais."],["Fontes internacionais","O art. 38 do Estatuto da Corte Internacional de Justiça indica convenções internacionais, costume e princípios gerais de direito, além de decisões judiciais e doutrina como meios auxiliares de determinação das regras. Costume exige prática geral aceita como direito. Não se resume a comportamento reiterado sem convicção jurídica."],["Normas imperativas","Normas de jus cogens são aceitas e reconhecidas pela comunidade internacional dos Estados como um todo, sem possibilidade de derrogação, salvo por norma posterior de igual natureza. Um tratado em conflito com norma imperativa existente é nulo segundo a Convenção de Viena."]],"map":["Soberania → igualdade jurídica","Costume → prática e opinio juris","Jurisprudência e doutrina → meios auxiliares","Jus cogens → inderrogabilidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm"},{"t":"Tratados internacionais: formação, vigência e extinção","ref":"Convenção de Viena de 1969, arts. 2º, 11, 19 a 27 e 54 a 64","url":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2009/decreto/d7030.htm","lessons":[["Formação e consentimento","A Convenção de Viena disciplina tratados escritos entre Estados regidos pelo Direito Internacional. Consentimento pode ser expresso por assinatura, ratificação, aceitação, aprovação ou adesão conforme o regime aplicável. Assinatura e ratificação não são necessariamente equivalentes. Entrada em vigor depende das condições do tratado."],["Reservas e interpretação","Reserva é declaração unilateral destinada a excluir ou modificar o efeito jurídico de determinadas disposições em relação ao Estado que a formula. Sua admissibilidade depende do tratado, inclusive compatibilidade com objeto e finalidade. Interpretação deve ocorrer de boa-fé, segundo sentido comum, contexto, objeto e finalidade."],["Cumprimento e extinção","Pacta sunt servanda impõe cumprimento de boa-fé dos tratados em vigor. Como regra, o Estado não pode invocar seu direito interno para justificar inadimplemento. Denúncia, retirada, suspensão e extinção possuem pressupostos próprios; não decorrem automaticamente de mudança de governo."]],"map":["Consentimento → formas admitidas","Reserva → limites do tratado","Pacta sunt servanda → boa-fé","Extinção → pressupostos jurídicos"]},{"t":"Incorporação e hierarquia dos tratados no Brasil","ref":"CF, arts. 5º, §§ 2º a 4º, 49, I, e 84, VIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Competências constitucionais","A celebração de tratados integra as atribuições presidenciais, sujeita ao referendo do Congresso Nacional nos termos constitucionais. A aprovação parlamentar, a manifestação internacional de consentimento e a promulgação interna constituem etapas distintas. Nem todo compromisso internacional segue necessariamente procedimento idêntico."],["Hierarquia interna","Em regra, tratados comuns incorporados possuem posição equivalente à legislação ordinária, ressalvadas matérias com regimes próprios. Segundo o STF, tratados de direitos humanos incorporados sem aprovação qualificada possuem status supralegal. Os aprovados conforme art. 5º, § 3º, equivalem a emendas constitucionais."],["Plano internacional e plano interno","A solução de conflitos entre normas no direito doméstico não elimina obrigações internacionais do Brasil. O Estado continua sujeito ao regime internacional do tratado. Questões sobre denúncia de tratados exigem considerar competências constitucionais e a jurisprudência do STF, inclusive a ADI 1625."]],"map":["Presidente → celebração","Congresso → aprovação constitucional","Direitos humanos → regime hierárquico próprio","Plano interno ≠ responsabilidade internacional"]},{"t":"Estados, organizações internacionais e solução de controvérsias","ref":"Carta da ONU, arts. 2º, 7º, 33 e 92 a 96; Estatuto da CIJ","url":"https://www.un.org/en/about-us/un-charter/full-text","lessons":[["Sujeitos e competências","Estados possuem personalidade internacional originária; organizações internacionais exercem competências decorrentes de seus instrumentos constitutivos e regras pertinentes. A ONU possui órgãos com funções distintas. A Assembleia Geral não desempenha o mesmo papel do Conselho de Segurança."],["Solução pacífica","Negociação, mediação, conciliação, arbitragem e solução judicial são meios pacíficos previstos na Carta. Arbitragem decorre do consentimento das partes e do regime aplicável. O recurso à força é, em regra, proibido, ressalvadas as hipóteses admitidas pela Carta."],["Corte Internacional de Justiça","A CIJ é o principal órgão judiciário da ONU. Apenas Estados podem ser partes em casos contenciosos perante ela; sua jurisdição depende de fundamento de consentimento. Pareceres consultivos podem ser solicitados pelos órgãos autorizados. A CIJ não se confunde com o Tribunal Penal Internacional."]],"map":["ONU → competências dos órgãos","Controvérsias → meios pacíficos","CIJ → Estados e consentimento","TPI → responsabilidade penal individual"]},{"t":"Nacionalidade brasileira e condição jurídica do estrangeiro","ref":"CF, art. 12; EC 131/2023; Lei 13.445/2017","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Nacionalidade originária","A Constituição prevê hipóteses de nacionalidade brasileira nata relacionadas a nascimento no território e filiação brasileira no exterior, com requisitos e ressalvas próprios. Filhos de estrangeiros nascidos no Brasil não são natos quando os pais estiverem a serviço de seu país, nos termos constitucionais."],["Naturalização e cargos privativos","Brasileiros naturalizados possuem, em regra, igualdade de direitos com natos, ressalvadas distinções constitucionais. A naturalização possui modalidades e requisitos legais. Cargos privativos de nato incluem Presidente e Vice-Presidente da República, Ministro do STF e outros expressamente previstos no art. 12, § 3º."],["Perda e reaquisição","A EC 131/2023 modificou as hipóteses de perda da nacionalidade, afastando a perda automática pela simples aquisição de outra nacionalidade. A perda pode decorrer de cancelamento da naturalização por sentença judicial nas hipóteses constitucionais ou de pedido expresso, ressalvada situação de apatridia. Reaquisição observa o regime legal."]],"map":["Nato → hipóteses constitucionais","Naturalizado → igualdade com ressalvas","Cargos privativos → art. 12, § 3º","EC 131 → aquisição de outra nacionalidade não basta"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc131.htm"},{"t":"Migração, refúgio e medidas de retirada","ref":"Lei 13.445/2017; Lei 9.474/1997","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm","lessons":[["Direitos e política migratória","A Lei de Migração orienta-se pelos direitos humanos, não criminalização da migração, igualdade de tratamento e combate à discriminação. Visto, autorização de residência e naturalização são institutos diferentes. A irregularidade documental não elimina os direitos fundamentais da pessoa migrante."],["Repatriação, deportação e expulsão","Repatriação é medida de devolução de pessoa em situação de impedimento ao ingresso, nos termos legais. Deportação decorre de situação migratória irregular e deve observar procedimento e oportunidade de regularização. Expulsão é medida administrativa com impedimento de reingresso por prazo determinado, fundada nas hipóteses legais e sujeita a garantias."],["Refúgio e asilo","Refúgio possui requisitos previstos na Lei 9.474/1997, incluindo perseguição por motivos legalmente indicados ou grave e generalizada violação de direitos humanos. Asilo político tem disciplina própria e não se confunde com refúgio. O princípio de não devolução protege pessoas contra retorno a situações de risco nos limites aplicáveis."]],"map":["Migração → direitos e garantias","Deportação → irregularidade migratória","Expulsão → hipóteses legais","Refúgio → proteção internacional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9474.htm"},{"t":"Direito Internacional Privado: conflitos de leis","ref":"LINDB, arts. 7º a 10 e 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm","lessons":[["Elementos de conexão","O Direito Internacional Privado determina a lei aplicável às relações privadas conectadas a diferentes países. Domicílio, localização dos bens e lugar de constituição da obrigação são critérios previstos na LINDB. Lei aplicável e competência jurisdicional não se confundem: o juiz brasileiro pode aplicar direito estrangeiro nas hipóteses pertinentes."],["Pessoa, família e bens","O art. 7º adota a lei do país do domicílio para regras sobre começo e fim da personalidade, nome, capacidade e direitos de família, ressalvadas disposições específicas. Para qualificar bens e regular relações a eles concernentes, o art. 8º adota, como regra, a lei do país onde estão situados."],["Obrigações, sucessão e ordem pública","O art. 9º prevê a lei do país em que se constituírem as obrigações, com disciplina própria para contratos. A sucessão segue, em regra, a lei do domicílio do falecido, observadas regras protetivas. Leis e atos estrangeiros não produzem efeitos no Brasil quando ofendem soberania nacional, ordem pública ou bons costumes, conforme art. 17."]],"map":["Conexão → lei aplicável","Pessoa → domicílio","Bens → localização","Ordem pública → limite"]},{"t":"Jurisdição internacional e cooperação jurídica","ref":"CPC, arts. 21 a 41 e 960 a 965; CF, art. 105, I, i","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","lessons":[["Competência concorrente e exclusiva","O CPC prevê hipóteses em que a autoridade brasileira pode julgar causas com elementos internacionais. Algumas são concorrentes; outras, como ações relativas a imóveis situados no Brasil, são exclusivas. A existência de processo no exterior não induz, em regra, litispendência no Brasil, ressalvadas regras internacionais."],["Cooperação internacional","Auxílio direto, carta rogatória e homologação de decisão estrangeira possuem finalidades diferentes. A autoridade central facilita a comunicação conforme o regime aplicável. A cooperação deve observar garantias processuais, publicidade quando pertinente e respeito à ordem pública."],["Homologação e exequatur","Compete ao STJ homologar decisões estrangeiras e conceder exequatur às cartas rogatórias, segundo a Constituição. A homologação examina requisitos de reconhecimento, sem transformar-se em novo julgamento amplo do mérito. O CPC excepciona a necessidade de homologação para sentença estrangeira de divórcio consensual simples."]],"map":["Jurisdição → arts. 21 a 25","Imóveis no Brasil → competência exclusiva","STJ → homologação e exequatur","Auxílio direto → regime próprio"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Extradição, imunidades e relações diplomáticas","ref":"CF, arts. 5º, LI e LII, e 102, I, g; Lei 13.445/2017; Convenção de Viena de 1961","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13445.htm","lessons":[["Extradição","Extradição é mecanismo de entrega de pessoa a outro Estado para fins de persecução penal ou cumprimento de condenação, conforme pressupostos legais e tratados. Diferencia-se de deportação e expulsão. No Brasil, o STF aprecia pedido de extradição formulado por Estado estrangeiro, e a execução segue o regime constitucional e legal."],["Limites constitucionais","Brasileiro nato não pode ser extraditado. Naturalizado pode sê-lo nas hipóteses de crime comum praticado antes da naturalização ou comprovado envolvimento em tráfico ilícito de entorpecentes e drogas afins, na forma da lei. Não se concede extradição de estrangeiro por crime político ou de opinião."],["Imunidades diplomáticas","A Convenção de Viena sobre Relações Diplomáticas estabelece imunidades destinadas ao exercício das funções da missão. Agentes diplomáticos possuem imunidade de jurisdição penal no Estado acreditado, além de regime próprio para jurisdição civil e administrativa. Imunidade não equivale a autorização para descumprir a lei; o Estado acreditante pode renunciar expressamente à imunidade."]],"map":["Extradição ≠ deportação","STF → julgamento do pedido","Nato → vedação de extradição","Imunidade → proteção funcional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/antigos/d56435.htm"},{"t":"Responsabilidade internacional e Tribunal Penal Internacional","ref":"Estatuto de Roma, arts. 1º, 5º, 11, 17 e 25; CF, art. 5º, § 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto/2002/d4388.htm","lessons":[["Responsabilidade do Estado","A violação de obrigação internacional atribuível a Estado pode gerar responsabilidade internacional. Cessação do ilícito e reparação seguem o regime jurídico aplicável. Responsabilidade do Estado não se confunde com responsabilidade penal individual nem decorre automaticamente de toda controvérsia privada transnacional."],["Tribunal Penal Internacional","O TPI, instituído pelo Estatuto de Roma, exerce jurisdição penal sobre pessoas naturais nos limites de competência material, temporal e demais condições do Estatuto. Sua competência abrange genocídio, crimes contra a humanidade, crimes de guerra e crime de agressão, sujeitos às regras próprias. Não é órgão judiciário da ONU."],["Complementaridade e entrega","A atuação do TPI é complementar às jurisdições penais nacionais. A admissibilidade considera se o Estado está efetivamente disposto e apto a investigar ou processar. O Estatuto distingue entrega ao Tribunal de extradição entre Estados. O Brasil submete-se à jurisdição do TPI a cuja criação tenha manifestado adesão, conforme a Constituição."]],"map":["Estado → responsabilidade internacional","TPI → pessoas naturais","Complementaridade → jurisdições nacionais","Entrega ao TPI ≠ extradição"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const internationalQuestions=/*BANK:internationalQuestions*/null;const consumerModules=[{"t":"Relação de consumo e princípios do CDC","ref":"CDC, arts. 1º a 5º; CF, arts. 5º, XXXII e 170, V","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Consumidor e destinatário final","Consumidor é pessoa natural ou jurídica que adquire ou utiliza produto ou serviço como destinatária final. A jurisprudência do STJ admite mitigação da teoria finalista em situações de vulnerabilidade demonstrada. A aquisição para integrar atividade produtiva não caracteriza automaticamente relação de consumo."],["Fornecedor, produto e serviço","Fornecedor abrange sujeitos públicos ou privados que desenvolvem atividades de fornecimento nos termos do art. 3º. Produto pode ser material ou imaterial, móvel ou imóvel. Serviço envolve atividade fornecida mediante remuneração, inclusive bancária, financeira, de crédito e securitária, ressalvadas relações trabalhistas."],["Vulnerabilidade e equiparação","O CDC reconhece a vulnerabilidade do consumidor como princípio da política nacional. Equiparações legais alcançam coletividade, vítimas de acidentes de consumo e pessoas expostas a práticas comerciais, conforme cada dispositivo. Não se deve exigir aquisição direta do produto em todas as hipóteses."]],"map":["Consumidor → destinatário final","Fornecedor → atividade de fornecimento","Vulnerabilidade → princípio","Equiparação → hipóteses legais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direitos básicos, informação e segurança","ref":"CDC, arts. 6º a 10","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Informação e transparência","O consumidor tem direito à informação adequada e clara sobre características, composição, quantidade, preço e riscos. Informação incompleta pode comprometer consentimento e segurança. A oferta precisa permitir comparação e compreensão das condições relevantes, inclusive de custos adicionais."],["Proteção da saúde e segurança","Produtos e serviços não devem acarretar riscos à saúde ou segurança, exceto os normais e previsíveis em decorrência de sua natureza e fruição, com informação adequada. Produto com alto grau de nocividade ou periculosidade conhecida não pode ser colocado no mercado pelo fornecedor."],["Reparação e facilitação da defesa","O consumidor tem direito à prevenção e reparação de danos patrimoniais e morais, individuais e coletivos. A inversão judicial do ônus da prova pode ocorrer diante de verossimilhança ou hipossuficiência, segundo critérios legais. Não é consequência automática de toda ação de consumo."]],"map":["Informação → clareza e adequação","Segurança → riscos e prevenção","Recall → comunicação posterior de risco","Ônus da prova → critérios legais"]},{"t":"Responsabilidade pelo fato do produto e do serviço","ref":"CDC, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Acidente de consumo","O fato do produto ou serviço envolve defeito que compromete a segurança legitimamente esperada e causa dano. Distingue-se do vício de adequação, que afeta qualidade, quantidade ou funcionamento. O fabricante, produtor, construtor, importador e fornecedor de serviços respondem objetivamente nas hipóteses legais."],["Comerciante e excludentes","O comerciante possui responsabilidade pelo fato do produto nas hipóteses específicas do art. 13. O fornecedor pode afastar responsabilidade demonstrando excludentes legalmente previstas, como inexistência do defeito ou culpa exclusiva do consumidor ou terceiro, conforme o regime. Não basta alegação genérica de ausência de culpa."],["Profissionais liberais","A responsabilidade pessoal dos profissionais liberais por fato do serviço é apurada mediante verificação de culpa, conforme art. 14, § 4º. Essa exceção não se estende automaticamente a toda pessoa jurídica prestadora de serviços. A análise deve identificar quem forneceu o serviço, o defeito e o nexo causal."]],"map":["Fato → acidente e dano","Defeito → segurança esperada","Responsabilidade → objetiva, em regra","Profissional liberal → culpa pessoal"]},{"t":"Vícios de produtos e serviços, garantias e prazos","ref":"CDC, arts. 18 a 27 e 50","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Vício de adequação","Fornecedores de produtos respondem solidariamente pelos vícios de qualidade ou quantidade nos termos do art. 18. Em regra, o fornecedor dispõe de até trinta dias para sanar o vício. Não resolvido, o consumidor escolhe substituição, restituição do preço ou abatimento proporcional. Há situações de exercício imediato previstas no § 3º."],["Vícios de serviços","O art. 20 oferece alternativas como reexecução sem custo adicional, restituição da quantia paga e abatimento proporcional. A disciplina não se confunde integralmente com a do vício de produto. O consumidor deve demonstrar inadequação e a solução depende das circunstâncias e do regime aplicável."],["Decadência e prescrição","O direito de reclamar por vícios aparentes ou de fácil constatação tem prazo decadencial de trinta dias para produtos e serviços não duráveis e noventa para duráveis. No vício oculto, a contagem começa quando evidenciado. A pretensão de reparação por fato do produto ou serviço segue prazo de cinco anos do conhecimento do dano e autoria. Garantia contratual complementa a legal."]],"map":["Vício → inadequação","Reparo do produto → até 30 dias, regra geral","Decadência → 30 ou 90 dias","Fato do consumo → prescrição de 5 anos"]},{"t":"Oferta, publicidade e práticas abusivas","ref":"CDC, arts. 29 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Vinculação da oferta","Informação ou publicidade suficientemente precisa obriga o fornecedor que a fizer veicular ou dela se utilizar e integra o contrato. Se houver recusa de cumprimento, o art. 35 prevê alternativas, incluindo cumprimento forçado, prestação equivalente ou resolução com restituição e eventuais perdas e danos."],["Publicidade enganosa e abusiva","Publicidade enganosa contém informação falsa ou capaz de induzir em erro, inclusive por omissão de dado essencial. Publicidade abusiva viola valores protegidos, como aquela discriminatória ou que explore a deficiência de julgamento da criança. O ônus da prova da veracidade e correção da publicidade cabe a quem a patrocina."],["Práticas comerciais vedadas","O art. 39 proíbe condicionar fornecimento à aquisição de outro produto ou serviço, salvo as distinções legais aplicáveis, e outras práticas abusivas. Envio de produto não solicitado, em regra, equivale a amostra grátis. A cobrança de vantagem manifestamente excessiva exige exame da prática concreta."]],"map":["Oferta precisa → vincula","Enganosa → indução ao erro","Abusiva → valores protegidos","Venda casada → vedação"]},{"t":"Contratos de consumo e cláusulas abusivas","ref":"CDC, arts. 46 a 54","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Conhecimento e interpretação","Contratos não obrigam o consumidor quando não lhe é dada oportunidade de conhecimento prévio ou quando instrumentos dificultam a compreensão de seu sentido e alcance. Cláusulas contratuais devem ser interpretadas de maneira mais favorável ao consumidor, conforme art. 47."],["Cláusulas abusivas","O art. 51 estabelece nulidade de pleno direito de cláusulas abusivas, como aquelas que imponham desvantagem exagerada ou afastem indevidamente responsabilidade legal. A nulidade de uma cláusula não invalida necessariamente todo o contrato, salvo consequências previstas no § 2º."],["Adesão e revisão","Contrato de adesão tem cláusulas previamente estabelecidas sem possibilidade de discussão substancial pelo consumidor. Cláusulas limitativas de direitos exigem destaque. O art. 6º, V, protege modificação de prestações desproporcionais e revisão diante de fatos supervenientes que as tornem excessivamente onerosas."]],"map":["Prévio conhecimento → exigência","Interpretação → favorável ao consumidor","Abusividade → nulidade","Adesão → destaque de limitações"]},{"t":"Comércio eletrônico e direito de arrependimento","ref":"CDC, art. 49; Decreto 7.962/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Contratação a distância","O comércio eletrônico exige informação clara sobre fornecedor, produto, despesas adicionais e condições integrais da oferta. O Decreto 7.962/2013 prevê mecanismos para correção de erros antes da contratação, confirmação da aceitação e atendimento facilitado."],["Arrependimento","Nas contratações fora do estabelecimento comercial, o art. 49 prevê prazo de sete dias a partir da assinatura ou do recebimento do produto ou serviço, conforme o caso. O direito não exige demonstração de defeito. Valores pagos a qualquer título durante o prazo de reflexão devem ser devolvidos nos termos legais."],["Atendimento e cancelamento","O fornecedor deve disponibilizar meios adequados para exercício do arrependimento, inclusive pela mesma ferramenta utilizada para contratação, sem prejuízo de outros meios. O cancelamento de contratos acessórios vinculados segue a disciplina regulamentar. Não confunda arrependimento com garantia por vício."]],"map":["E-commerce → transparência","Fora do estabelecimento → art. 49","Arrependimento → 7 dias","Devolução → valores pagos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/decreto/d7962.htm"},{"t":"Cobrança de dívidas e cadastros de consumidores","ref":"CDC, arts. 42 a 44","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Cobrança legítima e abuso","O consumidor inadimplente não pode ser exposto ao ridículo nem submetido a ameaça ou constrangimento. O fornecedor pode buscar satisfação de crédito legítimo por meios lícitos. A existência de dívida não afasta deveres de respeito, privacidade e adequação dos contatos de cobrança."],["Repetição do indébito","O consumidor cobrado indevidamente que paga valor em excesso tem direito à repetição em dobro, acrescida de correção e juros legais, salvo engano justificável. A jurisprudência do STJ considera a boa-fé objetiva, observadas as condições e modulação temporal pertinentes. Cobrança sem pagamento não gera automaticamente repetição de valor inexistente."],["Cadastros e correção","O consumidor tem acesso a dados cadastrais e respectivas fontes. Informações devem ser objetivas, claras e verdadeiras. Dados negativos não podem referir-se a período superior a cinco anos, observadas as regras legais. A abertura de cadastro não solicitada deve ser comunicada por escrito e dados inexatos podem ser corrigidos."]],"map":["Cobrança → sem constrangimento","Pagamento indevido → repetição conforme requisitos","Cadastro → informação e acesso","Negativação → limite legal"]},{"t":"Crédito responsável e superendividamento","ref":"CDC, arts. 54-A a 54-G e 104-A a 104-C; Lei 14.181/2021","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Conceito e prevenção","Superendividamento é impossibilidade manifesta de consumidor pessoa natural, de boa-fé, pagar a totalidade das dívidas de consumo exigíveis e vincendas sem comprometer o mínimo existencial, nos termos da regulamentação. O regime possui exclusões, como dívidas contraídas mediante fraude ou má-fé nas condições legais."],["Crédito responsável","O fornecedor deve informar custos, encargos, consequências do inadimplemento e avaliar responsavelmente as condições de crédito. É vedado ocultar riscos ou assediar consumidores para contratar, especialmente em situações de vulnerabilidade agravada. A proteção não significa proibição geral de concessão de crédito."],["Repactuação","O processo de repactuação permite audiência conciliatória com credores abrangidos e proposta de plano de pagamento em até cinco anos, preservado o mínimo existencial e observadas exclusões do art. 104-A. Frustrada a conciliação, existem mecanismos judiciais próprios. Nem toda dívida é incluída e o valor regulamentar do mínimo existencial deve ser conferido na data aplicável."]],"map":["Boa-fé → requisito","Crédito → informação e avaliação","Mínimo existencial → preservação","Plano → até 5 anos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14181.htm"},{"t":"Tutela individual, coletiva e sistema de defesa","ref":"CDC, arts. 55 a 60 e 81 a 104","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Tutela administrativa","O Sistema Nacional de Defesa do Consumidor articula órgãos públicos e entidades de defesa. Procons exercem atribuições administrativas, inclusive fiscalização e sanções nos limites de competência. Sanção administrativa não se confunde com indenização civil nem exclui outras medidas cabíveis."],["Direitos difusos, coletivos e individuais homogêneos","Direitos difusos são transindividuais indivisíveis de titulares indeterminados ligados por circunstâncias de fato. Coletivos em sentido estrito envolvem grupo, categoria ou classe ligados por relação jurídica base. Individuais homogêneos decorrem de origem comum, permitindo tutela coletiva conforme a lei."],["Legitimidade e acesso à Justiça","O art. 82 atribui legitimidade coletiva ao Ministério Público, entes públicos, entidades administrativas específicas e associações que atendam requisitos legais. A ação individual por responsabilidade do fornecedor pode ser proposta no domicílio do autor conforme art. 101, I. A coisa julgada coletiva segue regras diferenciadas conforme a espécie de direito."]],"map":["Procon → atuação administrativa","Difuso → titulares indeterminados","Coletivo estrito → relação jurídica base","Homogêneo → origem comum"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l7347compilada.htm"}];const consumerQuestions=/*BANK:consumerQuestions*/null;const ecaModules=[{"t":"Proteção integral, prioridade absoluta e conceitos","ref":"ECA, arts. 1º a 6º; CF, art. 227","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Sujeitos de direitos","A doutrina da proteção integral reconhece crianças e adolescentes como titulares de direitos, considerando seu desenvolvimento. O Estatuto utiliza o critério etário para distinguir criança, pessoa com menos de doze anos, de adolescente, pessoa entre doze e dezoito anos. A aplicação excepcional a pessoas de dezoito a vinte e um anos depende de previsão expressa."],["Prioridade absoluta","Família, comunidade, sociedade e poder público compartilham deveres de proteção. A prioridade repercute na prestação de socorro, no atendimento por serviços públicos, na formulação de políticas e na destinação privilegiada de recursos. Não significa autorização para ignorar garantias processuais."],["Interpretação e interesse superior","As normas devem ser interpretadas considerando fins sociais, exigências do bem comum, direitos e deveres e condição peculiar de pessoa em desenvolvimento. O interesse superior orienta a avaliação individualizada das medidas, com respeito à participação e à autonomia progressiva."]],"map":["Criança → menos de 12 anos","Adolescente → 12 a menos de 18","Prioridade → atendimento e políticas","Proteção integral → sujeito de direitos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direitos à vida, saúde, liberdade e dignidade","ref":"ECA, arts. 7º a 18-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Vida e saúde","A proteção à vida e à saúde compreende políticas que permitam nascimento e desenvolvimento saudáveis, atendimento integral e respeito às necessidades específicas. O cuidado com gestantes e recém-nascidos integra o sistema protetivo. A concretização desses direitos exige atuação articulada dos serviços de saúde."],["Liberdade, respeito e dignidade","Liberdade abrange, nos termos legais, opinião, expressão, crença, brincadeira, convivência e participação. O respeito protege integridade física, psíquica e moral, imagem, identidade e autonomia. A condição de pessoa em desenvolvimento não retira a titularidade desses direitos."],["Educação sem violência","O Estatuto assegura educação e cuidado sem castigo físico ou tratamento cruel ou degradante. As medidas aplicáveis aos responsáveis devem observar a situação e a gravidade, sem excluir outras providências legais. Suspeitas ou confirmações de maus-tratos exigem comunicação aos órgãos competentes."]],"map":["Saúde → atendimento integral","Respeito → integridade e identidade","Liberdade → participação","Cuidado → sem castigo físico"]},{"t":"Convivência familiar, acolhimento e poder familiar","ref":"ECA, arts. 19 a 24 e 101","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Convivência familiar e comunitária","A convivência na família é protegida como regra, em ambiente que favoreça desenvolvimento integral. Família substituta e acolhimento possuem pressupostos específicos. A falta de recursos materiais, isoladamente, não constitui motivo suficiente para perda ou suspensão do poder familiar."],["Acolhimento protetivo","O acolhimento institucional e familiar são medidas provisórias e excepcionais. Não equivalem a privação de liberdade nem a punição. A situação deve ser acompanhada e reavaliada judicialmente nos prazos legais, buscando reintegração familiar ou solução substitutiva quando cabível."],["Poder familiar","O poder familiar envolve deveres de cuidado, sustento, guarda e educação. Sua suspensão ou perda exige decisão judicial, contraditório e fundamentos legais. A intervenção estatal deve considerar proteção, proporcionalidade e os recursos de apoio disponíveis à família."]],"map":["Família de origem → proteção prioritária","Pobreza isolada → não basta para destituição","Acolhimento → provisório e excepcional","Perda do poder familiar → decisão judicial"]},{"t":"Família substituta: guarda, tutela e adoção","ref":"ECA, arts. 28 a 52-D","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Guarda e tutela","A colocação em família substituta pode ocorrer por guarda, tutela ou adoção, institutos distintos. Guarda impõe assistência material, moral e educacional, nos termos legais. Tutela pressupõe o regime jurídico correspondente e implica dever de guarda. A escolha deve considerar a situação da criança e seus vínculos."],["Adoção e requisitos","A adoção é excepcional e irrevogável, observadas as regras do Estatuto. O adotante deve ter pelo menos dezoito anos e ser, em regra legal, ao menos dezesseis anos mais velho que o adotando. Ascendentes e irmãos do adotando não podem adotá-lo. O procedimento judicial exige análise do melhor interesse."],["Consentimento e efeitos","O consentimento dos pais ou representante legal é exigido nas hipóteses legais, ressalvadas situações de dispensa. O adotando com mais de doze anos deve consentir. A adoção constitui vínculo de filiação com igualdade de direitos, inclusive sucessórios, observados impedimentos matrimoniais e demais efeitos legais."]],"map":["Família substituta → três modalidades","Adotante → mínimo de 18 anos","Diferença etária → 16 anos, regra legal","Adoção → filiação e irrevogabilidade"]},{"t":"Educação, profissionalização e prevenção","ref":"ECA, arts. 53 a 85; CF, art. 7º, XXXIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Direito à educação","O acesso à educação deve respeitar igualdade de condições de acesso e permanência, respeito pelos educadores e participação. A oferta do ensino obrigatório é dever estatal e direito público subjetivo. Pais ou responsáveis possuem dever de matrícula nos termos da legislação."],["Profissionalização e aprendizagem","A proteção do trabalho deve ser lida conforme a Constituição: veda-se trabalho antes dos dezesseis anos, salvo aprendizagem a partir dos quatorze. Menores de dezoito anos não podem exercer trabalho noturno, perigoso ou insalubre. A profissionalização deve preservar frequência escolar e desenvolvimento."],["Prevenção especial","O Estatuto disciplina acesso a diversões, espetáculos, produtos e serviços conforme idade e risco, além de regras de viagem e hospedagem. A classificação indicativa e as autorizações pertinentes devem ser estudadas segundo o regime específico, sem confundir proteção com restrição arbitrária."]],"map":["Educação → acesso e permanência","Ensino obrigatório → direito público subjetivo","Aprendizagem → a partir de 14","Menor de 18 → sem trabalho noturno, perigoso ou insalubre"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Política de atendimento e Conselho Tutelar","ref":"ECA, arts. 86 a 97 e 131 a 140","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Rede de proteção","A política de atendimento articula ações governamentais e não governamentais dos entes federativos. Conselhos de direitos, serviços de saúde, educação, assistência e órgãos de justiça possuem atribuições complementares. Municipalização e participação social orientam a organização do sistema."],["Natureza do Conselho Tutelar","O Conselho Tutelar é órgão permanente e autônomo, de natureza não jurisdicional, encarregado de zelar pelo cumprimento dos direitos. Cada Município e Região Administrativa do Distrito Federal deve contar com, no mínimo, um Conselho composto por cinco membros escolhidos pela população local conforme a lei."],["Atribuições e limites","O Conselho aplica medidas protetivas nas hipóteses de sua competência, atende responsáveis, requisita serviços e encaminha casos às autoridades competentes. Não possui atribuição para condenar criminalmente nem decretar perda do poder familiar. Suas decisões podem ser revistas pela autoridade judiciária a pedido de interessado legítimo."]],"map":["Rede → articulação","Conselho Tutelar → autônomo e não jurisdicional","Composição → cinco membros","Decisões → revisão judicial cabível"]},{"t":"Medidas de proteção e intervenção","ref":"ECA, arts. 98 a 102 e 129","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Hipóteses de aplicação","Medidas protetivas destinam-se a situações de ameaça ou violação de direitos por ação ou omissão da sociedade ou do Estado, falta, omissão ou abuso dos responsáveis ou em razão da própria conduta da criança ou adolescente. Seu objetivo é proteger direitos, não impor punição automática."],["Critérios de intervenção","As medidas consideram necessidades pedagógicas, fortalecimento de vínculos, proporcionalidade, intervenção precoce e mínima e privacidade. Podem ser aplicadas isolada ou cumulativamente e substituídas quando necessário. A criança ou adolescente deve ser ouvido e participar conforme sua capacidade."],["Medidas e responsáveis","Encaminhamento aos pais ou responsáveis, orientação, matrícula e inclusão em serviços são exemplos de providências. Medidas dirigidas aos responsáveis possuem disciplina no art. 129. A retirada do convívio familiar exige observância das competências e garantias específicas, inclusive nas situações urgentes."]],"map":["Ameaça ou violação → proteção","Intervenção → proporcional e mínima","Medidas → isoladas ou cumulativas","Participação → escuta adequada"]},{"t":"Ato infracional, garantias e medidas socioeducativas","ref":"ECA, arts. 103 a 128; Lei 12.594/2012","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Ato infracional e idade","Ato infracional é conduta descrita como crime ou contravenção penal. Pessoas menores de dezoito anos são penalmente inimputáveis e sujeitas ao regime especial, considerando a idade na data do fato. À criança autora de ato infracional aplicam-se medidas protetivas, e ao adolescente podem ser aplicadas medidas socioeducativas segundo os requisitos legais."],["Medidas socioeducativas","Advertência, obrigação de reparar dano, prestação de serviços à comunidade, liberdade assistida, semiliberdade e internação integram o regime. A escolha considera capacidade de cumprimento, circunstâncias e gravidade, além das garantias. A internação possui caráter excepcional, breve e sujeito a hipóteses legais."],["Execução e SINASE","O SINASE disciplina execução e acompanhamento das medidas socioeducativas, com planejamento individual e garantia de direitos. A internação não possui prazo determinado na sentença, mas está sujeita a reavaliação periódica, limite geral de três anos e liberação compulsória aos vinte e um anos, conforme o art. 121."]],"map":["Idade → data do fato","Criança → proteção","Adolescente → regime socioeducativo","Internação → excepcionalidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12594.htm"},{"t":"Justiça da infância, procedimentos e garantias","ref":"ECA, arts. 141 a 197-E; Lei 13.431/2017","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Acesso à justiça","A criança e o adolescente têm acesso ao Ministério Público, à Defensoria Pública e ao Poder Judiciário, por seus órgãos competentes. A representação e assistência observam o regime jurídico pertinente. O segredo de justiça e a proteção de dados devem respeitar as regras aplicáveis."],["Apuração de ato infracional","O adolescente tem direito ao devido processo legal, conhecimento da atribuição, defesa técnica, produção de provas e demais garantias. A remissão possui regimes distintos conforme o momento processual e pode excluir, suspender ou extinguir o processo nos termos legais, sem implicar necessariamente reconhecimento de responsabilidade."],["Escuta especializada e depoimento especial","A Lei 13.431/2017 organiza a garantia de direitos de crianças e adolescentes vítimas ou testemunhas de violência. Escuta especializada ocorre perante órgão da rede de proteção, limitada ao necessário à finalidade; depoimento especial é o procedimento de oitiva perante autoridade policial ou judiciária. Ambos visam evitar revitimização."]],"map":["Acesso → órgãos de justiça","Defesa técnica → garantia","Remissão → efeitos conforme fase","Escuta ≠ depoimento especial"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13431.htm"},{"t":"Crimes, infrações administrativas e proteção digital","ref":"ECA, arts. 225 a 258-C; Lei 15.211/2025; Decreto 12.880/2026","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Responsabilização e prevenção","O ECA prevê crimes e infrações administrativas específicos de proteção à infância e adolescência. É necessário identificar tipo legal, sujeito, conduta e regime de responsabilização, sem confundir infração administrativa com crime. Alterações legislativas recentes exigem consulta à redação consolidada antes de memorizar penas."],["Estatuto Digital","A Lei 15.211/2025 dispõe sobre proteção de crianças e adolescentes em ambientes digitais, incluindo deveres de prevenção, segurança e informação para produtos ou serviços de tecnologia direcionados a esse público ou de acesso provável por ele. O Decreto 12.880/2026 regulamenta a lei e institui política nacional de promoção e proteção de direitos no ambiente digital."],["Proteção de dados e participação","O tratamento de dados e a experiência digital devem considerar melhor interesse, privacidade, proteção integral e segurança, juntamente com a LGPD e as normas pertinentes. Medidas de proteção não eliminam liberdade de expressão, participação e demais direitos. Estude os deveres de plataformas e responsáveis conforme legislação e regulamentação vigentes."]],"map":["Crime ≠ infração administrativa","ECA Digital → Lei 15.211/2025","Regulamentação → Decreto 12.880/2026","Ambiente digital → melhor interesse e segurança"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm"}];const ecaQuestions=/*BANK:ecaQuestions*/null;const philosophyModules=[{"t":"Direito, moral, justiça e validade","ref":"Filosofia jurídica: natureza do Direito","url":"https://plato.stanford.edu/entries/lawphil-nature/","lessons":[["Problemas fundamentais","A filosofia jurídica investiga o que torna uma norma jurídica, por que ela pode gerar razões para agir e como se relaciona com a justiça. Distingue-se da dogmática que sistematiza normas vigentes, embora dialogue com ela. Perguntar se uma lei existe é diferente de perguntar se merece obediência."],["Validade, eficácia e justiça","Validade trata dos critérios pelos quais uma norma integra um ordenamento; eficácia diz respeito ao cumprimento e aplicação efetivos; justiça envolve avaliação normativa de seu conteúdo. Uma norma pode ser válida e pouco eficaz, ou válida e injusta, dependendo da teoria adotada."],["Direito e moral","Direito e moral orientam condutas, mas não coincidem necessariamente. A existência de sanções institucionais não esgota a explicação da normatividade jurídica. As teorias divergem sobre o papel de critérios morais na identificação do Direito, sem que a divergência implique aprovação de normas injustas."]],"map":["Validade → pertencimento jurídico","Eficácia → observância","Justiça → avaliação normativa","Direito e moral → relação controversa"]},{"t":"Justiça clássica: Platão e Aristóteles","ref":"Platão, A República; Aristóteles, Ética a Nicômaco, livro V","url":"https://plato.stanford.edu/entries/aristotle-ethics/","lessons":[["Platão e a ordem justa","Na República, Platão investiga a justiça na cidade e na alma por meio da analogia entre suas partes. A justiça liga-se à organização harmônica e ao exercício adequado das funções. A discussão não se limita a punir violações individuais; examina a estrutura da vida coletiva."],["Justiça distributiva e corretiva","Aristóteles diferencia distribuição de bens e encargos segundo proporções relevantes da correção de desequilíbrios nas relações entre pessoas. A primeira utiliza proporcionalidade geométrica; a segunda busca restaurar igualdade mediante correção, independentemente da posição social na relação considerada."],["Equidade","A generalidade das leis pode deixar situações singulares inadequadamente disciplinadas. A equidade aristotélica corrige essa insuficiência quando a aplicação literal da regra geral não atende à finalidade da justiça. Não equivale à licença para ignorar leis por preferência pessoal."]],"map":["Platão → harmonia","Aristóteles → justiça distributiva","Corretiva → restabelecimento da igualdade","Equidade → correção da generalidade"]},{"t":"Jusnaturalismo e contratualismo","ref":"Tomás de Aquino, Suma Teológica, I-II; Hobbes, Locke e Rousseau","url":"https://plato.stanford.edu/entries/natural-law-ethics/","lessons":[["Direito natural","A tradição jusnaturalista sustenta a existência de padrões de razão prática ou justiça que não dependem unicamente da criação estatal. Em Tomás de Aquino, a lei natural é compreendida na relação entre razão humana e lei eterna. As versões modernas de direito natural apresentam fundamentos diferentes e não formam uma teoria única."],["Hobbes e segurança","No Leviatã, Hobbes apresenta a instituição da autoridade política como resposta à insegurança do estado de natureza. O pacto estabelece uma ordem comum capaz de garantir paz e proteção. O argumento não exige afirmar que um contrato histórico tenha sido literalmente assinado por todos."],["Locke e Rousseau","Locke destaca direitos naturais e governo limitado, legitimado pelo consentimento e orientado à proteção de direitos. Rousseau distingue vontade geral, voltada ao interesse comum, da simples soma de interesses particulares. Ambos utilizam a ideia de contrato social, com concepções distintas de liberdade e legitimidade."]],"map":["Jusnaturalismo → padrões de justiça","Hobbes → segurança e autoridade","Locke → direitos e governo limitado","Rousseau → vontade geral"],"extraUrl":"https://plato.stanford.edu/entries/contractarianism/"},{"t":"Kant, autonomia e utilitarismo","ref":"Kant, Fundamentação da Metafísica dos Costumes; Bentham e Mill","url":"https://plato.stanford.edu/entries/kant-moral/","lessons":[["Autonomia e imperativo categórico","Para Kant, a moralidade exige que a vontade se determine por princípios racionais, não apenas por desejos ou consequências esperadas. O imperativo categórico não depende de um objetivo contingente. A universalização examina se a máxima da ação pode valer como lei universal."],["Humanidade como fim","A formulação da humanidade exige tratar a humanidade em si e nos demais sempre também como fim, nunca apenas como meio. Isso não proíbe relações de cooperação ou contratos, mas impede reduzir a pessoa a mero instrumento. A distinção entre legalidade externa e motivação moral é relevante em sua filosofia."],["Utilitarismo","Bentham e Mill vinculam a avaliação moral às consequências para a felicidade ou bem-estar. Mill distingue qualidades dos prazeres. A comparação com Kant mostra a diferença entre justificar ações por consequências agregadas e fundamentá-las em deveres e princípios, sem presumir que todos os utilitaristas defendam decisões idênticas."]],"map":["Kant → autonomia","Imperativo categórico → incondicional","Humanidade → fim em si","Utilitarismo → consequências para bem-estar"],"extraUrl":"https://plato.stanford.edu/entries/utilitarianism-history/"},{"t":"Positivismo jurídico: Hans Kelsen","ref":"Hans Kelsen, Teoria Pura do Direito","url":"https://plato.stanford.edu/entries/lawphil-theory/","lessons":[["Pureza metodológica","Kelsen propõe estudar a especificidade normativa do Direito sem reduzir a ciência jurídica à sociologia, à política ou à avaliação moral. Essa separação metodológica não significa que os juristas ou cidadãos devam aprovar toda lei, nem que fenômenos sociais sejam inexistentes."],["Estrutura escalonada","Uma norma recebe fundamento de validade de outra norma superior que disciplina sua produção. A cadeia de fundamentação não se confunde com sequência cronológica de fatos. A norma fundamental é pressuposta para compreender a validade do ordenamento; não é um texto promulgado por uma autoridade acima da Constituição."],["Validade e eficácia","A eficácia global do ordenamento é condição de sua validade na construção kelseniana, sem ser o fundamento normativo de validade de cada regra. A ciência jurídica descreve normas e suas relações. O reconhecimento de uma norma válida não constitui automaticamente um juízo de justiça."]],"map":["Pureza → método","Validade → fundamento normativo","Grundnorm → pressuposição","Eficácia → condição, não identidade"]},{"t":"H. L. A. Hart e a estrutura das regras","ref":"H. L. A. Hart, O Conceito de Direito","url":"https://plato.stanford.edu/entries/legal-positivism/","lessons":[["Regras primárias e secundárias","Hart explica sistemas jurídicos como união de regras primárias, que orientam condutas e impõem deveres, e secundárias, que tratam da identificação, mudança e aplicação de regras. A combinação responde a dificuldades de sistemas baseados apenas em deveres costumeiros."],["Regra de reconhecimento","A regra de reconhecimento estabelece critérios utilizados pelas autoridades para identificar normas jurídicas válidas. Sua existência relaciona-se a práticas sociais aceitas pelos agentes oficiais. Diferentemente da norma fundamental de Kelsen, ela não é descrita simplesmente como pressuposição transcendental."],["Textura aberta","A linguagem possui casos centrais e situações marginais em que a aplicação da regra não é evidente. A textura aberta ajuda a explicar escolhas judiciais em casos difíceis. Isso não implica que toda decisão seja livre de limites, nem que a incerteza esteja presente igualmente em todas as situações."]],"map":["Primárias → deveres","Secundárias → reconhecimento, mudança e julgamento","Reconhecimento → prática oficial","Textura aberta → casos de incerteza"]},{"t":"Dworkin e o Direito como integridade","ref":"Ronald Dworkin, Levando os Direitos a Sério; O Império do Direito","url":"https://plato.stanford.edu/entries/legal-reas-interpret/","lessons":[["Regras, princípios e casos difíceis","Dworkin critica a ideia de que o Direito se esgota em regras identificadas por sua origem formal. Princípios também podem oferecer razões jurídicas relevantes, inclusive em casos difíceis. Princípios têm dimensão de peso e podem continuar juridicamente relevantes mesmo quando não prevalecem em um caso."],["Interpretação construtiva","A interpretação busca compreender a prática jurídica sob uma justificação que seja adequada à sua história institucional e moralmente defensável. A relação entre ajuste à prática e justificação é central. Não se trata de aplicar livremente as preferências pessoais do julgador."],["Integridade e coerência","O Direito como integridade procura interpretar decisões e normas como expressão de princípios coerentes de justiça, equidade e devido processo. A metáfora do romance em cadeia ilustra a necessidade de dar continuidade crítica ao trabalho institucional anterior. Direitos individuais não devem ser reduzidos automaticamente à conveniência agregada."]],"map":["Princípios → razões jurídicas","Casos difíceis → interpretação","Ajuste + justificação","Integridade → coerência de princípios"]},{"t":"Alexy, regras, princípios e proporcionalidade","ref":"Robert Alexy, Teoria dos Direitos Fundamentais","url":"https://plato.stanford.edu/entries/constitutionalism/","lessons":[["Mandamentos de otimização","Na formulação de Alexy, princípios são normas que exigem realização na maior medida possível conforme possibilidades fáticas e jurídicas. Regras contêm determinações definitivas dentro de seu âmbito de validade. A distinção não se reduz ao grau de abstração de uma norma."],["Conflitos e colisões","Conflitos entre regras podem ser resolvidos mediante exceção ou invalidação de uma das regras, conforme o sistema. Na colisão entre princípios, a precedência depende das circunstâncias relevantes, sem exigir que o princípio que cede seja declarado inválido. Isso explica a ideia de precedência condicionada."],["Proporcionalidade","A análise inclui adequação do meio ao fim, necessidade em comparação com alternativas igualmente eficazes e menos restritivas, e proporcionalidade em sentido estrito, que examina a relação entre sacrifício e realização dos princípios envolvidos. A ponderação exige explicitação das razões, não preferência intuitiva."]],"map":["Princípios → otimização","Regras → determinações","Colisão → precedência condicionada","Proporcionalidade → adequação, necessidade e ponderação"]},{"t":"Rawls e teorias contemporâneas da justiça","ref":"John Rawls, Uma Teoria da Justiça","url":"https://plato.stanford.edu/entries/rawls/","lessons":[["Posição original e véu de ignorância","Rawls formula uma situação hipotética de escolha dos princípios da justiça para a estrutura básica da sociedade. Sob o véu de ignorância, as partes não conhecem sua posição social, talentos naturais ou concepção particular de bem, embora disponham de conhecimentos gerais relevantes. O recurso busca imparcialidade, não ignorância total."],["Liberdades e igualdade de oportunidades","O primeiro princípio protege um esquema adequado de liberdades básicas iguais, compatível com o mesmo esquema para todos. O segundo envolve igualdade equitativa de oportunidades e princípio da diferença. A igualdade formal de acesso não basta quando barreiras sociais impedem oportunidades efetivas."],["Princípio da diferença","Desigualdades econômicas e sociais devem beneficiar ao máximo os membros menos favorecidos, observadas as prioridades entre princípios e condições de justiça. Rawls não defende simplesmente que toda diferença de renda seja proibida. Sua teoria não deve ser confundida com maximização irrestrita da utilidade agregada."]],"map":["Posição original → escolha hipotética","Véu → imparcialidade","Liberdades básicas → prioridade","Diferença → benefício aos menos favorecidos"]},{"t":"Miguel Reale, hermenêutica e argumentação jurídica","ref":"Miguel Reale, Teoria Tridimensional do Direito; interpretação jurídica","url":"https://enciclopediajuridica.pucsp.br/verbetes/tridimensional-do-direito-teoria/","lessons":[["Fato, valor e norma","Miguel Reale compreende a experiência jurídica por três dimensões relacionadas: fatos sociais, valores que lhes conferem significado e normas que organizam relações. Nenhuma delas, isoladamente, esgota o fenômeno. A teoria não descreve apenas uma lista de elementos independentes."],["Métodos de interpretação","Interpretação literal examina o texto; sistemática considera relações entre normas; histórica investiga contexto de formação; teleológica considera finalidades. Esses métodos podem fornecer razões convergentes ou divergentes. A identificação do método não substitui a justificação de sua pertinência no caso."],["Argumentação e decisão","A argumentação jurídica exige razões controláveis, identificação dos fatos e explicitação das premissas normativas. A subsunção relaciona fatos a uma regra aplicável, mas controvérsias sobre significado ou princípios podem exigir etapas adicionais. Uma decisão bem fundamentada enfrenta argumentos relevantes em vez de recorrer apenas à autoridade do julgador."]],"map":["Reale → fato, valor e norma","Literal → texto","Sistemática → conjunto normativo","Teleológica → finalidade"],"extraUrl":"https://plato.stanford.edu/entries/legal-interpretation/"}];const philosophyQuestions=/*BANK:philosophyQuestions*/null;const electoralModules=[{"t":"Direitos políticos, sufrágio e alistamento","ref":"CF, arts. 14 a 16; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Soberania popular","A soberania popular manifesta-se por sufrágio universal e voto direto e secreto, com valor igual, além de plebiscito, referendo e iniciativa popular. Plebiscito consulta previamente a população; referendo submete ato já produzido à apreciação popular, conforme o regime legal."],["Alistamento e voto","O alistamento e o voto são obrigatórios, em regra, para maiores de dezoito anos, e facultativos para analfabetos, maiores de setenta anos e pessoas de dezesseis a dezoito anos incompletos. Estrangeiros e conscritos durante serviço militar obrigatório não podem alistar-se. Distinga capacidade eleitoral ativa de capacidade passiva."],["Perda, suspensão e anterioridade","A Constituição veda cassação de direitos políticos e enumera hipóteses de perda ou suspensão. O art. 16 estabelece que lei que altere o processo eleitoral entra em vigor na publicação, mas não se aplica à eleição que ocorra até um ano de sua vigência. Essa garantia protege estabilidade das regras do pleito."]],"map":["Sufrágio → soberania popular","Voto facultativo → hipóteses do art. 14","Direitos políticos → art. 15","Anterioridade → art. 16"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm"},{"t":"Justiça Eleitoral: organização e competências","ref":"CF, arts. 118 a 121; Código Eleitoral, arts. 12 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm","lessons":[["Estrutura institucional","A Justiça Eleitoral compreende Tribunal Superior Eleitoral, Tribunais Regionais Eleitorais, juízes e juntas eleitorais. Sua organização combina integrantes de diferentes origens, nos termos constitucionais. O Ministério Público Eleitoral exerce funções próprias, sem integrar a estrutura de órgãos jurisdicionais."],["Funções jurisdicionais e administrativas","A Justiça Eleitoral organiza eleições, administra cadastro eleitoral e resolve controvérsias submetidas à sua competência. Também possui atribuição regulamentar dentro dos limites legais. Resoluções não autorizam criação irrestrita de obrigações ou sanções sem fundamento normativo."],["Competências e recursos","O órgão competente varia segundo circunscrição, cargo disputado e natureza do procedimento. Registro de candidatura presidencial é apreciado originariamente pelo TSE; registros para cargos municipais, em regra, pelos juízos eleitorais. A recorribilidade das decisões dos tribunais segue os limites constitucionais e legais."]],"map":["TSE → órgão superior","TRE → circunscrição regional","Juízes e juntas → competências legais","MP Eleitoral → atuação própria"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Elegibilidade, inelegibilidades e Lei da Ficha Limpa","ref":"CF, art. 14, §§ 3º a 9º; LC 64/1990; LC 219/2025","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp64compilado.htm","lessons":[["Condições de elegibilidade","Nacionalidade brasileira, pleno exercício dos direitos políticos, alistamento, domicílio eleitoral na circunscrição, filiação partidária e idade mínima constitucional integram as condições. As idades variam por cargo. A presença dessas condições não dispensa exame das causas de inelegibilidade."],["Inelegibilidades constitucionais e legais","Inalistáveis e analfabetos são inelegíveis. Existem restrições relativas a reeleição, parentesco e exercício de cargos públicos. A LC 64/1990 prevê outras hipóteses, complementadas pela Lei da Ficha Limpa. Inelegibilidade não equivale necessariamente à perda ou suspensão de todos os direitos políticos."],["Atualização da LC 219/2025","A LC 219 modificou a duração e os marcos temporais de determinadas inelegibilidades, além de instituir o Requerimento de Declaração de Elegibilidade. Não existe um único termo inicial aplicável indistintamente a todas as causas. Identifique a alínea pertinente, a data dos fatos e as normas e decisões vigentes para o pleito."]],"map":["Elegibilidade → condições cumulativas","Inelegibilidade → restrição à candidatura","Ficha Limpa → LC 64 atualizada","LC 219 → prazos e RDE"],"extraUrl":"https://planalto.gov.br/ccivil_03/leis/lcp/lcp219.htm"},{"t":"Partidos políticos, federações e registro de candidatura","ref":"CF, art. 17; Leis 9.096/1995 e 9.504/1997","url":"https://www.planalto.gov.br/ccivil_03/leis/l9096.htm","lessons":[["Autonomia partidária","Os partidos possuem autonomia organizacional nos limites constitucionais, devem respeitar o regime democrático e têm caráter nacional. Após aquisição de personalidade jurídica na forma civil, registram seus estatutos no TSE. O registro partidário não se confunde com registro individual de candidatura."],["Federações e coligações","Federações partidárias permitem atuação conjunta segundo regras legais, com abrangência nacional e permanência mínima de quatro anos. Coligações são admitidas nas eleições majoritárias, mas vedadas nas proporcionais. A distinção repercute na atuação parlamentar, registro e distribuição de cadeiras."],["Convenções e registro","A escolha de candidaturas ocorre mediante procedimentos partidários e convenções conforme o calendário legal. O registro examina documentação e requisitos de elegibilidade. Nas eleições proporcionais, a legislação impõe percentual mínimo de candidaturas de cada sexo, com consequências jurídicas para fraudes."]],"map":["Partido → autonomia com limites","Federação → atuação conjunta duradoura","Coligação → majoritária","Registro → requisitos e documentação"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm"},{"t":"Sistemas eleitorais, votação e diplomação","ref":"CF, arts. 28, 29, 45, 46 e 77; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm","lessons":[["Sistema majoritário","No sistema majoritário, a eleição depende da maioria exigida para o cargo. Presidência, governos estaduais e prefeituras de municípios com mais de duzentos mil eleitores submetem-se ao regime constitucional de dois turnos quando necessário. Senadores são eleitos pelo princípio majoritário."],["Sistema proporcional","Deputados federais, estaduais, distritais e vereadores são eleitos pelo sistema proporcional. A distribuição das cadeiras envolve votos válidos, quocientes e regras de sobras, incluindo critérios de votação individual. Consulte o Código Eleitoral e decisões do STF aplicáveis, evitando memorizar fórmulas desatualizadas."],["Apuração e diplomação","A apuração verifica votos segundo o sistema aplicável. A diplomação reconhece formalmente os eleitos e suplentes nos termos legais e não equivale à posse. Impugnações de registro, diploma e mandato possuem objetos e prazos próprios."]],"map":["Presidente e governador → majoritário","Deputados e vereadores → proporcional","Prefeitura → segundo turno nas hipóteses constitucionais","Diplomação ≠ posse"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Propaganda eleitoral, internet e inteligência artificial","ref":"Lei 9.504/1997, arts. 36 a 58; Resolução TSE 23.610/2019, atualizada em 2026","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm","lessons":[["Propaganda e pré-campanha","A propaganda eleitoral é admitida após 15 de agosto do ano eleitoral. A pré-campanha permite manifestações nas hipóteses do art. 36-A, respeitada a vedação ao pedido explícito de voto e aos meios proibidos. A análise considera contexto, modalidade e conteúdo da comunicação."],["Internet e impulsionamento","A publicidade eleitoral na internet segue regras de autoria, identificação, impulsionamento e responsabilidade. Contratação paga não é permitida indistintamente: deve observar as exceções e requisitos legais. O direito de resposta possui regime próprio; a liberdade de expressão não exclui responsabilização por ilícitos."],["Conteúdo sintético em 2026","A Resolução TSE 23
