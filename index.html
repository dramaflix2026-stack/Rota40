tes ou incidentais. A antecipação não deve ser concedida quando houver perigo de irreversibilidade de seus efeitos, ressalvadas questões interpretativas do caso concreto."],["Estabilização e revisão","A estabilização tem disciplina própria no art. 304 para tutela antecipada antecedente. Não se confunde com coisa julgada material. É necessário estudar a impugnação pertinente, a extinção do processo e a ação destinada a rever, reformar ou invalidar a medida, considerando a jurisprudência."]],"map":["Urgência → probabilidade + perigo","Cautelar → proteção","Antecipada → satisfação provisória","Evidência → hipóteses legais"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Procedimento comum e resposta do réu","ref":"CPC, arts. 318 a 357","lessons":[["Petição inicial e saneamento","A inicial deve identificar partes, fundamentos, pedido e demais requisitos legais. Quando defeitos sanáveis dificultam o exame do mérito, o juiz indica o que deve ser corrigido e concede prazo legal de emenda. Indeferimento não é a primeira opção diante de vício corrigível."],["Conciliação e contestação","A audiência de conciliação ou mediação possui hipóteses legais de dispensa. O prazo de contestação é de quinze dias úteis, mas seu termo inicial depende da situação do art. 335. O réu deve concentrar matérias defensivas, sem prejuízo das exceções legais."],["Reconvenção e revelia","A reconvenção permite ao réu formular pretensão própria conexa à ação ou fundamento da defesa. A revelia não implica vitória automática do autor: a presunção de veracidade possui exceções e não dispensa o exame jurídico dos pedidos."]],"map":["Inicial → requisitos e emenda","Contestação → 15 dias úteis","Reconvenção → pretensão própria","Revelia ≠ procedência automática"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Provas, audiência e saneamento","ref":"CPC, arts. 357 a 484","lessons":[["Ônus da prova","Em regra, o autor prova os fatos constitutivos de seu direito e o réu os fatos impeditivos, modificativos ou extintivos. A redistribuição judicial deve ser fundamentada e permitir à parte cumprir o encargo; não pode criar prova impossível ou excessivamente difícil."],["Meios de prova","Documentos, testemunhas, perícia e depoimento têm finalidades distintas. A prova pericial trata de questões que demandam conhecimento técnico, mas o juiz não está automaticamente vinculado ao laudo. Deve fundamentar a apreciação das provas e evitar diligências inúteis ou protelatórias."],["Organização do processo","O saneamento delimita questões controvertidas, resolve pendências processuais, define meios de prova e distribuição do ônus, e designa audiência quando necessária. A definição dos fatos relevantes torna a instrução mais eficiente."]],"map":["Autor → fato constitutivo","Réu → fato impeditivo/modificativo/extintivo","Redistribuição → decisão fundamentada","Saneamento → delimitação"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Sentença e coisa julgada","ref":"CPC, arts. 485 a 508","lessons":[["Resolução do mérito","A extinção sem mérito e o julgamento de mérito têm efeitos distintos. Acolhimento ou rejeição do pedido, reconhecimento de prescrição ou decadência e homologações previstas no art. 487 são decisões de mérito. A ausência de pressuposto processual pode gerar extinção sem mérito."],["Fundamentação e congruência","A sentença deve apresentar fundamentação adequada e observar os limites da demanda. Não basta citar norma ou precedente sem demonstrar sua relação com a controvérsia. O juiz não pode conceder objeto diverso ou quantidade superior ao pedido, observadas as regras legais de interpretação."],["Coisa julgada","A coisa julgada material protege decisão de mérito não mais sujeita a recurso. Em regra, os motivos da decisão não fazem coisa julgada por si. Questões prejudiciais podem adquirir essa autoridade quando preenchidos os requisitos do art. 503. A ação rescisória tem hipóteses específicas."]],"map":["Art. 485 → sem mérito","Art. 487 → mérito","Congruência → limites do pedido","Coisa julgada → decisão de mérito definitiva"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Recursos e precedentes","ref":"CPC, arts. 926 a 928 e 994 a 1.044","lessons":[["Sistema recursal","O recurso adequado depende da espécie de pronunciamento e da hipótese legal. Apelação impugna sentença; agravo de instrumento impugna interlocutórias nas hipóteses pertinentes; agravo interno questiona decisão monocrática do relator. O prazo recursal geral é de quinze dias úteis, exceto embargos de declaração, de cinco."],["Agravo e taxatividade mitigada","O art. 1.015 lista hipóteses de agravo. No Tema 988, o STJ admite seu cabimento fora do rol quando esperar pela apelação tornar inútil o exame da matéria, em razão da urgência. Não equivale a permitir agravo contra qualquer interlocutória."],["Embargos e precedentes","Embargos de declaração corrigem obscuridade, contradição, omissão ou erro material, interrompendo o prazo para outros recursos. A aplicação de precedentes exige identificar a razão determinante e a aderência do caso. Recurso especial e extraordinário possuem requisitos próprios."]],"map":["Sentença → apelação","Interlocutória → art. 1.015 e Tema 988","Embargos → 5 dias úteis","Prazo recursal geral → 15 dias úteis"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","extraUrl":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=988&cod_tema_inicial=988&novaConsulta=true&tipo_pesquisa=T"},{"t":"Cumprimento de sentença e execução","ref":"CPC, arts. 513 a 538, 771 a 925","lessons":[["Título e técnica executiva","O cumprimento de sentença realiza obrigação reconhecida em título judicial. A execução autônoma pode basear-se em título extrajudicial. Identifique certeza, liquidez e exigibilidade, natureza da obrigação e meio de satisfação adequado."],["Pagamento voluntário","No cumprimento definitivo de sentença por quantia certa contra devedor privado, a intimação para pagar inicia prazo de quinze dias. Não havendo pagamento voluntário, incidem multa e honorários de dez por cento cada sobre o montante pertinente. A Fazenda Pública e os alimentos possuem procedimentos próprios."],["Defesa e penhora","A impugnação é a defesa típica do cumprimento de sentença; embargos à execução são próprios da execução extrajudicial. A penhora deve respeitar regras de impenhorabilidade e efetividade. Menor onerosidade não autoriza frustrar a satisfação do credor, devendo o executado indicar alternativa eficaz quando pertinente."]],"map":["Título judicial → cumprimento","Extrajudicial → execução autônoma","Pagamento → prazo do art. 523","Defesa → impugnação ou embargos"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Procedimentos especiais e ações autônomas","ref":"CPC, arts. 539 a 770 e 966 a 975","lessons":[["Consignação e monitória","A consignação permite depositar a prestação quando presentes os requisitos de direito material. A ação monitória permite ao titular de prova escrita sem eficácia de título executivo buscar a satisfação das obrigações previstas no art. 700. Não se confunde com execução direta."],["Possessórias e família","As ações possessórias distinguem manutenção, reintegração e interdito proibitório conforme turbação, esbulho ou ameaça. O procedimento de família estimula solução consensual, sem afastar garantias, proteção de vulneráveis e análise de eventual violência."],["Ação rescisória","A desconstituição de decisão de mérito transitada em julgado exige hipótese legal do art. 966, com exceções expressas para certas decisões sem mérito. Não é novo recurso para simples inconformismo. O prazo geral é de dois anos contado do trânsito em julgado da última decisão proferida no processo, observadas regras especiais."]],"map":["Consignação → depósito da prestação","Monitória → prova escrita sem título executivo","Esbulho → reintegração","Rescisória → hipóteses legais"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"}];const processCivilQuestions=[{"id":4001,"s":3,"module":0,"topic":"Normas fundamentais e jurisdição","difficulty":"Intermediária","q":"O juiz pretende decidir com fundamento jurídico ainda não debatido, cognoscível de ofício, sem hipótese excepcional. Como deve proceder?","a":["Decidir imediatamente","Dar às partes oportunidade de manifestação","Consultar somente o autor","Extinguir o processo automaticamente"],"ok":1,"e":"O art. 10 protege as partes contra decisão baseada em fundamento sobre o qual não puderam se manifestar, inclusive quando examinável de ofício.","src":"CPC, arts. 1º a 20","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4002,"s":3,"module":0,"topic":"Normas fundamentais e jurisdição","difficulty":"Intermediária","q":"Após o ajuizamento regular da demanda, a movimentação ordinária do processo depende sempre de pedido expresso das partes?","a":["Sim, inclusive para toda intimação","Sim, salvo autorização do réu","Não, o impulso é oficial, ressalvadas as exceções legais","Não, porque a iniciativa inicial também é sempre do juiz"],"ok":2,"e":"O art. 2º distingue iniciativa da parte e desenvolvimento por impulso oficial.","src":"CPC, arts. 1º a 20","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4003,"s":3,"module":1,"topic":"Competência e partes","difficulty":"Intermediária","q":"As partes convencionam transferir a demanda para órgão incompetente em razão da matéria. A convenção é válida?","a":["Sim, se escrita","Sim, se houver duas testemunhas","Sim, se o réu concordar","Não, essa competência é inderrogável por convenção"],"ok":3,"e":"O art. 62 torna inderrogável por convenção a competência em razão da matéria, da pessoa ou da função.","src":"CPC, arts. 42 a 76","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4004,"s":3,"module":1,"topic":"Competência e partes","difficulty":"Intermediária","q":"Verificada irregularidade sanável de representação processual, qual a providência inicial prevista?","a":["Suspender o processo e conceder prazo razoável para sanar o vício","Julgar imediatamente improcedente","Aplicar multa criminal","Desconsiderar definitivamente a parte"],"ok":0,"e":"O art. 76 prevê suspensão e prazo razoável de saneamento, com consequências específicas se a providência não for cumprida.","src":"CPC, arts. 42 a 76","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4005,"s":3,"module":2,"topic":"Atos processuais, citação e prazos","difficulty":"Intermediária","q":"Um prazo processual judicial de cinco dias é fixado em dias. Qual regra de contagem se aplica?","a":["Somente dias úteis","Dias corridos em qualquer hipótese","Somente sábados","Somente dias úteis quando o réu pedir"],"ok":0,"e":"O art. 219 determina contagem em dias úteis para prazos processuais expressos em dias.","src":"CPC, arts. 188 a 275","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4006,"s":3,"module":2,"topic":"Atos processuais, citação e prazos","difficulty":"Intermediária","q":"O réu comparece espontaneamente ao processo apesar de falta de citação válida. Qual efeito prevê o CPC?","a":["Extinção imediata","Anulação obrigatória de todos os atos","Comparecimento sem efeito jurídico","Supre a falta ou nulidade da citação, fluindo daí o prazo legal"],"ok":3,"e":"O art. 239, § 1º, estabelece o suprimento da falta ou nulidade pelo comparecimento espontâneo e o início do prazo de contestação ou embargos à execução.","src":"CPC, arts. 188 a 275","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4007,"s":3,"module":3,"topic":"Tutelas provisórias","difficulty":"Intermediária","q":"Qual conjunto de pressupostos caracteriza a tutela de urgência do art. 300?","a":["Certeza absoluta e trânsito em julgado","Probabilidade do direito e perigo de dano ou risco ao resultado útil","Somente existência de contrato escrito","Unicamente a vontade do autor"],"ok":1,"e":"O art. 300 exige probabilidade e perigo de dano ou risco à utilidade do processo.","src":"CPC, arts. 294 a 311","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4008,"s":3,"module":3,"topic":"Tutelas provisórias","difficulty":"Intermediária","q":"Em uma hipótese expressa do art. 311, é indispensável provar perigo de dano para obter tutela da evidência?","a":["Sim, em todos os casos","Sim, apenas se houver réu particular","Não, a tutela da evidência dispensa esse requisito","Sim, salvo consentimento do réu"],"ok":2,"e":"A tutela da evidência pode ser concedida independentemente da demonstração de perigo, desde que presentes os requisitos da hipótese legal.","src":"CPC, arts. 294 a 311","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4009,"s":3,"module":4,"topic":"Procedimento comum e resposta do réu","difficulty":"Intermediária","q":"Uma inicial possui defeito sanável que dificulta o julgamento. Qual a providência prevista no art. 321?","a":["Conceder quinze dias para emenda, indicando o que corrigir","Indeferir sempre de imediato","Conceder apenas 24 horas","Julgar o mérito sem intimar"],"ok":0,"e":"O art. 321 exige indicação precisa do vício e oportunidade de emenda em quinze dias.","src":"CPC, arts. 318 a 357","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4010,"s":3,"module":4,"topic":"Procedimento comum e resposta do réu","difficulty":"Intermediária","q":"O réu deseja apresentar pretensão própria conexa à ação do autor no procedimento comum. Qual instrumento é adequado?","a":["Embargos de declaração","Agravo interno","Habeas data","Reconvenção"],"ok":3,"e":"O art. 343 permite reconvenção para pretensão própria conexa à ação principal ou ao fundamento da defesa.","src":"CPC, arts. 318 a 357","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4011,"s":3,"module":5,"topic":"Provas, audiência e saneamento","difficulty":"Intermediária","q":"O réu alega pagamento integral da obrigação cobrada. Pela regra geral, a quem cabe provar esse fato extintivo?","a":["Ao juiz","Ao réu","Ao autor em qualquer hipótese","Ao Ministério Público"],"ok":1,"e":"O art. 373, II, atribui ao réu o ônus dos fatos impeditivos, modificativos ou extintivos do direito do autor.","src":"CPC, arts. 357 a 484","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4012,"s":3,"module":5,"topic":"Provas, audiência e saneamento","difficulty":"Intermediária","q":"Diante de laudo pericial, o magistrado é obrigado a adotar suas conclusões sem avaliação?","a":["Sim, sempre","Sim, se o perito for servidor","Não; deve valorar e fundamentar sua conclusão","Sim, salvo acordo escrito das partes"],"ok":2,"e":"Os arts. 371 e 479 preveem apreciação fundamentada da prova, incluindo os motivos para considerar ou afastar conclusões periciais.","src":"CPC, arts. 357 a 484","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4013,"s":3,"module":6,"topic":"Sentença e coisa julgada","difficulty":"Intermediária","q":"O juiz reconhece prescrição da pretensão, após observar as garantias processuais aplicáveis. Qual natureza da decisão?","a":["Sem resolução do mérito","Mero despacho","Decisão exclusivamente administrativa","Com resolução do mérito"],"ok":3,"e":"O art. 487, II, inclui decisão sobre prescrição ou decadência entre as hipóteses de resolução do mérito.","src":"CPC, arts. 485 a 508","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4014,"s":3,"module":6,"topic":"Sentença e coisa julgada","difficulty":"Intermediária","q":"Em regra, os motivos de uma sentença fazem coisa julgada por si mesmos?","a":["Não, mesmo que relevantes para determinar o alcance do dispositivo","Sim, todos os motivos sempre","Sim, desde que o autor concorde","Sim, apenas se citarem precedente"],"ok":0,"e":"O art. 504, I, exclui os motivos da coisa julgada; a questão prejudicial tem disciplina específica no art. 503.","src":"CPC, arts. 485 a 508","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4015,"s":3,"module":7,"topic":"Recursos e precedentes","difficulty":"Intermediária","q":"Uma sentença contém omissão sobre pedido expressamente formulado. Qual recurso específico permite suprir a omissão?","a":["Embargos de declaração","Agravo interno","Recurso ordinário constitucional necessariamente","Ação popular"],"ok":0,"e":"O art. 1.022, II, prevê embargos para suprir omissão; o art. 1.023 estabelece o prazo de cinco dias.","src":"CPC, arts. 926 a 928 e 994 a 1.044","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4016,"s":3,"module":7,"topic":"Recursos e precedentes","difficulty":"Intermediária","q":"Segundo o Tema 988 do STJ, quando pode caber agravo de instrumento fora do rol literal do art. 1.015?","a":["Em toda decisão sem exceção","Quando a parte preferir recorrer imediatamente","Quando houver urgência porque aguardar a apelação tornaria inútil o exame","Somente com concordância do juiz"],"ok":2,"e":"A tese repetitiva adota taxatividade mitigada vinculada à urgência decorrente da inutilidade do exame posterior.","src":"STJ, Tema Repetitivo 988","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=988&cod_tema_inicial=988&novaConsulta=true&tipo_pesquisa=T"},{"id":4017,"s":3,"module":8,"topic":"Cumprimento de sentença e execução","difficulty":"Intermediária","q":"No cumprimento definitivo de sentença por quantia certa contra devedor privado, não ocorre pagamento voluntário no prazo do art. 523. Quais acréscimos legais incidem?","a":["Somente multa de 2%","Multa de 10% e honorários de 10%","Multa de 50% sem honorários","Nenhum acréscimo"],"ok":1,"e":"O art. 523, § 1º, prevê multa de dez por cento e honorários de dez por cento; pagamento parcial restringe a incidência ao restante.","src":"CPC, arts. 513 a 538, 771 a 925","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4018,"s":3,"module":8,"topic":"Cumprimento de sentença e execução","difficulty":"Intermediária","q":"Qual defesa típica do executado em execução fundada em título extrajudicial?","a":["Contestação obrigatória","Embargos de declaração","Recurso extraordinário imediato","Embargos à execução"],"ok":3,"e":"O art. 914 prevê oposição à execução por embargos, independentemente de penhora, depósito ou caução.","src":"CPC, arts. 513 a 538, 771 a 925","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4019,"s":3,"module":9,"topic":"Procedimentos especiais e ações autônomas","difficulty":"Intermediária","q":"Um credor possui prova escrita de dívida em dinheiro, sem eficácia executiva. Qual ação específica pode utilizar, presentes os demais requisitos?","a":["Ação monitória","Habeas corpus","Ação rescisória","Mandado de injunção"],"ok":0,"e":"O art. 700 permite monitória baseada em prova escrita sem eficácia de título executivo para exigir as obrigações nele previstas.","src":"CPC, arts. 539 a 770 e 966 a 975","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4020,"s":3,"module":9,"topic":"Procedimentos especiais e ações autônomas","difficulty":"Intermediária","q":"Qual o prazo geral para propor ação rescisória, ressalvadas hipóteses especiais?","a":["Trinta dias","Seis meses","Dois anos do trânsito em julgado da última decisão proferida no processo","Dez anos do ajuizamento original"],"ok":2,"e":"O art. 975 estabelece prazo decadencial geral de dois anos e disciplina exceções específicas.","src":"CPC, arts. 539 a 770 e 966 a 975","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"}];const penalModules=[{"t":"Princípios e aplicação da lei penal","ref":"CP, arts. 1º a 12","lessons":[["Legalidade e anterioridade","A criação de crimes e penas depende de lei anterior ao fato. A interpretação da norma deve respeitar os limites da legalidade; analogia prejudicial ao acusado não pode criar incriminação. Diferencie a data de publicação da lei de sua entrada em vigor."],["Lei penal no tempo","A lei posterior que deixa de considerar o fato criminoso faz cessar a execução e os efeitos penais da condenação, sem eliminar automaticamente os efeitos civis. A norma posterior mais favorável retroage inclusive após trânsito em julgado. Leis temporárias e excepcionais têm ultratividade nos termos do art. 3º."],["Tempo e lugar do crime","Para o tempo do crime, o Código adota a teoria da atividade: considera-se o momento da ação ou omissão. Para o lugar, adota a ubiquidade, abrangendo o local da conduta e aquele onde o resultado ocorreu ou deveria ocorrer. Territorialidade e extraterritorialidade obedecem a pressupostos distintos."]],"map":["Legalidade → lei anterior","Lei mais benéfica → retroatividade","Tempo → atividade","Lugar → ubiquidade"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Teoria do crime: fato típico, dolo e culpa","ref":"CP, arts. 13, 18 a 20","lessons":[["Estrutura do delito","Na concepção analítica tripartida, o crime é estudado pela tipicidade, ilicitude e culpabilidade. A tipicidade envolve adequação da conduta ao tipo penal e, quando necessário, resultado e nexo causal. Nem todo resultado danoso constitui crime: é preciso examinar os elementos do tipo."],["Causalidade e omissão","Nos crimes materiais, o resultado deve ser imputável à conduta segundo os critérios legais. O art. 13 disciplina a causa superveniente relativamente independente que, por si só, produz o resultado. Na omissão imprópria, a relevância penal pressupõe dever e possibilidade de agir nas condições do § 2º."],["Dolo, culpa e erro de tipo","Dolo abrange querer o resultado ou assumir seu risco; culpa envolve imprudência, negligência ou imperícia. A modalidade culposa exige previsão legal. O erro sobre elemento constitutivo do tipo exclui o dolo, mas permite punição culposa se prevista e presentes os respectivos requisitos."]],"map":["Fato típico → elementos legais","Omissão imprópria → dever e possibilidade","Culpa → previsão expressa","Erro de tipo → exclui dolo"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Consumação, tentativa e desistência","ref":"CP, arts. 14 a 17","lessons":[["Consumação e tentativa","O crime é consumado quando reúne todos os elementos de sua definição legal. A tentativa exige início da execução e ausência de consumação por circunstâncias alheias à vontade do agente. Em regra, a pena do crime consumado é reduzida de um a dois terços, salvo disposição em contrário."],["Desistência voluntária e arrependimento eficaz","Na desistência voluntária, o agente deixa de prosseguir na execução por decisão própria. No arrependimento eficaz, impede voluntariamente o resultado após os atos executórios. Nos dois casos, responde pelos atos já praticados, caso constituam infração penal."],["Arrependimento posterior e crime impossível","O arrependimento posterior exige crime sem violência ou grave ameaça à pessoa, reparação ou restituição por ato voluntário até o recebimento da denúncia ou queixa e enseja redução de pena. Crime impossível exige ineficácia absoluta do meio ou impropriedade absoluta do objeto, não mera dificuldade de consumação."]],"map":["Tentativa → causa alheia à vontade","Desistência → interrupção voluntária","Arrependimento eficaz → impede resultado","Posterior → redução nos requisitos legais"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Ilicitude e culpabilidade","ref":"CP, arts. 21 a 28","lessons":[["Excludentes de ilicitude","Estado de necessidade, legítima defesa, estrito cumprimento de dever legal e exercício regular de direito são hipóteses do art. 23. A legítima defesa exige agressão injusta, atual ou iminente, repelida moderadamente mediante meios necessários. O excesso doloso ou culposo pode gerar responsabilidade."],["Culpabilidade e erro de proibição","Culpabilidade é estudada mediante imputabilidade, potencial consciência da ilicitude e exigibilidade de conduta diversa. O desconhecimento da lei não é escusa. Erro inevitável sobre a ilicitude isenta de pena; erro evitável pode reduzir a pena de um sexto a um terço."],["Imputabilidade e coação","Menores de dezoito anos são penalmente inimputáveis, sujeitos à legislação especial. Doença mental ou desenvolvimento mental incompleto ou retardado pode afastar a imputabilidade nos requisitos do art. 26. Coação irresistível e estrita obediência a ordem não manifestamente ilegal de superior hierárquico seguem o art. 22."]],"map":["Legítima defesa → agressão injusta","Excesso → responsabilidade","Erro inevitável de proibição → isenção","Menor de 18 → inimputabilidade penal"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Concurso de pessoas e concurso de crimes","ref":"CP, arts. 29 a 31 e 69 a 71","lessons":[["Autoria e participação","Quem concorre para o crime incide nas penas a ele cominadas na medida de sua culpabilidade. A participação de menor importância pode reduzir a pena. A responsabilidade deve ser individualizada; vínculo pessoal ou presença no local não substitui a demonstração de contribuição penalmente relevante."],["Circunstâncias e cooperação","Circunstâncias e condições pessoais não se comunicam, salvo quando elementares do crime. Se um concorrente quis participar de crime menos grave, aplica-se a regra do art. 29, § 2º, considerando eventual previsibilidade do resultado mais grave. Ajuste e instigação, por si sós, seguem os limites do art. 31."],["Pluralidade de crimes","Concurso material envolve mais de uma ação ou omissão e dois ou mais crimes, com aplicação cumulativa das penas. Concurso formal decorre de uma só ação ou omissão e pluralidade de crimes, com regimes próprios. Continuidade delitiva pressupõe crimes da mesma espécie e condições semelhantes, além dos requisitos interpretativos pertinentes."]],"map":["Contribuição → culpabilidade individual","Condição pessoal → regra de incomunicabilidade","Material → cumulação","Formal e continuado → regimes próprios"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Penas, dosimetria e extinção da punibilidade","ref":"CP, arts. 32 a 68 e 107 a 120","lessons":[["Espécies e regimes","O Código prevê penas privativas de liberdade, restritivas de direitos e multa. Regime inicial e substituição dependem da pena, reincidência, circunstâncias judiciais e demais requisitos. A substituição não é automática pelo simples fato de a condenação ser inferior a quatro anos."],["Sistema trifásico","Na primeira fase, fixa-se a pena-base conforme circunstâncias judiciais; na segunda, consideram-se agravantes e atenuantes; na terceira, aplicam-se causas de aumento e diminuição. Diferencie qualificadora, que altera a faixa abstrata do delito, de agravante e causa de aumento."],["Punibilidade e prescrição","Morte do agente, anistia, graça, indulto, prescrição, decadência e outras hipóteses do art. 107 podem extinguir punibilidade. O cálculo prescricional depende da fase processual, da pena aplicável, dos marcos interruptivos e de regras especiais. Não aplique um prazo único a todos os delitos."]],"map":["Pena-base → primeira fase","Agravantes/atenuantes → segunda","Majorantes/minorantes → terceira","Prescrição → prazo e marcos legais"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Crimes contra a pessoa","ref":"CP, arts. 121 a 154-B","lessons":[["Vida e integridade","Homicídio e lesão corporal protegem bens jurídicos relacionados à vida e à integridade física. A distinção exige análise do elemento subjetivo e do resultado, sem presumir intenção apenas pela gravidade do dano. O feminicídio passou a tipo autônomo no art. 121-A pela Lei 14.994/2024."],["Honra","Calúnia envolve falsa imputação de fato definido como crime; difamação refere-se à imputação de fato ofensivo à reputação; injúria atinge dignidade ou decoro. A análise da ação penal e das causas especiais exige atenção à legislação vigente, inclusive à disciplina específica de discriminação racial."],["Liberdade individual","Ameaça e constrangimento ilegal são tipos distintos, com elementos próprios. Crimes de perseguição e violência psicológica contra a mulher exigem exame dos requisitos legais. Na prova, identifique precisamente o bem jurídico protegido e a presença de elementos especiais do tipo."]],"map":["Vida → tipos próprios","Feminicídio → art. 121-A","Calúnia → falsa imputação de crime","Difamação ≠ injúria"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14994.htm"},{"t":"Crimes contra o patrimônio","ref":"CP, arts. 155 a 183","lessons":[["Furto e roubo","O furto envolve subtração de coisa alheia móvel. O roubo inclui violência ou grave ameaça à pessoa, ou redução de sua capacidade de resistência nas condições do tipo. A distinção depende dos elementos legais e não simplesmente do valor do bem."],["Apropriação indébita e estelionato","A apropriação indébita pressupõe posse ou detenção anterior da coisa e posterior apropriação indevida. O estelionato exige vantagem ilícita em prejuízo alheio, mediante indução ou manutenção da vítima em erro por fraude. Diferencie a dinâmica jurídica da obtenção do bem, sem tratar todo descumprimento contratual como crime."],["Receptação e ação penal","A receptação tem modalidades e requisitos subjetivos próprios. A ação penal em crimes patrimoniais depende do tipo e das exceções legais, inclusive regras de representação e imunidades familiares. O simples parentesco não afasta automaticamente a responsabilidade em todas as hipóteses."]],"map":["Furto → subtração","Roubo → violência ou grave ameaça, entre outras hipóteses","Apropriação → posse anterior","Estelionato → fraude e erro"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Crimes contra a administração pública","ref":"CP, arts. 312 a 359-H","lessons":[["Funcionário público para fins penais","O art. 327 adota conceito penal próprio, abrangendo exercício transitório ou não remunerado de cargo, emprego ou função pública, além das equiparações legais. Não confunda o conceito penal com a exigência de concurso ou estabilidade."],["Peculato e corrupção","O peculato do art. 312 envolve apropriação ou desvio de bens de que o funcionário tem posse em razão do cargo, entre outras modalidades legais. Corrupção passiva abrange solicitar, receber vantagem indevida ou aceitar promessa nas condições do tipo. A corrupção ativa possui descrição autônoma no art. 333."],["Concussão e prevaricação","Concussão exige a exigência de vantagem indevida em razão da função. Prevaricação envolve retardar, omitir ou praticar indevidamente ato de ofício para satisfazer interesse ou sentimento pessoal. Compare os verbos nucleares e o vínculo entre conduta e função pública."]],"map":["Art. 327 → conceito penal","Peculato → vínculo funcional com bem","Concussão → exigir","Corrupção passiva → solicitar, receber ou aceitar promessa"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Legislação penal especial e temas transversais","ref":"Leis 8.072/1990, 11.340/2006 e 11.343/2006","lessons":[["Crimes hediondos","A Lei 8.072/1990 estabelece rol legal e regimes específicos. A gravidade abstrata de uma conduta não permite, por si só, classificá-la como hedionda. Regras de execução penal e progressão exigem consulta à legislação consolidada, à data do fato e à jurisprudência aplicável."],["Violência doméstica e familiar","A Lei Maria da Penha disciplina prevenção, assistência, proteção e procedimentos próprios em situações de violência doméstica e familiar contra a mulher. As formas de violência não se limitam à física. Medidas protetivas têm regime específico e não dependem necessariamente do ajuizamento de ação penal, conforme a redação legal vigente."],["Lei de drogas e jurisprudência","A Lei 11.343/2006 distingue regimes jurídicos conforme as condutas e circunstâncias legais. É indispensável considerar a decisão do STF no Tema 506 sobre porte de cannabis para consumo pessoal e seus limites, sem estender automaticamente a solução a outras substâncias ou ao tráfico."]],"map":["Hediondez → previsão legal","Maria da Penha → proteção integral","Medidas protetivas → regime próprio","Drogas → lei e precedentes atuais"],"url":"https://www.planalto.gov.br/ccivil_03/leis/l8072.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11340.htm"}];const penalQuestions=[{"id":5001,"s":4,"module":0,"topic":"Princípios e aplicação da lei penal","difficulty":"Intermediária","q":"Uma lei posterior deixa de considerar criminosa determinada conduta. Há condenação definitiva pelo mesmo fato. Qual consequência penal?","a":["A condenação é imutável para todos os efeitos","Cessam a execução e os efeitos penais da condenação","A lei só se aplica a fatos futuros","A pena aumenta automaticamente"],"ok":1,"e":"O art. 2º, caput, estabelece a abolitio criminis, inclusive para condenações definitivas, sem extinguir automaticamente efeitos civis.","src":"CP, arts. 1º a 12","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5002,"s":4,"module":0,"topic":"Princípios e aplicação da lei penal","difficulty":"Intermediária","q":"Qual teoria o Código Penal adota para definir o tempo do crime?","a":["Resultado","Ubiquidade","Atividade","Domicílio da vítima"],"ok":2,"e":"O art. 4º considera praticado o crime no momento da ação ou omissão, ainda que o resultado ocorra em outro momento.","src":"CP, arts. 1º a 12","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5003,"s":4,"module":1,"topic":"Teoria do crime: fato típico, dolo e culpa","difficulty":"Intermediária","q":"O agente incorre em erro sobre elemento constitutivo do tipo penal. Qual o efeito previsto no art. 20?","a":["Exclui o dolo, admitida punição culposa quando prevista e cabível","Exclui necessariamente toda consequência jurídica","Aumenta a pena em dobro","Equivale sempre a erro de proibição"],"ok":0,"e":"O erro de tipo essencial exclui dolo; a modalidade culposa pode subsistir quando legalmente prevista e caracterizada.","src":"CP, arts. 13, 18 a 20","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5004,"s":4,"module":1,"topic":"Teoria do crime: fato típico, dolo e culpa","difficulty":"Intermediária","q":"Quando uma conduta pode ser punida na modalidade culposa, segundo a regra do art. 18?","a":["Em qualquer crime automaticamente","Sempre que houver dano patrimonial","Quando a vítima solicitar","Quando houver previsão expressa em lei"],"ok":3,"e":"O parágrafo único do art. 18 estabelece que, salvo casos expressos em lei, ninguém pode ser punido por fato previsto como crime senão quando o pratica dolosamente.","src":"CP, arts. 13, 18 a 20","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5005,"s":4,"module":2,"topic":"Consumação, tentativa e desistência","difficulty":"Intermediária","q":"Iniciada a execução, o agente voluntariamente deixa de prosseguir. Qual regra incide, presentes os requisitos legais?","a":["Tentativa obrigatória","Desistência voluntária, respondendo pelos atos já praticados","Arrependimento posterior","Consumação presumida"],"ok":1,"e":"O art. 15 disciplina desistência voluntária e arrependimento eficaz, com responsabilidade pelos atos já praticados.","src":"CP, arts. 14 a 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5006,"s":4,"module":2,"topic":"Consumação, tentativa e desistência","difficulty":"Intermediária","q":"Em regra, qual a redução prevista para tentativa, quando não houver disposição especial?","a":["Um sexto","Metade obrigatoriamente","Um a dois terços","Não há redução"],"ok":2,"e":"O art. 14, parágrafo único, prevê diminuição de um a dois terços da pena correspondente ao crime consumado.","src":"CP, arts. 14 a 17","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5007,"s":4,"module":3,"topic":"Ilicitude e culpabilidade","difficulty":"Intermediária","q":"O agente incorre em erro inevitável sobre a ilicitude do fato. Qual efeito?","a":["Majoração obrigatória da pena","Exclusão automática da tipicidade objetiva","Conversão em crime culposo","Isenção de pena"],"ok":3,"e":"O art. 21 prevê isenção de pena para erro inevitável de proibição; se evitável, admite diminuição de um sexto a um terço.","src":"CP, arts. 21 a 28","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5008,"s":4,"module":3,"topic":"Ilicitude e culpabilidade","difficulty":"Intermediária","q":"Uma pessoa de dezessete anos pratica fato descrito como crime. Qual regra constitucional e penal se aplica?","a":["É penalmente inimputável, sujeita à legislação especial","É plenamente imputável pela natureza do fato","A imputabilidade depende apenas da escolaridade","Responde sempre pelo Código Penal como adulta"],"ok":0,"e":"O art. 27 do CP estabelece inimputabilidade penal dos menores de dezoito anos; aplica-se a legislação especial.","src":"CP, arts. 21 a 28","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5009,"s":4,"module":4,"topic":"Concurso de pessoas e concurso de crimes","difficulty":"Intermediária","q":"Em regra, circunstância pessoal de um concorrente comunica-se aos demais?","a":["Sim, em qualquer situação","Não, salvo quando elementar do crime","Sim, apenas em crimes culposos","Não, nem quando elementar"],"ok":1,"e":"O art. 30 determina incomunicabilidade das circunstâncias e condições pessoais, salvo quando elementares.","src":"CP, arts. 29 a 31 e 69 a 71","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5010,"s":4,"module":4,"topic":"Concurso de pessoas e concurso de crimes","difficulty":"Intermediária","q":"Mediante ações distintas, um agente comete dois crimes sem hipótese de continuidade ou outra regra especial. Qual regime geral?","a":["Crime único obrigatório","Concurso formal necessariamente","Concurso material, com aplicação cumulativa das penas","Extinção do segundo crime"],"ok":2,"e":"O art. 69 disciplina concurso material quando mais de uma ação ou omissão produz dois ou mais crimes.","src":"CP, arts. 29 a 31 e 69 a 71","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5011,"s":4,"module":5,"topic":"Penas, dosimetria e extinção da punibilidade","difficulty":"Intermediária","q":"Em qual fase do método trifásico são consideradas agravantes e atenuantes?","a":["Segunda","Primeira","Terceira","Somente na execução penal"],"ok":0,"e":"O art. 68 estabelece pena-base, agravantes e atenuantes e, por último, causas de aumento e diminuição.","src":"CP, arts. 32 a 68 e 107 a 120","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5012,"s":4,"module":5,"topic":"Penas, dosimetria e extinção da punibilidade","difficulty":"Intermediária","q":"Qual evento constitui causa de extinção da punibilidade expressa no art. 107?","a":["Mudança de endereço do réu","Pagamento de qualquer dívida privada","Alteração do advogado","Morte do agente"],"ok":3,"e":"O art. 107, I, prevê morte do agente como causa de extinção da punibilidade.","src":"CP, arts. 32 a 68 e 107 a 120","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5013,"s":4,"module":6,"topic":"Crimes contra a pessoa","difficulty":"Intermediária","q":"Uma pessoa imputa falsamente a outra fato definido como crime, atingindo sua honra. Qual tipo básico corresponde à descrição?","a":["Difamação necessariamente","Calúnia","Ameaça","Dano"],"ok":1,"e":"O art. 138 define calúnia pela falsa imputação de fato definido como crime.","src":"CP, arts. 121 a 154-B","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5014,"s":4,"module":6,"topic":"Crimes contra a pessoa","difficulty":"Intermediária","q":"Após a Lei 14.994/2024, em qual dispositivo do Código Penal está previsto o tipo autônomo de feminicídio?","a":["Art. 129","Art. 155","Art. 121-A","Art. 171"],"ok":2,"e":"A Lei 14.994/2024 introduziu o art. 121-A, tornando o feminicídio crime autônomo. A redação vigente e as causas de aumento devem ser consultadas.","src":"Lei 14.994/2024; CP, art. 121-A","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14994.htm"},{"id":5015,"s":4,"module":7,"topic":"Crimes contra o patrimônio","difficulty":"Intermediária","q":"Qual elemento distingue, em sua descrição típica básica, o roubo do furto simples?","a":["Valor necessariamente superior a um salário mínimo","Existência obrigatória de contrato","Participação de servidor público","Violência ou grave ameaça à pessoa, ou redução de resistência nos termos legais"],"ok":3,"e":"O art. 157 acrescenta elementos coercitivos à subtração, distinguindo-a do furto do art. 155.","src":"CP, arts. 155 a 183","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5016,"s":4,"module":7,"topic":"Crimes contra o patrimônio","difficulty":"Intermediária","q":"Qual tipo pressupõe, em sua configuração básica, apropriar-se de coisa alheia móvel de que o agente já tem posse ou detenção?","a":["Apropriação indébita","Calúnia","Homicídio","Corrupção passiva"],"ok":0,"e":"O art. 168 descreve apropriação indébita, diferenciando-a dos tipos que envolvem subtração ou obtenção mediante fraude.","src":"CP, arts. 155 a 183","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5017,"s":4,"module":8,"topic":"Crimes contra a administração pública","difficulty":"Intermediária","q":"Para fins penais, o exercício transitório e não remunerado de função pública impede o enquadramento como funcionário público?","a":["Sim, sempre","Não; o art. 327 contempla essas situações","Sim, se não houver concurso","Sim, se a pessoa não for estável"],"ok":1,"e":"O art. 327 considera funcionário público quem exerce cargo, emprego ou função pública, ainda que transitoriamente ou sem remuneração.","src":"CP, arts. 312 a 359-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5018,"s":4,"module":8,"topic":"Crimes contra a administração pública","difficulty":"Intermediária","q":"Qual verbo caracteriza especificamente o núcleo da concussão do art. 316?","a":["Difamar","Subtrair","Exigir vantagem indevida em razão da função","Destruir documento privado"],"ok":2,"e":"O art. 316 utiliza o verbo exigir vantagem indevida, em razão da função, distinguindo-se da solicitação prevista na corrupção passiva.","src":"CP, arts. 312 a 359-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"id":5019,"s":4,"module":9,"topic":"Legislação penal especial e temas transversais","difficulty":"Intermediária","q":"As formas de violência previstas na Lei Maria da Penha restringem-se à violência física?","a":["Sim, exclusivamente","Sim, salvo dano patrimonial de grande valor","Sim, quando não houver lesão corporal","Não; incluem, entre outras, violência psicológica, sexual, patrimonial e moral"],"ok":3,"e":"O art. 7º da Lei 11.340/2006 enumera diferentes formas de violência doméstica e familiar contra a mulher.","src":"Lei 11.340/2006, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11340.htm"},{"id":5020,"s":4,"module":9,"topic":"Legislação penal especial e temas transversais","difficulty":"Intermediária","q":"Um delito não consta do rol legal de crimes hediondos nem possui outra previsão legal de equiparação. Sua gravidade, isoladamente, permite classificá-lo como hediondo?","a":["Não, a classificação depende de previsão legal","Sim, por decisão livre do julgador","Sim, se houver repercussão na imprensa","Sim, sempre que a pena superar dois anos"],"ok":0,"e":"A hediondez segue o rol e os critérios legais da Lei 8.072/1990; a gravidade isolada não substitui a previsão legal.","src":"Lei 8.072/1990","url":"https://www.planalto.gov.br/ccivil_03/leis/l8072.htm"}];const processPenalModules=[{"t":"Princípios e sistemas processuais","ref":"CPP, arts. 1º a 3º-A; CF, art. 5º","lessons":[["Estrutura acusatória","A acusação, a defesa e o julgamento exercem funções distintas. A imparcialidade judicial exige que a iniciativa investigativa e a atividade probatória da acusação não sejam substituídas pelo julgador. O art. 3º-A deve ser estudado em conjunto com a interpretação do STF sobre o sistema acusatório."],["Garantias fundamentais","A presunção de inocência impõe que a responsabilidade penal não seja presumida. A defesa técnica e o contraditório são garantias do acusado. O direito ao silêncio não equivale a confissão e não deve fundamentar conclusão desfavorável apenas pelo seu exercício."],["Aplicação da lei processual","A norma processual tem aplicação imediata, preservados os atos validamente realizados segundo a lei anterior. Regras de natureza mista podem exigir análise dos efeitos materiais. Diferencie lei processual pura de norma penal substantiva."]],"map":["Acusação ≠ julgamento","Silêncio → garantia","Presunção → não culpabilidade","Lei processual → aplicação imediata"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Investigação criminal e inquérito policial","ref":"CPP, arts. 4º a 23","lessons":[["Finalidade e características","O inquérito reúne elementos sobre materialidade e autoria para subsidiar a formação da opinião do titular da ação penal. É procedimento investigativo, distinto da instrução judicial. Pode ser dispensado se houver elementos suficientes para acusação, não sendo condição universal da ação."],["Diligências e defesa","A autoridade policial realiza diligências previstas em lei, preservando vestígios e colhendo informações. O investigado pode exercer garantias de defesa e requerer diligências, cuja realização segue o regime legal. A defesa pode acessar elementos documentados que interessem ao exercício defensivo, conforme a Súmula Vinculante 14."],["Encerramento e arquivamento","A autoridade policial elabora relatório e remete os autos à instância competente. Não pode arquivar o inquérito por iniciativa própria. O arquivamento deve observar o art. 28 e a interpretação constitucional aplicável; não se confunde com absolvição judicial."]],"map":["Inquérito → elementos informativos","Dispensável → acusação já fundamentada","Defesa → acesso aos elementos documentados","Delegado → não arquiva"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Ação penal, denúncia, queixa e ANPP","ref":"CPP, arts. 24 a 62; art. 28-A","lessons":[["Titularidade","A ação penal pública é promovida pelo Ministério Público, mediante denúncia. Pode depender de representação ou requisição nos casos legais. A ação privada é proposta mediante queixa por legitimado. A subsidiária da pública é admitida diante de inércia do titular no prazo legal, observadas suas condições."],["Prazos e requisitos","A denúncia ou queixa deve descrever o fato criminoso com suas circunstâncias e identificar o acusado nos termos legais. A representação e a queixa submetem-se, em regra, à decadência de seis meses desde o conhecimento da autoria, com ressalvas. Distinga decadência da vítima dos prazos para oferecer denúncia."],["Acordo de não persecução penal","O ANPP exige avaliação dos requisitos do art. 28-A, entre eles delito sem violência ou grave ameaça e pena mínima inferior a quatro anos, além da adequação do acordo. Há impedimentos, homologação judicial e possibilidade de revisão interna da recusa do MP. A aplicação temporal e a confissão devem considerar precedentes atuais."]],"map":["Pública → denúncia do MP","Privada → queixa","Decadência → regra de 6 meses","ANPP → requisitos cumulativos"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Competência, conexão e continência","ref":"CPP, arts. 69 a 91","lessons":[["Critérios de competência","Lugar da infração, natureza do delito, distribuição, conexão e continência são critérios legalmente previstos. Em regra, o lugar da consumação define a competência territorial; na tentativa, considera-se o último ato executório. Leis especiais e disposições específicas podem modificar essa regra."],["Conexão e continência","A conexão associa infrações relacionadas nas hipóteses do art. 76; a continência decorre das situações do art. 77, como pluralidade de acusados pela mesma infração. A reunião de processos não é absoluta: existem regras de separação obrigatória ou facultativa."],["Competências constitucionais","O Tribunal do Júri julga crimes dolosos contra a vida, ressalvadas regras constitucionais pertinentes. A competência federal decorre das hipóteses constitucionais, não apenas da repercussão do fato. Identifique a competência material antes de aplicar a territorial."]],"map":["Territorial → regra da consumação","Tentativa → último ato executório","Conexão → vínculo entre infrações","Júri → crimes dolosos contra a vida"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Provas e cadeia de custódia","ref":"CPP, arts. 155 a 250","lessons":[["Elementos investigativos e prova judicial","O juiz forma sua convicção com a prova produzida sob contraditório judicial. Elementos informativos da investigação não podem, em regra, fundamentar exclusivamente a decisão, ressalvadas provas cautelares, não repetíveis e antecipadas. Essa distinção protege a possibilidade efetiva de contestar a prova."],["Provas ilícitas e vestígios","Provas obtidas em violação a normas constitucionais ou legais são inadmissíveis, observadas as regras sobre derivação e fonte independente. A cadeia de custódia documenta a história do vestígio desde seu reconhecimento até o descarte. Eventual falha deve ser examinada quanto à confiabilidade e aos efeitos no caso."],["Perícia e reconhecimento","Quando a infração deixa vestígios, o exame de corpo de delito é indispensável nos termos do art. 158; a confissão não o substitui. Reconhecimento pessoal demanda respeito ao procedimento legal e à jurisprudência. A avaliação probatória deve ser fundamentada e considerar a qualidade dos elementos."]],"map":["Contraditório → prova judicial","Ilícita → inadmissibilidade","Vestígio → cadeia de custódia","Corpo de delito → exigência legal"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Prisões, cautelares e liberdade provisória","ref":"CPP, arts. 282 a 350","lessons":[["Prisão em flagrante","O flagrante depende das hipóteses legais e está sujeito a controle judicial. A captura não equivale a condenação, nem autoriza manutenção automática da prisão. A audiência de custódia permite examinar legalidade, integridade e necessidade das medidas cabíveis segundo o regime vigente."],["Prisão preventiva","A preventiva é cautelar, não antecipação da pena. Exige pressupostos, fundamentos concretos, admissibilidade e motivação conforme os arts. 312, 313 e 315. A gravidade abstrata do crime não basta. A disciplina recebeu alterações recentes, especialmente pelas Leis 15.272/2025 e 15.358/2026, que devem integrar a revisão especializada."],["Medidas alternativas","O art. 319 prevê medidas cautelares diversas da prisão. Necessidade e adequação orientam sua escolha. A preventiva é subsidiária quando não for cabível substituição por outra medida cautelar, nos termos do art. 282. Liberdade provisória e relaxamento de prisão ilegal não são o mesmo instituto."]],"map":["Flagrante → controle judicial","Preventiva → fundamentação concreta","Cautelar → necessidade e adequação","Prisão ilegal → relaxamento"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15272.htm"},{"t":"Procedimento comum e resposta à acusação","ref":"CPP, arts. 394 a 405","lessons":[["Escolha do procedimento","O procedimento comum pode ser ordinário, sumário ou sumaríssimo, conforme critérios legais. No ordinário, o parâmetro geral é pena máxima igual ou superior a quatro anos. Procedimentos especiais devem ser considerados antes da aplicação subsidiária das regras comuns."],["Recebimento e defesa","A rejeição da denúncia ou queixa pode decorrer de inépcia manifesta, falta de pressuposto ou condição da ação e ausência de justa causa. Recebida a acusação, a resposta escrita permite apresentar preliminares, argumentos, documentos, requerimentos e rol de testemunhas dentro do prazo legal."],["Instrução e julgamento","A absolvição sumária do art. 397 exige hipótese legal. Na instrução, produzem-se provas e colhem-se declarações conforme a ordem aplicável. O interrogatório é ato de defesa e, no procedimento comum ordinário, ocorre ao final da instrução. A sentença deve apreciar acusação, defesa e provas."]],"map":["Ordinário → pena máxima ≥ 4 anos","Rejeição → art. 395","Resposta → 10 dias","Interrogatório → final da instrução ordinária"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Tribunal do Júri","ref":"CPP, arts. 406 a 497","lessons":[["Duas fases","A primeira fase examina se a acusação deve ser submetida ao Conselho de Sentença. Pode terminar com pronúncia, impronúncia, absolvição sumária ou desclassificação conforme os requisitos legais. A pronúncia não significa condenação e deve limitar a fundamentação ao necessário."],["Plenário e garantias","Na segunda fase, o Conselho de Sentença aprecia os quesitos submetidos, e o juiz presidente exerce atribuições legais. Plenitude de defesa, sigilo das votações e soberania dos veredictos são garantias constitucionais, compatíveis com as hipóteses legais de controle recursal."],["Impronúncia e recursos","A impronúncia ocorre quando faltam os requisitos probatórios para pronunciar o acusado; nova acusação pode ser formulada com prova nova enquanto não extinta a punibilidade. Diferencie o recurso em sentido estrito contra pronúncia da apelação contra impronúncia ou absolvição sumária."]],"map":["Primeira fase → admissibilidade","Pronúncia ≠ condenação","Plenário → quesitos","Impronúncia → possível nova prova"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Nulidades, sentença e recursos","ref":"CPP, arts. 381 a 393 e 563 a 667","lessons":[["Nulidades e prejuízo","A análise de nulidades considera finalidade do ato, prejuízo, momento de arguição e regime aplicável. O art. 563 consagra a regra de que não há declaração de nulidade sem prejuízo para acusação ou defesa. Garantias essenciais podem demandar análise própria conforme jurisprudência."],["Sentença e correlação","A decisão deve enfrentar o fato imputado e os elementos probatórios. Emendatio libelli permite atribuir definição jurídica diversa ao fato descrito sem modificar a narrativa acusatória; mutatio libelli exige procedimento próprio quando emerge elemento fático não contido na acusação."],["Recursos e limites","Apelação e recurso em sentido estrito têm hipóteses específicas. Embargos de declaração permitem corrigir vícios previstos em lei. Quando apenas a defesa recorre, a regra do art. 617 impede agravar a pena; devem ser considerados limites da devolução e peculiaridades do recurso."]],"map":["Nulidade → prejuízo","Emendatio → nova classificação","Mutatio → alteração fática pertinente","Recurso exclusivo da defesa → vedação de piora"],"url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"t":"Juizados especiais, habeas corpus e revisão criminal","ref":"Lei 9.099/1995, arts. 60 a 92; CPP, arts. 621 a 667","lessons":[["Juizados especiais criminais","A Lei 9.099/1995 disciplina infrações de menor potencial ofensivo e mecanismos consensuais. Composição civil e transação penal possuem condições e efeitos distintos. A suspensão condicional do processo usa como parâmetro a pena mínima igual ou inferior a um ano, além de requisitos legais, e pode alcançar crimes fora da competência do Juizado."],["Habeas corpus","O habeas corpus protege a liberdade de locomoção contra ilegalidade ou abuso, tanto em ameaça quanto em restrição existente. A análise exige identificar coação concreta e adequação do remédio. Não é instrumento universal para discutir qualquer direito desvinculado da liberdade de ir e vir."],["Revisão criminal","A revisão criminal permite rediscutir condenação definitiva nas hipóteses legais, como contrariedade ao texto expresso da lei penal ou à evidência dos autos e descoberta de novas provas nos termos do art. 621. Pode ser requerida mesmo após extinção da pena e não pode agravar a situação do condenado."]],"map":["JECRIM → menor potencial ofensivo","Suspensão do processo → pena mínima até 1 ano","HC → locomoção","Revisão → condenação definitiva"],"url":"https://www.planalto.gov.br/ccivil_03/leis/l9099.htm","extraUrl":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"}];const processPenalQuestions=[{"id":6001,"s":5,"module":0,"topic":"Princípios e sistemas processuais","difficulty":"Intermediária","q":"Durante o interrogatório, o acusado decide permanecer em silêncio. Qual consequência pode decorrer exclusivamente dessa escolha?","a":["Confissão ficta","Presunção automática de autoria","Nenhuma interpretação em prejuízo da defesa","Renúncia automática à defesa técnica"],"ok":2,"e":"O art. 186, parágrafo único, estabelece que o silêncio não importa confissão nem pode ser interpretado em prejuízo da defesa.","src":"CPP, arts. 1º a 3º-A; CF, art. 5º","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6002,"s":5,"module":0,"topic":"Princípios e sistemas processuais","difficulty":"Intermediária","q":"Uma nova lei puramente processual entra em vigor durante processo em andamento. Qual a regra geral?","a":["Aplica-se imediatamente, preservando os atos válidos anteriores","Anula todos os atos já praticados","Aplica-se apenas a crimes posteriores","Exige autorização do acusado"],"ok":0,"e":"O art. 2º disciplina aplicação imediata da lei processual sem prejuízo da validade dos atos anteriores.","src":"CPP, arts. 1º a 3º-A; CF, art. 5º","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6003,"s":5,"module":1,"topic":"Investigação criminal e inquérito policial","difficulty":"Intermediária","q":"A autoridade policial conclui que não há elementos suficientes e pretende arquivar o inquérito por decisão própria. Pode fazê-lo?","a":["Sim, em qualquer investigação","Não, o art. 17 veda essa providência","Sim, se a vítima concordar","Sim, após trinta dias"],"ok":1,"e":"O art. 17 impede a autoridade policial de mandar arquivar autos de inquérito.","src":"CPP, arts. 4º a 23","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6004,"s":5,"module":1,"topic":"Investigação criminal e inquérito policial","difficulty":"Intermediária","q":"O Ministério Público dispõe de elementos suficientes de autoria e materialidade obtidos licitamente por outras vias. É sempre obrigatório instaurar inquérito antes da denúncia?","a":["Sim, sem exceção","Sim, mesmo em caso de prova documental suficiente","Sim, salvo autorização do investigado","Não, o inquérito é dispensável quando há suporte suficiente para acusar"],"ok":3,"e":"O inquérito é instrumento informativo. O art. 39, § 5º, exemplifica a possibilidade de dispensa quando a representação contém elementos suficientes.","src":"CPP, arts. 4º a 23","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6005,"s":5,"module":2,"topic":"Ação penal, denúncia, queixa e ANPP","difficulty":"Intermediária","q":"Qual é, em regra, o titular da ação penal pública?","a":["Ministério Público","Juiz criminal","Delegado de polícia","Ofendido diretamente em qualquer hipótese"],"ok":0,"e":"O art. 24 atribui a promoção da ação pública ao Ministério Público mediante denúncia, observadas as condições legais.","src":"CPP, arts. 24 a 62; art. 28-A","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6006,"s":5,"module":2,"topic":"Ação penal, denúncia, queixa e ANPP","difficulty":"Intermediária","q":"Qual limite de pena mínima integra os requisitos legais do ANPP?","a":["Pena máxima inferior a dez anos","Pena mínima igual ou superior a oito anos","Pena mínima inferior a quatro anos","Qualquer pena, sem distinção"],"ok":2,"e":"O art. 28-A utiliza pena mínima inferior a quatro anos, consideradas causas de aumento e diminuição aplicáveis, além dos demais requisitos.","src":"CPP, arts. 24 a 62; art. 28-A","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6007,"s":5,"module":3,"topic":"Competência, conexão e continência","difficulty":"Intermediária","q":"Pela regra geral do CPP, qual local determina a competência territorial em crime consumado?","a":["Residência do advogado","Lugar da consumação da infração","Sede do tribunal superior","Local da prisão, necessariamente"],"ok":1,"e":"O art. 70 estabelece, em regra, competência pelo lugar da consumação, ressalvadas disposições específicas.","src":"CPP, arts. 69 a 91","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6008,"s":5,"module":3,"topic":"Competência, conexão e continência","difficulty":"Intermediária","q":"Duas pessoas são acusadas pela mesma infração, hipótese prevista no art. 77, I. Qual instituto se configura?","a":["Perempção","Decadência","Suspeição","Continência"],"ok":3,"e":"O art. 77, I, prevê continência quando duas ou mais pessoas são acusadas pela mesma infração.","src":"CPP, arts. 69 a 91","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6009,"s":5,"module":4,"topic":"Provas e cadeia de custódia","difficulty":"Intermediária","q":"Em infração que deixa vestígios, estes estão disponíveis para exame. A confissão do acusado substitui o exame de corpo de delito?","a":["Sim, se escrita","Sim, se acompanhada de testemunha","Não, conforme o art. 158","Sim, por decisão discricionária da polícia"],"ok":2,"e":"O art. 158 prevê exame indispensável quando a infração deixa vestígios, sem possibilidade de suprimento pela confissão.","src":"CPP, arts. 155 a 250","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6010,"s":5,"module":4,"topic":"Provas e cadeia de custódia","difficulty":"Intermediária","q":"Qual a finalidade central da cadeia de custódia?","a":["Documentar a trajetória e o controle do vestígio","Substituir a defesa técnica","Criar presunção absoluta de culpa","Impedir a realização de perícia"],"ok":0,"e":"O art. 158-A disciplina procedimentos de preservação e documentação da história cronológica do vestígio.","src":"CPP, arts. 155 a 250","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6011,"s":5,"module":5,"topic":"Prisões, cautelares e liberdade provisória","difficulty":"Intermediária","q":"A decisão de prisão preventiva baseia-se apenas na gravidade abstrata do delito. É suficiente?","a":["Sim, independentemente das circunstâncias","Sim, se houver repercussão pública","Sim, em todo crime doloso","Não, é necessária fundamentação concreta conforme o CPP"],"ok":3,"e":"O art. 312, § 4º, reforça a vedação de preventiva baseada em gravidade abstrata. Devem ser examinados os requisitos e riscos concretos.","src":"CPP, arts. 282 a 350","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6012,"s":5,"module":5,"topic":"Prisões, cautelares e liberdade provisória","difficulty":"Intermediária","q":"Qual princípio orienta a escolha das medidas cautelares segundo o art. 282?","a":["Necessidade e adequação","Aplicação automática da medida mais severa","Presunção de condenação","Obrigatoriedade de prisão em qualquer processo"],"ok":0,"e":"O art. 282 exige necessidade e adequação da medida às circunstâncias legais e do caso.","src":"CPP, arts. 282 a 350","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6013,"s":5,"module":6,"topic":"Procedimento comum e resposta à acusação","difficulty":"Intermediária","q":"Qual o prazo da resposta à acusação previsto no art. 396?","a":["Cinco dias","Dez dias","Quinze dias úteis necessariamente","Trinta dias"],"ok":1,"e":"O art. 396 fixa dez dias para resposta escrita à acusação, observado o regime processual penal.","src":"CPP, arts. 394 a 405","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6014,"s":5,"module":6,"topic":"Procedimento comum e resposta à acusação","difficulty":"Intermediária","q":"Ausente justa causa para o exercício da ação penal, qual providência está prevista no art. 395?","a":["Condenação imediata","Suspensão obrigatória por dez anos","Rejeição da denúncia ou queixa","Recebimento obrigatório"],"ok":2,"e":"O art. 395, III, prevê rejeição por falta de justa causa para o exercício da ação penal.","src":"CPP, arts. 394 a 405","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6015,"s":5,"module":7,"topic":"Tribunal do Júri","difficulty":"Intermediária","q":"Qual recurso é previsto contra decisão de pronúncia?","a":["Recurso em sentido estrito","Agravo de instrumento do CPC","Embargos à execução civil","Recurso administrativo ao MP"],"ok":0,"e":"O art. 581, IV, prevê recurso em sentido estrito contra pronúncia.","src":"CPP, arts. 406 a 497","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6016,"s":5,"module":7,"topic":"Tribunal do Júri","difficulty":"Intermediária","q":"Após impronúncia, surge prova nova antes de extinta a punibilidade. Qual regra prevê o art. 414?","a":["É impossível nova acusação","O acusado é condenado automaticamente","O juiz dispensa nova acusação","Pode ser formulada nova denúncia ou queixa com prova nova"],"ok":3,"e":"O parágrafo único do art. 414 admite nova acusação diante de prova nova enquanto não ocorrer extinção da punibilidade.","src":"CPP, arts. 406 a 497","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6017,"s":5,"module":8,"topic":"Nulidades, sentença e recursos","difficulty":"Intermediária","q":"Segundo a regra geral do art. 563, qual elemento deve ser considerado para declarar nulidade?","a":["A mera vontade de uma testemunha","Prejuízo para acusação ou defesa","O valor econômico da causa","A repercussão na imprensa"],"ok":1,"e":"O art. 563 estabelece a necessidade de prejuízo decorrente da nulidade, sem afastar regimes específicos e garantias fundamentais.","src":"CPP, arts. 381 a 393 e 563 a 667","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6018,"s":5,"module":8,"topic":"Nulidades, sentença e recursos","difficulty":"Intermediária","q":"Somente o réu interpõe apelação. Qual limite o art. 617 estabelece ao tribunal?","a":["Pode sempre dobrar a pena","Deve agravar a pena","Não pode agravar a pena nessa hipótese","Deve extinguir o processo"],"ok":2,"e":"O art. 617 consagra a vedação da reformatio in pejus quando somente o réu apela.","src":"CPP, arts. 381 a 393 e 563 a 667","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"},{"id":6019,"s":5,"module":9,"topic":"Juizados especiais, habeas corpus e revisão criminal","difficulty":"Intermediária","q":"Qual é o parâmetro de pena mínima para suspensão condicional do processo previsto no art. 89 da Lei 9.099/1995?","a":["Igual ou inferior a um ano","Inferior a quatro anos em qualquer caso","Igual ou superior a oito anos","Não existe parâmetro de pena"],"ok":0,"e":"O art. 89 prevê pena mínima cominada igual ou inferior a um ano, além dos demais requisitos.","src":"Lei 9.099/1995, art. 89","url":"https://www.planalto.gov.br/ccivil_03/leis/l9099.htm"},{"id":6020,"s":5,"module":9,"topic":"Juizados especiais, habeas corpus e revisão criminal","difficulty":"Intermediária","q":"Em revisão criminal procedente, pode o tribunal agravar a pena imposta pela decisão revista?","a":["Sim, se o MP pedir","Sim, em qualquer hipótese","Sim, se o condenado já cumpriu a pena","Não, o art. 626 veda agravamento"],"ok":3,"e":"O parágrafo único do art. 626 proíbe agravamento da pena na revisão criminal.","src":"CPP, art. 626","url":"https://planalto.gov.br/ccivil_03/decreto-lei/del3689compilado.htm"}];const adminModules=[{"t":"Princípios e regime jurídico administrativo","ref":"CF, art. 37; Lei 9.784/1999, art. 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Regime jurídico","A administração exerce competências destinadas a fins públicos, sujeita a limites legais e constitucionais. Prerrogativas administrativas não representam poderes ilimitados: exigem finalidade legítima, motivação quando cabível e proporcionalidade. Diferencie a atuação estatal da liberdade de contratar de um particular."],["Princípios constitucionais","Legalidade, impessoalidade, moralidade, publicidade e eficiência orientam os órgãos e entidades administrativas. A publicidade admite restrições juridicamente justificadas para proteger informações sigilosas. A impessoalidade afasta o uso de recursos públicos para promover pessoalmente autoridades."],["Proporcionalidade e segurança jurídica","A escolha administrativa precisa guardar relação com a finalidade da competência. Examine adequação, necessidade e equilíbrio da restrição. A proteção da confiança e da segurança jurídica deve ser considerada na revisão de atos, sem converter toda situação ilegal em direito adquirido."]],"map":["LIMPE → princípios constitucionais","Legalidade → competência e limites","Impessoalidade → finalidade pública","Proporcionalidade → medida necessária"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm"},{"t":"Organização administrativa e entidades","ref":"CF, art. 37, XIX; Decreto-Lei 200/1967","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del0200.htm","lessons":[["Administração direta e indireta","A direta compreende a atuação por órgãos integrantes dos entes políticos. A indireta é composta por entidades com personalidade própria, como autarquias, fundações públicas, empresas públicas e sociedades de economia mista. Órgão não se confunde com pessoa jurídica."],["Desconcentração e descentralização","Desconcentrar é distribuir competências internamente, entre órgãos da mesma pessoa jurídica. Descentralizar envolve atribuir atividade a outra pessoa, por técnica juridicamente adequada. A vinculação de entidade indireta a ministério ou secretaria não estabelece a mesma hierarquia que existe entre órgãos internos."],["Criação e regime","A lei específica cria autarquia e autoriza a instituição de empresa pública, sociedade de economia mista e fundação, conforme art. 37, XIX, observado o regime específico das fundações de direito público. Empresas estatais têm personalidade de direito privado e sujeitam-se a normas públicas pertinentes, inclusive ao regime da Lei 13.303/2016."]],"map":["Órgão → sem personalidade própria","Autarquia → criação por lei específica","Desconcentração → mesma pessoa","Descentralização → outra pessoa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Poderes administrativos e abuso de poder","ref":"Lei 9.784/1999, arts. 2º e 11 a 17; CTN, art. 78","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm","lessons":[["Vinculação e discricionariedade","O ato vinculado tem pressupostos e conteúdo delimitados pela norma. Na discricionariedade, há espaço legal de escolha, sem afastar controle de legalidade. A conveniência administrativa não legitima desvio de finalidade, discriminação ou violação da proporcionalidade."],["Hierarquia, disciplina e regulamentação","O poder hierárquico permite organização e coordenação interna nos limites legais. A competência é irrenunciável, com delegação e avocação nas hipóteses admitidas. O poder disciplinar apura e sanciona infrações ligadas à relação jurídica administrativa, garantindo defesa. A regulamentação não pode criar obrigações além de sua base normativa."],["Polícia e abuso","O poder de polícia limita atividades ou direitos individuais para proteger interesses coletivos conforme lei. Excesso de poder ocorre quando a autoridade ultrapassa sua competência; desvio de finalidade, quando usa competência para fim indevido. Nem todo ato de polícia é autoexecutório."]],"map":["Vinculado → limites definidos","Discricionário → escolha legal","Excesso → competência","Desvio → finalidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"t":"Atos administrativos e controle de validade","ref":"Lei 9.784/1999, arts. 50 e 53 a 55","url":"https://www.planalto.gov.br/ccivil_03/leis/l9784.htm","lessons":[["Elementos do ato","Competência, finalidade, forma, motivo e objeto são categorias clássicas de análise. Motivo corresponde aos pressupostos de fato e direito; motivação é a exposição das razões da decisão. Se o ato declara razões determinantes, sua validade pode depender da veracidade e pertinência dessas razões."],["Anulação e revogação","A anulação combate ilegalidade; a revogação retira ato válido por razões de conveniência e oportunidade, observadas limitações jurídicas. O Judiciário pode controlar a legalidade do ato administrativo quando provocado, mas não substituir livremente a escolha legítima de mérito feita pela administração."],["Convalidação e prazo","Defeitos sanáveis podem ser corrigidos pela administração quando não houver lesão ao interesse público nem prejuízo a terceiros. Na esfera federal, o prazo decadencial para anular atos favoráveis é, em regra, de cinco anos, salvo má-fé comprovada. Nem todo vício admite convalidação."]],"map":["Motivo ≠ motivação","Ilegal → anulação","Válido inconveniente → revogação","Vício sanável → possível convalidação"]},{"t":"Agentes públicos e servidores","ref":"CF, arts. 37 a 41; Lei 8.112/1990","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Ingresso e vínculos","Cargo efetivo, emprego público, cargo em comissão e contratação temporária têm regimes diferentes. O concurso é regra de ingresso em cargos e empregos, ressalvados cargos em comissão definidos em lei e outras hipóteses constitucionais. A contratação temporária atende necessidade temporária de excepcional interesse público nos termos legais."],["Estabilidade e acumulação","A estabilidade do art. 41 protege servidor nomeado para cargo efetivo por concurso após três anos de exercício e avaliação especial. A acumulação remunerada é excepcional e exige compatibilidade de horários, observadas as hipóteses constitucionais vigentes. Confira a redação atual do art. 37, XVI, especialmente após a EC 138/2025."],["Responsabilidade e processo disciplinar","Responsabilidades civil, penal e administrativa podem coexistir, com repercussões específicas entre as instâncias. O processo disciplinar deve garantir contraditório e ampla defesa. A Lei 8.112 rege servidores federais abrangidos por ela, não constitui automaticamente estatuto de todos os entes."]],"map":["Concurso → regra","Comissão → direção, chefia e assessoramento","Estabilidade → requisitos do art. 41","Disciplina → defesa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm"},{"t":"Licitações e contratações diretas","ref":"Lei 14.133/2021, arts. 17, 28, 33 e 72 a 75","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","lessons":[["Planejamento e fases","A contratação começa pela identificação da necessidade, planejamento e definição do objeto. A Lei 14.133 organiza fases como preparação, divulgação, propostas, julgamento, habilitação, recurso e homologação, admitindo alterações de ordem nos requisitos legais. Modalidade não se confunde com critério de julgamento."],["Modalidades e critérios","Pregão, concorrência, concurso, leilão e diálogo competitivo são as modalidades previstas no art. 28. O pregão é empregado para bens e serviços comuns conforme o regime legal. Os critérios de julgamento variam com o objeto, como menor preço, maior desconto e técnica e preço."],["Dispensa e inexigibilidade","A inexigibilidade decorre da inviabilidade de competição; a dispensa permite contratação direta nas hipóteses legais. Ambas exigem instrução apropriada, incluindo justificativas e verificação de requisitos. Valores-limite de dispensa sofrem atualização, portanto devem ser conferidos antes de uso."]],"map":["Modalidade ≠ critério","Pregão → bens e serviços comuns","Inexigibilidade → competição inviável","Dispensa → hipótese legal"]},{"t":"Contratos administrativos","ref":"Lei 14.133/2021, arts. 89 a 154","url":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","lessons":[["Formalização e prerrogativas","Contratos administrativos possuem cláusulas obrigatórias e regras de publicidade. A administração dispõe de prerrogativas como fiscalização e alterações unilaterais nas condições previstas em lei. Essas prerrogativas não permitem desrespeitar direitos do contratado ou alterar livremente qualquer cláusula."],["Equilíbrio econômico-financeiro","O equilíbrio protege a relação inicial entre encargos e remuneração. Reajuste, repactuação e restabelecimento do equilíbrio são instrumentos distintos, com pressupostos próprios. Alterações unilaterais que afetem encargos devem preservar o equilíbrio nos termos legais."],["Execução e extinção","A gestão e fiscalização acompanham entrega, qualidade, prazos e obrigações. Inexecução pode levar a sanções ou extinção contratual, observados procedimento, motivação e defesa. A sanção de impedimento e a declaração de inidoneidade têm alcances e requisitos diferentes."]],"map":["Fiscalização → execução","Prerrogativas → limites legais","Equilíbrio → encargos e remuneração","Sanções → processo e defesa"]},{"t":"Serviços públicos e delegação","ref":"CF, art. 175; Lei 8.987/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l8987compilada.htm","lessons":[["Titularidade e prestação","O poder público é responsável pela prestação dos serviços de sua competência. Pode executá-los diretamente ou delegar a execução nas hipóteses constitucionais. A delegação não transfere automaticamente a titularidade estatal do serviço nem elimina a fiscalização."],["Concessão e permissão","A concessão envolve delegação mediante licitação, por prazo determinado e por conta e risco do concessionário, conforme lei. A permissão é delegação a título precário, formalizada segundo o regime legal. Não confunda ambas com simples contratação de fornecimento ao Estado."],["Serviço adequado e extinção","Regularidade, continuidade, eficiência, segurança e modicidade tarifária compõem a avaliação do serviço adequado, entre outros requisitos legais. Encampação é retomada por interesse público durante o prazo, com condições próprias; caducidade decorre de inadimplemento do concessionário nas hipóteses legais."]],"map":["Titularidade → poder público","Concessão → delegação e licitação","Serviço adequado → requisitos legais","Encampação ≠ caducidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Responsabilidade civil do Estado e bens públicos","ref":"CF, art. 37, § 6º; Código Civil, arts. 98 a 103","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","
