</style></head><body><div id="root"></div><script>
const subjects=['Ética Profissional','Direito Constitucional','Direito Civil','Processo Civil','Direito Penal','Processo Penal','Direito Administrativo','Direito Tributário','Direito do Trabalho','Processo do Trabalho','Direito Empresarial','Direitos Humanos','Direito Ambiental','Direito Internacional','Direito do Consumidor','ECA','Filosofia do Direito','Direito Eleitoral','Direito Financeiro','Direito Previdenciário'];
const qs=[{id:1,s:1,q:'Segundo a Constituição Federal, qual é o prazo de validade de um concurso público?',a:['Até um ano, sem prorrogação','Até dois anos, prorrogável uma vez por igual período','Sempre quatro anos','Indeterminado'],ok:1,e:'O art. 37, III, da Constituição prevê validade de até dois anos, prorrogável uma vez por igual período.',src:'Constituição Federal, art. 37, III',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'},{id:2,s:2,q:'Em regra, em qual idade cessa a menoridade civil?',a:['16 anos','21 anos','18 anos completos','25 anos'],ok:2,e:'O art. 5º do Código Civil prevê que a menoridade cessa aos dezoito anos completos, ressalvadas as hipóteses legais de emancipação.',src:'Código Civil, art. 5º',url:'https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm'},{id:3,s:4,q:'Qual princípio impede que uma conduta seja considerada crime sem lei anterior que a defina?',a:['Legalidade penal','Publicidade','Eficiência','Contraditório'],ok:0,e:'O art. 1º do Código Penal estabelece que não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal.',src:'Código Penal, art. 1º',url:'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'},{id:4,s:0,q:'Qual instituição é indispensável à administração da justiça nos termos do art. 133 da Constituição?',a:['A advocacia','O registro de imóveis','A junta comercial','O tribunal de contas'],ok:0,e:'A Constituição afirma a indispensabilidade do advogado à administração da justiça, nos limites da lei.',src:'Constituição Federal, art. 133',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'}];
const ethicsModules=[{"t":"Atividade da advocacia e mandato","ref":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Atividades privativas","Distinga representação processual de consultoria, assessoria e direção jurídicas. O bacharelado não substitui a inscrição profissional. A impetração de habeas corpus é expressamente excluída do rol de atividades privativas. Não generalize a exigência de advogado para todos os procedimentos: há exceções legais e constitucionais."],["Mandato e urgência","A procuração demonstra os poderes recebidos. Quando a urgência impede sua apresentação imediata, o profissional pode agir e regularizar a representação no prazo legal de quinze dias, prorrogável por igual período. Na renúncia, a assistência permanece por dez dias após a notificação, salvo substituição anterior."],["Aplicação prática","Em uma questão sobre prazo processual iminente, identifique urgência, regularização e prova da comunicação ao cliente. Renunciar não equivale a abandonar o processo. Compare o prazo de apresentação da procuração com o período de continuidade da representação."]],"map":["Atuação privativa → inscrição","Habeas corpus → exceção","Urgência → 15 + 15 dias","Renúncia → notificação + 10 dias"]},{"t":"Inscrição, inscrição suplementar e licenciamento","ref":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Ingresso profissional","A inscrição exige os requisitos do art. 8º, entre eles habilitação acadêmica, aprovação no Exame de Ordem, idoneidade moral, capacidade civil e ausência de atividade incompatível. O compromisso perante o Conselho também integra o procedimento."],["Inscrição principal e suplementar","A principal relaciona-se ao domicílio profissional. A atuação habitual em outra unidade federativa exige inscrição suplementar. Para esse efeito, habitualidade corresponde à intervenção judicial em mais de cinco causas por ano no território de outro Conselho."],["Licenciamento ou cancelamento","Licenciamento é afastamento temporário nas hipóteses legais; cancelamento encerra a inscrição. A atividade incompatível temporária é exemplo de licenciamento; incompatibilidade definitiva é hipótese de cancelamento. O número anterior não é restabelecido automaticamente em nova inscrição."]],"map":["Inscrição → requisitos cumulativos","Principal → domicílio profissional","Suplementar → mais de 5 causas/ano","Licença temporária ≠ cancelamento"]},{"t":"Direitos e prerrogativas profissionais","ref":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Independência e respeito","As funções de magistratura, Ministério Público e advocacia têm atribuições distintas, sem subordinação hierárquica entre elas. Prerrogativas protegem a atuação profissional e o direito de defesa, não constituindo imunidade para ilícitos."],["Acesso a investigações","O advogado pode consultar elementos documentados de investigação nas condições legais, inclusive sem procuração quando não há sigilo. Em autos sigilosos, exige-se mandato. Diligências em andamento e ainda não documentadas podem ter acesso delimitado nos termos do Estatuto."],["Inviolabilidade","O escritório e os instrumentos de trabalho recebem proteção vinculada à atividade profissional. Não é proteção absoluta: medidas judiciais excepcionais exigem os pressupostos e salvaguardas legais. Em provas, desconfie de alternativas que usem 'sempre' ou 'nunca' sem ressalvas."]],"map":["Prerrogativa → defesa","Sem sigilo → acesso nos limites legais","Sigilo → procuração","Inviolabilidade → proteção qualificada"]},{"t":"Sociedades de advogados e associação","ref":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Formas de organização","A advocacia admite sociedade de advogados e sociedade unipessoal. O registro constitutivo no Conselho Seccional competente confere personalidade jurídica. A finalidade é a prestação de serviços advocatícios, e não a organização de uma atividade mercantil genérica."],["Limites societários","Não se admite sócio que não seja advogado inscrito ou que esteja totalmente proibido de advogar, nem denominação de fantasia nas sociedades abrangidas pelo Estatuto. A organização deve respeitar os conflitos de interesse e as limitações territoriais de participação societária."],["Responsabilidade e associação","Além da sociedade, o sócio ou titular responde subsidiária e ilimitadamente por danos causados aos clientes no exercício da advocacia, sem prejuízo da responsabilidade disciplinar. Associação profissional sem vínculo de emprego é possível, mas deve atender aos requisitos legais; o nome do contrato não afasta uma relação empregatícia efetivamente caracterizada."]],"map":["Registro → Conselho Seccional","Objeto → advocacia","Sócio → advogado habilitado","Danos ao cliente → responsabilidade subsidiária"]},{"t":"Honorários advocatícios","ref":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Três modalidades","Honorários convencionados decorrem do acordo profissional; arbitrados são estabelecidos judicialmente nas hipóteses pertinentes; sucumbenciais resultam da derrota processual da parte adversa. Diferencie origem do crédito e titularidade. A sucumbência pertence ao advogado."],["Contratação e cobrança","A clareza do contrato reduz conflitos: delimite serviços, forma de remuneração e hipóteses de encerramento. A ação de cobrança tem prazo prescricional de cinco anos, com marcos iniciais definidos no art. 25. Não trate todos os casos como se contassem da assinatura do contrato."],["Substabelecimento","O substabelecimento com reserva mantém poderes no profissional originário. Em regra, o substabelecido não cobra honorários sem a intervenção do substabelecente. O art. 26 prevê exceção quando possui contrato celebrado com o cliente."]],"map":["Convencionados → contrato","Arbitrados → decisão judicial","Sucumbência → advogado","Cobrança → 5 anos"]},{"t":"Incompatibilidades e impedimentos","ref":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Distinção fundamental","A incompatibilidade exclui totalmente o exercício da advocacia enquanto presente a condição. O impedimento restringe determinadas atuações, sem necessariamente afastar o profissional de toda a advocacia. Primeiro classifique a atividade, depois identifique o alcance da restrição."],["Atividades incompatíveis","O Estatuto relaciona categorias como membros do Judiciário e titulares de serviços notariais e registrais. Há especificidades e decisões judiciais relevantes para certas categorias; consulte o texto consolidado e os precedentes aplicáveis antes de estender uma regra."],["Impedimento do servidor","O servidor público, quando abrangido pelo art. 30, I, não pode advogar contra a Fazenda Pública que o remunera ou à qual está vinculada a entidade empregadora. A exceção legal dos docentes de cursos jurídicos e as hipóteses de incompatibilidade merecem atenção."]],"map":["Incompatibilidade → proibição total","Impedimento → proibição parcial","Cargo temporário incompatível → licença","Servidor → observar Fazenda vinculada"]},{"t":"Relação com o cliente e conflitos de interesse","ref":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015","lessons":[["Confiança e informação","Explique riscos relevantes, alternativas e limites da estratégia profissional. A independência técnica não elimina o dever de informar. A contratação não é uma promessa de resultado."],["Conflitos de interesse","Profissionais da mesma sociedade não representam interesses opostos. Se um conflito superveniente não puder ser resolvido, é preciso escolher a representação a manter, renunciar às demais e preservar informações confidenciais."],["Encerramento e defesa","A revogação pelo cliente não elimina automaticamente os honorários devidos pelo trabalho. A defesa criminal é função de garantia processual, independentemente da opinião pessoal do advogado sobre a culpa. O profissional não deve deixar o cliente desamparado."]],"map":["Informar riscos → confiança","Interesses opostos → conflito","Renúncia → preservar sigilo","Defesa → garantias processuais"]},{"t":"Sigilo profissional e publicidade jurídica","ref":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015","lessons":[["Confidencialidade","O sigilo é dever profissional independentemente de pedido do cliente. Comunicações advogado-cliente são presumidamente confidenciais. A obrigação abrange também fatos conhecidos no exercício de funções da Ordem."],["Exceções","Circunstâncias excepcionais podem justificar a revelação, como defesa própria ou grave ameaça à vida e à honra. A análise exige necessidade e proporcionalidade. O advogado não é obrigado a depor sobre fatos sujeitos ao sigilo."],["Marketing jurídico","A publicidade é informativa, discreta e sóbria. O conteúdo jurídico pode ser divulgado em redes sociais e por meios permitidos, inclusive anúncios nas condições regulamentares. Captação indevida, mercantilização e promessa de resultado são incompatíveis com esse regime. Consulte também o Provimento 205/2021 e alterações vigentes."]],"map":["Sigilo → dever independente de pedido","Justa causa → exceção","Publicidade → informação","Captação e promessa → vedadas"],"extraUrl":"https://www.oab.org.br/leisnormas/legislacao/provimentos/205-2021"},{"t":"Infrações e sanções disciplinares","ref":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Identificação da infração","A questão exige enquadramento da conduta no Estatuto e identificação da consequência aplicável. Diferencie a infração disciplinar da responsabilidade civil e penal: podem coexistir. A falta de prestação de contas e a captação de causas, por exemplo, não são categorias equivalentes."],["Sistema de sanções","As quatro espécies são censura, suspensão, exclusão e multa. A censura pode ser convertida em advertência reservada quando presentes as condições legais. A suspensão restringe temporariamente o exercício profissional em todo o território nacional. A exclusão demanda requisitos próprios."],["Individualização e prescrição","Analise agravantes, atenuantes, reincidência e a natureza da conduta. A pretensão punitiva disciplinar prescreve em cinco anos contados da constatação oficial do fato, observadas interrupções e a prescrição intercorrente prevista no Estatuto. Não confunda prescrição disciplinar com cobrança de honorários."]],"map":["Conduta → art. 34","Sanção → arts. 35–39","Exclusão → quórum qualificado","Prescrição → art. 43"]},{"t":"Organização da OAB e processo disciplinar","ref":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Estrutura institucional","A OAB exerce serviço público com personalidade jurídica e forma federativa. Integram sua estrutura o Conselho Federal, os Conselhos Seccionais, as Subseções e as Caixas de Assistência. A Subseção é parte autônoma da Seccional, não um Conselho Federal local."],["Competência disciplinar","Em regra, o Conselho Seccional do território da infração exerce a competência disciplinar, com ressalva legal para faltas cometidas perante o Conselho Federal. O Tribunal de Ética e Disciplina exerce funções de julgamento conforme o Estatuto e os regulamentos."],["Garantias processuais","O processo pode começar de ofício ou por representação. O sigilo durante a tramitação protege as partes, sem eliminar acesso legal dos interessados e defensores. Observe contraditório, defesa, competência e recursos próprios. O sigilo não equivale a ausência de controle."]],"map":["Conselho Federal → âmbito nacional","Seccional → território","Subseção → parte autônoma","Disciplina → competência e defesa"]}];const ethicsQuestions=[{"id":1001,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Um advogado é chamado para uma medida urgente, sem procuração assinada. Qual a solução prevista no Estatuto?","a":["Nunca pode atuar","Pode atuar, regularizando o mandato em 15 dias, prorrogáveis por igual período","Tem 48 horas sem prorrogação","O mandato torna-se dispensável definitivamente"],"ok":1,"e":"A urgência permite a atuação inicial sem procuração, mas não elimina a obrigação de regularizá-la. O prazo consta do art. 5º, § 1º.","src":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1002,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Após notificar o cliente sobre a renúncia, o advogado é substituído por outro profissional no quarto dia. O que ocorre?","a":["Deve continuar por dez dias mesmo substituído","Deve permanecer por trinta dias","Pode cessar a representação com a substituição anterior","A renúncia depende de homologação da OAB"],"ok":2,"e":"A continuidade de dez dias protege o cliente contra desamparo. A substituição anterior encerra essa obrigação, conforme art. 5º, § 3º.","src":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1003,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Uma advogada inscrita em SP patrocina seis novas causas judiciais em MG no mesmo ano, em atuação habitual. O que deve providenciar?","a":["Inscrição suplementar em MG","Cancelamento obrigatório em SP","Apenas comunicação ao cliente","Novo Exame de Ordem"],"ok":0,"e":"O art. 10, § 2º, exige inscrição suplementar quando a intervenção judicial em outro território ultrapassa cinco causas anuais.","src":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1004,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Um advogado assume temporariamente atividade incompatível com a advocacia. Qual medida de inscrição é prevista?","a":["Inscrição suplementar","Transferência automática","Exclusão disciplinar","Licenciamento"],"ok":3,"e":"O licenciamento se aplica à incompatibilidade temporária (art. 12, II), diferentemente da incompatibilidade definitiva.","src":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1005,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Em investigação sob sigilo, o advogado pretende exercer a prerrogativa de acesso do art. 7º, XIV. Que documento deve apresentar?","a":["Certidão de graduação","Procuração","Autorização de todos os investigados","Contrato de sociedade"],"ok":1,"e":"O art. 7º, § 10, exige procuração para o acesso previsto no inciso XIV quando os autos são sigilosos.","src":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1006,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Um magistrado afirma ser superior hierárquico ao advogado em razão do cargo. Qual a resposta correta?","a":["É superior em qualquer audiência","É superior apenas em processo penal","Não há hierarquia entre magistrados, membros do MP e advogados","A hierarquia depende do tempo de inscrição"],"ok":2,"e":"O art. 6º rejeita essa subordinação hierárquica e exige respeito recíproco no exercício das funções.","src":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1007,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Dois advogados constituem sociedade exclusivamente para prestar serviços jurídicos. Onde se registra o ato constitutivo para adquirir personalidade jurídica?","a":["Junta Comercial","Cartório eleitoral","Conselho Seccional da OAB competente","Conselho Nacional de Justiça"],"ok":2,"e":"O registro profissional da sociedade é feito perante o Conselho Seccional da OAB competente, conforme art. 15, § 1º.","src":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1008,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Uma sociedade pretende admitir como sócio investidor alguém que não possui inscrição como advogado. A proposta é admissível?","a":["Sim, desde que não assine petições","Não, pela vedação do art. 16","Sim, se a participação for inferior a 10%","Sim, se o contrato for registrado em cartório"],"ok":1,"e":"O Estatuto veda a presença de sócio não inscrito como advogado nas sociedades de advocacia.","src":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1009,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Em uma sentença que condena a parte vencida ao pagamento de honorários sucumbenciais, quem é titular dessa verba segundo o Estatuto?","a":["O advogado","O juiz","A parte vencedora exclusivamente","A OAB"],"ok":0,"e":"O art. 23 assegura ao advogado a titularidade dos honorários incluídos na condenação por sucumbência.","src":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1010,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Em regra, qual o prazo de prescrição da ação de cobrança de honorários advocatícios?","a":["Um ano","Dois anos","Dez anos","Cinco anos"],"ok":3,"e":"O art. 25 estabelece cinco anos, com início variável segundo a hipótese legal.","src":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1011,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Uma pessoa exerce atividade que a lei classifica expressamente como incompatível com a advocacia. Qual o alcance da restrição?","a":["Somente causas tributárias","Somente causas contra a União","Proibição parcial","Proibição total"],"ok":3,"e":"A distinção está no art. 27: incompatibilidade é proibição total; impedimento, parcial.","src":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1012,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Servidor público sujeito apenas ao art. 30, I, pretende advogar contra a Fazenda que o remunera. Pode fazê-lo?","a":["Sim, fora do horário de trabalho","Não, há impedimento nessa atuação","Sim, se cobrar honorários reduzidos","Não pode advogar em nenhuma hipótese"],"ok":1,"e":"A restrição desse dispositivo é parcial e incide contra a Fazenda que o remunera ou à qual se vincula a entidade empregadora.","src":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1013,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Dois clientes do mesmo advogado passam a ter interesses opostos e o conflito não pode ser harmonizado. Qual conduta é adequada?","a":["Representar ambos até a sentença","Revelar as confidências de ambos","Escolher um mandato, renunciar aos demais e preservar o sigilo","Entregar os processos ao cliente adversário"],"ok":2,"e":"O art. 20 do Código de Ética orienta a escolha prudente de um mandato e a renúncia aos demais, com preservação do sigilo.","src":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1014,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"A revogação do mandato pelo cliente extingue automaticamente a obrigação de pagar os honorários contratados?","a":["Sim, em qualquer hipótese","Não; devem ser observados os honorários devidos","Sim, se ocorrer antes da sentença","Sim, se não houver sucumbência"],"ok":1,"e":"O art. 17 do Código de Ética preserva o direito aos honorários contratados e à sucumbência eventualmente devida na proporção pertinente.","src":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1015,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Um cliente contou um fato confidencial, sem pedir expressamente segredo. O advogado pode divulgá-lo livremente?","a":["Sim, por não haver pedido","Não; o sigilo independe de solicitação","Sim, após o fim do contrato","Sim, se omitir o nome em qualquer circunstância"],"ok":1,"e":"O art. 36 do Código de Ética estabelece o sigilo independentemente de solicitação do cliente.","src":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1016,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Uma advogada publica conteúdo informativo em rede social e deseja contratar anúncio dentro dos limites regulamentares. Qual afirmação é correta?","a":["Todo anúncio pago é proibido","Pode prometer resultados para captar clientes","A publicidade informativa pode ser admitida, sem captação indevida ou mercantilização","Qualquer anúncio permite divulgar êxitos como garantia"],"ok":2,"e":"O Provimento 205/2021 admite publicidade e marketing de conteúdo observados os limites éticos e os meios permitidos.","src":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1017,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Qual alternativa reúne as quatro espécies de sanção disciplinar do Estatuto?","a":["Advertência, prisão, multa e cassação","Censura, suspensão, exclusão e multa","Censura, detenção, exclusão e indenização","Suspensão, interdição civil, advertência e prisão"],"ok":1,"e":"O art. 35 enumera censura, suspensão, exclusão e multa. Advertência reservada pode resultar da conversão da censura em condições específicas.","src":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1018,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Qual quórum é exigido pelo Estatuto para aplicação da sanção de exclusão?","a":["Maioria simples dos presentes","Unanimidade nacional","Um terço da Subseção","Manifestação favorável de dois terços dos membros do Conselho Seccional competente"],"ok":3,"e":"O art. 38, parágrafo único, prevê o quórum de dois terços dos membros do Conselho Seccional competente.","src":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1019,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Quais são os órgãos previstos na estrutura da OAB pelo art. 45?","a":["Conselho Federal, Conselhos Seccionais, Subseções e Caixas de Assistência","STF, CNJ, OAB e Defensoria","Juntas comerciais, cartórios e conselhos fiscais","Apenas Conselho Federal e Tribunais de Ética"],"ok":0,"e":"O art. 45 identifica os quatro órgãos da estrutura da OAB.","src":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1020,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Em regra, o processo disciplinar da OAB tramita de que maneira até seu término?","a":["Sempre aberto a qualquer pessoa","Sem defesa técnica","Em sigilo, com acesso nas hipóteses legais","Exclusivamente em juízo criminal"],"ok":2,"e":"O art. 72, § 2º, do Estatuto prevê sigilo até o término, com acesso às partes, defensores e autoridade judiciária competente.","src":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"}];qs.push(...ethicsQuestions);const sampleQuestions=qs.filter(q=>q.id<1 nApp(){go(state.profileReady?'Painel':'Configurações')}function isRoute(v){return menu.includes(v)||(/^Disciplina:\d+$/.test(v)&&Number(v.split(':')[1])<subjects.length)||(/^Etica:(?:modulo:[0-9]|lei|mapas|revisao|flash|simulado)$/.test(v))}function go(v){stopTimer();showBack=false;if(!isRoute(v))v='Painel';view=v;queue=[];if(location.hash.slice(1)!==encodeURIComponent(v))history.pushState(null,'','#'+encodeURIComponent(v));if(state.session?.title===view&&resumeSession(false)){window.scrollTo(0,0);return}render();window.scrollTo(0,0)}function routeFromHash(){stopTimer();let v='';try{v=decodeURIComponent(location.hash.slice(1))}catch{}if(!v){home();return}view=isRoute(v)?v:'Painel';queue=[];if(state.session?.title===view&&resumeSession(false))return;render()}window.addEventListener('popstate',routeFromHash);function toggleMenu(){const s=document.querySelector('.side'),o=document.querySelector('.overlay'),b=document.getElementById('menubtn');const open=s.classList.toggle('open');o.classList.toggle('open',open);b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'Fechar menu':'Abrir menu')}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.side.open'))toggleMenu()});function layout(body){const selected=view.startsWith('Disciplina:')||view.startsWith('Etica:')?'Disciplinas':view;const title=view.startsWith('Etica:')?'Ética Profissional':view.startsWith('Disciplina:')?subjects[Number(view.split(':')[1])]:view;root.innerHTML=`<div class="mobilebar app-mobilebar">${brand}<button id="menubtn" onclick="toggleMenu()" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">${ico('menu')}</button></div><button class="overlay" onclick="toggleMenu()" aria-label="Fechar menu" tabindex="-1"></button><div class="app app-premium"><aside class="side" id="sidebar">${brand}<div class="side-caption">PREPARAÇÃO • 1ª FASE DA OAB</div><nav aria-label="Menu principal">${groups.map(([g,items])=>`<div class="navgroup">${g}</div>${items.map(m=>`<button class="${m===selected?'active':''}" ${m===selected?'aria-current="page"':''} onclick="go('${m}')">${ico(m)}<span>${m}</span></button>`).join('')}`).join('')}</nav><div class="nav-foot"><button class="home" onclick="home()">${ico('Página inicial')} Página inicial</button></div></aside><main class="content"><div class="top"><div class="app-title-group"><span class="app-title-icon">${ico(selected)}</span><div><div class="eyebrow">Sua preparação para a OAB</div><h2>${title}</h2></div></div><span class="preview">Demonstração</span></div>${body}<div class="footer app-footer"><span>ROTA <b>40</b> · BY EDUVERSO</span><p>Dados locais deste navegador. Conteúdo demonstrativo, sujeito a revisão jurídica.</p></div></main></div>`}function stopTimer(){if(timerId!==null){clearInterval(timerId);timerId=null}}function persistSession(){state.session={title:view,ids:queue.map(q=>q.id),pos,answered,selectedAnswer,score:sessionScore,deadline:state.session?.deadline||null,answers:state.session?.answers||[]};save()}function start(list,title){if(!list.length)return;if(state.session&&!confirm('Já existe um treino em andamento. Iniciar outro encerra o anterior. Continuar?'))return;stopTimer();view=title;queue=list;pos=0;answered=false;selectedAnswer=null;sessionScore=0;state.session={title,deadline:title==='Simulados'?Date.now()+list.length*3*60000:null,answers:[]};history.pushState(null,'','#'+encodeURIComponent(title));persistSession();question()}function resumeSession(navigate=true){const s=state.session;if(!s)return false;const items=s.ids.map(id=>qs.find(q=>q.id===id));if(items.some(q=>!q)||!items.length){state.session=null;save();return false}stopTimer();view=s.title;queue=items;pos=s.pos;answered=s.answered;selectedAnswer=s.selectedAnswer;sessionScore=s.score;if(navigate)history.pushState(null,'','#'+encodeURIComponent(view));question();return true}function endSession(timedOut=false){stopTimer();const s=state.session;if(!s)return;const result={title:view,score:sessionScore,total:queue.length,date:Date.now(),timedOut,answers:s.answers||[]};state.results.push(result);state.session=null;save();layout(`<div class="panel"><h2>${timedOut?'Tempo encerrado':'Treino concluído'}</h2><p class="metric">${result.score}/${result.total}</p><p class="muted">Acertos nesta sessão de treino, não uma estimativa da nota oficial.</p>${view==='Simulados'?result.answers.map(x=>{const q=qs.find(y=>y.id===x.id);return '<div class="listline"><strong>'+(x.correct?'✓ ':'✕ ')+q.q+'</strong><p>Sua resposta: '+q.a[x.selected]+'</p><p>Correta: '+q.a[q.ok]+'</p><p>'+q.e+'</p>'+linkSource(q)+'</div>'}).join(''):''}<div class="sessiontools"><button class="btn" onclick="go('Minha rota')">Ver próxima rota</button><button class="btn alt" onclick="go('Meu desempenho')">Ver desempenho</button></div></div>`)}function tick(){if(!state.session?.deadline){stopTimer();return}const remaining=Math.max(0,Math.ceil((state.session.deadline-Date.now())/1000)),t=document.getElementById('timer');if(t)t.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(!remaining)endSession(true)}function question(){stopTimer();if(!state.session)return;if(state.session.deadline&&Date.now()>=state.session.deadline){endSession(true);return}if(pos>=queue.length){endSession();return}const q=queue[pos];layout(`<div class="panel question"><div class="smallrow"><span class="tag">${subjects[q.s]}</span><span class="tag">${pos+1} de ${queue.length}</span></div>${view==='Simulados'?'<div class="smallrow"><span class="label">Tempo restante</span><span class="timer" id="timer"></span></div>':''}<div class="progressline"><i style="width:${(pos+(answered?1:0))/queue.length*100}%"></i></div><h3>${q.q}</h3>${q.a.map((a,i)=>`<button class="option" data-i="${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="feedback"></div><div class="sessiontools"><button class="btn alt" onclick="go('Painel')">Salvar e voltar</button></div></div>`);if(answered)showAnswer();if(state.session?.deadline){tick();if(state.session)timerId=setInterval(tick,1000)}}function showAnswer(){const q=queue[pos],i=selectedAnswer,correct=i===q.ok,simulation=view==='Simulados';document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(!simulation){if(k===q.ok)b.classList.add('correct');else if(k===i)b.classList.add('wrong')}else if(k===i){b.style.borderColor='#b18a48'}});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${simulation?'Resposta registrada':correct?'Resposta correta':'Vamos revisar este ponto'}</strong>${simulation?'<p>O gabarito será exibido ao final.</p>':`<p>${q.e}</p><p>${linkSource(q)}</p>`}</div><button class="btn" onclick="nextQuestion()">${pos+1===queue.length?'Ver resultado':'Próxima questão →'}</button>`}function answer(i){if(answered||!state.session||i<0||i>=queue[pos].a.length)return;if(state.session.deadline&&Date.now()>=state.session.deadline){endSession(true);return}answered=true;selectedAnswer=i;const q=queue[pos],correct=i===q.ok;sessionScore+=Number(correct);state.attempts.push({id:q.id,correct,date:Date.now()});state.session.answers.push({id:q.id,correct,selected:i});persistSession();showAnswer()}function nextQuestion(){if(!answered)return;pos++;answered=false;selectedAnswer=null;persistSession();question()}function trainSelected(){const v=document.getElementById('questionSubject').value;train(v===''?undefined:Number(v))}function train(s){const arr=s===undefined?qs:qs.filter(q=>q.s===s);if(arr.length)start(arr,'Questões')}function profileForm(){return `<form class="profileform" onsubmit="saveProfile(event)"><label>Data da sua prova (opcional)<input type="date" id="examDate" value="${/^\d{4}-\d{2}-\d{2}$/.test(state.examDate)?state.examDate:''}"><span class="date-hint">Selecione a data no calendário, se já souber.</span></label><label>Tempo diário<select id="dailyMinutes">${[15,30,45,60,90,120].map(n=>'<option '+(n===state.minutes?'selected':'')+' value="'+n+'">'+n+' minutos</option>').join('')}</select></label><button class="btn" type="submit">Salvar e continuar →</button></form>`}function saveProfile(e){e.preventDefault();const d=document.getElementById('examDate').value;state.examDate=/^\d{4}-\d{2}-\d{2}$/.test(d)?d:'';state.minutes=Number(document.getElementById('dailyMinutes').value);state.profileReady=true;save();go(state.attempts.length?'Minha rota':'Diagnóstico')}function reviewCard(known){const q=qs[flash%qs.length],prev=state.reviews[q.id]||{interval:0};const interval=known?Math.min(30,Math.max(1,prev.interval*2)):0;state.reviews[q.id]={interval,due:Date.now()+(known?interval*86400000:600000)};save();flash++;showBack=false;render()}function filterSubjects(value){const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let count=0;document.querySelectorAll('[data-subject]').forEach(el=>{const ok=norm(subjects[Number(el.dataset.subject)]).includes(norm(value));el.classList.toggle('hidden',!ok);if(ok)count++});document.getElementById('noSubjects').classList.toggle('hidden',count!==0)}

 return back;
}
function render(){const attempts=state.attempts,correct=attempts.filter(x=>x.correct).length,errors=qs.filter(q=>last()[q.id]?.correct===false);let b='';if(view==='Diagnóstico'){b=`<div class="panel"><span class="tileicon gold">${ico('Diagnóstico')}</span><h3 style="margin-top:14px">Descubra seu ponto de partida</h3><p class="muted" style="margin:8px 0 16px">Faça o diagnóstico demonstrativo para conhecer o fluxo. São quatro questões de exemplo, não uma avaliação representativa do exame.</p><button class="btn" onclick="start(sampleQuestions,'Diagnóstico')">Começar diagnóstico →</button></div>`}else if(view==='Meu desempenho'){b=`<p class="muted">Acompanhe o seu histórico de treino neste navegador.</p><div class="grid"><div class="tile"><div class="label">Respostas registradas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros pendentes</div><div class="metric">${errors.length}</div></div></div><div class="panel"><h3>Desempenho por disciplina</h3><p class="muted">Somente questões respondidas são consideradas.</p>${subjects.map((s,i)=>{const a=attempts.filter(x=>qs.some(q=>q.id===x.id&&q.s===i));const p=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0;return '<div class="listline"><div class="smallrow"><strong>'+s+'</strong><span class="muted">'+(a.length?p+'%':'Sem dados')+'</span></div>'+(a.length?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}).join('')}</div>`}else if(view==='Provas anteriores'){b=`<div class="panel empty"><span class="tileicon">${ico(view)}</span><h3>Biblioteca de provas anteriores</h3><p class="muted">A estrutura está pronta para receber cadernos, gabaritos e filtros por edição. O acervo será incluído na etapa de conteúdo.</p><p><a class="link" href="https://oab.fgv.br/" target="_blank" rel="noopener noreferrer">Consultar portal oficial do exame ↗</a></p></div>`}else if(view==='Configurações'){b=`<div class="panel"><h3>${state.profileReady?'Preferências de estudo':'Vamos configurar sua preparação'}</h3><p class="muted" style="margin:8px 0 18px">Informe o tempo diário e a data da prova. Os dados ficam neste navegador.</p>${profileForm()}<div class="settingsrow"><strong>Meta de treinamento sugerida</strong><strong>45/80</strong></div><div class="settingsrow"><div><strong>Conta e sincronização</strong><div class="muted">Autenticação ainda não integrada.</div></div><span class="badge-mini">Em preparação</span></div></div>`}else if(view==='Ajuda'){b=`<div class="panel"><h3>Como usar o Rota 40</h3><div class="listline"><strong>1. Comece pelo diagnóstico</strong><p class="muted">Conheça o fluxo de questões e respostas.</p></div><div class="listline"><strong>2. Abra Minha rota</strong><p class="muted">Defina o tempo que tem disponível e veja as prioridades.</p></div><div class="listline"><strong>3. Revise e acompanhe</strong><p class="muted">Use o caderno de erros e o painel de desempenho.</p></div><div class="notice">Prévia não comercial. As informações ficam apenas neste navegador. Não há conta, cobrança ou mentor IA ativo.</div><button class="btn alt" onclick="go('Diagnóstico')">Começar diagnóstico</button></div>`}else if(view.startsWith('Etica:')){b=ethicsScreen()}else if(view==='Disciplina:0'){b=ethicsPage()}else if(view.startsWith('Disciplina:')){const i=Number(view.split(':')[1]),n=qs.filter(q=>q.s===i).length;b=`<button class="breadcrumb" onclick="go('Disciplinas')">${ico('Página inicial')} Todas as disciplinas</button><div class="panel"><div class="tilehead"><span class="tileicon gold">${ico('Disciplinas')}</span><div><h3>${subjects[i]}</h3><p class="muted">Trilha de preparação · primeira fase</p></div></div></div><h3 class="sectiontitle">Materiais e ferramentas</h3><div class="grid two">${['Teoria resumida','Legislação comentada','Mapas mentais','Questões comentadas','Flashcards','Revisão da disciplina'].map(m=>`<div class="tile"><div class="tilehead"><span class="tileicon">${ico(m==='Questões comentadas'?'Questões':m==='Flashcards'?'Flashcards':'Disciplinas')}</span><div class="tilecopy"><strong>${m}</strong><div class="muted">${m==='Questões comentadas'&&n?n+' questão demonstrativa':'Conteúdo em preparação'}</div></div></div>${m==='Questões comentadas'&&n?`<button class="btn alt" onclick="train(${i})">Praticar →</button>`:''}</div>`).join('')}</div>`}else if(view==='Painel'){b=`<p class="muted">Comece pelo diagnóstico e siga sua próxima missão.</p>${state.session?`<div class="panel" style="margin:15px 0"><h3>Treino em andamento</h3><p class="muted">${state.session.title} · questão ${Math.min(state.session.pos+1,state.session.ids.length)} de ${state.session.ids.length}</p><button class="btn" style="margin-top:10px" onclick="resumeSession()">Continuar treino →</button></div>`:""}<div class="panel mission"><div class="eyebrow" style="color:#dec38c">Sua missão</div><h2>${attempts.length?'Continue sua rota':'Descubra seu ponto de partida'}</h2><p>${attempts.length?'Priorize as questões ainda não dominadas.':'Responda às quatro questões de demonstração.'}</p><button class="btn gold" onclick="${attempts.length?"go('Minha rota')":"go('Diagnóstico')"}">${attempts.length?'Iniciar revisão':'Iniciar diagnóstico'} →</button></div><div class="grid"><div class="tile"><div class="label">Questões respondidas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros para revisar</div><div class="metric">${errors.length}</div></div></div><h3 class="sectiontitle">Estudo e prática</h3><div class="grid two">${['Disciplinas','Questões','Simulados','Provas anteriores'].map(m=>actionTile(m)).join('')}</div><h3 class="sectiontitle">Revisão e acompanhamento</h3><div class="grid two">${['Caderno de erros','Flashcards','Meu desempenho','Mentor IA'].map(m=>actionTile(m)).join('')}</div>`}else if(view==='Minha rota'){const d=daysLeft(),plan=routePlan();b=`<div class="panel mission"><div class="eyebrow" style="color:#dec38c">${d!==null&&d>=0&&d<=14?'Reta final':'Sua preparação diária'}</div><h2>${state.minutes} minutos para avançar</h2><p>${d===null?'Defina a data da prova nas configurações.':d<0?'Atualize a data da prova.':d===0?'Hoje é a data de prova informada.':d+' dias até a data informada.'} Rota baseada em regras e no banco disponível; cobertura ainda concentrada em Ética.</p><button class="btn gold" onclick="start(routePlan(),'Minha rota')">Começar missão →</button></div><div class="panel"><div class="smallrow"><h3>Prioridades de hoje</h3><button class="btn alt" onclick="go('Configurações')">Ajustar perfil</button></div>${plan.map(q=>`<div class="listline"><div class="smallrow"><strong>${subjects[q.s]}</strong><span class="muted">${last()[q.id]?.correct===false?'Refazer erro':!last()[q.id]?'Praticar':'Consolidar'}</span></div></div>`).join('')}<p class="muted" style="margin-top:14px">A incidência histórica das provas será integrada após curadoria do acervo.</p></div>`}else if(view==='Disciplinas'){b=`<p class="muted">Escolha uma das 20 matérias para explorar sua trilha. Ética Profissional já tem um primeiro lote de módulos; as demais disciplinas estão em preparação.</p><label class="searchbox">${ico('search')}<input aria-label="Buscar disciplina" placeholder="Buscar disciplina..." oninput="filterSubjects(this.value)"></label><div class="catalog" id="catalog">${subjects.map((s,i)=>`<button class="tile action" data-subject="${i}" onclick="go('Disciplina:${i}')"><div class="tilehead"><span class="tileicon">${ico('Disciplinas')}</span><div class="tilecopy"><strong>${s}</strong><div class="muted">Abrir trilha</div></div><span class="arrow">${ico('arrow')}</span></div></button>`).join('')}</div><p class="muted hidden" id="noSubjects">Nenhuma disciplina encontrada.</p>`}else if(view==='Questões'){b=`<div class="panel"><h3>Banco de questões — amostra</h3><p>24 exercícios autorais com fundamentação legal, dos quais 21 são de Ética Profissional (20 novos e 1 demonstrativo).</p><div class="filterrow"><select id="questionSubject" aria-label="Filtrar matéria"><option value="">Todas as matérias</option>${subjects.map((s,i)=>`<option value="${i}" ${qs.some(q=>q.s===i)?"":"disabled"}>${s}</option>`).join("")}</select><button class="btn" onclick="trainSelected()">Iniciar treino</button></div></div>`}else if(view==='Simulados'){b=`<div class="panel"><h3>Mini-simulado demonstrativo</h3><p class="muted">4 questões · 12 minutos · gabarito ao final. Não representa a distribuição ou dificuldade de uma prova oficial de 80 questões.</p><button class="btn" style="margin-top:12px" onclick="start(sampleQuestions,'Simulados')">Começar mini-simulado</button></div>`}else if(view==='Caderno de erros'){b=`<div class="panel"><h3>${errors.length?'Seus pontos de revisão':'Nenhum erro pendente'}</h3>${errors.length?errors.map(q=>`<div class="listline"><strong>${subjects[q.s]}</strong><p>${q.q}</p></div>`).join(''):'<p class="muted">As questões que você errar aparecerão aqui.</p>'}<button class="btn" ${errors.length?'':'disabled'} style="margin-top:12px" onclick="start(qs.filter(q=>last()[q.id]?.correct===false),'Caderno de erros')">Refazer erros</button></div>`}else if(view==='Flashcards'){const q=qs[flash%qs.length];b=`<div class="panel question"><div class="label">Cartão ${flash%qs.length+1} de ${qs.length} · ${subjects[q.s]}</div><p class="muted">${state.reviews[q.id]?state.reviews[q.id].due<=Date.now()?"Revisão disponível":"Próxima revisão: "+new Date(state.reviews[q.id].due).toLocaleString("pt-BR"):"Ainda não revisado"}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="reviewCard(false)">Revisar em 10 min</button><button class="btn alt" onclick="reviewCard(true)">Já sei · agendar revisão</button>`:`<button class="btn alt" onclick="flash++;showBack=false;render()">Próximo cartão</button>`}</div></div>`}else{b=`<div class="panel"><h3>Mentor Jurídico IA</h3><p class="notice">Integração de IA ainda não configurada. Nenhuma resposta de IA será simulada como se fosse real.</p><p class="muted">A versão planejada consultará legislação oficial, explicará questões com fontes e sinalizará incertezas. Por enquanto, você pode consultar as explicações fundamentadas do banco demonstrativo.</p><button class="btn alt" style="margin-top:14px" onclick="go('Questões')">Acessar questões comentadas</button></div>`}layout(b)}routeFromHash();
</script></body></html>
