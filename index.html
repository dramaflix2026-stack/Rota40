ação tributária, fato gerador e sujeitos","difficulty":"Intermediária","q":"O locador e o locatário convencionam que o locatário pagará IPTU. Sem alteração legal, esse contrato modifica a sujeição passiva perante o Fisco?","a":["Sim, automaticamente","Não, convenções privadas não se opõem à Fazenda para modificar a definição legal, salvo disposição legal em contrário","Sim, se reconhecido em cartório","Sim, porque todo contrato altera a lei tributária"],"ok":1,"e":"O art. 123 do CTN preserva a definição legal da sujeição passiva diante de convenções particulares.","src":"CTN, arts. 113 a 127","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8010,"s":7,"module":4,"topic":"Obrigação tributária, fato gerador e sujeitos","difficulty":"Intermediária","q":"A entrega de declaração fiscal sem pagamento de valor, quando exigida pela legislação, é exemplo de quê?","a":["Imunidade","Empréstimo compulsório","Obrigação acessória","Extinção do crédito por compensação"],"ok":2,"e":"O art. 113, § 2º, contempla prestações positivas ou negativas de interesse da arrecadação e fiscalização.","src":"CTN, arts. 113 a 127","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8011,"s":7,"module":5,"topic":"Responsabilidade e sucessão tributária","difficulty":"Intermediária","q":"A sociedade apenas deixa de pagar tributo, sem demonstração de atos do administrador enquadráveis no art. 135. O inadimplemento isolado gera automaticamente responsabilidade pessoal?","a":["Sim, de todos os sócios","Sim, se houver lucro","Não, o mero inadimplemento não basta","Sim, de qualquer empregado"],"ok":2,"e":"A responsabilidade do administrador exige os pressupostos legais. A Súmula 430 do STJ afasta a imputação automática por mero inadimplemento.","src":"CTN, arts. 128 a 138","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8012,"s":7,"module":5,"topic":"Responsabilidade e sucessão tributária","difficulty":"Intermediária","q":"O contribuinte comunica infração após início de procedimento fiscal diretamente relacionado a ela. A comunicação é espontânea para fins do art. 138?","a":["Sim, sempre","Sim, se realizada no mesmo dia","Sim, desde que verbal","Não, após o início do procedimento relacionado à infração não há espontaneidade"],"ok":3,"e":"O parágrafo único do art. 138 exclui espontaneidade da denúncia apresentada após início de procedimento administrativo ou fiscalização relacionados à infração.","src":"CTN, arts. 128 a 138","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8013,"s":7,"module":6,"topic":"Crédito tributário e modalidades de lançamento","difficulty":"Intermediária","q":"Em qual modalidade há, nos termos do art. 150, antecipação do pagamento pelo sujeito passivo sem prévio exame da autoridade?","a":["Lançamento por homologação","Lançamento por arbitragem privada","Lançamento exclusivamente de ofício","Isenção"],"ok":0,"e":"O art. 150 descreve a modalidade por homologação, com pagamento antecipado e controle administrativo posterior.","src":"CTN, arts. 139 a 150","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8014,"s":7,"module":6,"topic":"Crédito tributário e modalidades de lançamento","difficulty":"Intermediária","q":"O lançamento tributário é atividade administrativa facultativa conforme mera conveniência do fiscal?","a":["Sim, quando o tributo for pequeno","Sim, se o contribuinte pedir","Sim, em qualquer imposto","Não, trata-se de atividade vinculada e obrigatória"],"ok":3,"e":"O parágrafo único do art. 142 qualifica a atividade administrativa de lançamento como vinculada e obrigatória, sob pena de responsabilidade funcional.","src":"CTN, arts. 139 a 150","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8015,"s":7,"module":7,"topic":"Suspensão, extinção e exclusão do crédito","difficulty":"Intermediária","q":"Qual instituto suspende a exigibilidade do crédito tributário, sem extingui-lo automaticamente?","a":["Pagamento integral","Remissão integral","Parcelamento","Decadência consumada"],"ok":2,"e":"O art. 151, VI, inclui parcelamento entre as hipóteses de suspensão.","src":"CTN, arts. 151 a 182","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8016,"s":7,"module":7,"topic":"Suspensão, extinção e exclusão do crédito","difficulty":"Intermediária","q":"Quais institutos são classificados pelo art. 175 como exclusão do crédito tributário?","a":["Isenção e anistia","Prescrição e decadência","Pagamento e compensação","Moratória e parcelamento"],"ok":0,"e":"O art. 175 distingue isenção e anistia das causas de suspensão e extinção.","src":"CTN, arts. 151 a 182","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8017,"s":7,"module":8,"topic":"Administração tributária, garantias e execução fiscal","difficulty":"Intermediária","q":"Um contribuinte possui crédito tributário com exigibilidade suspensa. Qual documento pode obter, atendidos os requisitos do CTN?","a":["Somente certidão positiva sem efeitos","Certidão positiva com efeitos de negativa","Nenhuma certidão em qualquer caso","Certidão de extinção definitiva automática"],"ok":1,"e":"O art. 206 atribui efeitos de certidão negativa à positiva nas hipóteses legais, incluindo exigibilidade suspensa.","src":"CTN, arts. 183 a 208; Lei 6.830/1980","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8018,"s":7,"module":8,"topic":"Administração tributária, garantias e execução fiscal","difficulty":"Intermediária","q":"A presunção de certeza e liquidez da dívida regularmente inscrita é absoluta?","a":["Sim, impede qualquer defesa","Sim, em todos os tributos federais","Sim, salvo autorização do Fisco","Não, pode ser afastada mediante prova inequívoca"],"ok":3,"e":"O art. 204 do CTN prevê presunção relativa, passível de afastamento por prova inequívoca a cargo do sujeito passivo ou terceiro interessado.","src":"CTN, arts. 183 a 208; Lei 6.830/1980","url":"https://www.planalto.gov.br/ccivil_03/leis/l5172compilado.htm"},{"id":8019,"s":7,"module":9,"topic":"Impostos e reforma tributária do consumo","difficulty":"Intermediária","q":"Qual ente ou conjunto de entes possui competência compartilhada para o IBS nos termos da reforma?","a":["União exclusivamente","Somente os Municípios","Estados, Distrito Federal e Municípios","Apenas o Senado Federal"],"ok":2,"e":"A competência compartilhada do IBS é estabelecida pelo art. 156-A da Constituição, incluído pela EC 132/2023.","src":"CF, art. 156-A; EC 132/2023","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc132.htm"},{"id":8020,"s":7,"module":9,"topic":"Impostos e reforma tributária do consumo","difficulty":"Intermediária","q":"Qual matéria é diretamente disciplinada pela LC 227/2026?","a":["Comitê Gestor do IBS e processo administrativo tributário do IBS","Criação do Código Penal","Regime geral de casamento","Extinção imediata de todos os impostos antigos"],"ok":0,"e":"A LC 227/2026 trata da governança, do contencioso administrativo e da distribuição do IBS, além de normas gerais de ITCMD e alterações de outras leis.","src":"LC 227/2026","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp227.htm"}];const laborModules=[{"t":"Fontes, princípios e direitos fundamentais","ref":"CF, arts. 7º a 11; CLT, arts. 8º e 9º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Fontes e proteção constitucional","O estudo parte da Constituição, da CLT, das leis especiais, dos instrumentos coletivos e dos precedentes aplicáveis. A proteção trabalhista não elimina a autonomia coletiva nem permite afastar livremente a legislação. É necessário distinguir normas indisponíveis e aquelas que admitem negociação."],["Primazia da realidade","A qualificação da relação depende dos fatos efetivamente comprovados, não apenas do título contratual. O princípio não permite presumir vínculo em qualquer prestação de serviço: os elementos legais devem estar presentes e os regimes especiais precisam ser considerados."],["Fraude e prescrição","Atos destinados a contornar a proteção legal podem ser nulos. A prescrição trabalhista geral combina alcance quinquenal dos créditos com prazo de dois anos após a extinção contratual para ajuizar ação, observadas hipóteses especiais. Distinga a perda da pretensão da inexistência do direito material."]],"map":["Fontes → Constituição e legislação","Realidade → fatos comprovados","Fraude → nulidade","Prescrição → cinco anos, limite bienal"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Relação de emprego e sujeitos","ref":"CLT, arts. 2º a 6º e 10 a 10-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Elementos do vínculo","O empregado é pessoa natural que presta trabalho não eventual, remunerado e subordinado, com pessoalidade. Esses elementos são examinados conjuntamente. A exclusividade não é requisito geral. A subordinação pode manifestar-se por meios digitais, sem exigir presença física."],["Empregador e risco econômico","O empregador organiza a atividade e assume seus riscos. Grupo econômico trabalhista exige os elementos legais, não bastando identidade de sócios. A prestação de serviços a diferentes empresas exige análise concreta do vínculo e da responsabilidade."],["Sucessão e outras relações","Alterações na estrutura jurídica da empresa não afetam automaticamente contratos e direitos dos empregados. Trabalho autônomo, estágio, terceirização e emprego têm regimes distintos. A jurisprudência sobre contratação empresarial deve ser examinada juntamente com a prova de eventual fraude."]],"map":["Empregado → pessoa natural","Vínculo → pessoalidade, onerosidade, não eventualidade e subordinação","Empregador → risco econômico","Grupo → requisitos legais"]},{"t":"Contrato de trabalho e modalidades especiais","ref":"CLT, arts. 442 a 456 e 75-A a 75-F; Lei 11.788/2008","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Prazo e experiência","O contrato por tempo indeterminado constitui a modalidade ordinária. O prazo determinado depende das hipóteses admitidas, com limite geral de dois anos, ressalvados regimes próprios. O contrato de experiência não pode exceder noventa dias, considerando as prorrogações."],["Teletrabalho e intermitente","O teletrabalho tem regime próprio de formalização, equipamentos e organização. Nem todo empregado remoto está excluído do controle de jornada. O contrato intermitente exige forma escrita e alternância entre períodos de prestação e inatividade, observadas as regras legais e jurisprudenciais."],["Estágio e aprendizagem","Estágio regular é ato educativo supervisionado, condicionado aos requisitos da Lei 11.788/2008. Aprendizagem é contrato especial de emprego, com formação técnico-profissional. O descumprimento dos requisitos do estágio pode produzir efeitos trabalhistas conforme o caso, sem afastar limites constitucionais de contratação pública."]],"map":["Indeterminado → modalidade ordinária","Experiência → até 90 dias","Teletrabalho → regime específico","Estágio → finalidade educativa"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2008/lei/l11788.htm"},{"t":"Jornada, horas extras e transição constitucional","ref":"CF, art. 7º; EC 141/2026, arts. 1º a 10; CLT, arts. 58 a 75","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc141.htm","lessons":[["Limites e transição de 2026","A EC 141/2026 estabeleceu redução progressiva do limite semanal normal: 42 horas após dois meses da publicação e 40 horas um ano depois dessa primeira etapa, mantido o limite diário constitucional geral de oito horas. Na data de 25/11/2026, o primeiro prazo ainda não havia decorrido. A redução e a ampliação do repouso não autorizam redução salarial. Verifique a data do fato e regimes especiais, inclusive contratos públicos e a exceção do art. 8º da emenda."],["Horas extras e compensação","A remuneração extraordinária tem adicional constitucional mínimo de cinquenta por cento. Banco de horas, compensação e jornadas especiais exigem verificação do instrumento e dos prazos permitidos. Durante a transição, o art. 7º da emenda admite negociação específica para distribuição da jornada, respeitado o repouso. As exclusões de controle de jornada dependem dos requisitos legais."],["Intervalos e repouso","Entre jornadas, a CLT prevê intervalo mínimo geral de onze horas. Na jornada contínua superior a seis horas, o intervalo intrajornada tem regra geral de uma hora, com hipóteses legais de redução. A EC 141/2026 prevê dois dias de repouso semanal a partir de dois meses da publicação e regime compensatório coletivo excepcional; confira a vigência e as regras especiais."]],"map":["Transição → 42h, depois 40h","Horas extras → mínimo de 50%","Interjornada → 11h, regra geral","Repouso → nova regra com vigência diferida"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"t":"Remuneração, salário e equiparação","ref":"CLT, arts. 457 a 467; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Salário e remuneração","Salário corresponde à contraprestação paga pelo empregador; remuneração abrange salário e gorjetas nos termos legais. Comissões e gratificações legais integram o salário conforme art. 457. Ajuda de custo, diárias e prêmios possuem disciplina própria; a denominação não legitima fraude."],["Proteção salarial","O salário não pode sofrer descontos arbitrários. Descontos decorrentes de adiantamentos, lei e instrumentos coletivos têm regras específicas; danos causados pelo empregado exigem os pressupostos do art. 462. Identifique também periodicidade e forma de pagamento."],["Equiparação salarial","A equiparação do art. 461 exige trabalho de igual valor na mesma função, para o mesmo empregador e estabelecimento, considerando produtividade, perfeição técnica e limites temporais. A igualdade salarial entre mulheres e homens também recebe proteção específica, inclusive pela Lei 14.611/2023."]],"map":["Remuneração → salário e gorjetas","Desconto → autorização legal","Equiparação → requisitos cumulativos","Discriminação → vedação"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Férias, décimo terceiro e repousos","ref":"CLT, arts. 129 a 153; Lei 4.090/1962; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Aquisição e concessão de férias","Em regra, o direito às férias é adquirido a cada doze meses de contrato, e a concessão deve ocorrer nos doze meses seguintes. Faltas injustificadas podem alterar a duração conforme a escala legal. As férias anuais remuneradas incluem adicional constitucional mínimo de um terço."],["Fracionamento e pagamento","Com concordância do empregado, as férias podem ser divididas em até três períodos, um de pelo menos quatorze dias corridos e os demais de pelo menos cinco dias cada. Há restrição legal ao início próximo a feriado ou repouso. A remuneração deve ser paga no prazo do art. 145."],["Décimo terceiro e descanso","A gratificação natalina é calculada por duodécimos segundo meses de serviço, com fração de pelo menos quinze dias considerada mês integral. Descanso semanal remunerado e férias são institutos distintos; o novo regime de repousos da EC 141/2026 deve ser observado conforme sua vigência."]],"map":["Aquisição → 12 meses","Concessão → 12 meses seguintes","Fracionamento → 14 + períodos de pelo menos 5 dias","Férias → terço constitucional"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l4090.htm"},{"t":"Alteração, suspensão e interrupção contratual","ref":"CLT, arts. 468 a 476-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Alteração contratual","A modificação das condições pactuadas exige, como regra, consentimento e ausência de prejuízo direto ou indireto ao empregado. O poder diretivo admite ajustes dentro dos limites legais. Identifique hipóteses específicas, como reversão de função de confiança, sem generalizar a incorporação de gratificações."],["Transferência","A transferência que implica mudança de domicílio tem limites próprios. A necessidade de serviço e as hipóteses legais devem ser demonstradas quando exigidas. Na transferência provisória nas condições do art. 469, § 3º, é devido adicional enquanto durar a situação."],["Suspensão e interrupção","Na interrupção, em geral, não há prestação de trabalho, mas permanece o pagamento e a contagem do período. Na suspensão, esses efeitos principais ficam paralisados, ressalvadas exceções legais. Afastamentos por doença, férias e licenças exigem classificação conforme o período e o regime aplicável."]],"map":["Alteração → consentimento e sem prejuízo","Transferência → mudança de domicílio","Interrupção → remuneração em regra mantida","Suspensão → efeitos principais paralisados"]},{"t":"Extinção contratual, aviso-prévio e FGTS","ref":"CLT, arts. 477 a 491; Leis 8.036/1990 e 12.506/2011","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Formas de término","Dispensa sem justa causa, pedido de demissão, justa causa, rescisão indireta e acordo têm efeitos diferentes. A justa causa exige enquadramento legal e análise das circunstâncias. Rescisão indireta decorre de falta patronal nas hipóteses do art. 483. A extinção consensual do art. 484-A possui verbas específicas."],["Aviso e quitação","O aviso-prévio proporcional segue a Constituição e a Lei 12.506/2011, com mínimo de trinta dias e acréscimos nos termos legais até noventa dias. O art. 477 prevê prazo geral de dez dias contados do término para entrega de documentos e pagamento das verbas rescisórias."],["FGTS e indenizações","A dispensa sem justa causa normalmente enseja indenização de quarenta por cento dos depósitos do FGTS pertinentes ao contrato, ressalvados regimes especiais. No acordo do art. 484-A, a indenização é reduzida à metade, e o saque tem limite legal de oitenta por cento; não há ingresso no seguro-desemprego por essa modalidade."]],"map":["Dispensa ≠ pedido de demissão","Falta patronal → possível rescisão indireta","Quitação → prazo geral de 10 dias","Acordo → regime específico"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8036consol.htm"},{"t":"Estabilidades, saúde e proteção do trabalho","ref":"ADCT, art. 10; CLT, arts. 157 a 201 e 391 a 400; Lei 8.213/1991","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Garantias provisórias","A garantia da gestante protege desde a confirmação da gravidez até cinco meses após o parto, nos termos constitucionais e jurisprudenciais. A estabilidade acidentária e a proteção de representantes dos trabalhadores possuem condições próprias. Diferencie garantia de emprego de estabilidade do servidor estatutário."],["Saúde e segurança","O empregador deve observar e fazer cumprir normas de segurança e medicina do trabalho. Equipamentos de proteção, medidas coletivas e treinamento integram prevenção. Insalubridade e periculosidade exigem os pressupostos normativos e prova pertinente, não sendo automaticamente devidas pelo nome da profissão."],["Proteção de grupos e não discriminação","A Constituição proíbe trabalho noturno, perigoso ou insalubre a menores de dezoito anos e trabalho antes dos dezesseis, salvo aprendizagem a partir de quatorze. Trabalho doméstico segue a LC 150/2015. Direitos relacionados à maternidade e prevenção de discriminação devem ser estudados conforme as normas específicas."]],"map":["Gestante → proteção constitucional","Acidente → requisitos próprios","Segurança → prevenção","Aprendizagem → a partir de 14 anos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direito coletivo, sindicatos e negociação","ref":"CF, arts. 8º e 9º; CLT, arts. 611 a 625; Lei 7.783/1989","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Organização sindical","A liberdade sindical impede obrigatoriedade de filiação. A Constituição mantém regras de unicidade por categoria e base territorial e atribui aos sindicatos defesa de interesses coletivos e individuais da categoria. A representação sindical não se confunde com filiação individual."],["Acordos e convenções","Convenção coletiva é celebrada entre sindicatos representativos das categorias; acordo coletivo envolve sindicato profissional e empresa ou empresas. Os arts. 611-A e 611-B tratam de matérias negociáveis e direitos cuja supressão ou redução constitui objeto ilícito. O Tema 1046 do STF deve ser considerado na interpretação dos limites."],["Greve e atualização normativa","A greve é direito constitucional, disciplinado pela Lei 7.783/1989. Serviços essenciais possuem requisitos de continuidade e comunicação. A EC 141/2026 também prevê perda de efeito de cláusulas coletivas incompatíveis após dois meses de sua publicação e hipóteses especiais de compensação de repouso; instrumentos coletivos devem respeitar a vigência aplicável."]],"map":["Filiação → liberdade","Convenção → sindicatos","Acordo → sindicato profissional e empresa","Negociação → limites constitucionais e legais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l7783.htm"}];const laborQuestions=[{"id":9001,"s":8,"module":0,"topic":"Fontes, princípios e direitos fundamentais","difficulty":"Intermediária","q":"Um empregador registra jornada fictícia com finalidade de fraudar direitos trabalhistas. Qual a consequência prevista no art. 9º da CLT?","a":["Validade automática se assinada","Nulidade dos atos fraudulentos","Validade após um mês","Impossibilidade de revisão judicial"],"ok":1,"e":"O art. 9º invalida atos destinados a desvirtuar, impedir ou fraudar a aplicação da CLT.","src":"CF, arts. 7º a 11; CLT, arts. 8º e 9º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9002,"s":8,"module":0,"topic":"Fontes, princípios e direitos fundamentais","difficulty":"Intermediária","q":"Em regra, após a extinção do contrato, qual o prazo constitucional para propor ação relativa a créditos trabalhistas?","a":["Cinco dias","Cinco anos sem outro limite","Dois anos","Dez anos"],"ok":2,"e":"O art. 7º, XXIX, da Constituição estabelece limite de dois anos após a extinção contratual, com alcance quinquenal dos créditos, ressalvadas regras especiais.","src":"CF, art. 7º, XXIX","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":9003,"s":8,"module":1,"topic":"Relação de emprego e sujeitos","difficulty":"Intermediária","q":"O trabalhador presta serviços a dois empregadores, estando presentes os elementos do vínculo em cada relação. A falta de exclusividade impede o reconhecimento?","a":["Não, exclusividade não é requisito geral","Sim, necessariamente","Sim, se ambos forem empresas privadas","Sim, salvo autorização sindical"],"ok":0,"e":"Os arts. 2º e 3º da CLT não estabelecem exclusividade como requisito geral da relação empregatícia.","src":"CLT, arts. 2º a 6º e 10 a 10-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9004,"s":8,"module":1,"topic":"Relação de emprego e sujeitos","difficulty":"Intermediária","q":"Duas empresas têm sócios em comum, sem outros elementos comprovados de integração ou atuação conjunta. Basta essa identidade para configurar grupo econômico trabalhista?","a":["Sim, em qualquer caso","Sim, se estiverem no mesmo Município","Sim, se possuírem CNPJ","Não, a identidade de sócios isoladamente não é suficiente"],"ok":3,"e":"O art. 2º, § 3º, exige demonstração de interesse integrado, comunhão efetiva de interesses e atuação conjunta para caracterização do grupo na hipótese pertinente.","src":"CLT, arts. 2º a 6º e 10 a 10-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9005,"s":8,"module":2,"topic":"Contrato de trabalho e modalidades especiais","difficulty":"Intermediária","q":"Qual o prazo máximo total do contrato de experiência previsto na CLT?","a":["Trinta dias","Noventa dias","Cento e oitenta dias","Dois anos"],"ok":1,"e":"O art. 445, parágrafo único, limita o contrato de experiência a noventa dias.","src":"CLT, arts. 442 a 456 e 75-A a 75-F; Lei 11.788/2008","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9006,"s":8,"module":2,"topic":"Contrato de trabalho e modalidades especiais","difficulty":"Intermediária","q":"O mero fato de trabalhar remotamente elimina necessariamente o direito ao controle de jornada?","a":["Sim, em todos os casos","Sim, se utilizar computador","Não, é necessário examinar o regime e as hipóteses legais de exclusão","Sim, por escolha unilateral do empregador"],"ok":2,"e":"As regras de teletrabalho e as exceções do art. 62 exigem análise do regime efetivo, inclusive prestação por produção ou tarefa e demais hipóteses legais.","src":"CLT, arts. 442 a 456 e 75-A a 75-F; Lei 11.788/2008","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9007,"s":8,"module":3,"topic":"Jornada, horas extras e transição constitucional","difficulty":"Intermediária","q":"Segundo a EC 141/2026, qual será o limite semanal normal na primeira etapa, dois meses após sua publicação?","a":["48 horas","44 horas","36 horas","42 horas"],"ok":3,"e":"O art. 6º, I, da EC 141 prevê 42 horas nessa etapa; o inciso II prevê 40 horas um ano depois, observados os regimes pertinentes.","src":"CF, art. 7º; EC 141/2026, arts. 1º a 10; CLT, arts. 58 a 75","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc141.htm"},{"id":9008,"s":8,"module":3,"topic":"Jornada, horas extras e transição constitucional","difficulty":"Intermediária","q":"A redução da duração normal do trabalho em cumprimento à EC 141/2026 autoriza reduzir proporcionalmente o salário contratado?","a":["Não, a emenda protege a irredutibilidade salarial inclusive dos pisos","Sim, automaticamente","Sim, se a jornada diminuir uma hora","Sim, sem qualquer condição"],"ok":0,"e":"O art. 2º da emenda determina implementação sem redução salarial, inclusive dos pisos.","src":"CF, art. 7º; EC 141/2026, arts. 1º a 10; CLT, arts. 58 a 75","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc141.htm"},{"id":9009,"s":8,"module":4,"topic":"Remuneração, salário e equiparação","difficulty":"Intermediária","q":"Gorjetas recebidas pelo empregado, nos termos do art. 457, integram qual conceito?","a":["Patrimônio do empregador exclusivamente","Remuneração do empregado","FGTS exclusivamente","Verba necessariamente indenizatória"],"ok":1,"e":"O art. 457 inclui gorjetas na remuneração, além do salário pago diretamente pelo empregador.","src":"CLT, arts. 457 a 467; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9010,"s":8,"module":4,"topic":"Remuneração, salário e equiparação","difficulty":"Intermediária","q":"A simples identidade do nome do cargo entre dois empregados garante equiparação salarial independentemente dos demais requisitos?","a":["Sim, sempre","Sim, se ambos usarem uniforme","Não, devem ser examinados os requisitos do art. 461","Sim, mesmo se trabalharem para empregadores distintos"],"ok":2,"e":"A equiparação depende da função efetiva, do trabalho de igual valor e dos demais requisitos legais, não apenas do título do cargo.","src":"CLT, arts. 457 a 467; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9011,"s":8,"module":5,"topic":"Férias, décimo terceiro e repousos","difficulty":"Intermediária","q":"Qual adicional mínimo constitucional incide sobre a remuneração de férias?","a":["Um décimo","Metade obrigatória","Dois terços","Um terço"],"ok":3,"e":"O art. 7º, XVII, garante férias remuneradas com pelo menos um terço a mais que o salário normal.","src":"CF, art. 7º, XVII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":9012,"s":8,"module":5,"topic":"Férias, décimo terceiro e repousos","difficulty":"Intermediária","q":"Com concordância do empregado, qual divisão atende aos limites gerais de fracionamento de 30 dias de férias?","a":["14, 8 e 8 dias","10, 10 e 10 dias","20, 4 e 6 dias","7, 7 e 16 dias em quatro períodos"],"ok":0,"e":"O art. 134, § 1º, admite até três períodos, sendo um de pelo menos 14 dias e os demais de pelo menos cinco dias.","src":"CLT, arts. 129 a 153; Lei 4.090/1962; CF, art. 7º","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9013,"s":8,"module":6,"topic":"Alteração, suspensão e interrupção contratual","difficulty":"Intermediária","q":"As partes acordam alteração contratual que reduz ilicitamente direitos do empregado. A concordância isolada torna a alteração válida?","a":["Não, o art. 468 também exige ausência de prejuízo","Sim, em qualquer caso","Sim, se o acordo for verbal","Sim, após cinco dias"],"ok":0,"e":"A alteração contratual individual exige consentimento e ausência de prejuízo direto ou indireto, ressalvados os regimes legalmente autorizados.","src":"CLT, arts. 468 a 476-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9014,"s":8,"module":6,"topic":"Alteração, suspensão e interrupção contratual","difficulty":"Intermediária","q":"Férias remuneradas representam, em regra, qual situação do contrato?","a":["Extinção contratual","Suspensão sem remuneração","Interrupção contratual","Renúncia à relação de emprego"],"ok":2,"e":"Nas férias o trabalho não é prestado, mas a remuneração e os efeitos legais do contrato são preservados.","src":"CLT, arts. 468 a 476-A","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9015,"s":8,"module":7,"topic":"Extinção contratual, aviso-prévio e FGTS","difficulty":"Intermediária","q":"Qual prazo geral do art. 477, § 6º, para pagamento das verbas rescisórias?","a":["Trinta dias","Dez dias contados do término do contrato","Quinze dias úteis","Sessenta dias"],"ok":1,"e":"O art. 477, § 6º, estabelece dez dias a partir do término do contrato para pagamento e entrega dos documentos pertinentes.","src":"CLT, arts. 477 a 491; Leis 8.036/1990 e 12.506/2011","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9016,"s":8,"module":7,"topic":"Extinção contratual, aviso-prévio e FGTS","difficulty":"Intermediária","q":"A extinção contratual por acordo do art. 484-A autoriza ingresso no programa de seguro-desemprego?","a":["Sim, sempre","Sim, após trinta dias","Sim, com anuência do sindicato","Não, essa modalidade não autoriza o benefício"],"ok":3,"e":"O § 2º do art. 484-A expressamente afasta o ingresso no programa de seguro-desemprego.","src":"CLT, arts. 477 a 491; Leis 8.036/1990 e 12.506/2011","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9017,"s":8,"module":8,"topic":"Estabilidades, saúde e proteção do trabalho","difficulty":"Intermediária","q":"Qual a proteção constitucional provisória da gestante prevista no ADCT?","a":["Da confirmação da gravidez até cinco meses após o parto","Apenas durante o parto","Somente após o retorno ao trabalho","Por dez anos após o nascimento"],"ok":0,"e":"O art. 10, II, b, do ADCT protege contra dispensa arbitrária ou sem justa causa da confirmação da gravidez até cinco meses após o parto.","src":"ADCT, art. 10, II, b","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":9018,"s":8,"module":8,"topic":"Estabilidades, saúde e proteção do trabalho","difficulty":"Intermediária","q":"Uma pessoa de quinze anos pode trabalhar regularmente em atividade comum fora da aprendizagem?","a":["Sim, em qualquer função","Sim, desde que noturna","Não, o trabalho antes dos dezesseis só é permitido como aprendiz a partir dos quatorze","Sim, se tiver autorização verbal"],"ok":2,"e":"O art. 7º, XXXIII, estabelece essa proteção etária e veda trabalho noturno, perigoso e insalubre a menores de dezoito anos.","src":"CF, art. 7º, XXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":9019,"s":8,"module":9,"topic":"Direito coletivo, sindicatos e negociação","difficulty":"Intermediária","q":"Sindicato profissional celebra instrumento normativo com uma empresa para regular condições de trabalho. Qual é a modalidade?","a":["Convenção entre dois sindicatos necessariamente","Acordo coletivo de trabalho","Contrato de estágio","Sentença penal"],"ok":1,"e":"O art. 611, § 1º, disciplina acordo coletivo entre sindicato profissional e uma ou mais empresas.","src":"CF, arts. 8º e 9º; CLT, arts. 611 a 625; Lei 7.783/1989","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":9020,"s":8,"module":9,"topic":"Direito coletivo, sindicatos e negociação","difficulty":"Intermediária","q":"Uma convenção coletiva pode suprimir livremente qualquer direito constitucional e legal dos empregados?","a":["Sim, sem limites","Sim, sempre que votada por maioria","Sim, se tiver vigência anual","Não, existem limites legais e direitos indisponíveis"],"ok":3,"e":"A negociação coletiva possui proteção constitucional, mas deve observar os limites aplicáveis, inclusive art. 611-B da CLT e interpretação do STF.","src":"CF, arts. 8º e 9º; CLT, arts. 611 a 625; Lei 7.783/1989","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"}];const processLaborModules=[{"t":"Organização, competência e jurisdição trabalhista","ref":"CF, arts. 111 a 116; CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Estrutura da Justiça do Trabalho","A Justiça do Trabalho é organizada em Varas, Tribunais Regionais e Tribunal Superior do Trabalho. As Varas são órgãos de primeiro grau; os TRTs julgam recursos e determinadas ações originárias; o TST uniformiza a interpretação do direito trabalhista dentro de suas atribuições."],["Competência material","O art. 114 da Constituição estabelece a competência sobre ações decorrentes das relações de trabalho e outras hipóteses expressas, como indenizações relacionadas ao trabalho. Não confunda relação de trabalho com emprego: a primeira é gênero. Relações jurídico-administrativas estatutárias seguem a delimitação constitucional fixada pelo STF."],["Competência territorial","A regra do art. 651 da CLT privilegia a localidade da prestação de serviços, ainda que a contratação tenha ocorrido em outro lugar. Existem exceções para situações específicas, como agente viajante e empregador que promove atividades fora do local do contrato."]],"map":["Vara → primeiro grau","TRT → recursos e competência originária","TST → uniformização","Território → prestação de serviços, em regra"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"t":"Princípios, partes e representação","ref":"CLT, arts. 763 a 769, 791 e 843; Súmula 425 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Especialidade e aplicação subsidiária","O processo trabalhista valoriza oralidade, concentração de atos e conciliação. O CPC pode suprir lacunas quando compatível com o regime trabalhista. Na execução, também se observa o art. 889 da CLT. A existência de norma especial impede substituição automática pela disciplina civil."],["Capacidade e jus postulandi","A CLT admite atuação pessoal de empregado e empregador nos limites legais. A Súmula 425 do TST restringe o jus postulandi às Varas e TRTs, excluindo, entre outros, recursos de competência do TST, ação rescisória e mandado de segurança. A representação por advogado continua recomendável."],["Preposto e representação","O empregador pode ser representado por preposto que conheça os fatos, cujas declarações o vinculam. O preposto não precisa ser empregado da parte reclamada. A regularidade da representação técnica e a presença das partes devem ser examinadas separadamente."]],"map":["Especialidade → CLT","CPC → lacuna e compatibilidade","Jus postulandi → limites da Súmula 425","Preposto → conhecimento dos fatos"],"extraUrl":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"t":"Atos processuais, prazos e nulidades","ref":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Contagem de prazos","Os prazos processuais trabalhistas expressos em dias são contados em dias úteis, excluindo-se o dia inicial e incluindo-se o vencimento. A identificação da intimação e do termo inicial é indispensável. Prazos de direito material não se confundem com prazos processuais."],["Suspensão e comunicação","O curso dos prazos processuais é suspenso de 20 de dezembro a 20 de janeiro, inclusive, conforme o art. 775-A. A comunicação eletrônica exige atenção à data de ciência e à regulamentação pertinente. Não confunda suspensão com interrupção: na suspensão, preserva-se a parcela já transcorrida."],["Nulidades","O sistema privilegia aproveitamento de atos e demonstração de prejuízo. Em regra, a nulidade deve ser arguida na primeira oportunidade de manifestação, observadas exceções. A parte não pode beneficiar-se de vício ao qual deu causa nos termos do art. 796."]],"map":["Prazo processual → dias úteis","20/12 a 20/01 → suspensão","Nulidade → prejuízo","Arguição → primeira oportunidade, em regra"]},{"t":"Reclamação trabalhista e ritos","ref":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Petição inicial","A reclamação pode ser escrita ou verbal nas hipóteses legais. Na escrita, o art. 840 exige designação do juízo, qualificação, breve exposição dos fatos, pedidos certos e determinados com indicação de valor, data e assinatura. Pedidos que não atendam aos requisitos do § 1º sujeitam-se à consequência do § 3º."],["Procedimento sumaríssimo","Dissídios individuais cujo valor não excede quarenta salários mínimos na data do ajuizamento submetem-se ao sumaríssimo, ressalvadas exclusões legais. Demandas em que seja parte administração pública direta, autárquica ou fundacional não se enquadram nesse rito. Não confunda com o procedimento sumário de alçada."],["Particularidades do rito","No sumaríssimo, os pedidos devem ser certos, determinados e valorados, e não se admite citação por edital. A concentração de atos procura acelerar o julgamento. A escolha do rito interfere na instrução e nos requisitos de recurso de revista."]],"map":["Inicial → fatos e pedidos valorados","Sumaríssimo → até 40 salários mínimos","Administração direta, autárquica e fundacional → exclusão","Sumaríssimo → sem edital"]},{"t":"Audiência, conciliação e resposta","ref":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Comparecimento","A audiência concentra atos relevantes. A ausência do reclamante pode ensejar arquivamento; a do reclamado pode produzir revelia e confissão quanto à matéria de fato, observadas exceções do art. 844. A presença de advogado do reclamado permite recebimento de contestação e documentos nos termos do § 5º."],["Conciliação","O julgador deve estimular composição, inclusive nas oportunidades previstas nos arts. 846 e 850. O acordo homologado produz efeitos jurídicos próprios, ressalvadas hipóteses de impugnação legal. A ausência de acordo não representa presunção contra a parte."],["Defesa e instrução","Frustrada a conciliação, a parte reclamada apresenta defesa conforme art. 847, inclusive por escrito no sistema eletrônico até a audiência. A instrução permite produção de provas e razões finais. Exceção de incompetência territorial possui procedimento próprio no art. 800."]],"map":["Ausência do autor → arquivamento, em regra","Ausência do réu → revelia e confissão, com ressalvas","Conciliação → antes e depois da instrução","Defesa → art. 847"]},{"t":"Provas, ônus probatório e sentença","ref":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Distribuição do ônus","Cabe ao reclamante provar fato constitutivo de seu direito e ao reclamado demonstrar fato impeditivo, modificativo ou extintivo. O art. 818 admite redistribuição fundamentada em condições específicas, assegurando oportunidade real de cumprimento do novo encargo."],["Testemunhas e perícia","No rito ordinário, cada parte pode indicar até três testemunhas, ressalvado o inquérito para apuração de falta grave, que tem regra própria. No sumaríssimo, o limite é de duas por parte. A perícia atende questões técnicas, e o laudo deve ser avaliado de forma fundamentada."],["Sentença e motivação","A decisão deve identificar fundamentos, apreciar pedidos e observar os limites da demanda. O relatório pode ser dispensado no sumaríssimo, mas a fundamentação permanece necessária. Distinga reconhecimento de direito, quantificação e efetiva satisfação do crédito."]],"map":["Autor → fato constitutivo","Réu → fato impeditivo, modificativo ou extintivo","Ordinário → 3 testemunhas, regra geral","Sumaríssimo → 2 testemunhas"]},{"t":"Custas, gratuidade e honorários","ref":"CLT, arts. 789 a 791-A; STF, ADI 5766","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Custas e preparo","As custas do conhecimento seguem, em regra, percentual de dois por cento e limites do art. 789. O depósito recursal tem finalidade de garantia e não se confunde com custas. Isenções, reduções e limites de depósito devem ser avaliados segundo a parte e o recurso, usando valores oficiais vigentes."],["Justiça gratuita","A gratuidade protege o acesso à justiça quando presentes os requisitos legais. O art. 790 prevê parâmetros e insuficiência de recursos. A jurisprudência atual deve ser observada na avaliação de declarações e provas de hipossuficiência, distinguindo pessoa natural e pessoa jurídica."],["Honorários após ADI 5766","A sucumbência advocatícia trabalhista segue o art. 791-A, com percentual entre cinco e quinze por cento. Conforme a interpretação aplicada pelo TST à ADI 5766, créditos obtidos em juízo não autorizam cobrança automática do beneficiário da gratuidade; a exigibilidade pode permanecer suspensa por dois anos, cabendo demonstração de superação da insuficiência. Honorários periciais possuem disciplina própria."]],"map":["Custas → regra de 2%","Depósito → garantia recursal","Gratuidade → insuficiência","ADI 5766 → sem cobrança automática"],"extraUrl":"https://jurisprudencia-backend.tst.jus.br/rest/documentos/35018180d7c8c03d5dc82d4f7bff208b"},{"t":"Recursos trabalhistas","ref":"CLT, arts. 893 a 900; Súmula 214 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Sistema recursal","O recurso ordinário impugna decisões definitivas ou terminativas nas hipóteses do art. 895. O recurso de revista tem pressupostos próprios e não funciona como nova instância de reexame amplo de fatos. O agravo de instrumento pode buscar destrancar recurso cuja interposição foi denegada."],["Prazos e efeitos","O prazo geral de recursos trabalhistas é de oito dias, ressalvadas exceções. Embargos de declaração têm prazo de cinco dias e interrompem, em regra, o prazo dos demais recursos. Os recursos possuem efeito meramente devolutivo como regra da CLT, ressalvadas situações específicas."],["Interlocutórias e revista","Decisões interlocutórias geralmente não admitem recurso imediato; a Súmula 214 delimita exceções. O recurso de revista exige análise das hipóteses de cabimento, pressupostos formais e transcendência. No sumaríssimo, seu cabimento tem restrições adicionais."]],"map":["Sentença → recurso ordinário, em regra","Revista → requisitos especiais","Embargos declaratórios → 5 dias","Interlocutória → irrecorribilidade imediata, em regra"],"extraUrl":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"t":"Liquidação e execução trabalhista","ref":"CLT, arts. 876 a 892 e 897","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Título e liquidação","A execução realiza obrigações constantes de títulos reconhecidos pela legislação. A liquidação quantifica decisão ilíquida sem alterar o mérito. Elaborada a conta, o art. 879, § 2º, estabelece prazo comum para impugnação fundamentada, com indicação dos itens e valores controvertidos."],["Iniciativa e pagamento","O art. 878 prevê iniciativa das partes, permitindo execução de ofício quando não representadas por advogado. Citado para cumprir decisão ou acordo, o executado tem prazo legal de quarenta e oito horas para pagar ou garantir a execução, nas hipóteses do art. 880."],["Defesa e recursos","Garantida a execução ou penhorados bens, o art. 884 prevê cinco dias para embargos, ressalvadas regras especiais. O agravo de petição é recurso típico das decisões em execução, exigindo delimitação justificada das matérias e valores impugnados nos termos legais."]],"map":["Liquidação → quantificação","Conta → impugnação fundamentada","Citação executiva → 48 horas","Execução → agravo de petição"]},{"t":"Ações especiais, dissídios coletivos e homologação","ref":"CF, art. 114; CLT, arts. 853 a 855-E e 856 a 875","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm","lessons":[["Inquérito para apuração de falta grave","Quando exigido pelo regime de garantia de emprego, o inquérito judicial busca apurar falta grave que autorize resolução contratual. O art. 853 prevê prazo de trinta dias da suspensão para ajuizamento na hipótese legal. Não generalize esse procedimento para toda garantia provisória."],["Homologação extrajudicial","O processo de homologação de acordo extrajudicial inicia-se por petição conjunta, com representação obrigatória por advogados distintos. O juiz analisa a legalidade e pode designar audiência. O pedido não dispensa o cumprimento do prazo rescisório legal."],["Dissídios coletivos","Dissídios coletivos jurídicos e econômicos possuem objetos distintos. No dissídio econômico, a Constituição prevê negociação ou arbitragem prévias e comum acordo nas condições do art. 114, § 2º, consideradas as interpretações judiciais pertinentes. Greve em atividade essencial com possibilidade de lesão do interesse público possui disciplina específica."]],"map":["Inquérito → hipóteses específicas","Acordo extrajudicial → petição conjunta","Advogados distintos → obrigatórios","Dissídio coletivo → competência e pressupostos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const processLaborQuestions=[{"id":10001,"s":9,"module":0,"topic":"Organização, competência e jurisdição trabalhista","difficulty":"Intermediária","q":"Uma empregada é contratada em uma cidade, mas trabalha durante todo o contrato em outra. Sem exceção aplicável, qual local define a competência territorial?","a":["O local da prestação de serviços","Sempre o domicílio do empregador","A sede do TST","O local de assinatura do contrato"],"ok":0,"e":"O art. 651 da CLT estabelece como regra a localidade da prestação de serviços, ainda que a contratação tenha ocorrido em outro local.","src":"CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10002,"s":9,"module":0,"topic":"Organização, competência e jurisdição trabalhista","difficulty":"Intermediária","q":"Uma ação indenizatória por dano moral decorrente da relação de emprego, entre empregado e empregador, pertence em regra a qual Justiça?","a":["Justiça Eleitoral","Justiça Militar","Justiça do Trabalho","Justiça Federal comum necessariamente"],"ok":2,"e":"O art. 114, VI, da Constituição atribui à Justiça do Trabalho as ações de indenização por dano moral ou patrimonial decorrentes da relação de trabalho.","src":"CF, arts. 111 a 116; CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":10003,"s":9,"module":1,"topic":"Princípios, partes e representação","difficulty":"Intermediária","q":"O empregado pode interpor recurso de revista ao TST pessoalmente, invocando o jus postulandi?","a":["Sim, sem restrição","Não, o jus postulandi não alcança recursos da competência do TST","Sim, se o valor for baixo","Sim, com autorização do preposto"],"ok":1,"e":"A Súmula 425 delimita o jus postulandi às Varas e TRTs, não abrangendo recursos de competência do TST.","src":"TST, Súmula 425","url":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"id":10004,"s":9,"module":1,"topic":"Princípios, partes e representação","difficulty":"Intermediária","q":"Nos termos do art. 843, § 3º, da CLT, o preposto deve necessariamente ser empregado da reclamada?","a":["Sim, sempre","Sim, por pelo menos um ano","Sim, salvo homologação sindical","Não"],"ok":3,"e":"A CLT expressamente dispensa que o preposto tenha vínculo empregatício com a parte reclamada, mantidas as demais exigências.","src":"CLT, arts. 763 a 769, 791 e 843; Súmula 425 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10005,"s":9,"module":2,"topic":"Atos processuais, prazos e nulidades","difficulty":"Intermediária","q":"Um prazo processual trabalhista de oito dias começa a fluir regularmente. Como são contados os dias?","a":["Dias corridos","Somente dias úteis quando autorizado","Dias úteis, conforme art. 775","Somente dias de audiência"],"ok":2,"e":"O art. 775 determina contagem em dias úteis, com exclusão do começo e inclusão do vencimento.","src":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10006,"s":9,"module":2,"topic":"Atos processuais, prazos e nulidades","difficulty":"Intermediária","q":"Qual período de suspensão do curso dos prazos processuais consta do art. 775-A?","a":["20 de dezembro a 20 de janeiro, inclusive","Todo o mês de fevereiro","15 a 31 de dezembro exclusivamente","Apenas feriados nacionais"],"ok":0,"e":"O art. 775-A fixa esse intervalo, sem confundir suspensão de prazos com férias individuais de magistrados.","src":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10007,"s":9,"module":3,"topic":"Reclamação trabalhista e ritos","difficulty":"Intermediária","q":"Uma reclamação individual contra empresa privada tem valor de 30 salários mínimos. Sem exclusão especial, qual rito se aplica?","a":["Ordinário obrigatório","Sumaríssimo","Ação rescisória","Procedimento penal"],"ok":1,"e":"O art. 852-A abrange dissídios individuais de até quarenta salários mínimos, respeitadas as exclusões legais.","src":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10008,"s":9,"module":3,"topic":"Reclamação trabalhista e ritos","difficulty":"Intermediária","q":"No procedimento sumaríssimo, o reclamante pede citação por edital. Qual a regra legal?","a":["Admitida automaticamente","Obrigatória em qualquer processo","Admitida mediante simples requerimento","Não se admite citação por edital"],"ok":3,"e":"O art. 852-B, II, veda a citação por edital nesse procedimento e atribui ao autor a correta indicação do nome e endereço do reclamado.","src":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10009,"s":9,"module":4,"topic":"Audiência, conciliação e resposta","difficulty":"Intermediária","q":"O reclamante falta injustificadamente à audiência inicial, sem situação excepcional. Qual consequência geral do art. 844?","a":["Arquivamento da reclamação","Condenação automática do réu","Procedência integral","Conversão em recurso de revista"],"ok":0,"e":"O caput do art. 844 prevê arquivamento em caso de ausência do reclamante; outras consequências possuem disciplina própria.","src":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10010,"s":9,"module":4,"topic":"Audiência, conciliação e resposta","difficulty":"Intermediária","q":"O reclamado está ausente, mas seu advogado comparece. A contestação escrita e os documentos devem ser necessariamente recusados?","a":["Sim, em todos os casos","Sim, se houver pedido de horas extras","Não, o § 5º do art. 844 prevê seu recebimento","Sim, porque a defesa técnica é proibida"],"ok":2,"e":"O art. 844, § 5º, determina o recebimento da contestação e dos documentos quando o advogado comparece, ainda que ausente o reclamado. Isso não elimina automaticamente os efeitos da ausência.","src":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10011,"s":9,"module":5,"topic":"Provas, ônus probatório e sentença","difficulty":"Intermediária","q":"O empregador alega ter quitado verba cuja existência é incontroversa. Quem deve provar o pagamento segundo a distribuição geral?","a":["O juiz","O reclamante em qualquer caso","O sindicato","O reclamado"],"ok":3,"e":"O pagamento é fato extintivo, cujo ônus recai em regra sobre o reclamado pelo art. 818, II.","src":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10012,"s":9,"module":5,"topic":"Provas, ônus probatório e sentença","difficulty":"Intermediária","q":"Qual o limite geral de testemunhas por parte no procedimento sumaríssimo?","a":["Duas","Três","Seis","Dez"],"ok":0,"e":"O art. 852-H, § 2º, limita a duas testemunhas por parte no sumaríssimo.","src":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10013,"s":9,"module":6,"topic":"Custas, gratuidade e honorários","difficulty":"Intermediária","q":"Qual faixa percentual o art. 791-A prevê para honorários advocatícios sucumbenciais?","a":["Um a dois por cento","Cinco a quinze por cento","Vinte a cinquenta por cento","Percentual fixo de trinta por cento"],"ok":1,"e":"O caput do art. 791-A estabelece mínimo de cinco e máximo de quinze por cento, calculados segundo as bases legais.","src":"CLT, arts. 789 a 791-A; STF, ADI 5766","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10014,"s":9,"module":6,"topic":"Custas, gratuidade e honorários","difficulty":"Intermediária","q":"O simples recebimento de créditos judiciais por beneficiário da justiça gratuita autoriza cobrança automática de honorários advocatícios suspensos?","a":["Sim, sem examinar a situação econômica","Sim, sempre que houver qualquer crédito","Não, deve ser observada a ADI 5766 e demonstrada a superação da hipossuficiência nos termos aplicáveis","Sim, por decisão exclusiva do advogado credor"],"ok":2,"e":"A interpretação do TST à ADI 5766 afasta a presunção automática de superação da insuficiência pela mera obtenção de créditos.","src":"STF, ADI 5766; aplicação pelo TST","url":"https://jurisprudencia-backend.tst.jus.br/rest/documentos/35018180d7c8c03d5dc82d4f7bff208b"},{"id":10015,"s":9,"module":7,"topic":"Recursos trabalhistas","difficulty":"Intermediária","q":"Contra sentença definitiva de Vara do Trabalho, qual é o recurso típico e o prazo geral?","a":["Recurso ordinário, oito dias úteis","Agravo de petição, trinta dias","Recurso de revista, cinco dias","Apelação civil, quinze dias"],"ok":0,"e":"O art. 895, I, prevê recurso ordinário em oito dias, contados segundo o art. 775.","src":"CLT, arts. 893 a 900; Súmula 214 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10016,"s":9,"module":7,"topic":"Recursos trabalhistas","difficulty":"Intermediária","q":"O prazo dos embargos de declaração trabalhistas previsto no art. 897-A é de quantos dias?","a":["Oito","Dez","Quinze","Cinco"],"ok":3,"e":"O art. 897-A prevê cinco dias para embargos de declaração, observada a contagem processual.","src":"CLT, arts. 893 a 900; Súmula 214 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10017,"s":9,"module":8,"topic":"Liquidação e execução trabalhista","difficulty":"Intermediária","q":"Qual prazo comum previsto no art. 879, § 2º, para impugnar fundamentadamente a conta de liquidação?","a":["Quarenta e oito horas","Oito dias","Trinta dias","Sessenta dias"],"ok":1,"e":"O dispositivo fixa prazo comum de oito dias, exigindo indicação dos itens e valores objeto de discordância, sob pena de preclusão.","src":"CLT, arts. 876 a 892 e 897","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10018,"s":9,"module":8,"topic":"Liquidação e execução trabalhista","difficulty":"Intermediária","q":"Qual recurso é tipicamente cabível das decisões do juiz na execução trabalhista, conforme art. 897, a?","a":["Recurso ordinário","Recurso especial","Agravo de petição","Apelação civil"],"ok":2,"e":"O agravo de petição é previsto no art. 897, a, com prazo de oito dias e requisitos específicos.","src":"CLT, arts. 876 a 892 e 897","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10019,"s":9,"module":9,"topic":"Ações especiais, dissídios coletivos e homologação","difficulty":"Intermediária","q":"Empregado e empregador pretendem homologar acordo extrajudicial pela CLT. Podem utilizar o mesmo advogado?","a":["Sim, sempre","Sim, se houver concordância verbal","Sim, se o valor for pequeno","Não, o art. 855-B exige advogados distintos"],"ok":3,"e":"O § 1º do art. 855-B proíbe representação das partes por advogado comum nesse procedimento.","src":"CF, art. 114; CLT, arts. 853 a 855-E e 856 a 875","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10020,"s":9,"module":9,"topic":"Ações especiais, dissídios coletivos e homologação","difficulty":"Intermediária","q":"Qual prazo o art. 853 prevê para ajuizamento de inquérito de apuração de falta grave, contado da suspensão do empregado na hipótese legal?","a":["Trinta dias","Cinco dias","Um ano","Dois anos"],"ok":0,"e":"O art. 853 prevê apresentação da reclamação escrita em trinta dias contados da suspensão, quando aplicável o inquérito.","src":"CF, art. 114; CLT, arts. 853 a 855-E e 856 a 875","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"}];const businessModules=[{"t":"Teoria da empresa e empresário","ref":"CC, arts. 966 a 980","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Atividade empresarial","A teoria da empresa centra-se na atividade econômica organizada de produção ou circulação de bens ou serviços, exercida profissionalmente. Analise a organização dos fatores de produção, a habitualidade e a finalidade econômica. Empresa é atividade; empresário é o sujeito que a exerce."],["Profissionais intelectuais","O exercício de profissão científica, literária ou artística não caracteriza, por si só, empresário, mesmo com auxiliares. A exceção ocorre quando a profissão constitui elemento de empresa. Compare um profissional que presta pessoalmente seus serviços com uma organização na qual a atividade intelectual integra estrutura empresarial mais ampla."],["Registro e capacidade","O empresário deve inscrever-se no registro mercantil antes de iniciar a atividade. A falta de inscrição não elimina necessariamente sua condição material de empresário, mas gera irregularidade. O empresário rural possui regime facultativo de inscrição nos termos do art. 971. A continuidade de empresa por incapaz depende das condições e autorização judicial previstas em lei."]],"map":["Empresa → atividade","Empresário → sujeito","Profissão intelectual → exceção do elemento de empresa","Registro rural → regime próprio"]},{"t":"Estabelecimento, nome empresarial e registro","ref":"CC, arts. 1.142 a 1.168; Lei 8.934/1994","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Estabelecimento empresarial","O estabelecimento reúne bens organizados para exercício da empresa. Pode abranger bens materiais e imateriais e não se confunde com imóvel, endereço ou pessoa jurídica. Um estabelecimento pode ser objeto unitário de negócios jurídicos, observadas exigências específicas."],["Trespasse e credores","Na alienação do estabelecimento, o art. 1.145 protege credores quando não restam ao alienante bens suficientes para quitar o passivo. O adquirente responde por débitos anteriores regularmente contabilizados, com responsabilidade solidária temporária do alienante nos termos do art. 1.146. Sucessão fiscal e trabalhista têm regras próprias."],["Nome e proteção","Nome empresarial identifica o empresário ou sociedade; marca distingue produtos ou serviços. Firma e denominação seguem regras próprias. O registro mercantil protege o nome no âmbito previsto pela legislação, sem substituir registro de marca. Salvo autorização expressa, o alienante não pode concorrer com o adquirente nos cinco anos seguintes à transferência."]],"map":["Estabelecimento → conjunto organizado de bens","Trespasse → proteção de credores","Nome empresarial ≠ marca","Não concorrência → 5 anos, regra geral"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8934.htm"},{"t":"Sociedades: classificação e personalidade jurídica","ref":"CC, arts. 981 a 996","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Sociedade simples e empresária","A classificação decorre, em regra, da natureza da atividade, e não da quantidade de sócios. Sociedade por ações é sempre empresária e cooperativa é sempre simples, independentemente do objeto. A forma limitada pode ser adotada em regimes distintos, observadas as normas de registro."],["Personalização e autonomia","A sociedade adquire personalidade com inscrição regular do ato constitutivo no registro adequado. Patrimônio social e patrimônio dos sócios não se confundem automaticamente. A desconsideração depende dos pressupostos do regime jurídico aplicável e não corresponde à dissolução da sociedade."],["Sociedades não personificadas","A sociedade em comum é disciplinada enquanto seus atos constitutivos não estão inscritos, ressalvadas hipóteses legais. A sociedade em conta de participação tem sócio ostensivo que atua em nome próprio perante terceiros e sócio participante com relação interna. Seu contrato não lhe confere personalidade, mesmo se registrado."]],"map":["Empresária → atividade, ressalvadas regras especiais","S.A. → sempre empresária","Cooperativa → sempre simples","SCP → sem personalidade jurídica"]},{"t":"Sociedade limitada e governança","ref":"CC, arts. 1.052 a 1.087","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Quotas e capital","A limitada admite uma ou mais pessoas. Cada sócio tem responsabilidade restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital. A prestação de serviços não pode constituir contribuição ao capital da limitada. Distinga capital subscrito de capital efetivamente integralizado."],["Administração e deliberações","A administração pode ser atribuída a sócios ou não sócios, observados requisitos e quóruns vigentes. Deliberações sobre alteração contratual e administração seguem o Código Civil e o contrato social. Não memorize quóruns antigos: as Leis 13.792/2019 e 14.451/2022 modificaram regras relevantes."],["Saída e exclusão","Retirada, morte e exclusão de sócio possuem pressupostos e efeitos próprios. A exclusão extrajudicial por justa causa exige os requisitos do art. 1.085, inclusive previsão contratual e deliberação pertinente. A apuração de haveres não elimina automaticamente responsabilidade por obrigações anteriores nos limites legais."]],"map":["Limitada → um ou mais sócios","Quotas → responsabilidade limitada","Integralização → solidariedade","Exclusão → requisitos legais e contratuais"]},{"t":"Sociedades anônimas e mercado de capitais","ref":"Lei 6.404/1976, arts. 1º a 4º, 109, 116 a 117 e 138 a 158","url":"https://www.planalto.gov.br/ccivil_03/leis/l6404compilada.htm","lessons":[["Capital e ações","A companhia tem capital dividido em ações. A responsabilidade do acionista limita-se ao preço de emissão das ações subscritas ou adquiridas, observadas hipóteses próprias de responsabilização. Ações ordinárias e preferenciais possuem direitos definidos por lei e estatuto; não se presume que todas tenham voto idêntico."],["Companhias abertas e fechadas","A distinção depende da admissão dos valores mobiliários à negociação no mercado de valores mobiliários. Companhias abertas submetem-se ao regime de registro, fiscalização e divulgação pertinente à CVM. Não basta possuir muitos acionistas para caracterizar companhia aberta."],["Órgãos e deveres","Assembleia geral, administração e conselho fiscal exercem atribuições distintas. Administradores devem atuar com diligência, lealdade e finalidade compatível com o interesse social. O controlador não possui liberdade para abusar do poder de controle em prejuízo da companhia ou dos demais acionistas."]],"map":["Capital → ações","Acionista → preço de emissão","Aberta → mercado de valores mobiliários","Controle → deveres e limites"]},{"t":"Títulos de crédito: princípios e circulação","ref":"CC, arts. 887 a 926","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","lessons":[["Princípios cambiários","Literalidade delimita o conteúdo do direito incorporado ao título; autonomia protege a independência das obrigações cambiárias nos limites legais. A cartularidade tradicional deve ser compreendida considerando títulos eletrônicos admitidos pela legislação. Nem todo documento representativo de crédito é título cambiário."],["Endosso e cessão","O endosso é meio de circulação de títulos à ordem. Sua forma e responsabilidade do endossante dependem do regime aplicável, especialmente de leis cambiárias especiais. Não confunda endosso com cessão civil, que possui regras próprias quanto a efeitos e defesas oponíveis."],["Aval e garantias","O aval garante obrigação cambiária e tem autonomia própria, distinta da fiança. O avalista equipara-se ao avalizado nos termos do regime jurídico correspondente. O Código Civil veda aval parcial, mas leis especiais podem admiti-lo; antes de responder, identifique o título e a lei aplicável."]],"map":["Literalidade → conteúdo do título","Autonomia → obrigações cambiárias","Endosso → circulação","Aval ≠ fiança"]},{"t":"Cheque, nota promissória e duplicata","ref":"Lei 7.357/1985; Lei 5.474/1968; Decreto 57.663/1966","url":"https://www.planalto.gov.br/ccivil_03/leis/l7357.htm","lessons":[["Cheque","Cheque constitui ordem de pagamento à vista. A indicação de data futura não altera essa natureza cambiária, embora a apresentação antecipada possa produzir consequências civis. Os prazos de apresentação variam conforme a praça de emissão e pagamento; a prescrição executiva possui termo inicial próprio."],["Nota promissória","A nota promissória contém promessa de pagamento, ao contrário da ordem característica do cheque. A Lei Uniforme de Genebra disciplina seus requisitos e aplicação de regras cambiárias pertinentes. Examine vencimento, assinaturas, aval e endosso antes de determinar a obrigação exigível."],["Duplicata","A duplicata vincula-se a operação mercantil ou prestação de serviços documentada, segundo a legislação. Para cobrança executiva de duplicata não aceita, devem ser examinados protesto, prova de entrega ou prestação e ausência de recusa legítima, conforme o regime. A duplicata escritural também possui disciplina própria."]],"map":["Cheque → ordem à vista","Promissória → promessa","Duplicata → operação causal","Execução → requisitos do título"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l5474.htm"},{"t":"Propriedade industrial e contratos empresariais","ref":"Lei 9.279/1996, arts. 8º, 9º, 40, 122 a 129 e 133; Lei 13.966/2019","url":"https://www.planalto.gov.br/ccivil_03/leis/l9279.htm","lessons":[["Patentes e desenhos industriais","A proteção de invenções exige novidade, atividade inventiva e aplicação industrial. Modelo de utilidade tem requisitos distintos relacionados à melhoria funcional. Patente e registro de desenho industrial não se confundem com marca. A vigência da patente deve observar o art. 40 e a decisão do STF na ADI 5529."],["Marcas e concorrência","A marca protege sinal distintivo nas condições legais, e a aquisição do direito de propriedade decorre, em regra, de registro válido. A proteção admite situações especiais, como marca notoriamente conhecida. O prazo de registro da marca é de dez anos, prorrogável por períodos iguais sucessivos."],["Franquia e outros contratos","Na franquia empresarial, o franqueador autoriza uso de marca e outros direitos e métodos de negócio, conforme contrato e lei específica. A circular de oferta deve ser entregue pelo menos dez dias antes da assinatura ou pagamento previsto em lei. A franquia não configura, por si só, vínculo empregatício ou relação de consumo entre franqueador e franqueado."]],"map":["Patente → requisitos técnicos","Marca → sinal distintivo","Marca registrada → 10 anos renováveis","Franquia → circular prévia"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/lei/l13966.htm"},{"t":"Recuperação judicial e extrajudicial","ref":"Lei 11.101/2005, arts. 1º a 6º, 47 a 69 e 161 a 167","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm","lessons":[["Objetivo e legitimidade","A recuperação busca superar crise econômico-financeira de atividade viável, preservando atividade produtiva, empregos e interesses dos credores. Sua incidência depende do sujeito e das exclusões do art. 2º. O art. 48 exige exercício regular de atividade por mais de dois anos e outros requisitos cumulativos."],["Processamento, créditos e plano","Deferimento do processamento não equivale à concessão da recuperação. A suspensão de execuções e a sujeição de créditos têm exceções expressas. Em regra, os créditos existentes na data do pedido se submetem, ainda que não vencidos. O plano deve ser apresentado no prazo legal de sessenta dias contado da publicação da decisão de processamento."],["Assembleia e recuperação extrajudicial","Credores deliberam sobre o plano conforme classes e quóruns pertinentes; existem hipóteses de concessão judicial em condições legais mesmo sem aprovação ordinária. A recuperação extrajudicial permite negociação e homologação nos limites de sua disciplina. Verifique créditos excluídos, quóruns e requisitos na redação atualizada pela Lei 14.112/2020."]],"map":["Recuperação → atividade viável","Processamento ≠ concessão","Plano → 60 dias, regra legal","Créditos → sujeição e exceções"]},{"t":"Falência, classificação de créditos e encerramento","ref":"Lei 11.101/2005, arts. 75 a 160","url":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11101compilado.htm","lessons":[["Pressupostos da falência","A falência é procedimento coletivo de liquidação e reorganização de ativos, submetido às finalidades legais. O art. 94 prevê hipóteses distintas de impontualidade injustificada, execução frustrada e atos falimentares. Não se decreta falência apenas porque a empresa está momentaneamente com prejuízo contábil."],["Efeitos e administração","A decretação altera a administração e disponibilidade patrimonial do falido. O administrador judicial desempenha funções de arrecadação, verificação de créditos e outras previstas em lei, sob fiscalização judicial. O juízo falimentar possui competência própria, com exceções expressas."],["Pagamento e encerramento","A ordem de pagamento deve distinguir créditos extraconcursais do art. 84 e concursais do art. 83. Créditos trabalhistas têm preferência nos limites legais e existem regras para garantias reais, tributários e outras classes. Encerramento do processo e extinção das obrigações do falido possuem requisitos próprios, alterados pela reforma de 2020."]],"map":["Falência → hipóteses do art. 94","Administrador judicial → funções legais","Extraconcursal → art. 84","Concursal → ordem do art. 83"]}];const businessQuestions=[{"id":11001,"s":10,"module":0,"topic":"Teoria da empresa e empresário","difficulty":"Intermediária","q":"Uma escritora trabalha pessoalmente com auxílio de uma secretária, sem que a profissão constitua elemento de empresa. É necessariamente empresária?","a":["Sim, por possuir auxiliar","Não, aplica-se a ressalva do art. 966","Sim, por receber remuneração","Sim, se publicar livros"],"ok":1,"e":"A contratação de auxiliares não basta para caracterizar atividade empresarial intelectual. Deve estar presente o elemento de empresa (art. 966, parágrafo único).","src":"CC, arts. 966 a 980","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11002,"s":10,"module":0,"topic":"Teoria da empresa e empresário","difficulty":"Intermediária","q":"Qual o regime geral de inscrição do empresário cuja atividade rural constitui sua principal profissão?","a":["Inscrição obrigatória em cartório civil em qualquer caso","Proibição de inscrição mercantil","Inscrição facultativa no registro mercantil, com os efeitos legais","Registro exclusivo na CVM"],"ok":2,"e":"O art. 971 permite requerer inscrição ao empresário rural, que, depois de inscrito, se equipara ao empresário sujeito a registro.","src":"CC, arts. 966 a 980","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11003,"s":10,"module":1,"topic":"Estabelecimento, nome empresarial e registro","difficulty":"Intermediária","q":"Qual conceito corresponde ao conjunto de bens organizado para exercer a empresa?","a":["Estabelecimento empresarial","Capital social exclusivamente","Pessoa jurídica","Marca registrada necessariamente"],"ok":0,"e":"O art. 1.142 define o estabelecimento pela organização de bens para exercício da empresa, e não apenas pelo local físico.","src":"CC, arts. 1.142 a 1.168; Lei 8.934/1994","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11004,"s":10,"module":1,"topic":"Estabelecimento, nome empresarial e registro","difficulty":"Intermediária","q":"Salvo autorização expressa, por quanto tempo o alienante de estabelecimento fica impedido de concorrer com o adquirente?","a":["Um ano","Dois anos","Dez anos","Cinco anos"],"ok":3,"e":"O art. 1.147 estabelece vedação de concorrência por cinco anos subsequentes à transferência, salvo autorização expressa.","src":"CC, arts. 1.142 a 1.168; Lei 8.934/1994","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11005,"s":10,"module":2,"topic":"Sociedades: classificação e personalidade jurídica","difficulty":"Intermediária","q":"Independentemente de seu objeto, como se classifica a cooperativa segundo o art. 982?","a":["Sempre sociedade empresária","Sempre sociedade simples","Sempre sociedade anônima","Sempre sociedade em comum"],"ok":1,"e":"O parágrafo único do art. 982 atribui natureza simples à cooperativa e empresária à sociedade por ações.","src":"CC, arts. 981 a 996","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11006,"s":10,"module":2,"topic":"Sociedades: classificação e personalidade jurídica","difficulty":"Intermediária","q":"O registro do contrato de sociedade em conta de participação lhe confere personalidade jurídica?","a":["Sim, em qualquer registro","Sim, se houver três sócios","Não, conforme art. 993","Sim, após aprovação da CVM"],"ok":2,"e":"O art. 993 estabelece que eventual inscrição do instrumento em registro não confere personalidade jurídica à SCP.","src":"CC, arts. 981 a 996","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11007,"s":10,"module":3,"topic":"Sociedade limitada e governança","difficulty":"Intermediária","q":"É possível constituir sociedade limitada com apenas uma pessoa?","a":["Não, exige dois sócios em todos os casos","Não, exige cinco sócios","Sim, o art. 1.052 admite uma ou mais pessoas","Apenas mediante autorização judicial"],"ok":2,"e":"O art. 1.052, § 1º, admite sociedade limitada unipessoal ou pluripessoal.","src":"CC, arts. 1.052 a 1.087","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11008,"s":10,"module":3,"topic":"Sociedade limitada e governança","difficulty":"Intermediária","q":"Na limitada, como se dá a responsabilidade dos sócios pela integralização do capital social?","a":["Todos respondem solidariamente","Nenhum responde pela integralização","Somente o administrador responde","É sempre exclusiva do maior quotista"],"ok":0,"e":"O art. 1.052 distingue responsabilidade restrita ao valor das quotas da solidariedade pela integralização do capital.","src":"CC, arts. 1.052 a 1.087","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11009,"s":10,"module":4,"topic":"Sociedades anônimas e mercado de capitais","difficulty":"Intermediária","q":"Qual elemento caracteriza a divisão do capital de uma sociedade anônima?","a":["Quotas de trabalho exclusivamente","Ações","Títulos públicos obrigatoriamente","Frações de imóvel"],"ok":1,"e":"O art. 1º da Lei 6.404/1976 caracteriza a companhia pelo capital dividido em ações.","src":"Lei 6.404/1976, arts. 1º a 4º, 109, 116 a 117 e 138 a 158","url":"https://www.planalto.gov.br/ccivil_03/leis/l6404compilada.htm"},{"id":11010,"s":10,"module":4,"topic":"Sociedades anônimas e mercado de capitais","difficulty":"Intermediária","q":"O que distingue uma companhia aberta da fechada, nos termos do art. 4º?","a":["A quantidade mínima de funcionários","O tamanho da sede","A nacionalidade do controlador","A admissão ou não dos valores mobiliários à negociação no mercado"],"ok":3,"e":"O art. 4º adota como critério a admissão de valores mobiliários de emissão da companhia à negociação no mercado de valores mobiliários.","src":"Lei 6.404/1976, arts. 1º a 4º, 109, 116 a 117 e 138 a 158","url":"https://www.planalto.gov.br/ccivil_03/leis/l6404compilada.htm"},{"id":11011,"s":10,"module":5,"topic":"Títulos de crédito: princípios e circulação","difficulty":"Intermediária","q":"Qual princípio relaciona a extensão do direito cambiário ao conteúdo expresso no título?","a":["Oralidade","Publicidade processual","Literalidade","Anterioridade tributária"],"ok":2,"e":"A literalidade vincula o exercício do direito ao conteúdo documentado, consideradas as normas específicas do título.","src":"CC, arts. 887 a 926","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11012,"s":10,"module":5,"topic":"Títulos de crédito: princípios e circulação","difficulty":"Intermediária","q":"Qual instituto constitui garantia tipicamente cambiária, distinguindo-se da fiança civil?","a":["Aval","Usucapião","Comodato","Novação obrigatória"],"ok":0,"e":"O aval é garantia própria de títulos de crédito, submetida ao regime cambiário pertinente.","src":"CC, arts. 887 a 926","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":11013,"s":10,"module":6,"topic":"Cheque, nota promissória e duplicata","difficulty":"Intermediária","q":"Segundo o art. 32 da Lei do Cheque, qual a natureza temporal da ordem de pagamento?","a":["À vista","Obrigatoriamente a prazo","Somente após noventa dias","Somente após autorização judicial"],"ok":0,"e":"A lei considera cheque pagável à vista, ainda que conste indicação em contrário. Eventuais efeitos civis do pacto de pós-datação são questão distinta.","src":"Lei 7.357/1985; Lei 5.474/1968; Decreto 57.663/1966","url":"https://www.planalto.gov.br/ccivil_03/leis/l7357.htm"},{"id":11014,"s":10,"module":6,"topic":"Cheque, nota promissória e duplicata","difficulty":"Intermediária","q":"Qual título está causalmente ligado, nos termos da legislação própria, à venda mercantil ou prestação de serviços?","a":["Cheque em qualquer hipótese","Nota promissória em qualquer hipótese","Ação ordinária de companhia","Duplicata"],"ok":3,"e":"A Lei 5
