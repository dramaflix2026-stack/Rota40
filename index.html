,"q":"Brasileiro nato pode ser extraditado por crime comum cometido no exterior?","a":["Sim, se houver tratado","Não, a Constituição veda sua extradição","Sim, se houver pena superior a quatro anos","Sim, mediante decisão de autoridade policial"],"ok":1,"e":"O art. 5º, LI, da Constituição veda a extradição de brasileiro nato.","src":"CF, arts. 5º, LI, e 102, I, g","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14018,"s":13,"module":8,"topic":"Extradição, imunidades e relações diplomáticas","difficulty":"Intermediária","q":"Qual órgão julga pedido de extradição solicitado por Estado estrangeiro?","a":["STJ","Tribunal de Contas da União","STF","Conselho Nacional de Justiça"],"ok":2,"e":"O art. 102, I, g, da Constituição atribui ao STF o processamento e julgamento da extradição solicitada por Estado estrangeiro.","src":"CF, arts. 5º, LI, e 102, I, g","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":14019,"s":13,"module":9,"topic":"Responsabilidade internacional e Tribunal Penal Internacional","difficulty":"Intermediária","q":"Qual princípio caracteriza a relação do TPI com as jurisdições penais nacionais?","a":["Substituição automática de todos os tribunais nacionais","Complementaridade","Imunidade absoluta de qualquer pessoa","Exclusividade universal sem condições"],"ok":1,"e":"Os arts. 1º e 17 do Estatuto de Roma estabelecem caráter complementar e critérios de admissibilidade em relação às jurisdições nacionais.","src":"Estatuto de Roma, arts. 1º, 5º, 11, 17 e 25; CF, art. 5º, § 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto/2002/d4388.htm"},{"id":14020,"s":13,"module":9,"topic":"Responsabilidade internacional e Tribunal Penal Internacional","difficulty":"Intermediária","q":"O TPI julga diretamente a responsabilidade internacional de Estados, substituindo a CIJ?","a":["Sim, em qualquer controvérsia","Sim, em matéria comercial","Sim, se houver tratado bilateral","Não, sua jurisdição penal recai sobre pessoas naturais"],"ok":3,"e":"O art. 25 do Estatuto de Roma trata de responsabilidade penal individual; a CIJ possui função e competência distintas.","src":"Estatuto de Roma, arts. 1º, 5º, 11, 17 e 25; CF, art. 5º, § 4º","url":"https://www.planalto.gov.br/ccivil_03/decreto/2002/d4388.htm"}];const consumerModules=[{"t":"Relação de consumo e princípios do CDC","ref":"CDC, arts. 1º a 5º; CF, arts. 5º, XXXII e 170, V","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Consumidor e destinatário final","Consumidor é pessoa natural ou jurídica que adquire ou utiliza produto ou serviço como destinatária final. A jurisprudência do STJ admite mitigação da teoria finalista em situações de vulnerabilidade demonstrada. A aquisição para integrar atividade produtiva não caracteriza automaticamente relação de consumo."],["Fornecedor, produto e serviço","Fornecedor abrange sujeitos públicos ou privados que desenvolvem atividades de fornecimento nos termos do art. 3º. Produto pode ser material ou imaterial, móvel ou imóvel. Serviço envolve atividade fornecida mediante remuneração, inclusive bancária, financeira, de crédito e securitária, ressalvadas relações trabalhistas."],["Vulnerabilidade e equiparação","O CDC reconhece a vulnerabilidade do consumidor como princípio da política nacional. Equiparações legais alcançam coletividade, vítimas de acidentes de consumo e pessoas expostas a práticas comerciais, conforme cada dispositivo. Não se deve exigir aquisição direta do produto em todas as hipóteses."]],"map":["Consumidor → destinatário final","Fornecedor → atividade de fornecimento","Vulnerabilidade → princípio","Equiparação → hipóteses legais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direitos básicos, informação e segurança","ref":"CDC, arts. 6º a 10","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Informação e transparência","O consumidor tem direito à informação adequada e clara sobre características, composição, quantidade, preço e riscos. Informação incompleta pode comprometer consentimento e segurança. A oferta precisa permitir comparação e compreensão das condições relevantes, inclusive de custos adicionais."],["Proteção da saúde e segurança","Produtos e serviços não devem acarretar riscos à saúde ou segurança, exceto os normais e previsíveis em decorrência de sua natureza e fruição, com informação adequada. Produto com alto grau de nocividade ou periculosidade conhecida não pode ser colocado no mercado pelo fornecedor."],["Reparação e facilitação da defesa","O consumidor tem direito à prevenção e reparação de danos patrimoniais e morais, individuais e coletivos. A inversão judicial do ônus da prova pode ocorrer diante de verossimilhança ou hipossuficiência, segundo critérios legais. Não é consequência automática de toda ação de consumo."]],"map":["Informação → clareza e adequação","Segurança → riscos e prevenção","Recall → comunicação posterior de risco","Ônus da prova → critérios legais"]},{"t":"Responsabilidade pelo fato do produto e do serviço","ref":"CDC, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Acidente de consumo","O fato do produto ou serviço envolve defeito que compromete a segurança legitimamente esperada e causa dano. Distingue-se do vício de adequação, que afeta qualidade, quantidade ou funcionamento. O fabricante, produtor, construtor, importador e fornecedor de serviços respondem objetivamente nas hipóteses legais."],["Comerciante e excludentes","O comerciante possui responsabilidade pelo fato do produto nas hipóteses específicas do art. 13. O fornecedor pode afastar responsabilidade demonstrando excludentes legalmente previstas, como inexistência do defeito ou culpa exclusiva do consumidor ou terceiro, conforme o regime. Não basta alegação genérica de ausência de culpa."],["Profissionais liberais","A responsabilidade pessoal dos profissionais liberais por fato do serviço é apurada mediante verificação de culpa, conforme art. 14, § 4º. Essa exceção não se estende automaticamente a toda pessoa jurídica prestadora de serviços. A análise deve identificar quem forneceu o serviço, o defeito e o nexo causal."]],"map":["Fato → acidente e dano","Defeito → segurança esperada","Responsabilidade → objetiva, em regra","Profissional liberal → culpa pessoal"]},{"t":"Vícios de produtos e serviços, garantias e prazos","ref":"CDC, arts. 18 a 27 e 50","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Vício de adequação","Fornecedores de produtos respondem solidariamente pelos vícios de qualidade ou quantidade nos termos do art. 18. Em regra, o fornecedor dispõe de até trinta dias para sanar o vício. Não resolvido, o consumidor escolhe substituição, restituição do preço ou abatimento proporcional. Há situações de exercício imediato previstas no § 3º."],["Vícios de serviços","O art. 20 oferece alternativas como reexecução sem custo adicional, restituição da quantia paga e abatimento proporcional. A disciplina não se confunde integralmente com a do vício de produto. O consumidor deve demonstrar inadequação e a solução depende das circunstâncias e do regime aplicável."],["Decadência e prescrição","O direito de reclamar por vícios aparentes ou de fácil constatação tem prazo decadencial de trinta dias para produtos e serviços não duráveis e noventa para duráveis. No vício oculto, a contagem começa quando evidenciado. A pretensão de reparação por fato do produto ou serviço segue prazo de cinco anos do conhecimento do dano e autoria. Garantia contratual complementa a legal."]],"map":["Vício → inadequação","Reparo do produto → até 30 dias, regra geral","Decadência → 30 ou 90 dias","Fato do consumo → prescrição de 5 anos"]},{"t":"Oferta, publicidade e práticas abusivas","ref":"CDC, arts. 29 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Vinculação da oferta","Informação ou publicidade suficientemente precisa obriga o fornecedor que a fizer veicular ou dela se utilizar e integra o contrato. Se houver recusa de cumprimento, o art. 35 prevê alternativas, incluindo cumprimento forçado, prestação equivalente ou resolução com restituição e eventuais perdas e danos."],["Publicidade enganosa e abusiva","Publicidade enganosa contém informação falsa ou capaz de induzir em erro, inclusive por omissão de dado essencial. Publicidade abusiva viola valores protegidos, como aquela discriminatória ou que explore a deficiência de julgamento da criança. O ônus da prova da veracidade e correção da publicidade cabe a quem a patrocina."],["Práticas comerciais vedadas","O art. 39 proíbe condicionar fornecimento à aquisição de outro produto ou serviço, salvo as distinções legais aplicáveis, e outras práticas abusivas. Envio de produto não solicitado, em regra, equivale a amostra grátis. A cobrança de vantagem manifestamente excessiva exige exame da prática concreta."]],"map":["Oferta precisa → vincula","Enganosa → indução ao erro","Abusiva → valores protegidos","Venda casada → vedação"]},{"t":"Contratos de consumo e cláusulas abusivas","ref":"CDC, arts. 46 a 54","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Conhecimento e interpretação","Contratos não obrigam o consumidor quando não lhe é dada oportunidade de conhecimento prévio ou quando instrumentos dificultam a compreensão de seu sentido e alcance. Cláusulas contratuais devem ser interpretadas de maneira mais favorável ao consumidor, conforme art. 47."],["Cláusulas abusivas","O art. 51 estabelece nulidade de pleno direito de cláusulas abusivas, como aquelas que imponham desvantagem exagerada ou afastem indevidamente responsabilidade legal. A nulidade de uma cláusula não invalida necessariamente todo o contrato, salvo consequências previstas no § 2º."],["Adesão e revisão","Contrato de adesão tem cláusulas previamente estabelecidas sem possibilidade de discussão substancial pelo consumidor. Cláusulas limitativas de direitos exigem destaque. O art. 6º, V, protege modificação de prestações desproporcionais e revisão diante de fatos supervenientes que as tornem excessivamente onerosas."]],"map":["Prévio conhecimento → exigência","Interpretação → favorável ao consumidor","Abusividade → nulidade","Adesão → destaque de limitações"]},{"t":"Comércio eletrônico e direito de arrependimento","ref":"CDC, art. 49; Decreto 7.962/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Contratação a distância","O comércio eletrônico exige informação clara sobre fornecedor, produto, despesas adicionais e condições integrais da oferta. O Decreto 7.962/2013 prevê mecanismos para correção de erros antes da contratação, confirmação da aceitação e atendimento facilitado."],["Arrependimento","Nas contratações fora do estabelecimento comercial, o art. 49 prevê prazo de sete dias a partir da assinatura ou do recebimento do produto ou serviço, conforme o caso. O direito não exige demonstração de defeito. Valores pagos a qualquer título durante o prazo de reflexão devem ser devolvidos nos termos legais."],["Atendimento e cancelamento","O fornecedor deve disponibilizar meios adequados para exercício do arrependimento, inclusive pela mesma ferramenta utilizada para contratação, sem prejuízo de outros meios. O cancelamento de contratos acessórios vinculados segue a disciplina regulamentar. Não confunda arrependimento com garantia por vício."]],"map":["E-commerce → transparência","Fora do estabelecimento → art. 49","Arrependimento → 7 dias","Devolução → valores pagos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/decreto/d7962.htm"},{"t":"Cobrança de dívidas e cadastros de consumidores","ref":"CDC, arts. 42 a 44","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Cobrança legítima e abuso","O consumidor inadimplente não pode ser exposto ao ridículo nem submetido a ameaça ou constrangimento. O fornecedor pode buscar satisfação de crédito legítimo por meios lícitos. A existência de dívida não afasta deveres de respeito, privacidade e adequação dos contatos de cobrança."],["Repetição do indébito","O consumidor cobrado indevidamente que paga valor em excesso tem direito à repetição em dobro, acrescida de correção e juros legais, salvo engano justificável. A jurisprudência do STJ considera a boa-fé objetiva, observadas as condições e modulação temporal pertinentes. Cobrança sem pagamento não gera automaticamente repetição de valor inexistente."],["Cadastros e correção","O consumidor tem acesso a dados cadastrais e respectivas fontes. Informações devem ser objetivas, claras e verdadeiras. Dados negativos não podem referir-se a período superior a cinco anos, observadas as regras legais. A abertura de cadastro não solicitada deve ser comunicada por escrito e dados inexatos podem ser corrigidos."]],"map":["Cobrança → sem constrangimento","Pagamento indevido → repetição conforme requisitos","Cadastro → informação e acesso","Negativação → limite legal"]},{"t":"Crédito responsável e superendividamento","ref":"CDC, arts. 54-A a 54-G e 104-A a 104-C; Lei 14.181/2021","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Conceito e prevenção","Superendividamento é impossibilidade manifesta de consumidor pessoa natural, de boa-fé, pagar a totalidade das dívidas de consumo exigíveis e vincendas sem comprometer o mínimo existencial, nos termos da regulamentação. O regime possui exclusões, como dívidas contraídas mediante fraude ou má-fé nas condições legais."],["Crédito responsável","O fornecedor deve informar custos, encargos, consequências do inadimplemento e avaliar responsavelmente as condições de crédito. É vedado ocultar riscos ou assediar consumidores para contratar, especialmente em situações de vulnerabilidade agravada. A proteção não significa proibição geral de concessão de crédito."],["Repactuação","O processo de repactuação permite audiência conciliatória com credores abrangidos e proposta de plano de pagamento em até cinco anos, preservado o mínimo existencial e observadas exclusões do art. 104-A. Frustrada a conciliação, existem mecanismos judiciais próprios. Nem toda dívida é incluída e o valor regulamentar do mínimo existencial deve ser conferido na data aplicável."]],"map":["Boa-fé → requisito","Crédito → informação e avaliação","Mínimo existencial → preservação","Plano → até 5 anos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14181.htm"},{"t":"Tutela individual, coletiva e sistema de defesa","ref":"CDC, arts. 55 a 60 e 81 a 104","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm","lessons":[["Tutela administrativa","O Sistema Nacional de Defesa do Consumidor articula órgãos públicos e entidades de defesa. Procons exercem atribuições administrativas, inclusive fiscalização e sanções nos limites de competência. Sanção administrativa não se confunde com indenização civil nem exclui outras medidas cabíveis."],["Direitos difusos, coletivos e individuais homogêneos","Direitos difusos são transindividuais indivisíveis de titulares indeterminados ligados por circunstâncias de fato. Coletivos em sentido estrito envolvem grupo, categoria ou classe ligados por relação jurídica base. Individuais homogêneos decorrem de origem comum, permitindo tutela coletiva conforme a lei."],["Legitimidade e acesso à Justiça","O art. 82 atribui legitimidade coletiva ao Ministério Público, entes públicos, entidades administrativas específicas e associações que atendam requisitos legais. A ação individual por responsabilidade do fornecedor pode ser proposta no domicílio do autor conforme art. 101, I. A coisa julgada coletiva segue regras diferenciadas conforme a espécie de direito."]],"map":["Procon → atuação administrativa","Difuso → titulares indeterminados","Coletivo estrito → relação jurídica base","Homogêneo → origem comum"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l7347compilada.htm"}];const consumerQuestions=[{"id":15001,"s":14,"module":0,"topic":"Relação de consumo e princípios do CDC","difficulty":"Intermediária","q":"Uma pessoa jurídica pode ser consumidora nos termos do CDC?","a":["Não, em nenhuma hipótese","Sim, quando preenchidos os pressupostos da relação de consumo","Somente se for entidade pública","Somente se tiver um empregado"],"ok":1,"e":"O art. 2º admite pessoa natural ou jurídica como consumidora, desde que seja destinatária final, consideradas as hipóteses reconhecidas pela jurisprudência.","src":"CDC, arts. 1º a 5º; CF, arts. 5º, XXXII e 170, V","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15002,"s":14,"module":0,"topic":"Relação de consumo e princípios do CDC","difficulty":"Intermediária","q":"Uma pessoa sofre dano em acidente de consumo embora não tenha adquirido o produto. Pode ser equiparada a consumidor?","a":["Não, pois não assinou contrato","Não, salvo se for empregada do fabricante","Sim, o art. 17 equipara todas as vítimas do evento","Somente se for revendedora"],"ok":2,"e":"O art. 17 equipara às figuras de consumidor todas as vítimas do evento para os efeitos da seção sobre responsabilidade pelo fato do produto ou serviço.","src":"CDC, arts. 1º a 5º; CF, arts. 5º, XXXII e 170, V","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15003,"s":14,"module":1,"topic":"Direitos básicos, informação e segurança","difficulty":"Intermediária","q":"O fornecedor descobre, após colocar produto no mercado, periculosidade relevante anteriormente desconhecida. Qual dever prevê o art. 10, § 1º?","a":["Comunicar imediatamente autoridades competentes e consumidores","Manter segredo comercial","Aguardar ocorrência de dano antes de informar","Apenas alterar o preço"],"ok":0,"e":"O art. 10, § 1º, determina comunicação imediata às autoridades e consumidores mediante anúncios publicitários, nos termos legais.","src":"CDC, arts. 6º a 10","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15004,"s":14,"module":1,"topic":"Direitos básicos, informação e segurança","difficulty":"Intermediária","q":"A inversão judicial do ônus da prova do art. 6º, VIII, é automaticamente obrigatória em todo processo de consumo?","a":["Sim, independentemente do caso","Sim, se o pedido for verbal","Sim, por mera escolha do fornecedor","Não, depende da avaliação dos requisitos legais"],"ok":3,"e":"A facilitação da defesa inclui inversão a critério do juiz quando verossímil a alegação ou quando o consumidor for hipossuficiente, segundo regras de experiência.","src":"CDC, arts. 6º a 10","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15005,"s":14,"module":2,"topic":"Responsabilidade pelo fato do produto e do serviço","difficulty":"Intermediária","q":"Qual regime o art. 14, § 4º, estabelece para responsabilidade pessoal de profissional liberal?","a":["Responsabilidade objetiva em todos os casos","Verificação de culpa","Imunidade civil absoluta","Responsabilidade exclusivamente penal"],"ok":1,"e":"O § 4º estabelece apuração mediante verificação de culpa para responsabilidade pessoal dos profissionais liberais.","src":"CDC, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15006,"s":14,"module":2,"topic":"Responsabilidade pelo fato do produto e do serviço","difficulty":"Intermediária","q":"Qual situação caracteriza, em princípio, fato do produto, e não mero vício de adequação?","a":["Produto entregue em cor diferente sem outro dano","Atraso na entrega sem acidente","Defeito de segurança que causa lesão ao consumidor","Ausência de embalagem decorativa"],"ok":2,"e":"O fato do produto envolve defeito de segurança e dano decorrente, conforme art. 12; o vício possui disciplina específica nos arts. 18 e seguintes.","src":"CDC, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15007,"s":14,"module":3,"topic":"Vícios de produtos e serviços, garantias e prazos","difficulty":"Intermediária","q":"Qual o prazo decadencial para reclamar de vício aparente de produto durável?","a":["Sete dias","Trinta dias","Cinco anos","Noventa dias"],"ok":3,"e":"O art. 26, II, prevê noventa dias para produtos e serviços duráveis, observadas as regras de início e obstáculos à decadência.","src":"CDC, arts. 18 a 27 e 50","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15008,"s":14,"module":3,"topic":"Vícios de produtos e serviços, garantias e prazos","difficulty":"Intermediária","q":"Quando começa o prazo decadencial para reclamação de vício oculto?","a":["No momento em que o defeito fica evidenciado","Sempre na fabricação","Sempre na assinatura do contrato","Após cinco anos da compra"],"ok":0,"e":"O art. 26, § 3º, estabelece início da contagem no momento em que ficar evidenciado o defeito oculto.","src":"CDC, arts. 18 a 27 e 50","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15009,"s":14,"module":4,"topic":"Oferta, publicidade e práticas abusivas","difficulty":"Intermediária","q":"Um fornecedor recusa cumprir oferta suficientemente precisa que integra a contratação. Qual alternativa está prevista no art. 35?","a":["Exigir o cumprimento forçado da oferta","Perder obrigatoriamente todo valor pago","Aceitar qualquer produto imposto pelo fornecedor","Aguardar autorização legislativa"],"ok":0,"e":"O art. 35 permite ao consumidor optar pelo cumprimento forçado, aceitar equivalente ou rescindir o contrato, com os efeitos previstos.","src":"CDC, arts. 29 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15010,"s":14,"module":4,"topic":"Oferta, publicidade e práticas abusivas","difficulty":"Intermediária","q":"O fornecedor condiciona injustificadamente a venda de um produto à aquisição de outro. Qual prática é caracterizada?","a":["Exercício obrigatório de garantia","Compensação tributária","Venda casada","Direito de arrependimento"],"ok":2,"e":"O art. 39, I, veda condicionar fornecimento de produto ou serviço ao fornecimento de outro, bem como impor limites quantitativos sem justa causa.","src":"CDC, arts. 29 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15011,"s":14,"module":5,"topic":"Contratos de consumo e cláusulas abusivas","difficulty":"Intermediária","q":"Havendo dúvida interpretativa sobre cláusula de contrato de consumo, qual regra prevê o art. 47?","a":["Interpretação necessariamente favorável ao fornecedor","Interpretação mais favorável ao consumidor","Inexistência de qualquer interpretação","Nulidade integral obrigatória"],"ok":1,"e":"O art. 47 determina interpretação das cláusulas contratuais de maneira mais favorável ao consumidor.","src":"CDC, arts. 46 a 54","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15012,"s":14,"module":5,"topic":"Contratos de consumo e cláusulas abusivas","difficulty":"Intermediária","q":"A nulidade de uma cláusula abusiva sempre invalida o contrato inteiro?","a":["Sim, sem exceção","Sim, independentemente das demais cláusulas","Sim, se o fornecedor desejar","Não, deve ser observado o art. 51, § 2º"],"ok":3,"e":"A nulidade de cláusula abusiva não invalida o contrato, exceto quando sua ausência, apesar de esforços de integração, acarretar ônus excessivo a qualquer das partes.","src":"CDC, arts. 46 a 54","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15013,"s":14,"module":6,"topic":"Comércio eletrônico e direito de arrependimento","difficulty":"Intermediária","q":"Uma consumidora compra um produto pela internet e o recebe sem defeito. Dentro do prazo legal, pode exercer o arrependimento sem justificar vício?","a":["Sim, o art. 49 não exige defeito","Não, apenas se o produto estiver quebrado","Não, porque pagou antecipadamente","Somente com autorização judicial"],"ok":0,"e":"A contratação a distância sujeita-se ao direito de arrependimento no prazo legal de sete dias, não condicionado à existência de defeito.","src":"CDC, art. 49; Decreto 7.962/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15014,"s":14,"module":6,"topic":"Comércio eletrônico e direito de arrependimento","difficulty":"Intermediária","q":"Qual o prazo geral de reflexão previsto no art. 49 para contratação fora do estabelecimento?","a":["Trinta dias","Quarenta e oito horas","Sete dias","Noventa dias"],"ok":2,"e":"O art. 49 estabelece sete dias a contar da assinatura ou do recebimento do produto ou serviço, conforme a situação.","src":"CDC, art. 49; Decreto 7.962/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15015,"s":14,"module":7,"topic":"Cobrança de dívidas e cadastros de consumidores","difficulty":"Intermediária","q":"Qual direito prevê o art. 42, parágrafo único, quando o consumidor paga quantia indevida em excesso, sem engano justificável?","a":["Perda integral da quantia","Restituição apenas quando houver crime","Repetição em dobro do excesso, com correção e juros legais","Restituição obrigatoriamente tripla"],"ok":2,"e":"A repetição em dobro exige pagamento indevido e ressalva o engano justificável; a interpretação jurisprudencial deve ser considerada.","src":"CDC, arts. 42 a 44","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15016,"s":14,"module":7,"topic":"Cobrança de dívidas e cadastros de consumidores","difficulty":"Intermediária","q":"Qual limite temporal estabelece o art. 43, § 1º, para informações negativas nos cadastros?","a":["Um ano","Cinco anos","Dez anos","Prazo ilimitado"],"ok":1,"e":"O art. 43, § 1º, veda informações negativas referentes a período superior a cinco anos.","src":"CDC, arts. 42 a 44","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15017,"s":14,"module":8,"topic":"Crédito responsável e superendividamento","difficulty":"Intermediária","q":"O regime de superendividamento do art. 54-A destina-se, em seu conceito legal, a qual sujeito?","a":["Qualquer empresa insolvente","Consumidor pessoa natural de boa-fé","Somente instituição financeira","Somente pessoa jurídica de direito público"],"ok":1,"e":"O art. 54-A, § 1º, define superendividamento em relação à pessoa natural de boa-fé, considerando dívidas de consumo e mínimo existencial.","src":"CDC, arts. 54-A a 54-G e 104-A a 104-C; Lei 14.181/2021","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15018,"s":14,"module":8,"topic":"Crédito responsável e superendividamento","difficulty":"Intermediária","q":"Qual o prazo máximo do plano de pagamento proposto na audiência de repactuação do art. 104-A?","a":["Trinta dias","Um ano","Dez anos","Cinco anos"],"ok":3,"e":"O art. 104-A estabelece proposta de plano com prazo máximo de cinco anos, observados os demais requisitos legais.","src":"CDC, arts. 54-A a 54-G e 104-A a 104-C; Lei 14.181/2021","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15019,"s":14,"module":9,"topic":"Tutela individual, coletiva e sistema de defesa","difficulty":"Intermediária","q":"Qual característica define direitos individuais homogêneos para o CDC?","a":["Decorrência de origem comum","Indeterminação absoluta de qualquer titular em todos os casos","Ausência de qualquer vínculo fático","Titularidade exclusivamente estatal"],"ok":0,"e":"O art. 81, parágrafo único, III, caracteriza direitos individuais homogêneos como decorrentes de origem comum.","src":"CDC, arts. 55 a 60 e 81 a 104","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"},{"id":15020,"s":14,"module":9,"topic":"Tutela individual, coletiva e sistema de defesa","difficulty":"Intermediária","q":"Em ação de responsabilidade civil do fornecedor, qual faculdade territorial o art. 101, I, assegura ao consumidor autor?","a":["Ajuizar exclusivamente no exterior","Ajuizar apenas na sede do fornecedor","Ajuizar a ação em seu domicílio","Escolher qualquer país sem conexão"],"ok":2,"e":"O art. 101, I, permite propor a ação no domicílio do autor, sem confundir essa regra com a competência de ações coletivas.","src":"CDC, arts. 55 a 60 e 81 a 104","url":"https://www.planalto.gov.br/ccivil_03/leis/l8078compilado.htm"}];const ecaModules=[{"t":"Proteção integral, prioridade absoluta e conceitos","ref":"ECA, arts. 1º a 6º; CF, art. 227","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Sujeitos de direitos","A doutrina da proteção integral reconhece crianças e adolescentes como titulares de direitos, considerando seu desenvolvimento. O Estatuto utiliza o critério etário para distinguir criança, pessoa com menos de doze anos, de adolescente, pessoa entre doze e dezoito anos. A aplicação excepcional a pessoas de dezoito a vinte e um anos depende de previsão expressa."],["Prioridade absoluta","Família, comunidade, sociedade e poder público compartilham deveres de proteção. A prioridade repercute na prestação de socorro, no atendimento por serviços públicos, na formulação de políticas e na destinação privilegiada de recursos. Não significa autorização para ignorar garantias processuais."],["Interpretação e interesse superior","As normas devem ser interpretadas considerando fins sociais, exigências do bem comum, direitos e deveres e condição peculiar de pessoa em desenvolvimento. O interesse superior orienta a avaliação individualizada das medidas, com respeito à participação e à autonomia progressiva."]],"map":["Criança → menos de 12 anos","Adolescente → 12 a menos de 18","Prioridade → atendimento e políticas","Proteção integral → sujeito de direitos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direitos à vida, saúde, liberdade e dignidade","ref":"ECA, arts. 7º a 18-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Vida e saúde","A proteção à vida e à saúde compreende políticas que permitam nascimento e desenvolvimento saudáveis, atendimento integral e respeito às necessidades específicas. O cuidado com gestantes e recém-nascidos integra o sistema protetivo. A concretização desses direitos exige atuação articulada dos serviços de saúde."],["Liberdade, respeito e dignidade","Liberdade abrange, nos termos legais, opinião, expressão, crença, brincadeira, convivência e participação. O respeito protege integridade física, psíquica e moral, imagem, identidade e autonomia. A condição de pessoa em desenvolvimento não retira a titularidade desses direitos."],["Educação sem violência","O Estatuto assegura educação e cuidado sem castigo físico ou tratamento cruel ou degradante. As medidas aplicáveis aos responsáveis devem observar a situação e a gravidade, sem excluir outras providências legais. Suspeitas ou confirmações de maus-tratos exigem comunicação aos órgãos competentes."]],"map":["Saúde → atendimento integral","Respeito → integridade e identidade","Liberdade → participação","Cuidado → sem castigo físico"]},{"t":"Convivência familiar, acolhimento e poder familiar","ref":"ECA, arts. 19 a 24 e 101","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Convivência familiar e comunitária","A convivência na família é protegida como regra, em ambiente que favoreça desenvolvimento integral. Família substituta e acolhimento possuem pressupostos específicos. A falta de recursos materiais, isoladamente, não constitui motivo suficiente para perda ou suspensão do poder familiar."],["Acolhimento protetivo","O acolhimento institucional e familiar são medidas provisórias e excepcionais. Não equivalem a privação de liberdade nem a punição. A situação deve ser acompanhada e reavaliada judicialmente nos prazos legais, buscando reintegração familiar ou solução substitutiva quando cabível."],["Poder familiar","O poder familiar envolve deveres de cuidado, sustento, guarda e educação. Sua suspensão ou perda exige decisão judicial, contraditório e fundamentos legais. A intervenção estatal deve considerar proteção, proporcionalidade e os recursos de apoio disponíveis à família."]],"map":["Família de origem → proteção prioritária","Pobreza isolada → não basta para destituição","Acolhimento → provisório e excepcional","Perda do poder familiar → decisão judicial"]},{"t":"Família substituta: guarda, tutela e adoção","ref":"ECA, arts. 28 a 52-D","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Guarda e tutela","A colocação em família substituta pode ocorrer por guarda, tutela ou adoção, institutos distintos. Guarda impõe assistência material, moral e educacional, nos termos legais. Tutela pressupõe o regime jurídico correspondente e implica dever de guarda. A escolha deve considerar a situação da criança e seus vínculos."],["Adoção e requisitos","A adoção é excepcional e irrevogável, observadas as regras do Estatuto. O adotante deve ter pelo menos dezoito anos e ser, em regra legal, ao menos dezesseis anos mais velho que o adotando. Ascendentes e irmãos do adotando não podem adotá-lo. O procedimento judicial exige análise do melhor interesse."],["Consentimento e efeitos","O consentimento dos pais ou representante legal é exigido nas hipóteses legais, ressalvadas situações de dispensa. O adotando com mais de doze anos deve consentir. A adoção constitui vínculo de filiação com igualdade de direitos, inclusive sucessórios, observados impedimentos matrimoniais e demais efeitos legais."]],"map":["Família substituta → três modalidades","Adotante → mínimo de 18 anos","Diferença etária → 16 anos, regra legal","Adoção → filiação e irrevogabilidade"]},{"t":"Educação, profissionalização e prevenção","ref":"ECA, arts. 53 a 85; CF, art. 7º, XXXIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Direito à educação","O acesso à educação deve respeitar igualdade de condições de acesso e permanência, respeito pelos educadores e participação. A oferta do ensino obrigatório é dever estatal e direito público subjetivo. Pais ou responsáveis possuem dever de matrícula nos termos da legislação."],["Profissionalização e aprendizagem","A proteção do trabalho deve ser lida conforme a Constituição: veda-se trabalho antes dos dezesseis anos, salvo aprendizagem a partir dos quatorze. Menores de dezoito anos não podem exercer trabalho noturno, perigoso ou insalubre. A profissionalização deve preservar frequência escolar e desenvolvimento."],["Prevenção especial","O Estatuto disciplina acesso a diversões, espetáculos, produtos e serviços conforme idade e risco, além de regras de viagem e hospedagem. A classificação indicativa e as autorizações pertinentes devem ser estudadas segundo o regime específico, sem confundir proteção com restrição arbitrária."]],"map":["Educação → acesso e permanência","Ensino obrigatório → direito público subjetivo","Aprendizagem → a partir de 14","Menor de 18 → sem trabalho noturno, perigoso ou insalubre"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Política de atendimento e Conselho Tutelar","ref":"ECA, arts. 86 a 97 e 131 a 140","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Rede de proteção","A política de atendimento articula ações governamentais e não governamentais dos entes federativos. Conselhos de direitos, serviços de saúde, educação, assistência e órgãos de justiça possuem atribuições complementares. Municipalização e participação social orientam a organização do sistema."],["Natureza do Conselho Tutelar","O Conselho Tutelar é órgão permanente e autônomo, de natureza não jurisdicional, encarregado de zelar pelo cumprimento dos direitos. Cada Município e Região Administrativa do Distrito Federal deve contar com, no mínimo, um Conselho composto por cinco membros escolhidos pela população local conforme a lei."],["Atribuições e limites","O Conselho aplica medidas protetivas nas hipóteses de sua competência, atende responsáveis, requisita serviços e encaminha casos às autoridades competentes. Não possui atribuição para condenar criminalmente nem decretar perda do poder familiar. Suas decisões podem ser revistas pela autoridade judiciária a pedido de interessado legítimo."]],"map":["Rede → articulação","Conselho Tutelar → autônomo e não jurisdicional","Composição → cinco membros","Decisões → revisão judicial cabível"]},{"t":"Medidas de proteção e intervenção","ref":"ECA, arts. 98 a 102 e 129","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Hipóteses de aplicação","Medidas protetivas destinam-se a situações de ameaça ou violação de direitos por ação ou omissão da sociedade ou do Estado, falta, omissão ou abuso dos responsáveis ou em razão da própria conduta da criança ou adolescente. Seu objetivo é proteger direitos, não impor punição automática."],["Critérios de intervenção","As medidas consideram necessidades pedagógicas, fortalecimento de vínculos, proporcionalidade, intervenção precoce e mínima e privacidade. Podem ser aplicadas isolada ou cumulativamente e substituídas quando necessário. A criança ou adolescente deve ser ouvido e participar conforme sua capacidade."],["Medidas e responsáveis","Encaminhamento aos pais ou responsáveis, orientação, matrícula e inclusão em serviços são exemplos de providências. Medidas dirigidas aos responsáveis possuem disciplina no art. 129. A retirada do convívio familiar exige observância das competências e garantias específicas, inclusive nas situações urgentes."]],"map":["Ameaça ou violação → proteção","Intervenção → proporcional e mínima","Medidas → isoladas ou cumulativas","Participação → escuta adequada"]},{"t":"Ato infracional, garantias e medidas socioeducativas","ref":"ECA, arts. 103 a 128; Lei 12.594/2012","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Ato infracional e idade","Ato infracional é conduta descrita como crime ou contravenção penal. Pessoas menores de dezoito anos são penalmente inimputáveis e sujeitas ao regime especial, considerando a idade na data do fato. À criança autora de ato infracional aplicam-se medidas protetivas, e ao adolescente podem ser aplicadas medidas socioeducativas segundo os requisitos legais."],["Medidas socioeducativas","Advertência, obrigação de reparar dano, prestação de serviços à comunidade, liberdade assistida, semiliberdade e internação integram o regime. A escolha considera capacidade de cumprimento, circunstâncias e gravidade, além das garantias. A internação possui caráter excepcional, breve e sujeito a hipóteses legais."],["Execução e SINASE","O SINASE disciplina execução e acompanhamento das medidas socioeducativas, com planejamento individual e garantia de direitos. A internação não possui prazo determinado na sentença, mas está sujeita a reavaliação periódica, limite geral de três anos e liberação compulsória aos vinte e um anos, conforme o art. 121."]],"map":["Idade → data do fato","Criança → proteção","Adolescente → regime socioeducativo","Internação → excepcionalidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12594.htm"},{"t":"Justiça da infância, procedimentos e garantias","ref":"ECA, arts. 141 a 197-E; Lei 13.431/2017","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Acesso à justiça","A criança e o adolescente têm acesso ao Ministério Público, à Defensoria Pública e ao Poder Judiciário, por seus órgãos competentes. A representação e assistência observam o regime jurídico pertinente. O segredo de justiça e a proteção de dados devem respeitar as regras aplicáveis."],["Apuração de ato infracional","O adolescente tem direito ao devido processo legal, conhecimento da atribuição, defesa técnica, produção de provas e demais garantias. A remissão possui regimes distintos conforme o momento processual e pode excluir, suspender ou extinguir o processo nos termos legais, sem implicar necessariamente reconhecimento de responsabilidade."],["Escuta especializada e depoimento especial","A Lei 13.431/2017 organiza a garantia de direitos de crianças e adolescentes vítimas ou testemunhas de violência. Escuta especializada ocorre perante órgão da rede de proteção, limitada ao necessário à finalidade; depoimento especial é o procedimento de oitiva perante autoridade policial ou judiciária. Ambos visam evitar revitimização."]],"map":["Acesso → órgãos de justiça","Defesa técnica → garantia","Remissão → efeitos conforme fase","Escuta ≠ depoimento especial"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13431.htm"},{"t":"Crimes, infrações administrativas e proteção digital","ref":"ECA, arts. 225 a 258-C; Lei 15.211/2025; Decreto 12.880/2026","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm","lessons":[["Responsabilização e prevenção","O ECA prevê crimes e infrações administrativas específicos de proteção à infância e adolescência. É necessário identificar tipo legal, sujeito, conduta e regime de responsabilização, sem confundir infração administrativa com crime. Alterações legislativas recentes exigem consulta à redação consolidada antes de memorizar penas."],["Estatuto Digital","A Lei 15.211/2025 dispõe sobre proteção de crianças e adolescentes em ambientes digitais, incluindo deveres de prevenção, segurança e informação para produtos ou serviços de tecnologia direcionados a esse público ou de acesso provável por ele. O Decreto 12.880/2026 regulamenta a lei e institui política nacional de promoção e proteção de direitos no ambiente digital."],["Proteção de dados e participação","O tratamento de dados e a experiência digital devem considerar melhor interesse, privacidade, proteção integral e segurança, juntamente com a LGPD e as normas pertinentes. Medidas de proteção não eliminam liberdade de expressão, participação e demais direitos. Estude os deveres de plataformas e responsáveis conforme legislação e regulamentação vigentes."]],"map":["Crime ≠ infração administrativa","ECA Digital → Lei 15.211/2025","Regulamentação → Decreto 12.880/2026","Ambiente digital → melhor interesse e segurança"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm"}];const ecaQuestions=[{"id":16001,"s":15,"module":0,"topic":"Proteção integral, prioridade absoluta e conceitos","difficulty":"Intermediária","q":"Uma pessoa acaba de completar doze anos. Como é classificada para os fins do ECA?","a":["Criança até completar treze anos","Adolescente","Adulto","Pessoa fora da proteção estatutária"],"ok":1,"e":"O art. 2º diferencia criança de adolescente a partir dos doze anos completos.","src":"ECA, arts. 1º a 6º; CF, art. 227","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16002,"s":15,"module":0,"topic":"Proteção integral, prioridade absoluta e conceitos","difficulty":"Intermediária","q":"A obrigação de assegurar prioritariamente os direitos de crianças e adolescentes é exclusivamente estatal?","a":["Sim, em qualquer situação","Sim, salvo autorização judicial","Não, também envolve família, comunidade e sociedade","Sim, quando a criança frequenta escola pública"],"ok":2,"e":"O art. 4º distribui responsabilidades entre família, comunidade, sociedade em geral e poder público.","src":"ECA, arts. 1º a 6º; CF, art. 227","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16003,"s":15,"module":1,"topic":"Direitos à vida, saúde, liberdade e dignidade","difficulty":"Intermediária","q":"O poder familiar autoriza castigo físico como método educativo pelo simples fato de existir intenção disciplinar?","a":["Não, o art. 18-A protege contra castigo físico e tratamento cruel ou degradante","Sim, sempre","Sim, mediante autorização da escola","Sim, se aplicado a adolescente"],"ok":0,"e":"O art. 18-A assegura educação e cuidado sem castigo físico ou tratamento cruel ou degradante, inclusive no contexto familiar.","src":"ECA, arts. 7º a 18-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16004,"s":15,"module":1,"topic":"Direitos à vida, saúde, liberdade e dignidade","difficulty":"Intermediária","q":"Qual direito é diretamente afetado pela exposição humilhante da imagem de uma criança?","a":["Competência tributária","Direito eleitoral","Liberdade empresarial","Respeito e dignidade"],"ok":3,"e":"Os arts. 15 a 18 protegem dignidade e integridade moral, inclusive imagem e identidade.","src":"ECA, arts. 7º a 18-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16005,"s":15,"module":2,"topic":"Convivência familiar, acolhimento e poder familiar","difficulty":"Intermediária","q":"A insuficiência de recursos materiais da família é, isoladamente, fundamento suficiente para perda do poder familiar?","a":["Sim, em qualquer caso","Não, conforme art. 23","Sim, se a renda for baixa","Sim, por determinação automática do Conselho Tutelar"],"ok":1,"e":"O art. 23 exclui a insuficiência material como motivo suficiente para perda ou suspensão do poder familiar.","src":"ECA, arts. 19 a 24 e 101","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16006,"s":15,"module":2,"topic":"Convivência familiar, acolhimento e poder familiar","difficulty":"Intermediária","q":"O acolhimento institucional previsto no ECA é, por natureza, uma medida penal de privação de liberdade?","a":["Sim, sempre","Sim, quando não houver vaga em escola","Não, é medida protetiva provisória e excepcional","Sim, quando durar mais de um mês"],"ok":2,"e":"O art. 101, § 1º, caracteriza acolhimento institucional e familiar como medidas provisórias e excepcionais, sem natureza de privação de liberdade.","src":"ECA, arts. 19 a 24 e 101","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16007,"s":15,"module":3,"topic":"Família substituta: guarda, tutela e adoção","difficulty":"Intermediária","q":"Qual a idade mínima geral do adotante prevista no art. 42 do ECA?","a":["Vinte e cinco anos","Vinte e um anos","Dezesseis anos","Dezoito anos"],"ok":3,"e":"O art. 42 admite adoção por maiores de dezoito anos, independentemente do estado civil, observados os demais requisitos.","src":"ECA, arts. 28 a 52-D","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16008,"s":15,"module":3,"topic":"Família substituta: guarda, tutela e adoção","difficulty":"Intermediária","q":"A adoção é revogável por mera mudança de vontade do adotante?","a":["Não, o Estatuto estabelece irrevogabilidade","Sim, em qualquer momento","Sim, mediante declaração particular","Sim, após cinco anos"],"ok":0,"e":"O art. 39, § 1º, define adoção como medida excepcional e irrevogável.","src":"ECA, arts. 28 a 52-D","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16009,"s":15,"module":4,"topic":"Educação, profissionalização e prevenção","difficulty":"Intermediária","q":"Uma pessoa de quinze anos pode exercer emprego comum fora da aprendizagem?","a":["Sim, se autorizada por escrito pelos pais","Não, a Constituição só admite aprendizagem a partir dos quatorze","Sim, se houver contrato de experiência","Sim, se o trabalho for noturno"],"ok":1,"e":"O art. 7º, XXXIII, da CF proíbe trabalho antes dos dezesseis, salvo aprendizagem a partir dos quatorze.","src":"CF, art. 7º, XXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":16010,"s":15,"module":4,"topic":"Educação, profissionalização e prevenção","difficulty":"Intermediária","q":"O acesso ao ensino obrigatório possui qual natureza jurídica segundo o art. 54, § 1º, do ECA?","a":["Mera liberalidade do Município","Benefício sujeito à vontade da direção escolar","Direito público subjetivo","Obrigação exclusivamente privada"],"ok":2,"e":"O art. 54, § 1º, estabelece o acesso ao ensino obrigatório e gratuito como direito público subjetivo.","src":"ECA, arts. 53 a 85; CF, art. 7º, XXXIII","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16011,"s":15,"module":5,"topic":"Política de atendimento e Conselho Tutelar","difficulty":"Intermediária","q":"O Conselho Tutelar é órgão integrante do Poder Judiciário com competência para proferir sentenças penais?","a":["Sim, em qualquer hipótese","Sim, apenas contra responsáveis","Não, sua natureza é não jurisdicional","Sim, quando atuar em escola"],"ok":2,"e":"O art. 131 define o Conselho Tutelar como órgão permanente e autônomo, não jurisdicional.","src":"ECA, arts. 86 a 97 e 131 a 140","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16012,"s":15,"module":5,"topic":"Política de atendimento e Conselho Tutelar","difficulty":"Intermediária","q":"Qual o número de membros de cada Conselho Tutelar previsto no art. 132?","a":["Cinco","Três","Sete","Dez"],"ok":0,"e":"O art. 132 prevê composição de cinco membros, escolhidos pela população local nos termos legais.","src":"ECA, arts. 86 a 97 e 131 a 140","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16013,"s":15,"module":6,"topic":"Medidas de proteção e intervenção","difficulty":"Intermediária","q":"As medidas específicas de proteção podem ser aplicadas cumulativamente e substituídas a qualquer tempo, conforme a necessidade?","a":["Sim, nos termos do art. 99","Não, são sempre imutáveis","Não, só cabe uma medida por caso","Sim, mas apenas mediante autorização de empresa privada"],"ok":0,"e":"O art. 99 admite aplicação isolada ou cumulativa e substituição das medidas.","src":"ECA, arts. 98 a 102 e 129","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16014,"s":15,"module":6,"topic":"Medidas de proteção e intervenção","difficulty":"Intermediária","q":"Uma criança sofre ameaça a direitos decorrente de omissão do Estado. Essa situação pode justificar medida de proteção?","a":["Não, apenas condutas dos pais autorizam","Não, a omissão estatal é irrelevante","Somente se houver ato infracional","Sim, é hipótese expressa do art. 98"],"ok":3,"e":"O art. 98, I, contempla ação ou omissão da sociedade ou do Estado entre as situações protetivas.","src":"ECA, arts. 98 a 102 e 129","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16015,"s":15,"module":7,"topic":"Ato infracional, garantias e medidas socioeducativas","difficulty":"Intermediária","q":"Uma criança de onze anos pratica ato infracional. Qual regime prevê o art. 105?","a":["Pena privativa de liberdade do Código Penal","Medidas de proteção previstas no art. 101","Internação socioeducativa obrigatória","Multa criminal automática"],"ok":1,"e":"O art. 105 remete às medidas protetivas quando o ato infracional é praticado por criança.","src":"ECA, arts. 103 a 128; Lei 12.594/2012","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16016,"s":15,"module":7,"topic":"Ato infracional, garantias e medidas socioeducativas","difficulty":"Intermediária","q":"Qual o limite geral de duração da medida de internação previsto no art. 121, § 3º?","a":["Um mês","Cinco anos","Três anos","Prazo ilimitado"],"ok":2,"e":"O § 3º prevê limite máximo de três anos, com reavaliação e demais garantias legais.","src":"ECA, arts. 103 a 128; Lei 12.594/2012","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16017,"s":15,"module":8,"topic":"Justiça da infância, procedimentos e garantias","difficulty":"Intermediária","q":"O adolescente acusado de ato infracional tem direito a defesa técnica por advogado?","a":["Não, a idade dispensa defesa","Somente se houver internação definitiva","Sim, trata-se de garantia expressa","Não, basta a presença de testemunha"],"ok":2,"e":"O art. 111, III, assegura defesa técnica por advogado na apuração de ato infracional.","src":"ECA, arts. 141 a 197-E; Lei 13.431/2017","url":"https://www.planalto.gov.br/ccivil_03/leis/l8069compilado.htm"},{"id":16018,"s":15,"module":8,"topic":"Justiça da infância, procedimentos e garantias","difficulty":"Intermediária","q":"Qual procedimento é realizado perante autoridade policial ou judiciária para oitiva de criança ou adolescente vítima ou testemunha de violência?","a":["Depoimento especial","Consulta escolar obrigatória","Adoção administrativa","Remissão tributária"],"ok":0,"e":"O art. 8º da Lei 13.431/2017 distingue depoimento especial da escuta especializada realizada na rede de proteção.","src":"Lei 13.431/2017, art. 8º","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/lei/l13431.htm"},{"id":16019,"s":15,"module":9,"topic":"Crimes, infrações administrativas e proteção digital","difficulty":"Intermediária","q":"Qual diploma institui o Estatuto Digital da Criança e do Adolescente?","a":["Lei 9.099/1995","Lei 15.211/2025","Código Tributário Nacional","Lei 8.112/1990"],"ok":1,"e":"A Lei 15.211/2025 disciplina a proteção de crianças e adolescentes em ambientes digitais.","src":"Lei 15.211/2025","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm"},{"id":16020,"s":15,"module":9,"topic":"Crimes, infrações administrativas e proteção digital","difficulty":"Intermediária","q":"Qual finalidade caracteriza os deveres de proteção digital previstos na Lei 15.211/2025?","a":["Eliminar todos os direitos de participação de adolescentes","Autorizar vigilância indiscriminada","Excluir a aplicação das garantias de privacidade","Promover segurança, prevenção e proteção integral no ambiente digital"],"ok":3,"e":"O Estatuto Digital estabelece deveres protetivos para serviços pertinentes, respeitando direitos fundamentais e melhor interesse.","src":"Lei 15.211/2025","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm"}];const philosophyModules=[{"t":"Direito, moral, justiça e validade","ref":"Filosofia jurídica: natureza do Direito","url":"https://plato.stanford.edu/entries/lawphil-nature/","lessons":[["Problemas fundamentais","A filosofia jurídica investiga o que torna uma norma jurídica, por que ela pode gerar razões para agir e como se relaciona com a justiça. Distingue-se da dogmática que sistematiza normas vigentes, embora dialogue com ela. Perguntar se uma lei existe é diferente de perguntar se merece obediência."],["Validade, eficácia e justiça","Validade trata dos critérios pelos quais uma norma integra um ordenamento; eficácia diz respeito ao cumprimento e aplicação efetivos; justiça envolve avaliação normativa de seu conteúdo. Uma norma pode ser válida e pouco eficaz, ou válida e injusta, dependendo da teoria adotada."],["Direito e moral","Direito e moral orientam condutas, mas não coincidem necessariamente. A existência de sanções institucionais não esgota a explicação da normatividade jurídica. As teorias divergem sobre o papel de critérios morais na identificação do Direito, sem que a divergência implique aprovação de normas injustas."]],"map":["Validade → pertencimento jurídico","Eficácia → observância","Justiça → avaliação normativa","Direito e moral → relação controversa"]},{"t":"Justiça clássica: Platão e Aristóteles","ref":"Platão, A República; Aristóteles, Ética a Nicômaco, livro V","url":"https://plato.stanford.edu/entries/aristotle-ethics/","lessons":[["Platão e a ordem justa","Na República, Platão investiga a justiça na cidade e na alma por meio da analogia entre suas partes. A justiça liga-se à organização harmônica e ao exercício adequado das funções. A discussão não se limita a punir violações individuais; examina a estrutura da vida coletiva."],["Justiça distributiva e corretiva","Aristóteles diferencia distribuição de bens e encargos segundo proporções relevantes da correção de desequilíbrios nas relações entre pessoas. A primeira utiliza proporcionalidade geométrica; a segunda busca restaurar igualdade mediante correção, independentemente da posição social na relação considerada."],["Equidade","A generalidade das leis pode deixar situações singulares inadequadamente disciplinadas. A equidade aristotélica corrige essa insuficiência quando a aplicação literal da regra geral não atende à finalidade da justiça. Não equivale à licença para ignorar leis por preferência pessoal."]],"map":["Platão → harmonia","Aristóteles → justiça distributiva","Corretiva → restabelecimento da igualdade","Equidade → correção da generalidade"]},{"t":"Jusnaturalismo e contratualismo","ref":"Tomás de Aquino, Suma Teológica, I-II; Hobbes, Locke e Rousseau","url":"https://plato.stanford.edu/entries/natural-law-ethics/","lessons":[["Direito natural","A tradição jusnaturalista sustenta a existência de padrões de razão prática ou justiça que não dependem unicamente da criação estatal. Em Tomás de Aquino, a lei natural é compreendida na relação entre razão humana e lei eterna. As versões modernas de direito natural apresentam fundamentos diferentes e não formam uma teoria única."],["Hobbes e segurança","No Leviatã, Hobbes apresenta a instituição da autoridade política como resposta à insegurança do estado de natureza. O pacto estabelece uma ordem comum capaz de garantir paz e proteção. O argumento não exige afirmar que um contrato histórico tenha sido literalmente assinado por todos."],["Locke e Rousseau","Locke destaca direitos naturais e governo limitado, legitimado pelo consentimento e orientado à proteção de direitos. Rousseau distingue vontade geral, voltada ao interesse comum, da simples soma de interesses particulares. Ambos utilizam a ideia de contrato social, com concepções distintas de liberdade e legitimidade."]],"map":["Jusnaturalismo → padrões de justiça","Hobbes → segurança e autoridade","Locke → direitos e governo limitado","Rousseau → vontade geral"],"extraUrl":"https://plato.stanford.edu/entries/contractarianism/"},{"t":"Kant, autonomia e utilitarismo","ref":"Kant, Fundamentação da Metafísica dos Costumes; Bentham e Mill","url":"https://plato.stanford.edu/entries/kant-moral/","lessons":[["Autonomia e imperativo categórico","Para Kant, a moralidade exige que a vontade se determine por princípios racionais, não apenas por desejos ou consequências esperadas. O imperativo categórico não depende de um objetivo contingente. A universalização examina se a máxima da ação pode valer como lei universal."],["Humanidade como fim","A formulação da humanidade exige tratar a humanidade em si e nos demais sempre também como fim, nunca apenas como meio. Isso não proíbe relações de cooperação ou contratos, mas impede reduzir a pessoa a mero instrumento. A distinção entre legalidade externa e motivação moral é relevante em sua filosofia."],["Utilitarismo","Bentham e Mill vinculam a avaliação moral às consequências para a felicidade ou bem-estar. Mill distingue qualidades dos prazeres. A comparação com Kant mostra a diferença entre justificar ações por consequências agregadas e fundamentá-las em deveres e princípios, sem presumir que todos os utilitaristas defendam decisões idênticas."]],"map":["Kant → autonomia","Imperativo categórico → incondicional","Humanidade → fim em si","Utilitarismo → consequências para bem-estar"],"extraUrl":"https://plato.stanford.edu/entries/utilitarianism-history/"},{"t":"Positivismo jurídico: Hans Kelsen","ref":"Hans Kelsen, Teoria Pura do Direito","url":"https://plato.stanford.edu/entries/lawphil-theory/","lessons":[["Pureza metodológica","Kelsen propõe estudar a especificidade normativa do Direito sem reduzir a ciência jurídica à sociologia, à política ou à avaliação moral. Essa separação metodológica não significa que os juristas ou cidadãos devam aprovar toda lei, nem que fenômenos sociais sejam inexistentes."],["Estrutura escalonada","Uma norma recebe fundamento de validade de outra norma superior que disciplina sua produção. A cadeia de fundamentação não se confunde com sequência cronológica de fatos. A norma fundamental é pressuposta para compreender a validade do ordenamento; não é um texto promulgado por uma autoridade acima da Constituição."],["Validade e eficácia","A eficácia global do ordenamento é condição de sua validade na construção kelseniana, sem ser o fundamento normativo de validade de cada regra. A ciência jurídica descreve normas e suas relações. O reconhecimento de uma norma válida não constitui automaticamente um juízo de justiça."]],"map":["Pureza → método","Validade → fundamento normativo","Grundnorm → pressuposição","Eficácia → condição, não identidade"]},{"t":"H. L. A. Hart e a estrutura das regras","ref":"H. L. A. Hart, O Conceito de Direito","url":"https://plato.stanford.edu/entries/legal-positivism/","lessons":[["Regras primárias e secundárias","Hart explica sistemas jurídicos como união de regras primárias, que orientam condutas e impõem deveres, e secundárias, que tratam da identificação, mudança e aplicação de regras. A combinação responde a dificuldades de sistemas baseados apenas em deveres costumeiros."],["Regra de reconhecimento","A regra de reconhecimento estabelece critérios utilizados pelas autoridades para identificar normas jurídicas válidas. Sua existência relaciona-se a práticas sociais aceitas pelos agentes oficiais. Diferentemente da norma fundamental de Kelsen, ela não é descrita simplesmente como pressuposição transcendental."],["Textura aberta","A linguagem possui casos centrais e situações marginais em que a aplicação da regra não é evidente. A textura aberta ajuda a explicar escolhas judiciais em casos difíceis. Isso não implica que toda decisão seja livre de limites, nem que a incerteza esteja presente igualmente em todas as situações."]],"map":["Primárias → deveres","Secundárias → reconhecimento, mudança e julgamento","Reconhecimento → prática oficial","Textura aberta → casos de incerteza"]},{"t":"Dworkin e o Direito como integridade","ref":"Ronald Dworkin, Levando os Direitos a Sério; O Império do Direito","url":"https://plato.stanford.edu/entries/legal-reas-interpret/","lessons":[["Regras, princípios e casos difíceis","Dworkin critica a ideia de que o Direito se esgota em regras identificadas por sua origem formal. Princípios também podem oferecer razões jurídicas relevantes, inclusive em casos difíceis. Princípios têm dimensão de peso e podem continuar juridicamente relevantes mesmo quando não prevalecem em um caso."],["Interpretação construtiva","A interpretação busca compreender a prática jurídica sob uma justificação que seja adequada à sua história institucional e moralmente defensável. A relação entre ajuste à prática e justificação é central. Não se trata de aplicar livremente as preferências pessoais do julgador."],["Integridade e coerência","O Direito como integridade procura interpretar decisões e normas como expressão de princípios coerentes de justiça, equidade e devido processo. A metáfora do romance em cadeia ilustra a necessidade de dar continuidade crítica ao trabalho institucional anterior. Direitos individuais não devem ser reduzidos automaticamente à conveniência agregada."]],"map":["Princípios → razões jurídicas","Casos difíceis → interpretação","Ajuste + justificação","Integridade → coerência de princípios"]},{"t":"Alexy, regras, princípios e proporcionalidade","ref":"Robert Alexy, Teoria dos Direitos Fundamentais","url":"https://plato.stanford.edu/entries/constitutionalism/","lessons":[["Mandamentos de otimização","Na formulação de Alexy, princípios são normas que exigem realização na maior medida possível conforme possibilidades fáticas e jurídicas. Regras contêm determinações definitivas dentro de seu âmbito de validade. A distinção não se reduz ao grau de abstração de uma norma."],["Conflitos e colisões","Conflitos entre regras podem ser resolvidos mediante exceção ou invalidação de uma das regras, conforme o sistema. Na colisão entre princípios, a precedência depende das circunstâncias relevantes, sem exigir que o princípio que cede seja declarado inválido. Isso explica a ideia de precedência condicionada."],["Proporcionalidade","A análise inclui adequação do meio ao fim, necessidade em comparação com alternativas igualmente eficazes e menos restritivas, e proporcionalidade em sentido estrito, que examina a relação entre sacrifício e realização dos princípios envolvidos. A ponderação exige explicitação das razões, não preferência intuitiva."]],"map":["Princípios → otimização","Regras → determinações","Colisão → precedência condicionada","Proporcionalidade → adequação, necessidade e ponderação"]},{"t":"Rawls e teorias contemporâneas da justiça","ref":"John Rawls, Uma Teoria da Justiça","url":"https://plato.stanford.edu/entries/rawls/","lessons":[["Posição original e véu de ignorância","Rawls formula uma situação hipotética de escolha dos princípios da justiça para a estrutura básica da sociedade. Sob o véu de ignorância, as partes não conhecem sua posição social, talentos naturais ou concepção particular de bem, embora disponham de conhecimentos gerais relevantes. O recurso busca imparcialidade, não ignorância total."],["Liberdades e igualdade de oportunidades","O primeiro princípio protege um esquema adequado de liberdades básicas iguais, compatível com o mesmo esquema para todos. O segundo envolve igualdade equitativa de oportunidades e princípio da diferença. A igualdade formal de acesso não basta quando barreiras sociais impedem oportunidades efetivas."],["Princípio da diferença","Desigualdades econômicas e sociais devem beneficiar ao máximo os membros menos favorecidos, observadas as prioridades entre princípios e condições de justiça. Rawls não defende simplesmente que toda diferença de renda seja proibida. Sua teoria não deve ser confundida com maximização irrestrita da utilidade agregada."]],"map":["Posição original → escolha hipotética","Véu → imparcialidade","Liberdades básicas → prioridade","Diferença → benefício aos menos favorecidos"]},{"t":"Miguel Reale, hermenêutica e argumentação jurídica","ref":"Miguel Reale, Teoria Tridimensional do Direito; interpretação jurídica","url":"https://enciclopediajuridica.pucsp.br/verbetes/tridimensional-do-direito-teoria/","lessons":[["Fato, valor e norma","Miguel Reale compreende a experiência jurídica por três dimensões relacionadas: fatos sociais, valores que lhes conferem significado e normas que organizam relações. Nenhuma delas, isoladamente, esgota o fenômeno. A teoria não descreve apenas uma lista de elementos independentes."],["Métodos de interpretação","Interpretação literal examina o texto; sistemática considera relações entre normas; histórica investiga contexto de formação; teleológica considera finalidades. Esses métodos podem fornecer razões convergentes ou divergentes. A identificação do método não substitui a justificação de sua pertinência no caso."],["Argumentação e decisão","A argumentação jurídica exige razões controláveis, identificação dos fatos e explicitação das premissas normativas. A subsunção relaciona fatos a uma regra aplicável, mas controvérsias sobre significado ou princípios podem exigir etapas adicionais. Uma decisão bem fundamentada enfrenta argumentos relevantes em vez de recorrer apenas à autoridade do julgador."]],"map":["Reale → fato, valor e norma","Literal → texto","Sistemática → conjunto normativo","Teleológica → finalidade"],"extraUrl":"https://plato.stanford.edu/entries/legal-interpretation/"}];const philosophyQuestions=[{"id":17001,"s":16,"module":0,"topic":"Direito, moral, justiça e validade","difficulty":"Intermediária","q":"Uma lei foi produzida regularmente, mas é raramente observada. Qual distinção permite descrever a situação sem confundir os conceitos?","a":["Validade e eficácia","Direito público e privado","Nacionalidade e cidadania","Prescrição e decadência"],"ok":0,"e":"A produção conforme critérios de validade não assegura necessariamente observância efetiva. A eficácia deve ser examinada separadamente.","src":"Filosofia jurídica: natureza do Direito","url":"https://plato.stanford.edu/entries/lawphil-nature/"},{"id":17002,"s":16,"module":0,"topic":"Direito, moral, justiça e validade","difficulty":"Intermediária","q":"Perguntar se determinada regra é moralmente aceitável corresponde principalmente a qual dimensão?","a":["Competência territorial","Eficácia estatística","Justiça ou justificação normativa","Existência física do documento"],"ok":2,"e":"A avaliação do caráter justo de uma regra não se reduz à investigação de sua validade formal ou de sua eficácia.","src":"Filosofia jurídica: natureza do Direito","url":"https://plato.stanford.edu/entries/lawphil-nature/"},{"id":17003,"s":16,"module":1,"topic":"Justiça clássica: Platão e Aristóteles","difficulty":"Intermediária","q":"Em Aristóteles, qual espécie de justiça trata da distribuição proporcional de bens e honras?","a":["Corretiva","Distributiva","Penal exclusivamente","Procedimental moderna"],"ok":1,"e":"A justiça distributiva distribui bens ou encargos segundo proporção, diferentemente da corretiva, que corrige desequilíbrios.","src":"Platão, A República; Aristóteles, Ética a Nicômaco, livro V","url":"https://plato.stanford.edu/entries/aristotle-ethics/"},{"id":17004,"s":16,"module":1,"topic":"Justiça clássica: Platão e Aristóteles","difficulty":"Intermediária","q":"Qual função caracteriza a equidade na Ética a Nicômaco?","a":["Eliminar qualquer regra geral","Substituir a justiça por preferência pessoal","Ignorar os fatos concretos","Corrigir insuficiências da generalidade da lei no caso singular"],"ok":3,"e":"A equidade aperfeiçoa a aplicação do justo legal quando a formulação geral não contempla adequadamente a particularidade do caso.","src":"Platão, A República; Aristóteles, Ética a Nicômaco, livro V","url":"https://plato.stanford.edu/entries/aristotle-ethics/"},{"id":17005,"s":16,"module":2,"topic":"Jusnaturalismo e contratualismo","difficulty":"Intermediária","q":"Qual autor associa a instituição do soberano à superação da insegurança do estado de natureza no Leviatã?","a":["Kelsen","Dworkin","Hobbes","Rawls"],"ok":2,"e":"Hobbes desenvolve a justificação da autoridade política em conexão com paz, segurança e saída do estado de natureza.","src":"Tomás de Aquino, Suma Teológica, I-II; Hobbes, Locke e Rousseau","url":"https://plato.stanford.edu/entries/natural-law-ethics/"},{"id":17006,"s":16,"module":2,"topic":"Jusnaturalismo e contratualismo","difficulty":"Intermediária","q":"Em Rousseau, a vontade geral equivale necessariamente à soma de preferências individuais?","a":["Não, refere-se ao interesse comum","Sim, por definição","Sim, quando houver interesses particulares divergentes","Sim, em qualquer votação"],"ok":0,"e":"A vontade geral deve ser distinguida da vontade de todos, concebida como agregação de interesses particulares.","src":"Tomás de Aquino, Suma Teológica, I-II; Hobbes, Locke e Rousseau","url":"https://plato.stanford.edu/entries/natural-law-ethics/"},{"id":17007,"s":16,"module":3,"topic":"Kant, autonomia e utilitarismo","difficulty":"Intermediária","q":"Na ética kantiana, qual critério está associado à formulação da lei universal?","a":["Maximizar apenas o ganho individual","Obedecer a toda autoridade sem reflexão","Escolher a ação mais popular","Examinar se a máxima pode ser universalizada"],"ok":3,"e":"A formulação da lei universal exige avaliar a possibilidade de querer a máxima como princípio universal.","src":"Kant, Fundamentação da Metafísica dos Costumes; Bentham e Mill","url":"https://plato.stanford.edu/entries/kant-moral/"},{"id":17008,"s":16,"module":3,"topic":"Kant, autonomia e utilitarismo","difficulty":"Intermediária","q":"Qual característica é central às teorias utilitaristas clássicas?","a":["Avaliar ações por suas consequências para a felicidade ou bem-estar","Recusar qualquer avaliação de consequências","Fundar toda moralidade exclusivamente na hierarquia normativa","Identificar justiça com a vontade do soberano"],"ok":0,"e":"O utilitarismo clássico avalia a correção moral considerando consequências para a felicidade, com diferenças entre os autores.","src":"Kant, Fundamentação da Metafísica dos Costumes; Bentham e Mill","url":"https://plato.stanford.edu/entries/utilitarianism-history/"},{"id":17009,"s":16,"module":4,"topic":"Positivismo jurídico: Hans Kelsen","difficulty":"Intermediária","q":"Na teoria de Kelsen, a norma fundamental é necessariamente uma lei escrita aprovada pelo Parlamento?","a":["Sim, é uma lei complementar","Não, é pressuposta como fundamento da cadeia de validade","Sim, é sempre decreto","Sim, é o primeiro artigo da Constituição"],"ok":1,"e":"A norma fundamental é pressuposta, permitindo interpretar atos produtores de normas como juridicamente válidos; não é norma positiva promulgada.","src":"Hans Kelsen, Teoria Pura do Direito","url":"https://plato.stanford.edu/entries/lawphil-theory/"},{"id":17010,"s":16,"module":4,"topic":"Positivismo jurídico: Hans Kelsen","difficulty":"Intermediária","q":"A pureza metodológica da teoria kelseniana implica que toda norma válida seja moralmente justa?","a":["Sim, sem exceção","Sim, se houver sanção","Não, validade jurídica e avaliação moral são questões distintas","Sim, quando a norma for eficaz"],"ok":2,"e":"Kelsen distingue ciência normativa do Direito de juízos sobre a justiça de seu conteúdo.","src":"Hans Kelsen, Teoria Pura do Direito","url":"https://plato.stanford.edu/entries/lawphil-theory/"},{"id":17011,"s":16,"module":5,"topic":"H. L. A. Hart e a estrutura das regras","difficulty":"Intermediária","q":"Qual regra secundária fornece critérios de identificação das normas válidas na teoria de Hart?","a":["Regra de cortesia","Regra de moral pessoal","Regra de reconhecimento","Regra de vontade geral"],"ok":2,"e":"A regra de reconhecimento fornece os critérios jurídicos utilizados na identificação do Direito dentro de determinado sistema.","src":"H. L. A. Hart, O Conceito de Direito","url":"https://plato.stanford.edu/entries/legal-positivism/"},{"id":17012,"s":16,"module":5,"topic":"H. L. A. Hart e a estrutura das regras","difficulty":"Intermediária","q":"O conceito de textura aberta refere-se principalmente a quê?","a":["À possibilidade de indeterminação na aplicação da linguagem das regras a certos casos","À inexistência de regras jurídicas","À obrigação de decidir sempre pelo costume","À proibição de interpretação judicial"],"ok":0,"e":"A textura aberta indica que termos gerais nem sempre resolvem de maneira determinada todos os casos futuros.","src":"H. L. A. Hart, O Conceito de Direito","url":"https://plato.stanford.edu/entries/legal-positivism/"},{"id":17013,"s":16,"module":6,"topic":"Dworkin e o Direito como integridade","difficulty":"Intermediária","q":"Segundo Dworkin, princípios jurídicos relevantes deixam necessariamente de existir quando não prevalecem em um caso?","a":["Sim, sempre","Não, podem conservar validade e relevância em outros casos","Sim, se o juiz os mencionar","Sim, quando houver regra escrita"],"ok":1,"e":"Princípios possuem dimensão de peso. Sua não prevalência em um caso não implica eliminação do ordenamento.","src":"Ronald Dworkin, Levando os Direitos a Sério; O Império do Direito","url":"https://plato.stanford.edu/entries/legal-reas-interpret/"},{"id":17014,"s":16,"module":6,"topic":"Dworkin e o Direito como integridade","difficulty":"Intermediária","q":"O Direito como integridade orienta a interpretação para qual objetivo?","a":["Obedecer apenas a preferências pessoais","Desconsiderar toda história institucional","Aplicar exclusivamente resultados estatísticos","Construir interpretação coerente e justificável da prática jurídica"],"ok":3,"e":"A integridade exige uma interpretação que conjugue adequação à história institucional e justificação por princípios.","src":"Ronald Dworkin, Levando os Direitos a Sério; O Império do Direito","url":"https://plato.stanford.edu/entries/legal-reas-interpret/"},{"id":17015,"s":16,"module":7,"topic":"Alexy, regras, princípios e proporcionalidade","difficulty":"Intermediária","q":"Na teoria de Alexy, como são caracterizados os princípios?","a":["Mandamentos de otimização","Sanções necessariamente penais","Regras sempre inválidas","Normas sem qualquer força jurídica"],"ok":0,"e":"Princípios exigem realização na maior medida possível, dentro das possibilidades fáticas e jurídicas.","src":"Robert Alexy, Teoria dos Direitos Fundamentais","url":"https://plato.stanford.edu/entries/constitutionalism/"},{"id":17016,"s":16,"module":7,"topic":"Alexy, regras, princípios e proporcionalidade","difficulty":"Intermediária","q":"Qual etapa da proporcionalidade investiga se existe meio igualmente eficaz e menos restritivo?","a":["Validade formal","Adequação exclusivamente","Necessidade","Prescrição"],"ok":2,"e":"O exame de necessidade compara alternativas capazes de alcançar o fim, buscando evitar restrição desnecessária.","src":"Robert Alexy, Teoria dos Direitos Fundamentais","url":"https://plato.stanford.edu/entries/constitutionalism/"},{"id":17017,"s":16,"module":8,"topic":"Rawls e teorias contemporâneas da justiça","difficulty":"Intermediária","q":"Qual é a função do véu de ignorância na teoria de Rawls?","a":["Impedir acesso a qualquer conhecimento geral","Restringir informações particulares que poderiam enviesar a escolha dos princípios","Garantir privilégios aos mais ricos","Substituir a justiça pela tradição"],"ok":1,"e":"O véu impede que a escolha dos princípios seja direcionada por informações sobre a posição particular de quem escolhe.","src":"John Rawls, Uma Teoria da Justiça","url":"https://plato.stanford.edu/entries/rawls/"},{"id":17018,"s":16,"module":8,"topic":"Rawls e teorias contemporâneas da justiça","difficulty":"Intermediária","q":"O princípio da diferença admite desigualdades em qual condição central, observadas as demais exigências da teoria?","a":["Quando favorecem exclusivamente os mais ricos","Quando decorrem de qualquer escolha de mercado","Quando eliminam todas as liberdades básicas","Quando beneficiam ao máximo os menos favorecidos"],"ok":3,"e":"O princípio da diferença avalia desigualdades pela vantagem dos menos favorecidos, respeitando as prioridades e condições do sistema rawlsiano.","src":"John Rawls, Uma Teoria da Justiça","url":"https://plato.stanford.edu/entries/rawls/"},{"id":17019,"s":16,"module":9,"topic":"Miguel Reale, hermenêutica e argumentação jurídica","difficulty":"Intermediária","q":"Quais dimensões integram a teoria tridimensional de Miguel Reale?","a":["Estado, território e povo","Texto, sanção e autoridade","Fato, valor e norma","Liberdade, propriedade e contrato"],"ok":2,"e":"Na teoria tridimensional, fato, valor e norma são dimensões correlacionadas da experiência jurídica.","src":"Miguel Reale, Teoria Tridimensional do Direito; interpretação jurídica","url":"https://enciclopediajuridica.pucsp.br/verbetes/tridimensional-do-direito-teoria/"},{"id":17020,"s":16,"module":9,"topic":"Miguel Reale, hermenêutica e argumentação jurídica","difficulty":"Intermediária","q":"Uma intérprete examina a finalidade protegida por determinada disposição para determinar seu alcance. Qual método predomina?","a":["Teleológico","Exclusivamente gramatical","Estatístico","Cronológico exclusivamente"],"ok":0,"e":"O método teleológico considera o fim da norma e seu papel na realização dos objetivos jurídicos.","src":"Miguel Reale, Teoria Tridimensional do Direito; interpretação jurídica","url":"https://plato.stanford.edu/entries/legal-interpretation/"}];const electoralModules=[{"t":"Direitos políticos, sufrágio e alistamento","ref":"CF, arts. 14 a 16; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Soberania popular","A soberania popular manifesta-se por sufrágio universal e voto direto e secreto, com valor igual, além de plebiscito, referendo e iniciativa popular. Plebiscito consulta previamente a população; referendo submete ato já produzido à apreciação popular, conforme o regime legal."],["Alistamento e voto","O alistamento e o voto são obrigatórios, em regra, para maiores de dezoito anos, e facultativos para analfabetos, maiores de setenta anos e pessoas de dezesseis a dezoito anos incompletos. Estrangeiros e conscritos durante serviço militar obrigatório não podem alistar-se. Distinga capacidade eleitoral ativa de capacidade passiva."],["Perda,
