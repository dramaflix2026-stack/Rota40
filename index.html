epartição de competências","difficulty":"Intermediária","q":"Um Município pretende organizar e prestar transporte coletivo urbano de interesse local, inclusive mediante concessão. Qual regra constitucional se aplica?","a":["O Município pode organizar e prestar serviços públicos de interesse local, incluído o transporte coletivo, de caráter essencial.","O transporte coletivo local é privativo da União.","A competência depende de delegação do Senado Federal.","A prestação de transporte municipal é proibida."],"ok":0,"e":"O art. 30, V, atribui aos Municípios a organização e prestação dos serviços públicos de interesse local, diretamente ou sob concessão ou permissão.","src":"CF, art. 30, V","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2080,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Um Estado suspende o pagamento da dívida fundada por três anos consecutivos sem motivo de força maior. Qual medida federativa pode ser constitucionalmente cogitada, observado o procedimento próprio?","a":["Dissolução automática da Federação.","Intervenção federal para reorganizar as finanças do Estado.","Intervenção municipal no Congresso Nacional.","Extinção imediata do Estado por decisão administrativa."],"ok":1,"e":"O art. 34, V, a, prevê intervenção para reorganização financeira quando houver suspensão do pagamento da dívida fundada por mais de dois anos consecutivos, salvo força maior.","src":"CF, art. 34, V, a","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2081,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Um edital de concurso estabelece validade inicial de dois anos. O órgão pretende prorrogá-la uma única vez pelo mesmo período. Qual é a regra constitucional?","a":["O concurso não pode ser prorrogado em nenhuma hipótese.","A prorrogação pode ocorrer indefinidamente a cada dois anos.","A validade inicial de dois anos viola necessariamente a Constituição.","A prorrogação uma vez por igual período é admitida."],"ok":3,"e":"O art. 37, III, prevê validade de até dois anos, prorrogável uma vez por igual período.","src":"CF, art. 37, III","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2082,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Uma servidora pública torna-se vereadora e possui compatibilidade de horários entre o mandato e o cargo. Qual regime constitucional é aplicável?","a":["Pode perceber as vantagens de seu cargo sem prejuízo da remuneração do mandato eletivo, respeitadas as regras aplicáveis.","Deve sempre afastar-se e perder ambas as remunerações.","Deve renunciar ao cargo público antes de tomar posse.","Só pode exercer mandato sem qualquer remuneração."],"ok":0,"e":"O art. 38, III, disciplina o servidor investido no mandato de vereador, distinguindo as situações com e sem compatibilidade de horários.","src":"CF, art. 38, III","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2083,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Uma empresa privada presta serviço público por concessão e um de seus agentes, nessa qualidade, causa dano a usuário. Qual regra constitucional de responsabilidade incide sobre a prestadora?","a":["Responsabilidade exclusivamente subjetiva em todos os casos.","Responsabilidade objetiva da pessoa jurídica prestadora de serviço público, observados dano, nexo causal e eventuais excludentes.","Imunidade civil pela existência de concessão.","Responsabilidade direta apenas do usuário prejudicado."],"ok":1,"e":"O art. 37, § 6º, abrange pessoas jurídicas de direito público e de direito privado prestadoras de serviços públicos. A responsabilidade objetiva não dispensa os demais pressupostos.","src":"CF, art. 37, § 6º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2084,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Um órgão público nega acesso de cidadão a informação de interesse coletivo sem indicar fundamento legal de sigilo. Qual garantia constitucional é pertinente?","a":["Sigilo obrigatório de todos os atos administrativos.","Acesso restrito exclusivamente a parlamentares.","Direito de receber informações de interesse particular, coletivo ou geral, ressalvado o sigilo constitucionalmente protegido.","Acesso dependente de aprovação discricionária do gestor em qualquer hipótese."],"ok":2,"e":"O art. 5º, XXXIII, protege o acesso a informações dos órgãos públicos, ressalvadas aquelas cujo sigilo seja imprescindível à segurança da sociedade e do Estado; outras proteções constitucionais também devem ser observadas.","src":"CF, art. 5º, XXXIII; art. 37, caput","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2085,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"Cidadãos organizam proposta de lei federal por iniciativa popular. Qual número mínimo de assinaturas e distribuição territorial exige a Constituição?","a":["Um por cento do eleitorado nacional, distribuído por pelo menos cinco Estados, com não menos de três décimos por cento dos eleitores de cada um deles.","Cinco por cento do eleitorado de um único Município.","Dez por cento do eleitorado nacional, sem distribuição territorial.","Um por cento do eleitorado de apenas um Estado."],"ok":0,"e":"O art. 61, § 2º, estabelece esses requisitos para apresentação de projeto de lei à Câmara dos Deputados por iniciativa popular.","src":"CF, art. 61, § 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2086,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"Durante sessão parlamentar, um deputado federal profere manifestação diretamente relacionada ao exercício do mandato. Qual proteção constitucional é pertinente quanto a opiniões, palavras e votos?","a":["Imunidade absoluta para todos os atos privados do deputado.","Inviolabilidade civil e penal nas condições da imunidade material parlamentar.","Inviolabilidade exclusivamente administrativa.","Prerrogativa aplicável apenas após o encerramento do mandato."],"ok":1,"e":"O art. 53 protege deputados e senadores civil e penalmente por opiniões, palavras e votos. O alcance da imunidade deve observar a relação com a função parlamentar e a jurisprudência pertinente.","src":"CF, art. 53, caput","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2087,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"O Presidente solicita delegação do Congresso para elaborar lei delegada sobre matéria reservada a lei complementar. Qual limite constitucional incide?","a":["A delegação é permitida para qualquer matéria sem exceção.","A matéria pode ser delegada mediante simples autorização ministerial.","Matéria reservada a lei complementar não pode ser objeto de delegação.","A lei delegada pode modificar a Constituição."],"ok":2,"e":"O art. 68, § 1º, exclui da delegação matérias reservadas a lei complementar e outras categorias constitucionalmente protegidas.","src":"CF, art. 68, § 1º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2088,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"O Senado aprova alterações substanciais em projeto de lei iniciado e anteriormente aprovado pela Câmara dos Deputados. Qual etapa deve ocorrer em seguida?","a":["O projeto é enviado diretamente à sanção, sem apreciação das emendas.","As alterações do Senado são automaticamente inválidas.","O projeto deve ser transformado em proposta de emenda constitucional.","O projeto emendado retorna à Casa iniciadora."],"ok":3,"e":"O art. 65, parágrafo único, determina o retorno à Casa iniciadora quando o projeto é emendado pela Casa revisora.","src":"CF, art. 65, parágrafo único","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2089,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"O Presidente pretende extinguir um órgão público federal por decreto autônomo, justificando que a reorganização não aumenta despesas. Qual é o limite constitucional?","a":["A inexistência de aumento de despesa permite extinguir qualquer órgão.","O decreto de organização e funcionamento não pode implicar criação ou extinção de órgãos públicos, mesmo sem aumento de despesa.","O Presidente pode extinguir órgãos estaduais pela mesma via.","A criação e extinção de órgãos independe de qualquer norma."],"ok":1,"e":"O art. 84, VI, a, condiciona a competência regulamentar autônoma à ausência de aumento de despesa e de criação ou extinção de órgãos públicos.","src":"CF, art. 84, VI, a","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2090,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"Uma acusação por infração penal comum contra o Presidente da República é admitida pela Câmara dos Deputados, preenchidos os demais pressupostos constitucionais. Qual tribunal é competente para processá-lo e julgá-lo?","a":["Senado Federal em qualquer caso.","Superior Tribunal de Justiça.","Supremo Tribunal Federal.","Tribunal Regional Federal de seu domicílio."],"ok":2,"e":"Os arts. 86 e 102, I, b, atribuem ao STF a competência para infrações penais comuns do Presidente, observado o regime constitucional.","src":"CF, arts. 86 e 102, I, b","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2091,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"Presidente e Vice-Presidente encontram-se temporariamente impedidos. Qual é a ordem constitucional de autoridades chamadas ao exercício da Presidência?","a":["Presidentes do Senado, do STJ e da Câmara, sucessivamente.","Ministro da Justiça, Procurador-Geral da República e presidente do TCU.","Governador do Distrito Federal, presidente do Senado e ministro da Defesa.","Presidentes da Câmara dos Deputados, do Senado Federal e do STF, sucessivamente."],"ok":3,"e":"O art. 80 define essa ordem de substituição em caso de impedimento do Presidente e do Vice ou vacância dos respectivos cargos.","src":"CF, art. 80","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2092,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"Uma pessoa de 24 anos, brasileira e em pleno exercício dos direitos políticos, é escolhida para Ministério de Estado que não exige nacionalidade originária. Qual a condição geral de idade prevista na Constituição?","a":["Pode ser escolhida, pois a Constituição exige idade superior a 21 anos, além dos demais requisitos.","Não pode, porque a idade mínima é de 35 anos.","Não pode, porque ministros devem ter pelo menos 30 anos.","Pode ser escolhida somente se for parlamentar federal."],"ok":0,"e":"O art. 87 exige ministros escolhidos entre brasileiros maiores de 21 anos e no exercício dos direitos políticos. Para a Defesa, há a exigência adicional de nacionalidade nata.","src":"CF, arts. 87 e 12, § 3º, VII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2093,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Uma advogada com mais de dez anos de efetiva atividade profissional concorre a vaga destinada ao quinto constitucional em Tribunal de Justiça. Qual é a destinação constitucional dessa fração dos lugares?","a":["Exclusivamente servidores administrativos do tribunal.","Exclusivamente juízes de carreira com menos de dez anos.","Membros do Ministério Público e advogados que preencham os requisitos do art. 94.","Parlamentares indicados pelo Legislativo, sem requisitos profissionais."],"ok":2,"e":"O art. 94 reserva um quinto dos lugares dos tribunais indicados a membros do MP com mais de dez anos de carreira e advogados de notório saber jurídico, reputação ilibada e mais de dez anos de efetiva atividade.","src":"CF, art. 94","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2094,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Um juiz de primeiro grau ingressa na magistratura por concurso. Qual é o período constitucional para aquisição da vitaliciedade nessa instância?","a":["Três anos, como a estabilidade de servidor efetivo em geral.","Dez anos de exercício.","A vitaliciedade decorre necessariamente da aprovação no concurso, antes da posse.","Dois anos de exercício, observadas as condições constitucionais."],"ok":3,"e":"O art. 95, I, dispõe que a vitaliciedade no primeiro grau é adquirida após dois anos de exercício. Durante esse período, a perda do cargo depende de deliberação do tribunal a que o juiz estiver vinculado.","src":"CF, art. 95, I","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2095,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Uma pessoa pretende homologar sentença estrangeira sujeita a homologação no Brasil. Qual órgão tem a competência constitucional originária?","a":["Superior Tribunal de Justiça.","Supremo Tribunal Federal em todas as hipóteses.","Conselho Nacional de Justiça.","Tribunal de Contas da União."],"ok":0,"e":"O art. 105, I, i, atribui ao STJ a homologação de sentenças estrangeiras e concessão de exequatur às cartas rogatórias.","src":"CF, art. 105, I, i","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2096,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Uma lei atribui ao Ministério Público a representação judicial ordinária de entidades públicas e sua consultoria jurídica. Qual vedação constitucional deve ser observada?","a":["A representação de qualquer entidade pública é função exclusiva do Ministério Público.","É vedada ao Ministério Público a representação judicial e a consultoria jurídica de entidades públicas.","A consultoria é obrigatória quando a entidade solicita.","A Constituição não distingue advocacia pública e Ministério Público."],"ok":1,"e":"O art. 129, IX, permite outras funções compatíveis com a finalidade do Ministério Público, mas veda representação judicial e consultoria jurídica de entidades públicas.","src":"CF, art. 129, IX","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2097,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Uma lei municipal anterior à Constituição de 1988 produz controvérsia relevante sobre lesão a preceito fundamental, sem outro meio eficaz para sanar a lesividade. Qual ação de controle concentrado pode ser examinada no STF?","a":["Ação declaratória de constitucionalidade de lei municipal.","Ação direta de inconstitucionalidade federal comum contra lei pré-constitucional municipal.","Mandado de segurança coletivo independentemente de direito líquido e certo.","Arguição de descumprimento de preceito fundamental, observados seus requisitos de admissibilidade."],"ok":3,"e":"A Lei 9.882/1999 admite ADPF em controvérsia constitucional relevante sobre lei ou ato normativo federal, estadual ou municipal, inclusive anterior à Constituição, respeitada a subsidiariedade.","src":"Lei 9.882/1999, arts. 1º e 4º, § 1º","url":"https://www.planalto.gov.br/ccivil_03/leis/l9882.htm"},{"id":2098,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"O STF profere decisão definitiva de mérito em ação direta de inconstitucionalidade. Qual é o alcance constitucional típico dessa decisão?","a":["Eficácia contra todos e efeito vinculante relativamente aos demais órgãos do Judiciário e à Administração Pública direta e indireta nas esferas federal, estadual e municipal.","Efeito exclusivamente entre as partes processuais.","Efeito vinculante apenas para servidores do STF.","Efeito exclusivamente consultivo, sem repercussão jurídica."],"ok":0,"e":"O art. 102, § 2º, prevê eficácia geral e efeito vinculante nesses termos para decisões definitivas de mérito em ADI e ADC.","src":"CF, art. 102, § 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2099,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Após reiteradas decisões sobre matéria constitucional, o STF pretende aprovar súmula vinculante nos termos do art. 103-A. Qual é o quórum constitucional?","a":["Maioria simples de uma turma.","Dois terços dos membros do STF.","Maioria dos membros do Congresso Nacional.","Unanimidade dos tribunais estaduais."],"ok":1,"e":"O art. 103-A permite aprovação de súmula vinculante pelo STF, de ofício ou por provocação, mediante decisão de dois terços de seus membros e observados os demais requisitos.","src":"CF, art. 103-A","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2100,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Um legitimado propõe ação direta por omissão e o STF declara a inconstitucionalidade da omissão de órgão administrativo. Qual parâmetro temporal constitucional é previsto para providências?","a":["Prazo obrigatório de cinco anos.","Nenhum prazo, mesmo para órgão administrativo.","Trinta dias, conforme a regra constitucional, observada a disciplina legal de prazo excepcional razoável.","Vinte e quatro horas em qualquer situação."],"ok":2,"e":"O art. 103, § 2º, prevê ciência ao Poder competente e prazo de trinta dias para órgão administrativo. A Lei 9.868, art. 12-H, § 1º, admite excepcionalmente prazo razoável fixado pelo Tribunal.","src":"CF, art. 103, § 2º; Lei 9.868/1999, art. 12-H","url":"https://www.planalto.gov.br/ccivil_03/leis/l9868.htm"}];const civilModules=[{"t":"Pessoas naturais, capacidade e personalidade","ref":"CC, arts. 1º a 21","lessons":[["Personalidade e capacidade","A personalidade civil começa com o nascimento com vida, sem prejuízo da proteção jurídica do nascituro desde a concepção. Capacidade de direito é a aptidão para titularizar direitos e deveres; capacidade de exercício é a aptidão para praticar atos pessoalmente. Um recém-nascido pode receber patrimônio, embora necessite de representação."],["Incapacidade e emancipação","Menores de 16 anos são absolutamente incapazes; entre 16 e 18 anos, a incapacidade é relativa. O representante atua em nome do absolutamente incapaz, enquanto o assistente complementa a manifestação do relativamente incapaz. A emancipação antecipa a capacidade civil, não a idade exigida por regimes como o penal."],["Direitos da personalidade","Nome, imagem, honra e integridade recebem proteção específica. O uso indevido de imagem pode ensejar medidas preventivas e reparação. A análise deve considerar finalidade, consentimento, interesse público e proteção constitucional da liberdade de expressão."]],"map":["Nascimento com vida → personalidade","Menor de 16 → representação","16 a 18 → assistência, salvo emancipação","Personalidade → tutela preventiva e reparatória"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Pessoas jurídicas, bens e domicílio","ref":"CC, arts. 40 a 103","lessons":[["Pessoa jurídica e autonomia","A constituição de pessoa jurídica privada depende, em regra, do registro do ato constitutivo. Seu patrimônio não se confunde automaticamente com o de seus integrantes. A desconsideração, nos termos do art. 50, exige abuso caracterizado por desvio de finalidade ou confusão patrimonial; mero inadimplemento não basta nesse regime."],["Domicílio","O domicílio da pessoa natural combina residência e intenção de permanência. Havendo várias residências alternadas, qualquer delas pode ser domicílio. Domicílio profissional e necessário obedecem a regras próprias. Identifique a finalidade da relação jurídica antes de escolher o conceito aplicável."],["Classificação de bens","Bens móveis e imóveis seguem regras diferentes de circulação. Bens fungíveis podem ser substituídos por equivalentes da mesma espécie, qualidade e quantidade. A distinção entre bens públicos e particulares influencia alienação e aquisição: bens públicos não são usucapíveis."]],"map":["Registro → existência legal","Autonomia patrimonial → regra","Abuso → possível desconsideração","Bem público → sem usucapião"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Negócio jurídico, defeitos e invalidade","ref":"CC, arts. 104 a 184","lessons":[["Existência e validade","Para a validade do negócio, examine capacidade do agente, licitude e possibilidade do objeto, sua determinação ou determinabilidade, além da forma exigida. A liberdade de forma é a regra, mas negócios específicos exigem solenidades. Não confunda validade com eficácia perante terceiros."],["Vícios da vontade","Erro substancial, dolo, coação, estado de perigo e lesão podem levar à anulabilidade, conforme seus pressupostos. Um erro de cálculo pode ser corrigido sem anular o negócio. Fraude contra credores protege o patrimônio que responde por obrigações e tem requisitos próprios."],["Nulidade e anulabilidade","A simulação é causa de nulidade; a incapacidade relativa e determinados vícios podem causar anulabilidade. Negócio nulo não se confirma pelo decurso do tempo. O anulável pode ser confirmado nos limites legais e exige observância do prazo decadencial correspondente."]],"map":["Validade → agente, objeto e forma","Vício de vontade → analisar requisitos","Simulação → nulidade","Anulabilidade → prazo e confirmação"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Prescrição e decadência","ref":"CC, arts. 189 a 211","lessons":[["Pretensão e prazo","A violação do direito faz nascer a pretensão, sujeita à prescrição. O prazo geral do art. 205 é de dez anos quando não houver prazo menor previsto em lei. Antes de aplicá-lo, identifique a natureza da pretensão e procure a regra especial."],["Impedimento, suspensão e interrupção","Impedimento evita o início; suspensão paralisa a contagem; interrupção reinicia o prazo nos termos legais. O art. 202 limita a interrupção da prescrição a uma vez. Em provas, construa uma linha do tempo com nascimento da pretensão e fatos modificadores da contagem."],["Decadência","A decadência incide sobre direitos potestativos sujeitos a prazo. A legal não pode ser renunciada e deve ser conhecida de ofício pelo juiz; a convencional segue regime diferente. Salvo previsão legal, as causas que impedem, suspendem ou interrompem a prescrição não se aplicam à decadência."]],"map":["Violação → pretensão","Prazo geral → 10 anos","Interrupção → uma vez","Decadência legal → conhecimento de ofício"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Obrigações, pagamento e inadimplemento","ref":"CC, arts. 233 a 420","lessons":[["Modalidades e solidariedade","Obrigações de dar, fazer e não fazer distinguem-se pelo objeto da prestação. A solidariedade permite exigir o todo de um dos devedores solidários, mas não se presume: decorre da lei ou da vontade das partes. Indivisibilidade relaciona-se à prestação e não se confunde com solidariedade."],["Adimplemento e extinção","Pagamento regular exige prestação devida ao credor ou a quem legitimamente o represente. Consignação pode liberar o devedor nos casos legais, como recusa injustificada de recebimento. Novação exige obrigação nova e intenção de novar; compensação e remissão possuem pressupostos distintos."],["Mora e perdas e danos","Distinga atraso ainda útil ao credor de inadimplemento que torna a prestação inútil. Perdas e danos exigem exame do prejuízo e nexo. A Lei 14.905/2024 alterou regras de juros legais e atualização monetária; não adote automaticamente a antiga referência de 1% ao mês."]],"map":["Dar, fazer ou não fazer → prestação","Solidariedade → lei ou acordo","Consignação → hipóteses legais","Mora → atraso juridicamente relevante"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14905.htm"},{"t":"Contratos: princípios e espécies","ref":"CC, arts. 421 a 480, 481 a 853","lessons":[["Autonomia e boa-fé","A liberdade contratual é exercida nos limites da função social. A boa-fé objetiva exige comportamento leal na formação e execução do contrato, inclusive deveres de informação e cooperação. A revisão contratual deve respeitar os requisitos do regime aplicável, não qualquer insatisfação econômica."],["Contratos bilaterais e resolução","Em contratos bilaterais, a parte que ainda não cumpriu sua obrigação não pode, em regra, exigir a contraprestação. A resolução por inadimplemento e a revisão por onerosidade excessiva têm fundamentos próprios. Analise a distribuição de riscos, a reciprocidade e os requisitos legais."],["Espécies contratuais","Compra e venda obriga transferir domínio mediante preço; o contrato não transfere sozinho a propriedade imobiliária. Comodato é empréstimo gratuito de coisa não fungível; mútuo envolve coisas fungíveis. Mandato atribui poderes para praticar atos em nome de outrem."]],"map":["Boa-fé → lealdade","Função social → limite","Comodato → coisa não fungível","Mútuo → coisa fungível"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Responsabilidade civil","ref":"CC, arts. 186 a 188 e 927 a 954","lessons":[["Elementos da responsabilidade","Identifique conduta, dano e nexo causal, além da culpa quando o regime for subjetivo. A responsabilidade objetiva dispensa prova da culpa, mas não elimina a necessidade de verificar os demais pressupostos. Abuso de direito pode constituir ato ilícito."],["Regimes de imputação","O art. 927 admite responsabilidade sem culpa em hipóteses legais ou quando a atividade normalmente desenvolvida implique risco por sua natureza para direitos de terceiros. Há hipóteses de responsabilidade por fato de outra pessoa, como a do empregador por atos do empregado no exercício do trabalho ou em razão dele."],["Reparação e excludentes","A indenização é medida pela extensão do dano, com exceções legais. Culpa concorrente da vítima pode influenciar o valor. Caso fortuito, força maior e fato exclusivo de terceiro exigem análise do nexo e do risco assumido; não excluem automaticamente responsabilidade em todos os regimes."]],"map":["Conduta + dano + nexo","Subjetiva → culpa","Objetiva → hipóteses legais ou risco","Indenização → extensão do dano"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Posse, propriedade e direitos reais","ref":"CC, arts. 1.196 a 1.510-E","lessons":[["Posse e detenção","Possuidor exerce de fato algum dos poderes inerentes à propriedade. Detentor conserva a posse em nome de outro sob dependência, nos termos legais. Posse direta e indireta podem coexistir, como no exemplo do locatário e locador; posse e propriedade não são sinônimos."],["Proteção e aquisição","Manutenção tutela a posse contra turbação; reintegração responde ao esbulho; interdito proibitório protege diante de ameaça. A usucapião exige requisitos da modalidade escolhida, incluindo tempo e características da posse. Não se presume aquisição pelo simples decurso temporal."],["Propriedade e direitos reais limitados","Na transferência imobiliária entre vivos, o registro do título translativo é essencial à aquisição do domínio. Usufruto separa poderes de uso e fruição da nua-propriedade. Servidão beneficia imóvel dominante, e direitos reais de garantia possuem regimes próprios."]],"map":["Posse ≠ propriedade","Turbação → manutenção","Esbulho → reintegração","Imóvel entre vivos → registro"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Direito de família","ref":"CC, arts. 1.511 a 1.783-A","lessons":[["Casamento e regimes patrimoniais","Na ausência de convenção válida e de hipótese de regime obrigatório, aplica-se a comunhão parcial. Em regra, comunicam-se bens adquiridos onerosamente durante o casamento, com exclusões legais, como bens anteriores e determinados bens recebidos por doação ou sucessão."],["União estável e filiação","A união estável exige convivência pública, contínua e duradoura, estabelecida com objetivo de constituição de família; não há prazo mínimo geral no Código Civil. O reconhecimento de uniões homoafetivas decorre da interpretação constitucional do STF. Filhos têm igualdade de direitos independentemente da origem da filiação."],["Alimentos e poder familiar","Alimentos são fixados considerando necessidades do reclamante e recursos da pessoa obrigada, com proporcionalidade. Alterações relevantes podem fundamentar revisão. Poder familiar envolve responsabilidades parentais; a guarda deve considerar a proteção da criança e as regras atuais, inclusive hipóteses de risco de violência doméstica."]],"map":["Regime supletivo → comunhão parcial","União estável → objetivo familiar","Filiação → igualdade","Alimentos → necessidade e possibilidade"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Direito das sucessões","ref":"CC, arts. 1.784 a 2.027","lessons":[["Abertura e transmissão","A morte abre a sucessão e transmite desde logo a herança aos herdeiros legítimos e testamentários. Até a partilha, a herança é tratada como unidade indivisível. Aceitação e renúncia possuem formas e efeitos próprios; a renúncia exige escritura pública ou termo judicial."],["Vocação hereditária e legítima","A ordem de vocação hereditária considera descendentes, ascendentes, cônjuge e colaterais, com regras de concorrência e regime patrimonial. Descendentes, ascendentes e cônjuge são herdeiros necessários no texto do art. 1.845. A sucessão do companheiro exige considerar a equiparação sucessória reconhecida pelo STF."],["Testamento, dívidas e partilha","O testamento permite organizar a sucessão nos limites legais, respeitando a legítima quando houver herdeiros necessários. A meação não é herança: deve ser apurada antes de distribuir o acervo hereditário. O herdeiro não responde por encargos superiores às forças da herança, observadas as regras probatórias."]],"map":["Morte → abertura da sucessão","Meação ≠ herança","Herdeiros necessários → legítima","Renúncia → instrumento público ou termo judicial"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"}];const civilQuestions=[{"id":3001,"s":2,"module":0,"topic":"Pessoas naturais, capacidade e personalidade","difficulty":"Intermediária","q":"Uma pessoa de 17 anos, não emancipada, pretende celebrar sozinha negócio que exige plena capacidade. Qual sua condição civil?","a":["Absolutamente incapaz","Relativamente incapaz","Plenamente capaz em todos os atos","Sem personalidade civil"],"ok":1,"e":"O art. 4º, I, inclui maiores de 16 e menores de 18 anos entre os relativamente incapazes. A assistência é a regra para atos que exijam capacidade plena.","src":"CC, arts. 1º a 21","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3002,"s":2,"module":0,"topic":"Pessoas naturais, capacidade e personalidade","difficulty":"Intermediária","q":"Uma criança nasce com vida e falece poucos minutos depois. Considerando apenas a personalidade civil, qual conclusão é correta?","a":["Não adquiriu personalidade porque não foi registrada","Adquiriu apenas após completar um dia","O registro é constitutivo da personalidade","Adquiriu personalidade no nascimento com vida"],"ok":3,"e":"Nos termos do art. 2º, o nascimento com vida é o marco da personalidade civil; o registro não constitui esse fato.","src":"CC, arts. 1º a 21","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3003,"s":2,"module":1,"topic":"Pessoas jurídicas, bens e domicílio","difficulty":"Intermediária","q":"Uma sociedade deixa de pagar dívida. Sem evidência de abuso, o credor pede desconsideração com base apenas no art. 50 do CC. Qual resposta?","a":["O mero inadimplemento não basta","A medida é automática","Todo sócio responde integralmente","A sociedade é extinta de pleno direito"],"ok":0,"e":"O art. 50 exige abuso da personalidade jurídica, caracterizado por desvio de finalidade ou confusão patrimonial; não basta a dívida impaga.","src":"CC, arts. 40 a 103","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3004,"s":2,"module":1,"topic":"Pessoas jurídicas, bens e domicílio","difficulty":"Intermediária","q":"Um particular ocupa bem público por décadas e pretende adquiri-lo por usucapião. Qual regra se aplica?","a":["Adquire após cinco anos","Adquire se for de boa-fé","Bens públicos não são adquiridos por usucapião","Adquire se pagar tributos"],"ok":2,"e":"O art. 102 do CC exclui os bens públicos da aquisição por usucapião, independentemente do tempo de ocupação.","src":"CC, arts. 40 a 103","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3005,"s":2,"module":2,"topic":"Negócio jurídico, defeitos e invalidade","difficulty":"Intermediária","q":"Duas pessoas simulam venda para aparentar transferência patrimonial inexistente. Qual o vício do negócio simulado?","a":["Mora","Prescrição","Nulidade","Anulabilidade por incapacidade relativa"],"ok":2,"e":"O art. 167 declara nulo o negócio simulado, podendo subsistir o negócio dissimulado se válido em substância e forma.","src":"CC, arts. 104 a 184","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3006,"s":2,"module":2,"topic":"Negócio jurídico, defeitos e invalidade","difficulty":"Intermediária","q":"Um contrato apresenta simples erro aritmético no cálculo do preço. Qual providência o art. 143 admite?","a":["Nulidade automática","Retificação da declaração de vontade","Rescisão penal","Conversão em doação"],"ok":1,"e":"O erro de cálculo permite retificação da declaração, sem por si só exigir invalidação do negócio.","src":"CC, arts. 104 a 184","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3007,"s":2,"module":3,"topic":"Prescrição e decadência","difficulty":"Intermediária","q":"Não há prazo prescricional especial aplicável a determinada pretensão. Qual prazo geral o art. 205 estabelece?","a":["Dois anos","Cinco anos","Vinte anos","Dez anos"],"ok":3,"e":"O prazo geral é de dez anos se a lei não fixar prazo menor.","src":"CC, arts. 189 a 211","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3008,"s":2,"module":3,"topic":"Prescrição e decadência","difficulty":"Intermediária","q":"O juiz identifica decadência estabelecida em lei. Qual conduta prevê o Código Civil?","a":["Deve conhecê-la de ofício","Só pode apreciá-la se o réu pedir","Deve transformar o prazo em prescrição","Deve aguardar autorização do Ministério Público"],"ok":0,"e":"O art. 210 determina o conhecimento de ofício da decadência legal, diferentemente da convencional, tratada no art. 211.","src":"CC, arts. 189 a 211","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3009,"s":2,"module":4,"topic":"Obrigações, pagamento e inadimplemento","difficulty":"Intermediária","q":"Dois devedores assinam obrigação divisível sem cláusula de solidariedade e sem lei que a imponha. A solidariedade pode ser presumida?","a":["Sim, sempre","Não, resulta da lei ou da vontade das partes","Sim, se houver duas assinaturas","Sim, por escolha unilateral do credor"],"ok":1,"e":"O art. 265 afasta a presunção de solidariedade; a pluralidade de devedores não basta.","src":"CC, arts. 233 a 420","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3010,"s":2,"module":4,"topic":"Obrigações, pagamento e inadimplemento","difficulty":"Intermediária","q":"O credor recusa injustificadamente receber pagamento devido. Qual mecanismo pode liberar o devedor se observados os requisitos legais?","a":["Usucapião","Novação obrigatória","Consignação em pagamento","Doação"],"ok":2,"e":"O art. 335, I, contempla a consignação quando o credor não puder ou, sem justa causa, recusar receber o pagamento ou dar quitação regular.","src":"CC, arts. 233 a 420","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3011,"s":2,"module":5,"topic":"Contratos: princípios e espécies","difficulty":"Intermediária","q":"Uma pessoa empresta gratuitamente um violino individualizado, que deverá ser devolvido em sua identidade original. Qual contrato?","a":["Mútuo","Compra e venda","Doação","Comodato"],"ok":3,"e":"O art. 579 caracteriza comodato como empréstimo gratuito de coisas não fungíveis, aperfeiçoado com a entrega.","src":"CC, arts. 421 a 480, 481 a 853","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3012,"s":2,"module":5,"topic":"Contratos: princípios e espécies","difficulty":"Intermediária","q":"Em contrato bilateral, sem exceção aplicável, uma parte exige contraprestação antes de cumprir a obrigação que lhe incumbe. Qual defesa pode ser pertinente?","a":["Exceção do contrato não cumprido","Usucapião","Decadência automática","Renúncia tácita à propriedade"],"ok":0,"e":"O art. 476 impede, em contratos bilaterais, que um contratante exija o cumprimento da obrigação do outro antes de cumprir a sua, observada a ordem contratual.","src":"CC, arts. 421 a 480, 481 a 853","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3013,"s":2,"module":6,"topic":"Responsabilidade civil","difficulty":"Intermediária","q":"Em hipótese legal de responsabilidade objetiva, qual elemento se dispensa, em regra, provar?","a":["Dano","Culpa","Nexo causal","Fato juridicamente imputável"],"ok":1,"e":"A responsabilidade objetiva dispensa demonstração da culpa, mas exige os demais pressupostos aplicáveis.","src":"CC, arts. 186 a 188 e 927 a 954","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3014,"s":2,"module":6,"topic":"Responsabilidade civil","difficulty":"Intermediária","q":"A vítima contribuiu culposamente para o evento danoso. Qual efeito prevê o art. 945?","a":["Extinção automática da indenização","Dobro da indenização","Consideração da gravidade da culpa da vítima em confronto com a do autor","Irrelevância obrigatória da conduta da vítima"],"ok":2,"e":"O art. 945 determina ponderação da gravidade das culpas na fixação da indenização quando a vítima concorre culposamente.","src":"CC, arts. 186 a 188 e 927 a 954","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3015,"s":2,"module":7,"topic":"Posse, propriedade e direitos reais","difficulty":"Intermediária","q":"Comprador possui escritura de imóvel, mas o título ainda não foi registrado. Qual regra geral sobre a transferência entre vivos?","a":["Já adquiriu domínio somente com assinatura","Adquiriu domínio pelo pagamento integral","Adquiriu domínio pela emissão da escritura","O domínio se transfere com o registro do título translativo"],"ok":3,"e":"O art. 1.245 estabelece a transferência da propriedade imobiliária entre vivos mediante registro do título no Registro de Imóveis.","src":"CC, arts. 1.196 a 1.510-E","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3016,"s":2,"module":7,"topic":"Posse, propriedade e direitos reais","difficulty":"Intermediária","q":"O possuidor foi privado da posse por ato de terceiro. Qual proteção possessória corresponde ao esbulho?","a":["Reintegração de posse","Manutenção de posse exclusivamente","Mandado de injunção","Habeas data"],"ok":0,"e":"O art. 1.210 assegura restituição da posse no esbulho, manutenção na turbação e proteção diante de ameaça.","src":"CC, arts. 1.196 a 1.510-E","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3017,"s":2,"module":8,"topic":"Direito de família","difficulty":"Intermediária","q":"Sem pacto antenupcial e fora das hipóteses de separação obrigatória, qual regime patrimonial se aplica ao casamento?","a":["Comunhão universal","Comunhão parcial","Separação convencional","Participação final nos aquestos"],"ok":1,"e":"O art. 1.640 estabelece a comunhão parcial na ausência de convenção válida, ressalvadas hipóteses legais específicas.","src":"CC, arts. 1.511 a 1.783-A","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3018,"s":2,"module":8,"topic":"Direito de família","difficulty":"Intermediária","q":"Após fixação dos alimentos, ocorre mudança relevante e comprovada na situação financeira do alimentante. Qual medida pode ser cabível?","a":["Extinção automática sem decisão","Transferência automática a terceiro","Pedido de revisão judicial","Impossibilidade de qualquer alteração"],"ok":2,"e":"O art. 1.699 admite pedido de exoneração, redução ou majoração diante de mudança na situação financeira pertinente.","src":"CC, arts. 1.511 a 1.783-A","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3019,"s":2,"module":9,"topic":"Direito das sucessões","difficulty":"Intermediária","q":"Qual o momento da transmissão da herança aos herdeiros, pela regra da saisine?","a":["Na assinatura da partilha","No registro do inventário","Após pagamento de todos os tributos","Na abertura da sucessão, com a morte"],"ok":3,"e":"O art. 1.784 prevê transmissão imediata da herança com a abertura da sucessão.","src":"CC, arts. 1.784 a 2.027","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3020,"s":2,"module":9,"topic":"Direito das sucessões","difficulty":"Intermediária","q":"Uma pessoa pretende renunciar formalmente à herança. Qual forma é exigida pelo art. 1.806?","a":["Instrumento público ou termo judicial","Mensagem verbal a familiar","Qualquer mensagem de texto","Apenas declaração particular sem formalidade"],"ok":0,"e":"A renúncia deve constar expressamente de instrumento público ou termo judicial, não se presumindo de manifestação informal.","src":"CC, arts. 1.784 a 2.027","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"}];const processCivilModules=[{"t":"Normas fundamentais e jurisdição","ref":"CPC, arts. 1º a 20","lessons":[["Iniciativa e impulso oficial","O processo começa por iniciativa da parte, salvo exceção legal, e segue por impulso oficial. A iniciativa de instaurar a demanda não significa que cada ato posterior dependa de novo pedido. O juiz dirige o procedimento respeitando os limites do pedido e a imparcialidade."],["Contraditório substancial","As partes devem poder influenciar a formação da decisão. Mesmo questão cognoscível de ofício, em regra, exige oportunidade prévia de manifestação. As exceções à oitiva prévia previstas no art. 9º não afastam o contraditório posterior."],["Acesso à justiça e cooperação","A arbitragem é admitida na forma da lei, e a solução consensual deve ser estimulada. Boa-fé e cooperação não obrigam uma parte a abandonar sua pretensão; exigem condutas compatíveis com um procedimento leal e decisão de mérito em tempo razoável."]],"map":["Iniciativa → parte","Impulso → oficial","Contraditório → influência","Cooperação → decisão justa"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Competência e partes","ref":"CPC, arts. 42 a 76","lessons":[["Competência absoluta e relativa","A competência ligada à matéria, pessoa ou função não pode ser alterada por convenção. Em regra, a territorial e a de valor são relativas, observadas exceções. A incompetência é arguida em preliminar de contestação; a absoluta pode ser conhecida de ofício. A eleição de foro deve atender aos requisitos legais vigentes."],["Capacidade e representação","A capacidade de ser parte não se confunde com a capacidade de atuar pessoalmente em juízo. A representação de incapazes e pessoas jurídicas obedece à lei. Identificada irregularidade sanável de representação, o juiz deve oportunizar correção antes das consequências processuais pertinentes."],["Litisconsórcio","Há litisconsórcio quando mais de uma pessoa participa de um polo processual. A necessidade decorre da lei ou da natureza da relação jurídica; a unitariedade depende de a decisão de mérito precisar ser uniforme. Essas classificações não são equivalentes."]],"map":["Matéria, pessoa, função → absoluta","Incompetência → preliminar","Representação irregular → saneamento","Necessário ≠ unitário"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Atos processuais, citação e prazos","ref":"CPC, arts. 188 a 275","lessons":[["Forma e instrumentalidade","A validade do ato deve ser examinada à luz da finalidade e das exigências legais. Se a forma não for essencial, o ato pode ser aproveitado quando atingir sua finalidade. Diferencie irregularidade sem prejuízo de vício capaz de comprometer defesa ou validade."],["Contagem de prazos","Para prazos processuais expressos em dias, contam-se apenas dias úteis. Exclui-se em regra o dia do começo e inclui-se o vencimento. O termo inicial varia conforme a modalidade de comunicação. Não aplique a regra indistintamente a prazos de direito material."],["Citação e intimação","A citação convoca o réu, executado ou interessado para integrar a relação processual; a intimação comunica atos e termos. O comparecimento espontâneo supre falta ou nulidade da citação nos termos do art. 239. A citação eletrônica tem disciplina própria, que deve ser conferida na redação vigente."]],"map":["Finalidade → aproveitamento","Prazo processual em dias → úteis","Citação → integração","Intimação → ciência"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Tutelas provisórias","ref":"CPC, arts. 294 a 311","lessons":[["Urgência e evidência","A tutela provisória pode fundar-se em urgência ou evidência. A primeira exige probabilidade do direito e perigo de dano ou risco ao resultado útil. A evidência depende das hipóteses específicas do art. 311, sem exigir demonstração de perigo."],["Tutela cautelar e antecipada","A cautelar protege a utilidade do resultado; a antecipada adianta efeitos práticos da tutela pretendida. Ambas podem ser antecedentes ou incidentais. A antecipação não deve ser concedida quando houver perigo de irreversibilidade de seus efeitos, ressalvadas questões interpretativas do caso concreto."],["Estabilização e revisão","A estabilização tem disciplina própria no art. 304 para tutela antecipada antecedente. Não se confunde com coisa julgada material. É necessário estudar a impugnação pertinente, a extinção do processo e a ação destinada a rever, reformar ou invalidar a medida, considerando a jurisprudência."]],"map":["Urgência → probabilidade + perigo","Cautelar → proteção","Antecipada → satisfação provisória","Evidência → hipóteses legais"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Procedimento comum e resposta do réu","ref":"CPC, arts. 318 a 357","lessons":[["Petição inicial e saneamento","A inicial deve identificar partes, fundamentos, pedido e demais requisitos legais. Quando defeitos sanáveis dificultam o exame do mérito, o juiz indica o que deve ser corrigido e concede prazo legal de emenda. Indeferimento não é a primeira opção diante de vício corrigível."],["Conciliação e contestação","A audiência de conciliação ou mediação possui hipóteses legais de dispensa. O prazo de contestação é de quinze dias úteis, mas seu termo inicial depende da situação do art. 335. O réu deve concentrar matérias defensivas, sem prejuízo das exceções legais."],["Reconvenção e revelia","A reconvenção permite ao réu formular pretensão própria conexa à ação ou fundamento da defesa. A revelia não implica vitória automática do autor: a presunção de veracidade possui exceções e não dispensa o exame jurídico dos pedidos."]],"map":["Inicial → requisitos e emenda","Contestação → 15 dias úteis","Reconvenção → pretensão própria","Revelia ≠ procedência automática"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Provas, audiência e saneamento","ref":"CPC, arts. 357 a 484","lessons":[["Ônus da prova","Em regra, o autor prova os fatos constitutivos de seu direito e o réu os fatos impeditivos, modificativos ou extintivos. A redistribuição judicial deve ser fundamentada e permitir à parte cumprir o encargo; não pode criar prova impossível ou excessivamente difícil."],["Meios de prova","Documentos, testemunhas, perícia e depoimento têm finalidades distintas. A prova pericial trata de questões que demandam conhecimento técnico, mas o juiz não está automaticamente vinculado ao laudo. Deve fundamentar a apreciação das provas e evitar diligências inúteis ou protelatórias."],["Organização do processo","O saneamento delimita questões controvertidas, resolve pendências processuais, define meios de prova e distribuição do ônus, e designa audiência quando necessária. A definição dos fatos relevantes torna a instrução mais eficiente."]],"map":["Autor → fato constitutivo","Réu → fato impeditivo/modificativo/extintivo","Redistribuição → decisão fundamentada","Saneamento → delimitação"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Sentença e coisa julgada","ref":"CPC, arts. 485 a 508","lessons":[["Resolução do mérito","A extinção sem mérito e o julgamento de mérito têm efeitos distintos. Acolhimento ou rejeição do pedido, reconhecimento de prescrição ou decadência e homologações previstas no art. 487 são decisões de mérito. A ausência de pressuposto processual pode gerar extinção sem mérito."],["Fundamentação e congruência","A sentença deve apresentar fundamentação adequada e observar os limites da demanda. Não basta citar norma ou precedente sem demonstrar sua relação com a controvérsia. O juiz não pode conceder objeto diverso ou quantidade superior ao pedido, observadas as regras legais de interpretação."],["Coisa julgada","A coisa julgada material protege decisão de mérito não mais sujeita a recurso. Em regra, os motivos da decisão não fazem coisa julgada por si. Questões prejudiciais podem adquirir essa autoridade quando preenchidos os requisitos do art. 503. A ação rescisória tem hipóteses específicas."]],"map":["Art. 485 → sem mérito","Art. 487 → mérito","Congruência → limites do pedido","Coisa julgada → decisão de mérito definitiva"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Recursos e precedentes","ref":"CPC, arts. 926 a 928 e 994 a 1.044","lessons":[["Sistema recursal","O recurso adequado depende da espécie de pronunciamento e da hipótese legal. Apelação impugna sentença; agravo de instrumento impugna interlocutórias nas hipóteses pertinentes; agravo interno questiona decisão monocrática do relator. O prazo recursal geral é de quinze dias úteis, exceto embargos de declaração, de cinco."],["Agravo e taxatividade mitigada","O art. 1.015 lista hipóteses de agravo. No Tema 988, o STJ admite seu cabimento fora do rol quando esperar pela apelação tornar inútil o exame da matéria, em razão da urgência. Não equivale a permitir agravo contra qualquer interlocutória."],["Embargos e precedentes","Embargos de declaração corrigem obscuridade, contradição, omissão ou erro material, interrompendo o prazo para outros recursos. A aplicação de precedentes exige identificar a razão determinante e a aderência do caso. Recurso especial e extraordinário possuem requisitos próprios."]],"map":["Sentença → apelação","Interlocutória → art. 1.015 e Tema 988","Embargos → 5 dias úteis","Prazo recursal geral → 15 dias úteis"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm","extraUrl":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=988&cod_tema_inicial=988&novaConsulta=true&tipo_pesquisa=T"},{"t":"Cumprimento de sentença e execução","ref":"CPC, arts. 513 a 538, 771 a 925","lessons":[["Título e técnica executiva","O cumprimento de sentença realiza obrigação reconhecida em título judicial. A execução autônoma pode basear-se em título extrajudicial. Identifique certeza, liquidez e exigibilidade, natureza da obrigação e meio de satisfação adequado."],["Pagamento voluntário","No cumprimento definitivo de sentença por quantia certa contra devedor privado, a intimação para pagar inicia prazo de quinze dias. Não havendo pagamento voluntário, incidem multa e honorários de dez por cento cada sobre o montante pertinente. A Fazenda Pública e os alimentos possuem procedimentos próprios."],["Defesa e penhora","A impugnação é a defesa típica do cumprimento de sentença; embargos à execução são próprios da execução extrajudicial. A penhora deve respeitar regras de impenhorabilidade e efetividade. Menor onerosidade não autoriza frustrar a satisfação do credor, devendo o executado indicar alternativa eficaz quando pertinente."]],"map":["Título judicial → cumprimento","Extrajudicial → execução autônoma","Pagamento → prazo do art. 523","Defesa → impugnação ou embargos"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Procedimentos especiais e ações autônomas","ref":"CPC, arts. 539 a 770 e 966 a 975","lessons":[["Consignação e monitória","A consignação permite depositar a prestação quando presentes os requisitos de direito material. A ação monitória permite ao titular de prova escrita sem eficácia de título executivo buscar a satisfação das obrigações previstas no art. 700. Não se confunde com execução direta."],["Possessórias e família","As ações possessórias distinguem manutenção, reintegração e interdito proibitório conforme turbação, esbulho ou ameaça. O procedimento de família estimula solução consensual, sem afastar garantias, proteção de vulneráveis e análise de eventual violência."],["Ação rescisória","A desconstituição de decisão de mérito transitada em julgado exige hipótese legal do art. 966, com exceções expressas para certas decisões sem mérito. Não é novo recurso para simples inconformismo. O prazo geral é de dois anos contado do trânsito em julgado da última decisão proferida no processo, observadas regras especiais."]],"map":["Consignação → depósito da prestação","Monitória → prova escrita sem título executivo","Esbulho → reintegração","Rescisória → hipóteses legais"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"}];const processCivilQuestions=[{"id":4001,"s":3,"module":0,"topic":"Normas fundamentais e jurisdição","difficulty":"Intermediária","q":"O juiz pretende decidir com fundamento jurídico ainda não debatido, cognoscível de ofício, sem hipótese excepcional. Como deve proceder?","a":["Decidir imediatamente","Dar às partes oportunidade de manifestação","Consultar somente o autor","Extinguir o processo automaticamente"],"ok":1,"e":"O art. 10 protege as partes contra decisão baseada em fundamento sobre o qual não puderam se manifestar, inclusive quando examinável de ofício.","src":"CPC, arts. 1º a 20","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4002,"s":3,"module":0,"topic":"Normas fundamentais e jurisdição","difficulty":"Intermediária","q":"Após o ajuizamento regular da demanda, a movimentação ordinária do processo depende sempre de pedido expresso das partes?","a":["Sim, inclusive para toda intimação","Sim, salvo autorização do réu","Não, o impulso é oficial, ressalvadas as exceções legais","Não, porque a iniciativa inicial também é sempre do juiz"],"ok":2,"e":"O art. 2º distingue iniciativa da parte e desenvolvimento por impulso oficial.","src":"CPC, arts. 1º a 20","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4003,"s":3,"module":1,"topic":"Competência e partes","difficulty":"Intermediária","q":"As partes convencionam transferir a demanda para órgão incompetente em razão da matéria. A convenção é válida?","a":["Sim, se escrita","Sim, se houver duas testemunhas","Sim, se o réu concordar","Não, essa competência é inderrogável por convenção"],"ok":3,"e":"O art. 62 torna inderrogável por convenção a competência em razão da matéria, da pessoa ou da função.","src":"CPC, arts. 42 a 76","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4004,"s":3,"module":1,"topic":"Competência e partes","difficulty":"Intermediária","q":"Verificada irregularidade sanável de representação processual, qual a providência inicial prevista?","a":["Suspender o processo e conceder prazo razoável para sanar o vício","Julgar imediatamente improcedente","Aplicar multa criminal","Desconsiderar definitivamente a parte"],"ok":0,"e":"O art. 76 prevê suspensão e prazo razoável de saneamento, com consequências específicas se a providência não for cumprida.","src":"CPC, arts. 42 a 76","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4005,"s":3,"module":2,"topic":"Atos processuais, citação e prazos","difficulty":"Intermediária","q":"Um prazo processual judicial de cinco dias é fixado em dias. Qual regra de contagem se aplica?","a":["Somente dias úteis","Dias corridos em qualquer hipótese","Somente sábados","Somente dias úteis quando o réu pedir"],"ok":0,"e":"O art. 219 determina contagem em dias úteis para prazos processuais expressos em dias.","src":"CPC, arts. 188 a 275","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4006,"s":3,"module":2,"topic":"Atos processuais, citação e prazos","difficulty":"Intermediária","q":"O réu comparece espontaneamente ao processo apesar de falta de citação válida. Qual efeito prevê o CPC?","a":["Extinção imediata","Anulação obrigatória de todos os atos","Comparecimento sem efeito jurídico","Supre a falta ou nulidade da citação, fluindo daí o prazo legal"],"ok":3,"e":"O art. 239, § 1º, estabelece o suprimento da falta ou nulidade pelo comparecimento espontâneo e o início do prazo de contestação ou embargos à execução.","src":"CPC, arts. 188 a 275","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4007,"s":3,"module":3,"topic":"Tutelas provisórias","difficulty":"Intermediária","q":"Qual conjunto de pressupostos caracteriza a tutela de urgência do art. 300?","a":["Certeza absoluta e trânsito em julgado","Probabilidade do direito e perigo de dano ou risco ao resultado útil","Somente existência de contrato escrito","Unicamente a vontade do autor"],"ok":1,"e":"O art. 300 exige probabilidade e perigo de dano ou risco à utilidade do processo.","src":"CPC, arts. 294 a 311","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4008,"s":3,"module":3,"topic":"Tutelas provisórias","difficulty":"Intermediária","q":"Em uma hipótese expressa do art. 311, é indispensável provar perigo de dano para obter tutela da evidência?","a":["Sim, em todos os casos","Sim, apenas se houver réu particular","Não, a tutela da evidência dispensa esse requisito","Sim, salvo consentimento do réu"],"ok":2,"e":"A tutela da evidência pode ser concedida independentemente da demonstração de perigo, desde que presentes os requisitos da hipótese legal.","src":"CPC, arts. 294 a 311","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4009,"s":3,"module":4,"topic":"Procedimento comum e resposta do réu","difficulty":"Intermediária","q":"Uma inicial possui defeito sanável que dificulta o julgamento. Qual a providência prevista no art. 321?","a":["Conceder quinze dias para emenda, indicando o que corrigir","Indeferir sempre de imediato","Conceder apenas 24 horas","Julgar o mérito sem intimar"],"ok":0,"e":"O art. 321 exige indicação precisa do vício e oportunidade de emenda em quinze dias.","src":"CPC, arts. 318 a 357","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4010,"s":3,"module":4,"topic":"Procedimento comum e resposta do réu","difficulty":"Intermediária","q":"O réu deseja apresentar pretensão própria conexa à ação do autor no procedimento comum. Qual instrumento é adequado?","a":["Embargos de declaração","Agravo interno","Habeas data","Reconvenção"],"ok":3,"e":"O art. 343 permite reconvenção para pretensão própria conexa à ação principal ou ao fundamento da defesa.","src":"CPC, arts. 318 a 357","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4011,"s":3,"module":5,"topic":"Provas, audiência e saneamento","difficulty":"Intermediária","q":"O réu alega pagamento integral da obrigação cobrada. Pela regra geral, a quem cabe provar esse fato extintivo?","a":["Ao juiz","Ao réu","Ao autor em qualquer hipótese","Ao Ministério Público"],"ok":1,"e":"O art. 373, II, atribui ao réu o ônus dos fatos impeditivos, modificativos ou extintivos do direito do autor.","src":"CPC, arts. 357 a 484","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4012,"s":3,"module":5,"topic":"Provas, audiência e saneamento","difficulty":"Intermediária","q":"Diante de laudo pericial, o magistrado é obrigado a adotar suas conclusões sem avaliação?","a":["Sim, sempre","Sim, se o perito for servidor","Não; deve valorar e fundamentar sua conclusão","Sim, salvo acordo escrito das partes"],"ok":2,"e":"Os arts. 371 e 479 preveem apreciação fundamentada da prova, incluindo os motivos para considerar ou afastar conclusões periciais.","src":"CPC, arts. 357 a 484","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4013,"s":3,"module":6,"topic":"Sentença e coisa julgada","difficulty":"Intermediária","q":"O juiz reconhece prescrição da pretensão, após observar as garantias processuais aplicáveis. Qual natureza da decisão?","a":["Sem resolução do mérito","Mero despacho","Decisão exclusivamente administrativa","Com resolução do mérito"],"ok":3,"e":"O art. 487, II, inclui decisão sobre prescrição ou decadência entre as hipóteses de resolução do mérito.","src":"CPC, arts. 485 a 508","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4014,"s":3,"module":6,"topic":"Sentença e coisa julgada","difficulty":"Intermediária","q":"Em regra, os motivos de uma sentença fazem coisa julgada por si mesmos?","a":["Não, mesmo que relevantes para determinar o alcance do dispositivo","Sim, todos os motivos sempre","Sim, desde que o autor concorde","Sim, apenas se citarem precedente"],"ok":0,"e":"O art. 504, I, exclui os motivos da coisa julgada; a questão prejudicial tem disciplina específica no art. 503.","src":"CPC, arts. 485 a 508","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4015,"s":3,"module":7,"topic":"Recursos e precedentes","difficulty":"Intermediária","q":"Uma sentença contém omissão sobre pedido expressamente formulado. Qual recurso específico permite suprir a omissão?","a":["Embargos de declaração","Agravo interno","Recurso ordinário constitucional necessariamente","Ação popular"],"ok":0,"e":"O art. 1.022, II, prevê embargos para suprir omissão; o art. 1.023 estabelece o prazo de cinco dias.","src":"CPC, arts. 926 a 928 e 994 a 1.044","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4016,"s":3,"module":7,"topic":"Recursos e precedentes","difficulty":"Intermediária","q":"Segundo o Tema 988 do STJ, quando pode caber agravo de instrumento fora do rol literal do art. 1.015?","a":["Em toda decisão sem exceção","Quando a parte preferir recorrer imediatamente","Quando houver urgência porque aguardar a apelação tornaria inútil o exame","Somente com concordância do juiz"],"ok":2,"e":"A tese repetitiva adota taxatividade mitigada vinculada à urgência decorrente da inutilidade do exame posterior.","src":"STJ, Tema Repetitivo 988","url":"https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp?cod_tema_final=988&cod_tema_inicial=988&novaConsulta=true&tipo_pesquisa=T"},{"id":4017,"s":3,"module":8,"topic":"Cumprimento de sentença e execução","difficulty":"Intermediária","q":"No cumprimento definitivo de sentença por quantia certa contra devedor privado, não ocorre pagamento voluntário no prazo do art. 523. Quais acréscimos legais incidem?","a":["Somente multa de 2%","Multa de 10% e honorários de 10%","Multa de 50% sem honorários","Nenhum acréscimo"],"ok":1,"e":"O art. 523, § 1º, prevê multa de dez por cento e honorários de dez por cento; pagamento parcial restringe a incidência ao restante.","src":"CPC, arts. 513 a 538, 771 a 925","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4018,"s":3,"module":8,"topic":"Cumprimento de sentença e execução","difficulty":"Intermediária","q":"Qual defesa típica do executado em execução fundada em título extrajudicial?","a":["Contestação obrigatória","Embargos de declaração","Recurso extraordinário imediato","Embargos à execução"],"ok":3,"e":"O art. 914 prevê oposição à execução por embargos, independentemente de penhora, depósito ou caução.","src":"CPC, arts. 513 a 538, 771 a 925","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4019,"s":3,"module":9,"topic":"Procedimentos especiais e ações autônomas","difficulty":"Intermediária","q":"Um credor possui prova escrita de dívida em dinheiro, sem eficácia executiva. Qual ação específica pode utilizar, presentes os demais requisitos?","a":["Ação monitória","Habeas corpus","Ação rescisória","Mandado de injunção"],"ok":0,"e":"O art. 700 permite monitória baseada em prova escrita sem eficácia de título executivo para exigir as obrigações nele previstas.","src":"CPC, arts. 539 a 770 e 966 a 975","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"id":4020,"s":3,"module":9,"topic":"Procedimentos especiais e ações autônomas","difficulty":"Intermediária","q":"Qual o prazo geral para propor ação rescisória, ressalvadas hipóteses especiais?","a":["Trinta dias","Seis meses","Dois anos do trânsito em julgado da última decisão proferida no processo","Dez anos do ajuizamento original"],"ok":2,"e":"O art. 975 estabelece prazo decadencial geral de dois anos e disciplina exceções específicas.","src":"CPC, arts. 539 a 770 e 966 a 975","url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"}];const penalModules=[{"t":"Princípios e aplicação da lei penal","ref":"CP, arts. 1º a 12","lessons":[["Legalidade e anterioridade","A criação de crimes e penas depende de lei anterior ao fato. A interpretação da norma deve respeitar os limites da legalidade; analogia prejudicial ao acusado não pode criar incriminação. Diferencie a data de publicação da lei de sua entrada em vigor."],["Lei penal no tempo","A lei posterior que deixa de considerar o fato criminoso faz cessar a execução e os efeitos penais da condenação, sem eliminar automaticamente os efeitos civis. A norma posterior mais favorável retroage inclusive após trânsito em julgado. Leis temporárias e excepcionais têm ultratividade nos termos do art. 3º."],["Tempo e lugar do crime","Para o tempo do crime, o Código adota a teoria da atividade: considera-se o momento da ação ou omissão. Para o lugar, adota a ubiquidade, abrangendo o local da conduta e aquele onde o resultado ocorreu ou deveria ocorrer. Territorialidade e extraterritorialidade obedecem a pressupostos distintos."]],"map":["Legalidade → lei anterior","Lei mais benéfica → retroatividade","Tempo → atividade","Lugar → ubiquidade"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Teoria do crime: fato típico, dolo e culpa","ref":"CP, arts. 13, 18 a 20","lessons":[["Estrutura do delito","Na concepção analítica tripartida, o crime é estudado pela tipicidade, ilicitude e culpabilidade. A tipicidade envolve adequação da conduta ao tipo penal e, quando necessário, resultado e nexo causal. Nem todo resultado danoso constitui crime: é preciso examinar os elementos do tipo."],["Causalidade e omissão","Nos crimes materiais, o resultado deve ser imputável à conduta segundo os critérios legais. O art. 13 disciplina a causa superveniente relativamente independente que, por si só, produz o resultado. Na omissão imprópria, a relevância penal pressupõe dever e possibilidade de agir nas condições do § 2º."],["Dolo, culpa e erro de tipo","Dolo abrange querer o resultado ou assumir seu risco; culpa envolve imprudência, negligência ou imperícia. A modalidade culposa exige previsão legal. O erro sobre elemento constitutivo do tipo exclui o dolo, mas permite punição culposa se prevista e presentes os respectivos requisitos."]],"map":["Fato típico → elementos legais","Omissão imprópria → dever e possibilidade","Culpa → previsão expressa","Erro de tipo → exclui dolo"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Consumação, tentativa e desistência","ref":"CP, arts. 14 a 17","lessons":[["Consumação e tentativa","O crime é consumado quando reúne todos os elementos de sua definição legal. A tentativa exige início da execução e ausência de consumação por circunstâncias alheias à vontade do agente. Em regra, a pena do crime consumado é reduzida de um a dois terços, salvo disposição em contrário."],["Desistência voluntária e arrependimento eficaz","Na desistência voluntária, o agente deixa de prosseguir na execução por decisão própria. No arrependimento eficaz, impede voluntariamente o resultado após os atos executórios. Nos dois casos, responde pelos atos já praticados, caso constituam infração penal."],["Arrependimento posterior e crime impossível","O arrependimento posterior exige crime sem violência ou grave ameaça à pessoa, reparação ou restituição por ato voluntário até o recebimento da denúncia ou queixa e enseja redução de pena. Crime impossível exige ineficácia absoluta do meio ou impropriedade absoluta do objeto, não mera dificuldade de consumação."]],"map":["Tentativa → causa alheia à vontade","Desistência → interrupção voluntária","Arrependimento eficaz → impede resultado","Posterior → redução nos requisitos legais"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Ilicitude e culpabilidade","ref":"CP, arts. 21 a 28","lessons":[["Excludentes de ilicitude","Estado de necessidade, legítima defesa, estrito cumprimento de dever legal e exercício regular de direito são hipóteses do art. 23. A legítima defesa exige agressão injusta, atual ou iminente, repelida moderadamente mediante meios necessários. O excesso doloso ou culposo pode gerar responsabilidade."],["Culpabilidade e erro de proibição","Culpabilidade é estudada mediante imputabilidade, potencial consciência da ilicitude e exigibilidade de conduta diversa. O desconhecimento da lei não é escusa. Erro inevitável sobre a ilicitude isenta de pena; erro evitável pode reduzir a pena de um sexto a um terço."],["Imputabilidade e coação","Menores de dezoito anos são penalmente inimputáveis, sujeitos à legislação especial. Doença mental ou desenvolvimento mental incompleto ou retardado pode afastar a imputabilidade nos requisitos do art. 26. Coação irresistível e estrita obediência a ordem não manifestamente ilegal de superior hierárquico seguem o art. 22."]],"map":["Legítima defesa → agressão injusta","Excesso → responsabilidade","Erro inevitável de proibição → isenção","Menor de 18 → inimputabilidade penal"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Concurso de pessoas e concurso de crimes","ref":"CP, arts. 29 a 31 e 69 a 71","lessons":[["Autoria e participação","Quem concorre para o crime incide nas penas a ele cominadas na medida de sua culpabilidade. A participação de menor importância pode reduzir a pena. A responsabilidade deve ser individualizada; vínculo pessoal ou presença no local não substitui a demonstração de contribuição penalmente relevante."],["Circunstâncias e cooperação","Circunstâncias e condições pessoais não se comunicam, salvo quando elementares do crime. Se um concorrente quis participar de crime menos grave, aplica-se a regra do art. 29, § 2º, considerando eventual previsibilidade do resultado mais grave. Ajuste e instigação, por si sós, seguem os limites do art. 31."],["Pluralidade de crimes","Concurso material envolve mais de uma ação ou omissão e dois ou mais crimes, com aplicação cumulativa das penas. Concurso formal decorre de uma só ação ou omissão e pluralidade de crimes, com regimes próprios. Continuidade delitiva pressupõe crimes da mesma espécie e condições semelhantes, além dos requisitos interpretativos pertinentes."]],"map":["Contribuição → culpabilidade individual","Condição pessoal → regra de incomunicabilidade","Material → cumulação","Formal e continuado → regimes próprios"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Penas, dosimetria e extinção da punibilidade","ref":"CP, arts. 32 a 68 e 107 a 120","lessons":[["Espécies e regimes","O Código prevê penas privativas de liberdade, restritivas de direitos e multa. Regime inicial e substituição dependem da pena, reincidência, circunstâncias judiciais e demais requisitos. A substituição não é automática pelo simples fato de a condenação ser inferior a quatro anos."],["Sistema trifásico","Na primeira fase, fixa-se a pena-base conforme circunstâncias judiciais; na segunda, consideram-se agravantes e atenuantes; na terceira, aplicam-se causas de aumento e diminuição. Diferencie qualificadora, que altera a faixa abstrata do delito, de agravante e causa de aumento."],["Punibilidade e prescrição","Morte do agente, anistia, graça, indulto, prescrição, decadência e outras hipóteses do art. 107 podem extinguir punibilidade. O cálculo prescricional depende da fase processual, da pena aplicável, dos marcos interruptivos e de regras especiais. Não aplique um prazo único a todos os delitos."]],"map":["Pena-base → primeira fase","Agravantes/atenuantes → segunda","Majorantes/minorantes → terceira","Prescrição → prazo e marcos legais"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Crimes contra a pessoa","ref":"CP, arts. 121 a 154-B","lessons":[["Vida e integridade","Homicídio e lesão corporal protegem bens jurídicos relacionados à vida e à integridade física. A distinção exige análise do elemento subjetivo e do resultado, sem presumir intenção apenas pela gravidade do dano. O feminicídio passou a tipo autônomo no art. 121-A pela Lei 14.994/2024."],["Honra","Calúnia envolve falsa imputação de fato definido como crime; difamação refere-se à imputação de fato ofensivo à reputação; injúria atinge dignidade ou decoro. A análise da ação penal e das causas especiais exige atenção à legislação vigente, inclusive à disciplina específica de discriminação racial."],["Liberdade individual","Ameaça e constrangimento ilegal são tipos distintos, com elementos próprios. Crimes de perseguição e violência psicológica contra a mulher exigem exame dos requisitos legais. Na prova, identifique precisamente o bem jurídico protegido e a presença de elementos especiais do tipo."]],"map":["Vida → tipos próprios","Feminicídio → art. 121-A","Calúnia → falsa imputação de crime","Difamação ≠ injúria"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14994.htm"},{"t":"Crimes contra o patrimônio","ref":"CP, arts. 155 a 183","lessons":[["Furto e roubo","O furto envolve subtração de coisa alheia móvel. O roubo inclui violência ou grave ameaça à pessoa, ou redução de sua capacidade de resistência nas condições do tipo. A distinção depende dos elementos legais e não simplesmente do valor do bem."],["Apropriação indébita e estelionato","A apropriação indébita pressupõe posse ou detenção anterior da coisa e posterior apropriação indevida. O estelionato exige vantagem ilícita em prejuízo alheio, mediante indução ou manutenção da vítima em erro por fraude. Diferencie a dinâmica jurídica da obtenção do bem, sem tratar todo descumprimento contratual como crime."],["Receptação e ação penal","A receptação tem modalidades e requisitos subjetivos próprios. A ação penal em crimes patrimoniais depende do tipo e das exceções legais, inclusive regras de representação e imunidades familiares. O simples parentesco não afasta automaticamente a responsabilidade em todas as hipóteses."]],"map":["Furto → subtração","Roubo → violência ou grave ameaça, entre outras hipóteses","Apropriação → posse anterior","Estelionato → fraude e erro"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Crimes contra a administração pública","ref":"CP, arts. 312 a 359-H","lessons":[["Funcionário público para fins penais","O art. 327 adota conceito penal próprio, abrangendo exercício transitório ou não remunerado de cargo, emprego ou função pública, além das equiparações legais. Não confunda o conceito penal com a exigência de concurso ou estabilidade."],["Peculato e corrupção","O peculato do art. 312 envolve apropriação ou desvio de bens de que o funcionário tem posse em razão do cargo, entre outras modalidades legais. Corrupção passiva abrange solicitar, receber vantagem indevida ou aceitar promessa nas condições do tipo. A corrupção ativa possui descrição autônoma no art. 333."],["Concussão e prevaricação","Concussão exige a exigência de vantagem indevida em razão da função. Prevaricação envolve retardar, omitir ou praticar indevidamente ato de ofício para satisfazer interesse ou sentimento pessoal. Compare os verbos nucleares e o vínculo entre conduta e função pública."]],"map":["Art. 327 → conceito penal","Peculato → vínculo funcional com bem","Concussão → exigir","Corrupção passiva → solicitar, receber ou aceitar promessa"],"url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm"},{"t":"Legislação penal especial e temas transversais","ref":"Leis 8.072/1990, 11.340/2006 e 11.343/2006","lessons":[["Crimes hediondos","A Lei 8.072/1990 estabelece rol legal e regimes específicos. A gravidade abstrata de uma conduta não permite, por si só, classificá-la como hedionda. Regras de execução penal e progressão exigem consulta à legislação consolidada, à data do fato e à jurisprudência aplicável."],["Violência doméstica e familiar","A Lei Maria da Penha disciplina prevenção, assistência, proteção e procedimentos próprios em situações de violência doméstica e familiar contra a mulher. As formas de violência não se limitam à física. Medidas protetivas têm regime específico e não dependem necessariamente do ajuizamento de ação penal, conforme a redação legal vigente."],["Lei de drogas e jurisprudência","A Lei 11.343/2006 distingue regimes jurídicos conforme as condutas e circunstâncias legais. É indispensável considerar a decisão do STF no Tema 506 sobre porte de cannabis para consumo pessoal e seus limites, sem estender automaticamente a solução a outras substâncias ou ao tráfico."]],"map":["Hediondez → previsão legal","Maria da Penha → proteção integral","Medidas protetivas → regime próprio","Drogas → lei e precedentes atuais"],"url":"https://www.planalto.gov.br/ccivil_03/leis/l8072.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11340.htm"}];const penalQuestions=[{"id":5001,"s":4,"module":0,"topic":"Princípios e aplicação da lei penal","difficulty":"Intermediária","q":"Uma lei posterior deixa de considerar criminosa determinada conduta. Há condenação definitiva pelo mesmo fato. Qual consequência penal?","a":["A condenação é imutável para todos os efeitos","Cessam a execução e os efeitos penais da condenaç
