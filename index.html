</style></head><body><div id="root"></div><script>
const subjects=['Ética Profissional','Direito Constitucional','Direito Civil','Processo Civil','Direito Penal','Processo Penal','Direito Administrativo','Direito Tributário','Direito do Trabalho','Processo do Trabalho','Direito Empresarial','Direitos Humanos','Direito Ambiental','Direito Internacional','Direito do Consumidor','ECA','Filosofia do Direito','Direito Eleitoral','Direito Financeiro','Direito Previdenciário'];
const qs=[{id:1,s:1,q:'Segundo a Constituição Federal, qual é o prazo de validade de um concurso público?',a:['Até um ano, sem prorrogação','Até dois anos, prorrogável uma vez por igual período','Sempre quatro anos','Indeterminado'],ok:1,e:'O art. 37, III, da Constituição prevê validade de até dois anos, prorrogável uma vez por igual período.',src:'Constituição Federal, art. 37, III',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'},{id:2,s:2,q:'Em regra, em qual idade cessa a menoridade civil?',a:['16 anos','21 anos','18 anos completos','25 anos'],ok:2,e:'O art. 5º do Código Civil prevê que a menoridade cessa aos dezoito anos completos, ressalvadas as hipóteses legais de emancipação.',src:'Código Civil, art. 5º',url:'https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm'},{id:3,s:4,q:'Qual princípio impede que uma conduta seja considerada crime sem lei anterior que a defina?',a:['Legalidade penal','Publicidade','Eficiência','Contraditório'],ok:0,e:'O art. 1º do Código Penal estabelece que não há crime sem lei anterior que o defina, nem pena sem prévia cominação legal.',src:'Código Penal, art. 1º',url:'https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm'},{id:4,s:0,q:'Qual instituição é indispensável à administração da justiça nos termos do art. 133 da Constituição?',a:['A advocacia','O registro de imóveis','A junta comercial','O tribunal de contas'],ok:0,e:'A Constituição afirma a indispensabilidade do advogado à administração da justiça, nos limites da lei.',src:'Constituição Federal, art. 133',url:'https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'}];
const ethicsModules=[{"t":"Atividade da advocacia e mandato","ref":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Atividades privativas","Distinga representação processual de consultoria, assessoria e direção jurídicas. O bacharelado não substitui a inscrição profissional. A impetração de habeas corpus é expressamente excluída do rol de atividades privativas. Não generalize a exigência de advogado para todos os procedimentos: há exceções legais e constitucionais."],["Mandato e urgência","A procuração demonstra os poderes recebidos. Quando a urgência impede sua apresentação imediata, o profissional pode agir e regularizar a representação no prazo legal de quinze dias, prorrogável por igual período. Na renúncia, a assistência permanece por dez dias após a notificação, salvo substituição anterior."],["Aplicação prática","Em uma questão sobre prazo processual iminente, identifique urgência, regularização e prova da comunicação ao cliente. Renunciar não equivale a abandonar o processo. Compare o prazo de apresentação da procuração com o período de continuidade da representação."]],"map":["Atuação privativa → inscrição","Habeas corpus → exceção","Urgência → 15 + 15 dias","Renúncia → notificação + 10 dias"]},{"t":"Inscrição, inscrição suplementar e licenciamento","ref":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Ingresso profissional","A inscrição exige os requisitos do art. 8º, entre eles habilitação acadêmica, aprovação no Exame de Ordem, idoneidade moral, capacidade civil e ausência de atividade incompatível. O compromisso perante o Conselho também integra o procedimento."],["Inscrição principal e suplementar","A principal relaciona-se ao domicílio profissional. A atuação habitual em outra unidade federativa exige inscrição suplementar. Para esse efeito, habitualidade corresponde à intervenção judicial em mais de cinco causas por ano no território de outro Conselho."],["Licenciamento ou cancelamento","Licenciamento é afastamento temporário nas hipóteses legais; cancelamento encerra a inscrição. A atividade incompatível temporária é exemplo de licenciamento; incompatibilidade definitiva é hipótese de cancelamento. O número anterior não é restabelecido automaticamente em nova inscrição."]],"map":["Inscrição → requisitos cumulativos","Principal → domicílio profissional","Suplementar → mais de 5 causas/ano","Licença temporária ≠ cancelamento"]},{"t":"Direitos e prerrogativas profissionais","ref":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Independência e respeito","As funções de magistratura, Ministério Público e advocacia têm atribuições distintas, sem subordinação hierárquica entre elas. Prerrogativas protegem a atuação profissional e o direito de defesa, não constituindo imunidade para ilícitos."],["Acesso a investigações","O advogado pode consultar elementos documentados de investigação nas condições legais, inclusive sem procuração quando não há sigilo. Em autos sigilosos, exige-se mandato. Diligências em andamento e ainda não documentadas podem ter acesso delimitado nos termos do Estatuto."],["Inviolabilidade","O escritório e os instrumentos de trabalho recebem proteção vinculada à atividade profissional. Não é proteção absoluta: medidas judiciais excepcionais exigem os pressupostos e salvaguardas legais. Em provas, desconfie de alternativas que usem 'sempre' ou 'nunca' sem ressalvas."]],"map":["Prerrogativa → defesa","Sem sigilo → acesso nos limites legais","Sigilo → procuração","Inviolabilidade → proteção qualificada"]},{"t":"Sociedades de advogados e associação","ref":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Formas de organização","A advocacia admite sociedade de advogados e sociedade unipessoal. O registro constitutivo no Conselho Seccional competente confere personalidade jurídica. A finalidade é a prestação de serviços advocatícios, e não a organização de uma atividade mercantil genérica."],["Limites societários","Não se admite sócio que não seja advogado inscrito ou que esteja totalmente proibido de advogar, nem denominação de fantasia nas sociedades abrangidas pelo Estatuto. A organização deve respeitar os conflitos de interesse e as limitações territoriais de participação societária."],["Responsabilidade e associação","Além da sociedade, o sócio ou titular responde subsidiária e ilimitadamente por danos causados aos clientes no exercício da advocacia, sem prejuízo da responsabilidade disciplinar. Associação profissional sem vínculo de emprego é possível, mas deve atender aos requisitos legais; o nome do contrato não afasta uma relação empregatícia efetivamente caracterizada."]],"map":["Registro → Conselho Seccional","Objeto → advocacia","Sócio → advogado habilitado","Danos ao cliente → responsabilidade subsidiária"]},{"t":"Honorários advocatícios","ref":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Três modalidades","Honorários convencionados decorrem do acordo profissional; arbitrados são estabelecidos judicialmente nas hipóteses pertinentes; sucumbenciais resultam da derrota processual da parte adversa. Diferencie origem do crédito e titularidade. A sucumbência pertence ao advogado."],["Contratação e cobrança","A clareza do contrato reduz conflitos: delimite serviços, forma de remuneração e hipóteses de encerramento. A ação de cobrança tem prazo prescricional de cinco anos, com marcos iniciais definidos no art. 25. Não trate todos os casos como se contassem da assinatura do contrato."],["Substabelecimento","O substabelecimento com reserva mantém poderes no profissional originário. Em regra, o substabelecido não cobra honorários sem a intervenção do substabelecente. O art. 26 prevê exceção quando possui contrato celebrado com o cliente."]],"map":["Convencionados → contrato","Arbitrados → decisão judicial","Sucumbência → advogado","Cobrança → 5 anos"]},{"t":"Incompatibilidades e impedimentos","ref":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Distinção fundamental","A incompatibilidade exclui totalmente o exercício da advocacia enquanto presente a condição. O impedimento restringe determinadas atuações, sem necessariamente afastar o profissional de toda a advocacia. Primeiro classifique a atividade, depois identifique o alcance da restrição."],["Atividades incompatíveis","O Estatuto relaciona categorias como membros do Judiciário e titulares de serviços notariais e registrais. Há especificidades e decisões judiciais relevantes para certas categorias; consulte o texto consolidado e os precedentes aplicáveis antes de estender uma regra."],["Impedimento do servidor","O servidor público, quando abrangido pelo art. 30, I, não pode advogar contra a Fazenda Pública que o remunera ou à qual está vinculada a entidade empregadora. A exceção legal dos docentes de cursos jurídicos e as hipóteses de incompatibilidade merecem atenção."]],"map":["Incompatibilidade → proibição total","Impedimento → proibição parcial","Cargo temporário incompatível → licença","Servidor → observar Fazenda vinculada"]},{"t":"Relação com o cliente e conflitos de interesse","ref":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015","lessons":[["Confiança e informação","Explique riscos relevantes, alternativas e limites da estratégia profissional. A independência técnica não elimina o dever de informar. A contratação não é uma promessa de resultado."],["Conflitos de interesse","Profissionais da mesma sociedade não representam interesses opostos. Se um conflito superveniente não puder ser resolvido, é preciso escolher a representação a manter, renunciar às demais e preservar informações confidenciais."],["Encerramento e defesa","A revogação pelo cliente não elimina automaticamente os honorários devidos pelo trabalho. A defesa criminal é função de garantia processual, independentemente da opinião pessoal do advogado sobre a culpa. O profissional não deve deixar o cliente desamparado."]],"map":["Informar riscos → confiança","Interesses opostos → conflito","Renúncia → preservar sigilo","Defesa → garantias processuais"]},{"t":"Sigilo profissional e publicidade jurídica","ref":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015","lessons":[["Confidencialidade","O sigilo é dever profissional independentemente de pedido do cliente. Comunicações advogado-cliente são presumidamente confidenciais. A obrigação abrange também fatos conhecidos no exercício de funções da Ordem."],["Exceções","Circunstâncias excepcionais podem justificar a revelação, como defesa própria ou grave ameaça à vida e à honra. A análise exige necessidade e proporcionalidade. O advogado não é obrigado a depor sobre fatos sujeitos ao sigilo."],["Marketing jurídico","A publicidade é informativa, discreta e sóbria. O conteúdo jurídico pode ser divulgado em redes sociais e por meios permitidos, inclusive anúncios nas condições regulamentares. Captação indevida, mercantilização e promessa de resultado são incompatíveis com esse regime. Consulte também o Provimento 205/2021 e alterações vigentes."]],"map":["Sigilo → dever independente de pedido","Justa causa → exceção","Publicidade → informação","Captação e promessa → vedadas"],"extraUrl":"https://www.oab.org.br/leisnormas/legislacao/provimentos/205-2021"},{"t":"Infrações e sanções disciplinares","ref":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Identificação da infração","A questão exige enquadramento da conduta no Estatuto e identificação da consequência aplicável. Diferencie a infração disciplinar da responsabilidade civil e penal: podem coexistir. A falta de prestação de contas e a captação de causas, por exemplo, não são categorias equivalentes."],["Sistema de sanções","As quatro espécies são censura, suspensão, exclusão e multa. A censura pode ser convertida em advertência reservada quando presentes as condições legais. A suspensão restringe temporariamente o exercício profissional em todo o território nacional. A exclusão demanda requisitos próprios."],["Individualização e prescrição","Analise agravantes, atenuantes, reincidência e a natureza da conduta. A pretensão punitiva disciplinar prescreve em cinco anos contados da constatação oficial do fato, observadas interrupções e a prescrição intercorrente prevista no Estatuto. Não confunda prescrição disciplinar com cobrança de honorários."]],"map":["Conduta → art. 34","Sanção → arts. 35–39","Exclusão → quórum qualificado","Prescrição → art. 43"]},{"t":"Organização da OAB e processo disciplinar","ref":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm","lessons":[["Estrutura institucional","A OAB exerce serviço público com personalidade jurídica e forma federativa. Integram sua estrutura o Conselho Federal, os Conselhos Seccionais, as Subseções e as Caixas de Assistência. A Subseção é parte autônoma da Seccional, não um Conselho Federal local."],["Competência disciplinar","Em regra, o Conselho Seccional do território da infração exerce a competência disciplinar, com ressalva legal para faltas cometidas perante o Conselho Federal. O Tribunal de Ética e Disciplina exerce funções de julgamento conforme o Estatuto e os regulamentos."],["Garantias processuais","O processo pode começar de ofício ou por representação. O sigilo durante a tramitação protege as partes, sem eliminar acesso legal dos interessados e defensores. Observe contraditório, defesa, competência e recursos próprios. O sigilo não equivale a ausência de controle."]],"map":["Conselho Federal → âmbito nacional","Seccional → território","Subseção → parte autônoma","Disciplina → competência e defesa"]}];const ethicsQuestions=[{"id":1001,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Um advogado é chamado para uma medida urgente, sem procuração assinada. Qual a solução prevista no Estatuto?","a":["Nunca pode atuar","Pode atuar, regularizando o mandato em 15 dias, prorrogáveis por igual período","Tem 48 horas sem prorrogação","O mandato torna-se dispensável definitivamente"],"ok":1,"e":"A urgência permite a atuação inicial sem procuração, mas não elimina a obrigação de regularizá-la. O prazo consta do art. 5º, § 1º.","src":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1002,"s":0,"module":0,"topic":"Atividade da advocacia e mandato","difficulty":"Intermediária","q":"Após notificar o cliente sobre a renúncia, o advogado é substituído por outro profissional no quarto dia. O que ocorre?","a":["Deve continuar por dez dias mesmo substituído","Deve permanecer por trinta dias","Pode cessar a representação com a substituição anterior","A renúncia depende de homologação da OAB"],"ok":2,"e":"A continuidade de dez dias protege o cliente contra desamparo. A substituição anterior encerra essa obrigação, conforme art. 5º, § 3º.","src":"Estatuto, arts. 1º a 5º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1003,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Uma advogada inscrita em SP patrocina seis novas causas judiciais em MG no mesmo ano, em atuação habitual. O que deve providenciar?","a":["Inscrição suplementar em MG","Cancelamento obrigatório em SP","Apenas comunicação ao cliente","Novo Exame de Ordem"],"ok":0,"e":"O art. 10, § 2º, exige inscrição suplementar quando a intervenção judicial em outro território ultrapassa cinco causas anuais.","src":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1004,"s":0,"module":1,"topic":"Inscrição, inscrição suplementar e licenciamento","difficulty":"Intermediária","q":"Um advogado assume temporariamente atividade incompatível com a advocacia. Qual medida de inscrição é prevista?","a":["Inscrição suplementar","Transferência automática","Exclusão disciplinar","Licenciamento"],"ok":3,"e":"O licenciamento se aplica à incompatibilidade temporária (art. 12, II), diferentemente da incompatibilidade definitiva.","src":"Estatuto, arts. 8º a 12","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1005,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Em investigação sob sigilo, o advogado pretende exercer a prerrogativa de acesso do art. 7º, XIV. Que documento deve apresentar?","a":["Certidão de graduação","Procuração","Autorização de todos os investigados","Contrato de sociedade"],"ok":1,"e":"O art. 7º, § 10, exige procuração para o acesso previsto no inciso XIV quando os autos são sigilosos.","src":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1006,"s":0,"module":2,"topic":"Direitos e prerrogativas profissionais","difficulty":"Intermediária","q":"Um magistrado afirma ser superior hierárquico ao advogado em razão do cargo. Qual a resposta correta?","a":["É superior em qualquer audiência","É superior apenas em processo penal","Não há hierarquia entre magistrados, membros do MP e advogados","A hierarquia depende do tempo de inscrição"],"ok":2,"e":"O art. 6º rejeita essa subordinação hierárquica e exige respeito recíproco no exercício das funções.","src":"Estatuto, arts. 6º e 7º","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1007,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Dois advogados constituem sociedade exclusivamente para prestar serviços jurídicos. Onde se registra o ato constitutivo para adquirir personalidade jurídica?","a":["Junta Comercial","Cartório eleitoral","Conselho Seccional da OAB competente","Conselho Nacional de Justiça"],"ok":2,"e":"O registro profissional da sociedade é feito perante o Conselho Seccional da OAB competente, conforme art. 15, § 1º.","src":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1008,"s":0,"module":3,"topic":"Sociedades de advogados e associação","difficulty":"Intermediária","q":"Uma sociedade pretende admitir como sócio investidor alguém que não possui inscrição como advogado. A proposta é admissível?","a":["Sim, desde que não assine petições","Não, pela vedação do art. 16","Sim, se a participação for inferior a 10%","Sim, se o contrato for registrado em cartório"],"ok":1,"e":"O Estatuto veda a presença de sócio não inscrito como advogado nas sociedades de advocacia.","src":"Estatuto, arts. 15 a 17-B","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1009,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Em uma sentença que condena a parte vencida ao pagamento de honorários sucumbenciais, quem é titular dessa verba segundo o Estatuto?","a":["O advogado","O juiz","A parte vencedora exclusivamente","A OAB"],"ok":0,"e":"O art. 23 assegura ao advogado a titularidade dos honorários incluídos na condenação por sucumbência.","src":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1010,"s":0,"module":4,"topic":"Honorários advocatícios","difficulty":"Intermediária","q":"Em regra, qual o prazo de prescrição da ação de cobrança de honorários advocatícios?","a":["Um ano","Dois anos","Dez anos","Cinco anos"],"ok":3,"e":"O art. 25 estabelece cinco anos, com início variável segundo a hipótese legal.","src":"Estatuto, arts. 22 a 26","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1011,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Uma pessoa exerce atividade que a lei classifica expressamente como incompatível com a advocacia. Qual o alcance da restrição?","a":["Somente causas tributárias","Somente causas contra a União","Proibição parcial","Proibição total"],"ok":3,"e":"A distinção está no art. 27: incompatibilidade é proibição total; impedimento, parcial.","src":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1012,"s":0,"module":5,"topic":"Incompatibilidades e impedimentos","difficulty":"Intermediária","q":"Servidor público sujeito apenas ao art. 30, I, pretende advogar contra a Fazenda que o remunera. Pode fazê-lo?","a":["Sim, fora do horário de trabalho","Não, há impedimento nessa atuação","Sim, se cobrar honorários reduzidos","Não pode advogar em nenhuma hipótese"],"ok":1,"e":"A restrição desse dispositivo é parcial e incide contra a Fazenda que o remunera ou à qual se vincula a entidade empregadora.","src":"Estatuto, arts. 27 a 30","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1013,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"Dois clientes do mesmo advogado passam a ter interesses opostos e o conflito não pode ser harmonizado. Qual conduta é adequada?","a":["Representar ambos até a sentença","Revelar as confidências de ambos","Escolher um mandato, renunciar aos demais e preservar o sigilo","Entregar os processos ao cliente adversário"],"ok":2,"e":"O art. 20 do Código de Ética orienta a escolha prudente de um mandato e a renúncia aos demais, com preservação do sigilo.","src":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1014,"s":0,"module":6,"topic":"Relação com o cliente e conflitos de interesse","difficulty":"Intermediária","q":"A revogação do mandato pelo cliente extingue automaticamente a obrigação de pagar os honorários contratados?","a":["Sim, em qualquer hipótese","Não; devem ser observados os honorários devidos","Sim, se ocorrer antes da sentença","Sim, se não houver sucumbência"],"ok":1,"e":"O art. 17 do Código de Ética preserva o direito aos honorários contratados e à sucumbência eventualmente devida na proporção pertinente.","src":"Código de Ética, arts. 9º a 26","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1015,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Um cliente contou um fato confidencial, sem pedir expressamente segredo. O advogado pode divulgá-lo livremente?","a":["Sim, por não haver pedido","Não; o sigilo independe de solicitação","Sim, após o fim do contrato","Sim, se omitir o nome em qualquer circunstância"],"ok":1,"e":"O art. 36 do Código de Ética estabelece o sigilo independentemente de solicitação do cliente.","src":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1016,"s":0,"module":7,"topic":"Sigilo profissional e publicidade jurídica","difficulty":"Intermediária","q":"Uma advogada publica conteúdo informativo em rede social e deseja contratar anúncio dentro dos limites regulamentares. Qual afirmação é correta?","a":["Todo anúncio pago é proibido","Pode prometer resultados para captar clientes","A publicidade informativa pode ser admitida, sem captação indevida ou mercantilização","Qualquer anúncio permite divulgar êxitos como garantia"],"ok":2,"e":"O Provimento 205/2021 admite publicidade e marketing de conteúdo observados os limites éticos e os meios permitidos.","src":"Código de Ética, arts. 35 a 40; Provimento 205/2021","url":"https://www.oab.org.br/leisnormas/legislacao/resolucoes/02-2015"},{"id":1017,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Qual alternativa reúne as quatro espécies de sanção disciplinar do Estatuto?","a":["Advertência, prisão, multa e cassação","Censura, suspensão, exclusão e multa","Censura, detenção, exclusão e indenização","Suspensão, interdição civil, advertência e prisão"],"ok":1,"e":"O art. 35 enumera censura, suspensão, exclusão e multa. Advertência reservada pode resultar da conversão da censura em condições específicas.","src":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1018,"s":0,"module":8,"topic":"Infrações e sanções disciplinares","difficulty":"Intermediária","q":"Qual quórum é exigido pelo Estatuto para aplicação da sanção de exclusão?","a":["Maioria simples dos presentes","Unanimidade nacional","Um terço da Subseção","Manifestação favorável de dois terços dos membros do Conselho Seccional competente"],"ok":3,"e":"O art. 38, parágrafo único, prevê o quórum de dois terços dos membros do Conselho Seccional competente.","src":"Estatuto, arts. 34 a 43","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1019,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Quais são os órgãos previstos na estrutura da OAB pelo art. 45?","a":["Conselho Federal, Conselhos Seccionais, Subseções e Caixas de Assistência","STF, CNJ, OAB e Defensoria","Juntas comerciais, cartórios e conselhos fiscais","Apenas Conselho Federal e Tribunais de Ética"],"ok":0,"e":"O art. 45 identifica os quatro órgãos da estrutura da OAB.","src":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"},{"id":1020,"s":0,"module":9,"topic":"Organização da OAB e processo disciplinar","difficulty":"Intermediária","q":"Em regra, o processo disciplinar da OAB tramita de que maneira até seu término?","a":["Sempre aberto a qualquer pessoa","Sem defesa técnica","Em sigilo, com acesso nas hipóteses legais","Exclusivamente em juízo criminal"],"ok":2,"e":"O art. 72, § 2º, do Estatuto prevê sigilo até o término, com acesso às partes, defensores e autoridade judiciária competente.","src":"Estatuto, arts. 44 a 45, 51, 70 a 74","url":"https://www.planalto.gov.br/ccivil_03/leis/l8906.htm"}];const constitutionalModules=[{"t":"Teoria constitucional e poder constituinte","ref":"CF, arts. 1º a 4º e 60","lessons":[["Fundamentos e objetivos","Os fundamentos definem bases da ordem constitucional; os objetivos indicam fins a perseguir. Cidadania, dignidade e pluralismo pertencem ao primeiro grupo. Reduzir desigualdades é objetivo. Identifique a categoria antes de responder; não confunda princípios das relações internacionais com objetivos internos."],["Poder constituinte","O poder originário institui uma nova ordem; o derivado atua dentro da Constituição, sujeito a limites. A reforma constitucional exige procedimento agravado. A proposta deve ser aprovada em dois turnos em cada Casa do Congresso, por três quintos dos respectivos membros."],["Limites à reforma","O núcleo protegido pelo art. 60, § 4º, impede propostas tendentes a abolir federação, voto direto, secreto, universal e periódico, separação de poderes e direitos e garantias individuais. Não se pode emendar a Constituição durante intervenção federal, estado de defesa ou estado de sítio."]],"map":["Fundamentos ≠ objetivos","Reforma → 2 turnos por Casa","Aprovação → 3/5 dos membros","Cláusulas pétreas → proteção contra abolição"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Direitos e garantias fundamentais","ref":"CF, art. 5º","lessons":[["Liberdades e igualdade","A igualdade constitucional veda discriminações arbitrárias e permite distinções justificadas. A liberdade de manifestação não torna lícitas todas as condutas; responsabilização ulterior e tutela de outros direitos podem ocorrer. A proibição de anonimato não impede por si só mecanismos lícitos de proteção de identidade."],["Casa e comunicações","A proteção do domicílio abrange espaços privados nos limites jurídicos aplicáveis. Sem consentimento, entrada é admitida em flagrante, desastre, socorro ou, durante o dia, por ordem judicial. Diferencie essas hipóteses da interceptação de comunicações telefônicas, que tem requisitos próprios."],["Garantias processuais","Devido processo, contraditório, ampla defesa e presunção de inocência limitam o poder estatal. Provas ilícitas são inadmissíveis. Em questões, diferencie prisão cautelar justificada de antecipação indevida de pena e considere as particularidades da jurisprudência aplicável."]],"map":["Igualdade → justificativa de distinções","Domicílio → exceções delimitadas","Defesa → contraditório","Prova ilícita → inadmissibilidade"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Remédios constitucionais","ref":"CF, art. 5º, LXVIII a LXXIII","lessons":[["Habeas corpus e habeas data","Habeas corpus tutela a liberdade de locomoção diante de ilegalidade ou abuso. Habeas data permite acessar ou retificar dados pessoais em registros governamentais ou de caráter público, observados os requisitos legais. Não é instrumento genérico de acesso a dados de terceiros."],["Mandado de segurança e injunção","Mandado de segurança protege direito líquido e certo não amparado por habeas corpus ou habeas data, contra ilegalidade ou abuso de autoridade. A prova deve ser pré-constituída. Mandado de injunção enfrenta omissão normativa que inviabiliza o exercício de direitos e prerrogativas constitucionais pertinentes."],["Ação popular","A cidadania legitima a ação popular para invalidar ato lesivo ao patrimônio público, moralidade administrativa, meio ambiente ou patrimônio histórico e cultural. A isenção de custas e sucumbência ressalva má-fé comprovada. Distinga o cidadão dos legitimados de outras ações coletivas."]],"map":["HC → locomoção","HD → dados pessoais","MS → direito líquido e certo","MI → omissão normativa"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Nacionalidade e direitos políticos","ref":"CF, arts. 12 a 17","lessons":[["Nacionalidade","Diferencie brasileiros natos e naturalizados pelas hipóteses constitucionais. Certos cargos são reservados a natos, como Presidente da República e Ministro do STF. Não confunda nacionalidade com cidadania eleitoral. A perda de nacionalidade deve ser estudada conforme a redação constitucional atual, inclusive EC 131/2023."],["Alistamento e voto","O voto é obrigatório para alfabetizados maiores de dezoito anos, ressalvado o regime facultativo para maiores de setenta; também é facultativo para analfabetos e pessoas de dezesseis a dezoito anos. Estrangeiros e conscritos durante o serviço militar obrigatório não podem se alistar."],["Elegibilidade","Nacionalidade, direitos políticos, alistamento, domicílio eleitoral, filiação e idade mínima compõem os requisitos constitucionais. Analfabetos podem votar, mas são inelegíveis. Reeleição e inelegibilidades seguem regras específicas; identifique o cargo e a situação familiar ou funcional."]],"map":["Nacionalidade ≠ elegibilidade","Voto facultativo → hipóteses do art. 14","Analfabeto → inelegível","STF → cargo privativo de nato"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Federação e repartição de competências","ref":"CF, arts. 18 a 36","lessons":[["Entes federativos","União, Estados, Distrito Federal e Municípios possuem autonomia nos termos constitucionais. A soberania pertence à República Federativa do Brasil. O Distrito Federal acumula competências legislativas estaduais e municipais e não se divide em municípios."],["Competências legislativas","A União tem competências privativas enumeradas no art. 22; lei complementar pode autorizar Estados a legislar sobre questões específicas dessas matérias. Em competência concorrente, a União estabelece normas gerais, e os Estados suplementam. Na falta de norma geral federal, podem exercer competência plena nas condições constitucionais."],["Competências comuns e locais","Competência administrativa comum não equivale a competência legislativa concorrente. Municípios legislam sobre interesse local e suplementam legislação federal e estadual quando couber. A intervenção é excepcional e exige hipótese constitucional específica."]],"map":["Federação → autonomia","Art. 22 → competência privativa","Art. 24 → concorrente","Art. 30 → interesse local"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Administração pública constitucional","ref":"CF, arts. 37 a 41","lessons":[["Princípios administrativos","Legalidade, impessoalidade, moralidade, publicidade e eficiência orientam a administração direta e indireta. Publicidade não elimina proteção legal de informações sigilosas. Impessoalidade impede promoção pessoal em publicidade institucional."],["Ingresso e estabilidade","A investidura em cargo ou emprego público depende, em regra, de concurso; cargos em comissão legalmente definidos admitem livre nomeação e exoneração. Estabilidade é instituto distinto da aprovação: aplica-se aos servidores nomeados para cargo efetivo por concurso após três anos de efetivo exercício, com avaliação especial de desempenho."],["Responsabilidade estatal","Pessoas jurídicas de direito público e prestadoras de serviço público de direito privado respondem por danos causados por seus agentes nessa qualidade, conforme art. 37, § 6º. A ação regressiva exige dolo ou culpa. Identifique nexo causal e circunstâncias concretas; não trate toda omissão como caso idêntico."]],"map":["LIMPE → princípios","Concurso → regra","Estabilidade → requisitos do art. 41","Regresso → dolo ou culpa"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Poder Legislativo e processo legislativo","ref":"CF, arts. 44 a 69","lessons":[["Estrutura e funções","Congresso Nacional reúne Câmara e Senado; a Câmara representa o povo, e o Senado representa Estados e Distrito Federal. Fiscalização e produção legislativa são funções centrais. CPIs têm poderes de investigação próprios de autoridades judiciais, mas não todos os poderes de um juiz."],["Espécies normativas","Lei ordinária e complementar possuem regimes de aprovação distintos; a lei complementar exige maioria absoluta. Emendas não passam por sanção presidencial. Iniciativa reservada, deliberação, sanção ou veto e promulgação dependem da espécie normativa."],["Medidas provisórias","São editadas pelo Presidente em situações de relevância e urgência, com força de lei e submissão ao Congresso. O prazo geral é de sessenta dias, prorrogável uma vez por igual período, observadas regras constitucionais. Há matérias vedadas, como direito penal e processual penal."]],"map":["Câmara → povo","Senado → Estados e DF","LC → maioria absoluta","MP → urgência e relevância"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Executivo e responsabilidade constitucional","ref":"CF, arts. 76 a 91","lessons":[["Presidencialismo","O Presidente acumula funções de chefia de Estado e de governo. Ministros auxiliam o Executivo. Competências privativas estão no art. 84; apenas hipóteses constitucionalmente indicadas podem ser delegadas nos limites ali previstos."],["Substituição e sucessão","O Vice substitui o Presidente nos impedimentos e o sucede em caso de vaga. Na ausência de ambos, o exercício segue a ordem constitucional: presidências da Câmara, Senado e STF. A dupla vacância tem regimes de eleição distintos conforme o momento do mandato."],["Responsabilização","Crimes de responsabilidade não se confundem com infrações penais comuns. A Câmara tem competência de autorização nos termos constitucionais; o julgamento depende da natureza da infração. Não confunda aprovação política inicial com condenação final."]],"map":["Presidente → chefia de Estado e governo","Vice → substituição e sucessão","Dupla vacância → art. 81","Responsabilização → distinguir natureza"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Judiciário e funções essenciais à justiça","ref":"CF, arts. 92 a 135","lessons":[["Organização judicial","Identifique órgãos do Judiciário e respectivas competências. O STF guarda a Constituição; o STJ tem competência relevante na uniformização do direito federal infraconstitucional. A competência de cada recurso depende dos requisitos constitucionais e legais, não apenas do nome da questão."],["Garantias e controle","Vitaliciedade, inamovibilidade e irredutibilidade de subsídio possuem regimes constitucionais específicos. O CNJ integra o Judiciário e controla aspectos administrativos, financeiros e disciplinares nos limites constitucionais. Não funciona como instância recursal genérica de decisões jurisdicionais."],["Funções essenciais","Ministério Público, advocacia pública, advocacia e Defensoria Pública possuem regimes distintos. O MP defende ordem jurídica, regime democrático e interesses sociais e individuais indisponíveis. A Defensoria presta orientação e defesa jurídica aos necessitados conforme a Constituição."]],"map":["STF → Constituição","STJ → direito federal infraconstitucional","CNJ → controle administrativo","Defensoria → acesso à justiça"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Controle de constitucionalidade","ref":"CF, arts. 97, 102 e 103; SV 10","lessons":[["Difuso e concentrado","No controle difuso, a constitucionalidade pode surgir como questão incidental em litígio concreto. No concentrado, ações próprias discutem a validade constitucional conforme objeto e legitimidade definidos. Não presuma que todos os efeitos são idênticos: observe o tipo de ação e o pronunciamento."],["Ações constitucionais","ADI e ADC no STF têm objetos específicos definidos pelo art. 102. A ADC federal trata de lei ou ato normativo federal; a ADI federal pode ter objeto federal ou estadual. A ADPF e a ADO possuem finalidades e requisitos próprios. O art. 103 enumera legitimados para ADI e ADC."],["Reserva de plenário","Nos tribunais, a declaração de inconstitucionalidade exige maioria absoluta dos membros ou do órgão especial. A SV 10 alcança afastamento de norma por órgão fracionário com fundamento constitucional, mesmo sem declaração expressa, observadas exceções legais e jurisprudenciais. Não se aplica essa exigência colegiada indistintamente ao juiz singular."]],"map":["Difuso → caso concreto","ADI → ato federal ou estadual","ADC → ato federal","Reserva de plenário → maioria absoluta"],"url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const constitutionalQuestions=[{"id":2001,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Uma PEC foi aprovada por três quintos em dois turnos na Câmara e por maioria simples em dois turnos no Senado. Pode ser promulgada?","a":["Sim, pois a Câmara atingiu o quórum","Não, o Senado também precisa de três quintos em cada turno","Sim, com sanção presidencial","Sim, se houver consulta popular"],"ok":1,"e":"O art. 60, § 2º, exige três quintos dos membros de cada Casa em ambos os turnos.","src":"CF, arts. 1º a 4º e 60","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2002,"s":1,"module":0,"topic":"Teoria constitucional e poder constituinte","difficulty":"Intermediária","q":"Durante intervenção federal, o Congresso pretende aprovar uma emenda constitucional. Qual o obstáculo?","a":["Apenas a ausência de sanção presidencial","Necessidade de autorização do STF","A Constituição não pode ser emendada durante a intervenção","Nenhum, se a votação for unânime"],"ok":2,"e":"O art. 60, § 1º, prevê limite circunstancial durante intervenção federal, estado de defesa ou de sítio.","src":"CF, arts. 1º a 4º e 60","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2003,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Sem consentimento do morador e fora das hipóteses de flagrante, desastre ou socorro, quando a ordem judicial permite ingresso em casa?","a":["Em qualquer horário","Somente à noite","Apenas em feriado","Durante o dia"],"ok":3,"e":"O art. 5º, XI, limita o ingresso baseado em determinação judicial ao período diurno.","src":"CF, art. 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2004,"s":1,"module":1,"topic":"Direitos e garantias fundamentais","difficulty":"Intermediária","q":"Um servidor responde a processo administrativo sancionador sem oportunidade de apresentar defesa. Qual garantia está diretamente afetada?","a":["Contraditório e ampla defesa","Livre iniciativa","Anterioridade tributária","Imunidade parlamentar"],"ok":0,"e":"O art. 5º, LV, estende contraditório e ampla defesa aos litigantes em processos judiciais e administrativos e aos acusados.","src":"CF, art. 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2005,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"Uma pessoa sofre ameaça ilegal de prisão. Qual remédio é diretamente vocacionado à proteção da locomoção?","a":["Habeas data","Mandado de injunção","Habeas corpus","Ação popular"],"ok":2,"e":"A finalidade constitucional do habeas corpus consta do art. 5º, LXVIII.","src":"CF, art. 5º, LXVIII a LXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2006,"s":1,"module":2,"topic":"Remédios constitucionais","difficulty":"Intermediária","q":"A ausência de norma regulamentadora impede o exercício de uma prerrogativa constitucional ligada à cidadania. Qual instrumento é especialmente previsto?","a":["Mandado de injunção","Habeas corpus","Ação de cobrança","Habeas data"],"ok":0,"e":"O art. 5º, LXXI, prevê mandado de injunção diante da omissão regulamentadora impeditiva.","src":"CF, art. 5º, LXVIII a LXXIII","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2007,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Uma cidadã brasileira naturalizada pretende ocupar o cargo de Ministra do STF. É constitucionalmente possível?","a":["Sim, após dez anos de naturalização","Não, é cargo privativo de brasileiro nato","Sim, se indicada pelo Senado","Sim, desde que tenha outro cargo público"],"ok":1,"e":"O art. 12, § 3º, IV, reserva o cargo de Ministro do STF a brasileiros natos.","src":"CF, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2008,"s":1,"module":3,"topic":"Nacionalidade e direitos políticos","difficulty":"Intermediária","q":"Um cidadão analfabeto regularmente alistado pretende concorrer a vereador. Qual regra se aplica?","a":["Pode concorrer, pois pode votar","Não pode votar nem concorrer","Pode concorrer com autorização judicial","Pode votar facultativamente, mas é inelegível"],"ok":3,"e":"O art. 14, §§ 1º e 4º, distingue voto facultativo e inelegibilidade dos analfabetos.","src":"CF, arts. 12 a 17","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2009,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Um Município quer legislar sobre assunto predominantemente de interesse local. Qual fundamento constitucional?","a":["Art. 30, I","Art. 22, I","Art. 60, § 4º","Art. 102, I"],"ok":0,"e":"O art. 30, I, atribui aos Municípios competência para legislar sobre interesse local.","src":"CF, arts. 18 a 36","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2010,"s":1,"module":4,"topic":"Federação e repartição de competências","difficulty":"Intermediária","q":"Em matéria concorrente, sobrevém norma geral federal incompatível com disposição estadual anterior. Qual efeito constitucional?","a":["Revoga integralmente toda a lei estadual","Anula automaticamente a Constituição estadual","Suspende a eficácia da lei estadual no que lhe for contrário","Não produz qualquer efeito"],"ok":2,"e":"O art. 24, § 4º, estabelece suspensão da eficácia da norma estadual incompatível com a norma geral federal superveniente.","src":"CF, arts. 18 a 36","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2011,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Publicidade institucional destaca nome e imagem de autoridade para promoção pessoal. Qual princípio é diretamente comprometido?","a":["Soberania","Impessoalidade","Livre concorrência","Anterioridade"],"ok":1,"e":"O art. 37, § 1º, veda promoção pessoal em publicidade de órgãos públicos.","src":"CF, arts. 37 a 41","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2012,"s":1,"module":5,"topic":"Administração pública constitucional","difficulty":"Intermediária","q":"Após indenizar terceiro por dano provocado por agente público, em que condição constitucional cabe regresso contra o agente?","a":["Sempre, sem examinar conduta","Somente por decisão criminal","Somente se o terceiro concordar","Nos casos de dolo ou culpa"],"ok":3,"e":"O art. 37, § 6º, assegura direito de regresso em caso de dolo ou culpa.","src":"CF, arts. 37 a 41","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2013,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"Qual quórum a Constituição exige para aprovação de lei complementar?","a":["Maioria absoluta","Três quintos em dois turnos","Dois terços","Unanimidade"],"ok":0,"e":"O art. 69 exige maioria absoluta para lei complementar.","src":"CF, arts. 44 a 69","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2014,"s":1,"module":6,"topic":"Poder Legislativo e processo legislativo","difficulty":"Intermediária","q":"O Presidente pretende disciplinar crimes e penas por medida provisória. É admissível?","a":["Sim, se houver urgência","Sim, com autorização judicial","Não, a matéria penal é vedada a medidas provisórias","Sim, se durar menos de sessenta dias"],"ok":2,"e":"O art. 62, § 1º, I, b, proíbe medida provisória sobre direito penal, processual penal e processual civil.","src":"CF, arts. 44 a 69","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2015,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"O Presidente sofre impedimento temporário e o Vice está disponível. Quem o substitui?","a":["Presidente do STF","Vice-Presidente","Presidente do Senado","Ministro da Justiça"],"ok":1,"e":"O art. 79 prevê substituição pelo Vice nos impedimentos e sucessão em caso de vaga.","src":"CF, arts. 76 a 91","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2016,"s":1,"module":7,"topic":"Executivo e responsabilidade constitucional","difficulty":"Intermediária","q":"Em caso de dupla vacância dos cargos de Presidente e Vice nos primeiros dois anos do mandato, qual regra geral constitucional?","a":["Nomeação definitiva pelo STF","Eleição indireta em trinta dias pelo Congresso","Manutenção automática do Presidente da Câmara até o fim","Eleição em noventa dias após aberta a última vaga"],"ok":3,"e":"O art. 81 prevê eleição em noventa dias; nos últimos dois anos, aplica-se o regime de eleição pelo Congresso em trinta dias.","src":"CF, arts. 76 a 91","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2017,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Uma parte pretende usar o CNJ como instância recursal comum para reformar sentença judicial de mérito. É essa a sua função?","a":["Sim, em qualquer processo","Sim, se a decisão for estadual","Não, seu controle tem natureza administrativa, financeira e disciplinar nos limites constitucionais","Sim, quando não houver advogado"],"ok":2,"e":"O art. 103-B, § 4º, delimita a competência do CNJ; não o torna instância jurisdicional recursal comum.","src":"CF, arts. 92 a 135","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2018,"s":1,"module":8,"topic":"Judiciário e funções essenciais à justiça","difficulty":"Intermediária","q":"Qual órgão é especialmente incumbido da guarda da Constituição pelo art. 102?","a":["Supremo Tribunal Federal","Superior Tribunal de Justiça","Tribunal Superior Eleitoral","Conselho Nacional de Justiça"],"ok":0,"e":"O art. 102 atribui precipuamente ao STF a guarda da Constituição.","src":"CF, arts. 92 a 135","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2019,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Uma lei estadual é objeto de ADC ajuizada diretamente no STF. Qual problema há quanto ao objeto?","a":["ADC só pode tratar de lei municipal","ADC exige lei ou ato normativo federal","ADC só admite emenda constitucional","ADC não existe na ordem constitucional"],"ok":1,"e":"O art. 102, I, a, restringe a ADC no STF a lei ou ato normativo federal.","src":"CF, arts. 97, 102 e 103; SV 10","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":2020,"s":1,"module":9,"topic":"Controle de constitucionalidade","difficulty":"Intermediária","q":"Um órgão fracionário de tribunal pretende declarar lei inconstitucional sem precedente aplicável nem submissão ao plenário ou órgão especial. Qual regra deve observar?","a":["Apenas unanimidade dos integrantes da turma","Autorização da parte autora","Sanção do Presidente da República","Reserva de plenário do art. 97"],"ok":3,"e":"O art. 97 exige maioria absoluta dos membros do tribunal ou órgão especial; a SV 10 impede contornar a regra pelo afastamento de norma por fundamento de inconstitucionalidade.","src":"CF, arts. 97, 102 e 103; SV 10","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const civilModules=[{"t":"Pessoas naturais, capacidade e personalidade","ref":"CC, arts. 1º a 21","lessons":[["Personalidade e capacidade","A personalidade civil começa com o nascimento com vida, sem prejuízo da proteção jurídica do nascituro desde a concepção. Capacidade de direito é a aptidão para titularizar direitos e deveres; capacidade de exercício é a aptidão para praticar atos pessoalmente. Um recém-nascido pode receber patrimônio, embora necessite de representação."],["Incapacidade e emancipação","Menores de 16 anos são absolutamente incapazes; entre 16 e 18 anos, a incapacidade é relativa. O representante atua em nome do absolutamente incapaz, enquanto o assistente complementa a manifestação do relativamente incapaz. A emancipação antecipa a capacidade civil, não a idade exigida por regimes como o penal."],["Direitos da personalidade","Nome, imagem, honra e integridade recebem proteção específica. O uso indevido de imagem pode ensejar medidas preventivas e reparação. A análise deve considerar finalidade, consentimento, interesse público e proteção constitucional da liberdade de expressão."]],"map":["Nascimento com vida → personalidade","Menor de 16 → representação","16 a 18 → assistência, salvo emancipação","Personalidade → tutela preventiva e reparatória"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Pessoas jurídicas, bens e domicílio","ref":"CC, arts. 40 a 103","lessons":[["Pessoa jurídica e autonomia","A constituição de pessoa jurídica privada depende, em regra, do registro do ato constitutivo. Seu patrimônio não se confunde automaticamente com o de seus integrantes. A desconsideração, nos termos do art. 50, exige abuso caracterizado por desvio de finalidade ou confusão patrimonial; mero inadimplemento não basta nesse regime."],["Domicílio","O domicílio da pessoa natural combina residência e intenção de permanência. Havendo várias residências alternadas, qualquer delas pode ser domicílio. Domicílio profissional e necessário obedecem a regras próprias. Identifique a finalidade da relação jurídica antes de escolher o conceito aplicável."],["Classificação de bens","Bens móveis e imóveis seguem regras diferentes de circulação. Bens fungíveis podem ser substituídos por equivalentes da mesma espécie, qualidade e quantidade. A distinção entre bens públicos e particulares influencia alienação e aquisição: bens públicos não são usucapíveis."]],"map":["Registro → existência legal","Autonomia patrimonial → regra","Abuso → possível desconsideração","Bem público → sem usucapião"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Negócio jurídico, defeitos e invalidade","ref":"CC, arts. 104 a 184","lessons":[["Existência e validade","Para a validade do negócio, examine capacidade do agente, licitude e possibilidade do objeto, sua determinação ou determinabilidade, além da forma exigida. A liberdade de forma é a regra, mas negócios específicos exigem solenidades. Não confunda validade com eficácia perante terceiros."],["Vícios da vontade","Erro substancial, dolo, coação, estado de perigo e lesão podem levar à anulabilidade, conforme seus pressupostos. Um erro de cálculo pode ser corrigido sem anular o negócio. Fraude contra credores protege o patrimônio que responde por obrigações e tem requisitos próprios."],["Nulidade e anulabilidade","A simulação é causa de nulidade; a incapacidade relativa e determinados vícios podem causar anulabilidade. Negócio nulo não se confirma pelo decurso do tempo. O anulável pode ser confirmado nos limites legais e exige observância do prazo decadencial correspondente."]],"map":["Validade → agente, objeto e forma","Vício de vontade → analisar requisitos","Simulação → nulidade","Anulabilidade → prazo e confirmação"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Prescrição e decadência","ref":"CC, arts. 189 a 211","lessons":[["Pretensão e prazo","A violação do direito faz nascer a pretensão, sujeita à prescrição. O prazo geral do art. 205 é de dez anos quando não houver prazo menor previsto em lei. Antes de aplicá-lo, identifique a natureza da pretensão e procure a regra especial."],["Impedimento, suspensão e interrupção","Impedimento evita o início; suspensão paralisa a contagem; interrupção reinicia o prazo nos termos legais. O art. 202 limita a interrupção da prescrição a uma vez. Em provas, construa uma linha do tempo com nascimento da pretensão e fatos modificadores da contagem."],["Decadência","A decadência incide sobre direitos potestativos sujeitos a prazo. A legal não pode ser renunciada e deve ser conhecida de ofício pelo juiz; a convencional segue regime diferente. Salvo previsão legal, as causas que impedem, suspendem ou interrompem a prescrição não se aplicam à decadência."]],"map":["Violação → pretensão","Prazo geral → 10 anos","Interrupção → uma vez","Decadência legal → conhecimento de ofício"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Obrigações, pagamento e inadimplemento","ref":"CC, arts. 233 a 420","lessons":[["Modalidades e solidariedade","Obrigações de dar, fazer e não fazer distinguem-se pelo objeto da prestação. A solidariedade permite exigir o todo de um dos devedores solidários, mas não se presume: decorre da lei ou da vontade das partes. Indivisibilidade relaciona-se à prestação e não se confunde com solidariedade."],["Adimplemento e extinção","Pagamento regular exige prestação devida ao credor ou a quem legitimamente o represente. Consignação pode liberar o devedor nos casos legais, como recusa injustificada de recebimento. Novação exige obrigação nova e intenção de novar; compensação e remissão possuem pressupostos distintos."],["Mora e perdas e danos","Distinga atraso ainda útil ao credor de inadimplemento que torna a prestação inútil. Perdas e danos exigem exame do prejuízo e nexo. A Lei 14.905/2024 alterou regras de juros legais e atualização monetária; não adote automaticamente a antiga referência de 1% ao mês."]],"map":["Dar, fazer ou não fazer → prestação","Solidariedade → lei ou acordo","Consignação → hipóteses legais","Mora → atraso juridicamente relevante"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","extraUrl":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2024/lei/l14905.htm"},{"t":"Contratos: princípios e espécies","ref":"CC, arts. 421 a 480, 481 a 853","lessons":[["Autonomia e boa-fé","A liberdade contratual é exercida nos limites da função social. A boa-fé objetiva exige comportamento leal na formação e execução do contrato, inclusive deveres de informação e cooperação. A revisão contratual deve respeitar os requisitos do regime aplicável, não qualquer insatisfação econômica."],["Contratos bilaterais e resolução","Em contratos bilaterais, a parte que ainda não cumpriu sua obrigação não pode, em regra, exigir a contraprestação. A resolução por inadimplemento e a revisão por onerosidade excessiva têm fundamentos próprios. Analise a distribuição de riscos, a reciprocidade e os requisitos legais."],["Espécies contratuais","Compra e venda obriga transferir domínio mediante preço; o contrato não transfere sozinho a propriedade imobiliária. Comodato é empréstimo gratuito de coisa não fungível; mútuo envolve coisas fungíveis. Mandato atribui poderes para praticar atos em nome de outrem."]],"map":["Boa-fé → lealdade","Função social → limite","Comodato → coisa não fungível","Mútuo → coisa fungível"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Responsabilidade civil","ref":"CC, arts. 186 a 188 e 927 a 954","lessons":[["Elementos da responsabilidade","Identifique conduta, dano e nexo causal, além da culpa quando o regime for subjetivo. A responsabilidade objetiva dispensa prova da culpa, mas não elimina a necessidade de verificar os demais pressupostos. Abuso de direito pode constituir ato ilícito."],["Regimes de imputação","O art. 927 admite responsabilidade sem culpa em hipóteses legais ou quando a atividade normalmente desenvolvida implique risco por sua natureza para direitos de terceiros. Há hipóteses de responsabilidade por fato de outra pessoa, como a do empregador por atos do empregado no exercício do trabalho ou em razão dele."],["Reparação e excludentes","A indenização é medida pela extensão do dano, com exceções legais. Culpa concorrente da vítima pode influenciar o valor. Caso fortuito, força maior e fato exclusivo de terceiro exigem análise do nexo e do risco assumido; não excluem automaticamente responsabilidade em todos os regimes."]],"map":["Conduta + dano + nexo","Subjetiva → culpa","Objetiva → hipóteses legais ou risco","Indenização → extensão do dano"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Posse, propriedade e direitos reais","ref":"CC, arts. 1.196 a 1.510-E","lessons":[["Posse e detenção","Possuidor exerce de fato algum dos poderes inerentes à propriedade. Detentor conserva a posse em nome de outro sob dependência, nos termos legais. Posse direta e indireta podem coexistir, como no exemplo do locatário e locador; posse e propriedade não são sinônimos."],["Proteção e aquisição","Manutenção tutela a posse contra turbação; reintegração responde ao esbulho; interdito proibitório protege diante de ameaça. A usucapião exige requisitos da modalidade escolhida, incluindo tempo e características da posse. Não se presume aquisição pelo simples decurso temporal."],["Propriedade e direitos reais limitados","Na transferência imobiliária entre vivos, o registro do título translativo é essencial à aquisição do domínio. Usufruto separa poderes de uso e fruição da nua-propriedade. Servidão beneficia imóvel dominante, e direitos reais de garantia possuem regimes próprios."]],"map":["Posse ≠ propriedade","Turbação → manutenção","Esbulho → reintegração","Imóvel entre vivos → registro"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Direito de família","ref":"CC, arts. 1.511 a 1.783-A","lessons":[["Casamento e regimes patrimoniais","Na ausência de convenção válida e de hipótese de regime obrigatório, aplica-se a comunhão parcial. Em regra, comunicam-se bens adquiridos onerosamente durante o casamento, com exclusões legais, como bens anteriores e determinados bens recebidos por doação ou sucessão."],["União estável e filiação","A união estável exige convivência pública, contínua e duradoura, estabelecida com objetivo de constituição de família; não há prazo mínimo geral no Código Civil. O reconhecimento de uniões homoafetivas decorre da interpretação constitucional do STF. Filhos têm igualdade de direitos independentemente da origem da filiação."],["Alimentos e poder familiar","Alimentos são fixados considerando necessidades do reclamante e recursos da pessoa obrigada, com proporcionalidade. Alterações relevantes podem fundamentar revisão. Poder familiar envolve responsabilidades parentais; a guarda deve considerar a proteção da criança e as regras atuais, inclusive hipóteses de risco de violência doméstica."]],"map":["Regime supletivo → comunhão parcial","União estável → objetivo familiar","Filiação → igualdade","Alimentos → necessidade e possibilidade"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Direito das sucessões","ref":"CC, arts. 1.784 a 2.027","lessons":[["Abertura e transmissão","A morte abre a sucessão e transmite desde logo a herança aos herdeiros legítimos e testamentários. Até a partilha, a herança é tratada como unidade indivisível. Aceitação e renúncia possuem formas e efeitos próprios; a renúncia exige escritura pública ou termo judicial."],["Vocação hereditária e legítima","A ordem de vocação hereditária considera descendentes, ascendentes, cônjuge e colaterais, com regras de concorrência e regime patrimonial. Descendentes, ascendentes e cônjuge são herdeiros necessários no texto do art. 1.845. A sucessão do companheiro exige considerar a equiparação sucessória reconhecida pelo STF."],["Testamento, dívidas e partilha","O testamento permite organizar a sucessão nos limites legais, respeitando a legítima quando houver herdeiros necessários. A meação não é herança: deve ser apurada antes de distribuir o acervo hereditário. O herdeiro não responde por encargos superiores às forças da herança, observadas as regras probatórias."]],"map":["Morte → abertura da sucessão","Meação ≠ herança","Herdeiros necessários → legítima","Renúncia → instrumento público ou termo judicial"],"url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"}];const civilQuestions=[{"id":3001,"s":2,"module":0,"topic":"Pessoas naturais, capacidade e personalidade","difficulty":"Intermediária","q":"Uma pessoa de 17 anos, não emancipada, pretende celebrar sozinha negócio que exige plena capacidade. Qual sua condição civil?","a":["Absolutamente incapaz","Relativamente incapaz","Plenamente capaz em todos os atos","Sem personalidade civil"],"ok":1,"e":"O art. 4º, I, inclui maiores de 16 e menores de 18 anos entre os relativamente incapazes. A assistência é a regra para atos que exijam capacidade plena.","src":"CC, arts. 1º a 21","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3002,"s":2,"module":0,"topic":"Pessoas naturais, capacidade e personalidade","difficulty":"Intermediária","q":"Uma criança nasce com vida e falece poucos minutos depois. Considerando apenas a personalidade civil, qual conclusão é correta?","a":["Não adquiriu personalidade porque não foi registrada","Adquiriu apenas após completar um dia","O registro é constitutivo da personalidade","Adquiriu personalidade no nascimento com vida"],"ok":3,"e":"Nos termos do art. 2º, o nascimento com vida é o marco da personalidade civil; o registro não constitui esse fato.","src":"CC, arts. 1º a 21","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3003,"s":2,"module":1,"topic":"Pessoas jurídicas, bens e domicílio","difficulty":"Intermediária","q":"Uma sociedade deixa de pagar dívida. Sem evidência de abuso, o credor pede desconsideração com base apenas no art. 50 do CC. Qual resposta?","a":["O mero inadimplemento não basta","A medida é automática","Todo sócio responde integralmente","A sociedade é extinta de pleno direito"],"ok":0,"e":"O art. 50 exige abuso da personalidade jurídica, caracterizado por desvio de finalidade ou confusão patrimonial; não basta a dívida impaga.","src":"CC, arts. 40 a 103","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3004,"s":2,"module":1,"topic":"Pessoas jurídicas, bens e domicílio","difficulty":"Intermediária","q":"Um particular ocupa bem público por décadas e pretende adquiri-lo por usucapião. Qual regra se aplica?","a":["Adquire após cinco anos","Adquire se for de boa-fé","Bens públicos não são adquiridos por usucapião","Adquire se pagar tributos"],"ok":2,"e":"O art. 102 do CC exclui os bens públicos da aquisição por usucapião, independentemente do tempo de ocupação.","src":"CC, arts. 40 a 103","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3005,"s":2,"module":2,"topic":"Negócio jurídico, defeitos e invalidade","difficulty":"Intermediária","q":"Duas pessoas simulam venda para aparentar transferência patrimonial inexistente. Qual o vício do negócio simulado?","a":["Mora","Prescrição","Nulidade","Anulabilidade por incapacidade relativa"],"ok":2,"e":"O art. 167 declara nulo o negócio simulado, podendo subsistir o negócio dissimulado se válido em substância e forma.","src":"CC, arts. 104 a 184","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3006,"s":2,"module":2,"topic":"Negócio jurídico, defeitos e invalidade","difficulty":"Intermediária","q":"Um contrato apresenta simples erro aritmético no cálculo do preço. Qual providência o art. 143 admite?","a":["Nulidade automática","Retificação da declaração de vontade","Rescisão penal","Conversão em doação"],"ok":1,"e":"O erro de cálculo permite retificação da declaração, sem por si só exigir invalidação do negócio.","src":"CC, arts. 104 a 184","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3007,"s":2,"module":3,"topic":"Prescrição e decadência","difficulty":"Intermediária","q":"Não há prazo prescricional especial aplicável a determinada pretensão. Qual prazo geral o art. 205 estabelece?","a":["Dois anos","Cinco anos","Vinte anos","Dez anos"],"ok":3,"e":"O prazo geral é de dez anos se a lei não fixar prazo menor.","src":"CC, arts. 189 a 211","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3008,"s":2,"module":3,"topic":"Prescrição e decadência","difficulty":"Intermediária","q":"O juiz identifica decadência estabelecida em lei. Qual conduta prevê o Código Civil?","a":["Deve conhecê-la de ofício","Só pode apreciá-la se o réu pedir","Deve transformar o prazo em prescrição","Deve aguardar autorização do Ministério Público"],"ok":0,"e":"O art. 210 determina o conhecimento de ofício da decadência legal, diferentemente da convencional, tratada no art. 211.","src":"CC, arts. 189 a 211","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3009,"s":2,"module":4,"topic":"Obrigações, pagamento e inadimplemento","difficulty":"Intermediária","q":"Dois devedores assinam obrigação divisível sem cláusula de solidariedade e sem lei que a imponha. A solidariedade pode ser presumida?","a":["Sim, sempre","Não, resulta da lei ou da vontade das partes","Sim, se houver duas assinaturas","Sim, por escolha unilateral do credor"],"ok":1,"e":"O art. 265 afasta a presunção de solidariedade; a pluralidade de devedores não basta.","src":"CC, arts. 233 a 420","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3010,"s":2,"module":4,"topic":"Obrigações, pagamento e inadimplemento","difficulty":"Intermediária","q":"O credor recusa injustificadamente receber pagamento devido. Qual mecanismo pode liberar o devedor se observados os requisitos legais?","a":["Usucapião","Novação obrigatória","Consignação em pagamento","Doação"],"ok":2,"e":"O art. 335, I, contempla a consignação quando o credor não puder ou, sem justa causa, recusar receber o pagamento ou dar quitação regular.","src":"CC, arts. 233 a 420","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3011,"s":2,"module":5,"topic":"Contratos: princípios e espécies","difficulty":"Intermediária","q":"Uma pessoa empresta gratuitamente um violino individualizado, que deverá ser devolvido em sua identidade original. Qual contrato?","a":["Mútuo","Compra e venda","Doação","Comodato"],"ok":3,"e":"O art. 579 caracteriza comodato como empréstimo gratuito de coisas não fungíveis, aperfeiçoado com a entrega.","src":"CC, arts. 421 a 480, 481 a 853","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3012,"s":2,"module":5,"topic":"Contratos: princípios e espécies","difficulty":"Intermediária","q":"Em contrato bilateral, sem exceção aplicável, uma parte exige contraprestação antes de cumprir a obrigação que lhe incumbe. Qual defesa pode ser pertinente?","a":["Exceção do contrato não cumprido","Usucapião","Decadência automática","Renúncia tácita à propriedade"],"ok":0,"e":"O art. 476 impede, em contratos bilaterais, que um contratante exija o cumprimento da obrigação do outro antes de cumprir a sua, observada a ordem contratual.","src":"CC, arts. 421 a 480, 481 a 853","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3013,"s":2,"module":6,"topic":"Responsabilidade civil","difficulty":"Intermediária","q":"Em hipótese legal de responsabilidade objetiva, qual elemento se dispensa, em regra, provar?","a":["Dano","Culpa","Nexo causal","Fato juridicamente imputável"],"ok":1,"e":"A responsabilidade objetiva dispensa demonstração da culpa, mas exige os demais pressupostos aplicáveis.","src":"CC, arts. 186 a 188 e 927 a 954","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3014,"s":2,"module":6,"topic":"Responsabilidade civil","difficulty":"Intermediária","q":"A vítima contribuiu culposamente para o evento danoso. Qual efeito prevê o art. 945?","a":["Extinção automática da indenização","Dobro da indenização","Consideração da gravidade da culpa da vítima em confronto com a do autor","Irrelevância obrigatória da conduta da vítima"],"ok":2,"e":"O art. 945 determina ponderação da gravidade das culpas na fixação da indenização quando a vítima concorre culposamente.","src":"CC, arts. 186 a 188 e 927 a 954","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3015,"s":2,"module":7,"topic":"Posse, propriedade e direitos reais","difficulty":"Intermediária","q":"Comprador possui escritura de imóvel, mas o título ainda não foi registrado. Qual regra geral sobre a transferência entre vivos?","a":["Já adquiriu domínio somente com assinatura","Adquiriu domínio pelo pagamento integral","Adquiriu domínio pela emissão da escritura","O domínio se transfere com o registro do título translativo"],"ok":3,"e":"O art. 1.245 estabelece a transferência da propriedade imobiliária entre vivos mediante registro do título no Registro de Imóveis.","src":"CC, arts. 1.196 a 1.510-E","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3016,"s":2,"module":7,"topic":"Posse, propriedade e direitos reais","difficulty":"Intermediária","q":"O possuidor foi privado da posse por ato de terceiro. Qual proteção possessória corresponde ao esbulho?","a":["Reintegração de posse","Manutenção de posse exclusivamente","Mandado de injunção","Habeas data"],"ok":0,"e":"O art. 1.210 assegura restituição da posse no esbulho, manutenção na turbação e proteção diante de ameaça.","src":"CC, arts. 1.196 a 1.510-E","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3017,"s":2,"module":8,"topic":"Direito de família","difficulty":"Intermediária","q":"Sem pacto antenupcial e fora das hipóteses de separação obrigatória, qual regime patrimonial se aplica ao casamento?","a":["Comunhão universal","Comunhão parcial","Separação convencional","Participação final nos aquestos"],"ok":1,"e":"O art. 1.640 estabelece a comunhão parcial na ausência de convenção válida, ressalvadas hipóteses legais específicas.","src":"CC, arts. 1.511 a 1.783-A","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3018,"s":2,"module":8,"topic":"Direito de família","difficulty":"Intermediária","q":"Após fixação dos alimentos, ocorre mudança relevante e comprovada na situação financeira do alimentante. Qual medida pode ser cabível?","a":["Extinção automática sem decisão","Transferência automática a terceiro","Pedido de revisão judicial","Impossibilidade de qualquer alteração"],"ok":2,"e":"O art. 1.699 admite pedido de exoneração, redução ou majoração diante de mudança na situação financeira pertinente.","src":"CC, arts. 1.511 a 1.783-A","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3019,"s":2,"module":9,"topic":"Direito das sucessões","difficulty":"Intermediária","q":"Qual o momento da transmissão da herança aos herdeiros, pela regra da saisine?","a":["Na assinatura da partilha","No registro do inventário","Após pagamento de todos os tributos","Na abertura da sucessão, com a morte"],"ok":3,"e":"O art. 1.784 prevê transmissão imediata da herança com a abertura da sucessão.","src":"CC, arts. 1.784 a 2.027","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"id":3020,"s":2,"module":9,"topic":"Direito das sucessões","difficulty":"Intermediária","q":"Uma pessoa pretende renunciar formalmente à herança. Qual forma é exigida pelo art. 1.806?","a":["Instrumento público ou termo judicial","Mensagem verbal a familiar","Qualquer mensagem de texto","Apenas declaração particular sem formalidade"],"ok":0,"e":"A renúncia deve constar expressamente de instrumento público ou termo judicial, não se presumindo de manifestação informal.","src":"CC, arts. 1.784 a 2.027","url":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"}];const processCivilModules=[{"t":"Normas fundamentais e jurisdição","ref":"CPC, arts. 1º a 20","lessons":[["Iniciativa e impulso oficial","O processo começa por iniciativa da parte, salvo exceção legal, e segue por impulso oficial. A iniciativa de instaurar a demanda não significa que cada ato posterior dependa de novo pedido. O juiz dirige o procedimento respeitando os limites do pedido e a imparcialidade."],["Contraditório substancial","As partes devem poder influenciar a formação da decisão. Mesmo questão cognoscível de ofício, em regra, exige oportunidade prévia de manifestação. As exceções à oitiva prévia previstas no art. 9º não afastam o contraditório posterior."],["Acesso à justiça e cooperação","A arbitragem é admitida na forma da lei, e a solução consensual deve ser estimulada. Boa-fé e cooperação não obrigam uma parte a abandonar sua pretensão; exigem condutas compatíveis com um procedimento leal e decisão de mérito em tempo razoável."]],"map":["Iniciativa → parte","Impulso → oficial","Contraditório → influência","Cooperação → decisão justa"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Competência e partes","ref":"CPC, arts. 42 a 76","lessons":[["Competência absoluta e relativa","A competência ligada à matéria, pessoa ou função não pode ser alterada por convenção. Em regra, a territorial e a de valor são relativas, observadas exceções. A incompetência é arguida em preliminar de contestação; a absoluta pode ser conhecida de ofício. A eleição de foro deve atender aos requisitos legais vigentes."],["Capacidade e representação","A capacidade de ser parte não se confunde com a capacidade de atuar pessoalmente em juízo. A representação de incapazes e pessoas jurídicas obedece à lei. Identificada irregularidade sanável de representação, o juiz deve oportunizar correção antes das consequências processuais pertinentes."],["Litisconsórcio","Há litisconsórcio quando mais de uma pessoa participa de um polo processual. A necessidade decorre da lei ou da natureza da relação jurídica; a unitariedade depende de a decisão de mérito precisar ser uniforme. Essas classificações não são equivalentes."]],"map":["Matéria, pessoa, função → absoluta","Incompetência → preliminar","Representação irregular → saneamento","Necessário ≠ unitário"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Atos processuais, citação e prazos","ref":"CPC, arts. 188 a 275","lessons":[["Forma e instrumentalidade","A validade do ato deve ser examinada à luz da finalidade e das exigências legais. Se a forma não for essencial, o ato pode ser aproveitado quando atingir sua finalidade. Diferencie irregularidade sem prejuízo de vício capaz de comprometer defesa ou validade."],["Contagem de prazos","Para prazos processuais expressos em dias, contam-se apenas dias úteis. Exclui-se em regra o dia do começo e inclui-se o vencimento. O termo inicial varia conforme a modalidade de comunicação. Não aplique a regra indistintamente a prazos de direito material."],["Citação e intimação","A citação convoca o réu, executado ou interessado para integrar a relação processual; a intimação comunica atos e termos. O comparecimento espontâneo supre falta ou nulidade da citação nos termos do art. 239. A citação eletrônica tem disciplina própria, que deve ser conferida na redação vigente."]],"map":["Finalidade → aproveitamento","Prazo processual em dias → úteis","Citação → integração","Intimação → ciência"],"url":"https://planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105compilada.htm"},{"t":"Tutelas provisórias","ref":"CPC, arts. 294 a 311","lessons":[["Urgência e evidência","A tutela provisória pode fundar-se em urgência ou evidência. A primeira exige probabilidade do direito e perigo de dano ou risco ao resultado útil. A evidência depende das hipóteses específicas do art. 311, sem exigir demonstração de perigo."],["Tutela cautelar e antecipada","A cautelar protege a utilidade do resultado; a antecipada adianta efeitos práticos da tutela pretendida. Ambas podem ser anteceden
