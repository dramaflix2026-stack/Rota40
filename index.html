 suspensão e anterioridade","A Constituição veda cassação de direitos políticos e enumera hipóteses de perda ou suspensão. O art. 16 estabelece que lei que altere o processo eleitoral entra em vigor na publicação, mas não se aplica à eleição que ocorra até um ano de sua vigência. Essa garantia protege estabilidade das regras do pleito."]],"map":["Sufrágio → soberania popular","Voto facultativo → hipóteses do art. 14","Direitos políticos → art. 15","Anterioridade → art. 16"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm"},{"t":"Justiça Eleitoral: organização e competências","ref":"CF, arts. 118 a 121; Código Eleitoral, arts. 12 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm","lessons":[["Estrutura institucional","A Justiça Eleitoral compreende Tribunal Superior Eleitoral, Tribunais Regionais Eleitorais, juízes e juntas eleitorais. Sua organização combina integrantes de diferentes origens, nos termos constitucionais. O Ministério Público Eleitoral exerce funções próprias, sem integrar a estrutura de órgãos jurisdicionais."],["Funções jurisdicionais e administrativas","A Justiça Eleitoral organiza eleições, administra cadastro eleitoral e resolve controvérsias submetidas à sua competência. Também possui atribuição regulamentar dentro dos limites legais. Resoluções não autorizam criação irrestrita de obrigações ou sanções sem fundamento normativo."],["Competências e recursos","O órgão competente varia segundo circunscrição, cargo disputado e natureza do procedimento. Registro de candidatura presidencial é apreciado originariamente pelo TSE; registros para cargos municipais, em regra, pelos juízos eleitorais. A recorribilidade das decisões dos tribunais segue os limites constitucionais e legais."]],"map":["TSE → órgão superior","TRE → circunscrição regional","Juízes e juntas → competências legais","MP Eleitoral → atuação própria"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Elegibilidade, inelegibilidades e Lei da Ficha Limpa","ref":"CF, art. 14, §§ 3º a 9º; LC 64/1990; LC 219/2025","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp64compilado.htm","lessons":[["Condições de elegibilidade","Nacionalidade brasileira, pleno exercício dos direitos políticos, alistamento, domicílio eleitoral na circunscrição, filiação partidária e idade mínima constitucional integram as condições. As idades variam por cargo. A presença dessas condições não dispensa exame das causas de inelegibilidade."],["Inelegibilidades constitucionais e legais","Inalistáveis e analfabetos são inelegíveis. Existem restrições relativas a reeleição, parentesco e exercício de cargos públicos. A LC 64/1990 prevê outras hipóteses, complementadas pela Lei da Ficha Limpa. Inelegibilidade não equivale necessariamente à perda ou suspensão de todos os direitos políticos."],["Atualização da LC 219/2025","A LC 219 modificou a duração e os marcos temporais de determinadas inelegibilidades, além de instituir o Requerimento de Declaração de Elegibilidade. Não existe um único termo inicial aplicável indistintamente a todas as causas. Identifique a alínea pertinente, a data dos fatos e as normas e decisões vigentes para o pleito."]],"map":["Elegibilidade → condições cumulativas","Inelegibilidade → restrição à candidatura","Ficha Limpa → LC 64 atualizada","LC 219 → prazos e RDE"],"extraUrl":"https://planalto.gov.br/ccivil_03/leis/lcp/lcp219.htm"},{"t":"Partidos políticos, federações e registro de candidatura","ref":"CF, art. 17; Leis 9.096/1995 e 9.504/1997","url":"https://www.planalto.gov.br/ccivil_03/leis/l9096.htm","lessons":[["Autonomia partidária","Os partidos possuem autonomia organizacional nos limites constitucionais, devem respeitar o regime democrático e têm caráter nacional. Após aquisição de personalidade jurídica na forma civil, registram seus estatutos no TSE. O registro partidário não se confunde com registro individual de candidatura."],["Federações e coligações","Federações partidárias permitem atuação conjunta segundo regras legais, com abrangência nacional e permanência mínima de quatro anos. Coligações são admitidas nas eleições majoritárias, mas vedadas nas proporcionais. A distinção repercute na atuação parlamentar, registro e distribuição de cadeiras."],["Convenções e registro","A escolha de candidaturas ocorre mediante procedimentos partidários e convenções conforme o calendário legal. O registro examina documentação e requisitos de elegibilidade. Nas eleições proporcionais, a legislação impõe percentual mínimo de candidaturas de cada sexo, com consequências jurídicas para fraudes."]],"map":["Partido → autonomia com limites","Federação → atuação conjunta duradoura","Coligação → majoritária","Registro → requisitos e documentação"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm"},{"t":"Sistemas eleitorais, votação e diplomação","ref":"CF, arts. 28, 29, 45, 46 e 77; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm","lessons":[["Sistema majoritário","No sistema majoritário, a eleição depende da maioria exigida para o cargo. Presidência, governos estaduais e prefeituras de municípios com mais de duzentos mil eleitores submetem-se ao regime constitucional de dois turnos quando necessário. Senadores são eleitos pelo princípio majoritário."],["Sistema proporcional","Deputados federais, estaduais, distritais e vereadores são eleitos pelo sistema proporcional. A distribuição das cadeiras envolve votos válidos, quocientes e regras de sobras, incluindo critérios de votação individual. Consulte o Código Eleitoral e decisões do STF aplicáveis, evitando memorizar fórmulas desatualizadas."],["Apuração e diplomação","A apuração verifica votos segundo o sistema aplicável. A diplomação reconhece formalmente os eleitos e suplentes nos termos legais e não equivale à posse. Impugnações de registro, diploma e mandato possuem objetos e prazos próprios."]],"map":["Presidente e governador → majoritário","Deputados e vereadores → proporcional","Prefeitura → segundo turno nas hipóteses constitucionais","Diplomação ≠ posse"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Propaganda eleitoral, internet e inteligência artificial","ref":"Lei 9.504/1997, arts. 36 a 58; Resolução TSE 23.610/2019, atualizada em 2026","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm","lessons":[["Propaganda e pré-campanha","A propaganda eleitoral é admitida após 15 de agosto do ano eleitoral. A pré-campanha permite manifestações nas hipóteses do art. 36-A, respeitada a vedação ao pedido explícito de voto e aos meios proibidos. A análise considera contexto, modalidade e conteúdo da comunicação."],["Internet e impulsionamento","A publicidade eleitoral na internet segue regras de autoria, identificação, impulsionamento e responsabilidade. Contratação paga não é permitida indistintamente: deve observar as exceções e requisitos legais. O direito de resposta possui regime próprio; a liberdade de expressão não exclui responsabilização por ilícitos."],["Conteúdo sintético em 2026","A Resolução TSE 23.755/2026 atualizou a disciplina da propaganda, incluindo identificação de conteúdo sintético produzido ou significativamente alterado por IA, proibição de deepfakes eleitorais e restrições temporais a novos conteúdos sintéticos nos períodos próximos à votação. Consulte a resolução consolidada para os deveres, exceções e consequências aplicáveis."]],"map":["Propaganda → a partir de 16 de agosto","Pré-campanha → limites","Impulsionamento → regime legal","IA → transparência e proibições"],"extraUrl":"https://www.tse.jus.br/legislacao/compilada/res/2019/resolucao-no-23-610-de-18-de-dezembro-de-2019"},{"t":"Financiamento de campanhas e prestação de contas","ref":"Lei 9.504/1997, arts. 16-C a 32; Lei 9.096/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm","lessons":[["Fontes de recursos","Campanhas podem utilizar recursos legalmente admitidos, como doações de pessoas físicas, recursos próprios dentro dos limites e recursos públicos distribuídos conforme a legislação. Doações de pessoas jurídicas não são permitidas. Fundo Partidário e Fundo Especial de Financiamento de Campanha são institutos distintos."],["Arrecadação e gastos","A arrecadação e as despesas exigem requisitos de registro, identificação da origem e destinação e observância dos limites. A legislação disciplina contas bancárias, recibos e meios de arrecadação, inclusive financiamento coletivo. Limites específicos e prazos devem ser conferidos para cada eleição."],["Prestação de contas","A prestação de contas permite controlar regularidade da arrecadação e dos gastos. A Justiça Eleitoral pode aprovar, aprovar com ressalvas, desaprovar ou julgar não prestadas as contas conforme os pressupostos. Irregularidades podem produzir efeitos diversos, sem que toda falha formal implique cassação automática."]],"map":["Doação → pessoa física nos limites legais","Pessoa jurídica → vedação","FEFC ≠ Fundo Partidário","Contas → controle de receitas e despesas"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9096.htm"},{"t":"Ilícitos eleitorais, abuso de poder e captação de sufrágio","ref":"Lei 9.504/1997, arts. 41-A e 73 a 78; LC 64/1990, art. 22","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm","lessons":[["Abuso de poder","O abuso de poder econômico ou político compromete a normalidade e legitimidade das eleições mediante uso indevido de recursos ou autoridade, conforme o enquadramento. Na AIJE, considera-se a gravidade das circunstâncias, não sendo indispensável demonstrar alteração do resultado eleitoral."],["Captação ilícita de sufrágio","O art. 41-A disciplina a oferta, promessa, doação ou entrega de vantagem pessoal ao eleitor com finalidade de obtenção de voto no período legal. A caracterização exige elementos específicos, e não se confunde automaticamente com qualquer promessa de política pública."],["Condutas vedadas a agentes públicos","A Lei das Eleições estabelece restrições ao uso da máquina pública para proteger igualdade de oportunidades. Exemplos incluem uso indevido de bens e serviços públicos e determinadas condutas em períodos eleitorais. Cada vedação possui requisitos, exceções e consequências próprias."]],"map":["Abuso → gravidade","AIJE → proteção da legitimidade","Art. 41-A → vantagem pessoal para obter voto","Agente público → condutas vedadas"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp64compilado.htm"},{"t":"Ações eleitorais, impugnações e recursos","ref":"CF, art. 14, §§ 10 e 11; LC 64/1990, arts. 3º e 22; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp64compilado.htm","lessons":[["Impugnação de registro","A ação de impugnação de registro de candidatura permite questionar preenchimento de requisitos e inelegibilidades. A LC 64 fixa, em regra, prazo de cinco dias da publicação do pedido de registro e define legitimados. Não confunda o prazo de impugnação com o prazo de defesa."],["Investigação judicial eleitoral","A AIJE apura abuso de poder e uso indevido dos meios de comunicação nas condições do art. 22. Seu objeto e consequências diferem da impugnação de registro. Sanções devem observar responsabilidade e pressupostos próprios, não sendo automaticamente idênticas para todas as pessoas envolvidas."],["Impugnação de mandato e recursos","A AIME pode ser proposta em quinze dias da diplomação, instruída com provas de abuso do poder econômico, corrupção ou fraude, e tramita em segredo de justiça. O recurso contra expedição de diploma tem hipóteses próprias. Identifique objeto, legitimidade, competência e termo inicial antes de escolher a via."]],"map":["AIRC → registro","AIJE → abuso e uso indevido","AIME → 15 dias da diplomação","Recursos → hipóteses próprias"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Crimes eleitorais e processo penal eleitoral","ref":"Código Eleitoral, arts. 289 a 354-A e 355 a 364","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm","lessons":[["Tipicidade e bens jurídicos","Crimes eleitorais protegem, entre outros interesses, liberdade do voto, regularidade do cadastro e legitimidade das eleições. A análise penal exige tipicidade, elementos subjetivos e demais pressupostos. Um ilícito cível-eleitoral não constitui necessariamente crime."],["Corrupção eleitoral","O art. 299 do Código Eleitoral prevê condutas de dar, oferecer, prometer, solicitar ou receber vantagem para obter ou dar voto ou conseguir ou prometer abstenção, conforme o tipo. Não confunda crime de corrupção eleitoral com a representação por captação ilícita de sufrágio do art. 41-A, que possui regime próprio."],["Ação penal e competência","A ação penal por crimes eleitorais é pública, conforme art. 355. O processo segue a disciplina especial do Código Eleitoral, com aplicação subsidiária pertinente. A jurisprudência do STF reconhece competência da Justiça Eleitoral para crimes comuns conexos a crimes eleitorais, nas condições aplicáveis."]],"map":["Ilícito eleitoral ≠ crime automaticamente","Art. 299 → corrupção eleitoral","Ação penal → pública","Conexão → jurisprudência do STF"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm"}];const electoralQuestions=[{"id":18001,"s":17,"module":0,"topic":"Direitos políticos, sufrágio e alistamento","difficulty":"Intermediária","q":"Uma pessoa analfabeta de 35 anos deseja alistar-se e votar. Qual a regra constitucional?","a":["Alistamento proibido","Alistamento e voto facultativos","Voto obrigatório em qualquer caso","Alistamento possível apenas após alfabetização"],"ok":1,"e":"O art. 14, § 1º, II, a, prevê facultatividade para analfabetos, embora sejam inelegíveis conforme § 4º.","src":"CF, arts. 14 a 16; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":18002,"s":17,"module":0,"topic":"Direitos políticos, sufrágio e alistamento","difficulty":"Intermediária","q":"Lei que altera o processo eleitoral é publicada seis meses antes de uma eleição. Qual regra geral do art. 16?","a":["Aplicação automática ao próximo pleito","Vigência apenas após dez anos","Entra em vigor na publicação, mas não se aplica àquela eleição","Inexistência jurídica da lei"],"ok":2,"e":"A anterioridade eleitoral diferencia vigência da lei e aplicabilidade às eleições realizadas dentro de um ano de sua vigência.","src":"CF, arts. 14 a 16; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":18003,"s":17,"module":1,"topic":"Justiça Eleitoral: organização e competências","difficulty":"Intermediária","q":"Qual órgão integra expressamente a Justiça Eleitoral no art. 118 da Constituição?","a":["Junta eleitoral","Tribunal de Contas da União","Conselho Nacional do Ministério Público","Tribunal Marítimo"],"ok":0,"e":"O art. 118 enumera TSE, TREs, juízes e juntas eleitorais.","src":"CF, arts. 118 a 121; Código Eleitoral, arts. 12 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm"},{"id":18004,"s":17,"module":1,"topic":"Justiça Eleitoral: organização e competências","difficulty":"Intermediária","q":"Qual órgão aprecia originariamente o registro de candidatura à Presidência da República?","a":["STJ","Juízo eleitoral municipal","Tribunal de Contas","TSE"],"ok":3,"e":"O registro para Presidente e Vice-Presidente da República pertence à competência originária do TSE, conforme o Código Eleitoral.","src":"CF, arts. 118 a 121; Código Eleitoral, arts. 12 a 41","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm"},{"id":18005,"s":17,"module":2,"topic":"Elegibilidade, inelegibilidades e Lei da Ficha Limpa","difficulty":"Intermediária","q":"Qual a idade mínima constitucional para candidatura ao cargo de senador?","a":["Vinte e um anos","Trinta e cinco anos","Trinta anos","Dezoito anos"],"ok":1,"e":"O art. 14, § 3º, VI, a, estabelece trinta e cinco anos para Presidente, Vice-Presidente e senador.","src":"CF, art. 14, §§ 3º a 9º; LC 64/1990; LC 219/2025","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp64compilado.htm"},{"id":18006,"s":17,"module":2,"topic":"Elegibilidade, inelegibilidades e Lei da Ficha Limpa","difficulty":"Intermediária","q":"Qual alteração integra o objeto da LC 219/2025?","a":["Extinção do voto secreto","Extinção da Justiça Eleitoral","Modificação de marcos de inelegibilidades e criação do RDE","Eliminação da filiação partidária"],"ok":2,"e":"A LC 219/2025 altera a LC 64/1990 e a Lei 9.504/1997 nesses pontos; a aplicação concreta exige análise da hipótese.","src":"LC 219/2025","url":"https://planalto.gov.br/ccivil_03/leis/lcp/lcp219.htm"},{"id":18007,"s":17,"module":3,"topic":"Partidos políticos, federações e registro de candidatura","difficulty":"Intermediária","q":"A Constituição admite coligação partidária em eleição proporcional?","a":["Sim, sempre","Sim, apenas para vereador","Sim, com autorização municipal","Não, as coligações proporcionais são vedadas"],"ok":3,"e":"O art. 17, § 1º, veda coligações nas eleições proporcionais, admitindo-as nas majoritárias.","src":"CF, art. 17; Leis 9.096/1995 e 9.504/1997","url":"https://www.planalto.gov.br/ccivil_03/leis/l9096.htm"},{"id":18008,"s":17,"module":3,"topic":"Partidos políticos, federações e registro de candidatura","difficulty":"Intermediária","q":"Qual período mínimo de permanência dos partidos em federação é previsto na Lei 9.096/1995?","a":["Quatro anos","Seis meses","Um ano","Vinte anos"],"ok":0,"e":"O art. 11-A, § 3º, II, exige permanência na federação por pelo menos quatro anos.","src":"CF, art. 17; Leis 9.096/1995 e 9.504/1997","url":"https://www.planalto.gov.br/ccivil_03/leis/l9096.htm"},{"id":18009,"s":17,"module":4,"topic":"Sistemas eleitorais, votação e diplomação","difficulty":"Intermediária","q":"Qual sistema eleitoral é aplicado à eleição para deputado federal?","a":["Majoritário em dois turnos","Proporcional","Sorteio","Eleição indireta pelo Senado"],"ok":1,"e":"O art. 45 da Constituição estabelece sistema proporcional para composição da Câmara dos Deputados.","src":"CF, arts. 28, 29, 45, 46 e 77; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm"},{"id":18010,"s":17,"module":4,"topic":"Sistemas eleitorais, votação e diplomação","difficulty":"Intermediária","q":"Em qual hipótese municipal a Constituição prevê possibilidade de segundo turno para prefeito?","a":["Municípios com mais de duzentos mil habitantes, independentemente de eleitores","Todos os municípios","Municípios com mais de duzentos mil eleitores, se não houver maioria exigida","Somente capitais estaduais"],"ok":2,"e":"O art. 29, II, remete ao regime do art. 77 nos municípios com mais de duzentos mil eleitores. O critério é número de eleitores, não habitantes.","src":"CF, arts. 28, 29, 45, 46 e 77; Código Eleitoral","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm"},{"id":18011,"s":17,"module":5,"topic":"Propaganda eleitoral, internet e inteligência artificial","difficulty":"Intermediária","q":"Qual a data geral a partir da qual a propaganda eleitoral é permitida pela Lei 9.504?","a":["1º de janeiro","15 de maio","16 de agosto","Dia da diplomação"],"ok":2,"e":"O art. 36 permite propaganda eleitoral após 15 de agosto do ano da eleição.","src":"Lei 9.504/1997, arts. 36 a 58; Resolução TSE 23.610/2019, atualizada em 2026","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm"},{"id":18012,"s":17,"module":5,"topic":"Propaganda eleitoral, internet e inteligência artificial","difficulty":"Intermediária","q":"Nas hipóteses previstas na resolução do TSE, a propaganda que emprega conteúdo sintético multimídia gerado por IA pode ocultar livremente a manipulação?","a":["Não, deve observar os deveres de identificação e as demais restrições","Sim, em todos os casos","Sim, se publicada por pessoa jurídica","Sim, quando paga"],"ok":0,"e":"A resolução consolidada prevê transparência quanto ao conteúdo sintético e à tecnologia empregada, além de proibições específicas.","src":"Resolução TSE 23.610/2019, atualizada pela 23.755/2026","url":"https://www.tse.jus.br/legislacao/compilada/res/2019/resolucao-no-23-610-de-18-de-dezembro-de-2019"},{"id":18013,"s":17,"module":6,"topic":"Financiamento de campanhas e prestação de contas","difficulty":"Intermediária","q":"Uma sociedade empresária pretende fazer doação diretamente à campanha de um candidato. É fonte ordinariamente admitida?","a":["Sim, sem limite","Não, doações eleitorais de pessoas jurídicas são vedadas","Sim, se a empresa for pequena","Sim, se o candidato autorizar"],"ok":1,"e":"O regime atual de financiamento eleitoral não admite doações de pessoas jurídicas para campanhas.","src":"Lei 9.504/1997, arts. 16-C a 32; Lei 9.096/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm"},{"id":18014,"s":17,"module":6,"topic":"Financiamento de campanhas e prestação de contas","difficulty":"Intermediária","q":"Qual é a finalidade central da prestação de contas eleitoral?","a":["Substituir o registro de candidatura","Definir automaticamente o resultado do pleito","Dispensar a identificação das receitas","Permitir controle da regularidade da arrecadação e dos gastos"],"ok":3,"e":"A prestação de contas viabiliza fiscalização de origem, destinação e conformidade dos recursos eleitorais.","src":"Lei 9.504/1997, arts. 16-C a 32; Lei 9.096/1995","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm"},{"id":18015,"s":17,"module":7,"topic":"Ilícitos eleitorais, abuso de poder e captação de sufrágio","difficulty":"Intermediária","q":"Para apuração de abuso de poder nos termos do art. 22, XVI, da LC 64, qual elemento é central?","a":["Gravidade das circunstâncias, e não potencialidade de alterar o resultado","Número de seguidores do candidato isoladamente","Existência de contrato civil","Prova obrigatória de alteração do resultado"],"ok":0,"e":"O inciso XVI determina exame da gravidade das circunstâncias, afastando a exigência de potencialidade de alteração do resultado.","src":"LC 64/1990, art. 22, XVI","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp64compilado.htm"},{"id":18016,"s":17,"module":7,"topic":"Ilícitos eleitorais, abuso de poder e captação de sufrágio","difficulty":"Intermediária","q":"Oferecer vantagem pessoal a eleitor com finalidade de obter voto, no período previsto pelo art. 41-A, caracteriza em tese qual ilícito?","a":["Ato de alistamento","Propaganda institucional regular","Captação ilícita de sufrágio","Prestação de contas"],"ok":2,"e":"O art. 41-A disciplina captação ilícita de sufrágio, observados os elementos legais e a prova pertinente.","src":"Lei 9.504/1997, arts. 41-A e 73 a 78; LC 64/1990, art. 22","url":"https://www.planalto.gov.br/ccivil_03/leis/l9504compilado.htm"},{"id":18017,"s":17,"module":8,"topic":"Ações eleitorais, impugnações e recursos","difficulty":"Intermediária","q":"Qual prazo constitucional para impugnação do mandato eletivo por AIME?","a":["Cinco anos","Quinze dias contados da diplomação","Trinta dias da posse","Oito dias do registro"],"ok":1,"e":"O art. 14, § 10, da Constituição prevê quinze dias da diplomação.","src":"CF, art. 14, §§ 10 e 11","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":18018,"s":17,"module":8,"topic":"Ações eleitorais, impugnações e recursos","difficulty":"Intermediária","q":"A AIME tramita sob qual regime de publicidade segundo a Constituição?","a":["Publicidade irrestrita obrigatória","Sigilo apenas se o réu solicitar","Procedimento exclusivamente administrativo","Segredo de justiça"],"ok":3,"e":"O art. 14, § 11, prevê tramitação em segredo de justiça e responsabilidade por ação temerária ou de manifesta má-fé.","src":"CF, art. 14, §§ 10 e 11","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":18019,"s":17,"module":9,"topic":"Crimes eleitorais e processo penal eleitoral","difficulty":"Intermediária","q":"Qual a natureza da ação penal para crimes definidos no Código Eleitoral segundo o art. 355?","a":["Privada exclusiva","Privada subsidiária obrigatória","Pública","Condicionada sempre à autorização do TSE"],"ok":2,"e":"O art. 355 estabelece ação pública para as infrações penais definidas no Código Eleitoral.","src":"Código Eleitoral, arts. 289 a 354-A e 355 a 364","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm"},{"id":18020,"s":17,"module":9,"topic":"Crimes eleitorais e processo penal eleitoral","difficulty":"Intermediária","q":"A configuração de um ilícito cível-eleitoral implica necessariamente condenação criminal pelo mesmo fato?","a":["Não, cada esfera possui pressupostos e procedimento próprios","Sim, sem necessidade de processo penal","Sim, se houver multa","Sim, por decisão do partido"],"ok":0,"e":"A responsabilização penal exige verificação dos elementos do tipo e garantias próprias; não decorre automaticamente da responsabilidade eleitoral não penal.","src":"Código Eleitoral, arts. 289 a 354-A e 355 a 364","url":"https://www.planalto.gov.br/ccivil_03/leis/l4737compilado.htm"}];const financialModules=[{"t":"Atividade financeira do Estado e competências","ref":"CF, arts. 24, I, e 163 a 169; LC 101/2000","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Objeto do Direito Financeiro","O Direito Financeiro disciplina obtenção, gestão e aplicação de recursos públicos, incluindo orçamento, despesa, receita e crédito público. Não se confunde com Direito Tributário, que examina a instituição e exigência de tributos. A arrecadação tributária integra o financiamento estatal, mas não é sua única fonte."],["Competência legislativa","A Constituição prevê competência concorrente da União, Estados e Distrito Federal em matéria de Direito Financeiro. À União cabe estabelecer normas gerais, sem excluir competência suplementar estadual. Municípios possuem atribuições de interesse local e suplementação conforme o art. 30."],["Normas gerais e responsabilidade","A Lei 4.320/1964 estabelece normas gerais para orçamentos e balanços; a LC 101/2000 disciplina responsabilidade na gestão fiscal. O regime constitucional protege planejamento, equilíbrio e controle. A autonomia financeira dos entes não autoriza afastar limites nacionais validamente estabelecidos."]],"map":["Finanças → receitas e despesas","Tributário → instituição e cobrança","Competência concorrente → normas gerais e suplementação","Autonomia → limites constitucionais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"t":"Planejamento orçamentário: PPA, LDO e LOA","ref":"CF, art. 165; LC 101/2000, arts. 4º e 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Plano Plurianual","O PPA estabelece, de modo regionalizado, diretrizes, objetivos e metas da administração federal para despesas de capital e outras delas decorrentes e para programas de duração continuada. Sua função é estruturar planejamento de médio prazo, não substituir a autorização anual das despesas."],["Lei de Diretrizes Orçamentárias","A LDO orienta elaboração da LOA, estabelece metas e prioridades e trata das matérias constitucionais e fiscais pertinentes. O Anexo de Metas Fiscais e o Anexo de Riscos Fiscais atendem exigências da LRF. O planejamento anual precisa guardar compatibilidade com o PPA."],["Lei Orçamentária Anual","A LOA prevê receitas e fixa despesas do exercício. Na União, abrange orçamento fiscal, de investimento das empresas nas condições constitucionais e da seguridade social. A iniciativa dos projetos é do Executivo. Autorizações orçamentárias e execução obrigatória devem ser examinadas conforme o regime constitucional vigente."]],"map":["PPA → planejamento plurianual","LDO → prioridades e orientação","LOA → receita e despesa anuais","Compatibilidade → integração dos instrumentos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"t":"Princípios orçamentários e vedações constitucionais","ref":"CF, arts. 165, § 8º, e 167; Lei 4.320/1964, arts. 2º e 6º","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm","lessons":[["Unidade, universalidade e anualidade","Unidade orienta a integração do orçamento; universalidade exige inclusão das receitas e despesas orçamentárias pertinentes; anualidade delimita o exercício financeiro. A existência de componentes distintos na LOA federal não elimina o princípio da unidade."],["Exclusividade e orçamento bruto","A exclusividade impede inserir na LOA matéria estranha à previsão de receita e fixação de despesa, ressalvadas autorizações constitucionais para créditos suplementares e operações de crédito. O orçamento bruto evita deduções indevidas na apresentação de receitas e despesas."],["Vedações e não vinculação","O art. 167 veda, entre outras condutas, início de programas não incluídos na LOA e realização de despesas acima dos créditos. A não vinculação refere-se à receita de impostos e possui exceções constitucionais. Não se trata de proibição absoluta de vincular qualquer receita pública."]],"map":["Unidade → integração","Universalidade → abrangência","Anualidade → exercício","Exclusividade → matéria orçamentária e exceções"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Receitas públicas e renúncia de receita","ref":"Lei 4.320/1964, arts. 11 e 51 a 57; LRF, arts. 11 a 14","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm","lessons":[["Classificação das receitas","Receitas correntes e de capital são categorias econômicas previstas na legislação. Tributos e receitas patrimoniais exemplificam receitas correntes; operações de crédito e alienação de bens exemplificam receitas de capital. Ingressos extraorçamentários possuem regime distinto e não representam necessariamente recursos disponíveis para gasto público."],["Etapas da receita","Previsão, lançamento quando cabível, arrecadação e recolhimento descrevem momentos relevantes da gestão da receita. Nem toda receita passa por lançamento. O reconhecimento orçamentário observa a regra do art. 35 da Lei 4.320 e não deve ser confundido com o regime patrimonial contábil."],["Renúncia fiscal","Benefícios tributários que impliquem renúncia de receita exigem atendimento ao art. 14 da LRF, incluindo avaliação de impacto e condições fiscais legalmente previstas. A finalidade social de um incentivo não dispensa os requisitos. Examine a redação vigente e as exceções legais antes de concluir pela regularidade."]],"map":["Correntes ≠ capital","Lançamento → quando cabível","Arrecadação → recebimento","Renúncia → impacto e condições fiscais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"t":"Despesas públicas, execução e restos a pagar","ref":"Lei 4.320/1964, arts. 35, 36 e 58 a 65; LRF, art. 42","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm","lessons":[["Classificação e autorização","Despesas correntes e de capital possuem funções econômicas distintas. A execução exige crédito orçamentário pertinente e atendimento às condições legais. Dotação representa autorização orçamentária; disponibilidade de caixa é questão financeira diferente. A existência de uma não garante automaticamente a outra."],["Empenho, liquidação e pagamento","Empenho formaliza obrigação de pagamento nas condições legais. Liquidação verifica o direito adquirido pelo credor, inclusive objeto entregue, valor e beneficiário. Pagamento ocorre após regular liquidação e ordem de pagamento. Em regra, não se realiza despesa sem empenho prévio."],["Restos a pagar","Despesas empenhadas e não pagas até 31 de dezembro podem constituir restos a pagar, distinguindo-se processados e não processados conforme a liquidação. Despesas de exercícios anteriores possuem disciplina própria. A inscrição deve observar disponibilidade financeira, restrições fiscais e normas pertinentes."]],"map":["Dotação ≠ caixa","Empenho → obrigação","Liquidação → verificação do direito","Restos a pagar → empenhado e não pago"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"t":"Créditos adicionais e alterações do orçamento","ref":"CF, art. 167; Lei 4.320/1964, arts. 40 a 46","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm","lessons":[["Créditos suplementares","Créditos suplementares destinam-se a reforçar dotação existente. A abertura exige autorização legislativa e indicação de recursos, observadas condições legais. A própria LOA pode conter autorização para abertura dentro dos limites estabelecidos."],["Créditos especiais","Créditos especiais destinam-se a despesas para as quais não existe dotação específica. Exigem autorização legislativa e indicação dos recursos correspondentes. Superávit financeiro, excesso de arrecadação, anulação de dotações e operações autorizadas podem constituir fontes nos termos legais."],["Créditos extraordinários","Créditos extraordinários atendem despesas imprevisíveis e urgentes, como guerra, comoção interna ou calamidade pública. Seu procedimento distingue-se dos demais e deve observar a Constituição de cada ente. Créditos especiais e extraordinários autorizados nos últimos quatro meses podem ser reabertos no exercício seguinte nos limites de seus saldos."]],"map":["Suplementar → reforço","Especial → nova dotação","Extraordinário → urgência e imprevisibilidade","Reabertura → hipóteses constitucionais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Lei de Responsabilidade Fiscal e despesa com pessoal","ref":"LC 101/2000, arts. 15 a 23 e 42","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm","lessons":[["Geração de despesas","Criação, expansão ou aperfeiçoamento de ação governamental que aumente despesa exige as condições do art. 16, incluindo estimativa de impacto e declaração pertinente. Despesa obrigatória de caráter continuado possui requisitos específicos do art. 17. A aprovação orçamentária não substitui todas as condições fiscais."],["Limites de pessoal","A LRF estabelece limites globais de despesa total com pessoal em proporção à receita corrente líquida: 50% para a União e 60% para Estados e Municípios, observada a repartição por Poder e órgão e regras especiais. Limite de alerta, prudencial e máximo têm consequências distintas."],["Final de mandato","O art. 42 restringe, nos últimos dois quadrimestres do mandato, a contratação de obrigação sem possibilidade de cumprimento integral no mandato ou sem caixa suficiente para parcelas do exercício seguinte. Há também restrições específicas sobre atos que aumentem despesa com pessoal. Não se trata de vedação absoluta de toda despesa nesse período."]],"map":["Art. 16 → impacto e adequação","Pessoal → receita corrente líquida","Limites → alerta, prudencial e máximo","Art. 42 → obrigações e caixa"]},{"t":"Dívida pública, operações de crédito e regime fiscal sustentável","ref":"CF, arts. 52, VI a IX, e 167, III; LRF, arts. 29 a 38; LC 200/2023","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm","lessons":[["Dívida e crédito público","A dívida pública resulta de obrigações financeiras nas categorias legais. Operações de crédito estão submetidas a limites, condições e autorizações pertinentes, inclusive atribuições do Senado Federal. Garantias concedidas por entes públicos também seguem condições legais. Não confunda endividamento com toda despesa orçamentária."],["Regra de ouro","A regra constitucional veda operações de crédito que excedam despesas de capital, ressalvada autorização mediante créditos suplementares ou especiais com finalidade precisa, aprovados por maioria absoluta do Legislativo. A comparação tem natureza agregada e não exige vincular individualmente cada operação a uma obra."],["Regime fiscal sustentável","A LC 200/2023 institui regime fiscal federal com metas de resultado primário e limites de despesa primária, articulados à LRF. O crescimento real dos limites observa critérios vinculados à receita e ao desempenho fiscal, com exceções e mecanismos corretivos. A LC 211/2024 introduziu alterações; consulte a redação consolidada antes de aplicar valores ou limites específicos."]],"map":["Dívida → obrigações financeiras","Senado → limites e condições","Regra de ouro → operações de crédito e despesas de capital","LC 200 → metas e limites federais"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp200.htm"},{"t":"Transparência, relatórios e controle fiscal","ref":"LRF, arts. 48 a 59; CF, arts. 70 a 75","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm","lessons":[["Transparência fiscal","A gestão fiscal responsável envolve divulgação de planos, orçamentos, prestações de contas e relatórios. A participação popular e a disponibilização de informações sobre execução orçamentária e financeira favorecem controle social. Transparência não se confunde com divulgação indiscriminada de dados pessoais protegidos."],["RREO e RGF","O Relatório Resumido da Execução Orçamentária é publicado, em regra, até trinta dias após encerramento de cada bimestre. O Relatório de Gestão Fiscal tem periodicidade quadrimestral como regra geral, ressalvadas opções e regimes legais específicos. Seus conteúdos e finalidades não são idênticos."],["Controle interno e externo","O Legislativo exerce controle externo com auxílio dos Tribunais de Contas. Cada Poder mantém sistema de controle interno nos termos constitucionais. A fiscalização examina aspectos contábeis, financeiros, orçamentários, operacionais e patrimoniais, considerando legalidade, legitimidade e economicidade."]],"map":["Transparência → publicidade e participação","RREO → bimestre","RGF → quadrimestre, regra geral","Controle externo → Legislativo e Tribunais de Contas"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Tribunais de Contas, transferências e responsabilização","ref":"CF, arts. 70 a 75; LRF, arts. 25 e 59","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Contas de governo e gestão","O TCU aprecia as contas anuais do Presidente mediante parecer prévio e julga contas de administradores e demais responsáveis nos termos do art. 71. O Congresso julga as contas presidenciais. As competências relativas às contas municipais devem observar a Constituição e a jurisprudência específica."],["Transferências intergovernamentais","Transferências constitucionais e legais não se confundem com transferências voluntárias. A LRF estabelece condições para entrega de recursos a título de cooperação, auxílio ou assistência financeira, com delimitação e exceções próprias. Recursos vinculados devem respeitar sua finalidade legal."],["Responsabilização","Irregularidades financeiras podem ensejar determinação corretiva, imputação de débito, multa e outras consequências conforme competência e procedimento. A decisão de Tribunal de Contas que imputa débito ou multa tem eficácia de título executivo. Responsabilidade fiscal não equivale automaticamente a crime ou improbidade; cada esfera possui requisitos próprios."]],"map":["Contas presidenciais → parecer prévio do TCU","Congresso → julgamento das contas presidenciais","Transferência voluntária → requisitos da LRF","Débito ou multa → título executivo"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"}];const financialQuestions=[{"id":19001,"s":18,"module":0,"topic":"Atividade financeira do Estado e competências","difficulty":"Intermediária","q":"Qual matéria pertence tipicamente ao Direito Financeiro?","a":["Validade de casamento civil","Elaboração e execução do orçamento público","Tipificação de crime contra a honra","Registro de marca empresarial"],"ok":1,"e":"O orçamento integra a atividade financeira do Estado, assim como receitas, despesas, dívida e controle.","src":"CF, arts. 24, I, e 163 a 169; LC 101/2000","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":19002,"s":18,"module":0,"topic":"Atividade financeira do Estado e competências","difficulty":"Intermediária","q":"A competência para legislar sobre Direito Financeiro prevista no art. 24, I, é de que natureza?","a":["Privativa dos Municípios","Exclusiva do Senado","Concorrente da União, Estados e Distrito Federal","Exclusiva do Judiciário"],"ok":2,"e":"O art. 24, I, prevê competência concorrente, com normas gerais federais e suplementação nos termos constitucionais.","src":"CF, arts. 24, I, e 163 a 169; LC 101/2000","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":19003,"s":18,"module":1,"topic":"Planejamento orçamentário: PPA, LDO e LOA","difficulty":"Intermediária","q":"Qual instrumento orienta diretamente a elaboração da Lei Orçamentária Anual?","a":["Lei de Diretrizes Orçamentárias","Código Civil","Regimento interno do STF","Plano diretor municipal em qualquer caso"],"ok":0,"e":"A Constituição atribui à LDO a função de orientar a elaboração da LOA.","src":"CF, art. 165; LC 101/2000, arts. 4º e 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":19004,"s":18,"module":1,"topic":"Planejamento orçamentário: PPA, LDO e LOA","difficulty":"Intermediária","q":"Quais orçamentos integram a LOA federal segundo o art. 165, § 5º?","a":["Apenas o fiscal","Apenas o da seguridade social","Somente os investimentos privados","Fiscal, investimento das empresas abrangidas e seguridade social"],"ok":3,"e":"A Constituição prevê esses três componentes, com delimitação específica do orçamento de investimento.","src":"CF, art. 165; LC 101/2000, arts. 4º e 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":19005,"s":18,"module":2,"topic":"Princípios orçamentários e vedações constitucionais","difficulty":"Intermediária","q":"Qual autorização constitui exceção constitucional ao princípio da exclusividade da LOA?","a":["Alteração do Código Penal","Autorização para abertura de créditos suplementares","Criação de regras de casamento","Alteração da legislação eleitoral"],"ok":1,"e":"O art. 165, § 8º, ressalva autorização para créditos suplementares e contratação de operações de crédito, inclusive por antecipação de receita, nos termos legais.","src":"CF, arts. 165, § 8º, e 167; Lei 4.320/1964, arts. 2º e 6º","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm"},{"id":19006,"s":18,"module":2,"topic":"Princípios orçamentários e vedações constitucionais","difficulty":"Intermediária","q":"O princípio de não vinculação do art. 167, IV, proíbe indistintamente toda vinculação de qualquer receita pública?","a":["Sim, inclusive taxas","Sim, sem exceções","Não, refere-se à receita de impostos e admite exceções constitucionais","Sim, inclusive transferências constitucionais"],"ok":2,"e":"A vedação possui objeto e exceções definidos pela Constituição. Não deve ser ampliada indistintamente para todas as receitas.","src":"CF, arts. 165, § 8º, e 167; Lei 4.320/1964, arts. 2º e 6º","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm"},{"id":19007,"s":18,"module":3,"topic":"Receitas públicas e renúncia de receita","difficulty":"Intermediária","q":"Uma operação de crédito orçamentária é classificada, em regra, em qual categoria econômica de receita?","a":["Receita tributária corrente","Receita de serviços corrente","Receita de capital","Receita exclusivamente extraorçamentária"],"ok":2,"e":"A Lei 4.320 classifica operações de crédito entre receitas de capital.","src":"Lei 4.320/1964, arts. 11 e 51 a 57; LRF, arts. 11 a 14","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm"},{"id":19008,"s":18,"module":3,"topic":"Receitas públicas e renúncia de receita","difficulty":"Intermediária","q":"A concessão de incentivo tributário que implica renúncia de receita dispensa automaticamente avaliação de impacto fiscal por possuir finalidade social?","a":["Sim, em todos os casos","Sim, se anunciada publicamente","Sim, se for municipal","Não, deve observar as exigências legais aplicáveis"],"ok":3,"e":"O art. 14 da LRF estabelece condições para concessão ou ampliação de benefício que implique renúncia de receita.","src":"LRF, art. 14","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"id":19009,"s":18,"module":4,"topic":"Despesas públicas, execução e restos a pagar","difficulty":"Intermediária","q":"Qual etapa verifica o direito adquirido pelo credor com base nos documentos comprobatórios da despesa?","a":["Liquidação","Previsão de receita","Lançamento tributário","Diplomação"],"ok":0,"e":"O art. 63 disciplina liquidação como verificação do direito adquirido pelo credor, a partir dos títulos e documentos comprobatórios.","src":"Lei 4.320/1964, arts. 35, 36 e 58 a 65; LRF, art. 42","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm"},{"id":19010,"s":18,"module":4,"topic":"Despesas públicas, execução e restos a pagar","difficulty":"Intermediária","q":"Uma despesa regularmente empenhada e liquidada, mas não paga até o fim do exercício, classifica-se em regra como quê?","a":["Receita corrente","Restos a pagar processados","Crédito extraordinário","Renúncia de receita"],"ok":1,"e":"Restos a pagar processados correspondem a despesas empenhadas e liquidadas que permanecem não pagas ao fim do exercício.","src":"Lei 4.320/1964, arts. 35, 36 e 58 a 65; LRF, art. 42","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm"},{"id":19011,"s":18,"module":5,"topic":"Créditos adicionais e alterações do orçamento","difficulty":"Intermediária","q":"A administração precisa reforçar dotação orçamentária já existente. Qual espécie de crédito adicional corresponde a essa finalidade?","a":["Especial","Extraordinário obrigatoriamente","Suplementar","Tributário"],"ok":2,"e":"O art. 41, I, caracteriza crédito suplementar como destinado ao reforço de dotação orçamentária.","src":"CF, art. 167; Lei 4.320/1964, arts. 40 a 46","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm"},{"id":19012,"s":18,"module":5,"topic":"Créditos adicionais e alterações do orçamento","difficulty":"Intermediária","q":"Qual crédito atende despesas imprevisíveis e urgentes nas hipóteses constitucionais?","a":["Extraordinário","Suplementar em qualquer caso","Crédito de fornecedor","Crédito tributário"],"ok":0,"e":"O art. 167, § 3º, da Constituição reserva créditos extraordinários a despesas imprevisíveis e urgentes.","src":"CF, art. 167; Lei 4.320/1964, arts. 40 a 46","url":"https://www.planalto.gov.br/ccivil_03/leis/l4320compilado.htm"},{"id":19013,"s":18,"module":6,"topic":"Lei de Responsabilidade Fiscal e despesa com pessoal","difficulty":"Intermediária","q":"Qual limite global de despesa total com pessoal a LRF estabelece para os Municípios, em percentual da receita corrente líquida?","a":["50%","60%","80%","100%"],"ok":1,"e":"O art. 19, III, estabelece limite global de 60%, sem confundir esse valor com os limites por Poder.","src":"LC 101/2000, arts. 15 a 23 e 42","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"id":19014,"s":18,"module":6,"topic":"Lei de Responsabilidade Fiscal e despesa com pessoal","difficulty":"Intermediária","q":"Nos últimos dois quadrimestres do mandato, o art. 42 da LRF permite contrair obrigação com parcelas no exercício seguinte sem caixa suficiente para esse efeito?","a":["Sim, se o mandato estiver terminando","Sim, se houver promessa de receita","Sim, independentemente das condições","Não, a hipótese é vedada"],"ok":3,"e":"O art. 42 restringe obrigações que não possam ser cumpridas integralmente no mandato ou tenham parcelas futuras sem suficiente disponibilidade de caixa.","src":"LC 101/2000, arts. 15 a 23 e 42","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp101.htm"},{"id":19015,"s":18,"module":7,"topic":"Dívida pública, operações de crédito e regime fiscal sustentável","difficulty":"Intermediária","q":"Qual regra constitucional relaciona operações de crédito e despesas de capital?","a":["Anterioridade tributária","Exclusividade de marca","Regra de ouro","Princípio da insignificância penal"],"ok":2,"e":"O art. 167, III, estabelece a chamada regra de ouro, com exceção constitucional expressa.","src":"CF, art. 167, III","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":19016,"s":18,"module":7,"topic":"Dívida pública, operações de crédito e regime fiscal sustentável","difficulty":"Intermediária","q":"Qual diploma instituiu o regime fiscal sustentável federal em 2023?","a":["LC 200/2023","Lei 8.078/1990","Lei 9.099/1995","Código Civil"],"ok":0,"e":"A LC 200/2023 disciplina metas fiscais e limites de despesa primária da União, sem afastar as condições da LRF.","src":"LC 200/2023","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp200.htm"},{"id":19017,"s":18,"module":8,"topic":"Transparência, relatórios e controle fiscal","difficulty":"Intermediária","q":"Qual a periodicidade ordinária de publicação do RREO, segundo a Constituição?","a":["A cada cinco anos","Bimestral","Anual exclusivamente","Mensal obrigatoriamente"],"ok":1,"e":"O art. 165, § 3º, determina publicação até trinta dias após encerramento de cada bimestre.","src":"CF, arts. 165, § 3º, e 71","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":19018,"s":18,"module":8,"topic":"Transparência, relatórios e controle fiscal","difficulty":"Intermediária","q":"Na União, qual órgão auxilia o Congresso Nacional no controle externo?","a":["Conselho Nacional de Justiça","Banco Central exclusivamente","Supremo Tribunal Federal","Tribunal de Contas da União"],"ok":3,"e":"A Constituição atribui ao Congresso o controle externo com auxílio do TCU.","src":"CF, arts. 165, § 3º, e 71","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":19019,"s":18,"module":9,"topic":"Tribunais de Contas, transferências e responsabilização","difficulty":"Intermediária","q":"Qual órgão julga as contas anuais prestadas pelo Presidente da República?","a":["TCU em caráter definitivo","STF em todos os casos","Congresso Nacional","Banco Central"],"ok":2,"e":"O art. 49, IX, atribui ao Congresso esse julgamento; o TCU emite parecer prévio conforme art. 71, I.","src":"CF, arts. 70 a 75; LRF, arts. 25 e 59","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":19020,"s":18,"module":9,"topic":"Tribunais de Contas, transferências e responsabilização","difficulty":"Intermediária","q":"Qual eficácia possuem decisões de Tribunal de Contas de que resulte imputação de débito ou multa?","a":["Título executivo","Simples opinião sem efeito jurídico","Sentença criminal automática","Emenda constitucional"],"ok":0,"e":"O art. 71, § 3º, atribui eficácia de título executivo a essas decisões.","src":"CF, arts. 70 a 75; LRF, arts. 25 e 59","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const socialSecurityModules=[{"t":"Seguridade social: princípios e organização","ref":"CF, arts. 194 a 204","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm","lessons":[["Três ramos da seguridade","A seguridade social reúne ações destinadas a assegurar saúde, previdência e assistência social. A saúde é direito de todos e dever do Estado; a previdência possui caráter contributivo e filiação obrigatória no RGPS para quem exerce atividade abrangida; a assistência social atende a quem dela necessitar, independentemente de contribuição. Os três ramos têm requisitos e formas de acesso distintos."],["Princípios constitucionais","O art. 194 prevê universalidade da cobertura e do atendimento, uniformidade e equivalência entre populações urbanas e rurais, seletividade e distributividade, irredutibilidade do valor dos benefícios, equidade no custeio, diversidade da base de financiamento e gestão democrática e descentralizada. Universalidade não significa que todo benefício contributivo seja concedido sem requisitos."],["Regimes previdenciários","O RGPS abrange os trabalhadores definidos na legislação. Os regimes próprios protegem servidores titulares de cargos efetivos segundo as normas aplicáveis a cada ente. Previdência complementar possui caráter autônomo e facultativo, conforme a Constituição. Não se deve aplicar automaticamente uma regra do RGPS a servidor vinculado a RPPS."]],"map":["Seguridade → saúde, previdência e assistência","Saúde → universal","Previdência → contributiva","Assistência → necessidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8742.htm"},{"t":"Segurados, dependentes, filiação e inscrição","ref":"Lei 8.213/1991, arts. 11 a 18","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Segurados obrigatórios","Empregado, empregado doméstico, contribuinte individual, trabalhador avulso e segurado especial integram categorias legais de segurados obrigatórios. A classificação depende da atividade e das condições de exercício. O segurado especial possui regime próprio de comprovação de atividade e custeio; não deve ser confundido com trabalhador rural empregado."],["Segurado facultativo","A pessoa que não exerce atividade que determine filiação obrigatória pode filiar-se facultativamente ao RGPS, desde que atendidos os requisitos aplicáveis. A filiação obrigatória decorre do exercício de atividade abrangida, enquanto a facultativa depende de manifestação e recolhimento conforme o regime. Inscrição cadastral não se confunde com filiação."],["Classes de dependentes","A lei organiza dependentes em classes: cônjuge, companheiro e filhos nas condições legais; pais; irmãos nas condições legais. A existência de dependente de classe anterior exclui os das seguintes. A dependência econômica da primeira classe é presumida, observadas as regras específicas sobre equiparação e comprovação."]],"map":["Obrigatório → atividade abrangida","Facultativo → requisitos e contribuição","Dependentes → classes","Classe anterior → exclui posterior"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/decreto/d3048compilado.htm"},{"t":"Financiamento e contribuições previdenciárias","ref":"CF, art. 195; Lei 8.212/1991","url":"https://www.planalto.gov.br/ccivil_03/leis/l8212cons.htm","lessons":[["Fontes de financiamento","A seguridade social é financiada por toda a sociedade, direta e indiretamente, mediante recursos dos orçamentos públicos e contribuições sociais constitucionalmente previstas. A diversidade das bases de financiamento reduz dependência de uma única fonte. Benefícios e serviços não podem ser criados, majorados ou estendidos sem correspondente fonte de custeio total."],["Salário de contribuição","O salário de contribuição constitui base de incidência conforme categoria e parcelas legalmente incluídas ou excluídas. Não é sinônimo de salário de benefício, utilizado no cálculo das prestações. Limites e faixas contributivas são atualizados, de modo que valores monetários devem ser conferidos para a competência analisada."],["Arrecadação e responsabilidade","Empresas possuem deveres de arrecadar e recolher contribuições nas hipóteses legais. A obrigação de retenção não se transfere automaticamente ao empregado por falha patronal. Contribuintes individuais e facultativos possuem regras específicas de recolhimento. A comprovação dos vínculos e remunerações deve considerar registros e documentos admitidos."]],"map":["Custeio → sociedade e orçamentos","Art. 195, § 5º → fonte total","Salário de contribuição ≠ salário de benefício","Recolhimento → conforme categoria"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"t":"Qualidade de segurado, período de graça e carência","ref":"Lei 8.213/1991, arts. 15 e 24 a 27-A","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Qualidade de segurado","A qualidade de segurado expressa a vinculação protetiva ao regime previdenciário. Em determinadas situações, ela permanece mesmo sem recolhimentos durante o período de graça. O prazo básico de manutenção após cessação de atividade abrangida é de doze meses nas hipóteses do art. 15, II, podendo ser ampliado conforme histórico contributivo e comprovação de desemprego."],["Período de graça","Para o facultativo, a regra legal é de seis meses após cessação das contribuições. Outras situações têm prazos específicos, como livramento e licenciamento militar. A data efetiva da perda deve considerar o art. 15, § 4º, e a regulamentação; não se presume perda imediata no primeiro mês sem contribuição."],["Carência e recuperação","Carência corresponde ao número mínimo de contribuições mensais exigido para determinado benefício. Tempo de contribuição e carência não são necessariamente idênticos. Alguns benefícios dispensam carência; outros exigem requisitos próprios. Após perda da qualidade, o aproveitamento de contribuições anteriores pode depender de novas contribuições, conforme o art. 27-A."]],"map":["Qualidade → vínculo protetivo","Graça → manutenção sem recolhimento","Facultativo → seis meses, regra legal","Carência → contribuições mínimas"]},{"t":"Aposentadorias programadas e reforma previdenciária","ref":"CF, art. 201; EC 103/2019, arts. 15 a 20 e 26","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc103.htm","lessons":[["Regras gerais e direito adquirido","A EC 103/2019 alterou requisitos e cálculo das aposentadorias. Para novos filiados no RGPS, a regra geral prevê idade de 62 anos para mulheres e 65 para homens, com tempos mínimos contributivos de 15 e 20 anos, respectivamente, nos termos do art. 19. Segurados que já haviam preenchido requisitos antes da reforma preservam o direito adquirido. Há regras diferenciadas para categorias e situações específicas."],["Regras de transição","Segurados filiados antes da reforma podem enquadrar-se nas transições por pontos, idade progressiva ou pedágios, conforme requisitos de cada modalidade. A pontuação e a idade progressiva mudam ao longo dos anos. A data do fato e a história contributiva são indispensáveis para selecionar corretamente a regra; não se deve confundir o pedágio de 50% com o de 100%."],["Cálculo do benefício","A reforma prevê, em várias hipóteses, cálculo sobre média de salários de contribuição e coeficiente de 60% acrescido de dois pontos percentuais por ano que exceda o marco contributivo pertinente. Existem exceções e regras específicas. A determinação da renda mensal exige identificar a espécie, a data e o regime jurídico aplicável."]],"map":["EC 103 → reforma","Direito adquirido → requisitos já completos","Transição → data e histórico","Cálculo → média e coeficiente conforme regra"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"t":"Benefícios por incapacidade e auxílio-acidente","ref":"Lei 8.213/1991, arts. 42 a 47, 59 a 63 e 86","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Incapacidade temporária","O auxílio por incapacidade temporária protege o segurado impossibilitado de exercer seu trabalho ou atividade habitual pelo período legal, observados qualidade, carência quando exigida e avaliação pertinente. Para empregado, os primeiros quinze dias consecutivos seguem, em regra, a responsabilidade patronal. Diagnóstico isolado não comprova necessariamente incapacidade laboral."],["Incapacidade permanente","A aposentadoria por incapacidade permanente exige incapacidade e insuscetibilidade de reabilitação para atividade que garanta subsistência, nos termos legais. A avaliação considera condições concretas e possibilidade de recuperação ou reabilitação. Doença preexistente não gera direito automaticamente, ressalvada incapacidade superveniente por progressão ou agravamento conforme a lei."],["Auxílio-acidente","O auxílio-acidente tem natureza indenizatória e pode ser devido após consolidação de lesões decorrentes de acidente que produzam sequelas redutoras da capacidade para o trabalho habitualmente exercido, para categorias abrangidas. Não se confunde com benefício substitutivo integral de renda. A acumulação com remuneração é admitida, mas com aposentadoria é vedada."]],"map":["Temporária → incapacidade para atividade habitual","Permanente → insuscetibilidade de reabilitação","Carência → regra e dispensas","Auxílio-acidente → indenização"]},{"t":"Aposentadoria especial, rural e da pessoa com deficiência","ref":"Lei 8.213/1991, arts. 48 e 57 a 58; EC 103/2019; LC 142/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Exposição a agentes nocivos","A aposentadoria especial exige comprovação de efetiva exposição a agentes prejudiciais à saúde, conforme os critérios do período de trabalho. Perfil Profissiográfico Previdenciário e documentação técnica são relevantes. A EC 103 alterou requisitos e restringiu a conversão de tempo especial em comum aos períodos anteriores à reforma, conforme art. 25, § 2º."],["Aposentadoria rural","A regra constitucional prevê idades reduzidas de 55 anos para mulheres e 60 para homens trabalhadores rurais abrangidos. O segurado especial deve comprovar atividade rural nos termos legais. A aposentadoria híbrida, que considera períodos rurais e urbanos, possui requisitos próprios e não segue automaticamente as idades reduzidas da aposentadoria exclusivamente rural."],["Pessoa com deficiência","A LC 142/2013 estabelece regras diferenciadas de aposentadoria no RGPS, incluindo modalidades por tempo de contribuição conforme grau de deficiência e por idade. A avaliação da deficiência não equivale à avaliação de incapacidade laboral. A EC 103 preservou sua aplicação nos termos do art. 22 até legislação pertinente."]],"map":["Especial → exposição comprovada","Conversão → marco da EC 103","Rural → requisitos específicos","Deficiência ≠ incapacidade laboral"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp142.htm"},{"t":"Pensão por morte, auxílio-reclusão e salário-família","ref":"Lei 8.213/1991, arts. 65 a 70 e 74 a 80; EC 103/2019, art. 23","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Pensão por morte","A pensão protege dependentes do segurado falecido, observados os requisitos de qualidade e dependência. Em regra, não exige carência, mas o número de contribuições e o tempo de casamento ou união estável podem influenciar a duração para cônjuge ou companheiro. A data do óbito determina a legislação aplicável; cálculo e duração possuem exceções legais."],["Auxílio-reclusão","O auxílio-reclusão destina-se aos dependentes do segurado de baixa renda recolhido à prisão em regime fechado, observadas a carência legal e demais condições. Não é pagamento ao preso. A aferição de renda, a situação de reclusão e a qualidade de segurado devem ser analisadas segundo as normas vigentes."],["Salário-família e dependência","O salário-família atende segurados nas categorias abrangidas e dentro dos limites legais de remuneração, em razão de filhos ou equiparados nas condições de idade ou invalidez previstas. Não se confunde com salário-maternidade. Limites monetários devem ser verificados na regulamentação anual e conforme a competência."]],"map":["Pensão → dependentes","Carência ≠ duração da pensão","Auxílio-reclusão → dependentes de segurado elegível","Salário-família → requisitos de renda e dependentes"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc103.htm"},{"t":"Salário-maternidade e benefício assistencial (BPC)","ref":"Lei 8.213/1991, arts. 71 a 73; ADIs 2110 e 2111; LOAS, art. 20","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Salário-maternidade","O salário-maternidade protege eventos como parto, adoção, guarda judicial para adoção e aborto não criminoso, nos termos legais. O prazo ordinário de 120 dias para parto e adoção possui hipóteses especiais que devem ser verificadas. A concessão depende da qualidade de segurado e dos requisitos pertinentes, incluindo afastamento da atividade quando exigido."],["Atualização sobre carência","O STF afastou a exigência de carência do salário-maternidade no julgamento das ADIs 2110 e 2111. A IN PRES/INSS 188/2025 implementou a orientação administrativa, e o INSS informa a dispensa de número mínimo de contribuições. Isso não elimina a necessidade de qualidade de segurado nem autoriza presumir direito apenas em razão do evento."],["Benefício de prestação continuada","O BPC é assistencial e garante um salário mínimo mensal à pessoa idosa com 65 anos ou mais ou à pessoa com deficiência que preencha os requisitos legais de vulnerabilidade e demais condições. Não depende de contribuição previdenciária prévia e não gera pensão por morte. A avaliação de renda e deficiência deve seguir a LOAS e as normas atualizadas, inclusive as regras cadastrais."]],"map":["Maternidade → proteção previdenciária","ADI 2110/2111 → carência afastada","BPC → assistência","BPC → idade ou deficiência e vulnerabilidade"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/leis/l8742.htm"},{"t":"Processo previdenciário, revisão e regimes próprios","ref":"Lei 8.213/1991, arts. 103 e 126; CF, arts. 40 e 201; STF, Tema 350","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm","lessons":[["Requerimento e prova","O requerimento administrativo permite ao INSS examinar vínculos, contribuições e condições do benefício. CNIS, documentos laborais e outras provas podem ser relevantes conforme o caso. A decisão administrativa deve ser motivada e pode ser impugnada pelas vias próprias, inclusive recursos ao CRPS nos termos aplicáveis."],["Acesso judicial, decadência e prescrição","O Tema 350 do STF diferencia prévio requerimento administrativo de esgotamento da via administrativa. Em regra, a concessão inicial exige requerimento prévio, ressalvadas hipóteses reconhecidas. O prazo decadencial de dez anos para revisão do ato de concessão e a prescrição quinquenal das prestações vencidas possuem objetos distintos e ressalvas jurisprudenciais."],["Regimes próprios e contagem recíproca","Os RPPS dos servidores titulares de cargos efetivos seguem o art. 40 e legislação do ente. A contagem recíproca de tempo entre regimes admite compensação financeira, observadas regras sobre certidão de tempo de contribuição e vedação de dupla contagem. A EC 103 não tornou idênticas todas as regras de aposentadoria dos entes federativos."]],"map":["INSS → requerimento e prova","CRPS → recurso administrativo","Tema 350 → requerimento ≠ esgotamento","CTC → contagem recíproca"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const socialSecurityQuestions=[{"id":20001,"s":19,"module":0,"topic":"Seguridade social: princípios e organização","difficulty":"Intermediária","q":"Qual ramo da seguridade social possui caráter contributivo e filiação obrigatória no regime geral?","a":["Assistência social","Previdência social","Saúde pública","Educação pública"],"ok":1,"e":"O art. 201 da Constituição estabelece a organização da previdência em regime geral de caráter contributivo e filiação obrigatória.","src":"CF, arts. 194 a 204","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":20002,"s":19,"module":0,"topic":"Seguridade social: princípios e organização","difficulty":"Intermediária","q":"O acesso à assistência social exige contribuições previdenciárias anteriores?","a":["Sim, sempre","Sim, por pelo menos doze meses","Não, a assistência destina-se a quem dela necessitar, conforme requisitos legais","Sim, se a pessoa nunca trabalhou"],"ok":2,"e":"O art. 203 dispõe que a assistência social será prestada a quem dela necessitar, independentemente de contribuição à seguridade social.","src":"CF, arts. 194 a 204","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":20003,"s":19,"module":1,"topic":"Segurados, dependentes, filiação e inscrição","difficulty":"Intermediária","q":"A existência de cônjuge habilitado como dependente do segurado falecido exclui, em regra, os pais da condição de beneficiários da pensão por morte?","a":["Sim, a primeira classe exclui a seguinte","Não, as classes sempre concorrem","Não, os pais têm prioridade absoluta","Somente quando houver sentença criminal"],"ok":0,"e":"O art. 16, § 1º, exclui do direito às prestações os dependentes das classes seguintes quando existe dependente de classe anterior.","src":"Lei 8.213/1991, arts. 11 a 18","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"id":20004,"s":19,"module":1,"topic":"Segurados, dependentes, filiação e inscrição","difficulty":"Intermediária","q":"Qual categoria corresponde a quem, não estando sujeito à filiação obrigatória, adere voluntariamente ao RGPS nos termos legais?","a":["Empregado doméstico","Trabalhador avulso","Segurado especial em qualquer situação","Segurado facultativo"],"ok":3,"e":"O segurado facultativo filia-se voluntariamente, desde que observadas as condições legais e regulamentares.","src":"Lei 8.213/1991, arts. 11 a 18","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"id":20005,"s":19,"module":2,"topic":"Financiamento e contribuições previdenciárias","difficulty":"Intermediária","q":"A criação de novo benefício da seguridade social exige qual condição constitucional?","a":["Autorização de empresa privada","Correspondente fonte de custeio total","Aprovação exclusiva de sindicato","Dispensa de qualquer planejamento financeiro"],"ok":1,"e":"O art. 195, § 5º, exige a correspondente fonte de custeio total para criação, majoração ou extensão de benefício ou serviço.","src":"CF, art. 195, § 5º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":20006,"s":19,"module":2,"topic":"Financiamento e contribuições previdenciárias","difficulty":"Intermediária","q":"Salário de contribuição e salário de benefício são expressões necessariamente equivalentes?","a":["Sim, em todos os casos","Sim, quando o trabalhador é empregado","Não, possuem funções jurídicas distintas","Sim, quando o benefício é temporário"],"ok":2,"e":"O salário de contribuição serve ao custeio; o salário de benefício integra a disciplina de cálculo das prestações previdenciárias.","src":"CF, art. 195; Lei 8.212/1991","url":"https://www.planalto.gov.br/ccivil_03/leis/l8212cons.htm"},{"id":20007,"s":19,"module":3,"topic":"Qualidade de segurado, período de graça e carência","difficulty":"Intermediária","q":"Qual o período de graça legal do segurado facultativo após cessação das contribuições, em regra?","a":["Doze meses","Vinte e quatro meses","Três meses","Seis meses"],"ok":3,"e":"O art. 15, VI, mantém a qualidade do segurado facultativo por até seis meses após cessação das contribuições.","src":"Lei 8.213/1991, arts. 15 e 24 a 27-A","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"id":20008,"s":19,"module":3,"topic":"Qualidade de segurado, período de graça e carência","difficulty":"Intermediária","q":"Carência e tempo de contribuição são sempre equivalentes?","a":["Não, a contagem pode obedecer a requisitos diferentes","Sim, por definição","Sim, inclusive em todo recolhimento em atraso","Sim, independentemente da categoria"],"ok":0,"e":"O art. 24 define carência como número mínimo de contribuições mensais indispensáveis à concessão, enquanto o tempo de contribuição possui disciplina própria.","src":"Lei 8.213/1991, arts. 15 e 24 a 27-A","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"id":20009,"s":19,"module":4,"topic":"Aposentadorias programadas e reforma previdenciária","difficulty":"Intermediária","q":"Na regra geral do RGPS para mulher urbana filiada após a EC 103/2019, sem condição especial, qual a idade mínima de aposentadoria?","a":["Cinquenta anos","Sessenta e dois anos","Cinquenta e cinco anos","Setenta anos"],"ok":1,"e":"O art. 19 da EC 103 estabelece 62 anos para mulheres e 65 para homens, com tempos contributivos mínimos próprios.","src":"CF, art. 201; EC 103/2019, arts. 15 a 20 e 26","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc103.htm"},{"id":20010,"s":19,"module":4,"topic":"Aposentadorias programadas e reforma previdenciária","difficulty":"Intermediária","q":"A reforma previdenciária elimina automaticamente o direito à aposentadoria de quem já preenchia integralmente os requisitos antes de sua vigência?","a":["Sim, em todos os casos","Sim, se ainda não havia protocolado requerimento","Não, o art. 3º preserva o direito adquirido","Sim, se a pessoa continuar trabalhando"],"ok":2,"e":"O art. 3º da EC 103 assegura concessão conforme os critérios anteriores a quem já havia preenchido os requisitos na data da entrada em vigor.","src":"CF, art. 201; EC 103/2019, arts. 15 a 20 e 26","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc103.htm"},{"id":20011,"s":19,"module":5,"topic":"Benefícios por incapacidade e auxílio-acidente","difficulty":"Intermediária","q":"Qual benefício possui natureza indenizatória por sequela consolidada que reduz a capacidade laboral habitual, nas condições legais?","a":["Salário-família","Pensão por morte","Auxílio-acidente","Aposentadoria programada"],"ok":2,"e":"O art. 86 estabelece o caráter indenizatório do auxílio-acidente após consolidação de lesões e redução da capacidade para o trabalho habitual.","src":"Lei 8.213/1991, arts. 42 a 47, 59 a 63 e 86","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"id":20012,"s":19,"module":5,"topic":"Benefícios por incapacidade e auxílio-acidente","difficulty":"Intermediária","q":"A doença por si só, sem demonstração de incapacidade laboral pertinente, assegura automaticamente auxílio por incapacidade temporária?","a":["Não, deve ser demonstrada a incapacidade nos termos legais","Sim, qualquer diagnóstico basta","Sim, se houver receita médica","Sim, se o segurado solicitar"],"ok":0,"e":"A concessão exige incapacidade para o trabalho ou atividade habitual, além dos demais requisitos aplicáveis.","src":"Lei 8.213/1991, arts. 42 a 47, 59 a 63 e 86","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"id":20013,"s":19,"module":6,"topic":"Aposentadoria especial, rural e da pessoa com deficiência","difficulty":"Intermediária","q":"A comprovação de deficiência para aposentadoria da LC 142 equivale necessariamente à prova de incapacidade permanente para trabalhar?","a":["Sim, em qualquer caso","Não, são conceitos e requisitos distintos","Sim, quando a deficiência for moderada","Sim, sem avaliação específica"],"ok":1,"e":"A aposentadoria da pessoa com deficiência tem requisitos próprios e não exige, por definição, incapacidade permanente para toda atividade laboral.","src":"LC 142/2013","url":"https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp142.htm"},{"id":20014,"s":19,"module":6,"topic":"Aposentadoria especial, rural e da pessoa com deficiência","difficulty":"Intermediária","q":"A conversão de tempo especial em comum é admitida pela EC 103 para períodos de atividade especial cumpridos após sua entrada em vigor?","a":["Sim, sem limitação temporal","Sim, quando houver PPP","Sim, se requerida a qualquer tempo","Não, a emenda preserva a conversão de tempo cumprido até sua entrada em vigor"],"ok":3,"e":"O art. 25, § 2º, reconhece a conversão do tempo especial cumprido até a entrada em vigor e veda a conversão do tempo posterior.","src":"EC 103/2019, art. 25, § 2º","url":"https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc103.htm"},{"id":20015,"s":19,"module":7,"topic":"Pensão por morte, auxílio-reclusão e salário-família","difficulty":"Intermediária","q":"Quem é destinatário do auxílio-reclusão nas condições legais?","a":["O estabelecimento prisional","O juiz responsável pela execução","Os dependentes do segurado elegível","O preso diretamente, em todos os casos"],"ok":2,"e":"O art. 80 destina a prestação aos dependentes do segurado que preencha as condições legais, não ao segurado recolhido à prisão.","src":"Lei 8.213/1991, arts. 65 a 70 e 74 a 80; EC 103/2019, art. 23","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"id":20016,"s":19,"module":7,"topic":"Pensão por morte, auxílio-reclusão e salário-família","difficulty":"Intermediária","q":"A pensão por morte exige, como requisito geral de carência para concessão, dezoito contribuições mensais?","a":["Não; o histórico contributivo pode influenciar a duração, mas não constitui carência geral da pensão","Sim, em todas as hipóteses","Sim, exclusivamente para filhos","Sim, mesmo quando houver acidente"],"ok":0,"e":"O art. 26, I, dispensa carência da pensão por morte. As dezoito contribuições integram regras de duração para determinados dependentes, observadas exceções.","src":"Lei 8.213/1991, arts. 65 a 70 e 74 a 80; EC 103/2019, art. 23","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"},{"id":20017,"s":19,"module":8,"topic":"Salário-maternidade e benefício assistencial (BPC)","difficulty":"Intermediária","q":"Segundo a orientação atual do INSS após as ADIs 2110 e 2111 e a IN 188/2025, há exigência de carência para salário-maternidade?","a":["Sim, dez contribuições para toda segurada","Não, mas a qualidade de segurado e os demais requisitos continuam relevantes","Sim, vinte contribuições em qualquer hipótese","Sim, exclusivamente após o parto"],"ok":1,"e":"A exigência de número mínimo de contribuições foi afastada, permanecendo as demais condições de acesso ao benefício.","src":"INSS; ADIs 2110 e 2111; IN 188/2025","url":"https://www.gov.br/inss/pt-br/direitos-e-deveres/salario-maternidade/salario-maternidade"},{"id":20018,"s":19,"module":8,"topic":"Salário-maternidade e benefício assistencial (BPC)","difficulty":"Intermediária","q":"O BPC depende de contribuições previdenciárias anteriores?","a":["Sim, pelo menos 180 contribuições","Sim, pelo menos doze contribuições","Sim, para qualquer pessoa idosa","Não, possui natureza assistencial"],"ok":3,"e":"O art. 203 da Constituição e o art. 20 da LOAS estabelecem proteção assistencial sem exigência contributiva, desde que presentes os requisitos legais.","src":"LOAS, art. 20","url":"https://www.planalto.gov.br/ccivil_03/leis/l8742.htm"},{"id":20019,"s":19,"module":9,"topic":"Processo previdenciário, revisão e regimes próprios","difficulty":"Intermediária","q":"O Tema 350 do STF exige, como regra geral para concessão inicial judicial, o esgotamento de todos os recursos administrativos?","a":["Sim, em qualquer situação","Sim, até decisão do último órgão","Não, o prévio requerimento não se confunde com esgotamento","Sim, por prazo mínimo de cinco anos"],"ok":2,"e":"A tese diferencia provocação administrativa prévia da necessidade de esgotar a via administrativa, com exceções previstas na jurisprudência.","src":"STF, Tema 350","url":"https://portal.stf.jus.br/jurisprudenciaRepercussao/tema.asp?num=350"},{"id":20020,"s":19,"module":9,"topic":"Processo previdenciário, revisão e regimes próprios","difficulty":"Intermediária","q":"Um mesmo período contributivo já utilizado para aposentadoria pode ser livremente contado novamente para outra aposentadoria em regime diverso por contagem recíproca?","a":["Não, deve ser respeitada a vedação de utilização dupla do mesmo tempo","Sim, sempre","Sim, se o segurado mudar de Município","Sim, independentemente de certificação"],"ok":0,"e":"O regime de contagem recíproca veda aproveitamento duplicado de tempo já utilizado para a concessão de aposentadoria, nos termos legais.","src":"Lei 8.213/1991, arts. 103 e 126; CF, arts. 40 e 201; STF, Tema 350","url":"https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm"}];const studyTracks={0:{modules:ethicsModules,questions:ethicsQuestions},1:{modules:constitutionalModules,questions:constitutionalQuestions},2:{modules:civilModules,questions:civilQuestions},3:{modules:processCivilModules,questions:processCivilQuestions},4:{modules:penalModules,questions:penalQuestions},5:{modules:processPenalModules,questions:processPenalQuestions},6:{modules:adminModules,questions:adminQuestions},7:{modules:taxModules,
