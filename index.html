t" onclick="openApp()">Acessar prévia</button></header><main><section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Preparação para a primeira fase da OAB</div><h1>Estude com direção.<br>Avance questão por questão.</h1><p class="muted">Descubra seus pontos fracos, organize sua rotina e acompanhe sua evolução rumo aos 40 acertos.</p><button class="btn gold" onclick="openApp()">Conhecer a plataforma →</button></div><div class="panel demo-panel"><div class="label">Exemplo de painel</div><div class="metric">36/80</div><div class="bar"><i style="width:45%"></i></div><p class="muted">Meta de treinamento: 45 acertos</p><hr style="border:0;border-top:1px solid #e3e7eb"><h3>Sua missão de hoje</h3><div class="listline">✓ Revisar Ética Profissional</div><div class="listline">○ Praticar Direito Penal</div><div class="listline">○ Refazer questões erradas</div></div></div></section><section class="section wrap"><div class="eyebrow">Como funciona</div><h2>Três passos. Uma rota clara.</h2><div class="steps">${[['01','Descubra seu nível','Resolva questões e identifique suas dificuldades.'],['02','Siga sua rota','Priorize os assuntos que precisam de atenção.'],['03','Acompanhe o progresso','Revise os erros e evolua com prática.']].map(x=>`<div class="panel"><div class="eyebrow">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join('')}</div></section><section class="section wrap"><div class="panel price"><div class="eyebrow">Oferta proposta · ainda indisponível</div><h2>Rota 40</h2><div class="metric">R$ 69,90</div><p class="muted">90 dias de acesso · pagamento único</p><p>Questões, rota de estudo, simulados e revisão.</p><p><button class="btn" onclick="openApp()">Explorar demonstração</button></p><div class="notice">Prévia de desenvolvimento. Não há cobrança, promessa de aprovação ou vínculo oficial com a OAB.</div></div></section></main><footer class="footer wrap">Rota 40 by Eduverso · Plataforma independente de estudos · Prévia não comercial</footer>`}function openApp(){go('Painel')}function isRoute(v){return menu.includes(v)||(/^Disciplina:\d+$/.test(v)&&Number(v.split(':')[1])<subjects.length)}function go(v){if(!isRoute(v))v='Painel';view=v;queue=[];if(location.hash.slice(1)!==encodeURIComponent(v))history.pushState(null,'','#'+encodeURIComponent(v));render();window.scrollTo(0,0)}function routeFromHash(){let v='';try{v=decodeURIComponent(location.hash.slice(1))}catch{}if(!v){home();return}view=isRoute(v)?v:'Painel';queue=[];render()}window.addEventListener('popstate',routeFromHash);function toggleMenu(){const s=document.querySelector('.side'),o=document.querySelector('.overlay'),b=document.getElementById('menubtn');const open=s.classList.toggle('open');o.classList.toggle('open',open);b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',open?'Fechar menu':'Abrir menu')}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.side.open'))toggleMenu()});function layout(body){const selected=view.startsWith('Disciplina:')?'Disciplinas':view;const title=view.startsWith('Disciplina:')?subjects[Number(view.split(':')[1])]:view;root.innerHTML=`<div class="mobilebar">${brand}<button id="menubtn" onclick="toggleMenu()" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">${ico('menu')}</button></div><button class="overlay" onclick="toggleMenu()" aria-label="Fechar menu" tabindex="-1"></button><div class="app"><aside class="side" id="sidebar">${brand}<nav aria-label="Menu principal">${groups.map(([g,items])=>`<div class="navgroup">${g}</div>${items.map(m=>`<button class="${m===selected?'active':''}" ${m===selected?'aria-current="page"':''} onclick="go('${m}')">${ico(m)}<span>${m}</span></button>`).join('')}`).join('')}</nav><div class="nav-foot"><button class="home" onclick="home()">${ico('Página inicial')} Página inicial</button></div></aside><main class="content"><div class="top"><div><div class="eyebrow">Sua preparação para a OAB</div><h2>${title}</h2></div><span class="preview">Versão de demonstração</span></div>${body}<div class="footer" style="margin-top:25px">Dados locais deste navegador. Conteúdo demonstrativo, sujeito a revisão jurídica.</div></main></div>`}function start(list,title){view=title;queue=list;pos=0;answered=false;sessionScore=0;question()}function question(){if(pos>=queue.length){layout(`<div class="panel"><h2>Treino concluído</h2><p class="metric">${sessionScore}/${queue.length}</p><p>Acertos nesta sessão.</p><button class="btn" onclick="go('Painel')">Voltar ao painel</button></div>`);return}const q=queue[pos];layout(`<div class="panel question"><div class="smallrow"><span class="tag">${subjects[q.s]}</span><span class="tag">${pos+1} de ${queue.length}</span></div><h3>${q.q}</h3>${q.a.map((a,i)=>`<button class="option" data-i="${i}" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="feedback"></div></div>`)}function answer(i){if(answered)return;answered=true;const q=queue[pos],correct=i===q.ok;sessionScore+=Number(correct);state.attempts.push({id:q.id,correct});save();document.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;if(k===q.ok)b.classList.add('correct');else if(k===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${correct?'Resposta correta':'Vamos revisar este ponto'}</strong><p>${q.e}</p><p>${linkSource(q)}</p></div><button class="btn" onclick="pos++;answered=false;question()">${pos+1===queue.length?'Ver resultado':'Próxima questão →'}</button>`}function train(s){const arr=s===undefined?qs:qs.filter(q=>q.s===s);if(arr.length)start(arr,'Questões')}function filterSubjects(value){const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let count=0;document.querySelectorAll('[data-subject]').forEach(el=>{const ok=norm(subjects[Number(el.dataset.subject)]).includes(norm(value));el.classList.toggle('hidden',!ok);if(ok)count++});document.getElementById('noSubjects').classList.toggle('hidden',count!==0)}function render(){const attempts=state.attempts,correct=attempts.filter(x=>x.correct).length,errors=qs.filter(q=>last()[q.id]?.correct===false);let b='';if(view==='Diagnóstico'){b=`<div class="panel"><span class="tileicon gold">${ico('Diagnóstico')}</span><h3 style="margin-top:14px">Descubra seu ponto de partida</h3><p class="muted" style="margin:8px 0 16px">Faça o diagnóstico demonstrativo para conhecer o fluxo. São quatro questões de exemplo, não uma avaliação representativa do exame.</p><button class="btn" onclick="start(qs,'Diagnóstico')">Começar diagnóstico →</button></div>`}else if(view==='Meu desempenho'){b=`<p class="muted">Acompanhe o seu histórico de treino neste navegador.</p><div class="grid"><div class="tile"><div class="label">Respostas registradas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros pendentes</div><div class="metric">${errors.length}</div></div></div><div class="panel"><h3>Desempenho por disciplina</h3><p class="muted">Somente questões respondidas são consideradas.</p>${subjects.map((s,i)=>{const a=attempts.filter(x=>qs.some(q=>q.id===x.id&&q.s===i));const p=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0;return '<div class="listline"><div class="smallrow"><strong>'+s+'</strong><span class="muted">'+(a.length?p+'%':'Sem dados')+'</span></div>'+(a.length?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}).join('')}</div>`}else if(view==='Provas anteriores'){b=`<div class="panel empty"><span class="tileicon">${ico(view)}</span><h3>Biblioteca de provas anteriores</h3><p class="muted">A estrutura está pronta para receber cadernos, gabaritos e filtros por edição. O acervo será incluído na etapa de conteúdo.</p><p><a class="link" href="https://oab.fgv.br/" target="_blank" rel="noopener noreferrer">Consultar portal oficial do exame ↗</a></p></div>`}else if(view==='Configurações'){b=`<div class="panel"><h3>Preferências de estudo</h3><div class="settingsrow"><div><strong>Tempo diário</strong><div class="muted">Usado para montar a rota de demonstração.</div></div><select aria-label="Tempo diário" onchange="state.minutes=Number(this.value);save();render()">${[15,30,45,60,90].map(n=>'<option '+(n===state.minutes?'selected':'')+'>'+n+'</option>').join('')}</select></div><div class="settingsrow"><div><strong>Meta de treinamento</strong><div class="muted">Margem sugerida acima dos 40 pontos.</div></div><strong>45/80</strong></div><div class="settingsrow"><div><strong>Conta e acesso</strong><div class="muted">Autenticação ainda não integrada.</div></div><span class="badge-mini">Em preparação</span></div></div>`}else if(view==='Ajuda'){b=`<div class="panel"><h3>Como usar o Rota 40</h3><div class="listline"><strong>1. Comece pelo diagnóstico</strong><p class="muted">Conheça o fluxo de questões e respostas.</p></div><div class="listline"><strong>2. Abra Minha rota</strong><p class="muted">Defina o tempo que tem disponível e veja as prioridades.</p></div><div class="listline"><strong>3. Revise e acompanhe</strong><p class="muted">Use o caderno de erros e o painel de desempenho.</p></div><div class="notice">Prévia não comercial. As informações ficam apenas neste navegador. Não há conta, cobrança ou mentor IA ativo.</div><button class="btn alt" onclick="go('Diagnóstico')">Começar diagnóstico</button></div>`}else if(view.startsWith('Disciplina:')){const i=Number(view.split(':')[1]),n=qs.filter(q=>q.s===i).length;b=`<button class="breadcrumb" onclick="go('Disciplinas')">${ico('Página inicial')} Todas as disciplinas</button><div class="panel"><div class="tilehead"><span class="tileicon gold">${ico('Disciplinas')}</span><div><h3>${subjects[i]}</h3><p class="muted">Trilha de preparação · primeira fase</p></div></div></div><h3 class="sectiontitle">Materiais e ferramentas</h3><div class="grid two">${['Teoria resumida','Legislação comentada','Mapas mentais','Questões comentadas','Flashcards','Revisão da disciplina'].map(m=>`<div class="tile"><div class="tilehead"><span class="tileicon">${ico(m==='Questões comentadas'?'Questões':m==='Flashcards'?'Flashcards':'Disciplinas')}</span><div class="tilecopy"><strong>${m}</strong><div class="muted">${m==='Questões comentadas'&&n?n+' questão demonstrativa':'Conteúdo em preparação'}</div></div></div>${m==='Questões comentadas'&&n?`<button class="btn alt" onclick="train(${i})">Praticar →</button>`:''}</div>`).join('')}</div>`}else if(view==='Painel'){b=`<p class="muted">Comece pelo diagnóstico e siga sua próxima missão.</p><div class="panel mission"><div class="eyebrow" style="color:#dec38c">Sua missão</div><h2>${attempts.length?'Continue sua rota':'Descubra seu ponto de partida'}</h2><p>${attempts.length?'Priorize as questões ainda não dominadas.':'Responda às quatro questões de demonstração.'}</p><button class="btn gold" onclick="start(weak().length?weak():qs,'Minha rota')">${attempts.length?'Iniciar revisão':'Iniciar diagnóstico'} →</button></div><div class="grid"><div class="tile"><div class="label">Questões respondidas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros para revisar</div><div class="metric">${errors.length}</div></div></div><h3 class="sectiontitle">Estudo e prática</h3><div class="grid two">${['Disciplinas','Questões','Simulados','Provas anteriores'].map(m=>actionTile(m)).join('')}</div><h3 class="sectiontitle">Revisão e acompanhamento</h3><div class="grid two">${['Caderno de erros','Flashcards','Meu desempenho','Mentor IA'].map(m=>actionTile(m)).join('')}</div>`}else if(view==='Minha rota'){b=`<div class="panel"><h3>Tempo disponível por dia</h3><p class="muted">A rota de demonstração prioriza erros e questões ainda não respondidas.</p><p style="margin:12px 0"><select onchange="state.minutes=Number(this.value);save();render()">${[15,30,45,60,90].map(n=>`<option ${n===state.minutes?'selected':''}>${n}</option>`).join('')}</select> minutos</p><h3>Prioridades</h3>${(weak().length?weak():qs).slice(0,Math.max(1,Math.floor(state.minutes/10))).map(q=>`<div class="listline">${subjects[q.s]} · ${last()[q.id]?'Revisar':'Praticar'}</div>`).join('')}<button class="btn" style="margin-top:15px" onclick="start((weak().length?weak():qs).slice(0,Math.max(1,Math.floor(state.minutes/10))),'Minha rota')">Começar</button></div>`}else if(view==='Disciplinas'){b=`<p class="muted">Escolha uma das 20 matérias para explorar sua trilha. O conteúdo completo será incluído na próxima etapa.</p><label class="searchbox">${ico('search')}<input aria-label="Buscar disciplina" placeholder="Buscar disciplina..." oninput="filterSubjects(this.value)"></label><div class="catalog" id="catalog">${subjects.map((s,i)=>`<button class="tile action" data-subject="${i}" onclick="go('Disciplina:${i}')"><div class="tilehead"><span class="tileicon">${ico('Disciplinas')}</span><div class="tilecopy"><strong>${s}</strong><div class="muted">Abrir trilha</div></div><span class="arrow">${ico('arrow')}</span></div></button>`).join('')}</div><p class="muted hidden" id="noSubjects">Nenhuma disciplina encontrada.</p>`}else if(view==='Questões'){b=`<div class="panel"><h3>Banco de questões — amostra</h3><p>Quatro exercícios autorais ilustrativos com fundamentação legal.</p><button class="btn" style="margin-top:12px" onclick="train()">Iniciar treino</button></div>`}else if(view==='Simulados'){b=`<div class="panel"><h3>Mini-simulado demonstrativo</h3><p class="muted">4 questões. Não representa a distribuição ou dificuldade de uma prova oficial de 80 questões.</p><button class="btn" style="margin-top:12px" onclick="start(qs,'Simulados')">Começar mini-simulado</button></div>`}else if(view==='Caderno de erros'){b=`<div class="panel"><h3>${errors.length?'Seus pontos de revisão':'Nenhum erro pendente'}</h3>${errors.length?errors.map(q=>`<div class="listline"><strong>${subjects[q.s]}</strong><p>${q.q}</p></div>`).join(''):'<p class="muted">As questões que você errar aparecerão aqui.</p>'}<button class="btn" ${errors.length?'':'disabled'} style="margin-top:12px" onclick="start(qs.filter(q=>last()[q.id]?.correct===false),'Caderno de erros')">Refazer erros</button></div>`}else if(view==='Flashcards'){const q=qs[flash%qs.length];b=`<div class="panel question"><div class="label">Cartão ${flash%qs.length+1} de ${qs.length} · ${subjects[q.s]}</div><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button><button class="btn alt" onclick="flash++;showBack=false;render()">Próximo cartão</button></div></div>`}else{b=`<div class="panel"><h3>Mentor Jurídico IA</h3><p class="notice">Integração de IA ainda não configurada. Nenhuma resposta de IA será simulada como se fosse real.</p><p class="muted">A versão planejada consultará legislação oficial, explicará questões com fontes e sinalizará incertezas. Por enquanto, você pode consultar as explicações fundamentadas do banco demonstrativo.</p><button class="btn alt" style="margin-top:14px" onclick="go('Questões')">Acessar questões comentadas</button></div>`}layout(b)}routeFromHash();
</script></body></html>
