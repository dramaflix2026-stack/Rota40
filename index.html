rajudicial → petição conjunta","Advogados distintos → obrigatórios","Dissídio coletivo → competência e pressupostos"],"extraUrl":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"}];const processLaborQuestions=[{"id":10001,"s":9,"module":0,"topic":"Organização, competência e jurisdição trabalhista","difficulty":"Intermediária","q":"Uma empregada é contratada em uma cidade, mas trabalha durante todo o contrato em outra. Sem exceção aplicável, qual local define a competência territorial?","a":["O local da prestação de serviços","Sempre o domicílio do empregador","A sede do TST","O local de assinatura do contrato"],"ok":0,"e":"O art. 651 da CLT estabelece como regra a localidade da prestação de serviços, ainda que a contratação tenha ocorrido em outro local.","src":"CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10002,"s":9,"module":0,"topic":"Organização, competência e jurisdição trabalhista","difficulty":"Intermediária","q":"Uma ação indenizatória por dano moral decorrente da relação de emprego, entre empregado e empregador, pertence em regra a qual Justiça?","a":["Justiça Eleitoral","Justiça Militar","Justiça do Trabalho","Justiça Federal comum necessariamente"],"ok":2,"e":"O art. 114, VI, da Constituição atribui à Justiça do Trabalho as ações de indenização por dano moral ou patrimonial decorrentes da relação de trabalho.","src":"CF, arts. 111 a 116; CLT, art. 651","url":"https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm"},{"id":10003,"s":9,"module":1,"topic":"Princípios, partes e representação","difficulty":"Intermediária","q":"O empregado pode interpor recurso de revista ao TST pessoalmente, invocando o jus postulandi?","a":["Sim, sem restrição","Não, o jus postulandi não alcança recursos da competência do TST","Sim, se o valor for baixo","Sim, com autorização do preposto"],"ok":1,"e":"A Súmula 425 delimita o jus postulandi às Varas e TRTs, não abrangendo recursos de competência do TST.","src":"TST, Súmula 425","url":"https://www.tst.jus.br/documents/10157/63003/Livro-Internet.pdf?version=1.13"},{"id":10004,"s":9,"module":1,"topic":"Princípios, partes e representação","difficulty":"Intermediária","q":"Nos termos do art. 843, § 3º, da CLT, o preposto deve necessariamente ser empregado da reclamada?","a":["Sim, sempre","Sim, por pelo menos um ano","Sim, salvo homologação sindical","Não"],"ok":3,"e":"A CLT expressamente dispensa que o preposto tenha vínculo empregatício com a parte reclamada, mantidas as demais exigências.","src":"CLT, arts. 763 a 769, 791 e 843; Súmula 425 do TST","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10005,"s":9,"module":2,"topic":"Atos processuais, prazos e nulidades","difficulty":"Intermediária","q":"Um prazo processual trabalhista de oito dias começa a fluir regularmente. Como são contados os dias?","a":["Dias corridos","Somente dias úteis quando autorizado","Dias úteis, conforme art. 775","Somente dias de audiência"],"ok":2,"e":"O art. 775 determina contagem em dias úteis, com exclusão do começo e inclusão do vencimento.","src":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10006,"s":9,"module":2,"topic":"Atos processuais, prazos e nulidades","difficulty":"Intermediária","q":"Qual período de suspensão do curso dos prazos processuais consta do art. 775-A?","a":["20 de dezembro a 20 de janeiro, inclusive","Todo o mês de fevereiro","15 a 31 de dezembro exclusivamente","Apenas feriados nacionais"],"ok":0,"e":"O art. 775-A fixa esse intervalo, sem confundir suspensão de prazos com férias individuais de magistrados.","src":"CLT, arts. 770 a 782 e 794 a 798","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10007,"s":9,"module":3,"topic":"Reclamação trabalhista e ritos","difficulty":"Intermediária","q":"Uma reclamação individual contra empresa privada tem valor de 30 salários mínimos. Sem exclusão especial, qual rito se aplica?","a":["Ordinário obrigatório","Sumaríssimo","Ação rescisória","Procedimento penal"],"ok":1,"e":"O art. 852-A abrange dissídios individuais de até quarenta salários mínimos, respeitadas as exclusões legais.","src":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10008,"s":9,"module":3,"topic":"Reclamação trabalhista e ritos","difficulty":"Intermediária","q":"No procedimento sumaríssimo, o reclamante pede citação por edital. Qual a regra legal?","a":["Admitida automaticamente","Obrigatória em qualquer processo","Admitida mediante simples requerimento","Não se admite citação por edital"],"ok":3,"e":"O art. 852-B, II, veda a citação por edital nesse procedimento e atribui ao autor a correta indicação do nome e endereço do reclamado.","src":"CLT, arts. 840 a 842 e 852-A a 852-I","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10009,"s":9,"module":4,"topic":"Audiência, conciliação e resposta","difficulty":"Intermediária","q":"O reclamante falta injustificadamente à audiência inicial, sem situação excepcional. Qual consequência geral do art. 844?","a":["Arquivamento da reclamação","Condenação automática do réu","Procedência integral","Conversão em recurso de revista"],"ok":0,"e":"O caput do art. 844 prevê arquivamento em caso de ausência do reclamante; outras consequências possuem disciplina própria.","src":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10010,"s":9,"module":4,"topic":"Audiência, conciliação e resposta","difficulty":"Intermediária","q":"O reclamado está ausente, mas seu advogado comparece. A contestação escrita e os documentos devem ser necessariamente recusados?","a":["Sim, em todos os casos","Sim, se houver pedido de horas extras","Não, o § 5º do art. 844 prevê seu recebimento","Sim, porque a defesa técnica é proibida"],"ok":2,"e":"O art. 844, § 5º, determina o recebimento da contestação e dos documentos quando o advogado comparece, ainda que ausente o reclamado. Isso não elimina automaticamente os efeitos da ausência.","src":"CLT, arts. 843 a 850","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10011,"s":9,"module":5,"topic":"Provas, ônus probatório e sentença","difficulty":"Intermediária","q":"O empregador alega ter quitado verba cuja existência é incontroversa. Quem deve provar o pagamento segundo a distribuição geral?","a":["O juiz","O reclamante em qualquer caso","O sindicato","O reclamado"],"ok":3,"e":"O pagamento é fato extintivo, cujo ônus recai em regra sobre o reclamado pelo art. 818, II.","src":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10012,"s":9,"module":5,"topic":"Provas, ônus probatório e sentença","difficulty":"Intermediária","q":"Qual o limite geral de testemunhas por parte no procedimento sumaríssimo?","a":["Duas","Três","Seis","Dez"],"ok":0,"e":"O art. 852-H, § 2º, limita a duas testemunhas por parte no sumaríssimo.","src":"CLT, arts. 818 a 830, 832 e 852-H","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10013,"s":9,"module":6,"topic":"Custas, gratuidade e honorários","difficulty":"Intermediária","q":"Qual faixa percentual o art. 791-A prevê para honorários advocatícios sucumbenciais?","a":["Um a dois por cento","Cinco a quinze por cento","Vinte a cinquenta por cento","Percentual fixo de trinta por cento"],"ok":1,"e":"O caput do art. 791-A estabelece mínimo de cinco e máximo de quinze por cento, calculados segundo as bases legais.","src":"CLT, arts. 789 a 791-A; STF, ADI 5766","url":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del5452compilado.htm"},{"id":10014,"s":9,"module":6,"topic":"Custas, gratuidade e honorários","difficulty":"Intermediária","q":"O simples recebimento de créditos judiciais por ben  const type=view.split(':')[1],i=Number(view.split(':')[2]),back=ethicsBack();
 if(type==='modulo'){const m=ethicsModules[i];return back+'<div class="panel"><div class="eyebrow">MÓDULO '+String(i+1).padStart(2,'0')+' / 10</div><h2>'+m.t+'</h2><p class="muted">'+m.ref+'</p></div>'+m.lessons.map(([t,p],j)=>'<article class="panel ethics-lesson"><div class="label">TÓPICO '+(j+1)+'</div><h3>'+t+'</h3><p>'+p+'</p></article>').join('')+'<div class="panel ethics-lesson"><h3>Mapa de revisão</h3><div class="ethics-map">'+m.map.map(x=>'<div>'+x+'</div>').join('')+'</div><a class="link" target="_blank" rel="noopener noreferrer" href="'+m.url+'">Consultar fonte oficial: '+m.ref+'</a>'+(m.extraUrl?'<p><a class="link" target="_blank" rel="noopener noreferrer" href="'+m.extraUrl+'">Provimento 205/2021</a></p>':'')+'</div><div class="sessiontools"><button class="btn gold" onclick="markEthics('+i+')">'+(state.completedEthics[i]?'Desmarcar conclusão':'Marcar como concluído')+'</button><button class="btn" onclick="ethicsPractice('+i+')">Praticar 2 questões</button>'+(i<9?'<button class="btn alt" onclick="go(\'Etica:modulo:'+(i+1)+'\')">Próximo módulo →</button>':'')+'</div>'}
 if(type==='lei')return back+'<div class="panel"><h2>Legislação comentada</h2><p class="muted">Guia de leitura por tema. Consulte sempre a versão oficial e os precedentes aplicáveis.</p></div>'+ethicsModules.map(m=>'<article class="panel ethics-lesson"><h3>'+m.t+'</h3><p>'+m.lessons[0][1]+'</p><a class="link" href="'+m.url+'" target="_blank" rel="noopener noreferrer">'+m.ref+'</a>'+(m.extraUrl?'<p><a class="link" href="'+m.extraUrl+'" target="_blank" rel="noopener noreferrer">Provimento 205/2021</a></p>':'')+'</article>').join('');
 if(type==='mapas'||type==='revisao')return back+'<div class="panel"><h2>'+(type==='mapas'?'Mapas mentais':'Revisão estratégica')+'</h2><p class="muted">Organize as regras e diferencie os conceitos.</p></div>'+ethicsModules.map((m,j)=>'<div class="panel ethics-lesson"><h3>'+m.t+'</h3><div class="ethics-map">'+m.map.map(x=>'<div>'+x+'</div>').join('')+'</div><button class="btn alt" onclick="ethicsPractice('+j+')">Revisar com questões</button></div>').join('');
 if(type==='simulado')return back+'<div class="panel"><h2>Simulado temático de Ética</h2><p class="muted">10 questões autorais · 30 minutos · uma por módulo · correção ao final. Não equivale à prova oficial.</p><button class="btn gold" style="margin-top:15px" onclick="ethicsSim()">Começar simulado</button></div>';
 if(type==='flash'){const list=ethicsFlashQueue();const q=list.find(q=>q.id===ethicsFlashId)||list[0];ethicsFlashId=q.id;const due=list.filter(q=>!state.reviews[q.id]||state.reviews[q.id].due<=Date.now()).length;return back+'<div class="panel question"><div class="label">FLASHCARDS DE ÉTICA · '+due+' disponíveis para revisão</div><p class="muted">'+q.topic+'</p><h3 style="margin:20px 0">'+(showBack?q.a[q.ok]:q.q)+'</h3>'+(showBack?'<p>'+q.e+'</p><p>'+linkSource(q)+'</p>':'')+'<div class="sessiontools"><button class="btn" onclick="showBack=!showBack;render()">'+(showBack?'Mostrar pergunta':'Revelar resposta')+'</button>'+(showBack?'<button class="btn alt" onclick="ethicsFlashMove(false)">Revisar em 10 min</button><button class="btn gold" onclick="ethicsFlashMove(true)">Já sei</button>':'<button class="btn alt" onclick="ethicsFlashNext()">Próximo cartão</button>')+'</div></div>'}
 return back;
}
let trackFlashId=null;
function trackIndex(){return Number(view.split(':')[1])}
function trackRoute(k,i,t){return `Trilha:${k}:${t==='modulo'?'modulo:'+i:t}`}
function trackDone(k){return k===0?state.completedEthics:(state.completedTracks[k]||(state.completedTracks[k]={}))}
function trackBack(k){return `<button class="breadcrumb" onclick="go('Disciplina:${k}')">${ico('Página inicial')} ${subjects[k]}</button>`}
function trackPractice(k,i){start(studyTracks[k].questions.filter(q=>q.module===i),'Questões')}
function trackSim(k){start(studyTracks[k].questions.filter((q,i)=>i%2===1),'Simulados')}
function trackMark(k,i){const d=trackDone(k);d[i]=!d[i];save();render()}
function trackPage(k){
 const {modules,questions}=studyTracks[k], d=trackDone(k), done=modules.filter((m,i)=>d[i]).length, n=modules.length;
 const tools=[['Legislação comentada','lei','Disciplinas'],['Mapas mentais','mapas','Minha rota'],['Revisão estratégica','revisao','Caderno de erros'],['Flashcards','flash','Flashcards'],['Simulado da disciplina','simulado','Simulados'],['Mentor Jurídico IA','mentor','Mentor IA']];
 return `<button class="breadcrumb" onclick="go('Disciplinas')">${ico('Página inicial')} Todas as disciplinas</button><div class="panel mission"><div class="eyebrow" style="color:#dec38c">TRILHA ${String(k+1).padStart(2,'0')} · OAB</div><h2>${subjects[k]}</h2><p>Estude os conceitos, pratique casos e revise as regras.</p><p>${done} de ${n} módulos concluídos</p><div class="progressline"><i style="width:${done/n*100}%"></i></div><button class="btn gold" onclick="go('${trackRoute(k,Math.max(0,modules.findIndex((m,i)=>!d[i])),'modulo')}')">${done===n?'Revisar conteúdo':'Continuar estudo'} →</button></div><div class="grid">${[['Módulos',n],['Questões autorais',questions.length],['Flashcards',questions.length]].map(([t,v])=>`<div class="tile"><div class="label">${t}</div><div class="metric">${v}</div></div>`).join('')}</div><div class="notice">Primeiro lote autoral. Fontes oficiais indicadas; revisão jurídica especializada pendente. Questões não oficiais da FGV.</div><h3 class="sectiontitle">Módulos de estudo</h3><div class="ethics-modules">${modules.map((m,i)=>`<button class="tile action ethics-module" onclick="go('${trackRoute(k,i,'modulo')}')"><span class="tileicon gold">${String(i+1).padStart(2,'0')}</span><span class="tilecopy"><strong>${m.t}</strong><span class="muted ethics-module-note">${d[i]?'Concluído':m.lessons.length+' tópicos · '+questions.filter(q=>q.module===i).length+' questões'}</span></span><span class="arrow">${ico('arrow')}</span></button>`).join('')}</div><h3 class="sectiontitle">Ferramentas da disciplina</h3><div class="grid two">${tools.map(([n,t,ic])=>`<button class="tile action" onclick="go('${t==='mentor'?'Mentor IA':trackRoute(k,0,t)}')"><div class="tilehead"><span class="tileicon">${ico(ic)}</span><div class="tilecopy"><strong>${n}</strong><div class="muted">${t==='mentor'?'Em desenvolvimento':'Abrir ferramenta'}</div></div></div></button>`).join('')}</div><button class="btn" onclick="train(${k})">Praticar todas as questões</button>`;
}
function trackMap(m){return `<div class="ethics-map">${m.map.map(x=>`<div>${x}</div>`).join('')}</div>`}
function trackSource(m){return `<a class="link" target="_blank" rel="noopener noreferrer" href="${m.url}">${m.ref}</a>${m.extraUrl?`<p><a class="link" target="_blank" rel="noopener noreferrer" href="${m.extraUrl}">Fonte complementar</a></p>`:''}`}
function trackFlashQueue(k){return [...studyTracks[k].questions].sort((a,b)=>(state.reviews[a.id]?.due||0)-(state.reviews[b.id]?.due||0)||a.id-b.id)}
function trackFlashMove(k,known){const q=studyTracks[k].questions.find(q=>q.id===trackFlashId);if(!q)return;const prev=state.reviews[q.id]||{interval:0};const interval=known?Math.min(30,Math.max(1,prev.interval*2)):0;state.reviews[q.id]={interval,due:Date.now()+(known?interval*86400000:600000)};save();trackFlashId=null;showBack=false;render()}
function trackFlashNext(k){const l=trackFlashQueue(k),i=l.findIndex(q=>q.id===trackFlashId);trackFlashId=l[(i+1)%l.length].id;showBack=false;render()}
function trackScreen(k){
 const parts=view.split(':'), type=parts[2], i=Number(parts[3]), {modules,questions}=studyTracks[k], d=trackDone(k), back=trackBack(k);
 if(type==='modulo'){const m=modules[i];return back+`<div class="panel"><div class="eyebrow">MÓDULO ${String(i+1).padStart(2,'0')} / ${modules.length}</div><h2>${m.t}</h2><p class="muted">${m.ref}</p></div>${m.lessons.map(([t,p],j)=>`<article class="panel ethics-lesson"><div class="label">TÓPICO ${j+1}</div><h3>${t}</h3><p>${p}</p></article>`).join('')}<div class="panel ethics-lesson"><h3>Mapa de revisão</h3>${trackMap(m)}${trackSource(m)}</div><div class="sessiontools"><button class="btn gold" onclick="trackMark(${k},${i})">${d[i]?'Desmarcar conclusão':'Marcar como concluído'}</button><button class="btn" onclick="trackPractice(${k},${i})">Praticar ${questions.filter(q=>q.module===i).length} questões</button>${i<modules.length-1?`<button class="btn alt" onclick="go('${trackRoute(k,i+1,'modulo')}')">Próximo módulo →</button>`:''}</div>`}
 if(type==='lei')return back+`<div class="panel"><h2>Legislação comentada</h2><p class="muted">Guia de estudo: confira a redação oficial e a jurisprudência vigente.</p></div>${modules.map(m=>`<article class="panel ethics-lesson"><h3>${m.t}</h3>${m.lessons.map(([t,p])=>`<p><strong>${t}.</strong> ${p}</p>`).join('')}${trackSource(m)}</article>`).join('')}`;
 if(type==='mapas'||type==='revisao')return back+`<div class="panel"><h2>${type==='mapas'?'Mapas mentais':'Revisão estratégica'}</h2><p class="muted">Organize os conceitos e pratique a recuperação ativa.</p></div>${modules.map((m,j)=>`<div class="panel ethics-lesson"><h3>${m.t}</h3>${trackMap(m)}<button class="btn alt" onclick="trackPractice(${k},${j})">Revisar com questões</button></div>`).join('')}`;
 if(type==='simulado')return back+`<div class="panel"><h2>Simulado temático — ${subjects[k]}</h2><p class="muted">${modules.length} questões autorais · ${modules.length*3} minutos · uma por módulo · correção ao final. Não equivale à prova oficial.</p><button class="btn gold" style="margin-top:15px" onclick="trackSim(${k})">Começar simulado</button></div>`;
 if(type==='flash'){const list=trackFlashQueue(k),q=list.find(q=>q.id===trackFlashId)||list[0];trackFlashId=q.id;const due=list.filter(q=>!state.reviews[q.id]||state.reviews[q.id].due<=Date.now()).length;return back+`<div class="panel question"><div class="label">FLASHCARDS · ${due} disponíveis para revisão</div><p class="muted">${q.topic}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div class="sessiontools"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="trackFlashMove(${k},false)">Revisar em 10 min</button><button class="btn gold" onclick="trackFlashMove(${k},true)">Já sei</button>`:`<button class="btn alt" onclick="trackFlashNext(${k})">Próximo cartão</button>`}</div></div>`}
 return back;
}
function render(){const attempts=state.attempts,correct=attempts.filter(x=>x.correct).length,errors=qs.filter(q=>last()[q.id]?.correct===false);let b='';if(view==='Diagnóstico'){b=`<div class="panel"><span class="tileicon gold">${ico('Diagnóstico')}</span><h3 style="margin-top:14px">Descubra seu ponto de partida</h3><p class="muted" style="margin:8px 0 16px">Faça o diagnóstico demonstrativo para conhecer o fluxo. São quatro questões de exemplo, não uma avaliação representativa do exame.</p><button class="btn" onclick="start(sampleQuestions,'Diagnóstico')">Começar diagnóstico →</button></div>`}else if(view==='Meu desempenho'){b=`<p class="muted">Acompanhe o seu histórico de treino neste navegador.</p><div class="grid"><div class="tile"><div class="label">Respostas registradas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros pendentes</div><div class="metric">${errors.length}</div></div></div><div class="panel"><h3>Desempenho por disciplina</h3><p class="muted">Somente questões respondidas são consideradas.</p>${subjects.map((s,i)=>{const a=attempts.filter(x=>qs.some(q=>q.id===x.id&&q.s===i));const p=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):0;return '<div class="listline"><div class="smallrow"><strong>'+s+'</strong><span class="muted">'+(a.length?p+'%':'Sem dados')+'</span></div>'+(a.length?'<div class="bar"><i style="width:'+p+'%"></i></div>':'')+'</div>'}).join('')}</div>`}else if(view==='Provas anteriores'){b=`<div class="panel empty"><span class="tileicon">${ico(view)}</span><h3>Biblioteca de provas anteriores</h3><p class="muted">A estrutura está pronta para receber cadernos, gabaritos e filtros por edição. O acervo será incluído na etapa de conteúdo.</p><p><a class="link" href="https://oab.fgv.br/" target="_blank" rel="noopener noreferrer">Consultar portal oficial do exame ↗</a></p></div>`}else if(view==='Configurações'){b=`<div class="panel"><h3>${state.profileReady?'Preferências de estudo':'Vamos configurar sua preparação'}</h3><p class="muted" style="margin:8px 0 18px">Informe o tempo diário e a data da prova. Os dados ficam neste navegador.</p>${profileForm()}<div class="settingsrow"><strong>Meta de treinamento sugerida</strong><strong>45/80</strong></div><div class="settingsrow"><div><strong>Conta e sincronização</strong><div class="muted">Autenticação ainda não integrada.</div></div><span class="badge-mini">Em preparação</span></div></div>`}else if(view==='Ajuda'){b=`<div class="panel"><h3>Como usar o Rota 40</h3><div class="listline"><strong>1. Comece pelo diagnóstico</strong><p class="muted">Conheça o fluxo de questões e respostas.</p></div><div class="listline"><strong>2. Abra Minha rota</strong><p class="muted">Defina o tempo que tem disponível e veja as prioridades.</p></div><div class="listline"><strong>3. Revise e acompanhe</strong><p class="muted">Use o caderno de erros e o painel de desempenho.</p></div><div class="notice">Prévia não comercial. As informações ficam apenas neste navegador. Não há conta, cobrança ou mentor IA ativo.</div><button class="btn alt" onclick="go('Diagnóstico')">Começar diagnóstico</button></div>`}else if(view.startsWith('Etica:')){b=ethicsScreen()}else if(view.startsWith('Trilha:')){b=trackScreen(trackIndex())}else if(view.startsWith('Disciplina:')&&studyTracks[Number(view.split(':')[1])]){b=trackPage(Number(view.split(':')[1]))}else if(view.startsWith('Disciplina:')){const i=Number(view.split(':')[1]),n=qs.filter(q=>q.s===i).length;b=`<button class="breadcrumb" onclick="go('Disciplinas')">${ico('Página inicial')} Todas as disciplinas</button><div class="panel"><div class="tilehead"><span class="tileicon gold">${ico('Disciplinas')}</span><div><h3>${subjects[i]}</h3><p class="muted">Trilha de preparação · primeira fase</p></div></div></div><h3 class="sectiontitle">Materiais e ferramentas</h3><div class="grid two">${['Teoria resumida','Legislação comentada','Mapas mentais','Questões comentadas','Flashcards','Revisão da disciplina'].map(m=>`<div class="tile"><div class="tilehead"><span class="tileicon">${ico(m==='Questões comentadas'?'Questões':m==='Flashcards'?'Flashcards':'Disciplinas')}</span><div class="tilecopy"><strong>${m}</strong><div class="muted">${m==='Questões comentadas'&&n?n+' questão demonstrativa':'Conteúdo em preparação'}</div></div></div>${m==='Questões comentadas'&&n?`<button class="btn alt" onclick="train(${i})">Praticar →</button>`:''}</div>`).join('')}</div>`}else if(view==='Painel'){b=`<p class="muted">Comece pelo diagnóstico e siga sua próxima missão.</p>${state.session?`<div class="panel" style="margin:15px 0"><h3>Treino em andamento</h3><p class="muted">${state.session.title} · questão ${Math.min(state.session.pos+1,state.session.ids.length)} de ${state.session.ids.length}</p><button class="btn" style="margin-top:10px" onclick="resumeSession()">Continuar treino →</button></div>`:""}<div class="panel mission"><div class="eyebrow" style="color:#dec38c">Sua missão</div><h2>${attempts.length?'Continue sua rota':'Descubra seu ponto de partida'}</h2><p>${attempts.length?'Priorize as questões ainda não dominadas.':'Responda às quatro questões de demonstração.'}</p><button class="btn gold" onclick="${attempts.length?"go('Minha rota')":"go('Diagnóstico')"}">${attempts.length?'Iniciar revisão':'Iniciar diagnóstico'} →</button></div><div class="grid"><div class="tile"><div class="label">Questões respondidas</div><div class="metric">${attempts.length}</div></div><div class="tile"><div class="label">Taxa de acerto</div><div class="metric">${attempts.length?Math.round(correct/attempts.length*100)+'%':'—'}</div></div><div class="tile"><div class="label">Erros para revisar</div><div class="metric">${errors.length}</div></div></div><h3 class="sectiontitle">Estudo e prática</h3><div class="grid two">${['Disciplinas','Questões','Simulados','Provas anteriores'].map(m=>actionTile(m)).join('')}</div><h3 class="sectiontitle">Revisão e acompanhamento</h3><div class="grid two">${['Caderno de erros','Flashcards','Meu desempenho','Mentor IA'].map(m=>actionTile(m)).join('')}</div>`}else if(view==='Minha rota'){const d=daysLeft(),plan=routePlan();b=`<div class="panel mission"><div class="eyebrow" style="color:#dec38c">${d!==null&&d>=0&&d<=14?'Reta final':'Sua preparação diária'}</div><h2>${state.minutes} minutos para avançar</h2><p>${d===null?'Defina a data da prova nas configurações.':d<0?'Atualize a data da prova.':d===0?'Hoje é a data de prova informada.':d+' dias até a data informada.'} Rota baseada em regras e no banco disponível; cobertura parcial das matérias da OAB.</p><button class="btn gold" onclick="start(routePlan(),'Minha rota')">Começar missão →</button></div><div class="panel"><div class="smallrow"><h3>Prioridades de hoje</h3><button class="btn alt" onclick="go('Configurações')">Ajustar perfil</button></div>${plan.map(q=>`<div class="listline"><div class="smallrow"><strong>${subjects[q.s]}</strong><span class="muted">${last()[q.id]?.correct===false?'Refazer erro':!last()[q.id]?'Praticar':'Consolidar'}</span></div></div>`).join('')}<p class="muted" style="margin-top:14px">A incidência histórica das provas será integrada após curadoria do acervo.</p></div>`}else if(view==='Disciplinas'){b=`<p class="muted">Escolha uma das 20 matérias para explorar sua trilha. ${Object.keys(studyTracks).length} disciplinas já têm módulos de estudo. As demais estão em preparação.</p><label class="searchbox">${ico('search')}<input aria-label="Buscar disciplina" placeholder="Buscar disciplina..." oninput="filterSubjects(this.value)"></label><div class="catalog" id="catalog">${subjects.map((s,i)=>`<button class="tile action" data-subject="${i}" onclick="go('Disciplina:${i}')"><div class="tilehead"><span class="tileicon">${ico('Disciplinas')}</span><div class="tilecopy"><strong>${s}</strong><div class="muted">${studyTracks[i]?studyTracks[i].modules.length+' módulos disponíveis':'Em preparação'}</div></div><span class="arrow">${ico('arrow')}</span></div></button>`).join('')}</div><p class="muted hidden" id="noSubjects">Nenhuma disciplina encontrada.</p>`}else if(view==='Questões'){b=`<div class="panel"><h3>Banco de questões — amostra</h3><p>${qs.length} exercícios autorais com fundamentação legal. Conteúdo inicial disponível nas trilhas de ${Object.keys(studyTracks).map(i=>subjects[Number(i)]).join(', ')}.</p><div class="filterrow"><select id="questionSubject" aria-label="Filtrar matéria"><option value="">Todas as matérias</option>${subjects.map((s,i)=>`<option value="${i}" ${qs.some(q=>q.s===i)?"":"disabled"}>${s}</option>`).join("")}</select><button class="btn" onclick="trainSelected()">Iniciar treino</button></div></div>`}else if(view==='Simulados'){b=`<div class="panel"><h3>Mini-simulado demonstrativo</h3><p class="muted">4 questões · 12 minutos · gabarito ao final. Não representa a distribuição ou dificuldade de uma prova oficial de 80 questões.</p><button class="btn" style="margin-top:12px" onclick="start(sampleQuestions,'Simulados')">Começar mini-simulado</button></div>`}else if(view==='Caderno de erros'){b=`<div class="panel"><h3>${errors.length?'Seus pontos de revisão':'Nenhum erro pendente'}</h3>${errors.length?errors.map(q=>`<div class="listline"><strong>${subjects[q.s]}</strong><p>${q.q}</p></div>`).join(''):'<p class="muted">As questões que você errar aparecerão aqui.</p>'}<button class="btn" ${errors.length?'':'disabled'} style="margin-top:12px" onclick="start(qs.filter(q=>last()[q.id]?.correct===false),'Caderno de erros')">Refazer erros</button></div>`}else if(view==='Flashcards'){const q=qs[flash%qs.length];b=`<div class="panel question"><div class="label">Cartão ${flash%qs.length+1} de ${qs.length} · ${subjects[q.s]}</div><p class="muted">${state.reviews[q.id]?state.reviews[q.id].due<=Date.now()?"Revisão disponível":"Próxima revisão: "+new Date(state.reviews[q.id].due).toLocaleString("pt-BR"):"Ainda não revisado"}</p><h3 style="margin:20px 0">${showBack?q.a[q.ok]:q.q}</h3>${showBack?`<p>${q.e}</p><p>${linkSource(q)}</p>`:''}<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="showBack=!showBack;render()">${showBack?'Mostrar pergunta':'Revelar resposta'}</button>${showBack?`<button class="btn alt" onclick="reviewCard(false)">Revisar em 10 min</button><button class="btn alt" onclick="reviewCard(true)">Já sei · agendar revisão</button>`:`<button class="btn alt" onclick="flash++;showBack=false;render()">Próximo cartão</button>`}</div></div>`}else{b=`<div class="panel"><h3>Mentor Jurídico IA</h3><p class="notice">Integração de IA ainda não configurada. Nenhuma resposta de IA será simulada como se fosse real.</p><p class="muted">A versão planejada consultará legislação oficial, explicará questões com fontes e sinalizará incertezas. Por enquanto, você pode consultar as explicações fundamentadas do banco demonstrativo.</p><button class="btn alt" style="margin-top:14px" onclick="go('Questões')">Acessar questões comentadas</button></div>`}layout(b)}routeFromHash();
</script></body></html>
